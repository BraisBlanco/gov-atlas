# Controlled vocabulary of policy areas.
#
# Ministry names are not comparable across countries — "Ministerio de Fomento" and
# "Ministry of Housing, Communities and Local Government" cover overlapping ground
# under unrecognisably different labels. Tagging each ministry with areas from this
# fixed list is what makes cross-country questions answerable: which countries have a
# dedicated climate ministry, where digital policy sits, whether equality has its own
# department.
#
# Rules for curators:
#   - Tag every area a ministry has *primary* responsibility for, in descending order
#     of prominence in its official name. Do not tag areas it merely touches.
#   - Never invent an id. If a portfolio genuinely has no home here, propose the
#     addition in your hand-off notes rather than adding it silently — a new id
#     changes every country's comparison row.
#   - `group` only controls how areas are clustered in charts.

