      quoted verbatim rather than a press sentence because CBS's news release of 2 February
      2026 gives only the provisional rounded figure ("In 2025 groeide de bevolking met 87
      duizend mensen naar 18,13 miljoen"), and the monthly table 83474NED still carries the
      provisional 18 131 238 for the same date. Tier 3 rather than tier 1: this is a
      statistical estimate from the population register, not a legal instrument. The
      region "Nederland" (code NL01) in this table covers the European Netherlands; it
      contains no entry for Bonaire, Sint Eustatius or Saba, which CBS publishes
      separately as Caribisch Nederland.
