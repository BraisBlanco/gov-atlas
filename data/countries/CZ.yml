# Czechia — country metadata.
#
# See docs/DATA-CONTRACT.md. The population figure is the Czech Statistical Office's own
# end-of-year balance, which is the most precise official resident total the office
# publishes; the quarterly releases round to thousands.

iso2: CZ
iso3: CZE

name_en: Czechia
name_es: Chequia
name_original: Česko
official_name_original: Česká republika

continent: europe
region: central_europe
eu_member_since: 2004-05-01
government_system: parliamentary_republic
official_languages: [cs]

# Population carries its own citation because the country pages publish it as a figure in
# its own right, not as a convenience constant.
population:
  value: 10915839
  year: 2025
  source:
    id: csu-pohyb-obyvatelstva-2025
    tier: 3
    type: statistical_office
    publisher: Český statistický úřad
    title: Pohyb obyvatelstva - rok 2025 (Rychlá informace, kód 130080-25)
    url: https://csu.gov.cz/rychle-informace/pohyb-obyvatelstva-rok-2025
    archive_url: https://web.archive.org/web/20260713075151/https://csu.gov.cz/rychle-informace/pohyb-obyvatelstva-rok-2025
    lang: cs
    published: 2026-03-31
    accessed: 2026-07-28
    quote: >-
      K 31. prosinci 2025 mělo Česko 10 915 839 obyvatel, o 6,3 tisíce více než k 1. lednu
      2025.
    note: >-
      The end-of-2025 population balance, which is the same instant as 1 January 2026 and
      the most recent exact figure the ČSÚ publishes. Czechia has no annual census, so the
      resident total is a statistical balance rather than a legal act, which is why this is
      tier 3 rather than tier 1 — the same treatment Spain's INE figure gets. The office's
      later release for the first quarter of 2026 (published 12 June 2026) puts the
      population at 10.896 million on 31 March 2026 but rounds to thousands, so the exact
      31 December 2025 figure is preferred here; note that it therefore records a
      population that has since fallen. The reference year is given as 2025 because that is
      the reference date the release itself states. All 2026 ČSÚ figures are still marked
      preliminary ("Veškeré údaje za rok 2026 jsou předběžné").
