    quote: >-
      Prema procjeni stanovništva sredinom 2024. Republika Hrvatska imala je 3 866 233
      stanovnika, od toga 1 882 564 muškarca i 1 983 669 žena.
    note: >-
      Croatia's most recent published population estimate as at the access date. The figure
      is the mid-year estimate for 2024, not a census count and not an end-of-year stock:
      the last census was in 2021 and the estimate for 2025 (STAN-2026-3-1) was still
      scheduled for 4 September 2026, five weeks after this file was written, so no 2025 or
      2026 figure exists to cite. Tier 3 rather than tier 1 because a statistical release is
      not a legal instrument; the Državni zavod za statistiku is nonetheless the official
      producer of the figure, and it is recorded as an uncounted entity in the cabinet file
      because the same Act that lists Croatia's ministries lists the Bureau alongside them.
