# Slovakia — country metadata.
#
# See docs/DATA-CONTRACT.md. The cabinet, its entities and its citations live in
# data/cabinets/SK-2023-10-25.yml; this file carries only country-level metadata.
#
# Perimeter: this record describes the central government of the Slovak Republic. The eight
# self-governing regions (samosprávne kraje) and the ~2,900 municipalities are subnational and
# out of scope; they appear in the cabinet file only as the subject matter of a ministry. The
# population figure below covers the whole country.

iso2: SK
