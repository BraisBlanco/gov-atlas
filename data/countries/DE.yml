    title: Bevölkerung nach Nationalität und Geschlecht 2025 (Quartalszahlen)
    url: https://www.destatis.de/DE/Themen/Gesellschaft-Umwelt/Bevoelkerung/Bevoelkerungsstand/Tabellen/zensus-geschlecht-staatsangehoerigkeit-2025.html
    archive_url: https://web.archive.org/web/20260727183005/https://www.destatis.de/DE/Themen/Gesellschaft-Umwelt/Bevoelkerung/Bevoelkerungsstand/Tabellen/zensus-geschlecht-staatsangehoerigkeit-2025.html
    lang: de
    published: 2026-06-16
    accessed: 2026-07-27
    quote: |-
      Bevölkerung nach Nationalität und Geschlecht 2025 (Quartalszahlen)
      Bevölkerungsstand	31.03.2025	30.06.2025	30.09.2025	31.12.2025
      Insgesamt	83 517 030	83 491 249	83 497 147	83 467 117
      Quelle: Ergebnisse der Bevölkerungsfortschreibung auf Grundlage des Zensus 2022.
    note: >-
      Official resident population of Germany on 31 December 2025: 83,467,117. The quote
      transcribes the table's caption, its column-header row, its "Insgesamt" row and its
      source line; the amount columns for the other reporting dates are kept so the cited
      cell can be located, and the soft hyphens Destatis inserts inside
      "Bevölkerungs-stand" and "Bevölkerungs-fortschreibung" for line breaking are not
      reproduced. Basis is the Bevölkerungsfortschreibung on the Zensus 2022, page status
      "Stand 16. Juni 2026". Destatis's own press release of 16 June 2026 reports the same
      figure rounded ("Zum Jahresende 2025 lebten 83,5 Millionen Menschen in
      Deutschland"), so this table is cited instead in order to publish an exact integer
      rather than a rounded one. Tier 3 rather than tier 1: Germany's resident total
      between censuses is a statistical estimate, not a figure fixed by a legal
      instrument. A more recent quarterly figure exists (83.4 million at 31 March 2026)
      but Destatis publishes it only rounded, so the last exact year-end value is used.
