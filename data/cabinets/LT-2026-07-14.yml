    note:
      en: >-
        The widest remit in the Lithuanian cabinet, and the reason several tags a reader
        might look for elsewhere are here: Lithuania has no ministry of equality, none of
        the family and none of youth, and all three areas are departments of this ministry,
        as are disability policy and social insurance. Tagged in the order the statutory
        name gives, social security before labour. Its current holder, Inga Ruginienė, was
        prime minister until this cabinet was formed, which changes nothing structurally.
      es: >-
        La cartera más amplia del gabinete lituano, y la razón de que aquí estén varias
        etiquetas que un lector buscaría en otra parte: Lituania no tiene ministerio de
        igualdad, ni de familia, ni de juventud, y las tres áreas son departamentos de este
        ministerio, igual que la política de discapacidad y los seguros sociales. Se etiqueta
        en el orden que da el nombre legal, seguridad social antes que trabajo. Su titular
        actual, Inga Ruginienė, fue primera ministra hasta la formación de este gabinete, lo
        que no cambia nada estructuralmente.

  - id: LT-2026-susisiekimo-ministerija
