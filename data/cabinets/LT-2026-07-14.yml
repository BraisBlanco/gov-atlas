    has_cabinet_seat: true
    head_count: 1
    policy_areas: [interior, civil_protection, migration, public_administration, territorial_administration]
    counts_as_ministry: true
    url: https://vrm.lrv.lt/
    sources: [vyriausybes-istatymas-i-464, lrv-xxi-vyriausybe-prisieke, lrv-ministerijos-en, lrt-seimas-pritare-programai]
    note:
      en: >-
        The Lithuanian interior ministry is wider than the name suggests and no other
        department competes for these areas: police and public order, the fire and rescue
        service, the migration department that handles residence and asylum, the civil
        service and public administration, and local self-government and regional policy.
        Lithuania has no migration ministry, no civil protection ministry and no ministry of
        public administration, which is why five tags land on one entity. Local government
        appears here as a portfolio; Lithuania's municipalities are themselves out of scope
        as subnational government.
      es: >-
        El ministerio del Interior lituano es más amplio de lo que sugiere su nombre y ningún
        otro departamento le disputa estas áreas: policía y orden público, servicio de
        bomberos y rescate, el departamento de migración que tramita residencia y asilo, la
        función pública y la administración pública, y el autogobierno local y la política
        regional. Lituania no tiene ministerio de migración, ni de protección civil, ni de
        administración pública, y por eso cinco etiquetas caen en una sola entidad. El
        gobierno local figura aquí como cartera; los municipios lituanos quedan fuera de
        alcance como gobierno subnacional.

  - id: LT-2026-zemes-ukio-ministerija
    order: 14
    name_original: Žemės ūkio ministerija
    abbreviation_original: ŽŪM
    name_en: Ministry of Agriculture
    name_es: Ministerio de Agricultura
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Žemės ūkio ministras
    head_title_en: Minister of Agriculture
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [agriculture, rural_development, food_safety, fisheries]
    counts_as_ministry: true
    url: https://zum.lrv.lt/
    sources: [vyriausybes-istatymas-i-464, lrv-xxi-vyriausybe-prisieke, lrv-ministerijos-en]
    note:
      en: >-
        Agriculture, food and the common agricultural policy, plus rural development, land
        administration and fisheries. Forestry is not tagged here: Lithuania puts forests
        with the environment ministry, which is the opposite of the Finnish arrangement
        where agriculture and forestry share one department.
      es: >-
        Agricultura, alimentación y política agraria común, además de desarrollo rural,
        administración de la tierra y pesca. La silvicultura no se etiqueta aquí: Lituania
        sitúa los bosques en el ministerio de Medio Ambiente, lo contrario del caso finlandés,
        donde agricultura y silvicultura comparten un mismo departamento.

