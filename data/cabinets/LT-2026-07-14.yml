    note:
      en: >-
        The only ministry the Act singles out for structural exceptions: article 29(9)
        provides that the laws governing the national defence system may lay down
        particularities of this ministry's structure. That changes nothing for the count —
        it is one ministry with one minister — but it is the sole place where the statute
        treats a department differently from the rest.
      es: >-
        El único ministerio al que la ley reserva excepciones estructurales: el artículo
        29(9) prevé que las leyes del sistema de defensa nacional puedan establecer
        particularidades de la estructura de este ministerio. Eso no cambia nada para el
        recuento —es un ministerio con un ministro—, pero es el único lugar donde la ley
        trata a un departamento de forma distinta a los demás.

  - id: LT-2026-kulturos-ministerija
    order: 6
    name_original: Kultūros ministerija
    abbreviation_original: KM
    name_en: Ministry of Culture
    name_es: Ministerio de Cultura
    name_en_provenance: official
    name_es_provenance: translated
