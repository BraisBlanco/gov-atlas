  - id: LT-2026-ministras-pirmininkas
    order: 15
    name_original: Ministras Pirmininkas
    abbreviation_original: null
    name_en: Prime Minister
    name_es: Primer Ministro
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministras Pirmininkas
    head_title_en: Prime Minister
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://lrv.lt/
    sources: [vyriausybes-istatymas-i-464, lrv-xxi-vyriausybe-prisieke, lrt-seimas-pritare-programai]
    note:
      en: >-
        Not a ministry and not a department: article 29(2) of the Vyriausybės įstatymas does
        not list one, and article 24 gives the Prime Minister no portfolio, only the
        representation and direction of the Government's work. It is recorded because
        article 1 makes the Prime Minister a member of the Government, which is what makes
        the cabinet fifteen people and the government fourteen departments. Do not confuse
        this entry with the Vyriausybės kanceliarija below: this is the office of the head of
        government, that is the administrative apparatus which serves it, and each is
        excluded for a different reason.
      es: >-
        No es un ministerio ni un departamento: el artículo 29(2) de la Vyriausybės įstatymas
        no enumera ninguno y el artículo 24 no da al primer ministro cartera alguna, sólo la
        representación y la dirección del trabajo del Gobierno. Se registra porque el
        artículo 1 hace del primer ministro un miembro del Gobierno, y eso es lo que hace que
        el gabinete sean quince personas y el gobierno catorce departamentos. No confundir
        esta entrada con la Vyriausybės kanceliarija de más abajo: ésta es la oficina del jefe
        de gobierno, aquélla el aparato administrativo que la sirve, y cada una se excluye por
        un motivo distinto.

  - id: LT-2026-vyriausybes-kanceliarija
    order: 16
    name_original: Vyriausybės kanceliarija
    abbreviation_original: LRVK
    name_en: Office of the Government
    name_es: Cancillería del Gobierno
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Vyriausybės kancleris
    head_title_en: Chancellor of the Government
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://lrv.lt/
    sources: [vyriausybes-istatymas-i-464, lrv-ministerijos-en]
    note:
      en: >-
        Recorded so that the perimeter is visible, and excluded on the narrowest available
        ground. Article 44-1(1) of the Act constitutes it as a budgetary institution
        established by the Government to assist the Government and the Prime Minister, and
        says in the same sentence that it is headed by the Vyriausybės kancleris — under
        article 45(1) a political-trust civil servant subordinate to the Prime Minister, not
        a minister and not a member of the Government. It is therefore excluded as
        not_headed_by_minister rather than as head_of_government_office, which is reserved
        here for the Prime Minister's own office above, and it carries no cabinet seat.
        lrv.lt's English edition lists it in the ministry navigation immediately after the
        fourteen, as "The Office of the Government of the Republic of Lithuania", which is a
        listing convention and not a claim that it is a fifteenth ministry: article 29(2)
        does not name it. Compare Finland, where the equivalent body is in the statutory list
        of ministries and is counted.
      es: >-
        Se registra para que el perímetro sea visible, y se excluye por el motivo más
        estricto disponible. El artículo 44-1(1) de la ley la constituye como una institución
        presupuestaria creada por el Gobierno para asistir al Gobierno y al primer ministro, y
        dice en la misma frase que la dirige el Vyriausybės kancleris —según el artículo 45(1)
        un funcionario de confianza política subordinado al primer ministro, no un ministro ni
        un miembro del Gobierno—. Se excluye por tanto como not_headed_by_minister y no como
        head_of_government_office, motivo reservado aquí a la oficina del propio primer
        ministro de más arriba, y no lleva asiento en el gabinete. La edición inglesa de
        lrv.lt la enumera en la navegación de ministerios justo después de los catorce, como
        «The Office of the Government of the Republic of Lithuania», lo que es una convención
        de listado y no la afirmación de que sea un decimoquinto ministerio: el artículo 29(2)
        no la nombra. Compárese con Finlandia, donde el órgano equivalente sí figura en la
        lista legal de ministerios y sí se cuenta.
