    note:
      en: >-
        Not tagged digital, which is the judgement call on this entity. The English name
        "Transport and Communications" invites the assumption that digital government lives
        here, and in most of the 2010s it did; information-society development and state
        information resources have since moved to the Ministry of the Economy and
        Innovation, leaving this ministry with transport, roads, railways, aviation, the
        port of Klaipėda, postal services and electronic communications networks. Shipping
