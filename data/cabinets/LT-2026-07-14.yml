    sources: [vyriausybes-istatymas-i-464, lrv-xxi-vyriausybe-prisieke, lrv-ministerijos-en, lrt-seimas-pritare-programai]
    note:
      en: >-
        Culture and sport are separate in Lithuania: sport belongs to the education ministry,
        whose statutory name ends "ir sporto", so this ministry is not tagged sport. Media
        is tagged here because public information policy and the cultural heritage of
        broadcasting sit with it; language policy is not, because Lithuania's state language
        commission reports to the Seimas rather than to a ministry.
      es: >-
        La cultura y el deporte están separados en Lituania: el deporte pertenece al
        ministerio de educación, cuyo nombre legal termina en «ir sporto», así que este
        ministerio no lleva la etiqueta sport. Sí lleva media, porque la política de
        información pública y el patrimonio audiovisual le corresponden; no lleva
        language_policy, porque la comisión de la lengua estatal lituana depende del Seimas y
        no de un ministerio.

  - id: LT-2026-socialines-apsaugos-ir-darbo-ministerija
