      es: >-
        No lleva la etiqueta digital, y esa es la decisión discutible de esta entidad. El
        nombre inglés «Transport and Communications» invita a suponer que el gobierno digital
        vive aquí, y durante buena parte de la década de 2010 así fue; el desarrollo de la
        sociedad de la información y los recursos de información del Estado pasaron después
        al Ministerio de Economía e Innovación, dejando a este ministerio el transporte, las
        carreteras, los ferrocarriles, la aviación, el puerto de Klaipėda, los servicios
        postales y las redes de comunicaciones electrónicas. Lleva shipping porque el puerto
        y el transporte marítimo son suyos, y no de un ministerio de pesca.

