    note: >-
      The English-language edition of lrv.lt, published by the Lithuanian government itself,
      which is what makes name_en_provenance "official" for all fourteen ministries and for
      the Office of the Government. The list appears in the site's own ministry navigation
      in exactly the statutory order of article 29(2), which is a useful independent check
      that the fourteen are the same fourteen. The quotation reproduces the entries
      verbatim, including the two that carry no state qualifier and the "of The Republic of
      Lithuania" capitalisation on the health ministry; the qualifier is dropped in the
      name_en fields, as the methodology notes explain. The archived snapshot is of 9 March
      2026 and therefore predates this cabinet, which does not matter for the purpose it is
      cited for: the ministries are fixed by statute and neither the list nor any name
      changed when the government did. The live page refuses automated requests, so the
      snapshot is also how it was read.

  - id: lrt-seimas-pritare-programai
    tier: 3
    type: press
    publisher: LRT (Lietuvos nacionalinis radijas ir televizija)
    title: Seimas palaimino Mindaugo Sinkevičiaus Vyriausybę ir jos programą
    url: >-
      https://www.lrt.lt/naujienos/lietuvoje/2/2990074/seimas-palaimino-mindaugo-sinkeviciaus-vyriausybe-ir-jos-programa
    archive_url: null
    lang: lt
    published: 2026-07-14
    accessed: 2026-07-28
    quote: |-
      Seimas palaimino Mindaugo Sinkevičiaus Vyriausybę ir jos programą. Už Vyriausybės programos projektą balsavo 72 Seimo nariai, 29 buvo prieš, o dar keturi susilaikė.
      Vyriausybės programos klausimas Seimo salėje prasidėjo nuo diskusijų, ar antradienį apskritai galima balsuoti dėl Vyriausybės programos.
      Paskirtasis premjeras Mindaugas Sinkevičius 21-osios Vyriausybės programą Teisės aktų bazėje registravo liepos 3 dieną, o prezidentas Gitanas Nausėda dekretą dėl jo Vyriausybės sudėties pasirašė liepos 7 dieną.
      Vyriausybės programos tvirtinimas planuojamas liepos 14 dieną. Patvirtinus Vyriausybės programą, prisieks ir pareigas pradės eiti M. Sinkevičiaus vadovaujamas ministrų kabinetas.
      Jame tęsti darbą turėtų užsienio reikalų ministras Kęstutis Budrys, krašto apsaugos ministras Robertas Kaunas, susisiekimo ministras Juras Taminskas, švietimo, mokslo ir sporto ministrė Raminta Popovienė, teisingumo ministrė Rita Tamašunienė, ekonomikos ir inovacijų ministras Edvinas Grikšas.
      Į finansų ministrus teikiamas Taurimas Valys, vidaus reikalų – Martynas Katelynas, aplinkos – Ieva Andriulaitytė, kultūros – Lukas Alsys, o buvusi premjerė Inga Ruginienė grįžta dirbti socialinės apsaugos ir darbo ministre.
    note: >-
      The Lithuanian public broadcaster's report of the Seimas sitting of 14 July 2026,
      cited for three things the government's own English communiqué does not give: the
      vote (72 for, 29 against, 4 abstentions), the dates of the two earlier steps — the
      programme registered on 3 July, the President's decree confirming the composition of
      the Government signed on 7 July — and the Lithuanian form of six ministerial titles,
      including the feminine forms actually used for the women in this cabinet. It is also
      the source for the constitutional objection recorded in the methodology notes. Tier 3,
      and no counted ministry rests on it: it corroborates dates and wording that the
      statute and the government's own page already carry. Note the discrepancy on the
      decree: several agency reports date the President's confirmation of the cabinet to 6
      July, which appears to be the day it was announced; LRT and later Lithuanian reporting
      give 7 July as the date of signature, and 7 July is the date recorded here.

entities:
  # --- the fourteen ministries, in the statutory order of article 29(2) ------------------
  - id: LT-2026-aplinkos-ministerija
    order: 1
    name_original: Aplinkos ministerija
    abbreviation_original: AM
    name_en: Ministry of Environment
    name_es: Ministerio de Medio Ambiente
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Aplinkos ministras
    head_title_en: Minister of the Environment
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [environment, climate, forestry, spatial_planning, housing]
    counts_as_ministry: true
    url: https://am.lrv.lt/
    sources: [vyriausybes-istatymas-i-464, lrv-xxi-vyriausybe-prisieke, lrv-ministerijos-en, lrt-seimas-pritare-programai]
    note:
      en: >-
        Tagged well beyond its one-word name, and deliberately. Lithuania puts construction,
        housing and spatial planning in this ministry, along with forests and protected
        areas and the coordination of climate policy; there is no housing ministry, no
        forestry ministry and no climate ministry to tag instead. The government's own
        English edition calls the department "Ministry of Environment" and its head the
        "Minister of the Environment"; both are recorded as published.
      es: >-
        Se etiqueta mucho más allá de su nombre de una palabra, y a propósito. Lituania sitúa
        en este ministerio la construcción, la vivienda y la ordenación del territorio, junto
        con los bosques, los espacios protegidos y la coordinación de la política climática;
        no hay ministerio de vivienda, ni de bosques, ni de clima al que etiquetar en su
        lugar. La edición inglesa del propio gobierno llama al departamento «Ministry of
        Environment» y a su titular «Minister of the Environment»; ambos se registran tal
        como se publican.

  - id: LT-2026-ekonomikos-ir-inovaciju-ministerija
    order: 2
    name_original: Ekonomikos ir inovacijų ministerija
    abbreviation_original: EIMIN
    name_en: Ministry of the Economy and Innovation
    name_es: Ministerio de Economía e Innovación
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ekonomikos ir inovacijų ministras
    head_title_en: Minister of the Economy and Innovation
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [economy, innovation, industry, digital, small_business, tourism]
    counts_as_ministry: true
    url: https://eimin.lrv.lt/
    sources: [vyriausybes-istatymas-i-464, lrv-xxi-vyriausybe-prisieke, lrv-ministerijos-en, lrt-seimas-pritare-programai]
    note:
      en: >-
        This is where Lithuania keeps digital policy, which is the tag most likely to be
        looked for on the wrong ministry. Information-society development, state information
        resources, the digitalisation of public services and, latterly, electronic
        identification and trust services are this ministry's published fields of activity
        under a heading of its own ("skaitmeninė politika"), not the transport and
        communications ministry's. Tourism and business finance are also here; Lithuania has
        no separate tourism ministry.
      es: >-
        Aquí es donde Lituania guarda la política digital, la etiqueta que más probablemente
        se busque en el ministerio equivocado. El desarrollo de la sociedad de la
        información, los recursos de información del Estado, la digitalización de los
        servicios públicos y, últimamente, la identificación electrónica y los servicios de
        confianza son áreas de actividad publicadas de este ministerio bajo un epígrafe
        propio («skaitmeninė politika»), y no del ministerio de transporte y comunicaciones.
        El turismo y la financiación empresarial también están aquí; Lituania no tiene
        ministerio de turismo propio.

  - id: LT-2026-energetikos-ministerija
    order: 3
    name_original: Energetikos ministerija
    abbreviation_original: ENMIN
    name_en: Ministry of Energy
    name_es: Ministerio de Energía
    name_en_provenance: official
