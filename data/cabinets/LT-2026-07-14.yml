    note:
      en: >-
        Tagged regional_development because the coordination of European Union investment —
        the cohesion and recovery funds — is this ministry's in Lithuania, not a separate
        department's and not the interior ministry's, which holds regional policy in the
        domestic sense.
      es: >-
        Se etiqueta regional_development porque la coordinación de la inversión de la Unión
        Europea —los fondos de cohesión y de recuperación— corresponde en Lituania a este
        ministerio, y no a un departamento aparte ni al ministerio del Interior, que tiene la
        política regional en su sentido interno.

  - id: LT-2026-krasto-apsaugos-ministerija
