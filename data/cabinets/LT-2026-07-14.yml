    note:
      en: >-
        Lithuania has no European affairs minister and no development minister: EU
        coordination, development cooperation, economic diplomacy and relations with the
        Lithuanian diaspora are all departments of this ministry. Trade is tagged here as
        well as on the economy ministry, which is a genuine overlap rather than a slip —
        export promotion is run jointly, with the trade-policy and economic-diplomacy side
        here.
      es: >-
        Lituania no tiene ministro de Asuntos Europeos ni de Desarrollo: la coordinación de
        la UE, la cooperación al desarrollo, la diplomacia económica y las relaciones con la
        diáspora lituana son departamentos de este ministerio. La etiqueta trade aparece aquí
        y también en el ministerio de economía, lo que es un solapamiento real y no un
        descuido: la promoción exportadora se lleva conjuntamente, con la política comercial
        y la diplomacia económica en esta casa.

