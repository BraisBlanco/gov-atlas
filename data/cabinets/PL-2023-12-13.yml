      § 1. 1. Rozporządzenie określa szczegółowy zakres działania Ministra Spraw Zagranicznych, zwanego dalej „ministrem”.
      2. Minister kieruje następującymi działami administracji rządowej:
      1) członkostwo Rzeczypospolitej Polskiej w Unii Europejskiej;
      2) sprawy zagraniczne.
      3. Minister jest dysponentem części 23 i 45 budżetu państwa.
      4. Obsługę ministra zapewnia Ministerstwo Spraw Zagranicznych.
    note: >-
      In force on 28 July 2026, and the instrument that folded European Union membership
      into the foreign affairs portfolio when the separate Minister do spraw Unii
      Europejskiej was abolished. Article 32(1) of the ustawa o działach puts development
      cooperation and humanitarian aid, and relations with Poles living abroad, inside the
      branch "sprawy zagraniczne", which is why this ministry carries the
      development_cooperation and diaspora tags.

