    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [defence]
    counts_as_ministry: true
    url: https://www.gov.pl/web/obrona-narodowa
    sources: [du-2023-2707-mon, mp-2023-1383, mp-2025-690, gov-pl-ministerstwa]
    note:
      en: >-
        Its minister is also one of the three deputy prime ministers. Under article 147(3)
        of the Constitution that is a second office of the same person, so it adds neither a
        ministry nor a seat.
      es: >-
        Su ministro es además uno de los tres vicepresidentes del Consejo de Ministros.
        Conforme al artículo 147.3 de la Constitución eso es un segundo cargo de la misma
        persona, por lo que no añade ni ministerio ni asiento.

