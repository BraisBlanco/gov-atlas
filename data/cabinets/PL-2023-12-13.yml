    lang: pl
    published: 2025-07-25
    accessed: 2026-07-28
    quote: |-
      § 1. 1. Minister – Członek Rady Ministrów, Koordynator Służb Specjalnych, Tomasz Siemoniak, zwany dalej „ministrem”, wykonuje zadania, o których mowa w ustawie z dnia 24 maja 2002 r. o Agencji Bezpieczeństwa Wewnętrznego oraz Agencji Wywiadu (Dz. U. z 2025 r. poz. 902), określone dla ministra powołanego w celu koordynowania służb specjalnych.
      2. Do szczegółowego zakresu działania ministra należy:
      1) sprawowanie nadzoru i kontroli działalności służb specjalnych;
      2) koordynowanie działalności służb specjalnych;
