      en: >-
        Created on 1 March 2024 out of Ministerstwo Aktywów Państwowych, seated in Katowice,
        and transformed into Ministerstwo Energii on 21 August 2025. Its minister's office,
        Minister Przemysłu, existed from 13 December 2023 and was abolished on 24 July 2025,
        four weeks before the ministry itself changed; between those dates the ministry
        served the new Minister Energii. Recorded with no seat, because this file does not
        reconstruct the term's personnel history.
      es: >-
        Creado el 1 de marzo de 2024 a partir del Ministerstwo Aktywów Państwowych, con sede
        en Katowice, y transformado en Ministerstwo Energii el 21 de agosto de 2025. El cargo
        de su ministra, Minister Przemysłu, existió desde el 13 de diciembre de 2023 y se
        suprimió el 24 de julio de 2025, cuatro semanas antes de que cambiara el ministerio;
        entre esas fechas el ministerio atendió al nuevo Minister Energii. Se registra sin
        asiento, porque este fichero no reconstruye el historial de titulares de la
        legislatura.

