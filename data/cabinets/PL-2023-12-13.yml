    note:
      en: >-
        Six policy areas for three branches. Article 31 of the ustawa o działach puts social
        insurance and pension funds, social assistance, the employment and rehabilitation of
        disabled people, and war veterans and victims of repression all inside
        "zabezpieczenie społeczne"; the Szef Urzędu do Spraw Kombatantów i Osób
        Represjonowanych reports to this minister, and Poland has no separate veterans
        ministry.
      es: >-
        Seis áreas de política para tres ramos. El artículo 31 de la ustawa o działach sitúa
        los seguros sociales y los fondos de pensiones, la asistencia social, el empleo y la
        rehabilitación de las personas con discapacidad y los excombatientes y víctimas de
        represión dentro de «zabezpieczenie społeczne»; el Szef Urzędu do Spraw Kombatantów
        i Osób Represjonowanych depende de este ministro, y Polonia no tiene un ministerio
        de veteranos separado.

  # --- recorded, not counted: minister with a seat and no department -------------------
  - id: PL-2023-czlonek-rady-ministrow-szef-kprm
    order: 11
    name_original: Minister – Członek Rady Ministrów, Szef Kancelarii Prezesa Rady Ministrów
    abbreviation_original: null
    name_en: Minister – Member of the Council of Ministers, Head of the Chancellery of the Prime Minister
    name_es: Ministro – Miembro del Consejo de Ministros, Jefe de la Cancillería del Presidente del Consejo de Ministros
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Minister – Członek Rady Ministrów
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: minister_without_portfolio
    url: null
    sources: [du-2025-998-grabiec, mp-2023-1383, mp-2025-690, gov-pl-sklad-rady-ministrow, konstytucja-rp-1997]
    note:
      en: >-
        A minister without portfolio who runs the Chancellery. The presidential
        postanowienie appoints him only "na urzędy Ministra – Członka Rady Ministrów i
        Przewodniczącego Komitetu do spraw Pożytku Publicznego"; the office of Szef
        Kancelarii is conferred separately by the Prime Minister and is not a ministry.
        Under article 149(1) of the Constitution he carries out tasks assigned by the Prime
        Minister rather than running a branch of government administration, and § 5 of his
        remit regulation confirms that the Chancellery serves him. He is recorded separately
        from the Chancellery entity because his seat and the Prime Minister's are two of the
        22, not one. A curator could defensibly file him under head_of_government_office
        instead; the reason chosen here follows the gazette, which appoints him a
        minister-member with no department.
      es: >-
        Ministro sin cartera que dirige la Cancillería. El postanowienie presidencial lo
        nombra únicamente «na urzędy Ministra – Członka Rady Ministrów i Przewodniczącego
        Komitetu do spraw Pożytku Publicznego»; el cargo de Szef Kancelarii lo confiere
        aparte el primer ministro y no es un ministerio. Conforme al artículo 149.1 de la
        Constitución desempeña las tareas que le asigna el primer ministro en lugar de
        dirigir un ramo de la administración, y el § 5 de su reglamento de ámbito confirma
        que le atiende la Cancillería. Se registra por separado de la entidad de la
        Cancillería porque su asiento y el del primer ministro son dos de los 22, no uno. Un
        curador podría razonablemente clasificarlo como head_of_government_office; el motivo
        elegido aquí sigue al boletín, que lo nombra ministro-miembro sin departamento.

