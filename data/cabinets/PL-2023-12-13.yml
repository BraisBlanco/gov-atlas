      paragraph 1(4) provided that the minister was served by "Ministerstwo Klimatu i
      Środowiska w zakresie działu administracji rządowej – energia" and "Ministerstwo
      Przemysłu w zakresie działu administracji rządowej – gospodarka surowcami
      energetycznymi", because the ministries were reorganised four weeks after the minister
      was appointed. Since 21 August 2025 a single Ministerstwo Energii serves him. The
      superscript footnote markers of the consolidated text are dropped from the quote; no
      words are altered.

