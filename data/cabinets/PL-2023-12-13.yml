    note:
      en: >-
        A minister without portfolio: he runs no branch of government administration and,
        by § 5 of his own remit regulation, is served by the Chancellery rather than by a
        ministry. He coordinates the implementation of government policy and the government's
        legislative process, and chairs the Stały Komitet Rady Ministrów. The office was
        created on 24 July 2025 in place of the generic "Minister – Członek Rady Ministrów"
        the same person had held since 13 December 2023, which is why valid_from is set.
      es: >-
        Ministro sin cartera: no dirige ningún ramo de la administración gubernamental y,
        según el § 5 de su propio reglamento de ámbito, le atiende la Cancillería y no un
        ministerio. Coordina la aplicación de la política del Gobierno y el proceso
        legislativo gubernamental, y preside el Stały Komitet Rady Ministrów. El cargo se
        creó el 24 de julio de 2025 en sustitución del genérico «Minister – Członek Rady
        Ministrów» que la misma persona ostentaba desde el 13 de diciembre de 2023, y de ahí
        el valid_from.

