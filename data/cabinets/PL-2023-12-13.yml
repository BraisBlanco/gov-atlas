    note:
      en: >-
        Since 24 July 2025 it also runs the branch "członkostwo Rzeczypospolitej Polskiej w
        Unii Europejskiej", which until then belonged to a separate Minister do spraw Unii
        Europejskiej who had no ministry of his own. Its minister is also a deputy prime
