      es: >-
        Desde el 24 de julio de 2025 dirige además el ramo «członkostwo Rzeczypospolitej
        Polskiej w Unii Europejskiej», que hasta entonces correspondía a un Minister do
        spraw Unii Europejskiej separado y sin ministerio propio. Su ministro es además
        vicepresidente del Consejo de Ministros, lo que no añade ni ministerio ni asiento.

