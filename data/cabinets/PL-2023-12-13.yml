    quote: |-
      § 1. 1. Tworzy się Ministerstwo Nauki i Szkolnictwa Wyższego.
      2. W skład Ministerstwa Nauki i Szkolnictwa Wyższego wchodzą komórki organizacyjne dotychczasowego Ministerstwa Edukacji i Nauki obsługujące sprawy działu administracji rządowej szkolnictwo wyższe i nauka oraz pracownicy obsługujący sprawy tego działu.
      § 2. Rozporządzenie wchodzi w życie z dniem 1 stycznia 2024 r.
    note: >-
      The other half of the split, and the tier-1 basis for the valid_from on Ministerstwo
      Nauki i Szkolnictwa Wyższego. Line breaks introduced mid-sentence by the gazette's
      typesetting are closed up.

  - id: du-2025-1076-przeksztalcenie-msz
    tier: 1
    type: official_gazette
    publisher: Dziennik Ustaw Rzeczypospolitej Polskiej
    title: >-
      Rozporządzenie Rady Ministrów z dnia 5 sierpnia 2025 r. w sprawie przekształcenia
      Ministerstwa Spraw Zagranicznych (Dz.U. 2025 poz. 1076)
    url: https://dziennikustaw.gov.pl/D2025000107601.pdf
    archive_url: https://web.archive.org/web/20250806171828/https://dziennikustaw.gov.pl/D2025000107601.pdf
    lang: pl
    published: 2025-08-06
    accessed: 2026-07-28
    quote: |-
      § 1. 1. Przekształca się Ministerstwo Spraw Zagranicznych.
      2. Przekształcenie, o którym mowa w ust. 1, polega na włączeniu do Ministerstwa Spraw Zagranicznych komórek organizacyjnych zapewniających obsługę zadań ministra właściwego do spraw członkostwa Rzeczypospolitej Polskiej w Unii Europejskiej oraz pracowników obsługujących te zadania i wyłączeniu tych komórek organizacyjnych oraz tych pracowników z urzędu dotychczas obsługującego ministra właściwego do spraw członkostwa Rzeczypospolitej Polskiej w Unii Europejskiej.
      § 2. Rozporządzenie wchodzi w życie z dniem ogłoszenia, z mocą od dnia 24 lipca 2025 r.
    note: >-
      Records what happened to the abolished Minister do spraw Unii Europejskiej: the units
      that had served him, which sat in the Chancellery rather than in a ministry, were moved
      into the foreign ministry. No ministry was created or abolished, which is why the
      ministry count is unchanged by this instrument while the seat count falls by one. Line
      breaks introduced mid-sentence by the gazette's typesetting are closed up.

