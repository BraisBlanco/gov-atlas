    lang: pl
    published: 2025-09-24
    accessed: 2026-07-28
    quote: |-
      Art. 5. Ustala się następujące działy:
      1) administracja publiczna;
      1a) budownictwo, planowanie i zagospodarowanie przestrzenne oraz mieszkalnictwo;
      1b) aktywa państwowe;
      2) budżet;
      2a) energia;
