  # --- the enumeration of the Council of Ministers ------------------------------------
  - id: mp-2023-1383
    tier: 1
    type: official_gazette
    publisher: Monitor Polski — Dziennik Urzędowy Rzeczypospolitej Polskiej
    title: >-
      Postanowienie Prezydenta Rzeczypospolitej Polskiej z dnia 13 grudnia 2023 r.
      nr 1131.45.2023 o powołaniu w skład Rady Ministrów (M.P. 2023 poz. 1383)
    url: https://monitorpolski.gov.pl/M2023000138301.pdf
    archive_url: https://web.archive.org/web/20231215214924/https://monitorpolski.gov.pl/M2023000138301.pdf
    lang: pl
    published: 2023-12-13
    accessed: 2026-07-28
    quote: |-
      Na podstawie art. 154 ust. 3 w związku z art. 147 Konstytucji Rzeczypospolitej Polskiej z dnia 2 kwietnia 1997 r., z dniem 13 grudnia 2023 r. powołuję w skład Rady Ministrów wybranej przez Sejm Rzeczypospolitej Polskiej:
      Pana Władysława Kosiniaka-Kamysza – na urzędy Wiceprezesa Rady Ministrów i Ministra Obrony Narodowej
      Pana Krzysztofa Gawkowskiego – na urzędy Wiceprezesa Rady Ministrów i Ministra Cyfryzacji
      Pana Macieja Berka – na urząd Ministra – Członka Rady Ministrów
      Pana Adama Bodnara – na urząd Ministra Sprawiedliwości
      Panią Agnieszkę Buczyńską – na urzędy Ministra do spraw Społeczeństwa Obywatelskiego i Przewodniczącej Komitetu do spraw Pożytku Publicznego
      Pana Borysa Budkę – na urząd Ministra Aktywów Państwowych
      Panią Marzenę Czarnecką – na urząd Ministra Przemysłu
      Pana Andrzeja Domańskiego – na urząd Ministra Finansów
      Panią Agnieszkę Dziemianowicz-Bąk – na urząd Ministra Rodziny, Pracy i Polityki Społecznej
      Pana Jana Grabca – na urząd Ministra – Członka Rady Ministrów
      Panią Paulinę Hennig-Kloskę – na urząd Ministra Klimatu i Środowiska
      Pana Krzysztofa Hetmana – na urząd Ministra Rozwoju i Technologii
      Pana Marcina Kierwińskiego – na urząd Ministra Spraw Wewnętrznych i Administracji
      Pana Dariusza Klimczaka – na urząd Ministra Infrastruktury
      Panią Katarzynę Kotulę – na urząd Ministra do spraw Równości
      Panią Izabelę Leszczynę – na urząd Ministra Zdrowia
      Pana Sławomira Nitrasa – na urząd Ministra Sportu i Turystyki
      Panią Barbarę Nowacką – na urząd Ministra Edukacji
      Panią Marzenę Okłę-Drewnowicz – na urząd Ministra do spraw Polityki Senioralnej
      Panią Katarzynę Pełczyńską-Nałęcz – na urząd Ministra Funduszy i Polityki Regionalnej
      Pana Czesława Siekierskiego – na urząd Ministra Rolnictwa i Rozwoju Wsi
      Pana Tomasza Siemoniaka – na urząd Ministra – Członka Rady Ministrów
      Pana Bartłomieja Sienkiewicza – na urząd Ministra Kultury i Dziedzictwa Narodowego
      Pana Radosława Sikorskiego – na urząd Ministra Spraw Zagranicznych
      Pana Adama Szłapkę – na urząd Ministra do spraw Unii Europejskiej
      Pana Dariusza Wieczorka – na urząd Ministra Nauki
    note: >-
      The instrument that constitutes this Council of Ministers, quoted in full: 26
      ministers, to which the separately published appointment of the Prime Minister adds a
      27th seat. It is the baseline for the entity list, and it names five offices that no
      longer exist — Minister Przemysłu, Minister do spraw Społeczeństwa Obywatelskiego,
      Minister do spraw Równości, Minister do spraw Polityki Senioralnej and Minister do
      spraw Unii Europejskiej — plus one, Minister Finansów, that has since been widened
      into Minister Finansów i Gospodarki. Note that it appoints offices, not ministries:
      the word "Ministerstwo" does not appear in it. Line breaks that the gazette's
      two-column typesetting introduces inside a single entry are closed up; no words are
      altered.

  - id: mp-2023-1382
    tier: 1
    type: official_gazette
    publisher: Monitor Polski — Dziennik Urzędowy Rzeczypospolitej Polskiej
    title: >-
      Postanowienie Prezydenta Rzeczypospolitej Polskiej z dnia 13 grudnia 2023 r.
      nr 1131.44.2023 o powołaniu Prezesa Rady Ministrów (M.P. 2023 poz. 1382)
    url: https://monitorpolski.gov.pl/M2023000138201.pdf
    archive_url: https://web.archive.org/web/20231215214914/https://monitorpolski.gov.pl/M2023000138201.pdf
    lang: pl
    published: 2023-12-13
    accessed: 2026-07-28
    quote: >-
      Na podstawie art. 154 ust. 3 Konstytucji Rzeczypospolitej Polskiej z dnia 2 kwietnia
      1997 r., w związku z wyborem dokonanym przez Sejm Rzeczypospolitej Polskiej, powołuję
      Pana Donalda Franciszka Tuska na urząd Prezesa Rady Ministrów.
    note: >-
      Fixes took_office at 13 December 2023 and establishes the Prime Minister's own seat,
      which is separate from the 26 appointments in poz. 1383 and is why the cabinet had 27
      members at the start of the term.

