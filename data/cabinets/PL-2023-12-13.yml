        It runs two branches, "aktywa państwowe" and "łączność", but only the first is
        taggable: "łączność" is postal affairs under article 16 of the ustawa o działach and
        the taxonomy has no id for postal services. Its mining competence left in March 2024
        with the creation of Ministerstwo Przemysłu, which was carved out of this ministry.
      es: >-
        Dirige dos ramos, «aktywa państwowe» y «łączność», pero sólo el primero es
        etiquetable: «łączność» son los asuntos postales conforme al artículo 16 de la
        ustawa o działach y la taxonomía no tiene id para los servicios postales. Su
        competencia minera se marchó en marzo de 2024 con la creación del Ministerstwo
        Przemysłu, escindido de este ministerio.

