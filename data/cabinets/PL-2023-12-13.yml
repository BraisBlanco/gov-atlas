    quote: |-
      § 1. 1. Przekształca się Ministerstwo Klimatu i Środowiska.
      2. Przekształcenie, o którym mowa w ust. 1, polega na wyłączeniu z dotychczasowego Ministerstwa Klimatu i Środowiska, obsługującego sprawy działów administracji rządowej energia, klimat i środowisko, komórek organizacyjnych obsługujących sprawy działu administracji rządowej energia oraz pracowników obsługujących sprawy tego działu.
      § 2. Rozporządzenie wchodzi w życie z dniem następującym po dniu ogłoszenia.
    note: >-
      The instrument that took energy out of the climate ministry with effect from
      21 August 2025. Ministerstwo Klimatu i Środowiska was transformed, not renamed or
      replaced, so its entity runs continuously through the term. Line breaks introduced
      mid-sentence by the gazette's typesetting are closed up.

  - id: du-2025-1141-utworzenie-ministerstwa-energii
    tier: 1
    type: official_gazette
    publisher: Dziennik Ustaw Rzeczypospolitej Polskiej
    title: >-
      Rozporządzenie Rady Ministrów z dnia 18 sierpnia 2025 r. w sprawie utworzenia
      Ministerstwa Energii (Dz.U. 2025 poz. 1141)
    url: https://dziennikustaw.gov.pl/D2025000114101.pdf
    archive_url: https://web.archive.org/web/20250820195736/https://dziennikustaw.gov.pl/D2025000114101.pdf
    lang: pl
    published: 2025-08-20
    accessed: 2026-07-28
    quote: |-
      § 1. 1. Tworzy się Ministerstwo Energii w drodze przekształcenia dotychczasowego Ministerstwa Przemysłu.
      2. Przekształcenie, o którym mowa w ust. 1, polega na włączeniu do dotychczasowego Ministerstwa Przemysłu, obsługującego sprawy działu administracji rządowej gospodarka surowcami energetycznymi, komórek organizacyjnych dotychczasowego Ministerstwa Klimatu i Środowiska obsługujących sprawy działu administracji rządowej energia oraz pracowników obsługujących sprawy tego działu.
      § 2. Traci moc rozporządzenie Rady Ministrów z dnia 20 lutego 2024 r. w sprawie utworzenia Ministerstwa Przemysłu (Dz. U. poz. 260).
      § 3. Rozporządzenie wchodzi w życie z dniem następującym po dniu ogłoszenia.
      Prezes Rady Ministrów: D. Tusk
    note: >-
      The only ministry created during this cabinet's term after the education split, and the
      instrument that ends Ministerstwo Przemysłu. It is quoted with § 2 and § 3 because
      those two paragraphs are what fix the changeover date: the 2024 regulation creating
      Ministerstwo Przemysłu ceases to have effect and this one enters into force on
      21 August 2025, the day after publication. It is also the tier-1 record that
      Ministerstwo Przemysłu existed and was created on 20 February 2024, which is why no
      separate citation of Dz.U. 2024 poz. 260 was needed. Line breaks introduced
      mid-sentence by the gazette's typesetting are closed up.

