        seguridad conforme a la ustawa o Agencji Bezpieczeństwa Wewnętrznego oraz Agencji
        Wywiadu. No dirige ningún ramo de la administración gubernamental y el § 8 de su
        reglamento de ámbito lo sitúa en la Cancillería, no en un ministerio. Las agencias
        que supervisa —ABW, AW, SKW, SWW, CBA— son organismos públicos y no se registran
        individualmente. La misma persona ocupó un asiento genérico de Minister – Członek
        Rady Ministrów desde diciembre de 2023 y fue Minister Spraw Wewnętrznych i
        Administracji entre mayo de 2024 y julio de 2025; este conjunto de datos registra la
        estructura, no a los titulares.

