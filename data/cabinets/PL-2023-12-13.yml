  - id: du-2025-997-mfig
    tier: 1
    type: official_gazette
    publisher: Dziennik Ustaw Rzeczypospolitej Polskiej
    title: >-
      Rozporządzenie Prezesa Rady Ministrów z dnia 25 lipca 2025 r. w sprawie szczegółowego
      zakresu działania Ministra Finansów i Gospodarki (Dz.U. 2025 poz. 997)
    url: https://dziennikustaw.gov.pl/D2025000099701.pdf
    archive_url: https://web.archive.org/web/20250729202311/https://dziennikustaw.gov.pl/D2025000099701.pdf
    lang: pl
    published: 2025-07-25
    accessed: 2026-07-28
    quote: |-
      § 1. 1. Rozporządzenie określa szczegółowy zakres działania Ministra Finansów i Gospodarki, zwanego dalej „ministrem”.
      2. Minister kieruje następującymi działami administracji rządowej:
      1) budownictwo, planowanie i zagospodarowanie przestrzenne oraz mieszkalnictwo;
      2) budżet;
      3) finanse publiczne;
      4) gospodarka;
      5) instytucje finansowe.
      3. Minister jest dysponentem części 18, 19 i 20 budżetu państwa.
      4. Obsługę ministra zapewnia:
      1) Ministerstwo Rozwoju i Technologii w zakresie działów administracji rządowej:
      a) budownictwo, planowanie i zagospodarowanie przestrzenne oraz mieszkalnictwo,
      b) gospodarka;
      2) Ministerstwo Finansów w zakresie działów administracji rządowej:
      a) budżet,
      b) finanse publiczne,
      c) instytucje finansowe.
      5. Organy podległe ministrowi lub przez niego nadzorowane określa załącznik do rozporządzenia.
      § 2. Rozporządzenie wchodzi w życie z dniem ogłoszenia, z mocą od dnia 24 lipca 2025 r.
      Prezes Rady Ministrów: D. Tusk
    note: >-
      The single most load-bearing document in this file, quoted at length because it is the
      reason Poland is counted as 19 ministries rather than 18. Paragraph 1(4) names two
      ministries serving one minister and divides the five branches between them. Its status
      in ISAP on 28 July 2026 is "obowiązujący", with no amending act recorded, and no
      rozporządzenie Rady Ministrów under article 39(1) has since created, abolished,
      renamed or merged either Ministerstwo Finansów or Ministerstwo Rozwoju i Technologii.
      There is accordingly no urząd named "Ministerstwo Finansów i Gospodarki"; that phrase
      is the minister's title only. Indentation of the lettered sub-points is normalised in
      the quote; no words are altered.

  - id: du-2025-998-grabiec
    tier: 1
    type: official_gazette
    publisher: Dziennik Ustaw Rzeczypospolitej Polskiej
    title: >-
      Rozporządzenie Prezesa Rady Ministrów z dnia 25 lipca 2025 r. w sprawie szczegółowego
      zakresu działania Ministra – Członka Rady Ministrów Jana Grabca (Dz.U. 2025 poz. 998)
    url: https://dziennikustaw.gov.pl/D2025000099801.pdf
    archive_url: https://web.archive.org/web/20250729233847/https://dziennikustaw.gov.pl/D2025000099801.pdf
    lang: pl
    published: 2025-07-25
    accessed: 2026-07-28
    quote: |-
      § 1. Minister – Członek Rady Ministrów Jan Grabiec, zwany dalej „ministrem”, wykonuje zadania wyznaczone przez Prezesa Rady Ministrów.
      § 2. Do zakresu działania ministra należy w szczególności:
      1) nadzór nad zapewnieniem przez Kancelarię Prezesa Rady Ministrów obsługi Rady Ministrów i Prezesa Rady Ministrów, ministrów wykonujących zadania wyznaczone przez Prezesa Rady Ministrów, pełnomocników Rządu, komisji wspólnych oraz organów pomocniczych Rady Ministrów i Prezesa Rady Ministrów;
      2) kierowanie działalnością i nadzór nad realizacją zadań Kancelarii Prezesa Rady Ministrów określonych w art. 29 pkt 3, 4, 8 i 9 ustawy z dnia 8 sierpnia 1996 r. o Radzie Ministrów;
      3) wykonywanie innych zadań zleconych przez Radę Ministrów lub Prezesa Rady Ministrów.
      § 5. Obsługę ministra zapewnia Kancelaria Prezesa Rady Ministrów.
    note: >-
      The remit of the minister who runs the Chancellery. Article 149(1) of the Constitution
      puts him squarely in the second category — he carries out tasks assigned by the Prime
      Minister rather than running a branch — and § 5 confirms that the office serving him is
      the Chancellery and not a ministry. He is therefore a cabinet seat and no ministry.
      Paragraphs 3 and 4, which concern his powers to demand information and to convene
      working groups, are omitted from the quote as immaterial here.

