# Poland — government structure of the Council of Ministers appointed on 13 December 2023
# (third Tusk cabinet), as it stands after the reconstruction of 24 July 2025.
#
# Read docs/DATA-CONTRACT.md alongside this file. Four things to notice:
#
#   1. Nowhere does this file state "19". The count is derived from the entities below.
#   2. Poland has no single instrument that enumerates its ministries. Ministries are
#      created one at a time by rozporządzenie Rady Ministrów, and each minister's remit
#      by a rozporządzenie Prezesa Rady Ministrów. The list of *ministers* comes from the
#      presidential postanowienia in Monitor Polski; the list of *ministerstwa* comes from
#      the 18 in-force remit regulations, each of which names the ministry that serves its
#      minister. Those two lists do not have the same length — see note 2 below.
#   3. There are 18 portfolio ministers but 19 ministries, because the Minister Finansów
#      i Gospodarki is served by two of them: Ministerstwo Finansów and Ministerstwo
#      Rozwoju i Technologii. That is the contested figure for Poland.
#   4. Kancelaria Prezesa Rady Ministrów is recorded and deliberately not counted, and so
#      are the three ministers who hold a seat without a department.

country: PL
cabinet_id: PL-2023-12-13

cabinet_name_original: Rada Ministrów Donalda Tuska (trzeci rząd Donalda Tuska), X kadencja Sejmu
cabinet_name_en: Council of Ministers of Poland (third Tusk cabinet), 10th Sejm
cabinet_name_es: Consejo de Ministros de Polonia (tercer gobierno de Donald Tusk), X legislatura del Sejm

head_of_government_title_original: Prezes Rady Ministrów
head_of_government_title_en: Prime Minister

took_office: 2023-12-13
left_office: null

methodology_notes:
  - en: >-
      Poland is counted here as having 19 ministries and 22 members of the Council of
      Ministers. The two figures answer different questions and are never added. Of the 22
      members, one is the Prime Minister, who holds a seat without a department; three are
      ministers with a cabinet seat and no department at all; and 18 head a department. The
      ministry count is 19 rather than 18 because one of those 18 ministers heads two
      ministries — see the next note.
    es: >-
      Aquí se cuentan para Polonia 19 ministerios y 22 miembros del Consejo de Ministros.
      Las dos cifras responden a preguntas distintas y nunca se suman. De los 22 miembros,
      uno es el primer ministro, que ocupa asiento sin departamento; tres son ministros con
      asiento en el gabinete y sin departamento alguno; y 18 encabezan un departamento. El
      recuento de ministerios es 19 y no 18 porque uno de esos 18 ministros encabeza dos
      ministerios: véase la nota siguiente.
  - en: >-
      The contested figure for Poland is 19 against 18, and the reason is the Minister
      Finansów i Gospodarki. The reconstruction of 24 July 2025 merged the finance and
      economy portfolios into one minister but did not merge the two ministries that serve
      him. Paragraph 1(4) of the rozporządzenie of 25 July 2025 (Dz. U. 2025 poz. 997)
      states in terms that his office is provided by "Ministerstwo Rozwoju i Technologii"
      for construction, spatial planning, housing and the economy and by "Ministerstwo
      Finansów" for the budget, public finances and financial institutions. That
      regulation was still in force and unamended on 28 July 2026, no rozporządzenie Rady
      Ministrów has merged, abolished or renamed either ministry, the Prime Minister gave
      Ministerstwo Rozwoju i Technologii a fresh statute on 23 January 2026 (M.P. 2026
      poz. 137), and the government's own directory of ministries lists both separately.
      There is no legal entity called "Ministerstwo Finansów i Gospodarki". This project
      therefore records two counted ministries with one shared minister and one cabinet
      seat, the same treatment applied to any country when a minister holds two
      departments. A reader who prefers to count ministers rather than
      ministries should read 18 wherever this site says 19 for Poland; the cabinet-seat
      figure of 22 is unaffected either way.
    es: >-
      La cifra discutida en Polonia es 19 frente a 18, y la causa es el Minister Finansów
      i Gospodarki. La remodelación del 24 de julio de 2025 unió las carteras de Hacienda y
      Economía en un solo ministro, pero no fusionó los dos ministerios que le sirven. El
      § 1 apartado 4 del reglamento del 25 de julio de 2025 (Dz. U. 2025 poz. 997) dice
      expresamente que su despacho lo atiende el «Ministerstwo Rozwoju i Technologii» en
      materia de construcción, ordenación del territorio, vivienda y economía, y el
      «Ministerstwo Finansów» en materia de presupuesto, finanzas públicas e instituciones
      financieras. Ese reglamento seguía vigente y sin modificar el 28 de julio de 2026,
      ningún rozporządzenie del Consejo de Ministros ha fusionado, suprimido ni renombrado
      ninguno de los dos ministerios, el primer ministro aprobó un nuevo estatuto para el
      Ministerstwo Rozwoju i Technologii el 23 de enero de 2026 (M.P. 2026 poz. 137) y el
      propio directorio gubernamental de ministerios los lista por separado. No existe
      ninguna entidad jurídica llamada «Ministerstwo Finansów i Gospodarki». Este proyecto
      registra por tanto dos ministerios contados con un ministro compartido y un
      único asiento en el gabinete, el mismo tratamiento que se aplica a cualquier
      país cuando un ministro ostenta dos departamentos. Quien prefiera contar
      ministros en lugar de ministerios debe leer 18 donde este sitio dice 19 para Polonia;
      la cifra de 22 asientos no cambia en ningún caso.
  - en: >-
      No Polish instrument enumerates the ministries the way Spain's Real Decreto 829/2023
      does. Article 39(1) of the ustawa o Radzie Ministrów has the Council of Ministers
      create, abolish and transform a ministry one at a time by rozporządzenie, and article
      33 has the Prime Minister fix each minister's remit by a separate rozporządzenie
      naming the branches of government administration the minister runs and the ministry
      that serves him. The enumeration used here is therefore built from two tier-1 layers.
      The presidential postanowienia published in Monitor Polski give the exact list of
      members of the Council of Ministers: the appointment of 13 December 2023 (M.P. 2023
      poz. 1383) with the dismissals and appointments of 24 July 2025 (M.P. 2025 poz. 689
      and 690) applied to it. The 18 in-force remit regulations then name the 19
      ministerstwa. The Council of Ministers has not changed since 24 July 2025: Monitor
      Polski contains no postanowienie o zmianie w składzie Rady Ministrów after that date,
      and the Chancellery's own composition page as archived on 25 July 2026 lists exactly
      these 22 offices.
    es: >-
      Ningún instrumento polaco enumera los ministerios como lo hace el Real Decreto
      829/2023 español. El artículo 39.1 de la ustawa o Radzie Ministrów encarga al Consejo
      de Ministros crear, suprimir y transformar cada ministerio de uno en uno mediante
      rozporządzenie, y el artículo 33 encarga al primer ministro fijar el ámbito de cada
      ministro mediante otro rozporządzenie que nombra los ramos de la administración que
      dirige y el ministerio que le atiende. La enumeración empleada aquí se construye por
      tanto con dos capas de nivel 1. Los postanowienia presidenciales publicados en el
      Monitor Polski dan la lista exacta de los miembros del Consejo de Ministros: el
      nombramiento del 13 de diciembre de 2023 (M.P. 2023 poz. 1383) con los ceses y
      nombramientos del 24 de julio de 2025 (M.P. 2025 poz. 689 y 690) aplicados sobre él.
      Los 18 reglamentos de ámbito vigentes nombran después los 19 ministerstwa. El Consejo
      de Ministros no ha cambiado desde el 24 de julio de 2025: el Monitor Polski no
      contiene ningún postanowienie o zmianie w składzie Rady Ministrów posterior a esa
      fecha, y la página de composición de la Cancillería, archivada el 25 de julio de
      2026, lista exactamente estos 22 cargos.
  - en: >-
      Kancelaria Prezesa Rady Ministrów is not a ministry and is not counted as one. It is
      an urząd constituted by article 26 of the ustawa o Radzie Ministrów to serve the
      Council of Ministers, the Prime Minister and the deputy prime ministers, it appears in
      no rozporządzenie creating a ministerstwo, and it is absent from the government's own
      directory of ministries. It is recorded because the Prime Minister sits in the Council
      of Ministers under article 147(1) of the Constitution without heading a department,
      which is the first reason the seat count exceeds the ministry count. Note that the
      Chancellery accounts for two of the 22 seats, not one: the Prime Minister's, recorded
      on this entity, and that of the Szef Kancelarii Prezesa Rady Ministrów, who is
      separately appointed a Minister – Członek Rady Ministrów and is recorded as a minister
      without portfolio further down the list.
    es: >-
      La Kancelaria Prezesa Rady Ministrów no es un ministerio y no se cuenta como tal. Es
      un urząd constituido por el artículo 26 de la ustawa o Radzie Ministrów para atender
      al Consejo de Ministros, al primer ministro y a los vicepresidentes, no aparece en
      ningún rozporządzenie de creación de un ministerstwo y está ausente del directorio
      gubernamental de ministerios. Se registra porque el primer ministro forma parte del
      Consejo de Ministros conforme al artículo 147.1 de la Constitución sin encabezar
      ningún departamento, y esa es la primera razón por la que los asientos superan a los
      ministerios. Adviértase que la Cancillería aporta dos de los 22 asientos, no uno: el
      del primer ministro, registrado en esta entidad, y el del Szef Kancelarii Prezesa Rady
      Ministrów, nombrado aparte Minister – Członek Rady Ministrów y registrado más abajo
      como ministro sin cartera.
  - en: >-
      Three members of the Council of Ministers hold a seat and no department. Article
      149(1) of the Constitution draws the line explicitly: ministers "kierują określonymi
      działami administracji rządowej lub wypełniają zadania wyznaczone im przez Prezesa
      Rady Ministrów" — they either run branches of government administration or carry out
      tasks assigned by the Prime Minister. The three in the second category are the
      Minister do spraw Nadzoru nad Wdrażaniem Polityki Rządu, the Minister – Członek Rady
      Ministrów who heads the Chancellery, and the Minister – Członek Rady Ministrów who
      coordinates the special services. Each has a remit regulation of his own, and each of
      those regulations ends with the same sentence: "Obsługę ministra zapewnia Kancelaria
      Prezesa Rady Ministrów." None of them is served by a ministry, so each is a cabinet
      seat and no ministry.
    es: >-
      Tres miembros del Consejo de Ministros ocupan asiento sin departamento. El artículo
      149.1 de la Constitución traza la frontera de manera explícita: los ministros
      «kierują określonymi działami administracji rządowej lub wypełniają zadania wyznaczone
      im przez Prezesa Rady Ministrów», es decir, o dirigen ramos de la administración
      gubernamental o desempeñan las tareas que les asigna el primer ministro. Los tres de
      la segunda categoría son el Minister do spraw Nadzoru nad Wdrażaniem Polityki Rządu,
      el Minister – Członek Rady Ministrów que dirige la Cancillería y el Minister – Członek
      Rady Ministrów que coordina los servicios especiales. Cada uno tiene su propio
      reglamento de ámbito, y todos terminan con la misma frase: «Obsługę ministra zapewnia
      Kancelaria Prezesa Rady Ministrów.» A ninguno le atiende un ministerio, de modo que
      cada uno es un asiento de gabinete y ningún ministerio.
  - en: >-
      The three deputy prime ministerships add neither a ministry nor a cabinet seat.
      Article 147(3) of the Constitution allows a deputy prime minister to hold a ministry
      as well, and all three currently do — national defence, foreign affairs and digital
      affairs. The postanowienie of 24 July 2025 appoints each of them "na urzędy Wiceprezesa
      Rady Ministrów i Ministra ...", one person and two offices, so each is counted once,
      through his ministry. Which ministers hold the deputy prime ministerships changes with
      reshuffles; the departmental structure does not, and only the latter is recorded here.
    es: >-
      Las tres vicepresidencias del Consejo de Ministros no añaden ni ministerio ni asiento.
      El artículo 147.3 de la Constitución permite que un vicepresidente ostente además un
      ministerio, y los tres actuales lo hacen: Defensa Nacional, Asuntos Exteriores y
      Digitalización. El postanowienie del 24 de julio de 2025 nombra a cada uno «na urzędy
      Wiceprezesa Rady Ministrów i Ministra …», una persona y dos cargos, por lo que cada
      uno se cuenta una sola vez, a través de su ministerio. Quién ostenta las
      vicepresidencias cambia con cada remodelación; la estructura departamental no, y aquí
      sólo se registra esta última.
  - en: >-
      Four structural changes happened during this cabinet's term and are recorded with
      their own start and end dates rather than by rewriting the list. Ministerstwo Edukacji i
      Nauki served both the Minister Edukacji and the Minister Nauki until 31 December 2023,
      and was split into Ministerstwo Edukacji Narodowej and Ministerstwo Nauki i
      Szkolnictwa Wyższego on 1 January 2024. Ministerstwo Przemysłu was created on 1 March
      2024 out of Ministerstwo Aktywów Państwowych. On 21 August 2025 Ministerstwo Przemysłu
      became Ministerstwo Energii, absorbing the energy units of Ministerstwo Klimatu i
      Środowiska. And the reconstruction of 24 July 2025 abolished four ministerial offices
      that had no department — European Union affairs, equality, senior policy and civil
      society — which is why the Council of Ministers went from 27 members to 22 without any
      ministry being abolished. Two consequences a reader should know. This page records
      departmental structure, not officeholders, so it does not reconstruct every personnel
      change: a replay of an earlier date will give the ministries in place then, but not
      necessarily every seat. And between 24 July and 20 August 2025 the Minister Energii
      was briefly served by two ministries — Ministerstwo Klimatu i Środowiska for energy and
      Ministerstwo Przemysłu for energy raw materials — because his remit regulation preceded
      the reorganisation of the ministries by four weeks.
    es: >-
      Durante esta legislatura se produjeron cuatro cambios estructurales, registrados con
      sus propias fechas de inicio y de fin en lugar de reescribiendo la lista. El Ministerstwo
      Edukacji i
      Nauki atendía tanto al Minister Edukacji como al Minister Nauki hasta el 31 de
      diciembre de 2023, y se escindió en Ministerstwo Edukacji Narodowej y Ministerstwo
      Nauki i Szkolnictwa Wyższego el 1 de enero de 2024. El Ministerstwo Przemysłu se creó
      el 1 de marzo de 2024 a partir del Ministerstwo Aktywów Państwowych. El 21 de agosto
      de 2025 el Ministerstwo Przemysłu se convirtió en Ministerstwo Energii, absorbiendo las
      unidades de energía del Ministerstwo Klimatu i Środowiska. Y la remodelación del 24 de
      julio de 2025 suprimió cuatro cargos ministeriales sin departamento —asuntos de la
      Unión Europea, igualdad, política sénior y sociedad civil—, razón por la cual el
      Consejo de Ministros pasó de 27 miembros a 22 sin que se suprimiera ningún ministerio.
      Dos consecuencias que conviene conocer. Esta ficha registra la estructura
      departamental, no a los titulares, por lo que no reconstruye cada cambio de personas:
      una reconstrucción de una fecha anterior dará los ministerios entonces existentes, pero
      no necesariamente todos los asientos. Y entre el 24 de julio y el 20 de agosto de 2025
      el Minister Energii estuvo atendido brevemente por dos ministerios —Ministerstwo
      Klimatu i Środowiska para energía y Ministerstwo Przemysłu para materias primas
      energéticas—, porque su reglamento de ámbito precedió en cuatro semanas a la
      reorganización de los ministerios.
  - en: >-
      In Poland the name of a ministry and the title of its minister are set by different
      instruments and do not always match, and both are kept here. The department called
      Ministerstwo Edukacji Narodowej is headed by a minister whose office is simply
      "Minister Edukacji"; the department called Ministerstwo Nauki i Szkolnictwa Wyższego
      was headed until January 2025 by a "Minister Nauki" and since then by a "Minister
      Nauki i Szkolnictwa Wyższego"; and the Minister Finansów i Gospodarki heads two
      departments, neither of which carries his title. The original name always gives the
      ministry as its own legal instrument spells it, never the minister's title.
    es: >-
      En Polonia el nombre de un ministerio y el título de su ministro los fijan
      instrumentos distintos y no siempre coinciden; aquí se conservan ambos. El
      departamento llamado Ministerstwo Edukacji Narodowej lo encabeza un ministro cuyo
      cargo es simplemente «Minister Edukacji»; el departamento llamado Ministerstwo Nauki i
      Szkolnictwa Wyższego lo encabezó hasta enero de 2025 un «Minister Nauki» y desde
      entonces un «Minister Nauki i Szkolnictwa Wyższego»; y el Minister Finansów i
      Gospodarki encabeza dos departamentos, ninguno de los cuales lleva su título.
      El nombre original da siempre el ministerio tal como lo escribe su propio instrumento
      jurídico, nunca el título del ministro.
  - en: >-
      All English and Spanish ministry names on this page are this project's own
      translations and are marked as such. Several Polish ministries do publish English
      pages under gov.pl, but the English titles there are not uniform, no consolidated
      official English list of ministry names exists, and an unverifiable claim of
      officialness is worse than an understated one. The original Polish name is shown
      alongside everywhere.
    es: >-
      Todos los nombres de ministerios en inglés y español de esta ficha son traducciones
      de este proyecto y se marcan como tales. Varios ministerios polacos publican páginas en
      inglés en gov.pl, pero los títulos ingleses no son uniformes, no existe ninguna lista
      oficial consolidada de nombres de ministerios en inglés y una afirmación de oficialidad
      no verificable es peor que una subestimada. El nombre polaco original se muestra
      siempre al lado.
  - en: >-
      One policy area could not be tagged, because this project has no area covering it.
      Ministerstwo Aktywów
      Państwowych runs the branch "łączność", which article 16 of the ustawa o działach
      administracji rządowej defines as postal affairs — "Dział łączność obejmuje sprawy
      poczty." This project has a telecommunications area but none for postal services, and
      the telecommunications area would be the wrong one here: under article 12a of the same
      statute telecommunications belongs to the branch "informatyzacja" and therefore to
      Ministerstwo Cyfryzacji. The state-assets ministry consequently carries the
      state-assets area alone, and its postal remit is invisible in the comparison views.
    es: >-
      Un área de política no ha podido etiquetarse, porque este proyecto no tiene ningún área
      que la cubra. El
      Ministerstwo Aktywów Państwowych dirige el ramo «łączność», que el artículo 16 de la
      ustawa o działach administracji rządowej define como asuntos postales: «Dział łączność
      obejmuje sprawy poczty.» Este proyecto tiene un área de telecomunicaciones pero ninguna
      para los servicios postales, y la de telecomunicaciones sería aquí la equivocada:
      conforme al artículo 12a de la misma ley las telecomunicaciones pertenecen al ramo
      «informatyzacja» y por tanto al Ministerstwo Cyfryzacji. En consecuencia el ministerio
      de activos estatales sólo lleva el área de patrimonio estatal, y su competencia postal
      es invisible en las vistas comparativas.

