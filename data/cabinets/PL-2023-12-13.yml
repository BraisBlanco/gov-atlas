        Recorded for the historical record with no seat, because this file does not
        reconstruct the December 2023 allocation of ministers to offices.
      es: >-
        Departamento de este gobierno durante sus primeros diecinueve días. Atendía a dos
        ministros a la vez —el Minister Edukacji y el Minister Nauki— y el 1 de enero de 2024
        se escindió en Ministerstwo Edukacji Narodowej y Ministerstwo Nauki i Szkolnictwa
        Wyższego. Se registra para el histórico sin asiento, porque este fichero no
        reconstruye el reparto de ministros por cargos de diciembre de 2023.

