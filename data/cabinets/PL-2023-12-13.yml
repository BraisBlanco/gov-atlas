  - id: du-2025-1047-berek
    tier: 1
    type: official_gazette
    publisher: Dziennik Ustaw Rzeczypospolitej Polskiej
    title: >-
      Rozporządzenie Prezesa Rady Ministrów z dnia 31 lipca 2025 r. w sprawie szczegółowego
      zakresu działania Ministra do spraw Nadzoru nad Wdrażaniem Polityki Rządu
      (Dz.U. 2025 poz. 1047)
    url: https://dziennikustaw.gov.pl/D2025000104701.pdf
    archive_url: https://web.archive.org/web/20250731183532/https://dziennikustaw.gov.pl/D2025000104701.pdf
    lang: pl
    published: 2025-07-31
    accessed: 2026-07-28
    quote: |-
      § 1. Minister do spraw Nadzoru nad Wdrażaniem Polityki Rządu, zwany dalej „ministrem”, jest właściwy do spraw koordynowania i monitorowania realizacji polityki Rządu oraz koordynowania rządowego procesu legislacyjnego.
      § 2. Do zakresu działania ministra należy:
      1) kierowanie pracami Stałego Komitetu Rady Ministrów;
      2) kierowanie pracami Komitetu Rady Ministrów do spraw Nadzoru nad Wdrażaniem Polityki Rządu;
      3) koordynowanie i monitorowanie wdrażania priorytetowych zadań realizujących politykę Rządu;
      4) współpraca z Zespołem do spraw Programowania Prac Rządu;
      5) kierowanie pracami:
      a) Zespołu do spraw koordynacji procesu legislacyjnego wdrażającego deregulację,
      b) Zespołu „e-Legislacja”;
      6) wykonywanie innych zadań zleconych przez Radę Ministrów lub Prezesa Rady Ministrów.
      § 5. Obsługę ministra zapewnia Kancelaria Prezesa Rady Ministrów.
    note: >-
      The remit of the third minister without a department, and the office that replaced
      the generic "Minister – Członek Rady Ministrów" the same person held from December
      2023. He coordinates government policy and the legislative process; § 5 confirms the
      Chancellery serves him. Paragraphs 3 and 4 are omitted from the quote as immaterial.

