    sources: [du-2025-997-mfig, mp-2023-1383, mp-2025-690, gov-pl-ministerstwa]
    note:
      en: >-
        One of the two ministries that serve the Minister Finansów i Gospodarki. Under
        § 1(4)(2) of Dz.U. 2025 poz. 997 this one covers the budget, public finances and
        financial institutions. Counted as a ministry and linked to Ministerstwo Rozwoju i
        Technologii through shared_head_with, so the pair is two ministries and one cabinet
        seat. Until 24 July 2025 its minister's title was simply "Minister Finansów"; the
        ministry's name has not changed.
      es: >-
        Uno de los dos ministerios que atienden al Minister Finansów i Gospodarki. Conforme
        al § 1.4.2 del Dz.U. 2025 poz. 997, a este le corresponden el presupuesto, las
        finanzas públicas y las instituciones financieras. Se cuenta como ministerio y se
        vincula al Ministerstwo Rozwoju i Technologii mediante shared_head_with, de modo que
        el par son dos ministerios y un solo asiento. Hasta el 24 de julio de 2025 el título
        de su ministro era simplemente «Minister Finansów»; el nombre del ministerio no ha
        cambiado.

  - id: PL-2023-rozwoju-i-technologii
    order: 9
    name_original: Ministerstwo Rozwoju i Technologii
    abbreviation_original: MRiT
    name_en: Ministry of Development and Technology
    name_es: Ministerio de Desarrollo y Tecnología
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Minister
    head_title_en: Minister
    has_cabinet_seat: true
    shared_head_with: [PL-2023-finansow]
    policy_areas: [economy, industry, trade, small_business, housing, spatial_planning]
    counts_as_ministry: true
    url: https://www.gov.pl/web/rozwoj-technologia
    sources: [du-2025-997-mfig, ustawa-o-dzialach-administracji-rzadowej, mp-2023-1383, gov-pl-ministerstwa, gov-pl-rozwoj-technologia]
    note:
      en: >-
        The other ministry serving the Minister Finansów i Gospodarki, covering the economy
        and construction, spatial planning and housing under § 1(4)(1) of Dz.U. 2025
        poz. 997. Until 24 July 2025 it had a minister of its own, the Minister Rozwoju i
        Technologii; since then it has shared the finance minister, but it was not abolished,
        merged or renamed, and the Prime Minister gave it a fresh statute on 23 January
        2026. This is the entity a curator counting ministers rather than ministries would
        drop, taking Poland from 19 to 18. The policy areas follow the branches it serves:
        article 9 of the ustawa o działach puts entrepreneurship and industry, foreign
        economic cooperation and innovation inside "gospodarka".
      es: >-
        El otro ministerio que atiende al Minister Finansów i Gospodarki, con la economía y
        la construcción, la ordenación del territorio y la vivienda conforme al § 1.4.1 del
        Dz.U. 2025 poz. 997. Hasta el 24 de julio de 2025 tuvo ministro propio, el Minister
        Rozwoju i Technologii; desde entonces comparte al ministro de Hacienda, pero no fue
        suprimido, fusionado ni renombrado, y el primer ministro le aprobó un nuevo estatuto
        el 23 de enero de 2026. Esta es la entidad que suprimiría un curador que contase
        ministros en vez de ministerios, llevando a Polonia de 19 a 18. Las áreas de
        política siguen los ramos que atiende: el artículo 9 de la ustawa o działach sitúa
        el emprendimiento y la industria, la cooperación económica exterior y la innovación
        dentro de «gospodarka».

