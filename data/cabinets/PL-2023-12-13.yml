entities:
  # --- recorded, not counted: the head of government's office -------------------------
  - id: PL-2023-kprm
    order: 1
    name_original: Kancelaria Prezesa Rady Ministrów
    abbreviation_original: KPRM
    name_en: Chancellery of the Prime Minister
    name_es: Cancillería del Presidente del Consejo de Ministros
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Prezes Rady Ministrów
    head_title_en: Prime Minister
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://www.gov.pl/web/premier
    sources: [konstytucja-rp-1997, ustawa-o-radzie-ministrow, mp-2023-1382, gov-pl-sklad-rady-ministrow]
    note:
      en: >-
        Not a ministry: article 26 of the ustawa o Radzie Ministrów constitutes it as the
        office that serves the Council of Ministers, the Prime Minister and the deputy prime
        ministers, no rozporządzenie under article 39 created it as a ministerstwo, and the
        government's own directory of ministries does not list it. It is recorded because
        article 147(1) of the Constitution puts the Prime Minister in the Council of
        Ministers, and that seat is carried here. The Chancellery also serves the three
        ministers without portfolio, whose seats are recorded on their own entries; the seat
        of the Szef Kancelarii, who is himself a Minister – Członek Rady Ministrów, is one of
        those.
      es: >-
        No es un ministerio: el artículo 26 de la ustawa o Radzie Ministrów lo constituye
        como la oficina que atiende al Consejo de Ministros, al primer ministro y a los
        vicepresidentes, ningún rozporządzenie del artículo 39 lo creó como ministerstwo y
        el directorio gubernamental de ministerios no lo lista. Se registra porque el
        artículo 147.1 de la Constitución incorpora al primer ministro al Consejo de
        Ministros, y ese asiento se imputa aquí. La Cancillería atiende además a los tres
        ministros sin cartera, cuyos asientos figuran en sus propias entradas; el del Szef
        Kancelarii, que es a su vez Minister – Członek Rady Ministrów, es uno de ellos.

  # --- counted ministries, in the Chancellery's own listing order ----------------------
  - id: PL-2023-obrony-narodowej
    order: 2
    name_original: Ministerstwo Obrony Narodowej
