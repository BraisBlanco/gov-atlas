    counts_as_ministry: true
    url: https://www.gov.pl/web/mswia
    sources: [du-2025-999-mswia, ustawa-o-dzialach-administracji-rzadowej, mp-2023-1383, mp-2025-690, gov-pl-ministerstwa]
    note:
      en: >-
        Poland has no migration ministry and no civil protection ministry: article 29 of the
        ustawa o działach puts border control, aliens and the coordination of migration
        policy, crisis management, civil protection and fire safety inside the branch
        "sprawy wewnętrzne", and the head of the Urząd do Spraw Cudzoziemców reports to this
        minister. Religious affairs and national minorities are a branch of their own under
        article 30, and the administrative division of the state and the integrated
        provincial administration sit in "administracja publiczna" under article 6.
      es: >-
        Polonia no tiene ministerio de migración ni de protección civil: el artículo 29 de
        la ustawa o działach sitúa el control de fronteras, los extranjeros y la coordinación
        de la política migratoria, la gestión de crisis, la protección civil y la seguridad
        contra incendios dentro del ramo «sprawy wewnętrzne», y el jefe del Urząd do Spraw
        Cudzoziemców depende de este ministro. Los asuntos religiosos y las minorías
        nacionales son un ramo propio conforme al artículo 30, y la división administrativa
        del Estado y la administración estatal integrada en la provincia están en
        «administracja publiczna» conforme al artículo 6.

