      8a) klimat;
      9) kultura i ochrona dziedzictwa narodowego;
      10) kultura fizyczna;
      11) łączność;
      14) obrona narodowa;
      15) oświata i wychowanie;
      16) praca;
      17) rolnictwo;
      18) rozwój wsi;
      18a) rozwój regionalny;
      18b) rynki rolne;
      18c) rybołówstwo;
      20) sprawiedliwość;
      21) szkolnictwo wyższe i nauka;
      22) transport;
      22a) turystyka;
      23) środowisko;
      23a) rodzina;
      24) sprawy wewnętrzne;
      25) wyznania religijne oraz mniejszości narodowe i etniczne;
      26) zabezpieczenie społeczne;
      27) sprawy zagraniczne;
      28) zdrowie;
      29) żegluga śródlądowa.
    note: >-
      The statutory list of the 35 branches of government administration, quoted in full.
      This is not a list of ministries — a branch is a competence, a ministry is an office,
      and the two do not map one to one: the branch "łączność" is postal affairs and sits
      with the state-assets ministry, telecommunications sits inside "informatyzacja", and
      the 35 branches are distributed across 18 portfolio ministers. It is cited as the
      authority for the policy_areas tagging, because each remit regulation below assigns
      branches from this list, and articles 6 to 33 define what each branch contains.
      Repealed items 12, 13 and 19 are omitted from the quote.

