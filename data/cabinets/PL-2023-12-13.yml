        ministerio ni asiento. Las telecomunicaciones se etiquetan aquí y no en el
        ministerio de activos estatales: el artículo 12a de la ustawa o działach sitúa las
        telecomunicaciones y el regulador de comunicaciones electrónicas dentro del ramo
        «informatyzacja».

