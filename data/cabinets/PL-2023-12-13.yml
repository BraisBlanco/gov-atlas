  # --- constitutional and statutory framework -----------------------------------------
  - id: konstytucja-rp-1997
    tier: 1
    type: statute
    publisher: Kancelaria Sejmu — Internetowy System Aktów Prawnych
    title: >-
      Konstytucja Rzeczypospolitej Polskiej z dnia 2 kwietnia 1997 r. (Dz.U. 1997 nr 78
      poz. 483), tekst ujednolicony, art. 147 i 149
    url: https://isap.sejm.gov.pl/isap.nsf/download.xsp/WDU19970780483/U/D19970483Lj.pdf
    archive_url: https://web.archive.org/web/20260717075837/https://isap.sejm.gov.pl/isap.nsf/download.xsp/WDU19970780483/U/D19970483Lj.pdf
    lang: pl
    published: 1997-07-16
    accessed: 2026-07-28
    quote: |-
      Art. 147. 1. Rada Ministrów składa się z Prezesa Rady Ministrów i ministrów.
      2. W skład Rady Ministrów mogą być powoływani wiceprezesi Rady Ministrów.
      3. Prezes i wiceprezes Rady Ministrów mogą pełnić także funkcję ministra.
      4. W skład Rady Ministrów mogą być ponadto powoływani przewodniczący określonych w ustawach komitetów.
      Art. 149. 1. Ministrowie kierują określonymi działami administracji rządowej lub wypełniają zadania wyznaczone im przez Prezesa Rady Ministrów. Zakres działania ministra kierującego działem administracji rządowej określają ustawy.
    note: >-
      Two articles that settle four questions in this file. Article 147(1) puts the Prime
      Minister in the Council of Ministers without giving him a department, which is why the
      seat count exceeds the ministry count. Article 147(3) makes a deputy prime
      ministership a second office of the same person rather than an extra seat. Article
      149(1) is the constitutional basis for the distinction this dataset draws between a
      minister who runs a branch of government administration and one who merely carries out
      tasks assigned by the Prime Minister — the latter is a seat and no ministry. Quoted
      from the Sejm Chancellery's consolidated text; hyphenation that the typesetting
      introduces mid-word is closed up and no words are altered. The live URL is served
      behind a bot filter, so the archived copy is the readable one.

  - id: ustawa-o-radzie-ministrow
    tier: 1
    type: statute
    publisher: Dziennik Ustaw Rzeczypospolitej Polskiej
    title: >-
      Ustawa z dnia 8 sierpnia 1996 r. o Radzie Ministrów, tekst jednolity
      (Dz.U. 2025 poz. 780), art. 26, 33 i 39
    url: https://api.sejm.gov.pl/eli/acts/DU/2025/780/text.pdf
    archive_url: https://web.archive.org/web/20260728110845/https://api.sejm.gov.pl/eli/acts/DU/2025/780/text.pdf
    lang: pl
    published: 2025-06-17
    accessed: 2026-07-28
    quote: |-
      Art. 26. 1. Kancelaria Prezesa Rady Ministrów, zwana dalej „Kancelarią”, zapewnia obsługę:
      1) Rady Ministrów i Prezesa Rady Ministrów;
      2) wiceprezesów Rady Ministrów;
      4) Kolegium do Spraw Służb Specjalnych;
      6) Szefa Służby Cywilnej.
      Art. 33. 1. Prezes Rady Ministrów ustala, w drodze rozporządzenia:
      1) szczegółowy zakres działania ministra, niezwłocznie po powołaniu Rady Ministrów, a jeżeli minister został powołany w innym czasie – niezwłocznie po jego powołaniu;
      2) ministerstwo lub inny urząd administracji rządowej, który ma obsługiwać ministra, a w wypadku ministra kierującego określonym działem administracji rządowej – również organy jemu podległe lub przez niego nadzorowane, z zastrzeżeniem art. 34 ust. 2.
      Art. 39. 1. Ministerstwo tworzy, znosi lub przekształca Rada Ministrów, w drodze rozporządzenia.
    note: >-
      The consolidated text in force during the period covered here. Article 39(1) is why
      there is no Polish equivalent of Real Decreto 829/2023: a ministry is created,
      abolished or transformed one at a time, so the set of ministries has to be assembled
      from the individual instruments. Article 33(1) is why the remit regulations cited below
      are the authority for which ministry serves which minister — and, at point 2, why a
      minister may lawfully be served by an urząd that is not a ministry, which is the case
      for the three ministers without portfolio. Article 26 constitutes the Chancellery and
      shows what it is: the office that serves the Council of Ministers and the Prime
      Minister, not a department of its own. Numbered points 3 and 5 of article 26(1) are
      repealed and are omitted from the quote. The document's canonical address is
      https://dziennikustaw.gov.pl/D2025000078001.pdf, but the only Wayback record of that
      address is corrupt and 404s on playback, so the URL cited is the Sejm Chancellery's ELI
      service, which serves the identical authentic PDF (D20250780.pdf).

  - id: ustawa-o-dzialach-administracji-rzadowej
    tier: 1
    type: statute
    publisher: Dziennik Ustaw Rzeczypospolitej Polskiej
    title: >-
