    tier: 1
    type: official_gazette
    publisher: Dziennik Ustaw Rzeczypospolitej Polskiej
    title: >-
      Rozporządzenie Rady Ministrów z dnia 16 grudnia 2023 r. w sprawie utworzenia
      Ministerstwa Nauki i Szkolnictwa Wyższego (Dz.U. 2023 poz. 2695)
    url: https://dziennikustaw.gov.pl/D2023000269501.pdf
