  - id: regeringen-tva-nya-departement-2022
    tier: 2
    type: government_website
    publisher: Regeringskansliet (regeringen.se)
    title: Två nya departement bildas 1 januari 2023 — pressmeddelande
    url: https://www.regeringen.se/pressmeddelanden/2022/10/tva-nya-departement-bildas-1-januari-2023/
    archive_url: https://web.archive.org/web/20260727234201/https://www.regeringen.se/pressmeddelanden/2022/10/tva-nya-departement-bildas-1-januari-2023/
    lang: sv
    published: 2022-10-23
    accessed: 2026-07-28
    quote: |-
      (Ny version) Vid årsskiftet kommer ansvaret för klimat- och näringslivsfrågor respektive landsbygds- och infrastrukturfrågor att samlas i två nya departement. Fram till dess finns berörda departement kvar i sin nuvarande form.
      Ombildningen sker för att sätta ljus på klimat- och energifrågan. Det nya Klimat- och näringslivsdepartementet kommer att samla kompetensen och erfarenheten inom energi-, klimat, miljö- och näringsfrågorna.
      Det nya Landsbygds- och infrastrukturdepartementet kommer att samla kompetensen och erfarenheten inom landsbygds-, skogs-, transport- och bostadsfrågorna.
    note: >-
      Cited for the mid-term change: the date the two new departments were formed, the areas
      each was to gather, and the fact that the departments they replaced remained in their
      existing form until the turn of the year ("Fram till dess finns berörda departement kvar
      i sin nuvarande form"). Together with the amendment annotation in § 2 of the instruction
      this is the basis for valid_from 2023-01-01 on the two new departments and valid_to
      2022-12-31 on the three they replaced. The three quoted paragraphs are the release's
      first, second and fourth; the third and fifth are quotations from two ministers and are
      omitted.

