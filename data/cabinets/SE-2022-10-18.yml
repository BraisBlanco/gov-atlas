      es: >-
        Departamento de este gobierno hasta el 31 de diciembre de 2022. Sus asuntos se
        repartieron entre el nuevo Klimat- och näringslivsdepartementet (empresa e industria) y
        el nuevo Landsbygds- och infrastrukturdepartementet (mundo rural y bosques). Se
        registra para el histórico, sin asiento —véase la nota del Miljödepartementet—.

