    policy_areas: [foreign_affairs, development_cooperation, trade]
    counts_as_ministry: true
    url: https://www.regeringen.se/sveriges-regering/utrikesdepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden]
    note:
      en: >-
        Two ministers: the Minister for Foreign Affairs and the Minister for International
        Development Cooperation and Foreign Trade, which is where the development_cooperation
        and trade tags come from. Not tagged european_affairs — that portfolio sits in
        Statsrådsberedningen. § 3 of the instruction adds that the foreign service consists of
        this department and Sweden's missions abroad, which are not separate entities.
      es: >-
        Dos ministros: la de Asuntos Exteriores y el de Cooperación al Desarrollo y Comercio
        Exterior, de donde vienen las etiquetas development_cooperation y trade. No se
        etiqueta european_affairs: esa cartera está en la Statsrådsberedningen. El § 3 de la
        instrucción añade que el servicio exterior está formado por este departamento y las
        representaciones suecas en el extranjero, que no son entidades aparte.

  - id: SE-2022-forsvarsdepartementet
    order: 4
    name_original: Försvarsdepartementet
    abbreviation_original: Fö
    name_en: Ministry of Defence
    name_es: Ministerio de Defensa
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Försvarsminister
    head_title_en: Minister for Defence
    has_cabinet_seat: true
    head_count: 2
    policy_areas: [defence, civil_protection]
    counts_as_ministry: true
    url: https://www.regeringen.se/sveriges-regering/forsvarsdepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden]
    note:
      en: >-
        Tagged civil_protection because the department's second minister is the Minister for
        Civil Defence, a post created for Sweden's total-defence build-up; civil emergency
        preparedness is therefore in the defence department rather than in a separate ministry
        as in Denmark.
      es: >-
        Se etiqueta civil_protection porque el segundo ministro del departamento es el ministro
        de Defensa Civil, puesto creado para el desarrollo de la defensa total sueca; la
        protección civil está por tanto en el departamento de defensa y no en un ministerio
        aparte como en Dinamarca.

  - id: SE-2022-socialdepartementet
    order: 5
    name_original: Socialdepartementet
    abbreviation_original: S
    name_en: Ministry of Health and Social Affairs
    name_es: Ministerio de Sanidad y Asuntos Sociales
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Socialminister
    head_title_en: Minister for Social Affairs and Public Health
    has_cabinet_seat: true
    head_count: 4
    policy_areas: [social_affairs, health, social_security, elderly, sport]
    counts_as_ministry: true
    url: https://www.regeringen.se/sveriges-regering/socialdepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden, regeringen-civila-samhallet-och-idrott]
    note:
      en: >-
        The largest department by ministers: four of the twenty-four statsråd serve here — for
        social affairs and public health, for older people and social insurance, for social
        services and for health care. It is one department and one ministry all the same.
        Sport and civil society are tagged here rather than on Kulturdepartementet on the
        government's own attribution.
      es: >-
        El departamento con más ministros: cuatro de los veinticuatro statsråd sirven aquí —de
        Asuntos Sociales y Salud Pública, de Mayores y Seguros Sociales, de Servicios Sociales
        y de Sanidad—. Sigue siendo un departamento y un ministerio. El deporte y la sociedad
        civil se etiquetan aquí y no en el Kulturdepartementet según la adscripción del propio
        gobierno.

  - id: SE-2022-finansdepartementet
    order: 6
    name_original: Finansdepartementet
    abbreviation_original: Fi
    name_en: Ministry of Finance
    name_es: Ministerio de Finanzas
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Finansminister
    head_title_en: Minister for Finance
    has_cabinet_seat: true
    head_count: 3
    policy_areas: [finance, budget, public_administration, digital, territorial_administration]
    counts_as_ministry: true
    url: https://www.regeringen.se/sveriges-regering/finansdepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden, regeringen-digitaliseringspolitik]
    note:
      en: >-
        Three ministers: for finance, for public administration (civilminister) and for
        financial markets. The civilminister's remit is why this department carries the
        public_administration, digital and territorial_administration tags — central
        government administration, digitalisation policy and the relationship with
        municipalities and regions all sit here, none of them visible in the department's
        name. Taxation is also this department's, which is the opposite of the Danish
        arrangement.
      es: >-
        Tres ministros: de Finanzas, de Administración Pública (civilminister) y de Mercados
        Financieros. El ámbito del civilminister explica las etiquetas public_administration,
        digital y territorial_administration: la administración del Estado, la política de
        digitalización y la relación con municipios y regiones están aquí, y ninguna se
        aprecia en el nombre del departamento. La fiscalidad también corresponde a este
        departamento, al contrario que en Dinamarca.

  - id: SE-2022-utbildningsdepartementet
    order: 7
    name_original: Utbildningsdepartementet
    abbreviation_original: U
    name_en: Ministry of Education and Research
    name_es: Ministerio de Educación e Investigación
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Utbildnings- och integrationsminister
    head_title_en: Minister for Education and Integration
    has_cabinet_seat: true
    head_count: 2
    policy_areas: [education, higher_education, research]
    counts_as_ministry: true
    url: https://www.regeringen.se/sveriges-regering/utbildningsdepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden]
    note:
      en: >-
        Two ministers: for education and integration, and for upper-secondary school, higher
        education and research. Integration policy therefore sits in the education department,
        an arrangement no other country in this dataset shares; there is no integration area
        in the taxonomy, which is recorded in the hand-off notes.
      es: >-
        Dos ministros: de Educación e Integración, y de Bachillerato, Universidades e
        Investigación. La política de integración se sitúa por tanto en el departamento de
        educación, algo que no comparte ningún otro país de este dataset; la taxonomía no
        tiene un área de integración, lo que queda anotado en las notas de entrega.

  - id: SE-2022-klimat-och-naringslivsdepartementet
    order: 8
    name_original: Klimat- och näringslivsdepartementet
    abbreviation_original: KN
    name_en: Ministry of Climate and Enterprise
    name_es: Ministerio de Clima y Empresa
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Energi- och näringsminister
    head_title_en: Minister for Energy, Business and Industry
    has_cabinet_seat: true
    head_count: 2
    policy_areas: [climate, economy, energy, environment, industry]
    counts_as_ministry: true
    valid_from: 2023-01-01
    url: https://www.regeringen.se/sveriges-regering/klimat--och-naringslivsdepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden, regeringen-tva-nya-departement-2022]
    note:
      en: >-
        Created on 1 January 2023, which is why valid_from is set: it gathered energy,
        climate, environment and business affairs from the abolished Miljödepartementet,
        Näringsdepartementet and Infrastrukturdepartementet. Its head is the Minister for
        Energy, Business and Industry, who is also Deputy Prime Minister — a personal rank
        that adds neither a ministry nor a seat — and its second minister is the Minister for
        Climate and the Environment. Sweden thus has climate and environment in the same
        department as industrial policy, which is the arrangement the reorganisation was
        announced to create.
      es: >-
        Creado el 1 de enero de 2023, y por eso lleva valid_from: reunió los asuntos de
        energía, clima, medio ambiente y empresa procedentes de los suprimidos
        Miljödepartementet, Näringsdepartementet e Infrastrukturdepartementet. Su titular es la
        ministra de Energía y Empresa, que es además vicepresidenta del gobierno —rango
        personal que no añade ni ministerio ni asiento—, y su segunda ministra es la de Clima y
        Medio Ambiente. Suecia tiene así el clima y el medio ambiente en el mismo departamento
        que la política industrial, que es precisamente el arreglo que se anunció con la
        reorganización.

  - id: SE-2022-kulturdepartementet
    order: 9
    name_original: Kulturdepartementet
