    policy_areas: [culture, media]
    counts_as_ministry: true
    url: https://www.regeringen.se/sveriges-regering/kulturdepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden, regeringen-civila-samhallet-och-idrott]
    note:
      en: >-
        The only department with a single minister. Not tagged sport: responsibility for sport
        and civil society lies with the socialminister, per the government's own policy-area
        page, unlike in most of the countries in this dataset.
      es: >-
        El único departamento con un solo ministro. No se etiqueta sport: la responsabilidad
        del deporte y la sociedad civil corresponde al socialminister, según la propia página
        de área del gobierno, a diferencia de la mayoría de los países de este dataset.

  - id: SE-2022-arbetsmarknadsdepartementet
    order: 10
    name_original: Arbetsmarknadsdepartementet
    abbreviation_original: A
    name_en: Ministry of Employment
    name_es: Ministerio de Empleo
    name_en_provenance: official
