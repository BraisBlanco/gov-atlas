    url: https://www.regeringen.se/sveriges-regering/arbetsmarknadsdepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden]
    note:
      en: >-
        Tagged equality because the department's second minister is the Minister for Gender
        Equality; Sweden has no equality department. Note that unemployment insurance and
        pensions are not here but in Socialdepartementet, so social_security is tagged there.
      es: >-
        Se etiqueta equality porque la segunda ministra del departamento es la de Igualdad;
        Suecia no tiene un departamento de igualdad. Nótese que el seguro de desempleo y las
        pensiones no están aquí sino en el Socialdepartementet, por lo que social_security se
        etiqueta allí.

  - id: SE-2022-landsbygds-och-infrastrukturdepartementet
    order: 11
    name_original: Landsbygds- och infrastrukturdepartementet
    abbreviation_original: LI
    name_en: Ministry of Rural Affairs and Infrastructure
    name_es: Ministerio de Territorio Rural e Infraestructuras
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Landsbygdsminister
    head_title_en: Minister for Rural Affairs
    has_cabinet_seat: true
    head_count: 2
    policy_areas: [rural_development, agriculture, forestry, fisheries, transport, infrastructure, housing, spatial_planning]
    counts_as_ministry: true
    valid_from: 2023-01-01
    url: https://www.regeringen.se/sveriges-regering/landsbygds--och-infrastrukturdepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden, regeringen-tva-nya-departement-2022, regeringen-bostader-och-samhallsplanering]
    note:
      en: >-
        Created on 1 January 2023 to gather rural affairs, forestry, transport and housing,
        which is why valid_from is set and why the tag list is the longest in this file.
        Sweden has no agriculture ministry and no transport ministry as such: both portfolios
        are here, together with fisheries, housing and spatial planning. Two ministers: for
        rural affairs, and for infrastructure and housing.
      es: >-
        Creado el 1 de enero de 2023 para reunir el mundo rural, los bosques, el transporte y
        la vivienda; de ahí el valid_from y la lista de etiquetas más larga del fichero. Suecia
        no tiene ministerio de agricultura ni de transporte como tales: ambas carteras están
        aquí, junto con la pesca, la vivienda y la ordenación del territorio. Dos ministros: de
        Mundo Rural, y de Infraestructuras y Vivienda.

  # --- recorded, not counted: the administrative division ------------------------------
  - id: SE-2022-forvaltningsavdelningen
    order: 12
    name_original: Regeringskansliets förvaltningsavdelning
    abbreviation_original: FA
    name_en: Office for Administrative Affairs of the Government Offices
    name_es: División Administrativa de la Oficina de Gobierno
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Förvaltningschef
    head_title_en: Director of Administrative Affairs
    has_cabinet_seat: false
    head_count: 0
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://www.regeringen.se/regeringskansliet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering]
    note:
      en: >-
        The twelfth entry in § 2 of the instruction, and the reason the instruction adds that
        what it says about a departement applies to the förvaltningsavdelning too. It provides
        shared services — premises, IT, HR, archives — to the whole Regeringskansliet, is
        headed by a civil servant and has no minister, so it is recorded and not counted. It
        appears in no list of Swedish ministers, which is why it carries no seat.
      es: >-
        La duodécima entrada del § 2 de la instrucción, y la razón de que la instrucción añada
        que lo que dice de un departement se aplica también a la förvaltningsavdelning. Presta
        servicios comunes —inmuebles, informática, personal, archivos— a todo el
        Regeringskansliet, está dirigida por un funcionario y no tiene ministro, por lo que se
        registra y no se cuenta. No aparece en ninguna lista de ministros suecos, y por eso no
        lleva asiento.

