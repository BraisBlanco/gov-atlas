entities:
  # --- Statsrådsberedningen: recorded, not counted -------------------------------------
  - id: SE-2022-statsradsberedningen
    order: 1
    name_original: Statsrådsberedningen
    abbreviation_original: SB
    name_en: Prime Minister's Office
    name_es: Oficina del Primer Ministro
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Statsminister
    head_title_en: Prime Minister
    has_cabinet_seat: true
    head_count: 2
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://www.regeringen.se/sveriges-regering/statsradsberedningen/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden]
    note:
      en: >-
        Excluded as the office of the head of government. § 2 of the instruction lists it
        alongside the departments and adds that what the instruction says about a departement
        applies to Statsrådsberedningen too, but it is the Prime Minister's own staff and the
        apex of the government rather than a portfolio department, and no Swedish statute
        constitutes it as a ministry. Counting it would give Sweden 11 ministries instead of
        10. Two seats, not one: the Prime Minister and the Minister for EU Affairs both sit
        here, which is why Sweden's EU portfolio appears in no counted department.
      es: >-
        Excluida como oficina del jefe de gobierno. El § 2 de la instrucción la enumera junto a
        los departamentos y añade que lo que la instrucción dice de un departement se aplica
        también a la Statsrådsberedningen, pero es el gabinete propio del primer ministro y la
        cúspide del gobierno, no un departamento con cartera, y ninguna ley sueca la
        constituye como ministerio. Contarla daría 11 ministerios en lugar de 10. Dos asientos
        y no uno: aquí se sitúan el primer ministro y la ministra de Asuntos Europeos, razón
        por la que la cartera europea sueca no aparece en ningún departamento contado.

  # --- the ten counted departments, in the order of § 2 of the instruction --------------
  - id: SE-2022-justitiedepartementet
    order: 2
    name_original: Justitiedepartementet
    abbreviation_original: Ju
    name_en: Ministry of Justice
    name_es: Ministerio de Justicia
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Justitieminister
    head_title_en: Minister for Justice
    has_cabinet_seat: true
    head_count: 2
    policy_areas: [justice, interior, migration]
    counts_as_ministry: true
    url: https://www.regeringen.se/sveriges-regering/justitiedepartementet/
    sources: [sfs-1996-1515, regeringen-sveriges-regering, government-se-government-of-sweden]
    note:
      en: >-
        Tagged interior as well as justice because the police, Säpo and crime prevention
        belong here: Sweden has no separate interior ministry. Migration is tagged because the
        second of the department's two ministers is the Minister for Migration; there is no
        migration department.
      es: >-
        Se etiqueta interior además de justice porque la policía, el Säpo y la prevención del
        delito corresponden aquí: Suecia no tiene un ministerio del interior propio. Se
        etiqueta migration porque el segundo de los dos ministros del departamento es el
        ministro de Migración; no existe un departamento de migración.

