        competencias de clima y medio ambiente se reunieron en el nuevo Klimat- och
        näringslivsdepartementet. Ya no figura en el § 2 de la instrucción, modificado con
        efecto desde el 1 de enero de 2023. Se registra para el histórico, sin asiento porque
        este fichero no reconstruye el reparto de ministros anterior a 2023.

