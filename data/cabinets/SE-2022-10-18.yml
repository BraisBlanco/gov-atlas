# Sweden — government structure of regeringen Kristersson.
#
# See docs/DATA-CONTRACT.md. Three things worth knowing before reading the list:
#
#   1. Sweden is the country where ministries and ministers come apart hardest. The
#      government office (Regeringskansliet) is a single authority divided into
#      departments, and § 2 of its instruction — förordning (1996:1515) — enumerates them.
#      There are ten departments plus the Prime Minister's Office (Statsrådsberedningen)
#      and an administrative division that is not a department in the ordinary sense. There
#      are 24 ministers. Sweden therefore publishes 10 ministries and 24 cabinet seats.
#   2. Several ministers sit in one department. That is not a Swedish curiosity but the
#      normal arrangement: the Socialdepartementet has four ministers, the
#      Finansdepartementet three. Each department's `head_count` is the number of ministers
#      serving in it, which is what makes the seat count come out at 24.
#   3. This cabinet took office on 18 October 2022 with a different department structure.
#      On 1 January 2023 the Miljö-, Närings- and Infrastrukturdepartementet were replaced
#      by the Klimat- och näringslivsdepartementet and the Landsbygds- och
#      infrastrukturdepartementet. The old three are recorded below with `valid_to`, the new
#      two with `valid_from`.

country: SE
cabinet_id: SE-2022-10-18

cabinet_name_original: Regeringen Kristersson
cabinet_name_en: Kristersson government
cabinet_name_es: Gobierno Kristersson

head_of_government_title_original: Statsminister
head_of_government_title_en: Prime Minister

took_office: 2022-10-18
left_office: null

methodology_notes:
  - en: >-
      10 ministries and 24 cabinet seats — the widest gap in this dataset so far, and it is
      structural rather than accidental. Sweden has no ministries in the sense other
      countries use the word: the Regeringskansliet is one authority, and what other states
      call a ministry is here a departement within it, listed in § 2 of förordning
      (1996:1515). Ten of those departments are headed by a minister and are counted. The
      other two entries in § 2 are not: Statsrådsberedningen is the Prime Minister's Office,
      excluded as the office of the head of government, and Regeringskansliets
      förvaltningsavdelning is a shared services division headed by an official, not a
      minister. The 24 seats are the statsråd — the Prime Minister and 23 other ministers —
      distributed across the departments; several departments have two, three or four of
      them. Counting Statsrådsberedningen as a ministry would give 11.
    es: >-
      10 ministerios y 24 asientos en el gabinete: la mayor diferencia del dataset hasta
      ahora, y es estructural, no accidental. Suecia no tiene ministerios en el sentido en
      que otros países usan la palabra: el Regeringskansliet es una sola autoridad y lo que
      en otros Estados es un ministerio aquí es un departement dentro de ella, enumerado en
      el § 2 del förordning (1996:1515). Diez de esos departamentos están dirigidos por un
      ministro y se cuentan. Las otras dos entradas del § 2 no: la Statsrådsberedningen es la
      oficina del primer ministro, excluida como oficina del jefe de gobierno, y la
      Regeringskansliets förvaltningsavdelning es una división de servicios comunes dirigida
      por un funcionario y no por un ministro. Los 24 asientos son los statsråd —el primer
      ministro y otros 23 ministros— repartidos entre los departamentos; varios tienen dos,
      tres o cuatro. Contar la Statsrådsberedningen como ministerio daría 11.
  - en: >-
      How the seats are counted. Each department carries a `head_count` equal to the number
      of ministers serving in it, taken from the government's own list of its members:
      Socialdepartementet 4, Finansdepartementet 3, Statsrådsberedningen 2 (the Prime
      Minister and the Minister for EU Affairs), Justitie-, Utrikes-, Försvars-, Utbildnings-,
      Klimat- och näringslivs-, Arbetsmarknads- and Landsbygds- och infrastrukturdepartementet
      2 each, Kulturdepartementet 1. That is 24 people, and 24 is the figure Swedish sources
      give for the size of the government. Sweden does not use the device of a minister
      without portfolio: every statsråd belongs to a department, so no separate entities are
      recorded for the ministers who are not their department's head. The consequence for
      readers is that a Swedish minister's title says almost nothing about how many
      ministries Sweden has — there is a Minister for Gender Equality but no equality
      department, a Minister for Migration but no migration department.
    es: >-
      Cómo se cuentan los asientos. Cada departamento lleva un `head_count` igual al número de
      ministros que sirven en él, tomado de la propia lista de miembros del gobierno:
      Socialdepartementet 4, Finansdepartementet 3, Statsrådsberedningen 2 (el primer ministro
      y la ministra de Asuntos Europeos), Justitie-, Utrikes-, Försvars-, Utbildnings-,
      Klimat- och näringslivs-, Arbetsmarknads- y Landsbygds- och infrastrukturdepartementet 2
      cada uno, y Kulturdepartementet 1. Son 24 personas, y 24 es la cifra que dan las fuentes
      suecas para el tamaño del gobierno. Suecia no emplea la figura del ministro sin cartera:
      todo statsråd pertenece a un departamento, por lo que no se registran entidades aparte
      para los ministros que no dirigen su departamento. La consecuencia para el lector es que
      el título de un ministro sueco dice muy poco sobre cuántos ministerios tiene Suecia: hay
      ministra de Igualdad pero no departamento de igualdad, y ministro de Migración pero no
      departamento de migración.
  - en: >-
      The department structure changed 75 days into this cabinet's term. When the government
      took office on 18 October 2022 the Regeringskansliet still contained Miljödepartementet,
      Näringsdepartementet and Infrastrukturdepartementet; on 1 January 2023 those three were
      replaced by two, Klimat- och näringslivsdepartementet and Landsbygds- och
      infrastrukturdepartementet, and § 2 of the instruction was amended accordingly by
      förordning (2022:1873). Sweden's count under this cabinet was therefore 11 until 31
      December 2022 and has been 10 since. The three abolished departments are recorded below
      with `valid_to: 2022-12-31` so the change is visible rather than inferred, but this file
      does not attempt to reconstruct which minister sat in which of them, so they carry no
      cabinet seat: a replay of any date before 1 January 2023 would understate the seats.
      Everything else in this file describes the structure in force from 1 January 2023 to the
      access date.
    es: >-
      La estructura departamental cambió a los 75 días de legislatura. Cuando el gobierno tomó
      posesión el 18 de octubre de 2022, el Regeringskansliet aún contenía el
      Miljödepartementet, el Näringsdepartementet y el Infrastrukturdepartementet; el 1 de
      enero de 2023 esos tres fueron sustituidos por dos, el Klimat- och
      näringslivsdepartementet y el Landsbygds- och infrastrukturdepartementet, y el § 2 de la
      instrucción se modificó en consecuencia mediante el förordning (2022:1873). La cifra
      sueca bajo este gobierno fue por tanto 11 hasta el 31 de diciembre de 2022 y es 10 desde
      entonces. Los tres departamentos suprimidos se registran abajo con `valid_to:
      2022-12-31` para que el cambio sea visible y no deducido, pero este fichero no intenta
      reconstruir qué ministro estaba en cada uno de ellos, así que no llevan asiento: una
      reconstrucción de cualquier fecha anterior al 1 de enero de 2023 subestimaría los
      asientos. Todo lo demás describe la estructura vigente desde el 1 de enero de 2023 hasta
      la fecha de consulta.
  - en: >-
      Sweden has no European affairs ministry in this dataset, and that is a real finding
      rather than a gap. EU coordination belongs to the Minister for EU Affairs, who sits in
      Statsrådsberedningen — the one entry excluded as the office of the head of government —
      so the european_affairs area is tagged on no counted Swedish department. Read the
      comparison views accordingly: Sweden's EU minister exists, but not in a department that
      this methodology counts.
    es: >-
      En este dataset Suecia no tiene ministerio de Asuntos Europeos, y eso es un hallazgo
      real y no una laguna. La coordinación de la UE corresponde a la ministra de Asuntos
      Europeos, que se sitúa en la Statsrådsberedningen —la única entrada excluida como
      oficina del jefe de gobierno—, de modo que el área european_affairs no se etiqueta en
      ningún departamento sueco contado. Conviene leer así las vistas comparativas: la
      ministra de la UE existe, pero no en un departamento que esta metodología cuente.
  - en: >-
      Which department owns what is taken from the government's own attributions, not from
      the department names, in the three cases where the name would mislead: sport and civil
      society belong to Socialdepartementet, digitalisation policy to Finansdepartementet
      (under the Minister for Public Administration), and housing and spatial planning to
      Landsbygds- och infrastrukturdepartementet. Each of those three claims is cited on the
      entity concerned. The head_title_original of each department is the title of the
      minister regeringen.se lists first for it, which by Swedish convention is the
      departementschef.
    es: >-
      La atribución de materias a departamentos se toma de las propias adscripciones del
      gobierno y no de los nombres de los departamentos en los tres casos en que el nombre
      induciría a error: el deporte y la sociedad civil corresponden al Socialdepartementet,
      la política de digitalización al Finansdepartementet (bajo el ministro de Administración
      Pública) y la vivienda y la ordenación del territorio al Landsbygds- och
      infrastrukturdepartementet. Cada una de esas tres afirmaciones se cita en la entidad
      correspondiente. El head_title_original de cada departamento es el título del ministro
      que regeringen.se enumera primero, que por convención sueca es el departementschef.
  - en: >-
      English department names are the Swedish government's own, taken verbatim from
      government.se, the English-language edition of regeringen.se, and marked
      name_en_provenance: official. The one exception is Regeringskansliets
      förvaltningsavdelning, for which government.se publishes no English name; that
      rendering and all Spanish names are this project's own and are marked translated.
    es: >-
      Los nombres ingleses de los departamentos son los del propio gobierno sueco, tomados
      literalmente de government.se, la edición en inglés de regeringen.se, y llevan
      name_en_provenance: official. La única excepción es la Regeringskansliets
      förvaltningsavdelning, para la que government.se no publica nombre inglés; esa
      traducción y todos los nombres en español son de este proyecto y llevan la marca
      translated.

sources:
  - id: sfs-1996-1515
    tier: 1
    type: statute
    publisher: Svensk författningssamling (Sveriges riksdag)
    title: >-
      Förordning (1996:1515) med instruktion för Regeringskansliet, i lydelse t.o.m. SFS
      2026:894 (konsoliderad text)
    url: >-
      https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/forordning-19961515-med-instruktion-for_sfs-1996-1515/
    archive_url: >-
      https://web.archive.org/web/20260727234110/https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/forordning-19961515-med-instruktion-for_sfs-1996-1515/
    lang: sv
    published: 1996-12-17
    accessed: 2026-07-28
    quote: |-
      1 § Regeringskansliet har till uppgift att bereda regeringsärenden och att i övrigt biträda regeringen och statsråden i deras verksamhet.
      2 § I Regeringskansliet ingår
      Statsrådsberedningen (SB),
      Justitiedepartementet (Ju),
      Utrikesdepartementet (UD),
      Försvarsdepartementet (Fö),
      Socialdepartementet (S),
      Finansdepartementet (Fi),
      Utbildningsdepartementet (U),
      Klimat- och näringslivsdepartementet (KN),
      Kulturdepartementet (Ku),
      Arbetsmarknadsdepartementet (A),
      Landsbygds- och infrastrukturdepartementet (LI), och
      Regeringskansliets förvaltningsavdelning (FA).
      Vad som sägs i denna förordning om departement gäller också Statsrådsberedningen och förvaltningsavdelningen, om något annat inte framgår av sammanhanget. Förordning (2022:1873).
    note: >-
      The enumerating instrument, and the source of the listing order below. It is the
      instruction for the Regeringskansliet, the single authority that is the Swedish
      government office; § 2 lists its parts, which is as close as Swedish law comes to a
      list of ministries. Two of the twelve entries are not counted here: Statsrådsberedningen
      (the office of the head of government) and the förvaltningsavdelning (headed by an
      official). The annotation at the end of § 2, "Förordning (2022:1873)", is the amendment
      that produced the current list with effect from 1 January 2023 — it is why the two
      newest departments below carry valid_from 2023-01-01. The consolidated text is
      published by the Riksdag and was, at the access date, amended up to SFS 2026:894.

