      The government's own list, quoted from the "Minisztériumok" block of the page with the
      "Felelős miniszter" line under each name omitted. It corroborates the statutory list
      exactly — sixteen ministries, the same sixteen — and it is the source of the departmental
      web addresses recorded on each entity, each of which is a /kormanyzat/ page on this site.
      The page also lists the prime minister and, separately, two deputy prime ministers, both
      of whom appear again among the sixteen ministers, which is the corroboration for the
      claim that no deputy premiership adds a seat. Two spellings differ from the statute's in
      capitalisation only ("Agrár- és Élelmiszergazdaságért felelős", "Társadalmi
      kapcsolatokért és Kultúráért felelős"); the entity names below follow the statute. Note
      that this page's /en/ counterpart, kormany.hu/en/government, served this same Hungarian
      content on the access date, which is why no name in this file is marked as an official
      English name.

entities:
  - id: HU-2026-egeszsegugy
    order: 1
    name_original: Egészségügyi Minisztérium
    abbreviation_original: EüM
    name_en: Ministry of Health
    name_es: Ministerio de Sanidad
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [health, social_security]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/egeszsegugyi-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        A new ministry, created by splitting out of the Belügyminisztérium (§ 2(1) of Act XIII);
        until 13 May 2026 Hungary had no health ministry and health sat inside the interior
        portfolio. § 56(1) of decree 90/2026 makes the minister responsible for health, for
        health insurance and for drug-prevention coordination. The social_security tag records
        health insurance ("egészségbiztosításért") only; pensions are in the finance ministry.
      es: >-
        Ministerio nuevo, creado por escisión del Ministerio del Interior (§ 2(1) de la Ley
        XIII); hasta el 13 de mayo de 2026 Hungría no tenía ministerio de Sanidad y la sanidad
        estaba dentro de la cartera de Interior. El § 56(1) del decreto 90/2026 hace al ministro
        responsable de la sanidad, del seguro de enfermedad y de la coordinación en materia de
        drogas. La etiqueta social_security recoge únicamente el seguro de enfermedad
        («egészségbiztosításért»); las pensiones están en el ministerio de Hacienda.

  - id: HU-2026-igazsagugy
    order: 2
    name_original: Igazságügyi Minisztérium
    abbreviation_original: IM
    name_en: Ministry of Justice
    name_es: Ministerio de Justicia
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [justice]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/igazsagugyi-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, mk-2026-46-korm-90-2026-atmeneti, kormany-hu-kormanyzat]
    note:
      en: >-
        One of four ministries § 203(1) of decree 90/2026 says continue under an unchanged name.
        Its remit under § 97(1) is justice, citizenship, compensation for past wrongs, the
        professional supervision of public records, and the regulation of administrative
        offences and of electoral and referendum law. Only the justice tag is applied:
        citizenship is not migration policy, which sits with the interior ministry, and
        electoral regulation has no area of its own in this vocabulary.
      es: >-
        Uno de los cuatro ministerios que el § 203(1) del decreto 90/2026 declara que continúan
        con nombre inalterado. Su competencia según el § 97(1) abarca la justicia, la
        nacionalidad, la indemnización por agravios pasados, la dirección profesional de la
        gestión de documentos públicos y la regulación de las infracciones administrativas y del
        derecho electoral y de referéndum. Solo se aplica la etiqueta justice: la nacionalidad
        no es política migratoria, que corresponde a Interior, y la regulación electoral no
        tiene área propia en este vocabulario.

  - id: HU-2026-oktatas-gyermekugy
    order: 3
    name_original: Oktatási és Gyermekügyi Minisztérium
    abbreviation_original: OGYM
    name_en: Ministry of Education and Children's Affairs
    name_es: Ministerio de Educación y Asuntos de la Infancia
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [education, higher_education, vocational_training, family, youth]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/oktatasi-es-gyermekugyi-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        A new ministry split out of the Belügyminisztérium (§ 2(2)). § 124(1) of decree 90/2026
        gives its minister adult education, higher education, school education, child and youth
        policy and vocational training, so Hungary's whole education system from school to
        university sits in one department. The protection of children is a separate
        responsibility held by the social and family affairs minister under § 145(1)(d), which
        is the exception § 124(1)(d) refers to.
      es: >-
        Ministerio nuevo escindido del Ministerio del Interior (§ 2(2)). El § 124(1) del decreto
        90/2026 atribuye a su ministra la educación de adultos, la enseñanza superior, la
        enseñanza escolar, la política de infancia y juventud y la formación profesional, de
        modo que todo el sistema educativo húngaro, de la escuela a la universidad, está en un
        solo departamento. La protección de la infancia es una competencia distinta, del
        ministro de Asuntos Sociales y de Familia según el § 145(1)(d), que es la excepción a la
        que remite el § 124(1)(d).

  - id: HU-2026-penzugy
    order: 4
    name_original: Pénzügyminisztérium
    abbreviation_original: PM
    name_en: Ministry of Finance
    name_es: Ministerio de Hacienda
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [finance, budget, social_security, state_assets]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/penzugyminiszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        Not a new ministry: § 3(1) of Act XIII renames the Nemzetgazdasági Minisztérium
        Pénzügyminisztérium, restoring a name Hungary used until the end of 2024. § 130(1) of
        decree 90/2026 gives it tax policy, public finance, the supervision of state assets,
        the macroeconomic basis of the budget, public procurement, pension policy and financial
        market regulation. The social_security tag is for pension policy
        ("nyugdíjpolitikáért"), which in Hungary sits with the treasury rather than with a
        social ministry, and state_assets for "állami vagyon felügyeletéért".
      es: >-
        No es un ministerio nuevo: el § 3(1) de la Ley XIII rebautiza el Nemzetgazdasági
        Minisztérium como Pénzügyminisztérium, recuperando un nombre que Hungría usó hasta
        finales de 2024. El § 130(1) del decreto 90/2026 le atribuye la política fiscal, la
        hacienda pública, la supervisión del patrimonio estatal, la base macroeconómica del
        presupuesto, la contratación pública, la política de pensiones y la regulación de los
        mercados financieros. La etiqueta social_security corresponde a la política de pensiones
        («nyugdíjpolitikáért»), que en Hungría está en el tesoro y no en un ministerio social, y
        state_assets a «állami vagyon felügyeletéért».

  - id: HU-2026-agrar-elelmiszergazdasag
    order: 5
    name_original: Agrár- és Élelmiszergazdaságért Felelős Minisztérium
    abbreviation_original: AÉM
    name_en: Ministry for Agriculture and the Food Economy
    name_es: Ministerio para la Agricultura y la Economía Alimentaria
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [agriculture, food_safety, fisheries]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/agrar-es-elelmiszergazdasagi-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        The former Agrárminisztérium, renamed by § 3(2) of Act XIII. § 25 of decree 90/2026
        gives it agricultural policy, food-chain supervision, the food industry, land affairs,
        cartography for land and agricultural support administration, fish farming and game
        management. The fisheries tag covers "halgazdálkodásért", which in a landlocked country
        means inland fish farming rather than sea fishing. Rural development is not here: it
        belongs to the Vidék- és Településfejlesztési Minisztérium, and forestry belongs to the
        Élő Környezetért Felelős Minisztérium.
      es: >-
        El antiguo Agrárminisztérium, rebautizado por el § 3(2) de la Ley XIII. El § 25 del
        decreto 90/2026 le atribuye la política agraria, la supervisión de la cadena
        alimentaria, la industria alimentaria, los asuntos de la tierra, la cartografía para la
        administración de la tierra y de las ayudas agrarias, la piscicultura y la gestión
        cinegética. La etiqueta fisheries corresponde a «halgazdálkodásért», que en un país sin
        litoral significa piscicultura continental y no pesca marítima. El desarrollo rural no
        está aquí: pertenece al Vidék- és Településfejlesztési Minisztérium, y los bosques al
        Élő Környezetért Felelős Minisztérium.

  - id: HU-2026-belugy
    order: 6
    name_original: Belügyminisztérium
    abbreviation_original: BM
    name_en: Ministry of the Interior
    name_es: Ministerio del Interior
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [interior, migration, civil_protection, sport]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/belugyminiszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, mk-2026-46-korm-90-2026-atmeneti, kormany-hu-kormanyzat]
    note:
      en: >-
        The ministry this reorganisation changed most, though its name did not change at all.
        Three new ministries — health, education and children, and social and family affairs —
        were split out of it by § 2(1), (2) and (4) of Act XIII, and what remains under § 34(1)
        of decree 90/2026 is a policing and public-order department: public security, policing,
        border policing, immigration and asylum, disaster management, prison administration,
        counter-terrorism, the direction of the civilian national security services, and
        registry and personal-data records. It also keeps sport policy and the staging of major
        international sporting events, which is why the sport tag is here rather than on an
        education or culture ministry.
      es: >-
        El ministerio que más cambió con esta reorganización, aunque su nombre no cambió en
        absoluto. Tres ministerios nuevos —Sanidad, Educación e Infancia, y Asuntos Sociales y
        de Familia— se escindieron de él por los § 2(1), (2) y (4) de la Ley XIII, y lo que
        queda según el § 34(1) del decreto 90/2026 es un departamento de policía y orden
        público: seguridad ciudadana, policía, policía de fronteras, extranjería y asilo,
        protección civil, instituciones penitenciarias, lucha antiterrorista, dirección de los
        servicios civiles de seguridad nacional y registros civiles y de datos personales.
        Conserva además la política deportiva y la organización de grandes eventos deportivos
        internacionales, y por eso la etiqueta sport está aquí y no en un ministerio de
        educación o de cultura.

  - id: HU-2026-elo-kornyezet
    order: 7
    name_original: Élő Környezetért Felelős Minisztérium
    abbreviation_original: ÉKFM
    name_en: Ministry for the Living Environment
    name_es: Ministerio para el Entorno Vivo
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [environment, water, forestry]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/elo-kornyezet-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        A new ministry, split out of the Energiaügyi Minisztérium by § 2(3) of Act XIII, which
        is the first time since 2010 that environmental protection has had a Hungarian
        department of its own rather than a directorate inside a larger one. § 60 of decree
        90/2026 gives it environmental protection, nature conservation, forestry, water
        management, water utilities and water protection, waste management and the transition to
        a circular economy. It has no climate remit: no ministry in this government does, so
        Hungary is one of the countries where the climate policy area is unclaimed.
      es: >-
        Ministerio nuevo, escindido del Energiaügyi Minisztérium por el § 2(3) de la Ley XIII, y
        primera vez desde 2010 que la protección del medio ambiente tiene departamento propio en
        Hungría en lugar de una dirección general dentro de otro mayor. El § 60 del decreto
        90/2026 le atribuye la protección del medio ambiente, la conservación de la naturaleza,
        la gestión forestal, la gestión del agua, los servicios públicos de agua y la protección
        de las aguas, la gestión de residuos y la transición a la economía circular. No tiene
        competencia de clima: ningún ministerio de este gobierno la tiene, de modo que Hungría
        es uno de los países en los que el área «clima» queda sin titular.

  - id: HU-2026-gazdasag-energetika
    order: 8
    name_original: Gazdasági és Energetikai Minisztérium
    abbreviation_original: GEM
    name_en: Ministry of Economy and Energy
    name_es: Ministerio de Economía y Energía
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [economy, energy, industry, trade, tourism, small_business, consumer_protection, mining]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/gazdasagi-es-energetikai-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        The former Energiaügyi Minisztérium, renamed and enlarged by § 3(3) of Act XIII after
        losing environment to the new Élő Környezetért Felelős Minisztérium. It is the widest
        portfolio in the government: § 75 of decree 90/2026 lists sixteen responsibilities,
        including mining, domestic and foreign trade, energy policy, consumer protection,
        economic development, industry, national utility services, the two new blocks at the
        Paks nuclear plant, postal affairs, tourism, hospitality and enterprise development. The
        trade tag covers both "belföldi kereskedelemért" and "külgazdasági ügyekért" — foreign
        trade moved out of the foreign ministry in this reorganisation.
      es: >-
        El antiguo Energiaügyi Minisztérium, rebautizado y ampliado por el § 3(3) de la Ley XIII
        tras perder el medio ambiente en favor del nuevo Élő Környezetért Felelős Minisztérium.
        Es la cartera más amplia del gobierno: el § 75 del decreto 90/2026 enumera dieciséis
        responsabilidades, entre ellas la minería, el comercio interior y exterior, la política
        energética, la protección de los consumidores, el desarrollo económico, la industria,
        los servicios públicos nacionales, los dos nuevos bloques de la central nuclear de Paks,
        el servicio postal, el turismo, la hostelería y el fomento empresarial. La etiqueta
        trade cubre tanto «belföldi kereskedelemért» como «külgazdasági ügyekért»: el comercio
        exterior salió del ministerio de Exteriores en esta reorganización.

  - id: HU-2026-honvedelem
    order: 9
    name_original: Honvédelmi Minisztérium
    abbreviation_original: HM
    name_en: Ministry of Defence
    name_es: Ministerio de Defensa
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [defence]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/honvedelmi-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, mk-2026-46-korm-90-2026-atmeneti, kormany-hu-kormanyzat]
    note:
      en: >-
        Unchanged in name and remit — one of the four ministries § 203(1) of decree 90/2026
        carries over untouched. § 93 gives its minister defence, central procurement for defence
        and security tasks, and defence development. Military intelligence stays with it while
        civilian intelligence sits with the interior minister and civilian foreign intelligence
        with the foreign minister.
      es: >-
        Sin cambios de nombre ni de competencias: uno de los cuatro ministerios que el § 203(1)
        del decreto 90/2026 mantiene intactos. El § 93 atribuye a su ministro la defensa, la
        contratación centralizada para tareas de defensa y seguridad, y el desarrollo de
        capacidades de defensa. La inteligencia militar sigue en él, mientras la inteligencia
        civil está en Interior y la inteligencia exterior civil en Exteriores.

  - id: HU-2026-kozlekedes-beruhazas
    order: 10
    name_original: Közlekedési és Beruházási Minisztérium
    abbreviation_original: KBM
    name_en: Ministry of Transport and Investment
    name_es: Ministerio de Transporte e Inversiones
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [transport, infrastructure, housing, spatial_planning]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/kozlekedesi-es-beruhazasi-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        The former Építési és Közlekedési Minisztérium, renamed by § 3(4) of Act XIII. § 106 of
        decree 90/2026 gives it state investments, construction economy and building regulation,
        transport, housing policy, brownfield action areas, settlement development and
        settlement planning, the protection of townscape, spatial planning and road tolling.
        Housing is split: this ministry holds housing policy ("lakáspolitikáért") while state
        housing subsidies are the finance minister's under § 130(1).
      es: >-
        El antiguo Építési és Közlekedési Minisztérium, rebautizado por el § 3(4) de la Ley
        XIII. El § 106 del decreto 90/2026 le atribuye las inversiones estatales, la economía y
        la regulación de la construcción, el transporte, la política de vivienda, las áreas de
        actuación en suelo industrial degradado, el desarrollo y la ordenación de los núcleos de
        población, la protección del paisaje urbano, la ordenación del territorio y el peaje de
        carreteras. La vivienda está repartida: este ministerio tiene la política de vivienda
        («lakáspolitikáért») mientras las ayudas estatales a la vivienda son del ministro de
        Hacienda según el § 130(1).

  - id: HU-2026-kulugy
    order: 11
    name_original: Külügyminisztérium
    abbreviation_original: KüM
    name_en: Ministry of Foreign Affairs
    name_es: Ministerio de Asuntos Exteriores
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [foreign_affairs, development_cooperation]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/kulugyminiszter
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        Narrower than its predecessor and deliberately so: § 3(5) of Act XIII renames the
        Külgazdasági és Külügyminisztérium simply Külügyminisztérium, and § 118 of decree
        90/2026 leaves its minister with foreign policy, cultural diplomacy and the Hungarian
        cultural institutes abroad, the direction of civilian foreign intelligence, and the
        Hungary Helps programme of aid to persecuted Christians, which is what the
        development_cooperation tag records. Foreign trade went to the economy and energy
        ministry and European Union affairs to the Miniszterelnökség, so a reader looking for
        either in the foreign ministry will not find it. The site path for this ministry is
        /kormanyzat/kulugyminiszter — the government's own slug names the minister, not the
        department.
      es: >-
        Más estrecho que su predecesor, y a propósito: el § 3(5) de la Ley XIII rebautiza el
        Külgazdasági és Külügyminisztérium como simple Külügyminisztérium, y el § 118 del
        decreto 90/2026 deja a su titular la política exterior, la diplomacia cultural y los
        institutos culturales húngaros en el extranjero, la dirección de la inteligencia
        exterior civil y el programa Hungary Helps de ayuda a los cristianos perseguidos, que es
        lo que recoge la etiqueta development_cooperation. El comercio exterior pasó al
        ministerio de Economía y Energía y los asuntos de la Unión Europea a la
        Miniszterelnökség, de modo que quien busque cualquiera de los dos en Exteriores no los
        encontrará. La ruta del sitio para este ministerio es /kormanyzat/kulugyminiszter: el
        propio slug del gobierno nombra a la ministra, no al departamento.

