  - id: HU-2026-miniszterelnok
    order: 17
    name_original: Miniszterelnök
    abbreviation_original: null
    name_en: Prime Minister
    name_es: Primer Ministro
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszterelnök
    head_title_en: Prime Minister
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://kormany.hu/kormanyzat/miniszterelnok
    sources: [njt-alaptorveny, mk-2026-44-ogy-18-miniszterelnok, mk-2026-45-mvm-1-hatalybalepes, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        The head of government holds a seat without heading a department. § 1 of Act XIII lists
        no prime-ministerial ministry, and chapter I of decree 90/2026 gives the prime minister
        representation of the Government, the determination of its general policy and the
        direction of its collective work rather than a portfolio. He is recorded because
        article 16(1) of the Fundamental Law makes him a member of the Government, which is what
        makes this cabinet 17 people and 16 departments. Do not confuse this entry with the
        Miniszterelnökség above: that is a statutory ministry with its own minister and its own
        portfolio, this is the prime minister's seat, and the administrative apparatus that
        serves him is the Miniszterelnöki Kormányiroda below. He took office on 9 May 2026 on
        his election by the National Assembly, four days before the Government he leads was
        formed.
      es: >-
        El jefe de gobierno ocupa asiento sin encabezar departamento alguno. El § 1 de la Ley
        XIII no enumera ningún ministerio de la presidencia, y el capítulo I del decreto 90/2026
        atribuye al primer ministro la representación del Gobierno, la determinación de su
        política general y la dirección de su funcionamiento colegiado, no una cartera. Se
        registra porque el artículo 16(1) de la Ley Fundamental lo hace miembro del Gobierno, y
        eso es lo que hace que este gabinete sean 17 personas y 16 departamentos. No confundir
        esta entrada con la Miniszterelnökség de más arriba: aquélla es un ministerio legal con
        ministro y cartera propios, ésta es el asiento del primer ministro, y el aparato
        administrativo que le sirve es la Miniszterelnöki Kormányiroda de más abajo. Tomó
        posesión el 9 de mayo de 2026 al ser elegido por la Asamblea Nacional, cuatro días antes
        de que se formara el Gobierno que encabeza.

  - id: HU-2026-miniszterelnoki-kormanyiroda
    order: 18
    name_original: Miniszterelnöki Kormányiroda
    abbreviation_original: null
    name_en: Prime Minister's Government Office
    name_es: Oficina Gubernamental del Primer Ministro
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: közigazgatási államtitkár
    head_title_en: Administrative State Secretary
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: null
    sources: [njt-kit-2018-cxxv, njt-alaptorveny, njt-2022-evi-ii-torveny]
    note:
      en: >-
        Recorded so that the perimeter is visible: a reader comparing Hungary with Germany's
        Bundeskanzleramt or Latvia's Valsts kanceleja will look for a prime-ministerial office
        that is not a ministry, and this is it. § 16(1) of the Act on government administration
        calls it a "kormányzati igazgatási munkaszervezet", a government administrative work
        organisation, § 16(2) places it inside the ministry led by the minister responsible for
        general political coordination — the Miniszterelnökség — and § 17(1) provides that it is
        headed by a közigazgatási államtitkár, an administrative state secretary who chairs the
        state secretaries' conference and whose work that minister directs on the prime
        minister's instructions. It is excluded as not_headed_by_minister rather than as
        head_of_government_office, which is reserved above for the prime minister's own seat,
        and it carries no cabinet seat. It is not named in Act XIII of 2026 or in decree 90/2026
        at all; under the repealed 2022 act it sat inside the Miniszterelnöki Kabinetiroda
        instead. A new administrative state secretary was appointed to it with effect from
        13 May 2026, so it survived the change of government intact.
      es: >-
        Se registra para que el perímetro sea visible: quien compare Hungría con la
        Bundeskanzleramt alemana o la Valsts kanceleja letona buscará una oficina del primer
        ministro que no sea un ministerio, y ésta es. El § 16(1) de la ley de administración
        gubernamental la llama «kormányzati igazgatási munkaszervezet», organización de trabajo
        de la administración gubernamental, el § 16(2) la sitúa dentro del ministerio dirigido
        por el ministro responsable de la coordinación política general —la Miniszterelnökség— y
        el § 17(1) dispone que la dirige un közigazgatási államtitkár, un secretario de Estado
        administrativo que preside la conferencia de secretarios de Estado y cuya actividad
        dirige ese ministro siguiendo las instrucciones del primer ministro. Se excluye como
        not_headed_by_minister y no como head_of_government_office, motivo reservado más arriba
        al asiento del propio primer ministro, y no aporta asiento en el gabinete. No aparece
        nombrada ni en la Ley XIII de 2026 ni en el decreto 90/2026; bajo la derogada ley de
        2022 estaba dentro de la Miniszterelnöki Kabinetiroda. Se nombró un nuevo secretario de
        Estado administrativo con efectos del 13 de mayo de 2026, de modo que sobrevivió intacta
        al cambio de gobierno.

  - id: HU-2026-miniszterelnoki-kabinetiroda
    order: 19
    name_original: Miniszterelnöki Kabinetiroda
    abbreviation_original: null
    name_en: Prime Minister's Cabinet Office
    name_es: Oficina del Gabinete del Primer Ministro
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: superseded_within_cabinet
    valid_from: null
    valid_to: 2026-06-15
    url: null
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-mvm-1-hatalybalepes, mk-2026-46-korm-90-2026-atmeneti, njt-2022-evi-ii-torveny]
    note:
      en: >-
        The second half of the Miniszterelnökség question, and the reason a Hungarian ministry
        count from before 13 May 2026 does not compare with this one. Under the repealed 2022
        act the Kabinetiroda was a ministry in its own right — point k) of its § 1 — headed by
        its own minister, and § 2 of that act made it, not the Miniszterelnökség, "a
        miniszterelnök munkaszervezete", the prime minister's work organisation. § 2(7) of Act
        XIII of 2026 abolished it by merging it into the Miniszterelnökség with effect from 13
        May 2026, the day this Government was formed. It did not vanish that day: § 4(2) and §
        4(3) of the act kept it in being as a budgetary and government administrative organ with
        the minister heading the Miniszterelnökség exercising its head's powers, and § 206 of
        decree 90/2026 fixed 15 June 2026 as the day it ceased to exist. So for the first month
        of this cabinet it existed without a minister of its own, which is why it is recorded
        here, is not counted, carries no cabinet seat, and closes with 15 June 2026 as its end
        date instead of being deleted.
      es: >-
        La segunda mitad de la cuestión de la Miniszterelnökség, y la razón por la que un
        recuento de ministerios húngaros anterior al 13 de mayo de 2026 no es comparable con
        éste. Bajo la derogada ley de 2022 la Kabinetiroda era un ministerio de pleno derecho
        —punto k) de su § 1— con ministro propio, y el § 2 de esa ley hacía de ella, y no de la
        Miniszterelnökség, «a miniszterelnök munkaszervezete», la organización de trabajo del
        primer ministro. El § 2(7) de la Ley XIII de 2026 la suprimió fusionándola en la
        Miniszterelnökség con efectos del 13 de mayo de 2026, día en que se formó este Gobierno.
        No desapareció ese día: los § 4(2) y § 4(3) de la ley la mantuvieron como órgano
        presupuestario y de administración gubernamental, ejerciendo las competencias de su
        titular el ministro que dirige la Miniszterelnökség, y el § 206 del decreto 90/2026 fijó
        el 15 de junio de 2026 como día de su extinción. Durante el primer mes de este gabinete
        existió, por tanto, sin ministro propio, y por eso se registra aquí, no se cuenta, no
        aporta asiento y se cierra con fecha de fin 15 de junio de 2026 en lugar de borrarse.

  - id: HU-2026-europai-unios-ugyek
    order: 20
    name_original: Európai Uniós Ügyek Minisztériuma
    abbreviation_original: null
    name_en: Ministry for European Union Affairs
    name_es: Ministerio de Asuntos de la Unión Europea
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: superseded_within_cabinet
    valid_from: null
    valid_to: 2026-06-15
    url: null
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-mvm-1-hatalybalepes, mk-2026-46-korm-90-2026-atmeneti, njt-2022-evi-ii-torveny]
    note:
      en: >-
        Hungary had a dedicated European Union affairs ministry from 1 August 2023, created by
        splitting out of the justice ministry under the 2022 act. § 2(6) of Act XIII of 2026
        abolished it by merging it into the Miniszterelnökség on 13 May 2026, and § 206 of
        decree 90/2026 fixed 15 June 2026 as the day it ceased to exist as an organ; in between,
        under § 4(2) and § 4(3) of the act, it operated with no minister of its own and with the
        minister heading the Miniszterelnökség exercising its head's powers. It is recorded with
        an end date for the same reason as the Kabinetiroda above, and its portfolio can be
        found in § 8(1)(b) and (c) of decree 90/2026, under the Miniszterelnökség, which is
        where the european_affairs tag now sits.
      es: >-
        Hungría tuvo un ministerio propio de asuntos de la Unión Europea desde el 1 de agosto de
        2023, creado por escisión del ministerio de Justicia conforme a la ley de 2022. El §
        2(6) de la Ley XIII de 2026 lo suprimió fusionándolo en la Miniszterelnökség el 13 de
        mayo de 2026, y el § 206 del decreto 90/2026 fijó el 15 de junio de 2026 como día de su
        extinción como órgano; entretanto, conforme a los § 4(2) y § 4(3) de la ley, funcionó
        sin ministro propio y con el ministro que dirige la Miniszterelnökség ejerciendo las
        competencias de su titular. Se registra con fecha de fin por la misma razón que la
        Kabinetiroda de más arriba, y su cartera puede encontrarse en el § 8(1)(b) y (c) del
        decreto 90/2026, bajo la Miniszterelnökség, que es donde está ahora la etiqueta
        european_affairs.
