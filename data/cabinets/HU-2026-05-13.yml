    note:
      en: >-
        A new ministry split out of the Belügyminisztérium (§ 2(4)). § 145(1) of decree 90/2026
        gives it victim support, family policy, employment policy, the protection of children
        and young people, the employment of third-country nationals, public-works employment,
        social policy and social inclusion. It is the labour ministry as well as the social one:
        Hungary has no separate employment department, which is why the labour tag is here.
        Pensions are not: they are the finance minister's.
      es: >-
        Ministerio nuevo escindido del Ministerio del Interior (§ 2(4)). El § 145(1) del decreto
        90/2026 le atribuye la asistencia a las víctimas, la política de familia, la política de
        empleo, la protección de la infancia y la juventud, el empleo de nacionales de terceros
        países, el empleo público de inserción, la política social y la inclusión social. Es
        también el ministerio de Trabajo: Hungría no tiene departamento de empleo separado, y por
        eso la etiqueta labour está aquí. Las pensiones no: son del ministro de Hacienda.

  - id: HU-2026-tarsadalmi-kapcsolatok-kultura
    order: 14
    name_original: Társadalmi Kapcsolatokért és Kultúráért Felelős Minisztérium
    abbreviation_original: TKKM
    name_en: Ministry for Social Relations and Culture
    name_es: Ministerio para las Relaciones Sociales y la Cultura
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [culture, diaspora, religion, media]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/tarsadalmi-kapcsolatokert-es-kulturaert-felelos-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        A new ministry split out of the Kulturális és Innovációs Minisztérium by § 2(5) of Act
        XIII, taking the culture half while the innovation half became the science and
        technology ministry. § 157 of decree 90/2026 gives it audiovisual policy, the
        coordination of relations with the churches, the European Capital of Culture programme,
        culture, the protection of cultural heritage, the film industry, minority policy,
        Hungarian-nation policy, the development of social and civil relations, and social
        dialogue. Two of those have no home in this project's vocabulary and are therefore not
        tagged rather than approximated: "nemzetiségpolitika", policy toward Hungary's recognised
        national minorities, and the ministry's remit for relations with civil society and for
        social dialogue. The diaspora tag records "nemzetpolitikáért", policy toward Hungarians
        living outside Hungary, which in this government sits with culture rather than with the
        foreign ministry.
      es: >-
        Ministerio nuevo escindido del Kulturális és Innovációs Minisztérium por el § 2(5) de la
        Ley XIII, que se queda con la mitad cultural mientras la mitad de innovación pasó a ser
        el ministerio de Ciencia y Tecnología. El § 157 del decreto 90/2026 le atribuye la
        política audiovisual, la coordinación de las relaciones con las iglesias, el programa
        Capital Europea de la Cultura, la cultura, la protección del patrimonio cultural, el
        sector cinematográfico, la política hacia las minorías nacionales, la política de
        nación, el desarrollo de las relaciones sociales y civiles, y el diálogo social. Dos de
        ellas no tienen sitio en el vocabulario de este proyecto y por eso no se etiquetan en
        lugar de aproximarse: la «nemzetiségpolitika», la política hacia las minorías nacionales
        reconocidas de Hungría, y su competencia sobre las relaciones con la sociedad civil y el
        diálogo social. La etiqueta diaspora recoge «nemzetpolitikáért», la política hacia los
        húngaros que viven fuera de Hungría, que en este gobierno está en Cultura y no en
        Exteriores.

  - id: HU-2026-tudomany-technologia
    order: 15
    name_original: Tudományos és Technológiai Minisztérium
    abbreviation_original: TTM
    name_en: Ministry of Science and Technology
    name_es: Ministerio de Ciencia y Tecnología
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [research, digital, telecommunications, space]
    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/tudomanyos-es-technologiai-miniszterium
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, njt-90-2026-korm-rendelet, kormany-hu-kormanyzat]
    note:
      en: >-
        The former Kulturális és Innovációs Minisztérium, renamed by § 3(6) of Act XIII after
        culture was split out of it. § 168 of decree 90/2026 gives it e-government, the
        unification of e-government and IT development, electronic communications, informatics,
        government science policy, the infrastructure of public-administration IT, the
        coordination of science policy, and space industry development and space technologies.
        Its predecessor also held higher education, which has moved to the education and
        children ministry, so this is a research-and-digital department and not a
        higher-education one. The innovation area is deliberately not tagged: the decree assigns
        this minister no innovation remit in those words, only science policy.
      es: >-
        El antiguo Kulturális és Innovációs Minisztérium, rebautizado por el § 3(6) de la Ley
        XIII tras escindirse de él la cultura. El § 168 del decreto 90/2026 le atribuye la
        administración electrónica, la unificación de los desarrollos de administración
        electrónica e informática, las comunicaciones electrónicas, la informática, la política
        científica del Gobierno, la infraestructura informática de la administración pública, la
        coordinación de la política científica, y el desarrollo de la industria y las tecnologías
        espaciales. Su predecesor tenía además la enseñanza superior, que ha pasado al ministerio
        de Educación e Infancia, de modo que este es un departamento de investigación y
        digitalización y no de universidades. El área «innovation» no se etiqueta a propósito: el
        decreto no atribuye a este ministro competencia de innovación con ese nombre, solo
        política científica.

