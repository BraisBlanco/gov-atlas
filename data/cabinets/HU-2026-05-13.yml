    counts_as_ministry: true
    url: https://kormany.hu/kormanyzat/miniszterelnokseg
    sources: [njt-2026-evi-xiii-torveny, mk-2026-44-torveny-xiii, mk-2026-45-ke-76-miniszterek-kinevezese, mk-2026-45-mvm-1-hatalybalepes, njt-alaptorveny, njt-90-2026-korm-rendelet, mk-2026-46-korm-90-2026-atmeneti, njt-2022-evi-ii-torveny, kormany-hu-kormanyzat]
    note:
      en: >-
        The contested entity, counted. Read the second methodology note before quoting the
        figure of 16: excluding this ministry as the office of the head of government would give
        15, and this project's rule for a chancellery that national law constitutes as a
        ministry is to count it and publish both numbers. Point 12 of § 1 of Act XIII lists it
        as a ministry, § 203(1) of decree 90/2026 carries it over under an unchanged name, and
        § 8(1) of that decree gives its minister nine substantive responsibilities: general
        political coordination, the coordination of European Union affairs, the making and
        coordination of EU policy, government communication, the coordination of government
        commissioners' work, the coordination of the government's social relations, support for
        the drafting of government strategies, the design of the civil-service career, and the
        coordination of social policy. § 7 adds the government's relations with the National
        Assembly, which is what the parliamentary_relations tag records, and § 8(1)(h) the
        public_administration tag. Two things this reorganisation added to it: the Ministry for
        European Union Affairs and the Prime Minister's Cabinet Office were both dissolved into
        it on 13 May 2026, and under § 4(3) of Act XIII its minister exercised the powers of
        their heads until they ceased to exist on 15 June. Its minister is one of the two deputy
        prime ministers, which adds no seat and no department.
      es: >-
        La entidad discutida, contada. Lea la segunda nota metodológica antes de citar la cifra
        de 16: excluir este ministerio como oficina del jefe de gobierno daría 15, y la regla de
        este proyecto para una cancillería que la ley nacional constituye como ministerio es
        contarla y publicar ambas cifras. El punto 12 del § 1 de la Ley XIII la enumera como
        ministerio, el § 203(1) del decreto 90/2026 la mantiene con nombre inalterado y el
        § 8(1) de ese decreto atribuye a su ministro nueve responsabilidades sustantivas: la
        coordinación política general, la coordinación de los asuntos de la Unión Europea, la
        elaboración y coordinación de la política europea, la comunicación gubernamental, la
        coordinación de la actividad de los comisionados del Gobierno, la coordinación de las
        relaciones sociales del Gobierno, el apoyo a la elaboración de estrategias
        gubernamentales, el diseño de la carrera en la función pública y la coordinación de la
        política social. El § 7 añade las relaciones del Gobierno con la Asamblea Nacional, que
        es lo que recoge la etiqueta parliamentary_relations, y el § 8(1)(h) la etiqueta
        public_administration. Dos cosas le añadió esta reorganización: el Ministerio de Asuntos
        de la Unión Europea y la Oficina del Gabinete del Primer Ministro se disolvieron en ella
        el 13 de mayo de 2026, y conforme al § 4(3) de la Ley XIII su ministro ejerció las
        competencias de los titulares de ambos hasta su extinción el 15 de junio. Su ministro es
        uno de los dos viceprimeros ministros, lo que no añade asiento ni departamento.

  - id: HU-2026-szocialis-csaladugy
    order: 13
    name_original: Szociális és Családügyi Minisztérium
    abbreviation_original: SZCSM
    name_en: Ministry of Social and Family Affairs
    name_es: Ministerio de Asuntos Sociales y de Familia
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: miniszter
    head_title_en: Minister
