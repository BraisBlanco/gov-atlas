    note: >-
      The consolidated Fundamental Law, cited for four things this file turns on: who sits in the
      Government (16(1) — the prime minister and the ministers, and nobody else, which is what
      makes the seat count 17), that deputy premierships are a designation among the existing
      ministers rather than an office of their own (16(2)), when the Government is formed
      (16(7)–(8), and the appointment decision named 13 May), and that the list of ministries is
      a matter for statute while ministers without portfolio are a matter for the Government
      (17(1)–(2)). The elision marked "[...]" omits paragraphs (3) to (6), on the election of
      the prime minister; it also avoids reproducing the Jogszabálytár's inline footnote
      reference numbers, which are the site's apparatus and not part of the text.

