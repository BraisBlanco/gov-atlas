# Hungary — government structure of the Magyar government, formed after the 12 April 2026
# parliamentary election.
#
# Read docs/DATA-CONTRACT.md alongside this file. Five Hungary-specific things to know:
#
#   1. Hungary enumerates its ministries by statute. The 2026 general election was held on
#      12 April, the new National Assembly convened on 9 May and elected Péter Magyar prime
#      minister the same day, and the Assembly passed a new list-of-ministries act — 2026. évi
#      XIII. törvény — at that same sitting. Its § 1 is the whole basis of the entity list
#      below, and the order of entities 1 to 16 is its own order.
#   2. `took_office` is 13 May 2026, not 9 May. Article 16(4) of the Fundamental Law puts the
#      prime minister in office on his election, but article 16(8) forms the *Government* only
#      on the appointment of the ministers, and decision 76/2026. (V. 12.) KE appointed all
#      sixteen "2026. május 13-ai hatállyal" — with effect from 13 May. Decision 1/2026.
#      (V. 12.) MvM then fixed 13 May 2026 as the day Act XIII entered into force, because
#      the act's § 5(1) ties its entry into force to the Government's formation. The outgoing
#      Orbán government's mandate ran as a caretaker until that moment; it is not recorded
#      here, and this is the sitting cabinet.
#   3. The Miniszterelnökség is counted. It is a contested case and note 2 below states both
#      figures. The Miniszterelnöki Kabinetiroda, which stood beside it as a separate ministry
#      until this government, was abolished by § 2(7) of Act XIII and is recorded with a
#      valid_to, not deleted.
#   4. There are no ministers without portfolio. Article 17(2) of the Fundamental Law allows
#      them and the repealed 2022 act did not name any either; sixteen ministers were
#      appointed and each heads exactly one of the sixteen ministries, so there is no shared
#      portfolio and no second seat anywhere in this file.
#   5. Every English and Spanish name here is this project's own translation. kormany.hu
#      serves Hungarian content on its /en/ paths, so there is no official English
#      nomenclature to adopt — see note 6.

country: HU
cabinet_id: HU-2026-05-13

cabinet_name_original: Magyar Péter kormánya
cabinet_name_en: Government of Péter Magyar
cabinet_name_es: Gobierno de Péter Magyar

head_of_government_title_original: miniszterelnök
head_of_government_title_en: Prime Minister

took_office: 2026-05-13
left_office: null

methodology_notes:
  - en: >-
      Hungary has 16 ministries but 17 seats in the Government. The gap is a matter of
      constitutional text rather than interpretation: article 16(1) of the Fundamental Law
      provides that "A Kormány tagjai a miniszterelnök és a miniszterek" — the members of the
      Government are the prime minister and the ministers — so the prime minister holds a seat
      without heading a department, and the sixteen ministers appointed on 12 May 2026 head one
      department each. Two of those ministers, the foreign minister and the minister heading
      the Miniszterelnökség, are also designated deputy prime ministers under article 16(2). A
      deputy premiership is a personal designation made by prime-ministerial decree, not a
      department, so it adds neither a ministry nor a seat. The 16 and the 17 answer different
      questions and are never added together.
    es: >-
      Hungría tiene 16 ministerios pero 17 asientos en el Gobierno. La diferencia es una
      cuestión de texto constitucional y no de interpretación: el artículo 16(1) de la Ley
      Fundamental dispone que «A Kormány tagjai a miniszterelnök és a miniszterek» —los
      miembros del Gobierno son el primer ministro y los ministros—, de modo que el primer
      ministro ocupa un asiento sin encabezar ningún departamento y los dieciséis ministros
      nombrados el 12 de mayo de 2026 encabezan un departamento cada uno. Dos de ellos, la
      ministra de Asuntos Exteriores y el ministro que dirige la Miniszterelnökség, son además
      viceprimeros ministros conforme al artículo 16(2). La vicepresidencia es una designación
      personal hecha por decreto del primer ministro, no un departamento, y no añade ni
      ministerio ni asiento. El 16 y el 17 responden a preguntas distintas y nunca se suman.
  - en: >-
      The contested case, stated plainly. The Miniszterelnökség (Prime Minister's Office) is
      counted as a ministry, which gives 16; excluding it as the office of the head of
      government would give 15, and would leave the seat count unchanged at 17. It is counted
      for three reasons. Point 12 of § 1 of Act XIII of 2026 lists it among "Magyarország
      minisztériumai" in exactly the same terms as the Belügyminisztérium or the
      Honvédelmi Minisztérium. It is headed by its own minister — the "Miniszterelnökséget
      vezető miniszter", a different person from the prime minister — and § 8(1) of government
      decree 90/2026. (V. 13.) gives that minister a substantive portfolio of nine
      responsibilities including the coordination of European Union affairs and the making of
      EU policy, government communication, the design of the civil-service career and the
      coordination of social policy. And this project's own rule for a chancellery constituted
      as a ministry by national law is to count it and to publish both figures. The argument
      the other way is real and a reader should have it: § 5 of
      the same decree provides that "A miniszterelnök munkaszervezete az általános politikai
      koordinációért felelős miniszter munkaszervezetében működik" — the prime minister's own
      work organisation operates inside the work organisation of the minister responsible for
      general political coordination, which is this ministry — and § 16(2) of the Act on
      government administration places the Miniszterelnöki Kormányiroda inside it too. So the
      Miniszterelnökség does house the prime minister's apparatus. What it is not is a body
      whose head is the prime minister, and that is the distinction this project draws. The
      prime minister's seat and the Miniszterelnöki Kormányiroda are both recorded separately
      below and neither is counted.
    es: >-
      El caso discutido, dicho sin rodeos. La Miniszterelnökség (Oficina del Primer Ministro)
      se cuenta como ministerio, lo que da 16; excluirla como oficina del jefe de gobierno
      daría 15 y dejaría el número de asientos igual, en 17. Se cuenta por tres razones. El
      punto 12 del § 1 de la Ley XIII de 2026 la enumera entre «Magyarország minisztériumai»
      exactamente en los mismos términos que el Ministerio del Interior o el de Defensa. La
      encabeza su propio ministro —el «Miniszterelnökséget vezető miniszter», persona distinta
      del primer ministro— y el § 8(1) del decreto gubernamental 90/2026. (V. 13.) atribuye a
      ese ministro una cartera sustantiva de nueve responsabilidades, entre ellas la
      coordinación de los asuntos de la Unión Europea y la elaboración de la política europea,
      la comunicación gubernamental, el diseño de la carrera en la función pública y la
      coordinación de la política social. Y la regla propia de este proyecto para una
      cancillería constituida como ministerio por la ley nacional es contarla y publicar ambas
      cifras. El argumento contrario existe y el lector debe conocerlo: el § 5 del mismo decreto dispone que «A miniszterelnök munkaszervezete az
      általános politikai koordinációért felelős miniszter munkaszervezetében működik» —la
      organización de trabajo del primer ministro funciona dentro de la del ministro
      responsable de la coordinación política general, que es este ministerio— y el § 16(2) de
      la ley de administración gubernamental sitúa también dentro de ella la Miniszterelnöki
      Kormányiroda. La Miniszterelnökség aloja, por tanto, el aparato del primer ministro. Lo
      que no es es un órgano cuyo titular sea el primer ministro, y esa es la distinción que
      traza este proyecto. El asiento del primer ministro y la Miniszterelnöki
      Kormányiroda se registran aparte más abajo y ninguno se cuenta.
  - en: >-
      Do not compare 16 with a pre-2026 Hungarian figure without reading this. The repealed
      2022 act listed thirteen ministries and included *both* the Miniszterelnökség and the
      Miniszterelnöki Kabinetiroda, and its § 2 made the Kabinetiroda, not the
      Miniszterelnökség, the prime minister's work organisation. Act XIII of 2026 dissolved the
      Kabinetiroda into the Miniszterelnökség (§ 2(7)) and dissolved the Ministry for European
      Union Affairs into it as well (§ 2(6)), split three new ministries out of the
      Belügyminisztérium and one each out of the energy and the culture ministries, and renamed
      seven others. Both dissolved bodies kept operating as budgetary and government
      administrative organs after 13 May — § 4(2) and § 4(3) of the act say so, and put the
      minister heading the Miniszterelnökség in charge of them — until 15 June 2026, the date
      fixed by § 206 of decree 90/2026. They are therefore recorded here with 15 June 2026 as
      their end date, as departments superseded during the term, so they appear in the
      cabinet's history and not in its current structure. A source counting Hungary's
      ministries on 12 May 2026 answers a different question from one counting them today.
    es: >-
      No compare el 16 con una cifra húngara anterior a 2026 sin leer esto. La ley de 2022,
      hoy derogada, enumeraba trece ministerios e incluía *tanto* la Miniszterelnökség como la
      Miniszterelnöki Kabinetiroda, y su § 2 hacía de la Kabinetiroda, no de la
      Miniszterelnökség, la organización de trabajo del primer ministro. La Ley XIII de 2026
      disolvió la Kabinetiroda en la Miniszterelnökség (§ 2(7)) y disolvió también en ella el
      Ministerio de Asuntos de la Unión Europea (§ 2(6)), escindió tres ministerios nuevos del
      Ministerio del Interior y uno de los de Energía y de Cultura respectivamente, y cambió el
      nombre de otros siete. Los dos órganos disueltos siguieron funcionando como órganos
      presupuestarios y de administración gubernamental después del 13 de mayo —así lo dicen
      los § 4(2) y § 4(3) de la ley, que ponen al frente de ellos al ministro que dirige la
      Miniszterelnökség— hasta el 15 de junio de 2026, fecha fijada por el § 206 del decreto
      90/2026. Por eso se registran aquí con el 15 de junio de 2026 como fecha de fin, como
      departamentos sustituidos durante la legislatura, de modo que aparecen en la historia
      del gabinete y no en su estructura actual. Una fuente que cuente los ministerios húngaros a 12 de mayo de 2026
      responde a una pregunta distinta de la que cuenta los de hoy.
  - en: >-
      Hungary has no ministers without portfolio in this government, and their absence is a
      fact rather than an omission. Article 17(2) of the Fundamental Law provides that a
      "tárca nélküli miniszter" may be appointed for a remit determined by the Government;
      neither Act XIII of 2026 nor the repealed 2022 act names any, decree 90/2026 does not use
      the phrase at all, and decision 76/2026. (V. 12.) KE appointed exactly sixteen ministers
      whose sixteen titles map one-to-one onto the sixteen ministries. Nor are the
      "kormánybiztos" (government commissioners), whose activity § 8(1)(e) of decree 90/2026
      puts under the minister heading the Miniszterelnökség, members of the Government under
      article 16(1); they are absent from this page for that reason. State secretaries
      (államtitkár) and administrative state secretaries (közigazgatási államtitkár) are
      likewise not members of the Government and are not recorded, with one exception: the
      administrative state secretary who heads the Miniszterelnöki Kormányiroda, because that
      body is one a reader looking for Hungary's prime-ministerial office will go hunting for.
    es: >-
      Hungría no tiene ministros sin cartera en este gobierno, y su ausencia es un hecho y no
      una omisión. El artículo 17(2) de la Ley Fundamental dispone que puede nombrarse un
      «tárca nélküli miniszter» para un cometido determinado por el Gobierno; ni la Ley XIII de
      2026 ni la derogada ley de 2022 nombran a ninguno, el decreto 90/2026 no emplea la
      expresión y la decisión 76/2026. (V. 12.) KE nombró exactamente dieciséis ministros cuyos
      dieciséis títulos se corresponden uno a uno con los dieciséis ministerios. Tampoco los
      «kormánybiztos» (comisionados del Gobierno), cuya actividad el § 8(1)(e) del decreto
      90/2026 sitúa bajo el ministro que dirige la Miniszterelnökség, son miembros del Gobierno
      según el artículo 16(1); están ausentes de esta ficha por esa razón. Los secretarios de
      Estado (államtitkár) y los secretarios de Estado administrativos (közigazgatási
      államtitkár) tampoco son miembros del Gobierno y no se registran, con una excepción: el
      secretario de Estado administrativo que dirige la Miniszterelnöki Kormányiroda, porque
      ese órgano es uno que buscará quien vaya tras la oficina del primer ministro húngaro.
  - en: >-
      Where the policy-area tags come from, and three that will surprise a reader. Every
      counted ministry is tagged from the responsibilities that government decree 90/2026.
      (V. 13.) assigns to its minister, each ministry having its own subtitle in chapter III:
      §§ 8, 25, 34, 56, 60, 75, 93, 97, 106, 118, 124, 130, 145, 157, 168 and 179, in that
      order. First surprise: sport is in the interior ministry, whose § 34(1) makes the
      belügyminiszter responsible for "sportpolitikáért" and for major international sporting
      events, so no Hungarian ministry has sport in its name and the sport tag sits on the
      Belügyminisztérium. Second: foreign trade is not in the foreign ministry. The former
      Külgazdasági és Külügyminisztérium was renamed simply Külügyminisztérium and
      "külgazdasági ügyekért" is listed under the economic and energy minister in § 75, so the
      trade tag sits there. Third: three remits this project's vocabulary of policy areas
      cannot express are missing rather than approximated — the minority-affairs and diaspora
      ministry's "nemzetiségpolitika" (policy toward Hungary's recognised national minorities)
      has no matching area, nor does its remit for relations with civil society, and the
      science ministry's "kormányzati tudománypolitika" carries the research area rather than
      innovation because the decree assigns it no innovation remit even though the ministry is
      the successor of the Kulturális és Innovációs Minisztérium.
    es: >-
      De dónde salen las áreas de política, y tres que sorprenderán al lector. Cada ministerio
      contado se etiqueta a partir de las responsabilidades que el decreto gubernamental
      90/2026. (V. 13.) asigna a su ministro, con un subtítulo propio para cada ministerio en
      el capítulo III: §§ 8, 25, 34, 56, 60, 75, 93, 97, 106, 118, 124, 130, 145, 157, 168 y
      179, en ese orden. Primera sorpresa: el deporte está en el ministerio del Interior, cuyo
      § 34(1) hace al belügyminiszter responsable de la «sportpolitikáért» y de los grandes
      eventos deportivos internacionales, de modo que ningún ministerio húngaro lleva el
      deporte en el nombre y la etiqueta de deporte va al Belügyminisztérium. Segunda: el comercio
      exterior no está en Exteriores. El antiguo Külgazdasági és Külügyminisztérium pasó a
      llamarse simplemente Külügyminisztérium y los «külgazdasági ügyekért» figuran bajo el
      ministro de Economía y Energía en el § 75, así que la etiqueta de comercio va allí. Tercera:
      tres competencias que el vocabulario de áreas de este proyecto no puede expresar faltan
      en lugar de aproximarse — la «nemzetiségpolitika» (política hacia las minorías nacionales
      reconocidas de Hungría) del ministerio de Relaciones Sociales y Cultura no tiene área
      equivalente, ni tampoco su competencia sobre las relaciones con la sociedad civil, y la
      «kormányzati tudománypolitika» del ministerio de Ciencia lleva el área de investigación y
      no la de innovación porque el decreto no le asigna competencia de innovación aunque el
      ministerio sea el sucesor del Kulturális és Innovációs Minisztérium.
  - en: >-
      All English and Spanish names on this page are the project's own. Hungary's government
      publishes no English list of its ministries: kormany.hu carries /en/ paths for every
      ministry, but as of 28 July 2026 they serve the Hungarian pages unchanged, so there is no
      official English nomenclature to adopt and every English and Spanish name is this
      project's own translation, and is marked as such. Two renderings are worth flagging. "Miniszterelnökség"
      is given as "Prime Minister's Office" because that is what it is called in ordinary
      English usage, but the name should not be read as implying that the prime minister heads
      it — see note 2. And "Élő Környezetért Felelős Minisztérium" is rendered literally as
      "Ministry for the Living Environment": it is the environment, nature, water and waste
      department, and the reader who expects a Hungarian climate or energy ministry will find
      energy in the Gazdasági és Energetikai Minisztérium and no dedicated climate portfolio at
      all.
    es: >-
      Todos los nombres en inglés y español de esta ficha son del proyecto. El Gobierno de
      Hungría no publica una lista en inglés de sus ministerios: kormany.hu mantiene rutas /en/
      para cada ministerio, pero a 28 de julio de 2026 sirven las páginas húngaras sin cambios,
      por lo que no hay nomenclatura oficial en inglés que adoptar y todos los nombres en
      inglés y en español son traducciones de este proyecto, y así se indican. Dos traducciones
      merecen señalarse. «Miniszterelnökség» se da como «Oficina del Primer Ministro» porque es el
      nombre habitual en español, pero no debe leerse como que el primer ministro la encabece
      —véase la nota 2—. Y «Élő Környezetért Felelős Minisztérium» se traduce literalmente como
      «Ministerio para el Entorno Vivo»: es el departamento de medio ambiente, naturaleza, agua
      y residuos, y quien espere un ministerio húngaro de clima o de energía encontrará la
      energía en el Gazdasági és Energetikai Minisztérium y ninguna cartera de clima.
  - en: >-
      The abbreviations recorded here are ministerial, not departmental. § 193 of decree
      90/2026 prescribes the short form to be used for each minister when legislation cites
      one — MvM, AÉM, EüM, ÉKFM, BM, KBM, GEM, HM, IM, KüM, TKKM, OGYM, PM, SZCSM, TTM, VTM —
      and no instrument fixes an acronym for the ministries themselves. Several of these are
      also the ministries' everyday acronyms; BM in particular appears as a departmental prefix
      in the decree's own annex ("Belügyminisztérium Országos Katasztrófavédelmi
      Főigazgatóság"). They are recorded here because they are the only
      official short forms that exist, but a reader should know that MvM strictly abbreviates
      the *minister* heading the Miniszterelnökség rather than the ministry, and that PM here
      means Pénzügyminisztérium and not prime minister.
    es: >-
      Las abreviaturas registradas aquí son ministeriales, no departamentales. El § 193 del
      decreto 90/2026 prescribe la forma abreviada que debe usarse para cada ministro cuando
      una norma lo cita —MvM, AÉM, EüM, ÉKFM, BM, KBM, GEM, HM, IM, KüM, TKKM, OGYM, PM, SZCSM,
      TTM, VTM— y ningún instrumento fija un acrónimo para los ministerios en sí. Varias son
      además los acrónimos de uso corriente de los ministerios; BM en particular aparece como
      prefijo departamental en el propio anexo del decreto («Belügyminisztérium Országos
      Katasztrófavédelmi Főigazgatóság»). Se registran aquí porque son las
      únicas formas breves oficiales que existen, pero el lector debe saber que MvM abrevia
      estrictamente al *ministro* que dirige la Miniszterelnökség y no al ministerio, y que PM
      aquí significa Pénzügyminisztérium y no primer ministro.

sources:
  - id: njt-2026-evi-xiii-torveny
    tier: 1
    type: statute
    publisher: Nemzeti Jogszabálytár — MKIFK Magyar Közlönykiadó és Igazságügyi Fordítóközpont Zrt.
    title: 2026. évi XIII. törvény Magyarország minisztériumainak felsorolásáról
    url: https://njt.jog.gov.hu/jogszabaly/2026-13-00-00.0
    archive_url: https://web.archive.org/web/20260728101012/https://njt.jog.gov.hu/jogszabaly/2026-13-00-00.0
    lang: hu
    published: 2026-05-09
    accessed: 2026-07-28
    quote: |-
      1. § Magyarország minisztériumai a következők:
      1. Egészségügyi Minisztérium,
      2. Igazságügyi Minisztérium,
      3. Oktatási és Gyermekügyi Minisztérium,
      4. Pénzügyminisztérium,
      5. Agrár- és Élelmiszergazdaságért Felelős Minisztérium,
      6. Belügyminisztérium,
      7. Élő Környezetért Felelős Minisztérium,
      8. Gazdasági és Energetikai Minisztérium,
      9. Honvédelmi Minisztérium,
      10. Közlekedési és Beruházási Minisztérium,
      11. Külügyminisztérium,
      12. Miniszterelnökség,
      13. Szociális és Családügyi Minisztérium,
      14. Társadalmi Kapcsolatokért és Kultúráért Felelős Minisztérium,
      15. Tudományos és Technológiai Minisztérium,
      16. Vidék- és Településfejlesztési Minisztérium.
    note: >-
      The consolidated text on the official Nemzeti Jogszabálytár, whose state marker reads
      2026.05.13. and whose "Változott rendelkezések" panel reports no past and no scheduled
      change, so the consolidated text reflects no amendment: it is the act as enacted, in force
      unamended from 13 May 2026 to the access date. The act's own footnote records "A törvényt
      az Országgyűlés a 2026. május 9-i ülésnapján fogadta el. A kihirdetés napja: 2026. május
      9.", which is the `published` date. The order of the sixteen entities below follows this
      section; note that it is alphabetical only from point 5 onwards, the first four being
      listed out of alphabetical order, and the order recorded here is the statute's and not a
      normalised one.

  - id: mk-2026-44-torveny-xiii
    tier: 1
    type: official_gazette
    publisher: Magyar Közlöny — Magyarország hivatalos lapja
    title: >-
      Magyar Közlöny 2026. évi 44. szám — 2026. évi XIII. törvény Magyarország
      minisztériumainak felsorolásáról, 2–6. §
    url: https://www.magyarkozlony.hu/dokumentumok/7f841dfae11a76776f555462bc09e8741289997a/letoltes
    archive_url: https://web.archive.org/web/20260519004157/https://www.magyarkozlony.hu/dokumentumok/7f841dfae11a76776f555462bc09e8741289997a/letoltes
    lang: hu
    published: 2026-05-09
    accessed: 2026-07-28
    quote: |-
      2. § (1) Az Egészségügyi Minisztérium a Belügyminisztériumból történő kiválással jön létre.
      (2) Az Oktatási és Gyermekügyi Minisztérium a Belügyminisztériumból történő kiválással jön létre.
      (3) Az Élő Környezetért Felelős Minisztérium a Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti Energiaügyi Minisztériumból történő kiválással jön létre.
      (4) A Szociális és Családügyi Minisztérium a Belügyminisztériumból történő kiválással jön létre.
      (5) A Társadalmi Kapcsolatokért és Kultúráért Felelős Minisztérium a Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti Kulturális és Innovációs Minisztériumból történő kiválással jön létre.
      (6) Az Európai Uniós Ügyek Minisztériuma a Miniszterelnökségbe történő beolvadással megszűnik.
      (7) A Miniszterelnöki Kabinetiroda a Miniszterelnökségbe történő beolvadással megszűnik.
      3. § (1) A Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti Nemzetgazdasági Minisztérium Pénzügyminisztérium elnevezéssel működik tovább.
      (2) A Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti Agrárminisztérium Agrár- és Élelmiszergazdaságért Felelős Minisztérium elnevezéssel működik tovább.
      (3) A Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti Energiaügyi Minisztérium Gazdasági és Energetikai Minisztérium elnevezéssel működik tovább.
      (4) A Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti Építési és Közlekedési Minisztérium Közlekedési és Beruházási Minisztérium elnevezéssel működik tovább.
      (5) A Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti Külgazdasági és Külügyminisztérium Külügyminisztérium elnevezéssel működik tovább.
      (6) A Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti Kulturális és Innovációs Minisztérium Tudományos és Technológiai Minisztérium elnevezéssel működik tovább.
      (7) A Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti Közigazgatási és Területfejlesztési Minisztérium Vidék- és Településfejlesztési Minisztérium elnevezéssel működik tovább.
      4. § (1) Az 1. § szerinti minisztériumok és a Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény szerinti minisztériumok közötti jogutódlást a Kormány eredeti jogalkotói hatáskörben kiadott rendelete állapítja meg.
      (2) A 2. § (6) és (7) bekezdésében meghatározott minisztériumok az államháztartásról szóló törvény szerinti költségvetési szervként, valamint a kormányzati igazgatásról szóló törvény szerinti kormányzati igazgatási szervként az (1) bekezdés szerinti kormányrendeletben meghatározott időpontig működnek.
      (3) Az 1. § 12. pontjában meghatározott minisztériumot vezető miniszter gyakorolja a 2. § (6) és (7) bekezdésében meghatározott minisztériumok – ideértve költségvetési szervi – vezetőjének hatásköreit. A 2. § (6) és (7) bekezdésében meghatározott minisztériumok megszűnésének időpontját az (1) bekezdés szerinti kormányrendelet határozza meg.
      5. § (1) Ez a törvény az országgyűlési képviselők 2026. évi általános választását követően megalakult Országgyűlés alakuló ülésén megválasztott miniszterelnök által vezetett Kormány megalakulásának napján lép hatályba.
      (2) Az (1) bekezdés szerinti feltétel bekövetkezésének naptári napját a társadalompolitika összehangolásáért felelős miniszter annak ismertté válását követően a Magyar Közlönyben haladéktalanul közzétett egyedi határozatával állapítja meg.
      6. § Hatályát veszti a Magyarország minisztériumainak felsorolásáról szóló 2022. évi II. törvény.
    note: >-
      The gazette PDF of the act as promulgated, pages 2536–2537 of issue 44 of 9 May 2026,
      cited for everything in the act except the § 1 list, which is quoted from the consolidated
      text instead. This is the source for which ministries were created by splitting from
      which, which were merely renamed, and — in § 4(2) and § 4(3) — for the fact that the two
      abolished ministries continued to operate as budgetary and government administrative
      organs under the minister heading the Miniszterelnökség until a date set by government
      decree. The PDF sets these paragraphs in a hanging-indent layout with mid-sentence line
      breaks; the quotation reflows them to one paragraph per numbered subsection and changes
      no word.

