      excluded bodies and for the comparison note. It is what shows that Hungary until 13 May
      2026 had thirteen statutory ministries including both the Miniszterelnökség and the
      Miniszterelnöki Kabinetiroda, and that under § 2 it was the Kabinetiroda, not the
      Miniszterelnökség, that was the prime minister's work organisation — which is the change
      Act XIII of 2026 made and the reason the Miniszterelnökség's treatment had to be decided
      afresh. Its footnote also records the repeal date independently: "A törvényt a 2026. évi
      XIII. törvény 6. §-a hatályon kívül helyezte 2026. május 13. napjával." The act named no
      ministers without portfolio and no government commissioners.

