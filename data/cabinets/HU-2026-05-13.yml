    note: >-
      Page 2593 of the same gazette issue. This is the instrument that put the prime minister in
      office, on 9 May 2026, and it is cited to make plain why this cabinet's `took_office` is
      nevertheless 13 May: the prime minister's own term and the Government's formation are
      different events under articles 16(4) and 16(8) of the Fundamental Law. The Assembly's
      constituent sitting also elected its Speaker and its committees on the same day, so 9 May
      is the date the legislature and the premiership begin and 13 May the date the Government
      does.

