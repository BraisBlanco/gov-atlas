    title: >-
      Magyar Közlöny 2026. évi 45. szám — A Miniszterelnökséget vezető miniszter 1/2026.
      (V. 12.) MvM határozata a Magyarország minisztériumainak felsorolásáról szóló 2026. évi
      XIII. törvény hatálybalépéséről
    url: https://magyarkozlony.hu/hivatalos-lapok/xMDWJs5ow5CMQkII1RA769ea63cd87913/dokumentumok/9c93d581438b96bfe6b1a96a9ee397ffc9badce8/letoltes
    archive_url: https://web.archive.org/web/20260513192031/https://magyarkozlony.hu/hivatalos-lapok/xMDWJs5ow5CMQkII1RA769ea63cd87913/dokumentumok/9c93d581438b96bfe6b1a96a9ee397ffc9badce8/letoltes
    lang: hu
    published: 2026-05-12
    accessed: 2026-07-28
    quote: >-
      Megállapítom, hogy a Magyarország minisztériumainak felsorolásáról szóló 2026. évi XIII.
      törvény (a továbbiakban: törvény) 5. § (1) bekezdése szerinti feltétel bekövetkezésének
      napja, erre tekintettel a törvény hatálybalépésének naptári napja 2026. május 13., azaz
      kettőezerhuszonhat május tizenharmadik napja.
    note: >-
      Page 2598 of the same issue. Act XIII of 2026 does not carry a calendar entry-into-force
      date: its § 5(1) ties entry into force to the day the new Government is formed, and § 5(2)
      requires the minister responsible for coordinating social policy to publish a decision in
      the Magyar Közlöny fixing that calendar day once it is known. This is that decision, and
      it is the official determination that the Government was formed on 13 May 2026. It was
      signed on 12 May by the outgoing holder of the Miniszterelnökség portfolio, which is why
      the signature is Gergely Gulyás's and not the incoming minister's. The Nemzeti
      Jogszabálytár's state marker for the act, 2026.05.13., agrees, and so does the footnote to
      the repealed 2022 act, which records that § 6 of Act XIII repealed it "2026. május 13.
      napjával".

