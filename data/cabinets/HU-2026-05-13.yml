    quote: |-
      16. § (1) A Miniszterelnöki Kormányiroda kormányzati igazgatási munkaszervezet.
      (2) A Miniszterelnöki Kormányiroda az általános politikai koordinációért felelős miniszter által vezetett minisztériumban működik.
    note: >-
      The Act on government administration, in its consolidated state of 6 January 2026 (the
      next change is scheduled for 26 August 2026 and does not touch this section). Cited for
      the status of the Miniszterelnöki Kormányiroda, which Act XIII does not mention at all:
      it is a work organisation operating inside the ministry led by the minister responsible
      for general political coordination — the Miniszterelnökség — and § 17(1) provides that
      "A Miniszterelnöki Kormányirodát közigazgatási államtitkár vezeti", an administrative
      state secretary and not a minister. That is why it is recorded and not counted, and it is
      the closest thing in Hungarian law to a prime-ministerial office distinct from a ministry.

