  - id: normattiva-costituzione-art92
    tier: 1
    type: statute
    publisher: Normattiva - Istituto Poligrafico e Zecca dello Stato
    title: Costituzione della Repubblica Italiana - articolo 92
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:costituzione:1947-12-27~art92
    archive_url: https://web.archive.org/web/20260116212414/https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:costituzione:1947-12-27~art92
    lang: it
    published: 1947-12-27
    accessed: 2026-07-27
    quote: >-
      Il Governo della Repubblica è composto del Presidente del Consiglio e dei ministri,
      che costituiscono insieme il Consiglio dei ministri.
    note: >-
      The constitutional definition of the cabinet, and therefore the reason the President
      of the Council holds a seat without a department while an under-secretary holds
      neither. It is what makes cabinet_seats_count 25 while ministries_count is 15 a matter
      of Italian constitutional law rather than of our interpretation.

  - id: normattiva-legge-400-1988-art9
    tier: 1
    type: statute
    publisher: Normattiva - Istituto Poligrafico e Zecca dello Stato
    title: >-
      Legge 23 agosto 1988, n. 400, Disciplina dell'attività di Governo e ordinamento della
      Presidenza del Consiglio dei Ministri - articolo 9 (Ministri senza portafoglio,
      incarichi speciali di Governo, incarichi di reggenza ad interim), testo consolidato
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:1988-08-23;400~art9
    archive_url: https://web.archive.org/web/20251116163422/https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:1988-08-23;400~art9
    lang: it
    published: 1988-09-12
    accessed: 2026-07-27
    quote: >-
      All'atto della costituzione del Governo, il Presidente della Repubblica, su proposta
      del Presidente del Consiglio dei ministri, può nominare, presso la Presidenza del
      Consiglio dei ministri, ministri senza portafoglio, i quali svolgono le funzioni loro
      delegate dal Presidente del Consiglio dei ministri sentito il Consiglio dei ministri,
      con provvedimento da pubblicarsi nella Gazzetta Ufficiale.
    note: >-
      The statutory basis for excluding ministers without portfolio from the ministry count.
      "Presso la Presidenza del Consiglio dei ministri" is the operative phrase: they sit
      inside the Prime Minister's office and exercise delegated functions, so they have
      ministerial rank and a cabinet seat but no administrative department of their own.
      Cited by all nine.

  - id: normattiva-legge-400-1988-art4
    tier: 1
    type: statute
