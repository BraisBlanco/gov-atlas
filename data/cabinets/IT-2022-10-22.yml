      Il sottosegretario di Stato alla Presidenza del Consiglio dei ministri, designato nel
      decreto di nomina, è il segretario del Consiglio ed esercita le relative funzioni; cura
      la verbalizzazione e la conservazione del registro delle deliberazioni.
    note: >-
      Cited to justify recording the Secretary of the Council of Ministers while giving him
      no cabinet seat: the statute gives him a function at every meeting, but article 92 of
      the Constitution confines membership to the President of the Council and the ministers.
