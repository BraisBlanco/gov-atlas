  # --- other bodies recorded, not counted ----------------------------------------
  - id: IT-2022-presidenza-consiglio
    order: 25
    name_original: Presidenza del Consiglio dei Ministri
    abbreviation_original: null
    name_en: Presidency of the Council of Ministers
    name_es: Presidencia del Consejo de Ministros
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Presidente del Consiglio dei ministri
    head_title_en: President of the Council of Ministers
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://www.governo.it
    sources: [normattiva-costituzione-art92, governo-ministri-e-sottosegretari, governo-governo-meloni]
    note:
      en: >-
        Not a ministry: article 2 of decreto legislativo 300/1999 does not list it, it holds no
        portfolio, and it is constituted by a separate statute (decreto legislativo 303/1999).
        It is recorded because article 92 of the Constitution makes its holder a member of the
        Council of Ministers, which is what makes the cabinet 25 people and the government 15
        departments. The nine ministers without portfolio also sit administratively within this
        body; they are recorded separately above and are not double-counted here.
      es: >-
        No es un ministerio: el artículo 2 del decreto legislativo 300/1999 no la enumera, no
        tiene cartera y se constituye por una norma distinta (decreto legislativo 303/1999). Se
        registra porque el artículo 92 de la Constitución hace de su titular un miembro del
        Consejo de Ministros, y eso es lo que hace que el gabinete sean 25 personas y el
        gobierno 15 departamentos. Los nueve ministros sin cartera se encuadran también
        administrativamente en este órgano; se registran por separado más arriba y no se
        cuentan aquí dos veces.

  - id: IT-2022-segretario-consiglio-ministri
    order: 26
    name_original: >-
      Sottosegretario di Stato alla Presidenza del Consiglio dei ministri, con le funzioni di
      Segretario del Consiglio dei ministri
    abbreviation_original: null
    name_en: >-
      Under-Secretary of State to the Presidency of the Council of Ministers, Secretary of the
      Council of Ministers
    name_es: >-
      Subsecretario de Estado de la Presidencia del Consejo de Ministros, Secretario del Consejo
      de Ministros
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Sottosegretario di Stato
    head_title_en: Under-Secretary of State
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: https://www.governo.it
    sources: [normattiva-legge-400-1988-art4, gu-dpr-2022-10-23-mantovano, governo-ministri-e-sottosegretari]
    note:
      en: >-
        Recorded to show where the edge of the cabinet is drawn, and the only junior office in
        this page. Article 4(2) of legge 400/1988 makes this under-secretary the Secretary of
        the Council of Ministers, so he attends every meeting and keeps its minutes, but article
        92 of the Constitution confines membership to the President of the Council and the
        ministers — hence no cabinet seat. Sources that report Italy's cabinet as 26 people are
        counting him. The roughly forty other under-secretaries and vice-ministers work inside
        an existing department and are not enumerated here.
      es: >-
        Se registra para mostrar dónde se traza el límite del gabinete, y es el único cargo
        subordinado de esta ficha. El artículo 4.2 de la legge 400/1988 hace de este
        subsecretario el secretario del Consejo de Ministros, de modo que asiste a todas las
        reuniones y levanta acta, pero el artículo 92 de la Constitución limita la pertenencia
        al presidente del Consejo y a los ministros; de ahí que no tenga asiento. Las fuentes
        que cifran el gabinete italiano en 26 personas lo están contando. Los cerca de cuarenta
        subsecretarios y viceministros restantes trabajan dentro de un departamento existente y
        no se enumeran aquí.
