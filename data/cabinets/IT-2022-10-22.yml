# Italy — government structure of the XIX legislature (Governo Meloni).
#
# Italy is unusual and helpful: the ministries are enumerated by *statute*, not by each
# government's own decree. Article 2 of decreto legislativo 30 luglio 1999, n. 300 lists
# them, and comma 4-bis of the same article fixes their number. A new government does not
# restructure the departments; it fills them.
#
# Two things to notice before reading the entity list:
#
#   1. Nowhere does this file state "15" or "25". Both figures are derived from the
#      entities below.
#   2. The nine *ministri senza portafoglio* are recorded and NOT counted. They hold
#      ministerial rank and a seat in the Consiglio dei Ministri but head no ministry,
#      which is exactly why Italy's cabinet is much larger than its list of ministries.

country: IT
cabinet_id: IT-2022-10-22

cabinet_name_original: Governo Meloni, XIX Legislatura
cabinet_name_en: Meloni Government, 19th legislature
cabinet_name_es: Gobierno Meloni, XIX Legislatura

head_of_government_title_original: Presidente del Consiglio dei ministri
head_of_government_title_en: President of the Council of Ministers

took_office: 2022-10-22
left_office: null

methodology_notes:
  - en: >-
      Italy has 15 ministries but 25 members of its Council of Ministers. The gap is
      almost entirely the nine ministers without portfolio — relations with Parliament,
      public administration, regional affairs and autonomies, civil protection and
      maritime policy, European affairs/NRRP/cohesion policy, sport and youth, family and
      birth rate and equal opportunities, disabilities, and institutional reforms and
      regulatory simplification — plus the President of the Council, who holds a seat
      without heading a department. Neither number is wrong; they answer different
      questions.
    es: >-
      Italia tiene 15 ministerios pero 25 miembros en su Consejo de Ministros. La
      diferencia son, casi por completo, los nueve ministros sin cartera —relaciones con
      el Parlamento, función pública, asuntos regionales y autonomías, protección civil y
      políticas del mar, asuntos europeos/PNRR/políticas de cohesión, deporte y juventud,
      familia y natalidad e igualdad de oportunidades, discapacidades, y reformas
      institucionales y simplificación normativa— más el presidente del Consejo, que
      ocupa asiento sin encabezar ningún departamento. Ninguna de las dos cifras es
      incorrecta; responden a preguntas distintas.
  - en: >-
      Ministers without portfolio are recorded here but never counted as ministries. Under
      article 9(1) of legge 23 agosto 1988, n. 400 they are appointed "presso la
      Presidenza del Consiglio dei ministri" and exercise functions delegated to them by
      the President of the Council; they head a department (*dipartimento*) of the Prime
      Minister's own office, not a ministry with its own budget. They count towards the
      seats figure and never towards the ministries figure. Sources that report "Italy's
      government has 25 members" are counting the Council of Ministers, which is a
      different question from how many ministries exist.
    es: >-
      Los ministros sin cartera se registran aquí pero nunca se cuentan como ministerios.
      Según el artículo 9.1 de la legge 23 agosto 1988, n. 400 se nombran «presso la
      Presidenza del Consiglio dei ministri» y ejercen las funciones que les delega el
      presidente del Consejo; encabezan un departamento (*dipartimento*) de la propia
      oficina del presidente, no un ministerio con presupuesto propio. Cuentan para la
      cifra de asientos y nunca para la de ministerios. Las fuentes que dicen que «el
      gobierno italiano tiene 25 miembros» están contando el Consejo de Ministros, que es
      una pregunta distinta de cuántos ministerios existen.
  - en: >-
      The statutory list and the government's actual roster agree exactly. Article 2(1) of
      decreto legislativo 30 luglio 1999, n. 300, in its consolidated text in force since
      5 January 2023, enumerates fifteen ministries, and comma 4-bis of the same article
      states that "Il numero dei Ministeri è stabilito in quindici". The fifteen ministries
      the Meloni government actually operates are those same fifteen, under those same
      names — so the derived count of 15 needs no reconciliation. This is worth stating
      because the statutory list and the roster can drift: the appointment decree of
      21 October 2022 still used five older names (sviluppo economico, politiche agricole
      alimentari e forestali, transizione ecologica, infrastrutture e mobilità sostenibili,
      istruzione), which decreto-legge 11 novembre 2022, n. 173 replaced weeks later.
    es: >-
      La lista legal y la nómina real del gobierno coinciden exactamente. El artículo 2.1
      del decreto legislativo 30 luglio 1999, n. 300, en su texto consolidado vigente
      desde el 5 de enero de 2023, enumera quince ministerios, y el apartado 4-bis del
      mismo artículo establece que «Il numero dei Ministeri è stabilito in quindici». Los
      quince ministerios que el gobierno Meloni realmente tiene son esos mismos quince,
      con esos mismos nombres, de modo que la cifra derivada de 15 no requiere
      reconciliación. Conviene decirlo porque la lista legal y la nómina pueden divergir:
      el decreto de nombramiento del 21 de octubre de 2022 aún empleaba cinco
      denominaciones anteriores (sviluppo economico, politiche agricole alimentari e
      forestali, transizione ecologica, infrastrutture e mobilità sostenibili,
      istruzione), que el decreto-legge 11 novembre 2022, n. 173 sustituyó semanas
      después.
  - en: >-
      Two ministers also hold the functions of Vice-President of the Council: the Minister
      of Foreign Affairs and International Cooperation and the Minister of Infrastructure
      and Transport. A vice-presidency is a personal office attributed to a serving
      minister, not a department, so it adds neither a ministry nor a cabinet seat; each is
      counted once, through the ministry he heads.
    es: >-
      Dos ministros ostentan además las funciones de vicepresidente del Consejo: el
      ministro de Asuntos Exteriores y de la Cooperación Internacional y el ministro de
      Infraestructuras y Transportes. Una vicepresidencia es un cargo personal atribuido a
      un ministro en ejercicio, no un departamento, por lo que no añade ni ministerio ni
      asiento en el gabinete; cada uno se cuenta una sola vez, a través del ministerio que
      encabeza.
  - en: >-
      The delegations of ministers without portfolio are personal and are conferred by
      decree of the President of the Council, so they change during a term while the
      number of posts does not. Three of the nine differ from the original decree of
      23 October 2022: civil protection was added to the maritime-policy portfolio and
      "the South" removed from it (decree of 10 November 2022); regulatory simplification
      was added to institutional reforms (same date); and the European affairs portfolio
      was re-conferred, retitled and given to a different person in December 2024. This
      page records the configuration in force on the access date, 27 July 2026, and cites
      the decree behind each. The count of nine such posts has held throughout the term,
      so the seats figure is unaffected by the churn.
    es: >-
      Las delegaciones de los ministros sin cartera son personales y se confieren por
      decreto del presidente del Consejo, de modo que cambian a lo largo de la legislatura
      aunque el número de puestos no lo haga. Tres de los nueve difieren del decreto
      original del 23 de octubre de 2022: se añadió la protección civil a la cartera de
      políticas del mar y se le retiró «el Sur» (decreto del 10 de noviembre de 2022); se
      añadió la simplificación normativa a las reformas institucionales (misma fecha); y
      la cartera de asuntos europeos se volvió a conferir, con otro título y a otra
      persona, en diciembre de 2024. Esta ficha registra la configuración vigente en la
      fecha de consulta, 27 de julio de 2026, y cita el decreto de cada una. El número de
      nueve puestos se ha mantenido toda la legislatura, por lo que la cifra de asientos no
      se ve afectada por esos cambios.
  - en: >-
      The Presidenza del Consiglio dei Ministri is not a ministry. Article 2 of decreto
      legislativo 300/1999 does not list it, it holds no portfolio, and it is governed by a
      separate statute (decreto legislativo 30 luglio 1999, n. 303). It is recorded because
      its holder chairs the Council of Ministers, which is what makes the cabinet 25 people
      and the government 15 departments.
    es: >-
      La Presidenza del Consiglio dei Ministri no es un ministerio. El artículo 2 del
      decreto legislativo 300/1999 no la enumera, no tiene cartera y se rige por una norma
      distinta (decreto legislativo 30 luglio 1999, n. 303). Se registra porque su titular
      preside el Consejo de Ministros, y eso es lo que hace que el gabinete sean 25
      personas y el gobierno 15 departamentos.
  - en: >-
      Vice-ministri and sottosegretari di Stato are subordinate to a minister and work
      inside an existing department, so they are neither ministries nor cabinet seats and
      are not enumerated here — there are around forty of them and they are outside this
      project's scope. One exception is recorded: the Under-Secretary of State to the
      Presidency of the Council who serves as Secretary of the Council of Ministers. He
      attends every meeting and signs its minutes, but article 92 of the Constitution makes
      the Council "il Presidente del Consiglio e i ministri" only, so he is recorded with no
      cabinet seat. Sources that put Italy's cabinet at 26 are including him.
    es: >-
      Los viceministros y los subsecretarios de Estado están subordinados a un ministro y
      trabajan dentro de un departamento existente, por lo que no son ni ministerios ni
      asientos en el gabinete y no se enumeran aquí: son unos cuarenta y quedan fuera del
      alcance de este proyecto. Se registra una excepción: el subsecretario de Estado de la
      Presidencia del Consejo que ejerce de secretario del Consejo de Ministros. Asiste a
      todas las reuniones y firma sus actas, pero el artículo 92 de la Constitución define
      el Consejo únicamente como «il Presidente del Consiglio e i ministri», de modo que se
      registra sin asiento en el gabinete. Las fuentes que cifran el gabinete italiano en
      26 lo están incluyendo.

sources:
  - id: normattiva-dlgs-300-1999-art2
    tier: 1
    type: statute
    publisher: Normattiva - Istituto Poligrafico e Zecca dello Stato
    title: >-
      Decreto legislativo 30 luglio 1999, n. 300, Riforma dell'organizzazione del Governo,
      a norma dell'articolo 11 della legge 15 marzo 1997, n. 59 - articolo 2 (Ministeri),
      testo consolidato
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:1999-07-30;300~art2
    archive_url: "https://web.archive.org/web/20260727183540/https://www.normattiva.it/atto/caricaDettaglioAtto?atto.dataPubblicazioneGazzetta=1999-08-30&atto.codiceRedazionale=099G0372&atto.articolo.numero=2&atto.articolo.sottoArticolo=1&atto.articolo.sottoArticolo1=10&tipoDettaglio=multivigenza&qId=&tabID=0.1&title=lbl.risultatoRicerca"
    lang: it
    published: 1999-08-30
    accessed: 2026-07-27
    quote: |-
      Art. 2
      (Ministeri)
      1. I Ministeri sono i seguenti:
      1) Ministero degli affari esteri e della cooperazione internazionale;
      2) Ministero dell'interno;
      3) Ministero della giustizia;
      4) Ministero della difesa;
      5) Ministero dell'economia e delle finanze;
      6) Ministero delle imprese e del made in Italy;
      7) Ministero dell'agricoltura, della sovranità alimentare e delle foreste;
      8) Ministero dell'ambiente e della sicurezza energetica;
      9) Ministero delle infrastrutture e dei trasporti;
      10) Ministero del lavoro e delle politiche sociali;
      11) Ministero dell'istruzione e del merito;
      12) Ministero dell'università e della ricerca;
      13) Ministero della cultura;
      14) Ministero della salute;
      15) Ministero del turismo.
      [...]
      4-bis. Il numero dei Ministeri è stabilito in quindici. Il numero totale dei componenti del Governo a qualsiasi titolo, ivi compresi Ministri senza portafoglio, vice Ministri e Sottosegretari, non può essere superiore a sessantacinque e la composizione del Governo deve essere coerente con il principio sancito nel secondo periodo del primo comma dell'articolo 51 della Costituzione.
    note: >-
      Consolidated text of article 2, in force since 5 January 2023. That version reflects
      the amendments made by decreto-legge 11 novembre 2022, n. 173, as converted with
      modifications by legge 16 dicembre 2022, n. 204, whose coordinated text was published
      in Gazzetta Ufficiale n. 3 of 4 January 2023; no later act has amended article 2. The
      listing order of the counted ministries below follows this enumeration. The quote is
      normalised in two disclosed ways and is otherwise verbatim. First, commas 2 to 4 are
      elided at "[...]". Second, the quote omits Normattiva's "((" and "))" markers, which
      the portal prints inline to delimit text introduced into an article by a later
      amendment; the entries so marked are 6, 7, 8, 9 and 11 — exactly the five renamed by
      decreto-legge 173/2022 — so that where this quote reads "6) Ministero delle imprese e
      del made in Italy;" the snapshot reads "6) Ministero ((delle imprese e del made in
      Italy));". The markers are display notation of the database rather than text of the
      decree, but a reader comparing the quote against the snapshot will see them, hence
      this note. Normattiva's URN resolver (the url above) cannot be captured by a web archive
      — it returns a session error to crawlers — so archive_url is a snapshot, taken on the
      access date, of Normattiva's equivalent article view of the same article, carrying the
      identical consolidated text.

  - id: gu-dpr-2022-10-21-nomina-ministri
    tier: 1
    type: official_gazette
    publisher: Gazzetta Ufficiale della Repubblica Italiana
    title: >-
      Decreto del Presidente della Repubblica 21 ottobre 2022, Nomina dei Ministri
      (22A06175)
    url: https://www.gazzettaufficiale.it/eli/id/2022/10/25/22A06175/sg
    archive_url: https://web.archive.org/web/20240424162113/https://www.gazzettaufficiale.it/eli/gu/2022/10/25/250/sg/pdf
    lang: it
    published: 2022-10-25
    accessed: 2026-07-27
    quote: |-
      Sono nominati Ministri senza portafoglio:
      a) il sen. Luca Ciriani;
      b) il sen. Paolo Zangrillo;
      c) il sen. Roberto Calderoli;
      d) il sen. Sebastiano Musumeci, detto Nello;
      e) l’on. Raffaele Fitto;
      f) il dott. Andrea Abodi;
      h) l’on. Eugenia Maria Roccella;
      i) la dott.ssa Alessandra Locatelli;
      l) la sen. Maria Elisabetta Alberti Casellati.
      Sono nominati Ministri:
      degli affari esteri e della cooperazione internazionale: l’on. Antonio Tajani;
      dell’interno: il pref. Matteo Piantedosi;
      della giustizia: l’on. Carlo Nordio;
      della difesa: il sig. Guido Crosetto;
      dell’economia e delle finanze: l’on. Giancarlo Giorgetti;
      dello sviluppo economico: il sen. Adolfo Urso;
      delle politiche agricole alimentari e forestali: l’on. Francesco Lollobrigida;
      della transizione ecologica: l’on. Gilberto Pichetto Fratin;
      delle infrastrutture e della mobilità sostenibili: il sen. Matteo Salvini;
      del lavoro e delle politiche sociali: la dott.ssa Marina Elvira Calderone;
      dell’istruzione: il prof. Giuseppe Valditara;
      dell’università e della ricerca: la sen. Anna Maria Bernini;
      della cultura: il dott. Gennaro Sangiuliano;
      della salute: il prof. Orazio Schillaci;
      del turismo: la sen. Daniela Garnero Santanché.
    note: >-
      The decree that constituted the government: it appoints nine ministers without
      portfolio and fifteen ministers, one for each ministry in article 2 of decreto
      legislativo 300/1999, which is the tier-1 evidence that all fifteen statutory
      ministries are actually filled. Two features of the printed text are reproduced as
      they stand: the lettering of the ministers without portfolio skips "g)", and five
      ministries are named with the denominations they bore before decreto-legge 173/2022
      renamed them. The Gazzetta Ufficiale act page renders decree text inside an iframe
      that web archives do not capture, so archive_url is a snapshot of the archived PDF of
      the whole issue (Serie generale n. 250 of 25 October 2022), where the quoted text
      appears verbatim on page 2.

  - id: gu-dl-173-2022-testo-coordinato
    tier: 1
    type: official_gazette
    publisher: Gazzetta Ufficiale della Repubblica Italiana
    title: >-
      Testo del decreto-legge 11 novembre 2022, n. 173, coordinato con la legge di
      conversione 16 dicembre 2022, n. 204, recante: «Disposizioni urgenti in materia di
      riordino delle attribuzioni dei Ministeri» (22A07447)
    url: https://www.gazzettaufficiale.it/eli/id/2023/01/04/22A07447/SG
    archive_url: https://web.archive.org/web/20240811101627/https://www.gazzettaufficiale.it/eli/gu/2023/01/04/3/sg/pdf
    lang: it
    published: 2023-01-04
    accessed: 2026-07-27
    quote: |-
      Art. 1.
      Modifiche all’articolo 2 del decreto legislativo 30 luglio 1999, n. 300
      1. All’articolo 2, comma 1, del decreto legislativo 30 luglio 1999, n. 300, sono apportate le seguenti modificazioni:
      a) il numero 6) è sostituito dal seguente: «6) Ministero delle imprese e del made in Italy»;
      b) il numero 7) è sostituito dal seguente: «7) Ministero dell’agricoltura, della sovranità alimentare e delle foreste»;
      c) il numero 8) è sostituito dal seguente: «8) Ministero dell’ambiente e della sicurezza energetica»;
      d) il numero 9) è sostituito dal seguente: «9) Ministero delle infrastrutture e dei trasporti»;
      e) il numero 11) è sostituito dal seguente: «11) Ministero dell’istruzione e del merito».
    note: >-
      The amendment behind the consolidated text cited above, and the tier-1 authority for
      the five current names that differ from the appointment decree of 21 October 2022.
      Cited by exactly those five ministries. The renamings are pure redenominations: each
      article of the decree states that the existing ministry "assume la denominazione di"
      the new name, so no ministry was created or abolished and the entities are not split
      with valid_from / valid_to. As with the other Gazzetta Ufficiale citations,
      archive_url points at the archived PDF of the whole issue (Serie generale n. 3 of
      4 January 2023) because the act page itself renders the text in an uncaptured iframe;
      the quoted text appears verbatim on page 82.

  - id: gu-dpcm-2022-10-23-incarichi-senza-portafoglio
    tier: 1
    type: official_gazette
    publisher: Gazzetta Ufficiale della Repubblica Italiana
    title: >-
      Decreto del Presidente del Consiglio dei Ministri 23 ottobre 2022, Conferimento di
      incarichi ai Ministri senza portafoglio (22A06178)
    url: https://www.gazzettaufficiale.it/eli/id/2022/10/25/22A06178/sg
    archive_url: https://web.archive.org/web/20240424162113/https://www.gazzettaufficiale.it/eli/gu/2022/10/25/250/sg/pdf
    lang: it
    published: 2022-10-25
    accessed: 2026-07-27
    quote: |-
      Ai sottoelencati Ministri senza portafoglio sono conferiti i seguenti incarichi:
      al sen. Luca CIRIANI i rapporti con il Parlamento;
      al sen. Paolo ZANGRILLO la pubblica amministrazione;
      al sen. Roberto CALDEROLI gli affari regionali e le autonomie;
      al sen. Sebastiano MUSUMECI, detto Nello, le politiche del mare e il Sud;
      all’on. Raffaele FITTO gli affari europei, le politiche di coesione e il PNRR;
      al dott. Andrea ABODI lo sport e i giovani;
      all’on. Eugenia Maria ROCCELLA la famiglia, la natalità e le pari opportunità;
      alla dott.ssa Alessandra LOCATELLI le disabilità;
      alla sen. Maria Elisabetta ALBERTI CASELLATI le riforme istituzionali.
    note: >-
      The decree that gave each minister without portfolio a subject-matter delegation, and
      therefore the nine posts their titles. It is the "provvedimento da pubblicarsi nella
      Gazzetta Ufficiale" that article 9(1) of legge 400/1988 requires. Cited by all nine
      such entities as the origin of the post; three of the nine have since been re-conferred
      or retitled by later decrees, which are cited alongside on those entities. archive_url
      is the archived PDF of the whole issue (Serie generale n. 250 of 25 October 2022),
      where the quoted text appears verbatim on page 3.

