      es: >-
        El departamento cambió de ministro el 3 de abril de 2026, cuando juró un nuevo titular
        tras la renuncia del anterior. El departamento no se vio afectado y este proyecto
        registra departamentos y no titulares, por lo que la entidad no se desdobla.

