      The post itself is continuous — one of the nine created on 23 October 2022 — so it is
      recorded as one entity rather than closed and reopened; the change was to the
      officeholder and to the wording of a personal delegation, and this dataset records
      structure rather than officeholders. archive_url is the archived PDF of the whole issue
      (Serie generale n. 283 of 3 December 2024), where the quoted text appears verbatim on
      page 35.

  - id: gu-dpr-2022-10-23-vicepresidenti
    tier: 1
    type: official_gazette
    publisher: Gazzetta Ufficiale della Repubblica Italiana
    title: >-
      Decreto del Presidente della Repubblica 23 ottobre 2022, Attribuzione delle funzioni
      di Vicepresidente del Consiglio dei ministri al Ministro degli affari esteri e della
      cooperazione internazionale on. Antonio TAJANI e al Ministro delle infrastrutture e
      della mobilità sostenibili sen. Matteo SALVINI (22A06177)
    url: https://www.gazzettaufficiale.it/eli/id/2022/10/25/22A06177/sg
    archive_url: https://web.archive.org/web/20240424162113/https://www.gazzettaufficiale.it/eli/gu/2022/10/25/250/sg/pdf
    lang: it
    published: 2022-10-25
    accessed: 2026-07-27
    quote: >-
      Al Ministro degli affari esteri e della cooperazione internazionale on. Antonio TAJANI
      e al Ministro delle infrastrutture e della mobilità sostenibili sen. Matteo SALVINI
      sono attribuite le funzioni di Vicepresidente del Consiglio dei ministri.
    note: >-
      Cited by the two ministries whose heads also hold the vice-presidency. The decree
      "attribuisce le funzioni" to two serving ministers rather than creating an office, so
      the vice-presidency adds neither a department nor a cabinet seat and each minister is
      counted once through his ministry. archive_url is the archived PDF of the whole issue
      (Serie generale n. 250 of 25 October 2022), where the quoted text appears verbatim on
      page 3.

