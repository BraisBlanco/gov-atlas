    note:
      en: >-
        Not counted, and the post whose title moved most during the term: conferred on
        23 October 2022 as European affairs, cohesion policy and the NRRP; extended with "il
        Sud" on 10 November 2022; re-conferred on a different holder on 3 December 2024 without
        "il Sud" and in the present wording. All three stages are cited. This is why Italy shows
        no counted ministry for European affairs, regional development or the recovery funds:
        all three sit with a delegated minister at the Presidency of the Council. PNRR is the
        Piano nazionale di ripresa e resilienza, Italy's national recovery and resilience plan.
      es: >-
        No se cuenta, y es el puesto cuyo título más se movió en la legislatura: conferido el
        23 de octubre de 2022 como asuntos europeos, políticas de cohesión y PNRR; ampliado con
        «il Sud» el 10 de noviembre de 2022; vuelto a conferir a otro titular el 3 de diciembre
        de 2024 sin «il Sud» y con la redacción actual. Se citan las tres fases. Por eso Italia
        no presenta ministerio contado de asuntos europeos, desarrollo regional ni fondos de
        recuperación: los tres corresponden a un ministro delegado en la Presidencia del
        Consejo. PNRR es el Piano nazionale di ripresa e resilienza, el plan nacional italiano
        de recuperación y resiliencia.

