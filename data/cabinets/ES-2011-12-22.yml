    note:
      en: >-
        Absorbed the public administration department, which had existed on its own since
        1996. From this point the civil service is attached to finance for most of the series,
        and it moves between finance, territorial policy and digital transformation
        thereafter.
      es: >-
        Absorbió el departamento de Administraciones Públicas, que existía por separado desde
        1996. Desde aquí la función pública queda adscrita a Hacienda durante buena parte de
        la serie, y después se mueve entre Hacienda, Política Territorial y Transformación
        Digital.

