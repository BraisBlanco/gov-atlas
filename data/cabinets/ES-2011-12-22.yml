# Spain — government structure of the X legislature (2011-2016).
#
# Thirteen departments, the smallest cabinet in the Spanish series, and the longest-lived
# structure in it: the same thirteen stood for nearly five years, through the caretaker period
# that followed the inconclusive election of December 2015.

country: ES
cabinet_id: ES-2011-12-22

cabinet_name_original: Gobierno de España, X Legislatura
cabinet_name_en: Government of Spain, 10th legislature
cabinet_name_es: Gobierno de España, X Legislatura

head_of_government_title_original: Presidente del Gobierno
head_of_government_title_en: Prime Minister

took_office: 2011-12-22
left_office: 2016-11-03

methodology_notes:
  - en: >-
      Thirteen ministerial departments, down from fifteen. This is the fewest in the Spanish
      series and the result of merging rather than abolishing: finance took public
      administration, education took culture and sport, agriculture took the environment, and
      health took social services and equality.
    es: >-
      Trece departamentos ministeriales, frente a los quince anteriores. Es la cifra más baja
      de la serie española y resultado de fusionar, no de suprimir: Hacienda asumió las
      administraciones públicas, Educación la cultura y el deporte, Agricultura el medio
      ambiente, y Sanidad los servicios sociales y la igualdad.
  - en: >-
      Fourteen seats against thirteen departments: the Prime Minister holds a seat without
      heading a department. This government had a single vice-president, who also headed the
      Presidency department, and no minister was appointed without a portfolio.
    es: >-
      Catorce asientos frente a trece departamentos: el presidente del Gobierno ocupa un
      asiento sin encabezar departamento. Este Gobierno tuvo una sola vicepresidencia, que
      encabezaba además el departamento de la Presidencia, y ningún ministro fue nombrado sin
      cartera.
  - en: >-
      The structure was never amended. The decree that created it was replaced only in
      November 2016, so these thirteen departments cover the whole term including the eleven
      months this government spent in a caretaker capacity after the December 2015 election.
    es: >-
      La estructura no se modificó nunca. El decreto que la creó no fue sustituido hasta
      noviembre de 2016, de modo que estos trece departamentos abarcan toda la legislatura,
      incluidos los once meses que este Gobierno estuvo en funciones tras las elecciones de
      diciembre de 2015.

sources:
  - id: boe-rd-1823-2011
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 1823/2011, de 21 de diciembre, por el que se reestructuran los
      departamentos ministeriales
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2011-19939
    archive_url: https://web.archive.org/web/20251015061625/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2011-19939
    lang: es
    published: 2011-12-22
    accessed: 2026-07-29
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado se estructura en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores y de Cooperación.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Hacienda y Administraciones Públicas.
      Ministerio del Interior.
      Ministerio de Fomento.
      Ministerio de Educación, Cultura y Deporte.
      Ministerio de Empleo y Seguridad Social.
      Ministerio de Industria, Energía y Turismo.
      Ministerio de Agricultura, Alimentación y Medio Ambiente.
      Ministerio de la Presidencia.
      Ministerio de Economía y Competitividad.
      Ministerio de Sanidad, Servicios Sociales e Igualdad.
    note: >-
      The text as published, in force the same day. The gazette records no amendment to it: it
      was superseded outright by the restructuring of November 2016, which is why this
      enumeration describes the entire term.

  - id: boe-rd-1826-2011
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 1826/2011, de 21 de diciembre, por el que se nombran Ministros del Gobierno
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2011-19942
    archive_url: https://web.archive.org/web/20260226021006/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2011-19942
    lang: es
    published: 2011-12-22
    accessed: 2026-07-29
    quote: |-
      Ministro de Hacienda y Administraciones Públicas a don Cristóbal Montoro Romero.
      Ministra de la Presidencia a doña María Soraya Sáenz de Santamaría Antón.
      Ministro de Economía y Competitividad a don Luis de Guindos Jurado.
      Ministra de Sanidad, Servicios Sociales e Igualdad a doña Ana Mato Adrover.
    note: >-
      Thirteen ministers for thirteen departments, one each and none without a portfolio,
      which is what makes the seat count fourteen once the Prime Minister is added. The quote
      includes the appointment of the sole vice-president, named the same day, to the
      Presidency department.

  - id: boe-ley-50-1997
    tier: 1
    type: statute
    publisher: Boletín Oficial del Estado
    title: Ley 50/1997, de 27 de noviembre, del Gobierno (texto consolidado)
    url: https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    archive_url: https://web.archive.org/web/20260716135650/https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    lang: es
    published: 1997-11-28
    accessed: 2026-07-29
    quote: >-
      El Gobierno se compone del Presidente, del Vicepresidente o Vicepresidentes, en su
      caso, y de los Ministros.
    note: >-
      Cited for the composition of the Government, which is what makes the Prime Minister's
      seat a matter of statute rather than of interpretation.

