    url: https://www.zakon.hr/z/2653/zakon-o-ustrojstvu-i-djelokrugu-tijela-drzavne-uprave
    archive_url: https://web.archive.org/web/20260515231716/https://www.zakon.hr/z/2653/zakon-o-ustrojstvu-i-djelokrugu-tijela-drzavne-uprave
    lang: hr
    published: 2024-05-17
    accessed: 2026-07-28
    quote: |-
      Zakon o ustrojstvu i djelokrugu tijela državne uprave
      NN 85/20, 21/23, 57/24
      na snazi od 17.05.2024.
      Članak 1.
      Ovim Zakonom ustrojavaju se tijela državne uprave te se utvrđuje njihov djelokrug.
      Članak 2.
      Tijela državne uprave su ministarstva i državne upravne organizacije.
      Članak 3. (NN 85/20, 57/24)
      Ministarstva jesu:
      1. Ministarstvo vanjskih i europskih poslova
      2. Ministarstvo unutarnjih poslova
      3. Ministarstvo obrane
      4. Ministarstvo financija
      5. Ministarstvo gospodarstva
      6. Ministarstvo zaštite okoliša i zelene tranzicije
      7. Ministarstvo pravosuđa, uprave i digitalne transformacije
      8. Ministarstvo znanosti i obrazovanja i mladih
      9. Ministarstvo demografije i useljeništva
      10. Ministarstvo kulture i medija
      11. Ministarstvo turizma i sporta
      12. Ministarstvo regionalnoga razvoja i fondova Europske unije
      13. Ministarstvo rada, mirovinskoga sustava, obitelji i socijalne politike
      14. Ministarstvo poljoprivrede, šumarstva i ribarstva
      15. Ministarstvo mora, prometa i infrastrukture
      16. Ministarstvo prostornoga uređenja, graditeljstva i državne imovine
      17. Ministarstvo hrvatskih branitelja
      18. Ministarstvo zdravstva.
      Članak 4. (NN 85/20, 21/23, 57/24)
      Državne upravne organizacije jesu:
      1. Središnji državni ured za središnju javnu nabavu
      2. Središnji državni ured za Hrvate izvan Republike Hrvatske
      3. Hrvatska vatrogasna zajednica
      4. Državni inspektorat
      5. Državna geodetska uprava
      6. Državni hidrometeorološki zavod
      7. Državni zavod za intelektualno vlasništvo
      8. Državni zavod za mjeriteljstvo
      9. Državni zavod za statistiku
      Članak 10. (NN 85/20, 57/24)
      Ministarstvo vrši nadzor nad obavljanjem poslova uprave u tijelima sudbene vlasti, državnom odvjetništvu te u kaznenim tijelima.
      Ministarstvo upravlja procesom digitalizacije u svim tijelima državne i javne uprave; usuglašava politike i ciljeve procesa digitalizacije s nadležnim tijelima, obavlja nadzor provedbe strateški važnih ciljeva procesa digitalizacije.
      Ministarstvo definira smjernice i metodologiju za praćenje napretka i procjenu učinka politika za razvoj digitalnog društva, Strategiju digitalnog razvoja Republike Hrvatske; koordinira rad Nacionalnog vijeća za digitalnu transformaciju.
      Članak 11. (NN 85/20, 57/24)
      Ministarstvo znanosti, obrazovanja i mladih obavlja upravne i druge poslove koji se odnose na sustav predškolskog odgoja, osnovnoškolskog i srednjoškolskog odgoja i obrazovanja u zemlji i inozemstvu; nacionalni kurikulum; udžbenike, normative i standarde te druge uvjete za odgojno-obrazovni rad; razvitak školstva; učenički standard; inspekcijski nadzor; osnivanje i nadzor nad zakonitošću rada ustanova te osiguravanje financijskih i materijalnih uvjeta za rad u odgoju i obrazovanju; osposobljavanje djece, mladih i odraslih za stjecanje tehničkih znanja i vještina te djelatnost udruga u ovom području.
      Članak 11. a (NN 85/20, 57/24)
      Ministarstvo u suradnji s drugim nadležnim tijelima obavlja poslove koji se odnose na stvaranje uvjeta za povratak i useljavanje pripadnika hrvatskog iseljeništva (dijaspore) u Republiku Hrvatsku i njihovo uključivanje u gospodarski i društveni život u Republici Hrvatskoj; predlaže politiku poticanja i pomoći povratka i useljavanja pripadnika hrvatskog iseljeništva; provodi mjere i programe za integraciju povratnika i useljenika iz hrvatskog iseljeništva.
      Članak 16. (NN 85/20, 57/24)
      Ministarstvo poljoprivrede, šumarstva i ribarstva obavlja upravne i druge poslove u području poljoprivrede, ribarstva, šumarstva, ruralnog razvoja, gospodarenja i raspolaganja poljoprivrednim zemljištem u vlasništvu države, poljoprivredne politike, organizacije tržišta poljoprivrednih proizvoda, tržišnih i strukturnih potpora u poljoprivredi, prehrambene i duhanske industrije i veterinarstva.
      Članak 19.
      Ministarstvo obavlja stručne i druge poslove koji se odnose na traženje zatočenih i nestalih, organizaciju ekshumacija masovnih i pojedinačnih grobnica na teritoriju Republike Hrvatske, prikuplja i obrađuje podatke o ekshumiranim žrtvama u cilju identifikacije te organizira identifikaciju posmrtnih ostataka žrtava.
      Članak 21. (NN 85/20, 57/24)
      Brisan.
      Članak 22. (NN 85/20, 57/24)
      Brisan.
      Članak 26.
      Hrvatska vatrogasna zajednica obavlja upravne i stručne poslove koji se odnose na vatrogastvo; provodi osposobljavanje pripadnika vatrogasnih postrojbi; pruža tehničku pomoć u nezgodama i opasnim situacijama; obavlja inspekcijske poslove u području vatrogastva te obavlja i druge poslove u svezi s vatrogastvom.
      Članak 32.
      Državni zavod za statistiku obavlja stručne poslove koji se odnose na proizvodnju i diseminaciju službenih statističkih podataka i razvoj sustava službene statistike Republike Hrvatske, u skladu s temeljnim načelima službene statistike.
    note: >-
      The consolidated text of the enumerating Act, cited for the fields of activity that the
      policy-area tags below follow. Articles 5 to 20 give each of the eighteen ministries an
      article of its own and articles 23 to 32 do the same for the nine state administrative
      organisations; the quotation takes articles 1 to 4 complete and then the individual
      paragraphs that carry the tag decisions a reader is most likely to dispute, because
      quoting all twenty-eight substantive articles would run to tens of thousands of words.
      Each ministry's own note names the article it relies on. Three caveats on the address.
      First, this is an unofficial consolidation by a commercial legal portal, not a
      state-published consolidated text — Croatia does not publish one for this Act. Every one of
      its three constituent publications is a Narodne novine act, and the two things this dataset
      actually counts do not depend on the consolidation at all: the list of eighteen ministries
      and the list of nine state administrative organisations are quoted identically from the
      gazette in the two sources above, and the cabinet's size comes from the Sabor's own decision.
      What does rest on this consolidation alone is a subset of the fields of activity behind the
      policy-area tags — those of the interior, defence, finance, science, culture, regional
      development, agriculture, spatial planning and health ministries, and of the central state
      office for Croats abroad, whose articles are not quoted from a gazette anywhere in this file.
      Eighteen articles carry no amendment marker in this text — 5, 6, 7, 12, 13, 14, 15, 17, 19 and
      20 for ten of the ministries, and 23 and 26 to 32 for eight of the nine state administrative
      organisations — and for those the gazette text still in force is the original Act at Narodne
      novine 85/2020, which is cited above and from which articles 5, 13, 15, 17 and 19 are quoted
      directly. The eight ministries and one central state office whose articles were amended
      (articles 3, 4, 8, 9, 9.a, 10, 11, 11.a, 16, 18 and 25, plus the deleted 21, 22 and 24) take
      their current wording from Narodne novine 21/2023 or 57/2024; the 2024 rewrites quoted above
      come from the gazette, and only the 2023 rewrites of articles 8, 18 and 24 are taken from this
      consolidation without a gazette quotation anywhere in this file. A future curator wanting to
      remove the dependency entirely would quote the remaining articles from Narodne novine 85/2020
      and 21/2023 in the same way. Second, the consolidator's own database
      banner read "Baza je ažurirana 17.07.2026. zaključno sa NN 53/26" on the access date
      while this Act's header still read "NN 85/20, 21/23, 57/24 — na snazi od 17.05.2024.",
      which is the evidence that no fourth amendment existed as at 28 July 2026. Third, item 8
      of article 3 is reproduced here exactly as the consolidator prints it, "Ministarstvo
      znanosti i obrazovanja i mladih", which disagrees with the gazette and with article 11 of
      this same text; see the methodology note on that discrepancy. Whitespace inside the
      numbered lists has been normalised — the page renders each item on its own line — and
      nothing else is altered. The published date recorded here is the date the current
      consolidated version entered into force, not a date of publication by the consolidator.

