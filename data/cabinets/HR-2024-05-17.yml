      Na temelju članka 110. Ustava Republike Hrvatske i članka 119. Poslovnika Hrvatskoga sabora, Hrvatski sabor na sjednici 17. svibnja 2024. donio je
      ODLUKU
      O ISKAZIVANJU POVJERENJA VLADI REPUBLIKE HRVATSKE
      Hrvatski sabor iskazuje povjerenje Vladi Republike Hrvatske u sastavu:
      – mr. sc. Andrej Plenković, predsjednik Vlade Republike Hrvatske
      – Tomo Medved, potpredsjednik Vlade Republike Hrvatske i ministar hrvatskih branitelja
      – dr. sc. Davor Božinović, potpredsjednik Vlade Republike Hrvatske i ministar unutarnjih poslova
      – Oleg Butković, potpredsjednik Vlade Republike Hrvatske i ministar mora, prometa i infrastrukture
      – Ivan Anušić, potpredsjednik Vlade Republike Hrvatske i ministar obrane
      – Branko Bačić, potpredsjednik Vlade Republike Hrvatske i ministar prostornoga uređenja, graditeljstva i državne imovine
      – dr. sc. Marko Primorac, potpredsjednik Vlade Republike Hrvatske i ministar financija
      – Josip Dabro, potpredsjednik Vlade Republike Hrvatske i ministar poljoprivrede, šumarstva i ribarstva
      – dr. sc. Gordan Grlić Radman, ministar vanjskih i europskih poslova
      – Ante Šušnjar, ministar gospodarstva
      – mr. sc. Marija Vučković, ministrica zaštite okoliša i zelene tranzicije
      – Damir Habijan, ministar pravosuđa, uprave i digitalne transformacije
      – dr. sc. Radovan Fuchs, ministar znanosti, obrazovanja i mladih
      – Ivan Šipić, ministar demografije i useljeništva
      – dr. sc. Nina Obuljen Koržinek, ministrica kulture i medija
      – Tonči Glavina, ministar turizma i sporta
      – Šime Erlić, ministar regionalnoga razvoja i fondova Europske unije
      – Marin Piletić, ministar rada, mirovinskoga sustava, obitelji i socijalne politike
      – dr. sc. Vili Beroš, dr. med., ministar zdravstva.
      Klasa: 021-03/24-08/2
      Zagreb, 17. svibnja 2024.
      HRVATSKI SABOR
    note: >-
      The instrument that puts this cabinet in office and fixes its size. Nineteen people are
      named — the Prime Minister and eighteen ministers, one for each of the eighteen
      ministries in article 3 of the enumerating Act, in a different order from that article —
      and there is no twentieth member, no minister without portfolio and no deputy prime
      minister without a department. Read with article 4 of the Zakon o Vladi, which provides
      that the Government takes office when the Sabor votes it confidence, the decision's date
      of 17 May 2024 is this cabinet's took_office. The individual Rješenja appointing each
      minister follow in the same gazette issue as documents 1011 and 1028 to 1045. Five of the
      nineteen named here have since been replaced without any new cabinet being formed; see
      the methodology note on reshuffles. Published 20 May 2024, three days after the session
      it records. The gazette's HTML inserts soft hyphens at the print edition's line breaks
      ("digitalne trans­formacije"); they are stripped here and nothing else is altered. ELI
      identifier /eli/sluzbeni/2024/60/1006.

  - id: zakon-hr-zakon-o-vladi
    tier: 1
    type: statute
    publisher: >-
      Zakon.hr — pravni portal (neslužbeni pročišćeni tekst); izvorni tekstovi objavljeni u
      Narodnim novinama
    title: >-
      Zakon o Vladi Republike Hrvatske, pročišćeni tekst zakona (NN 150/11, 119/14, 93/16,
      116/18, 80/22, 78/24)
    url: https://www.zakon.hr/z/170/zakon-o-vladi-republike-hrvatske
    archive_url: https://web.archive.org/web/20260720124229/https://www.zakon.hr/z/170/zakon-o-vladi-republike-hrvatske
    lang: hr
    published: 2024-07-02
    accessed: 2026-07-28
    quote: |-
      Zakon o Vladi Republike Hrvatske
      pročišćeni tekst zakona
      NN 150/11, 119/14, 93/16, 116/18, 80/22, 78/24
      na snazi od 02.07.2024.
      Članak 2.
      Vladu čine predsjednik, jedan ili više potpredsjednika i ministri (u daljnjem tekstu: članovi Vlade).
      Ukoliko Vlada ima više potpredsjednika, predsjednik Vlade može odrediti prvog potpredsjednika.
      Članak 4.
      Predsjednik i članovi Vlade stupaju na dužnost kad im povjerenje iskaže većina svih zastupnika u Hrvatskom saboru.
      Na temelju odluke Hrvatskoga sabora o iskazivanju povjerenja Vladi, rješenje o imenovanju predsjednika Vlade donosi Predsjednik Republike Hrvatske uz supotpis predsjednika Hrvatskoga sabora, a rješenje o imenovanju članova Vlade donosi predsjednik Vlade uz supotpis predsjednika Hrvatskoga sabora.
      Članak 6.
      Predsjednik Vlade i članovi Vlade mogu podnijeti ostavku.
      Predsjednik Vlade podnosi ostavku Hrvatskom saboru.
      Kad predsjednik Vlade podnese ostavku, smatra se da su ostavku podnijeli svi članovi Vlade.
      Član Vlade podnosi ostavku predsjedniku Vlade.
      Članak 7.
      Ako Hrvatski sabor prihvati ostavku predsjednika Vlade, Vlada će obavljati tehničke poslove do imenovanja nove Vlade.
      Ako predsjednik Vlade prihvati ostavku pojedinog člana Vlade, rješenje o razrješenju toga člana Vlade donosi predsjednik Vlade i o tome izvješćuje Hrvatski sabor.
      Predsjednik Vlade će novog člana Vlade predstaviti na prvoj idućoj sjednici Hrvatskoga sabora i zatražiti glasovanje o povjerenju tom članu.
      Članak 10.
      Predsjednik Vlade predstavlja Vladu, saziva sjednice i predsjedava im, upravlja radom Vlade i potpisuje akte koje ona donosi.
      Ako predsjednik Vlade odredi prvog potpredsjednika Vlade, on zamjenjuje predsjednika Vlade u slučaju njegove spriječenosti ili odsutnosti. Zamjenjivanje predsjednika Vlade nije moguće u pitanjima i postupcima odlučivanja o povjerenju Vladi, imenovanju i razrješenju člana Vlade.
      Potpredsjednici Vlade usklađuju rad ministarstava i brinu o provedbi programa Vlade u područjima za koja su zaduženi.
      Članak 16.
      Uži kabinet Vlade čine predsjednik i potpredsjednici Vlade.
      Članak 18. (NN 93/16)
      U Vladi se ustrojava Ured predsjednika Vlade.
      Ured predsjednika Vlade obavlja stručne i administrativne poslove za potrebe predsjednika Vlade po njegovom nalogu.
      Radom Ureda predsjednika Vlade upravlja predstojnik Ureda, kojeg imenuje Vlada na prijedlog predsjednika Vlade, a koji za svoj rad odgovara predsjedniku Vlade.
      Predstojnik Ureda predsjednika Vlade ima položaj državnog tajnika i državni je dužnosnik.
      Ured predsjednika Vlade usklađuje rad ureda Vlade iz članka 27. ovog Zakona te savjeta predsjednika Vlade iz članka 23. ovoga Zakona.
      Članak 20. (NN 93/16, 80/22)
      U Vladi se ustrojava Glavno tajništvo.
      Glavno tajništvo obavlja stručne, analitičke, upravno-pravne, administrativne, opće, tehničke, pomoćne i informatičke poslove za potrebe Vlade, te potpredsjednika i članova Vlade. Za Ured predsjednika Vlade, Glavno tajništvo obavlja opće, tehničke, pomoćne i informatičke poslove.
      Glavnim tajništvom upravlja glavni tajnik, kojeg imenuje Vlada na prijedlog predsjednika Vlade, a koji za svoj rad odgovara predsjedniku Vlade i Vladi.
      Glavni tajnik Vlade ima položaj državnog tajnika i državni je dužnosnik.
      Članak 22. (NN 78/24)
      Za potpredsjednika Vlade koji nije čelnik ministarstva ustrojava se Ured potpredsjednika Vlade.
      Članak 27. (NN 116/18)
      Za obavljanje stručnih poslova, Vlada osniva:
      – Ured za zakonodavstvo,
      – Ured za ljudska prava i prava nacionalnih manjina,
      – Ured za ravnopravnost spolova,
      – Ured za udruge,
      – Ured za opće poslove Hrvatskoga sabora i Vlade Republike Hrvatske,
      – Ured za protokol.
      Vlada može za pojedine poslove osnovati i druge urede.
    note: >-
      The Act on the Government, cited for four separate claims. Article 2 is what makes the
      seat count a matter of statute rather than of our interpretation: the members of the
      Government are the Prime Minister, one or more deputy prime ministers and the ministers,
      which with eighteen ministers and no minister without portfolio gives nineteen seats
      against eighteen ministries. Article 4 fixes when a government takes office and is why
      took_office is 17 May 2024. Articles 6 and 7 are the reason a change of individual
      minister does not create a new cabinet while a resignation by the Prime Minister would.
      Article 10(3) shows that a deputy premiership is a coordinating function conferred on a
      serving minister — article 22 makes separate provision for a deputy prime minister who is
      not the head of a ministry, and this cabinet has none — so it adds neither a ministry nor
      a seat. Articles 18 and 20 constitute the Ured predsjednika Vlade and the Glavno
      tajništvo inside the Government and give each a head with the rank of state secretary,
      not of minister, which is the ground on which both are recorded here and excluded.
      Article 27 lists the six expert offices of the Government that this file's perimeter
      excludes, and is why equality is tagged on no Croatian ministry. Same caveat as for the
      other consolidated text: this is a commercial portal's unofficial consolidation of six
      Narodne novine acts, and the published date recorded here is the date the current version
      entered into force. Whitespace in the numbered list has been normalised.

  - id: zakon-hr-zsdu
    tier: 1
    type: statute
    publisher: >-
      Zakon.hr — pravni portal (neslužbeni pročišćeni tekst); izvorni tekstovi objavljeni u
      Narodnim novinama
    title: >-
      Zakon o sustavu državne uprave, pročišćeni tekst zakona (NN 66/19, 155/23)
    url: https://www.zakon.hr/z/221/zakon-o-sustavu-drzavne-uprave
    archive_url: https://web.archive.org/web/20260608214323/https://www.zakon.hr/z/221/zakon-o-sustavu-drzavne-uprave
    lang: hr
    published: 2019-07-18
    accessed: 2026-07-28
    quote: |-
      Zakon o sustavu državne uprave
      NN 66/19, 155/23
      Članak 55.
      (1) Ministarstva se ustrojavaju za obavljanje poslova državne uprave u pravilu u više upravnih područja.
      (2) U sastavu ministarstva ustrojavaju se najmanje dvije upravne organizacije.
      Članak 56.
      (1) Čelnik ministarstva je ministar.
      (2) Ministarstvo može imati jednog ili više državnih tajnika koji provode utvrđenu politiku Vlade u jednom ili više upravnih područja, sukladno ovlaštenju i nalozima ministra.
      (3) Ministar odlukom određuje državnog tajnika koji ga zamjenjuje u slučaju odsutnosti ili spriječenosti.
      (4) Državni tajnik za svoj rad odgovara ministru i Vladi.
      Članak 57.
      (1) Upravnom organizacijom u sastavu ministarstva rukovodi:
      – ravnatelj, za uprave, zavode, ravnateljstva i urede
      – glavni inspektor, za inspektorate.
      (2) Rukovodeći državni službenik iz stavka 1. ovoga članka za svoj rad odgovara nadležnom državnom tajniku, ministru i Vladi.
      III. DRŽAVNE UPRAVNE ORGANIZACIJE
      Članak 58.
      (1) Državne upravne organizacije ustrojavaju se za obavljanje poslova državne uprave i drugih poslova čije obavljanje zahtijeva osobitu samostalnost u radu ili primjenu posebnih uvjeta i načina rada ili je nužno za provedbu pravno obvezujućih akata Europske unije.
      (2) Državne upravne organizacije ustrojavaju se u pravilu kao:
      – središnji državni uredi, za jedno ili više upravnih područja u kojima se obavljaju poslovi državne uprave od posebnog značenja za učinkovitiji rad Vlade
      – državne uprave, za jedno ili više upravnih područja u kojima se pretežito obavljaju poslovi neposredne provedbe zakona
      – državni zavodi, za jedno ili više upravnih područja u kojima se pretežito obavljaju stručno-analitički poslovi koje je nužno obavljati u okviru državne uprave.
      (3) Posebnim zakonom mogu se ustrojiti državni inspektorati, za inspekcijski nadzor u više upravnih područja, te državna ravnateljstva, za jedno ili više upravnih područja u kojima se pretežito obavljaju poslovi zaštite pravnog poretka, života i opće sigurnosti i drugi poslovi od osobitog interesa za Republiku Hrvatsku, kao i druge državne upravne organizacije s posebnim nazivima, ustrojstvom i načinom rada.
      Članak 59.
      (1) Čelnik državne upravne organizacije je:
      – državni tajnik središnjeg državnog ureda, za središnje državne urede
      – glavni ravnatelj, za državne uprave, državne zavode i državna ravnateljstva
      – glavni državni inspektor, za državne inspektorate.
      (2) Čelnik državne upravne organizacije za svoj rad odgovara Vladi.
    note: >-
      The Act on the state administration system, and the statutory basis for the perimeter
      decision in this file. Article 56(1) — "Čelnik ministarstva je ministar." — is the whole
      of the reason the eighteen bodies in article 3 of the enumerating Act satisfy this
      project's requirement that a counted department be headed by a minister. Article 59 is the
      reason the nine bodies in article 4 do not: their heads are a state secretary of a central
      state office, a director-general or a chief state inspector, and article 59(2) makes each
      answerable to the Government rather than a member of it. Article 57 is quoted to show the
      contrast with the administrative organisations inside a ministry, whose heads are career
      civil servants; those are not recorded as entities at all. Article 55 gives the shape of a
      ministry. Croatian državni tajnici — state secretaries inside a counted ministry under
      article 56(2) — are junior appointees, hold no cabinet seat and are not recorded
      individually. Same consolidation caveat as the other zakon.hr sources; the header shows
      amendments NN 66/19 and 155/23 and none of the quoted articles carries an amendment
      marker, so all of them stand as originally enacted in NN 66/2019.

