  - id: HR-2024-vanjski-i-europski-poslovi
    order: 1
    name_original: Ministarstvo vanjskih i europskih poslova
    abbreviation_original: null
    name_en: Ministry of Foreign and European Affairs
    name_es: Ministerio de Asuntos Exteriores y Europeos
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar vanjskih i europskih poslova
    head_title_en: Minister of Foreign and European Affairs
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [foreign_affairs, european_affairs, development_cooperation, trade]
    counts_as_ministry: true
    url: https://mvep.gov.hr
    sources: [nn-57-2024-982, nn-85-2020-1593, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Article 5 of the enumerating Act gives this ministry Croatia's representation abroad,
        relations with states and international organisations, the coordination of Croatian
        positions in the institutions of the European Union and the alignment of Croatian law
        with EU law, the representation of Croatia before the Court of Justice, NATO
        coordination, international humanitarian aid, and international development aid and
        cooperation. Trade is tagged because the same article gives it trade policy — the
        representation of Croatian interests in the adoption of the common commercial policy,
        the World Trade Organization, and the negotiation of investment-protection and economic
        cooperation agreements — which most countries in this dataset keep in an economy
        ministry; Croatia's Ministry of Economic Affairs holds the domestic and internal-market
        side, and both are tagged trade. European affairs is here and not in a ministry of its
        own: Croatia has no separate European affairs portfolio.
      es: >-
        El artículo 5 de la ley enumeradora atribuye a este ministerio la representación de
        Croacia en el exterior, las relaciones con Estados y organizaciones internacionales, la
        coordinación de las posiciones croatas en las instituciones de la Unión Europea y la
        adaptación del derecho croata al de la Unión, la representación de Croacia ante el
        Tribunal de Justicia, la coordinación con la OTAN, la ayuda humanitaria internacional y
        la ayuda y cooperación internacional al desarrollo. Se etiqueta el comercio porque el
        mismo artículo le atribuye la política comercial —la representación de los intereses
        croatas en la adopción de la política comercial común, la Organización Mundial del
        Comercio y la negociación de acuerdos de protección de inversiones y de cooperación
        económica—, que la mayoría de los países de este conjunto de datos sitúa en un
        ministerio de economía; el Ministerio de Economía croata tiene la vertiente interna y de
        mercado interior, y ambos llevan la etiqueta trade. Los asuntos europeos están aquí y no
        en un ministerio propio: Croacia no tiene una cartera separada de asuntos europeos.

  - id: HR-2024-unutarnji-poslovi
    order: 2
    name_original: Ministarstvo unutarnjih poslova
    abbreviation_original: null
    name_en: Ministry of the Interior
    name_es: Ministerio del Interior
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar unutarnjih poslova
    head_title_en: Minister of the Interior
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [interior, civil_protection, migration]
    counts_as_ministry: true
    url: https://mup.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Article 6 gives this ministry the police and criminal police, public order, border
        control, the movement and residence of foreigners and their reception, travel documents,
        citizenship, identity cards and residence registration, driving licences and vehicle
        registration, weapons, private security, and fire protection. Civil protection is tagged
        because the same article gives it the civil protection system, rescue in major accidents
        and disasters, the warning and alerting system, and inspection in civil protection, fire
        protection, explosives, radiological and nuclear safety and demining — an unusually wide
        emergency remit that also covers nuclear licensing and radiation protection, which in
        most countries in this dataset sit with an energy or health ministry. Migration is tagged
        for the administrative side — residence, asylum procedure and the reception of
        foreigners; the return and settlement of Croatian emigrants is the Ministry of Demography
        and Migration's, and the two are deliberately kept apart.
      es: >-
        El artículo 6 atribuye a este ministerio la policía y la policía criminal, el orden
        público, el control de fronteras, la circulación y residencia de extranjeros y su
        acogida, los documentos de viaje, la nacionalidad, los documentos de identidad y el
        registro de residencia, los permisos de conducir y la matriculación de vehículos, las
        armas, la seguridad privada y la protección contra incendios. Se etiqueta la protección
        civil porque el mismo artículo le atribuye el sistema de protección civil, el rescate en
        grandes accidentes y catástrofes, el sistema de alerta y aviso, y la inspección en
        protección civil, protección contra incendios, explosivos, seguridad radiológica y
        nuclear y desminado —un ámbito de emergencias inusualmente amplio que incluye además la
        autorización nuclear y la protección radiológica, que en la mayoría de los países de este
        conjunto de datos corresponden a un ministerio de energía o de sanidad—. La migración se
        etiqueta por su vertiente administrativa —residencia, procedimiento de asilo y acogida de
        extranjeros—; el retorno y el asentamiento de los emigrantes croatas corresponden al
        Ministerio de Demografía e Inmigración, y ambas cosas se mantienen deliberadamente
        separadas.

