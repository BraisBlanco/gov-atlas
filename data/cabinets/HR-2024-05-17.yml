      The Prime Minister's Office — Government of the Republic of Croatia (English edition)
    url: https://vlada.gov.hr/the-prime-minister-s-office/15019
    archive_url: https://web.archive.org/web/20260728115507/https://vlada.gov.hr/the-prime-minister-s-office/15019
    lang: en
    published: 2014-01-28
    accessed: 2026-07-28
    quote: |-
      The Prime Minister's Office
      Prime Minister's Office performs advisory, analytical, expert and administrative tasks for the needs of the Prime Minister, and especially:
      systematic monitoring and analysis of individual public policies, in order to draw up expert opinions and studies;
      preparation of strategic development plans and analyses;
      preparation of proposals for individual projects from the Government's programme and alignment of their implementation;
      expert processing and preparation of materials needed by the Prime Minister for participation in the work of the Inner Cabinet of the Government, the Government and the Croatian Parliament;
      drawing up the appropriate preparations and proposals of positions of the Republic of Croatia for the Prime Minister to participate in meetings of the European Council;
      coordination between the Government and the Croatian Parliament for the needs of the Prime Minister;
      implementation of the Act on the Right of Access to Information in the Government, and coordination of the work related to the implementation of that Act in Government offices and services;
      informing the public about the policies and activities of the Government;
      coordinating communication activities of the ministries and state offices;
      other work upon the orders of the Prime Minister.
      Categories
      The Head of the Prime Minister's Office
    note: >-
      Cited for the government's own English name of the Ured predsjednika Vlade — "The Prime
      Minister's Office" — and for what the office does, which is advisory and administrative
      support to the Prime Minister and no portfolio of its own. Read with article 18 of the
      Zakon o Vladi, which gives its head the rank of state secretary, it is the basis for
      recording the office and not counting it. The date stamp is the portal node's creation
      date. Two items in the government's list of tasks are omitted from the quotation for
      length; nothing in the omitted text bears on the classification.

