  - id: nn-57-2024-982
    tier: 1
    type: official_gazette
    publisher: Narodne novine — službeni list Republike Hrvatske
    title: >-
      Zakon o izmjenama i dopunama Zakona o ustrojstvu i djelokrugu tijela državne uprave,
      Narodne novine br. 57/2024 od 16. svibnja 2024., dokument 982
    url: https://narodne-novine.nn.hr/clanci/sluzbeni/2024_05_57_982.html
    archive_url: https://web.archive.org/web/20260209184834/https://narodne-novine.nn.hr/clanci/sluzbeni/2024_05_57_982.html
    lang: hr
    published: 2024-05-16
    accessed: 2026-07-28
    quote: |-
      ZAKON
      O IZMJENAMA I DOPUNAMA ZAKONA O USTROJSTVU I DJELOKRUGU TIJELA DRŽAVNE UPRAVE
      Članak 1.
      U Zakonu o ustrojstvu i djelokrugu tijela državne uprave (»Narodne novine«, br. 85/20. i 21/23.) članak 3. mijenja se i glasi:
      »Ministarstva jesu:
      1. Ministarstvo vanjskih i europskih poslova
      2. Ministarstvo unutarnjih poslova
      3. Ministarstvo obrane
      4. Ministarstvo financija
      5. Ministarstvo gospodarstva
      6. Ministarstvo zaštite okoliša i zelene tranzicije
      7. Ministarstvo pravosuđa, uprave i digitalne transformacije
      8. Ministarstvo znanosti, obrazovanja i mladih
      9. Ministarstvo demografije i useljeništva
      10. Ministarstvo kulture i medija
      11. Ministarstvo turizma i sporta
      12. Ministarstvo regionalnoga razvoja i fondova Europske unije
      13. Ministarstvo rada, mirovinskoga sustava, obitelji i socijalne politike
      14. Ministarstvo poljoprivrede, šumarstva i ribarstva
      15. Ministarstvo mora, prometa i infrastrukture
      16. Ministarstvo prostornoga uređenja, graditeljstva i državne imovine
      17. Ministarstvo hrvatskih branitelja
      18. Ministarstvo zdravstva.«.
      Članak 2.
      Članak 4. mijenja se i glasi:
      »Državne upravne organizacije jesu:
      1. Središnji državni ured za središnju javnu nabavu
      2. Središnji državni ured za Hrvate izvan Republike Hrvatske
      3. Hrvatska vatrogasna zajednica
      4. Državni inspektorat
      5. Državna geodetska uprava
      6. Državni hidrometeorološki zavod
      7. Državni zavod za intelektualno vlasništvo
      8. Državni zavod za mjeriteljstvo
      9. Državni zavod za statistiku.«.
      Članak 3.
      Članak 9. mijenja se i glasi:
      »Ministarstvo gospodarstva obavlja upravne i druge poslove koji se odnose na: razvoj i unapređenje konkurentnosti hrvatskoga gospodarstva s posebnim naglaskom na poticanje investicija, instrumente i mjere gospodarske politike, industrijsku politiku, politiku primjene inovacija i novih tehnologija, obavlja poslove koji se odnose na rudarstvo, sudjeluje u politikama razvoja iz područja prerađivačke, drvoprerađivačke i prehrambene industrije, upravlja jamstvenim fondom za unapređenje industrije, obavlja poslove vezane uz poticanje stvaralaštva u industriji i trgovini u svrhu razvoja konkurentnosti hrvatskoga gospodarstva, strategiju olakšavanja i poticanja ulaganja i izvoza, utvrđivanje i razradu metodologije za mjerenje i ciljano smanjenje administrativnog opterećenja gospodarstva (Standard Cost Model) te je središnje koordinacijsko tijelo za primjenu pravila postupanja i kontrolu kvalitete primjene ove metodologije, promiče gospodarski rast i konkurentnost kroz bilateralnu gospodarsku suradnju, u tijelima Europske unije i na drugim međunarodnim forumima na temelju međunarodnih obveza Republike Hrvatske, programa i strategija Vlade te prioriteta Ministarstva.
      Ministarstvo obavlja upravne, stručne i druge poslove koji se odnose na djelatnost trgovine na unutarnjem tržištu Europske unije, opskrbu i cijene, nacionalnu koordinaciju aktivnosti djelovanja na unutarnjem tržištu Europske unije, uključujući tehničko zakonodavstvo i infrastrukturu kvalitete, koordinaciju i razvoj nacionalne politike u području normizacije, akreditacije, ocjene sukladnosti, mjeriteljstva i tržišnog natjecanja, stanje i pojave na tržištu, zaštitu potrošača, strateške robne zalihe.
      […]
      Ministarstvo obavlja upravne i druge poslove iz područja energetike i istraživanja i eksploatacije ugljikovodika i geotermalnih voda za energetske svrhe, izrađuje prijedloge zakona i propisa iz područja energetike (električne energije, toplinske energije, nafte, naftnih derivata, prirodnog plina, nuklearne energetike, obnovljivih izvora energije, istraživanja i eksploatacije ugljikovodika, energetske učinkovitosti), planira i predlaže strategiju energetskog razvitka te programe i mjere za njezinu provedbu, radi na stvaranju uvjeta za provedbu energetske politike Republike Hrvatske odnosno strategije energetskog razvoja Republike Hrvatske, prati i analizira ostvarivanje ciljeva energetske politike i strategije, predlaže mjere za usklađivanje razvoja energetskog sektora s razvojnim planovima Republike Hrvatske, koordinira poslove u vezi s gospodarenjem energijom, analizira i ocjenjuje planove razvoja elektroenergetskog, plinskog i naftnog sektora te sektora toplinarstva, prati tržište i potiče razvoj tržišta energije u Republici Hrvatskoj, potiče konkurentnost energetskog sektora, promovira ulaganja u energetski sektor, sudjeluje u izradi energetskih bilanci, prati i analizira potrošnju primarnih energenata u Republici Hrvatskoj i svijetu radi predviđanja potrošnje primarnih energenata, izrađuje energetsko-gospodarske analize i s tim u vezi dugoročne i godišnje energetske bilance, prati proizvodnju, potrošnju, promet, uvoz i izvoz energenata, prati planiranje i izgradnju energetskih objekata te njihov utjecaj na okoliš, prati obavljanje tehničko-sigurnosnih analiza i prosudbi, predlaže pokretanje nacionalnih energetskih programa za osiguravanje dugoročnih razvojnih ciljeva, izrađuje programe za učinkovitije korištenje energije i njihovu provedbu, odobrava planove razvoja plinskog i elektroenergetskog sustava, sudjeluje u izradi tarifnog pravilnika te vodi i sudjeluje u programima i projektima međunarodne suradnje, provodi upravni nadzor u područjima elektroenergetskog, plinskog, naftnog i sektora toplinarstva te istraživanja i eksploatacije ugljikovodika i geotermalnih voda za energetske svrhe, koordinira, prati, usklađuje i surađuje u provedbi mjera energetske politike u okviru sektorskih politika (zaštita okoliša i prirode, industrija, promet, šumarstvo, vodno gospodarstvo, graditeljstvo i dr.), izdaje energetska odobrenja za izgradnju postrojenja za proizvodnju energije, surađuje s drugim tijelima o pitanju zaštite potrošača i zaštite socijalno ugroženih skupina u energetskom sektoru.
      […]
      Članak 4.
      Iza članka 9. dodaje se članak 9.a koji glasi:
      »Članak 9.a
      Ministarstvo zaštite okoliša i zelene tranzicije obavlja upravne i stručne poslove koji se odnose na: opću i sektorsku politiku zaštite okoliša u ostvarivanju uvjeta za održivi razvitak, gospodarenje otpadom, zaštitu zraka, tla, voda, mora, biljnog i životinjskog svijeta u ukupnosti uzajamnog djelovanja, osiguravanje praćenja stanja onečišćenja zraka, tla, voda i morskog okoliša te osiguravanje provedbe mjera radi sprečavanja onečišćavanja zraka, tla, voda i morskog okoliša, osiguravanje praćenja stanja te osiguravanje provedbe mjera radi sprečavanja svjetlosnog onečišćenja okoliša; prati stanje u vezi s uzrocima promjene klime i oštećenja ozonskog sloja, skrbi o provedbi mjera ublažavanja i prilagodbe klimatskim promjenama te provodi mjere za smanjivanje tvari koje oštećuju ozonski sloj i fluoriranih stakleničkih plinova, promiče zelenu javnu nabavu, izrađuje prijedloge zakona i propisa iz područja zaštite okoliša (zaštite zraka, tla, mora, zaštite klime i ozonskog sloja i zaštite od svjetlosnog onečišćenja okoliša); planira i predlaže strategiju niskougljičnog razvoja, strategiju prilagodbe klimatskim promjenama, strategiju održivog razvoja, strategiju upravljanja morskim okolišem i obalnim područjem te planove, programe i mjere za njihovu provedbu te provedbu mjera zaštite; obavlja poslove koji se odnose na izradu prijedloga mjera za unapređenje stanja u području zaštite okoliša, provedbu ciljeva zaštite okoliša utvrđenih planskim i strateškim dokumentima zaštite okoliša, predlaganje, promicanje i praćenje mjera za unapređivanje zaštite okoliša, provedbu procjene utjecaja na okoliš, osiguravanje provedbe Registra onečišćavanja okoliša, sustavno praćenje stanja okoliša (monitoring), nadzor i usmjeravanje razvoja informacijskog sustava zaštite okoliša, utvrđivanje mjera, uvjeta i suglasnosti zaštite okoliša, skrb, usklađivanje i vođenje nadzora nad financiranjem programa zaštite okoliša, gospodarenje otpadom, izradu i provedbu planskih dokumenata u gospodarenju otpadom, pripremu prijedloga standarda zaštite okoliša, ocjenjivanje uvjeta za rad pravnih i fizičkih osoba iz područja zaštite okoliša, ostvarivanje međunarodne suradnje u zaštiti okoliša, određivanje strateških odrednica održivog razvitka po konceptu zelenog gospodarstva radi poticanja stvaranja dodane vrijednosti u sektoru energetike, transporta i turizma, utvrđivanje politike djelovanja i obavljanje upravnoga nadzora i nadzora nad stručnim radom Fonda za zaštitu okoliša i energetsku učinkovitost te obavlja druge upravne poslove iz područja zaštite okoliša.
      […]
      Ministarstvo obavlja upravne i druge poslove koji se odnose na: upravljanje vodama, praćenje i prilagođavanje vodnogospodarskog razvitka s potrebama ukupnog gospodarskog razvitka Republike Hrvatske, zaštitu od štetnog djelovanja voda i leda, zaštitu od erozije i bujica, upravljanje vodnim dobrom i njegovo korištenje, navodnjavanje i melioracijsku odvodnju, provedbu zaštite voda i vodnog okoliša od onečišćenja, provedbu zaštite mora od onečišćenja s kopna, korištenje voda za različite namjene, djelatnosti javne vodoopskrbe i javne odvodnje i pročišćavanje otpadnih voda, planiranje i usklađivanje razvoja vodnih građevina, provođenje upravnog nadzora iz područja upravljanja vodama, međunarodnu suradnju.
      […]
      Članak 5.
      Članak 10. mijenja se i glasi:
      […]
      Ministarstvo upravlja procesom digitalizacije u svim tijelima državne i javne uprave; usuglašava politike i ciljeve procesa digitalizacije s nadležnim tijelima, obavlja nadzor provedbe strateški važnih ciljeva procesa digitalizacije.
      […]
      Članak 7.
      Iza članka 11. dodaje se članak 11. a koji glasi:
      »Članak 11. a
      Ministarstvo demografije i useljeništva obavlja stručne i druge poslove koji se odnose na praćenje i analizu demografskih trendova i kretanja u Republici Hrvatskoj, posebice promjene u broju stanovnika, prirodnom kretanju stanovništva migracijama i strukturi stanovništva; predlaže mjere usmjerene na porast nataliteta, uravnoteženje dobne strukture, održanje prostorne ravnoteže stanovništva; predlaže mjere za poticanje ostanka u Hrvatskoj, mjere podrške roditeljstvu te mjere usmjerene na usklađivanje obiteljskog i profesionalnog života; nadzor i praćenje primjene propisa o doplatku za djecu, rodiljnim i roditeljskim dopustima i naknadama, pomoći za opremu novorođenog djeteta; usklađuje rad državnih i ostalih tijela pri ostvarivanju aktivnosti demografskog razvitka i populacijske politike; predlaže Vladi Republike Hrvatske promjene zakona i drugih propisa iz područja demografske politike; obavlja poslove usmjerene na podizanje svijesti i edukaciju građana o važnosti demografskih pitanja i revitalizacije stanovništva; pruža potporu lokalnoj i regionalnoj (područnoj) samoupravi te organizacijama civilnoga društva u razradbi vlastitih programa usmjerenih na demografski razvitak.
      Ministarstvo u suradnji s drugim nadležnim tijelima obavlja poslove koji se odnose na stvaranje uvjeta za povratak i useljavanje pripadnika hrvatskog iseljeništva (dijaspore) u Republiku Hrvatsku i njihovo uključivanje u gospodarski i društveni život u Republici Hrvatskoj; predlaže politiku poticanja i pomoći povratka i useljavanja pripadnika hrvatskog iseljeništva; provodi mjere i programe za integraciju povratnika i useljenika iz hrvatskog iseljeništva.
      […]
      Članak 8.
      U članku 16. stavku 1. iza riječi: »Ministarstvo poljoprivrede«, stavlja se zarez i dodaju riječi: »šumarstva i ribarstva«.
      Članak 9.
      Članak 21. briše se.
      Članak 10.
      Članak 22. briše se.
      Članak 14.
      Danom stupanja na snagu ovoga Zakona prestaju s radom Središnji državni ured za razvoj digitalnog društva i Središnji državni ured za demografiju i mlade.
      Članak 17.
      Vlada Republike Hrvatske će u roku od 30 dana od dana stupanja na snagu ovoga Zakona uredbama urediti unutarnje ustrojstvo Ministarstva gospodarstva, Ministarstva pravosuđa, uprave i digitalne transformacije, Ministarstva znanosti, obrazovanja i mladih, Ministarstva poljoprivrede, šumarstva i ribarstva, Ministarstva zaštite okoliša i zelene tranzicije, Ministarstva demografije i useljeništva i Središnjeg državnog ureda za Hrvate izvan Republike Hrvatske.
      Članak 20.
      Ovaj Zakon stupa na snagu prvoga dana od dana objave u »Narodnim novinama«.
    note: >-
      The enumerating instrument, and the reason Croatia's ministry count is a legal fact.
      Article 1 replaces the whole of article 3 of the Zakon o ustrojstvu i djelokrugu tijela
      državne uprave, which is where Croatia lists its ministries, and the eighteen numbered
      items in that article are the eighteen ministries counted in this file; article 2 does
      the same for article 4 and the nine državne upravne organizacije recorded here and not
      counted. The Act was passed by the Hrvatski sabor on 16 May 2024, promulgated by
      President Zoran Milanović the same day, published in Narodne novine 57/2024 dated 16 May
      2024 and, under its article 20, entered into force on the first day after publication —
      17 May 2024, the very day the Sabor voted confidence in this Government, which is what
      makes the eighteen-ministry structure the one the incoming ministers were confirmed into.
      Beyond those two lists the quotation reproduces the passages that carry the contested
      policy-area tags, each under the amending Act's own article number so that a reader can see
      which provision of the old Act it rewrites: article 3 replaces article 9 and is the
      authority for tagging energy and mining on the Ministry of Economic Affairs; article 4
      inserts article 9.a and is the authority for environment, climate and water on the Ministry
      of Environment and Green Transition; article 5 replaces article 10 and is the authority for
      digital on the justice ministry; article 7 inserts article 11.a and is the authority for
      family and diaspora on the new Ministry of Demography and Migration. Article 8 is the
      one-line rename of the agriculture ministry, articles 9 and 10 delete articles 21 and 22,
      and article 14 abolishes the two central state offices whose work was absorbed. Article 17
      names the six bodies whose internal organisation had to be re-decreed and is the shortest
      evidence of what actually changed. Omissions inside a quoted article are marked […] and no
      sentence is cut short; paragraphs on public procurement, nature protection, EU-fund
      programmes, staff and budget transfers and the rewritten article 25 are left out for length.
      Where an omission falls at the end of a quoted article the closing guillemet of the amended
      text falls inside it, which is why articles 3, 4, 5 and 7 end on […] rather than on «.«. The
      gazette's HTML
      inserts soft hyphens at the print edition's line breaks ("digitalne trans­formacije");
      they are stripped here and nothing else is altered. ELI identifier
      /eli/sluzbeni/2024/57/982.

  - id: nn-85-2020-1593
    tier: 1
    type: official_gazette
    publisher: Narodne novine — službeni list Republike Hrvatske
    title: >-
      Zakon o ustrojstvu i djelokrugu tijela državne uprave, Narodne novine br. 85/2020 od
      22. srpnja 2020., dokument 1593
    url: https://narodne-novine.nn.hr/clanci/sluzbeni/2020_07_85_1593.html
    archive_url: https://web.archive.org/web/20251117185722/https://narodne-novine.nn.hr/clanci/sluzbeni/2020_07_85_1593.html
    lang: hr
    published: 2020-07-22
    accessed: 2026-07-28
    quote: |-
      ZAKON
      O USTROJSTVU I DJELOKRUGU TIJELA DRŽAVNE UPRAVE
      Članak 1.
      Ovim Zakonom ustrojavaju se tijela državne uprave te se utvrđuje njihov djelokrug.
      Članak 2.
      Tijela državne uprave su ministarstva i državne upravne organizacije.
      Članak 5.
      […]
      Ministarstvo obavlja upravne i stručne poslove koji se odnose na trgovinsku politiku, posebice na sudjelovanje i zastupanje hrvatskih interesa u tijelima Europske unije u procesu usvajanja zajedničke trgovinske politike i trgovinskih mjera u području trgovine robom i uslugama; usklađivanje aktivnosti u vezi s članstvom Republike Hrvatske u Svjetskoj trgovinskoj organizaciji i sudjelovanje u multilateralnim trgovinskim pregovorima u okviru ove organizacije; provođenje mjera trgovinske politike; vođenje pregovora o ugovorima o poticanju i zaštiti ulaganja i bilateralnih sporazuma o gospodarskoj suradnji.
      […]
      Članak 13.
      […]
      Ministarstvo obavlja upravne i stručne poslove koji se odnose na razvoj sporta, bavljenje sportom i tjelesnom kulturom, unapređenje rekreativnog, zdravstvenog, školskog, sveučilišnog, amaterskog, profesionalnog, natjecateljskog i promotivnog značaja sporta i sportaša, predlaganje i provođenje propisa o organizaciji i djelovanju sporta, sportskih klubova, udruga i saveza, financiranje sportskih programa i programa razvoja sporta, stručne poslove u pitanjima unapređenja sportskih djelatnosti, kategorizaciji sportova i sportaša, predlaganje i provođenje propisa o zdravstvenim, obrazovnim, radnim, mirovinskim i drugim oblicima potpore i priznanja vrhunskim sportašima, predlaganje nacionalnog programa razvoja sporta i ukupan upravni i inspekcijski nadzor sportskih djelatnosti; sudjeluje u pripremi programa i projekata te provedbi projekata iz programa Europske unije i ostalih oblika međunarodne pomoći.
      […]
      Članak 15.
      Ministarstvo rada, mirovinskoga sustava, obitelji i socijalne politike obavlja upravne i druge poslove koji se odnose na: politiku zapošljavanja, uređivanje radnih odnosa; tržište rada i aktivnu politiku zapošljavanja; programe radnih prekvalifikacija i povećanja zapošljivosti; sustav i politiku mirovinskoga osiguranja, evidenciju nezaposlenosti i pomoć pri zapošljavanju; socijalno partnerstvo i odnose sa sindikatima i udrugama poslodavaca u području radnopravnih odnosa, tržišta rada i zapošljavanja; radnopravni status hrvatskih državljana zaposlenih u inozemstvu i poslove vezane uz njihov povratak i zapošljavanje u zemlji; radnopravni status stranih državljana zaposlenih u Republici Hrvatskoj; unapređenje sustava zaštite na radu; međunarodnu suradnju na području rada i zapošljavanja.
      […]
      Ministarstvo obavlja upravne i stručne poslove koji se odnose na: brak i bračne odnose te posebnu zaštitu obitelji u kojima su narušeni međusobni odnosi; zaštitu od nasilja u obitelji; međusobne odnose roditelja i djece; zaštitu djece čiji roditelji žive odvojeno, zaštitu djece bez odgovarajuće roditeljske skrbi, poticanje odgovornog roditeljstva, uzdržavanja i skrbi o članovima obitelji; poticanje razvoja programa rada u zajednici, razvoja i afirmacije volonterstva i rada udruga građana koje su potpora roditeljima, obitelji, djeci, djeci s teškoćama u razvoju i starijim osobama te svim socijalno osjetljivim skupinama stanovništva; poticanje i osnivanje savjetovališta za djecu, roditelje, djecu s teškoćama u razvoju, starije osobe i žrtve obiteljskog nasilja te obavljanje stručnog i inspekcijskog nadzora nad njihovim radom; proučavanje i istraživanje suvremenih problema obitelji, djece, djece s teškoćama u razvoju i starijih osoba te pružanje preventivno-terapijske pomoći.
      […]
      Članak 17.
      Ministarstvo mora, prometa i infrastrukture obavlja upravne i druge poslove koji se odnose na: unutarnji i međunarodni pomorski, nautički, cestovni, željeznički, kombinirani i zračni promet; žičare te promet na unutarnjim vodama s infrastrukturom tih vidova prometa; planiranje, izradu i provedbu strateških dokumenata i projekata prometne infrastrukture, predlaže strategiju razvoja svih vidova prometa; zaštitu mora od onečišćenja s brodova; morske luke, pomorsko dobro i utvrđivanje granica pomorskog dobra, pomorsko osiguranje i pomorske agencije; luke na unutarnjim plovnim putovima; kopnene robno-transportne centre; zračne luke; prijevozna sredstva, osim onih poslova koji ulaze u djelokrug rada drugih ministarstava i pravnih osoba s javnim ovlastima, elektroničke komunikacije (telekomunikacije i radijske komunikacije) i poštanske usluge; inspekcijske poslove: sigurnosti plovidbe na moru, unutarnjeg i međunarodnog cestovnog prometa i cesta, osim poslova iz djelokruga Ministarstva unutarnjih poslova, sigurnosti željezničkog prometa, sigurnosti žičara, sigurnosti plovidbe na unutarnjim vodama.
      […]
      Ministarstvo obavlja upravne, stručne i druge poslove koji se odnose na: elektroničke komunikacije, informacijsko društvo, osim poslova iz tih područja koji su u nadležnosti drugih tijela državne uprave i poštanske usluge, pripremanje nacrta prijedloga zakona i drugih propisa iz područja elektroničkih komunikacija i poštanskih usluga, radijske opreme i elektromagnetske kompatibilnosti, predlaganje strategija, strateških planova, studija, smjernica i programa razvoja elektroničkih komunikacija i poštanskih usluga u Republici Hrvatskoj te planova za njihovu provedbu, izradu analiza i izvješća te prijedloga mjera i planova za razvoj i poboljšanje stanja u području elektroničkih komunikacija i poštanskih usluga, predstavljanje Republike Hrvatske u europskim i međunarodnim organizacijama i institucijama u području elektroničkih komunikacija, informacijskog društva i poštanskih usluga te sudjelovanje u radu njihovih upravnih i radnih tijela i stručnih skupina, sudjelovanje na međudržavnim sastancima i pregovorima iz područja elektroničkih komunikacija, informacijskog društva i poštanskih usluga te provedbu međunarodnih ugovora, sporazuma i konvencija iz ovih područja.
      […]
      Članak 19.
      Ministarstvo hrvatskih branitelja obavlja upravne i druge poslove koji se odnose na pravni položaj, rješavanje pravnog položaja, statusa i drugih pitanja hrvatskih branitelja iz Domovinskog rata, hrvatskih ratnih vojnih invalida iz Domovinskog rata, hrvatskih branitelja iz Domovinskog rata i članova njihovih obitelji, statusa člana obitelji smrtno stradalog i nestalog hrvatskog branitelja iz Domovinskog rata, osim poslova koji ulaze u djelokrug drugih ministarstava, kao i upravne i druge poslove koji se odnose na zaštitu civilnih žrtava iz Domovinskog rata, zaštitu sudionika Drugog svjetskog rata, zaštitu vojnih i civilnih invalida Drugog svjetskog rata, zaštitu osoba stradalih u obavljanju obvezne vojne službe od 15. svibnja 1945. nadalje i članova njihovih obitelji, ratnih vojnih invalida stradalih pri obavljanju vojnih i redarstvenih dužnosti u stranoj zemlji u okviru mirovnih snaga i mirovnih misija ako ih je na tu dužnost uputilo nadležno tijelo u okviru međunarodnih obveza nakon 15. svibnja 1945. i članova njihovih obitelji.
      […]
    note: >-
      The Act as originally enacted and published in the gazette, cited for the fields of
      activity of the ministries that the 2024 amendment left untouched. Most of the substantive
      articles were never amended, so for those ministries this is the gazette text still in force
      and the policy-area tags do not have to rely on a commercial consolidation. The quotation
      takes articles 1 and 2 — which establish the two-species division of the state administration
      that this file's perimeter follows — and then the paragraphs behind four tag decisions: the
      trade-policy paragraph of article 5, which is why trade is tagged on the foreign ministry;
      the sport paragraph of article 13; the first and third paragraphs of article 15, which are
      why labour, social_security, social_affairs, family, disability and elderly are all tagged on
      one department; and the first and third paragraphs of article 17, which are why
      telecommunications is tagged on the Ministry of the Sea, Transport and Infrastructure — the
      first names "elektroničke komunikacije (telekomunikacije i radijske komunikacije) i poštanske
      usluge" among that ministry's subjects and the third gives it the whole
      electronic-communications and postal legislative and international remit. Article 19 is
      quoted for the veterans ministry. Omissions are marked […] and no sentence is cut short.
      Articles 3 and 4 of this original text are deliberately not quoted, because both were
      replaced in 2024 and quoting the superseded lists here would invite a reader to count the
      wrong ministries; the lists in force are in the amending Act above. ELI identifier
      /eli/sluzbeni/2020/85/1593.

