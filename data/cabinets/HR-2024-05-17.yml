# Croatia — the 16th Government of the Republic of Croatia (third Plenković cabinet).
#
# See docs/DATA-CONTRACT.md. Five things worth knowing before reading the list:
#
#   1. Croatia enumerates its ministries by statute, in a single numbered list. Article 3 of
#      the Zakon o ustrojstvu i djelokrugu tijela državne uprave says "Ministarstva jesu:"
#      and names eighteen. Creating, merging or renaming a Croatian ministry means amending
#      that article, which is why the count here is a legal fact and not a reading of an
#      organisation chart.
#   2. Article 2 of the same Act splits the state administration in two — "Tijela državne
#      uprave su ministarstva i državne upravne organizacije" — and article 4 names nine
#      bodies of the second kind. All nine are recorded here and none is counted. That
#      perimeter decision is the main judgement call in this file and is set out in the
#      methodology notes.
#   3. Eighteen ministries, nineteen cabinet seats. The Prime Minister heads no ministry.
#      Nobody holds two portfolios and there is no minister without portfolio.
#   4. Seven of the eighteen ministers are also Deputy Prime Ministers. Under the Zakon o
#      Vladi that is a function attached to a serving minister, not a department, and it adds
#      neither a ministry nor a seat.
#   5. The cabinet took office on 17 May 2024, the day the Hrvatski sabor voted it its
#      confidence and the same day the amended Act creating the eighteen-ministry structure
#      entered into force. Several individual ministers have been replaced since; under
#      Croatian law that does not end the Government's mandate, so this is still the sitting
#      cabinet.

country: HR
cabinet_id: HR-2024-05-17

cabinet_name_original: 16. Vlada Republike Hrvatske
cabinet_name_en: 16th Government of the Republic of Croatia
cabinet_name_es: XVI Gobierno de la República de Croacia

head_of_government_title_original: Predsjednik Vlade Republike Hrvatske
head_of_government_title_en: Prime Minister

took_office: 2024-05-17
left_office: null

methodology_notes:
  - en: >-
      18 ministries and 19 cabinet seats. The eighteen are exactly the bodies listed in
      article 3 of the Zakon o ustrojstvu i djelokrugu tijela državne uprave as replaced by
      the amending Act of 16 May 2024, recorded here in the statute's own order, and each of
      the eighteen has an article of its own in the same Act setting out its field of
      activity. The nineteenth seat is the Prime Minister, who heads no department: article 2
      of the Zakon o Vladi Republike Hrvatske provides that "Vladu čine predsjednik, jedan
      ili više potpredsjednika i ministri", so the members of the Government are the Prime
      Minister plus the eighteen ministers, and the Sabor's decision of 17 May 2024 names
      exactly those nineteen people. The gap between the two figures is therefore one, and it
      is entirely the Prime Minister. Nobody in this cabinet holds two portfolios and there
      is no minister without portfolio, so no other adjustment is needed.
    es: >-
      18 ministerios y 19 asientos en el gabinete. Los dieciocho son exactamente los órganos
      enumerados en el artículo 3 de la Zakon o ustrojstvu i djelokrugu tijela državne uprave
      en la redacción que le dio la ley de modificación de 16 de mayo de 2024, recogidos aquí
      en el orden de la propia ley, y cada uno de los dieciocho tiene un artículo propio en
      la misma ley que fija su ámbito de actividad. El asiento decimonoveno es el del
      presidente del Gobierno, que no encabeza ningún departamento: el artículo 2 de la Zakon
      o Vladi Republike Hrvatske establece que «Vladu čine predsjednik, jedan ili više
      potpredsjednika i ministri», de modo que los miembros del Gobierno son el presidente
      más los dieciocho ministros, y la decisión del Sabor de 17 de mayo de 2024 nombra
      exactamente a esas diecinueve personas. La diferencia entre las dos cifras es por tanto
      de uno, y es íntegramente el presidente del Gobierno. Nadie en este gabinete acumula
      dos carteras y no hay ningún ministro sin cartera, así que no hace falta ningún otro
      ajuste.
  - en: >-
      Where the perimeter is drawn, and why. Article 2 of the enumerating Act divides the
      state administration into two species: "Tijela državne uprave su ministarstva i državne
      upravne organizacije." Article 3 lists eighteen bodies of the first kind and article 4
      nine of the second — two central state offices, the Croatian Firefighting Association,
      the State Inspectorate, the State Geodetic Administration, the Meteorological and
      Hydrological Service, the Intellectual Property Office, the Metrology Office and the
      Bureau of Statistics. All nine are recorded here as entities and none is counted,
      because they fail the second limb of this project's definition rather than the first:
      they are unquestionably central-government bodies named in a legal instrument, but
      article 59 of the Zakon o sustavu državne uprave provides that their heads are a
      "državni tajnik središnjeg državnog ureda", a "glavni ravnatelj" or a "glavni državni
      inspektor", whereas article 56 of the same Act says "Čelnik ministarstva je ministar."
      None of the nine holds ministerial rank, none sits in the Government, and none appears
      in the Sabor's confidence decision. Recording them rather than omitting them is
      deliberate: a reader who counts "state administration bodies" in Croatian law will
      arrive at twenty-seven, and this page shows exactly which nine of those twenty-seven it
      leaves out and on what statutory ground. The line is drawn at ministerial rank, not at
      importance: the Central State Office for Croats outside the Republic of Croatia runs
      what in several other European countries is a ministry or a minister without
      portfolio, and it is still not counted here.
    es: >-
      Dónde se traza el perímetro y por qué. El artículo 2 de la ley enumeradora divide la
      administración del Estado en dos especies: «Tijela državne uprave su ministarstva i
      državne upravne organizacije.» El artículo 3 enumera dieciocho órganos de la primera
      clase y el artículo 4 nueve de la segunda —dos oficinas centrales del Estado, la
      Asociación Croata de Bomberos, el Inspectorado del Estado, la Administración Geodésica
      del Estado, el Servicio Meteorológico e Hidrológico, la Oficina de Propiedad
      Intelectual, la Oficina de Metrología y la Oficina de Estadística—. Los nueve se
      registran aquí como entidades y ninguno se cuenta, porque incumplen el segundo requisito
      de la definición de este proyecto y no el primero: son sin duda órganos del gobierno
      central nombrados en un instrumento jurídico, pero el artículo 59 de la Zakon o sustavu
      državne uprave establece que sus titulares son un «državni tajnik središnjeg državnog
      ureda», un «glavni ravnatelj» o un «glavni državni inspektor», mientras que el artículo
      56 de la misma ley dice «Čelnik ministarstva je ministar.» Ninguno de los nueve tiene
      rango ministerial, ninguno se sienta en el Gobierno y ninguno aparece en la decisión de
      confianza del Sabor. Registrarlos en lugar de omitirlos es deliberado: quien cuente los
      «órganos de la administración del Estado» en el derecho croata llegará a veintisiete, y
      esta ficha muestra exactamente cuáles nueve de esos veintisiete deja fuera y con qué
      fundamento legal. La línea se traza en el rango ministerial, no en la importancia: la
      Oficina Central del Estado para los Croatas fuera de la República de Croacia gestiona lo
      que en varios otros países europeos es un ministerio o un ministro sin
      cartera, y aun así no se cuenta aquí.
  - en: >-
      Which cabinet is sitting, and why individual replacements do not change the answer.
      Croatia held a parliamentary election on 17 April 2024; the Hrvatski sabor voted
      confidence in this Government at its session of 17 May 2024 by the Odluka o iskazivanju
      povjerenja Vladi Republike Hrvatske, and article 4 of the Zakon o Vladi provides that
      "Predsjednik i članovi Vlade stupaju na dužnost kad im povjerenje iskaže većina svih
      zastupnika u Hrvatskom saboru" — so 17 May 2024 is the date this cabinet took office,
      and it is also the date on which the amended Act creating the present eighteen-ministry
      structure entered into force. Several of the nineteen people named in that decision
      have since been replaced: Marko Primorac was succeeded as Minister of Finance by
      Tomislav Ćorić, Josip Dabro by David Vlajčić at agriculture, Šime Erlić by Nataša Mikuš
      Žigman at regional development, Marin Piletić by Alen Ružić at labour and Vili Beroš by
      Irena Hrstić at health. Under article 7 of the Zakon o Vladi the Prime Minister accepts
      an individual minister's resignation and presents the replacement to the Sabor for a
      confidence vote on that member alone; the Government's mandate is unaffected and no new
      cabinet is formed. This page records departments and not people, so the reshuffles
      change nothing in it — but they are the reason a reader comparing it against a news
      report of the May 2024 swearing-in will find different names against the same eighteen
      portfolios.
    es: >-
      Qué gabinete está en funciones y por qué las sustituciones individuales no alteran la
      respuesta. Croacia celebró elecciones parlamentarias el 17 de abril de 2024; el Hrvatski
      sabor otorgó su confianza a este Gobierno en la sesión del 17 de mayo de 2024 mediante la
      Odluka o iskazivanju povjerenja Vladi Republike Hrvatske, y el artículo 4 de la Zakon o
      Vladi establece que «Predsjednik i članovi Vlade stupaju na dužnost kad im povjerenje
      iskaže većina svih zastupnika u Hrvatskom saboru» —de modo que el 17 de mayo de 2024 es
      la fecha en que este gabinete tomó posesión, y es también la fecha en que entró en vigor
      la ley modificada que crea la actual estructura de dieciocho ministerios—. Varias de las
      diecinueve personas nombradas en aquella decisión han sido sustituidas después: a Marko
      Primorac le sucedió Tomislav Ćorić en Finanzas, a Josip Dabro David Vlajčić en
      Agricultura, a Šime Erlić Nataša Mikuš Žigman en Desarrollo Regional, a Marin Piletić
      Alen Ružić en Trabajo y a Vili Beroš Irena Hrstić en Sanidad. Según el artículo 7 de la
      Zakon o Vladi, el presidente del Gobierno acepta la renuncia de un ministro individual y
      presenta al sustituto ante el Sabor para una votación de confianza sobre ese solo
      miembro; el mandato del Gobierno no se ve afectado y no se forma un nuevo gabinete. Esta
      ficha registra departamentos y no personas, así que las remodelaciones no cambian nada
      en él —pero son la razón por la que quien lo compare con una crónica de la toma de
      posesión de mayo de 2024 encontrará nombres distintos frente a las mismas dieciocho
      carteras—.
  - en: >-
      Two of the eighteen ministries did not exist before May 2024, and two central state offices
      were abolished to make them possible. This is worth knowing because it explains where several
      policy areas now sit. The amending Act of 16 May 2024 split the Ministarstvo gospodarstva i
      održivog razvoja into a Ministarstvo gospodarstva and a new Ministarstvo zaštite okoliša i
      zelene tranzicije, and created a wholly new Ministarstvo demografije i useljeništva; it also
      renamed the science ministry to add youth and the agriculture ministry to add forestry and
      fisheries. Its article 14 abolished the Središnji državni ured za razvoj digitalnog društva and
      the Središnji državni ured za demografiju i mlade, whose enabling provisions — articles 22 and
      21 of the Act respectively — now read simply "Brisan.", deleted. The digital office's work went
      to the Ministry of Justice, Administration and Digital Transformation, which is why that
      ministry carries the digital area, and the demography office's to the new demography ministry. This is also why
      article 4 now lists nine state administrative organisations where the Act as enacted in 2020
      listed twelve: the two offices just named were struck out in 2024, and a third, the Središnji
      državni ured za obnovu i stambeno zbrinjavanje of article 24, had already been removed by the
      2023 amendment, its post-earthquake reconstruction and housing work passing to the Ministry of
      Spatial Planning, Construction and State Property. Because this project
      publishes one cabinet per country and the previous cabinet is not in it, all of that is
      recorded here as background rather than as closed entries with an end date.
    es: >-
      Dos de los dieciocho ministerios no existían antes de mayo de 2024, y se suprimieron dos
      oficinas centrales del Estado para hacerlos posibles. Conviene saberlo porque explica dónde se
      sitúan ahora varias áreas de política. La ley de modificación de 16 de mayo de 2024 escindió el
      Ministarstvo gospodarstva i održivog razvoja en un Ministarstvo gospodarstva y un nuevo
      Ministarstvo zaštite okoliša i zelene tranzicije, y creó un Ministarstvo demografije i
      useljeništva completamente nuevo; además renombró el ministerio de ciencia para añadir la
      juventud y el de agricultura para añadir la silvicultura y la pesca. Su artículo 14 suprimió la
      Središnji državni ured za razvoj digitalnog društva y la Središnji državni ured za demografiju i
      mlade, cuyas disposiciones habilitantes —los artículos 22 y 21 de la ley, respectivamente—
      dicen ahora simplemente «Brisan.», suprimido. El trabajo de la oficina digital pasó al
      Ministerio de Justicia, Administración y Transformación Digital, y de ahí que ese
      ministerio lleve el área digital, y el de la oficina de demografía al nuevo ministerio de demografía. Es también la
      razón por la que el artículo 4 enumera hoy nueve organizaciones administrativas del Estado donde
      la ley de 2020 enumeraba doce: las dos oficinas recién citadas se suprimieron en 2024, y una
      tercera, la Središnji državni ured za obnovu i stambeno zbrinjavanje del artículo 24, había sido
      ya retirada por la modificación de 2023, pasando su labor de reconstrucción tras los terremotos
      y de realojo al Ministerio de Ordenación del Territorio, Construcción y Patrimonio del Estado.
      Como este proyecto
      publica un gabinete por país y el anterior no figura en él, todo lo anterior se recoge
      aquí como contexto y no como entidades cerradas con fecha de fin.
  - en: >-
      What rests on the gazette and what rests on a commercial consolidator, stated plainly because
      the distinction is the difference between a sourced count and a plausible one. Neither figure
      this project publishes depends on any consolidation: the list of eighteen ministries and the
      list of nine state administrative organisations are quoted verbatim from the gazette (Narodne
      novine 57/2024, document 982) and the cabinet's size comes from the Sabor's own decision
      (Narodne novine 60/2024, document 1006). The Act as originally enacted (Narodne novine 85/2020,
      document 1593) is cited in addition for the ministries whose fields of activity the 2024
      amendment did not touch. What does rest on the zakon.hr consolidated text alone is a subset of
      the fields of activity behind the policy-area tags — those of the interior, defence, finance,
      science, culture, regional development, agriculture, spatial planning and health ministries and
      of the central state office for Croats abroad — and that is disclosed in the note on that
      source together with what anyone re-checking the sources would need to quote to remove
      the dependency. No count depends on it.
    es: >-
      Qué se apoya en el boletín oficial y qué en un consolidador comercial, dicho sin rodeos porque
      la distinción es la diferencia entre un recuento con fuentes y un recuento verosímil. Ninguna de
      las dos cifras que publica este proyecto depende de ninguna consolidación: la lista de
      dieciocho ministerios y la de nueve organizaciones administrativas del Estado se citan
      textualmente del boletín (Narodne novine 57/2024, documento 982) y el tamaño del gabinete sale
      de la propia decisión del Sabor (Narodne novine 60/2024, documento 1006). El texto original de
      la ley (Narodne novine 85/2020, documento 1593) se cita además para los ministerios cuyo ámbito
      de actividad la modificación de 2024 no tocó. Lo que sí se apoya únicamente en el texto
      consolidado de zakon.hr es una parte de los ámbitos de actividad que sostienen las etiquetas de
      área de política —los de los ministerios de Interior, Defensa, Finanzas, Ciencia, Cultura,
      Desarrollo Regional, Agricultura, Ordenación del Territorio y Sanidad, y el de la oficina
      central para los croatas en el exterior— y así se declara en la nota de esa fuente, junto con lo
      que quien vuelva a comprobar las fuentes tendría que citar para eliminar esa dependencia.
      Ningún recuento depende de ello.
  - en: >-
      Names, and what "official" means here. Every Croatian name in this page is the statutory
      one from articles 3 and 4 of the Zakon o ustrojstvu i djelokrugu tijela državne uprave,
      with the diacritics as the gazette prints them. No English ministry name here is
      recorded as an official name, and that is a deliberate restraint rather than an oversight. The Croatian
      government does publish an English edition of vlada.gov.hr, and its Government Members
      page gives an official English form of every minister's title — "Minister of Croatian
      Veterans", "Minister of Economic Affairs", "Minister of Demography and Migration", and so
      on. What it does not publish anywhere is an English list of the ministries themselves, so
      the English names here are this project's renderings of the government's own ministerial
      titles, and are marked as such; the English title recorded for each minister reproduces
      the government's English title exactly, minus the words "Deputy Prime Minister and"
      where they appear, because the deputy-premiership is not part of the department's
      head's office. Two artefacts of the government's own English are preserved in those
      titles and not regularised: it writes
      serial commas in "Spatial Planning, Construction, and State Property", "Agriculture,
      Forestry, and Fisheries", "Justice, Administration, and Digital Transformation",
      "Science, Education, and Youth" and "Labour, Pension System, Family, and Social Policy"
      but not in "the Sea, Transport and Infrastructure", and it renders "gospodarstvo" as
      "Economic Affairs" and "useljeništvo" as "Migration". Spanish names throughout are this
      project's renderings and are marked as such. No abbreviation is recorded for any
      Croatian ministry: the government does not publish official short forms in the gazette,
      and the internal-organisation decrees use ad-hoc acronyms that changed with the 2024
      reorganisation, so inventing one would be a fabrication of exactly the kind this project
      exists to avoid.
    es: >-
      Los nombres, y qué significa aquí «oficial». Todos los nombres croatas de esta ficha son
      los legales de los artículos 3 y 4 de la Zakon o ustrojstvu i djelokrugu tijela državne
      uprave, con los diacríticos tal como los imprime el boletín oficial. Ningún nombre inglés
      de ministerio se registra aquí como nombre oficial, y es una contención deliberada y no
      un descuido. El
      gobierno croata sí publica una edición inglesa de vlada.gov.hr, y su página Government
      Members da una forma inglesa oficial del título de cada ministro —«Minister of Croatian
      Veterans», «Minister of Economic Affairs», «Minister of Demography and Migration», etc.—.
      Lo que no publica en ninguna parte es una lista inglesa de los ministerios mismos, así que
      los nombres ingleses de aquí son versiones de este proyecto a partir de los títulos
      ministeriales del propio gobierno, y así se indican; el título inglés registrado para
      cada ministro reproduce exactamente el título inglés del gobierno, menos las palabras
      «Deputy Prime Minister and» donde aparecen, porque la vicepresidencia no forma parte del
      cargo del titular del departamento. Se conservan en esos títulos, sin regularizar, dos
      peculiaridades del inglés del propio gobierno: escribe coma serial en «Spatial Planning, Construction, and State Property»,
      «Agriculture, Forestry, and Fisheries», «Justice, Administration, and Digital
      Transformation», «Science, Education, and Youth» y «Labour, Pension System, Family, and
      Social Policy» pero no en «the Sea, Transport and Infrastructure», y traduce
      «gospodarstvo» por «Economic Affairs» y «useljeništvo» por «Migration». Todos los nombres
      en español son traducciones de este proyecto y así se indican. No se registra
      abreviatura para ningún ministerio croata: el gobierno no publica formas cortas oficiales
      en el boletín, y los decretos de organización interna usan siglas ad hoc que cambiaron con
      la reorganización de 2024, de modo que inventar una sería exactamente la clase de
      fabricación que este proyecto existe para evitar.
  - en: >-
      One discrepancy between two versions of the same statutory list, disclosed rather than
      quietly resolved. The consolidated text published by zakon.hr prints the eighth item of
      article 3 as "Ministarstvo znanosti i obrazovanja i mladih", with "i" where the gazette
      has a comma. The gazette itself — the amending Act at Narodne novine 57/2024, item 982 —
      prints "8. Ministarstvo znanosti, obrazovanja i mladih", and so does article 11 of the
      same consolidated text, which opens "Ministarstvo znanosti, obrazovanja i mladih obavlja
      upravne i druge poslove...", and so does the Sabor's confidence decision, which appoints
      a "ministar znanosti, obrazovanja i mladih". Following the higher-tier source, this page
      uses the gazette's form and treats the zakon.hr reading as a transcription slip in the
      consolidator. Both quotations are reproduced in the sources below exactly as each source
      spells them, so a reader can see the disagreement instead of taking our word for it.
    es: >-
      Una discrepancia entre dos versiones de la misma lista legal, declarada y no resuelta en
      silencio. El texto consolidado que publica zakon.hr imprime el octavo apartado del
      artículo 3 como «Ministarstvo znanosti i obrazovanja i mladih», con «i» donde el boletín
      pone una coma. El boletín mismo —la ley de modificación en Narodne novine 57/2024,
      documento 982— imprime «8. Ministarstvo znanosti, obrazovanja i mladih», y lo mismo hace
      el artículo 11 de ese mismo texto consolidado, que empieza «Ministarstvo znanosti,
      obrazovanja i mladih obavlja upravne i druge poslove...», y lo mismo la decisión de
      confianza del Sabor, que nombra a un «ministar znanosti, obrazovanja i mladih». Siguiendo
      la fuente de nivel superior, esta ficha usa la forma del boletín y trata la lectura de
      zakon.hr como un error de transcripción del consolidador. Ambas citas se reproducen en las
      fuentes de más abajo exactamente como las escribe cada fuente, para que el lector vea la
      discrepancia en lugar de fiarse de nuestra palabra.
  - en: >-
      Four policy-area tags sit where a reader would not look for them. Telecommunications is
      tagged on the Ministry of the Sea, Transport and Infrastructure, not on the ministry whose
      name contains "digital transformation": article 17 of the Act gives the transport ministry
      electronic communications, the information society and postal services, and it has held
      them since 2020. Digital government is tagged on the Ministry of Justice, Administration
      and Digital Transformation, which since May 2024 manages the digitalisation of the whole
      state and public administration and the state information infrastructure. Energy and
      mining are tagged on the Ministry of Economic Affairs, whose statutory remit includes the
      whole energy sector — electricity, heat, oil, gas, nuclear energy, renewables, hydrocarbon
      exploration and energy efficiency — and not on the environment ministry, whose name might
      suggest otherwise; water, by contrast, is on the environment ministry, which holds water
      management, flood protection, irrigation and public water supply. Religious affairs is
      tagged on the justice ministry, which holds the legal status and register of religious
      communities along with political parties, associations and foundations.
    es: >-
      Cuatro etiquetas de área de política están donde un lector no las buscaría. Las
      telecomunicaciones se etiquetan en el Ministerio del Mar, Transporte e Infraestructuras y
      no en el ministerio cuyo nombre contiene «transformación digital»: el artículo 17 de la ley
      atribuye al ministerio de transporte las comunicaciones electrónicas, la sociedad de la
      información y los servicios postales, y las tiene desde 2020. La administración digital se
      etiqueta en el Ministerio de Justicia, Administración y Transformación Digital, que desde
      mayo de 2024 gestiona la digitalización de toda la administración estatal y pública y la
      infraestructura estatal de información. La energía y la minería se etiquetan en el
      Ministerio de Economía, cuyo ámbito legal incluye todo el sector energético —electricidad,
      calor, petróleo, gas, energía nuclear, renovables, exploración de hidrocarburos y
      eficiencia energética— y no en el ministerio de medio ambiente, cuyo nombre podría sugerir
      lo contrario; el agua, en cambio, está en el ministerio de medio ambiente, que tiene la
      gestión de las aguas, la protección frente a inundaciones, el riego y el abastecimiento
      público. Los asuntos religiosos se etiquetan en el ministerio de justicia, que tiene el
      estatuto jurídico y el registro de las comunidades religiosas junto con los partidos
      políticos, las asociaciones y las fundaciones.
  - en: >-
      Three policy areas are deliberately tagged on two ministries each, and equality is tagged
      nowhere. The three duplicates are trade, on the Ministry of Foreign and European Affairs for
      commercial policy and the common commercial policy of the European Union and on the Ministry of
      Economic Affairs for the internal market and domestic trade; infrastructure, on the Ministry of
      the Sea, Transport and Infrastructure for transport infrastructure and on the Ministry of
      Spatial Planning, Construction and State Property as the state's construction and public-works
      authority; and family, for the reason set out next. In each case the two departments hold
      different halves of a genuinely split competence under different articles of the enumerating
      Act, so a comparison view that reports two Croatian ministries for those areas is reporting the
      structure correctly rather than double-counting. Croatia split
      family and demographic policy across two ministries in May 2024: the Ministry of Labour,
      Pension System, Family and Social Policy keeps family law, child protection, protection
      from domestic violence and the social-care system, while the new Ministry of Demography and
      Migration was given natality measures, support for parenthood, the reconciliation of work
      and family life, child allowance and maternity and parental benefits. Both therefore carry
      the family area. Equality has no tag on any Croatian
      ministry because it has no ministry: gender equality sits in the Ured za ravnopravnost
      spolova, one of the six expert offices article 27 of the Zakon o Vladi requires the
      Government to establish, and human and minority rights in the Ured za ljudska prava i prava
      nacionalnih manjina, with a residual competence for minority rights in the justice
      ministry. Those offices are outside this page's perimeter, which is the two statutory lists
      of state administration bodies plus the bodies the Zakon o Vladi constitutes inside the
      Government itself.
    es: >-
      Tres áreas de política se etiquetan deliberadamente en dos ministerios cada una, y la igualdad
      no se etiqueta en ninguno. Los tres duplicados son el comercio, en el Ministerio de Asuntos
      Exteriores y Europeos por la política comercial y la política comercial común de la Unión
      Europea y en el Ministerio de Economía por el mercado interior y el comercio interno;
      las infraestructuras, en el Ministerio del Mar, Transporte e Infraestructuras por la
      infraestructura de transporte y en el Ministerio de Ordenación del Territorio, Construcción
      y Patrimonio del Estado como autoridad estatal de construcción y obra pública; y la familia,
      por la razón que se expone a continuación. En los tres casos los dos departamentos tienen mitades distintas de una
      competencia realmente repartida al amparo de artículos distintos de la ley enumeradora, de modo
      que una vista comparativa que informe de dos ministerios croatas en esas áreas está describiendo
      bien la estructura y no contando dos veces. Croacia repartió la política familiar y demográfica
      entre dos ministerios en
      mayo de 2024: el Ministerio de Trabajo, Sistema de Pensiones, Familia y Política Social
      conserva el derecho de familia, la protección de la infancia, la protección frente a la
      violencia doméstica y el sistema de servicios sociales, mientras que al nuevo Ministerio de
      Demografía e Inmigración se le atribuyeron las medidas de natalidad, el apoyo a la
      parentalidad, la conciliación de la vida laboral y familiar, la prestación por hijo y las
      prestaciones de maternidad y parentalidad. Ambos llevan por tanto el área de familia. La
      igualdad no se etiqueta en ningún ministerio
      croata porque no tiene ministerio: la igualdad de género reside en la Ured za ravnopravnost
      spolova, una de las seis oficinas especializadas que el artículo 27 de la Zakon o Vladi
      obliga al Gobierno a crear, y los derechos humanos y de las minorías en la Ured za ljudska
      prava i prava nacionalnih manjina, con una competencia residual sobre derechos de las
      minorías en el ministerio de justicia. Esas oficinas quedan fuera del perímetro de esta
      ficha, que es el de las dos listas legales de órganos de la administración del Estado más
      los órganos que la Zakon o Vladi constituye dentro del Gobierno mismo.

