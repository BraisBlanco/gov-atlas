    has_cabinet_seat: true
    head_count: 1
    policy_areas: [defence]
    counts_as_ministry: true
    url: https://www.morh.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Article 7 gives this ministry the defence system, defence policy, the Defence Strategy,
        international military cooperation, military and civil defence planning, conscription and
        mobilisation, the organisation, equipment, armament, development and use of the Armed
        Forces, and their participation in operations abroad. Only defence is tagged: unlike
        several countries in this dataset, Croatia does not give its defence ministry civil
        protection, which article 6 places with the interior ministry, and it has no veterans
        remit either, which article 19 gives a ministry of its own.
      es: >-
        El artículo 7 atribuye a este ministerio el sistema de defensa, la política de defensa,
        la Estrategia de Defensa, la cooperación militar internacional, la planificación de la
        defensa militar y civil, el reclutamiento y la movilización, la organización, el
        equipamiento, el armamento, el desarrollo y el empleo de las Fuerzas Armadas y su
        participación en operaciones en el exterior. Sólo se etiqueta la defensa: a diferencia de
        varios países de este conjunto de datos, Croacia no atribuye a su ministerio de defensa
        la protección civil, que el artículo 6 sitúa en el ministerio del Interior, ni tiene
        competencias sobre veteranos, a los que el artículo 19 dedica un ministerio propio.

  - id: HR-2024-financije
    order: 4
    name_original: Ministarstvo financija
    abbreviation_original: null
    name_en: Ministry of Finance
    name_es: Ministerio de Finanzas
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar financija
    head_title_en: Minister of Finance
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [finance, budget]
    counts_as_ministry: true
    url: https://mfin.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Article 8 gives this ministry the analysis and forecasting of macroeconomic developments
        as the basis for economic and fiscal policy, the state budget and its execution, the
        consolidation of public accounts, the state treasury's general ledger, budget
        supervision, the tax and customs system, public debt, internal financial control in the
        public sector, the financial management of European Union funds and Croatia's
        contribution to the EU budget. Only finance and budget are tagged. Two omissions are
        deliberate: economy is not tagged even though the ministry does macroeconomic analysis,
        because Croatia's economic-development portfolio is the Ministry of Economic Affairs'
        and tagging both would report two Croatian economy ministries where there is one; and
        state_assets is not tagged even though the same article gives the ministry the exercise
        of ownership rights in legal persons of special interest to the Republic, because the
        management of state property as such belongs to the Ministry of Spatial Planning,
        Construction and State Property, which is where that tag sits.
      es: >-
        El artículo 8 atribuye a este ministerio el análisis y la previsión de la evolución
        macroeconómica como base de la política económica y fiscal, el presupuesto del Estado y
        su ejecución, la consolidación de las cuentas públicas, el libro mayor del tesoro
        público, el control presupuestario, el sistema fiscal y aduanero, la deuda pública, el
        control financiero interno en el sector público, la gestión financiera de los fondos de
        la Unión Europea y la contribución de Croacia al presupuesto de la UE. Sólo se etiquetan
        finanzas y presupuesto. Dos omisiones son deliberadas: no se etiqueta economy aunque el
        ministerio haga análisis macroeconómico, porque la cartera de desarrollo económico
        corresponde al Ministerio de Economía y etiquetar ambos informaría de dos ministerios
        croatas de economía donde hay uno; y no se etiqueta state_assets aunque el mismo artículo
        le atribuya el ejercicio de los derechos de propiedad en las personas jurídicas de
        especial interés para la República, porque la gestión del patrimonio del Estado como tal
        corresponde al Ministerio de Ordenación del Territorio, Construcción y Patrimonio del
        Estado, donde se sitúa esa etiqueta.

  - id: HR-2024-gospodarstvo
    order: 5
    name_original: Ministarstvo gospodarstva
    abbreviation_original: null
    name_en: Ministry of Economic Affairs
    name_es: Ministerio de Economía
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar gospodarstva
    head_title_en: Minister of Economic Affairs
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [economy, energy, industry, trade, small_business, mining, consumer_protection]
    counts_as_ministry: true
    url: https://mingo.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        The widest remit in the Croatian cabinet, and the entity most likely to be tagged
        differently by another curator. It was created in May 2024 when the Ministarstvo
        gospodarstva i održivog razvoja was split in two, the environmental half becoming the
        Ministry of Environment and Green Transition. Article 9 as replaced by the 2024 amending
        Act gives it competitiveness and investment promotion, industrial policy, the application
        of innovation and new technologies, mining, trade on the European Union's internal market,
        supply and prices, standardisation, accreditation, conformity assessment, metrology and
        competition policy, consumer protection, strategic commodity reserves, the public
        procurement and concessions systems, public-private partnership, small and medium
        enterprises, crafts and cooperatives, export and foreign investment promotion, and the
        whole of the energy sector — electricity, heat, oil and oil derivatives, natural gas,
        nuclear energy, renewables, hydrocarbon and geothermal exploration and energy efficiency.
        Energy is the tag most likely to be looked for on the wrong ministry: it is here and not
        with the environment ministry, whose name suggests a green-transition remit but whose
        statutory field of activity does not include energy. Mining is tagged because "rudarstvo"
        is named in the article. Innovation is not tagged here even though the article mentions
        the application of innovation, because the innovation system itself is the Ministry of
        Science, Education and Youth's; tourism is not tagged because Croatia has a tourism
        ministry of its own.
      es: >-
        La cartera más amplia del gabinete croata y la entidad que otro curador etiquetaría con
        mayor probabilidad de forma distinta. Se creó en mayo de 2024 al escindirse en dos el
        Ministarstvo gospodarstva i održivog razvoja, cuya mitad ambiental pasó a ser el
        Ministerio de Protección del Medio Ambiente y Transición Verde. El artículo 9, en la
        redacción que le dio la ley de modificación de 2024, le atribuye la competitividad y el
        fomento de la inversión, la política industrial, la aplicación de la innovación y de las
        nuevas tecnologías, la minería, el comercio en el mercado interior de la Unión Europea, el
        abastecimiento y los precios, la normalización, la acreditación, la evaluación de la
        conformidad, la metrología y la política de competencia, la protección de los
        consumidores, las reservas estratégicas de mercancías, los sistemas de contratación
        pública y de concesiones, la colaboración público-privada, las pymes, la artesanía y el
        cooperativismo, el fomento de la exportación y de la inversión extranjera, y todo el
        sector energético —electricidad, calor, petróleo y derivados, gas natural, energía
        nuclear, renovables, exploración de hidrocarburos y de aguas geotérmicas y eficiencia
        energética—. La energía es la etiqueta que más probablemente se buscaría en el ministerio
        equivocado: está aquí y no en el de medio ambiente, cuyo nombre sugiere una cartera de
        transición verde pero cuyo ámbito legal de actividad no incluye la energía. Se etiqueta la
        minería porque «rudarstvo» figura nombrado en el artículo. No se etiqueta la innovación
        aunque el artículo mencione su aplicación, porque el sistema de innovación corresponde al
        Ministerio de Ciencia, Educación y Juventud; no se etiqueta el turismo porque Croacia
        tiene un ministerio de turismo propio.

  - id: HR-2024-zastita-okolisa-i-zelena-tranzicija
    order: 6
    name_original: Ministarstvo zaštite okoliša i zelene tranzicije
    abbreviation_original: null
    name_en: Ministry of Environment and Green Transition
    name_es: Ministerio de Protección del Medio Ambiente y Transición Verde
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar zaštite okoliša i zelene tranzicije
    head_title_en: Minister of Environment and Green Transition
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [environment, climate, water]
    counts_as_ministry: true
    url: https://mzozt.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Created in May 2024 out of the environmental half of the former Ministarstvo gospodarstva
        i održivog razvoja. Article 9.a gives it general and sectoral environmental policy, waste
        management, the protection of air, soil, water, the sea and the plant and animal world,
        the monitoring of pollution including light pollution, the causes of climate change and
        ozone depletion, climate mitigation and adaptation, the reduction of ozone-depleting
        substances and fluorinated greenhouse gases, green public procurement, biodiversity and
        geodiversity, protected areas and the ecological network, the trade in wild species,
        genetically modified organisms in transboundary movement, and the whole of water
        management — flood and ice protection, erosion and torrent control, the water estate,
        irrigation and drainage, public water supply and waste-water treatment. Water is tagged
        for that reason and is a fuller remit than the ministry's name suggests. Energy is
        emphatically not tagged: despite "green transition" in its title, the energy sector went
        to the Ministry of Economic Affairs in the same 2024 split, and this is the single most
        likely misreading of the Croatian structure. The state's environmental analytics, the
        greenhouse-gas emissions trading system and nature-protection expertise are also here,
        Croatia having folded its former environment agency into the ministry.
      es: >-
        Creado en mayo de 2024 a partir de la mitad ambiental del antiguo Ministarstvo
        gospodarstva i održivog razvoja. El artículo 9.a le atribuye la política ambiental general
        y sectorial, la gestión de residuos, la protección del aire, el suelo, las aguas, el mar y
        el mundo vegetal y animal, el seguimiento de la contaminación incluida la luminosa, las
        causas del cambio climático y del deterioro de la capa de ozono, la mitigación y la
        adaptación climáticas, la reducción de las sustancias que agotan el ozono y de los gases
        fluorados de efecto invernadero, la contratación pública verde, la biodiversidad y la
        geodiversidad, los espacios protegidos y la red ecológica, el comercio de especies
        silvestres, los organismos modificados genéticamente en su movimiento transfronterizo y
        toda la gestión de las aguas —protección frente a inundaciones y hielos, control de la
        erosión y de los torrentes, el dominio público hidráulico, el riego y el drenaje, el
        abastecimiento público y el tratamiento de aguas residuales—. Por eso se etiqueta el agua,
        una competencia más amplia de lo que sugiere el nombre del ministerio. La energía
        rotundamente no se etiqueta: pese a la «transición verde» de su título, el sector
        energético pasó al Ministerio de Economía en la misma escisión de 2024, y ésta es la
        lectura errónea más probable de la estructura croata. La analítica ambiental del Estado, el
        sistema de comercio de emisiones y la experticia en protección de la naturaleza están
        también aquí, después de que Croacia integrara su antigua agencia de medio ambiente en el
        ministerio.

  - id: HR-2024-pravosude-uprava-i-digitalna-transformacija
    order: 7
    name_original: Ministarstvo pravosuđa, uprave i digitalne transformacije
    abbreviation_original: null
    name_en: Ministry of Justice, Administration and Digital Transformation
    name_es: Ministerio de Justicia, Administración y Transformación Digital
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar pravosuđa, uprave i digitalne transformacije
    head_title_en: Minister of Justice, Administration, and Digital Transformation
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [justice, public_administration, digital, territorial_administration, religion]
    counts_as_ministry: true
    url: https://mpudt.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Three portfolios in one department, and the entity that carries the most surprising tags.
        Article 10 gives it civil, criminal, misdemeanour and commercial law and administrative
        adjudication, the prison and probation system, notaries and the bar, international legal
        assistance, pardons, property rights, expropriation, the restitution of property seized
        under communist rule, the succession to the assets of the former Yugoslavia, cooperation
        with international criminal courts, human and national-minority rights not assigned
        elsewhere, and anti-corruption coordination. Under the "uprava" head it holds the
        political system, the system and organisation of the state administration, the
        organisation and competences of local and regional self-government, electoral law and the
        voter register, civil status registers, the general legal framework for institutions,
        political parties, religious communities, associations and foundations, the general
        administrative procedure, administrative inspection and employment in the state
        administration — which is why both public_administration and territorial_administration
        are tagged. religion is the softest tag in this file and is disclosed as such: it is
        tagged here because the legal status and the register of religious communities are this
        ministry's, but Croatia has no religious-affairs ministry and the political relationship
        with the religious communities runs through a Government commission with an office of its
        own, the Ured komisije za odnose s vjerskim zajednicama, which is outside this file's
        perimeter. A curator applying the "primary responsibility" test strictly would drop the
        tag; it is kept because the register and the legal framework are a real statutory
        competence and because dropping it would leave a reader unable to find where religious
        affairs sit in Croatia at all. Note also that the same paragraph gives this ministry the
        registers of political parties, associations and foundations, for which the taxonomy has
        no id and none is proposed. Digital is tagged because the 2024 amendment moved the whole
        digital-transformation
        portfolio here from the abolished Središnji državni ured za razvoj digitalnog društva: the
        ministry now manages the digitalisation of every state and public administration body, the
        state information infrastructure, interoperability and public registers, the digital
        economy, trust services and innovative technologies including artificial intelligence.
        Telecommunications is not tagged: electronic communications and postal services stayed
        with the Ministry of the Sea, Transport and Infrastructure. A caution on the web address:
        the domain mpudt.gov.hr matches the ministry's full name, but the title of its own site
        still read "Ministarstvo pravosuđa i uprave Republike Hrvatske" on the access date, without
        the digital transformation, so the site had not caught up with the 2024 renaming.
      es: >-
        Tres carteras en un solo departamento, y la entidad con las etiquetas más sorprendentes. El
        artículo 10 le atribuye el derecho civil, penal, de faltas y mercantil y la jurisdicción
        administrativa, el sistema penitenciario y de probación, el notariado y la abogacía, la
        asistencia jurídica internacional, los indultos, el derecho de propiedad, la expropiación,
        la restitución de bienes confiscados bajo el régimen comunista, la sucesión en el
        patrimonio de la antigua Yugoslavia, la cooperación con los tribunales penales
        internacionales, los derechos humanos y de las minorías nacionales no atribuidos a otro
        órgano y la coordinación anticorrupción. Bajo el epígrafe «uprava» tiene el sistema
        político, el sistema y la organización de la administración del Estado, la organización y
        las competencias de la autonomía local y regional, el derecho electoral y el censo, los
        registros civiles, el marco legal general de las instituciones, los partidos políticos, las
        comunidades religiosas, las asociaciones y las fundaciones, el procedimiento administrativo
        general, la inspección administrativa y el empleo en la administración del Estado —de ahí
        que se etiqueten public_administration y territorial_administration—. religion es la
        etiqueta más discutible de este fichero y así se declara: se etiqueta aquí porque el
        estatuto jurídico y el registro de las comunidades religiosas corresponden a este
        ministerio, pero Croacia no tiene un ministerio de asuntos religiosos y la relación
        política con las comunidades religiosas discurre a través de una comisión del Gobierno con
        oficina propia, la Ured komisije za odnose s vjerskim zajednicama, que queda fuera del
        perímetro de este fichero. Un curador que aplicara con rigor el criterio de
        «responsabilidad principal» eliminaría la etiqueta; se mantiene porque el registro y el
        marco legal son una competencia legal real y porque suprimirla dejaría al lector sin poder
        localizar en absoluto dónde residen los asuntos religiosos en Croacia. Nótese además que el
        mismo párrafo atribuye a este ministerio los registros de partidos políticos, asociaciones
        y fundaciones, para los que la taxonomía no tiene identificador y no se propone ninguno. Se
        etiqueta digital
        porque la modificación de 2024 trasladó aquí toda la cartera de transformación digital desde
        la suprimida Središnji državni ured za razvoj digitalnog društva: el ministerio gestiona
        ahora la digitalización de todos los órganos de la administración estatal y pública, la
        infraestructura estatal de información, la interoperabilidad y los registros públicos, la
        economía digital, los servicios de confianza y las tecnologías innovadoras incluida la
        inteligencia artificial. No se etiquetan las telecomunicaciones: las comunicaciones
        electrónicas y los servicios postales siguen en el Ministerio del Mar, Transporte e
        Infraestructuras. Una advertencia sobre la dirección web: el dominio mpudt.gov.hr responde
        al nombre completo del ministerio, pero el título de su propio sitio seguía siendo
        «Ministarstvo pravosuđa i uprave Republike Hrvatske» en la fecha de consulta, sin la
        transformación digital, de modo que el sitio no se había puesto al día con el cambio de
        nombre de 2024.

  - id: HR-2024-znanost-obrazovanje-i-mladi
    order: 8
    name_original: Ministarstvo znanosti, obrazovanja i mladih
    abbreviation_original: null
    name_en: Ministry of Science, Education and Youth
    name_es: Ministerio de Ciencia, Educación y Juventud
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar znanosti, obrazovanja i mladih
    head_title_en: Minister of Science, Education, and Youth
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [education, higher_education, research, innovation, youth, vocational_training]
    counts_as_ministry: true
    url: https://mzom.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        The whole of Croatian education, science and youth policy in one department. Article 11
        gives it preschool, primary and secondary education at home and abroad, the national
        curriculum, textbooks and educational standards, pupil welfare and educational inspection;
        higher education, the accreditation and funding of higher-education institutions, student
        welfare, the Croatian Qualifications Framework and lifelong learning; scientific,
        technological and innovation activity, the funding of research programmes and projects,
        technology transfer and intellectual-property policy in that context; and youth policy,
        including non-formal education, youth participation in decision-making, volunteering and
        support to the organised youth sector. vocational_training is tagged because the same
        article gives it the training of children, young people and adults in technical knowledge
        and skills, and because Croatia's initial vocational education is part of the secondary
        school system it runs; labour-market retraining is separately the Ministry of Labour's and
        is not tagged here. The ministry gained youth in the May 2024 reorganisation, which is what
        the "i mladih" in its name records. Its name is the one point where the commercial
        consolidated text and the gazette disagree; see the methodology note.
      es: >-
        Toda la política croata de educación, ciencia y juventud en un solo departamento. El
        artículo 11 le atribuye la educación preescolar, primaria y secundaria en el país y en el
        exterior, el currículo nacional, los libros de texto y los estándares educativos, el
        bienestar del alumnado y la inspección educativa; la educación superior, la acreditación y
        la financiación de las instituciones de educación superior, el bienestar estudiantil, el
        Marco Croata de Cualificaciones y el aprendizaje a lo largo de la vida; la actividad
        científica, tecnológica y de innovación, la financiación de programas y proyectos de
        investigación, la transferencia de tecnología y la política de propiedad intelectual en ese
        contexto; y la política de juventud, incluida la educación no formal, la participación
        juvenil en la toma de decisiones, el voluntariado y el apoyo al sector juvenil organizado.
        Se etiqueta vocational_training porque el mismo artículo le atribuye la capacitación de
        niños, jóvenes y adultos en conocimientos y destrezas técnicas, y porque la formación
        profesional inicial croata forma parte del sistema de educación secundaria que gestiona; la
        recualificación para el mercado de trabajo corresponde por separado al Ministerio de
        Trabajo y no se etiqueta aquí. El ministerio ganó la juventud en la reorganización de mayo
        de 2024, que es lo que registra el «i mladih» de su nombre. Su nombre es el único punto en
        que el texto consolidado comercial y el boletín oficial discrepan; véase la nota
        metodológica.

  - id: HR-2024-demografija-i-useljenistvo
    order: 9
    name_original: Ministarstvo demografije i useljeništva
    abbreviation_original: null
    name_en: Ministry of Demography and Migration
    name_es: Ministerio de Demografía e Inmigración
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar demografije i useljeništva
    head_title_en: Minister of Demography and Migration
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [family, diaspora]
    counts_as_ministry: true
    url: https://mdu.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        A wholly new ministry created by the May 2024 reorganisation, and the reason article 11.a
        was inserted into the Act. It monitors and analyses demographic trends, proposes measures
        to raise the birth rate, balance the age structure and maintain the spatial distribution of
        the population, proposes measures to encourage people to stay in Croatia, support for
        parenthood and the reconciliation of family and working life, and supervises the
        application of the rules on child allowance, maternity and parental leave and benefits and
        newborn-equipment aid. Its second field of activity is the return and settlement of members
        of the Croatian emigrant community and their integration into Croatian economic and social
        life. family and diaspora are therefore the tags, and neither is obvious from the name.
        Migration is deliberately not tagged despite "useljeništvo" in the title and "Migration" in
        the government's own English rendering: what the statute gives this ministry is
        return-migration of ethnic Croats, whereas immigration and asylum as a matter of
        administration are the interior ministry's. Family is tagged here and also on the Ministry
        of Labour, Pension System, Family and Social Policy; Croatia split family policy between
        the two in 2024 and this dataset reports both rather than choosing.
      es: >-
        Un ministerio enteramente nuevo creado por la reorganización de mayo de 2024, y la razón por
        la que se insertó el artículo 11.a en la ley. Sigue y analiza las tendencias demográficas,
        propone medidas para elevar la natalidad, equilibrar la estructura de edades y mantener el
        reparto territorial de la población, propone medidas para incentivar la permanencia en
        Croacia, el apoyo a la parentalidad y la conciliación de la vida familiar y laboral, y
        supervisa la aplicación de la normativa sobre la prestación por hijo, los permisos y
        prestaciones de maternidad y parentalidad y la ayuda para el equipamiento del recién nacido.
        Su segundo ámbito de actividad es el retorno y el asentamiento de los miembros de la
        emigración croata y su integración en la vida económica y social del país. Las etiquetas son
        por tanto family y diaspora, y ninguna de las dos resulta obvia a partir del nombre. La
        migración no se etiqueta deliberadamente, pese al «useljeništvo» del título y al «Migration»
        de la propia versión inglesa del gobierno: lo que la ley atribuye a este ministerio es la
        migración de retorno de croatas étnicos, mientras que la inmigración y el asilo como materia
        administrativa corresponden al ministerio del Interior. La familia se etiqueta aquí y también
        en el Ministerio de Trabajo, Sistema de Pensiones, Familia y Política Social; Croacia repartió
        la política familiar entre los dos en 2024 y este conjunto de datos informa de ambos en lugar
        de elegir.

  - id: HR-2024-kultura-i-mediji
    order: 10
    name_original: Ministarstvo kulture i medija
    abbreviation_original: null
    name_en: Ministry of Culture and Media
    name_es: Ministerio de Cultura y Medios de Comunicación
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar kulture i medija
    head_title_en: Minister of Culture and Media
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [culture, media]
    counts_as_ministry: true
    url: https://min-kulture.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Article 12 gives this ministry cultural and artistic creation, cultural institutions,
        cultural relations abroad, the cultural and creative industries, the museum, gallery,
        library, archive and theatre sectors, the research, documentation and protection of
        cultural heritage, the designation of protected cultural property, conservation and
        restoration, the Croatian Commission for UNESCO, and support for the cultural needs of
        Croats in other countries. Media is tagged because the same article gives it the normative
        and administrative work in the media field and copyright and related rights policy;
        Croatia has no separate media or information ministry.
      es: >-
        El artículo 12 atribuye a este ministerio la creación cultural y artística, las instituciones
        culturales, las relaciones culturales con el exterior, las industrias culturales y creativas,
        los sectores museístico, de galerías, bibliotecario, archivístico y teatral, la investigación,
        documentación y protección del patrimonio cultural, la declaración de bienes culturales
        protegidos, la conservación y la restauración, la Comisión Croata para la UNESCO y el apoyo a
        las necesidades culturales de los croatas en otros países. Se etiquetan los medios porque el
        mismo artículo le atribuye el trabajo normativo y administrativo en el ámbito de los medios y
        la política de derechos de autor y derechos conexos; Croacia no tiene un ministerio separado
        de medios o de información.

  - id: HR-2024-turizam-i-sport
    order: 11
    name_original: Ministarstvo turizma i sporta
    abbreviation_original: null
    name_en: Ministry of Tourism and Sports
    name_es: Ministerio de Turismo y Deporte
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar turizma i sporta
    head_title_en: Minister of Tourism and Sports
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [tourism, sport]
    counts_as_ministry: true
    url: https://mints.gov.hr
    sources: [nn-57-2024-982, nn-85-2020-1593, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Two unrelated portfolios in one department, which is common in this dataset but worth
        stating. Article 13 gives it tourism policy and the tourism development strategy,
        investment in tourism, health, inland, nautical, congress, adventure, cultural and youth
        tourism, small and medium enterprise in tourism and hospitality, accommodation quality,
        the restructuring of hotel companies, digital tourism and tourism infrastructure; and,
        separately, the development of sport and physical culture, recreational, school,
        university, amateur and professional sport, the financing of sport programmes, the
        categorisation of sports and athletes, and support and recognition for elite athletes.
        Tourism is a very large portfolio in Croatian terms and the ministry is not a junior one.
        Physical education inside the school curriculum belongs to the education ministry.
      es: >-
        Dos carteras sin relación entre sí en un solo departamento, algo frecuente en este conjunto de
        datos pero que conviene decir. El artículo 13 le atribuye la política turística y la
        estrategia de desarrollo del turismo, la inversión en turismo, el turismo de salud, de
        interior, náutico, de congresos, de aventura, cultural y juvenil, las pymes del turismo y la
        hostelería, la calidad del alojamiento, la reestructuración de las empresas hoteleras, el
        turismo digital y la infraestructura turística; y, por separado, el desarrollo del deporte y
        de la cultura física, el deporte recreativo, escolar, universitario, amateur y profesional, la
        financiación de programas deportivos, la categorización de deportes y deportistas y el apoyo y
        el reconocimiento a los deportistas de élite. El turismo es una cartera muy grande en términos
        croatas y el ministerio no es menor. La educación física dentro del currículo escolar
        corresponde al ministerio de educación.

  - id: HR-2024-regionalni-razvoj-i-fondovi-eu
    order: 12
    name_original: Ministarstvo regionalnoga razvoja i fondova Europske unije
    abbreviation_original: null
    name_en: Ministry of Regional Development and European Union Funds
    name_es: Ministerio de Desarrollo Regional y Fondos de la Unión Europea
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar regionalnoga razvoja i fondova Europske unije
    head_title_en: Minister of Regional Development and European Union Funds
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [regional_development]
    counts_as_ministry: true
    url: https://razvoj.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Article 14 gives this ministry the establishment and management of the whole system of
        strategic planning and development management, the national development strategy, regional
        development policy and the system for planning, programming, managing and financing regional
        development, and the coordination, programming and strategic monitoring of Cohesion policy
        and of the programmes financed from European Union funds in Croatia, including the number and
        scope of operational programmes and the Partnership Agreement. Only regional_development is
        tagged, and the taxonomy's own gloss for that id — "Regional development and cohesion funds"
        — covers both halves of the ministry's name, so european_affairs is not added: this is a
        managing authority for funds, not a department for relations with the European Union, which
        is the foreign ministry's. reconstruction is not tagged: post-earthquake reconstruction is the
        Ministry of Spatial Planning, Construction and State Property's.
      es: >-
        El artículo 14 atribuye a este ministerio la creación y gestión de todo el sistema de
        planificación estratégica y de gestión del desarrollo, la estrategia nacional de desarrollo, la
        política de desarrollo regional y el sistema de planificación, programación, gestión y
        financiación del desarrollo regional, y la coordinación, programación y seguimiento estratégico
        de la política de cohesión y de los programas financiados con fondos de la Unión Europea en
        Croacia, incluidos el número y el alcance de los programas operativos y el Acuerdo de
        Asociación. Sólo se etiqueta regional_development, y la propia glosa de ese identificador en la
        taxonomía —«Desarrollo regional y fondos de cohesión»— cubre las dos mitades del nombre del
        ministerio, así que no se añade european_affairs: se trata de una autoridad de gestión de
        fondos y no de un departamento de relaciones con la Unión Europea, que corresponden al
        ministerio de exteriores. No se etiqueta reconstruction: la reconstrucción posterior a los
        terremotos corresponde al Ministerio de Ordenación del Territorio, Construcción y Patrimonio
        del Estado.

  - id: HR-2024-rad-mirovine-obitelj-i-socijalna-politika
    order: 13
    name_original: Ministarstvo rada, mirovinskoga sustava, obitelji i socijalne politike
    abbreviation_original: null
    name_en: Ministry of Labour, Pension System, Family and Social Policy
    name_es: Ministerio de Trabajo, Sistema de Pensiones, Familia y Política Social
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar rada, mirovinskoga sustava, obitelji i socijalne politike
    head_title_en: Minister of Labour, Pension System, Family, and Social Policy
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [labour, social_security, social_affairs, family, disability, elderly]
    counts_as_ministry: true
    url: https://mrosp.gov.hr
    sources: [nn-57-2024-982, nn-85-2020-1593, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Croatia's whole welfare state in one department, and the second-widest remit in this
        cabinet. Article 15 gives it employment policy and the regulation of labour relations, the
        labour market and active labour-market policy, retraining and employability programmes, the
        pension insurance system, unemployment records and employment assistance, social
        partnership and relations with trade unions and employers' associations, the employment
        status of Croatian nationals abroad and of foreign nationals in Croatia, and occupational
        safety; the care of persons and families without sufficient means, the network of social
        care institutions and inspection over them; and marriage and family relations, protection
        from domestic violence, parent-child relations, the protection of children without adequate
        parental care, responsible parenthood, maintenance obligations, and support programmes for
        families, children with developmental difficulties, older persons and socially vulnerable
        groups. disability and elderly are tagged for those last two, which the ministry's name does
        not disclose. family is tagged here and also on the Ministry of Demography and Migration.
        equality is not tagged: Croatia has no equality ministry and gender equality sits in a
        government office.
      es: >-
        Todo el estado del bienestar croata en un solo departamento, y la segunda cartera más amplia de
        este gabinete. El artículo 15 le atribuye la política de empleo y la regulación de las
        relaciones laborales, el mercado de trabajo y la política activa de empleo, los programas de
        recualificación y de empleabilidad, el sistema de seguro de pensiones, el registro del
        desempleo y la asistencia al empleo, el diálogo social y las relaciones con los sindicatos y
        las asociaciones empresariales, la situación laboral de los nacionales croatas en el exterior y
        de los extranjeros en Croacia, y la seguridad en el trabajo; la atención a las personas y
        familias sin medios suficientes, la red de instituciones de servicios sociales y su inspección;
        y el matrimonio y las relaciones familiares, la protección frente a la violencia doméstica, las
        relaciones entre padres e hijos, la protección de los menores sin cuidado parental adecuado, la
        parentalidad responsable, las obligaciones de alimentos y los programas de apoyo a las familias,
        a los niños con dificultades en el desarrollo, a las personas mayores y a los grupos
        socialmente vulnerables. Se etiquetan disability y elderly por esos dos últimos, que el nombre
        del ministerio no revela. La familia se etiqueta aquí y también en el Ministerio de Demografía e
        Inmigración. No se etiqueta equality: Croacia no tiene ministerio de igualdad y la igualdad de
        género reside en una oficina del Gobierno.

  - id: HR-2024-poljoprivreda-sumarstvo-i-ribarstvo
    order: 14
    name_original: Ministarstvo poljoprivrede, šumarstva i ribarstva
    abbreviation_original: null
    name_en: Ministry of Agriculture, Forestry and Fisheries
    name_es: Ministerio de Agricultura, Silvicultura y Pesca
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar poljoprivrede, šumarstva i ribarstva
    head_title_en: Minister of Agriculture, Forestry, and Fisheries
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [agriculture, forestry, fisheries, rural_development, food_safety, animal_welfare]
    counts_as_ministry: true
    url: https://poljoprivreda.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Renamed in May 2024 from Ministarstvo poljoprivrede to spell out the forestry and fisheries
        it already held. Article 16 gives it agriculture, fisheries, forestry, rural development,
        the management and disposal of state-owned agricultural land, agricultural policy, the
        organisation of agricultural markets, market and structural support, the food and tobacco
        industries and veterinary affairs; plant production and agroecology, plant health, plant
        protection products and pesticide residues, and the production and marketing of grapes and
        wine; the management of the biological wealth of the sea and fresh waters, fishing effort,
        aquaculture and the fisheries information system; forestry, wood processing and furniture
        production, hunting, forest protection and forest genetic resources; and the safety,
        hygiene, quality and labelling of food and animal feed, food waste prevention and official
        controls. food_safety is tagged for that last group, which Croatia divides with the health
        ministry and the State Inspectorate. animal_welfare is tagged because the article gives the
        ministry the protection of animals alongside animal-disease control and veterinary public
        health. water is not tagged: water management is the environment ministry's, and this
        ministry's water competence is confined to irrigation and drainage on agricultural land.
      es: >-
        Renombrado en mayo de 2024 desde Ministarstvo poljoprivrede para explicitar la silvicultura y
        la pesca que ya tenía. El artículo 16 le atribuye la agricultura, la pesca, la silvicultura, el
        desarrollo rural, la gestión y disposición de las tierras agrícolas de titularidad estatal, la
        política agraria, la organización de los mercados agrarios, las ayudas de mercado y
        estructurales, las industrias alimentaria y del tabaco y los asuntos veterinarios; la producción
        vegetal y la agroecología, la sanidad vegetal, los productos fitosanitarios y los residuos de
        plaguicidas, y la producción y comercialización de uva y vino; la gestión de la riqueza
        biológica del mar y de las aguas dulces, el esfuerzo pesquero, la acuicultura y el sistema de
        información de la pesca; la silvicultura, la transformación de la madera y la producción de
        muebles, la caza, la protección de los bosques y los recursos genéticos forestales; y la
        seguridad, la higiene, la calidad y el etiquetado de los alimentos y de los piensos, la
        prevención del desperdicio alimentario y los controles oficiales. Se etiqueta food_safety por
        este último grupo, que Croacia reparte con el ministerio de sanidad y el Inspectorado del
        Estado. Se etiqueta animal_welfare porque el artículo le atribuye la protección de los animales
        junto con el control de las enfermedades animales y la salud pública veterinaria. No se etiqueta
        el agua: la gestión de las aguas corresponde al ministerio de medio ambiente, y la competencia
        hídrica de este ministerio se limita al riego y al drenaje de las tierras agrícolas.

  - id: HR-2024-more-promet-i-infrastruktura
    order: 15
    name_original: Ministarstvo mora, prometa i infrastrukture
    abbreviation_original: null
    name_en: Ministry of the Sea, Transport and Infrastructure
    name_es: Ministerio del Mar, Transporte e Infraestructuras
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar mora, prometa i infrastrukture
    head_title_en: Minister of the Sea, Transport and Infrastructure
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [shipping, transport, infrastructure, telecommunications]
    counts_as_ministry: true
    url: https://mmpi.gov.hr
    sources: [nn-57-2024-982, nn-85-2020-1593, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Article 17 gives this ministry domestic and international maritime, nautical, road, rail,
        combined and air transport, cable cars and inland-waterway transport together with the
        infrastructure of each, the planning and delivery of transport-infrastructure projects and
        the transport development strategy, the protection of the sea from ship-source pollution,
        sea ports, the maritime domain and the delimitation of its boundaries, maritime insurance
        and shipping agencies, inland ports, freight-transport centres and airports. shipping is
        tagged first because "mora" comes first in the ministry's name and Croatia's maritime remit
        is genuinely the leading one. telecommunications is the tag most likely to be looked for on
        another ministry: the same article gives this department electronic communications, the
        information society except where another body is competent, postal services, radio equipment
        and electromagnetic compatibility, and it has held them since 2020 — the ministry with
        "digital transformation" in its name holds the digitalisation of the administration, not the
        communications sector.
      es: >-
        El artículo 17 atribuye a este ministerio el transporte marítimo, náutico, por carretera,
        ferroviario, combinado y aéreo, nacional e internacional, los teleféricos y el transporte por
        vías navegables interiores junto con la infraestructura de cada uno, la planificación y
        ejecución de los proyectos de infraestructura de transporte y la estrategia de desarrollo del
        transporte, la protección del mar frente a la contaminación procedente de buques, los puertos
        marítimos, el dominio público marítimo y la delimitación de sus límites, el seguro marítimo y
        las agencias marítimas, los puertos interiores, los centros de transporte de mercancías y los
        aeropuertos. Se etiqueta shipping en primer lugar porque «mora» encabeza el nombre del
        ministerio y la competencia marítima croata es realmente la principal. Las telecomunicaciones
        son la etiqueta que más probablemente se buscaría en otro ministerio: el mismo artículo
        atribuye a este departamento las comunicaciones electrónicas, la sociedad de la información
        salvo cuando otro órgano sea competente, los servicios postales, los equipos radioeléctricos y
        la compatibilidad electromagnética, y las tiene desde 2020 —el ministerio que lleva
        «transformación digital» en el nombre tiene la digitalización de la administración, no el
        sector de las comunicaciones—.

  - id: HR-2024-prostorno-uredenje-graditeljstvo-i-drzavna-imovina
    order: 16
    name_original: Ministarstvo prostornoga uređenja, graditeljstva i državne imovine
    abbreviation_original: null
    name_en: Ministry of Spatial Planning, Construction and State Property
    name_es: Ministerio de Ordenación del Territorio, Construcción y Patrimonio del Estado
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar prostornoga uređenja, graditeljstva i državne imovine
    head_title_en: Minister of Spatial Planning, Construction, and State Property
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [spatial_planning, housing, state_assets, infrastructure]
    counts_as_ministry: true
    url: https://mpgi.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Article 18 gives this ministry spatial planning, construction and housing, the coordination
        of spatial development, the use and protection of space, the spatial planning information
        system, the monitoring of the state of the territory and the implementation of the spatial
        plans of the Republic, location permits, the Spatial Development Strategy, the valuation of
        real estate, the conditions for the design and construction of buildings, energy efficiency
        in buildings, building and occupancy permits, the use, maintenance and removal of buildings,
        and the professional chambers of architects and engineers. housing is tagged because
        "stanovanje" is named in the first paragraph of the article; state_assets because state
        property is in the ministry's name and article 8 refers to it as "ministarstvo nadležno za
        upravljanje državnom imovinom", the ministry competent for the management of state property,
        with which every other ministry must cooperate over shares in state-owned companies;
        infrastructure because the ministry is the construction authority for public building works.
        This is also the department that carries Croatia's post-earthquake reconstruction programme,
        and a curator who wanted a reconstruction tag would put it here rather than on the regional
        development ministry.
      es: >-
        El artículo 18 atribuye a este ministerio la ordenación del territorio, la construcción y la
        vivienda, la coordinación del desarrollo territorial, el uso y la protección del espacio, el
        sistema de información de la ordenación del territorio, el seguimiento del estado del
        territorio y la ejecución de los planes territoriales de la República, las licencias de
        emplazamiento, la Estrategia de Desarrollo Territorial, la valoración de inmuebles, las
        condiciones para el diseño y la construcción de edificios, la eficiencia energética en la
        edificación, las licencias de obra y de primera ocupación, el uso, la conservación y la
        demolición de edificios, y los colegios profesionales de arquitectos e ingenieros. Se etiqueta
        housing porque «stanovanje» figura nombrado en el primer párrafo del artículo; state_assets
        porque el patrimonio del Estado está en el nombre del ministerio y el artículo 8 se refiere a
        él como «ministarstvo nadležno za upravljanje državnom imovinom», el ministerio competente para
        la gestión del patrimonio del Estado, con el que todos los demás ministerios deben cooperar en
        lo relativo a las acciones de las sociedades de titularidad estatal; infrastructure porque el
        ministerio es la autoridad constructiva de la obra pública edificatoria. Es también el
        departamento que lleva el programa croata de reconstrucción posterior a los terremotos, y un
        curador que quisiera una etiqueta de reconstrucción la pondría aquí y no en el ministerio de
        desarrollo regional.

  - id: HR-2024-hrvatski-branitelji
    order: 17
    name_original: Ministarstvo hrvatskih branitelja
    abbreviation_original: null
    name_en: Ministry of Croatian Veterans
    name_es: Ministerio de Veteranos Croatas
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar hrvatskih branitelja
    head_title_en: Minister of Croatian Veterans
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [veterans]
    counts_as_ministry: true
    url: https://branitelji.gov.hr
    sources: [nn-57-2024-982, nn-85-2020-1593, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        A dedicated veterans ministry, which few countries in this dataset have and which follows
        from the Homeland War of 1991-1995. Article 19 gives it the legal position and status of
        Croatian defenders of the Homeland War, war invalids and the families of the fallen and
        missing, the protection of civilian victims of that war, of participants in the Second World
        War and of military and civilian invalids of it, and the search for the detained and
        missing, the organisation of exhumations of mass and individual graves on Croatian
        territory, and the identification of the remains of victims. Only veterans is tagged. The
        exhumation and identification work is the reason a reader might expect a historical-memory
        tag; it is not added, because the taxonomy's historical_memory id covers democratic-memory
        policy of the Spanish or Central European kind rather than the forensic identification of
        war dead, and adding it would make the comparison view treat two different things as one.
      es: >-
        Un ministerio de veteranos propio, que pocos países de este conjunto de datos tienen y que se
        explica por la Guerra de la Patria de 1991-1995. El artículo 19 le atribuye la situación y el
        estatuto jurídico de los defensores croatas de la Guerra de la Patria, de los inválidos de
        guerra y de las familias de los caídos y desaparecidos, la protección de las víctimas civiles
        de esa guerra, de los participantes en la Segunda Guerra Mundial y de los inválidos militares y
        civiles de ésta, y la búsqueda de detenidos y desaparecidos, la organización de exhumaciones de
        fosas comunes e individuales en territorio croata y la identificación de los restos de las
        víctimas. Sólo se etiqueta veterans. El trabajo de exhumación e identificación es la razón por
        la que un lector podría esperar una etiqueta de memoria histórica; no se añade, porque el
        identificador historical_memory de la taxonomía cubre políticas de memoria democrática del tipo
        español o centroeuropeo y no la identificación forense de los muertos de guerra, y añadirlo
        haría que la vista comparativa tratara como una misma cosa dos cosas distintas.

  - id: HR-2024-zdravstvo
    order: 18
    name_original: Ministarstvo zdravstva
    abbreviation_original: null
    name_en: Ministry of Health
    name_es: Ministerio de Sanidad
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministar zdravstva
    head_title_en: Minister of Health
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [health]
    counts_as_ministry: true
    url: https://zdravlje.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Article 20 gives this ministry the health care and health insurance systems, the monitoring
        and improvement of the population's health, protection against communicable and
        non-communicable diseases and non-ionising radiation, noise protection, food hygiene and
        safety under the food legislation, articles of general use, the restriction of tobacco use,
        chemicals, biocidal products, drinking water, genetically modified organisms, the production
        and traffic in narcotic drugs and psychotropic substances, and the approval of clinical
        trials of medicines and medical devices. Only health is tagged: social security and social
        care are the Ministry of Labour's, and food safety is tagged on the agriculture ministry,
        which holds the general food-safety system, with this ministry's food competence confined to
        hygiene and health suitability. Croatia's health insurance fund, the Hrvatski zavod za
        zdravstveno osiguranje, is a public body outside this file's perimeter.
      es: >-
        El artículo 20 atribuye a este ministerio los sistemas de asistencia sanitaria y de seguro de
        enfermedad, el seguimiento y la mejora del estado de salud de la población, la protección
        frente a las enfermedades transmisibles y no transmisibles y frente a las radiaciones no
        ionizantes, la protección contra el ruido, la higiene y la seguridad alimentaria conforme a la
        legislación alimentaria, los artículos de uso general, la limitación del consumo de tabaco, los
        productos químicos, los biocidas, el agua de consumo humano, los organismos modificados
        genéticamente, la producción y el tráfico de drogas y sustancias psicotrópicas y la
        autorización de los ensayos clínicos de medicamentos y productos sanitarios. Sólo se etiqueta
        health: la seguridad social y los servicios sociales corresponden al Ministerio de Trabajo, y
        food_safety se etiqueta en el ministerio de agricultura, que tiene el sistema general de
        seguridad alimentaria, mientras que la competencia alimentaria de este ministerio se limita a
        la higiene y la aptitud sanitaria. El fondo croata de seguro de enfermedad, el Hrvatski zavod
        za zdravstveno osiguranje, es un organismo público fuera del perímetro de este fichero.

  # --- recorded, not counted: the Government's own organs ----------------------------------
  - id: HR-2024-predsjednik-vlade
    order: 19
    name_original: Predsjednik Vlade Republike Hrvatske
    abbreviation_original: null
    name_en: Prime Minister of the Republic of Croatia
    name_es: Presidente del Gobierno de la República de Croacia
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Predsjednik Vlade Republike Hrvatske
    head_title_en: Prime Minister of the Republic of Croatia
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://vlada.gov.hr/predsjednik-vlade-65/65
    sources: [zakon-hr-zakon-o-vladi, nn-60-2024-1006, vlada-clanovi-vlade, vlada-government-members-en]
    note:
      en: >-
        Not a ministry and not a department: article 3 of the enumerating Act does not list one, and
        article 10 of the Zakon o Vladi gives the Prime Minister the representation of the
        Government, the convening and chairing of its sessions, the direction of its work and the
        signature of its acts — no portfolio. It is recorded because article 2 of the same Act makes
        the Prime Minister a member of the Government and the Sabor's confidence decision names him
        first among nineteen, which is what makes the cabinet nineteen people against eighteen
        departments. The holder is Andrej Plenković, appointed by the President of the Republic with
        effect from 17 May 2024; this is his third government and the sixteenth of the Republic. Do
        not confuse this entry with the Ured predsjednika Vlade below: this is the constitutional
        office of the head of government, that is the body that serves it, and each is excluded for a
        different reason. Croatia has no deputy-prime-minister entity either: all seven deputy prime
        ministers in this cabinet are serving ministers, and article 10(3) makes the deputy
        premiership a coordinating function rather than a department, so it adds neither a ministry
        nor a seat. The name_en is marked official because the government's own English edition uses
        exactly this form.
      es: >-
        No es un ministerio ni un departamento: el artículo 3 de la ley enumeradora no enumera
        ninguno, y el artículo 10 de la Zakon o Vladi atribuye al presidente del Gobierno la
        representación del Gobierno, la convocatoria y la presidencia de sus sesiones, la dirección de
        su trabajo y la firma de sus actos —ninguna cartera—. Se registra porque el artículo 2 de la
        misma ley hace del presidente un miembro del Gobierno y la decisión de confianza del Sabor lo
        nombra primero entre diecinueve, que es lo que hace que el gabinete sean diecinueve personas
        frente a dieciocho departamentos. El titular es Andrej Plenković, nombrado por el Presidente de
        la República con efecto desde el 17 de mayo de 2024; es su tercer gobierno y el decimosexto de
        la República. No confundir esta entrada con la Ured predsjednika Vlade de más abajo: ésta es la
        oficina constitucional del jefe de gobierno, aquélla el órgano que la sirve, y cada una se
        excluye por un motivo distinto. Croacia tampoco tiene una entidad de viceprimer ministro: los
        siete vicepresidentes de este gabinete son ministros en ejercicio, y el artículo 10(3) hace de
        la vicepresidencia una función de coordinación y no un departamento, de modo que no añade ni
        ministerio ni asiento. El name_en lleva la marca official porque la propia edición inglesa del
        gobierno usa exactamente esta forma.

  - id: HR-2024-ured-predsjednika-vlade
    order: 20
    name_original: Ured predsjednika Vlade Republike Hrvatske
    abbreviation_original: null
    name_en: The Prime Minister's Office
    name_es: Oficina del Presidente del Gobierno de la República de Croacia
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Predstojnik Ureda predsjednika Vlade
    head_title_en: The Head of the Prime Minister's Office
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://vlada.gov.hr/ured-predsjednika-vlade-45931/45931
    sources: [zakon-hr-zakon-o-vladi, vlada-ured-predsjednika-vlade-en]
    note:
      en: >-
        Recorded so that the perimeter is visible, and excluded on the narrowest available ground.
        Article 18 of the Zakon o Vladi constitutes it inside the Government — "U Vladi se ustrojava
        Ured predsjednika Vlade" — to do expert and administrative work for the Prime Minister on his
        instructions, and to coordinate the Government's expert offices and the Prime Minister's
        advisory boards. Its head is a predstojnik appointed by the Government on the Prime
        Minister's proposal who has the rank of a state secretary, not of a minister; he is therefore
        not a member of the Government, holds no cabinet seat, and the body is not a ministry, since
        article 3 of the enumerating Act does not list it and it is not a državna upravna
        organizacija under article 4 either. Two cautions. First, the government's English edition
        calls it "The Prime Minister's Office", which reads like the constitutional office of the head
        of government recorded separately above; the two are different things and are kept apart
        here. Second, this is where the Government's public-relations and public-policy services sit,
        so a reader looking for a Croatian government-communication department will find it here and
        not as a ministry.
      es: >-
        Se registra para que el perímetro sea visible, y se excluye por el motivo más estricto
        disponible. El artículo 18 de la Zakon o Vladi la constituye dentro del Gobierno —«U Vladi se
        ustrojava Ured predsjednika Vlade»— para realizar el trabajo técnico y administrativo del
        presidente del Gobierno según sus instrucciones y para coordinar las oficinas especializadas
        del Gobierno y los consejos asesores del presidente. Su titular es un predstojnik nombrado por
        el Gobierno a propuesta del presidente que tiene rango de secretario de Estado y no de
        ministro; no es por tanto miembro del Gobierno, no tiene asiento en el gabinete, y el órgano no
        es un ministerio, ya que el artículo 3 de la ley enumeradora no lo enumera y tampoco es una
        državna upravna organizacija del artículo 4. Dos advertencias. Primera: la edición inglesa del
        gobierno lo llama «The Prime Minister's Office», que se lee como la oficina constitucional del
        jefe de gobierno registrada por separado más arriba; son cosas distintas y aquí se mantienen
        separadas. Segunda: aquí residen los servicios de comunicación y de políticas públicas del
        Gobierno, de modo que quien busque un departamento croata de comunicación gubernamental lo
        encontrará aquí y no como ministerio.

  - id: HR-2024-glavno-tajnistvo-vlade
    order: 21
    name_original: Glavno tajništvo Vlade Republike Hrvatske
    abbreviation_original: null
    name_en: The Government General Secretariat
    name_es: Secretaría General del Gobierno de la República de Croacia
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Glavni tajnik Vlade
    head_title_en: Government Secretary General
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://vlada.gov.hr/glavno-tajnistvo-vlade-45904/45904
    sources: [zakon-hr-zakon-o-vladi, vlada-glavno-tajnistvo-en]
    note:
      en: >-
        The administrative apparatus of the Government, and a service rather than a department.
        Article 20 of the Zakon o Vladi constitutes it inside the Government — "U Vladi se ustrojava
        Glavno tajništvo" — to do expert, analytical, administrative-legal, general, technical and IT
        work for the Government and for the deputy prime ministers and members of the Government, and
        general and technical work for the Prime Minister's Office. It prepares and holds the
        Government's sessions, dispatches the acts the Government adopts, sees to their publication
        and keeps the minutes. Its head, the glavni tajnik, is appointed by the Government on the
        Prime Minister's proposal and has the rank of a state secretary, not of a minister, so the
        body is excluded as not_headed_by_minister and carries no seat: counting it would give
        nineteen ministries and giving its secretary-general a seat would give twenty seats, and
        neither is done here. Compare Finland, where the equivalent body appears in the statutory list
        of ministries and is counted, and Slovenia and Lithuania, where it is excluded on exactly this
        ground.
      es: >-
        El aparato administrativo del Gobierno, y un servicio y no un departamento. El artículo 20 de
        la Zakon o Vladi lo constituye dentro del Gobierno —«U Vladi se ustrojava Glavno tajništvo»—
        para realizar el trabajo técnico, analítico, administrativo-jurídico, general, técnico e
        informático del Gobierno y de los vicepresidentes y miembros del Gobierno, y el trabajo general
        y técnico de la Oficina del Presidente del Gobierno. Prepara y celebra las sesiones del
        Gobierno, expide los actos que el Gobierno adopta, vela por su publicación y levanta las actas.
        Su titular, el glavni tajnik, es nombrado por el Gobierno a propuesta del presidente y tiene
        rango de secretario de Estado y no de ministro, de modo que el órgano se excluye por
        not_headed_by_minister y no lleva asiento: contarlo daría diecinueve ministerios y dar asiento
        a su secretario general daría veinte asientos, y aquí no se hace ni lo uno ni lo otro.
        Compárese con Finlandia, donde el órgano equivalente figura en la lista legal de ministerios y
        sí se cuenta, y con Eslovenia y Lituania, donde se excluye exactamente por este motivo.

  # --- recorded, not counted: the nine državne upravne organizacije of article 4 ------------
  - id: HR-2024-sdu-sredisnja-javna-nabava
    order: 22
    name_original: Središnji državni ured za središnju javnu nabavu
    abbreviation_original: null
    name_en: Central State Office for Central Public Procurement
    name_es: Oficina Central del Estado para la Contratación Pública Centralizada
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Državni tajnik središnjeg državnog ureda
    head_title_en: State Secretary of the Central State Office
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://sredisnjanabava.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, zakon-hr-zsdu]
    note:
      en: >-
        First of the nine bodies in article 4 of the enumerating Act, and the reason that article is
        quoted in full above. Article 23 gives it central public procurement for the state
        administration, the Government, the offices and expert services of the Government, the
        Hrvatski sabor and the Office of the President of the Republic. It is a state administration
        body of the same statutory family as the ministries and is listed in the same Act, but under
        article 59 of the Zakon o sustavu državne uprave a central state office is headed by a
        "državni tajnik središnjeg državnog ureda" — a state secretary, not a minister — who answers
        to the Government without being a member of it, so it is not counted and holds no cabinet
        seat.
      es: >-
        La primera de las nueve entidades del artículo 4 de la ley enumeradora, y la razón por la que
        ese artículo se cita íntegro más arriba. El artículo 23 le atribuye la contratación pública
        centralizada para la administración del Estado, el Gobierno, las oficinas y servicios
        especializados del Gobierno, el Hrvatski sabor y la Oficina del Presidente de la República. Es
        un órgano de la administración del Estado de la misma familia legal que los ministerios y
        figura en la misma ley, pero según el artículo 59 de la Zakon o sustavu državne uprave una
        oficina central del Estado está dirigida por un «državni tajnik središnjeg državnog ureda» —un
        secretario de Estado y no un ministro— que responde ante el Gobierno sin ser miembro de él, de
        modo que no se cuenta y no lleva asiento en el gabinete.

  - id: HR-2024-sdu-hrvati-izvan-rh
    order: 23
    name_original: Središnji državni ured za Hrvate izvan Republike Hrvatske
    abbreviation_original: null
    name_en: Central State Office for Croats Abroad
    name_es: Oficina Central del Estado para los Croatas fuera de la República de Croacia
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Državni tajnik središnjeg državnog ureda
    head_title_en: State Secretary of the Central State Office
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://hrvatiizvanrh.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, zakon-hr-zsdu]
    note:
      en: >-
        The most consequential of the nine exclusions, and the one a reader is most likely to
        challenge. Article 25 gives this office relations between the Republic of Croatia and Croats
        outside it, the coordination and supervision of the activity of the state administration and
        of other bodies in that cooperation, the protection of the rights and interests and the
        preservation of the identity of Croats abroad, the registers of Croats abroad and the funding
        of programmes for them. In Slovenia the equivalent function is held by a minister without
        portfolio and therefore carries a cabinet seat; in Croatia it is a central state office headed
        by a state secretary under article 59 of the Zakon o sustavu državne uprave, so it carries
        neither a ministry nor a seat. That is why diaspora is tagged on no counted Croatian ministry
        except in the narrow return-migration sense given to the Ministry of Demography and
        Migration: Croatia's diaspora department exists, is named in the same Act as its ministries,
        and is still not a ministry. The 2024 amending Act required the Government to re-issue this
        office's internal-organisation decree, so its remit was revisited at the same time as the
        ministries were.
      es: >-
        La más consecuente de las nueve exclusiones, y la que un lector cuestionará con mayor
        probabilidad. El artículo 25 atribuye a esta oficina las relaciones entre la República de
        Croacia y los croatas fuera de ella, la coordinación y supervisión de la actividad de la
        administración del Estado y de otros órganos en esa cooperación, la protección de los derechos
        e intereses y la preservación de la identidad de los croatas en el exterior, los registros de
        croatas en el exterior y la financiación de programas para ellos. En Eslovenia la función
        equivalente la ejerce una ministra sin cartera y por tanto lleva asiento en el gabinete; en
        Croacia es una oficina central del Estado dirigida por un secretario de Estado conforme al
        artículo 59 de la Zakon o sustavu državne uprave, de modo que no lleva ni ministerio ni
        asiento. Por eso diaspora no se etiqueta en ningún ministerio croata contado salvo en el
        sentido estricto de migración de retorno atribuido al Ministerio de Demografía e Inmigración:
        el departamento croata de diáspora existe, está nombrado en la misma ley que sus ministerios y
        sigue sin ser un ministerio. La ley de modificación de 2024 obligó al Gobierno a volver a
        dictar el decreto de organización interna de esta oficina, así que su ámbito se revisó al mismo
        tiempo que el de los ministerios.

  - id: HR-2024-hrvatska-vatrogasna-zajednica
    order: 24
    name_original: Hrvatska vatrogasna zajednica
    abbreviation_original: HVZ
    name_en: Croatian Firefighting Association
    name_es: Asociación Croata de Bomberos
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Glavni vatrogasni zapovjednik
    head_title_en: Chief Fire Commander
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://hvz.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, zakon-hr-zsdu]
    note:
      en: >-
        The oddest name in article 4: a body called an "association" that is in law a state
        administration body, listed in the same statute as Croatia's ministries. Article 26 gives it
        firefighting, the training of members of fire brigades, technical assistance in accidents and
        dangerous situations and inspection in the field of firefighting. Article 58(3) of the Zakon o
        sustavu državne uprave permits state administrative organisations with special names,
        organisation and manner of work, which is what this is; its head is the glavni vatrogasni
        zapovjednik, who answers to the Government and is not a minister, so it is not counted and
        holds no seat. Fire protection as a regulatory matter, together with civil protection and
        rescue, remains with the Ministry of the Interior under article 6, which is where the
        civil_protection tag sits. The abbreviation HVZ is the body's own and is used in the gazette
        and on its website; it is the only abbreviation recorded anywhere in this file.
      es: >-
        El nombre más extraño del artículo 4: un órgano llamado «asociación» que en derecho es un
        órgano de la administración del Estado, enumerado en la misma ley que los ministerios croatas.
        El artículo 26 le atribuye el servicio de bomberos, la formación de los miembros de las
        dotaciones, la asistencia técnica en accidentes y situaciones peligrosas y la inspección en el
        ámbito de la extinción de incendios. El artículo 58(3) de la Zakon o sustavu državne uprave
        permite organizaciones administrativas del Estado con nombre, organización y forma de trabajo
        especiales, que es lo que ésta es; su titular es el glavni vatrogasni zapovjednik, que responde
        ante el Gobierno y no es ministro, de modo que no se cuenta y no lleva asiento. La protección
        contra incendios como materia regulatoria, junto con la protección civil y el rescate, sigue
        correspondiendo al Ministerio del Interior conforme al artículo 6, y ahí se sitúa la etiqueta
        civil_protection. La sigla HVZ es del propio órgano y se usa en el boletín oficial y en su
        sitio web; es la única abreviatura registrada en todo este fichero.

  - id: HR-2024-drzavni-inspektorat
    order: 25
    name_original: Državni inspektorat
    abbreviation_original: null
    name_en: State Inspectorate
    name_es: Inspectorado del Estado
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Glavni državni inspektor
    head_title_en: Chief State Inspector
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://dirh.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, zakon-hr-zsdu]
    note:
      en: >-
        Croatia's consolidated inspection body, and a large one: article 27 gives it inspection in
        trade, services, unregistered activity, the safety of non-food products, consumer protection,
        articles of general use, biocidal products, noise and non-ionising radiation, tobacco
        products, hazardous chemicals, food including genetically modified and novel food,
        genetically modified organisms, the prevention of communicable diseases, veterinary affairs
        and food safety, and agriculture. It therefore enforces rules made by at least four counted
        ministries. Under articles 58(3) and 59 of the Zakon o sustavu državne uprave a state
        inspectorate is headed by a glavni državni inspektor who answers to the Government and is not
        a minister, so it is not counted and holds no seat. It is recorded rather than omitted
        because a reader looking for where Croatian consumer and food enforcement sits would
        otherwise find no answer in this file.
      es: >-
        El órgano de inspección consolidado de Croacia, y de gran tamaño: el artículo 27 le atribuye la
        inspección en el comercio, los servicios, la actividad no registrada, la seguridad de los
        productos no alimentarios, la protección de los consumidores, los artículos de uso general, los
        biocidas, el ruido y las radiaciones no ionizantes, los productos del tabaco, los productos
        químicos peligrosos, los alimentos incluidos los modificados genéticamente y los nuevos
        alimentos, los organismos modificados genéticamente, la prevención de las enfermedades
        transmisibles, los asuntos veterinarios y la seguridad alimentaria, y la agricultura. Aplica por
        tanto normas dictadas por al menos cuatro ministerios contados. Conforme a los artículos 58(3) y
        59 de la Zakon o sustavu državne uprave, un inspectorado del Estado está dirigido por un glavni
        državni inspektor que responde ante el Gobierno y no es ministro, de modo que no se cuenta y no
        lleva asiento. Se registra en lugar de omitirse porque, de lo contrario, quien buscara dónde
        reside la vigilancia croata del consumo y de los alimentos no encontraría respuesta en este
        fichero.

  - id: HR-2024-drzavna-geodetska-uprava
    order: 26
    name_original: Državna geodetska uprava
    abbreviation_original: null
    name_en: State Geodetic Administration
    name_es: Administración Geodésica del Estado
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Glavni ravnatelj
    head_title_en: Director-General
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://dgu.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, zakon-hr-zsdu]
    note:
      en: >-
        Article 28 gives it geodetic and cadastral work, in particular the production, renewal and
        maintenance of the survey and the real-estate cadastre, the informatisation of the cadastre
        and of the geospatial system, topographic and hydrographic cartography, the cadastral work
        for the state border, and the application of survey technology. It is a "državna uprava"
        within the meaning of article 58(2) of the Zakon o sustavu državne uprave and is therefore
        headed by a glavni ravnatelj answerable to the Government, not by a minister, so it is not
        counted and holds no seat. Land registration proper is a judicial function of the courts and
        the justice ministry; this body holds the cadastre, and the two are separate in Croatian law.
      es: >-
        El artículo 28 le atribuye los trabajos geodésicos y catastrales, en particular la producción,
        renovación y mantenimiento de la medición y del catastro inmobiliario, la informatización del
        catastro y del sistema geoespacial, la cartografía topográfica e hidrográfica, los trabajos
        catastrales de la frontera del Estado y la aplicación de la tecnología de medición. Es una
        «državna uprava» en el sentido del artículo 58(2) de la Zakon o sustavu državne uprave y está
        por tanto dirigida por un glavni ravnatelj que responde ante el Gobierno y no por un ministro,
        de modo que no se cuenta y no lleva asiento. El registro de la propiedad propiamente dicho es
        una función judicial de los tribunales y del ministerio de justicia; este órgano tiene el
        catastro, y ambas cosas están separadas en el derecho croata.

  - id: HR-2024-drzavni-hidrometeoroloski-zavod
    order: 27
    name_original: Državni hidrometeorološki zavod
    abbreviation_original: null
    name_en: Meteorological and Hydrological Service
    name_es: Servicio Meteorológico e Hidrológico del Estado
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Glavni ravnatelj
    head_title_en: Director-General
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://meteo.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, zakon-hr-zsdu]
    note:
      en: >-
        Article 29 gives it the monitoring of hydrological and meteorological processes, the
        collection, processing and publication of hydrometeorological data, research on the
        atmosphere and water resources, and applied meteorology and hydrology in climatology, marine
        meteorology, agrometeorology, weather modification, aeronautical meteorology and spatial
        planning. It is a "državni zavod" under article 58(2) of the Zakon o sustavu državne uprave,
        headed by a glavni ravnatelj and not by a minister, so it is not counted and holds no seat. It
        is the Croatian counterpart of bodies that in some countries in this dataset sit inside an
        environment or transport ministry; here it is a separate state administration body listed
        beside the ministries.
      es: >-
        El artículo 29 le atribuye el seguimiento de los procesos hidrológicos y meteorológicos, la
        recogida, tratamiento y publicación de los datos hidrometeorológicos, la investigación de la
        atmósfera y de los recursos hídricos, y la meteorología e hidrología aplicadas a la
        climatología, la meteorología marina, la agrometeorología, la modificación artificial del
        tiempo, la meteorología aeronáutica y la ordenación del territorio. Es un «državni zavod» del
        artículo 58(2) de la Zakon o sustavu državne uprave, dirigido por un glavni ravnatelj y no por
        un ministro, de modo que no se cuenta y no lleva asiento. Es el equivalente croata de órganos
        que en algunos países de este conjunto de datos se sitúan dentro de un ministerio de medio
        ambiente o de transporte; aquí es un órgano separado de la administración del Estado enumerado
        junto a los ministerios.

  - id: HR-2024-drzavni-zavod-za-intelektualno-vlasnistvo
    order: 28
    name_original: Državni zavod za intelektualno vlasništvo
    abbreviation_original: null
    name_en: State Intellectual Property Office
    name_es: Oficina Estatal de Propiedad Intelectual
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Glavni ravnatelj
    head_title_en: Director-General
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://dziv.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, zakon-hr-zsdu]
    note:
      en: >-
        Article 30 gives it the proposal of public policy on the intellectual property system, the
        preparation of intellectual property legislation, the grant of industrial property rights —
        patents, trade marks, industrial designs, semiconductor topographies and geographical
        indications not governed by special statutes — supplementary protection certificates for
        medicines and plant protection products, participation in international registration
        procedures, and Croatia's representation before the World Intellectual Property Organization,
        the European Patent Organisation and the European Union Intellectual Property Office. Headed
        by a glavni ravnatelj under article 59 of the Zakon o sustavu državne uprave and not by a
        minister, so it is not counted and holds no seat. Intellectual property policy proper is
        divided between this office, the Ministry of Science, Education and Youth for technology
        transfer, the Ministry of Culture and Media for copyright, and the Ministry of Finance for
        border enforcement.
      es: >-
        El artículo 30 le atribuye la propuesta de políticas públicas sobre el sistema de propiedad
        intelectual, la preparación de la legislación en la materia, la concesión de derechos de
        propiedad industrial —patentes, marcas, diseños industriales, topografías de productos
        semiconductores e indicaciones geográficas no reguladas por leyes especiales—, los certificados
        complementarios de protección para medicamentos y productos fitosanitarios, la participación en
        los procedimientos internacionales de registro y la representación de Croacia ante la
        Organización Mundial de la Propiedad Intelectual, la Organización Europea de Patentes y la
        Oficina de Propiedad Intelectual de la Unión Europea. Dirigida por un glavni ravnatelj conforme
        al artículo 59 de la Zakon o sustavu državne uprave y no por un ministro, de modo que no se
        cuenta y no lleva asiento. La política de propiedad intelectual propiamente dicha se reparte
        entre esta oficina, el Ministerio de Ciencia, Educación y Juventud para la transferencia de
        tecnología, el Ministerio de Cultura y Medios para el derecho de autor y el Ministerio de
        Finanzas para la vigilancia en frontera.

  - id: HR-2024-drzavni-zavod-za-mjeriteljstvo
    order: 29
    name_original: Državni zavod za mjeriteljstvo
    abbreviation_original: null
    name_en: State Office for Metrology
    name_es: Oficina Estatal de Metrología
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Glavni ravnatelj
    head_title_en: Director-General
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://dzm.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, zakon-hr-zsdu]
    note:
      en: >-
        Article 31 gives it the preparation of metrology legislation and decisions in metrological
        administrative matters, the authorisation of bodies to verify legal measuring instruments,
        the technical and metrological requirements for conformity assessment in legal metrology, the
        testing of prepackages and of bottles used as measuring containers, official measurements,
        the supervision of authorised bodies, the supervision of articles of precious metals, the
        type-approval of road vehicles and agricultural and forestry tractors, and the national
        measurement standards and calibration laboratories. Headed by a glavni ravnatelj and not by a
        minister, so it is not counted and holds no seat. Vehicle type-approval sitting here rather
        than with the transport ministry is the kind of Croatian particularity this list makes
        visible.
      es: >-
        El artículo 31 le atribuye la preparación de la legislación metrológica y la resolución de los
        asuntos administrativos en materia de metrología, la habilitación de organismos para verificar
        los instrumentos de medida reglamentados, los requisitos técnicos y metrológicos de la
        evaluación de la conformidad en metrología legal, el ensayo de los preenvasados y de las
        botellas empleadas como recipientes de medida, las mediciones oficiales, la supervisión de los
        organismos habilitados, el control de los artículos de metales preciosos, la homologación de
        vehículos de carretera y de tractores agrícolas y forestales, y los patrones nacionales de
        medida y los laboratorios de calibración. Dirigida por un glavni ravnatelj y no por un
        ministro, de modo que no se cuenta y no lleva asiento. Que la homologación de vehículos resida
        aquí y no en el ministerio de transporte es la clase de particularidad croata que esta lista
        hace visible.

  - id: HR-2024-drzavni-zavod-za-statistiku
    order: 30
    name_original: Državni zavod za statistiku
    abbreviation_original: DZS
    name_en: Croatian Bureau of Statistics
    name_es: Oficina Estatal de Estadística
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Glavni ravnatelj
    head_title_en: Director-General
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://dzs.gov.hr
    sources: [nn-57-2024-982, zakon-hr-zudtdu-procisceni, zakon-hr-zsdu]
    note:
      en: >-
        Last of the nine, and the one this dataset relies on: the population figure on Croatia's
        country page comes from this body. Article 32 gives it the production and dissemination of
        official statistics and the development of the Croatian official statistics system in
        accordance with the fundamental principles of official statistics, the role of principal
        producer, disseminator and coordinator of that system, the strategic and programme documents
        of official statistics, compliance with the European Statistics Code of Practice, the
        professional independence of the system, statistical methods, classifications and standards,
        the statistical registers, and international statistical cooperation. It is a "državni zavod"
        headed by a glavni ravnatelj under article 59 of the Zakon o sustavu državne uprave and not by
        a minister, so it is not counted and holds no seat; its statutory professional independence
        would be a further reason not to count it even if its head held ministerial rank.
      es: >-
        La última de las nueve, y la que este conjunto de datos utiliza: la cifra de población de la
        ficha de país de Croacia viene de este órgano. El artículo 32 le atribuye la producción y
        difusión de las estadísticas oficiales y el desarrollo del sistema croata de estadística oficial
        conforme a los principios fundamentales de la estadística oficial, el papel de principal
        productor, difusor y coordinador de ese sistema, los documentos estratégicos y programáticos de
        la estadística oficial, el cumplimiento del Código de buenas prácticas de las estadísticas
        europeas, la independencia profesional del sistema, los métodos, clasificaciones y estándares
        estadísticos, los registros estadísticos y la cooperación estadística internacional. Es un
        «državni zavod» dirigido por un glavni ravnatelj conforme al artículo 59 de la Zakon o sustavu
        državne uprave y no por un ministro, de modo que no se cuenta y no lleva asiento; su
        independencia profesional legal sería una razón adicional para no contarlo incluso si su titular
        tuviera rango ministerial.
