        A post this government created, and the reason the cabinet has sixteen members and the
        government fourteen departments. § 1 of the kompetenční zákon was not amended to add a
        ministry for it, and the government's own press release on the day the cabinet took
        office says the holder "bude sídlit na Úřadu vlády" — which is precisely the situation
        § 28 odst. 3 of the same Act contemplates for "členů vlády, kteří nejsou pověřeni řízením
        ministerstva nebo jiného úřadu", and which článek 68 odst. 2 of the Constitution permits.
        He therefore holds ministerial rank and a cabinet seat without an administrative
        department, and is recorded here uncounted. No policy area is tagged: the areas his title
        names belong statutorily to the Ministerstvo školství, mládeže a tělovýchovy (§ 7 odst. 1,
        physical education), to the Ministerstvo zdravotnictví (§ 10, public-health protection) and
        to the Národní sportovní agentura, which is one of the central authorities of § 2 and not
        a ministry. Press coverage that calls this a "ministerstvo sportu" is describing a
        political arrangement, not a department created by law. The English title is the
        government's own, from the English edition of its list of members.
      es: >-
        Un puesto creado por este gobierno, y la razón de que el gabinete tenga dieciséis miembros
        y el gobierno catorce departamentos. El § 1 de la kompetenční zákon no se modificó para
        añadirle un ministerio, y la propia nota de prensa del gobierno del día en que el gabinete
        tomó posesión dice que su titular «bude sídlit na Úřadu vlády», que es exactamente la
        situación que contempla el § 28 apartado 3 de la misma ley para los «členů vlády, kteří
        nejsou pověřeni řízením ministerstva nebo jiného úřadu» y que permite el artículo 68
        apartado 2 de la Constitución. Tiene por tanto rango ministerial y asiento en el gabinete
        sin departamento administrativo, y aquí se registra sin contarse. No se etiqueta ninguna
        área de política: las que su título menciona pertenecen legalmente al Ministerstvo
        školství, mládeže a tělovýchovy (§ 7 apartado 1, educación física), al Ministerstvo
        zdravotnictví (§ 10, protección de la salud pública) y a la Národní sportovní agentura, que
        es uno de los órganos centrales del § 2 y no un ministerio. La cobertura de prensa que
        habla de un «ministerstvo sportu» describe un arreglo político, no un departamento creado
        por ley. El título en inglés es el del propio gobierno, de la edición inglesa de su lista
        de miembros.
