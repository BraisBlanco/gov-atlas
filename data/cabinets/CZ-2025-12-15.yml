entities:
  # --- the head of government: recorded, not counted ---------------------------------------
  - id: CZ-2025-predseda-vlady
    order: 1
    name_original: Předseda vlády
    abbreviation_original: null
    name_en: Prime Minister
    name_es: Primer Ministro
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Předseda vlády
    head_title_en: Prime Minister
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    valid_from: null
    valid_to: null
    url: https://vlada.gov.cz/cz/vlada/premier/
    sources: [ustava-1-1993, sb-2-1969, vlada-clenove-vlady, vlada-uvedeni-do-funkci-2025-12-15]
    note:
      en: >-
        Czechia's Prime Minister heads no ministry. Article 67(2) of the Constitution makes the
        members of the government the předseda vlády, the místopředsedové vlády and the
        ministers, and § 1 of the kompetenční zákon lists no prime-ministerial department, so
        this entity is a seat without a portfolio and is excluded under
        head_of_government_office. It is recorded rather than omitted because that is what
        makes the cabinet come out at sixteen seats against fourteen ministries. The body that
        serves the government and the Prime Minister is the Úřad vlády České republiky, which
        § 2 lists as one of the central authorities that are not headed by a member of the
        government and § 28 odst. 5 puts under a vedoucí appointed by the government — a civil
        servant, not a minister, holding no seat — so it is not recorded as an entity of its
        own.
      es: >-
        El primer ministro checo no dirige ningún ministerio. El artículo 67.2 de la
        Constitución hace miembros del gobierno al předseda vlády, a los místopředsedové vlády
        y a los ministros, y el § 1 de la kompetenční zákon no enumera ningún departamento del
        primer ministro, de modo que esta entidad es un asiento sin cartera y se excluye por
        head_of_government_office. Se registra en lugar de omitirse porque es lo que hace que
        el gabinete dé dieciséis asientos frente a catorce ministerios. El órgano que sirve al
        gobierno y al primer ministro es el Úřad vlády České republiky, que el § 2 enumera
        entre los órganos centrales no encabezados por un miembro del gobierno y que el § 28
        apartado 5 pone bajo un vedoucí nombrado por el gobierno —un funcionario, no un
        ministro, sin asiento—, por lo que no se registra como entidad propia.

  # --- the fourteen ministries, in the statutory order of § 1 of zákon č. 2/1969 Sb. --------
  - id: CZ-2025-ministerstvo-financi
    order: 2
    name_original: Ministerstvo financí
    abbreviation_original: null
    name_en: Ministry of Finance
    name_es: Ministerio de Finanzas
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně financí
    head_title_en: Minister of Finance
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [finance, budget, state_assets]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://mf.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        § 4 gives it the state budget and final account, the state treasury, fiscal policy and
        forecasting, the financial market and payment services, taxes, fees and customs,
        financial management and control, accounting, audit and tax advice, foreign-exchange
        matters, gambling, the management and privatisation of state property, prices, and
        anti-money-laundering and the domestic coordination of international sanctions. It is
        also the ministry responsible for adopting the euro. state_assets is tagged for
        "hospodaření s majetkem státu" and "privatizaci majetku státu"; consumer protection on
        the financial market is a fragment of a portfolio held mainly by the industry ministry
        and is not tagged here. Banking supervision belongs to the Česká národní banka, which
        is outside the executive.
      es: >-
        El § 4 le atribuye el presupuesto del Estado y la cuenta general, la tesorería, la
        política fiscal y las previsiones, el mercado financiero y los servicios de pago, los
        impuestos, tasas y aduanas, la gestión y el control financieros, la contabilidad, la
        auditoría y el asesoramiento fiscal, las cuestiones de divisas, el juego, la gestión y
        privatización del patrimonio estatal, los precios y la lucha contra el blanqueo junto a
        la coordinación interna de las sanciones internacionales. Es además el ministerio
        responsable de la adopción del euro. Se etiqueta state_assets por «hospodaření s
        majetkem státu» y «privatizaci majetku státu»; la protección del consumidor en el
        mercado financiero es un fragmento de una cartera que tiene sobre todo el ministerio de
        industria y no se etiqueta aquí. La supervisión bancaria es de la Česká národní banka,
        ajena al ejecutivo.

  - id: CZ-2025-ministerstvo-zahranicnich-veci
    order: 3
    name_original: Ministerstvo zahraničních věcí
    abbreviation_original: null
    name_en: Ministry of Foreign Affairs
    name_es: Ministerio de Asuntos Exteriores
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně zahraničních věcí
    head_title_en: Minister of Foreign Affairs
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [foreign_affairs, development_cooperation, european_affairs]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://mzv.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        § 6 makes it the central authority for foreign policy, within which it designs and
        coordinates foreign development assistance — hence development_cooperation — and
        coordinates external economic relations; it maintains the Republic's relations with
        other states, international organisations and "integračním seskupením", runs the
        embassies, protects Czech citizens abroad and negotiates treaties. european_affairs is
        tagged on the strength of that phrase and because no other Czech entity could carry it:
        § 1 lists no ministry for European affairs and the government's own list of members
        contains no minister for them. Consular protection of
        citizens abroad is not tagged as diaspora, which in this taxonomy means a portfolio for
        citizens abroad as a constituency rather than consular work.
      es: >-
        El § 6 lo hace órgano central para la política exterior, en cuyo marco diseña y
        coordina la ayuda exterior al desarrollo —de ahí development_cooperation— y coordina
        las relaciones económicas exteriores; mantiene las relaciones de la República con otros
        Estados, organizaciones internacionales y «integračním seskupením», dirige las
        embajadas, protege a los ciudadanos checos en el extranjero y negocia los tratados. Se
        etiqueta european_affairs por esa expresión y porque ninguna otra entidad checa podría
        llevarla: el § 1 no enumera ningún ministerio de Asuntos Europeos y la propia lista de
        miembros del gobierno no incluye ningún ministro de esa materia. La protección consular de los
        ciudadanos en el exterior no se etiqueta como diaspora, que en esta taxonomía designa
        una cartera dirigida a los ciudadanos en el exterior como colectivo y no el trabajo
        consular.

