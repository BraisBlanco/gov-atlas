        pensiones y el seguro de enfermedad —de ahí social_security—, la asistencia social, el
        cuidado y las condiciones de trabajo de mujeres y jóvenes, la protección jurídica de la
        maternidad, la «péče o rodinu a dětí» y la «péče o občany, kteří potřebují zvláštní
        pomoc», y demás política salarial y social. Se etiqueta family por la cartera de familia
        e infancia y disability por la atención a los ciudadanos que necesitan ayuda especial,
        que es donde se sitúa la política checa de discapacidad; no existe ministerio de
        igualdad, y la igualdad de género se coordina desde el Úřad vlády y no desde un
        departamento.

  - id: CZ-2025-ministerstvo-zdravotnictvi
    order: 7
    name_original: Ministerstvo zdravotnictví
    abbreviation_original: null
    name_en: Ministry of Health
    name_es: Ministerio de Sanidad
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně zdravotnictví
    head_title_en: Minister of Health
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [health]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://mzd.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        § 10 gives it health services, public-health protection, health research, the providers
        it directly manages, the handling of addictive substances and their precursors, natural
        healing sources and spas, medicines and medical devices, health insurance, the health
        information system and e-health, and biocidal products. Tagged health only: nothing in
        the section is a primary portfolio in another area. The Inspektorát omamných a
        psychotropních látek and the Český inspektorát lázní a zřídel are organisational parts
        of the ministry, not separate bodies. Note that the ministr pro sport, prevenci a zdraví
        carries "zdraví" in his title but heads no department; prevention policy is exercised
        through this ministry and through advisory bodies at the Úřad vlády.
      es: >-
        El § 10 le atribuye los servicios sanitarios, la protección de la salud pública, la
        investigación sanitaria, los proveedores que gestiona directamente, el manejo de
        sustancias adictivas y sus precursores, las fuentes curativas naturales y los balnearios,
        los medicamentos y productos sanitarios, el seguro de enfermedad, el sistema de
        información sanitaria y la sanidad electrónica, y los biocidas. Se etiqueta sólo health:
        nada en el precepto constituye una cartera principal en otra área. El Inspektorát
        omamných a psychotropních látek y el Český inspektorát lázní a zřídel son partes
        organizativas del ministerio, no órganos separados. Nótese que el ministr pro sport,
        prevenci a zdraví lleva «zdraví» en su título pero no dirige ningún departamento; la
        política de prevención se ejerce a través de este ministerio y de órganos consultivos
        del Úřad vlády.

  - id: CZ-2025-ministerstvo-spravedlnosti
    order: 8
    name_original: Ministerstvo spravedlnosti
    abbreviation_original: null
    name_en: Ministry of Justice
    name_es: Ministerio de Justicia
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně spravedlnosti
    head_title_en: Minister of Justice
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [justice]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://msp.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        § 11 makes it the central authority for the courts and the public prosecution service,
        for the prison system (the Vězeňská služba is subordinate to it), for probation and
        mediation, for conflict of interest, for the protection of whistleblowers and for
        lobbying; it also represents the Republic before the European Court of Human Rights and
        compensates victims of crime. Tagged justice only. The courts and the prosecution
        service themselves are not part of the executive and are not recorded as entities: the
        ministry's remit is their administration, not their function.
      es: >-
        El § 11 lo hace órgano central para los tribunales y la fiscalía, para el sistema
        penitenciario (la Vězeňská služba le está subordinada), para la libertad vigilada y la
        mediación, para el conflicto de intereses, para la protección de los denunciantes y para
        el lobby; representa además a la República ante el Tribunal Europeo de Derechos Humanos
        e indemniza a las víctimas de delitos. Se etiqueta sólo justice. Los tribunales y la
        fiscalía no forman parte del ejecutivo y no se registran como entidades: la competencia
        del ministerio es su administración, no su función.

  - id: CZ-2025-ministerstvo-vnitra
    order: 9
    name_original: Ministerstvo vnitra
    abbreviation_original: null
    name_en: Ministry of Interior
    name_es: Ministerio del Interior
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně vnitra
    head_title_en: Minister of the Interior
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [interior, migration, civil_protection, public_administration, territorial_administration]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://mv.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        § 12 gives it public order and internal security including road-traffic safety, names
        and civil registers, citizenship, identity cards, residence registration and the
        population register, the right of assembly and political parties, public collections,
        archives and records management, weapons and ammunition, fire protection, travel
        documents and "povolování pobytu cizinců a postavení uprchlíků" — hence migration, there
        being no separate migration ministry — the territorial division of the state, the state
        borders, state symbols, all elections held on Czech territory, and crisis management,
        civil emergency planning, protection of the population and the integrated rescue system,
        hence civil_protection. public_administration and territorial_administration are tagged
        for the coordinating roles § 12 odst. 2 and 3 give it over administrative procedure and
        over "organizace a výkonu veřejné správy", which in Czechia includes the legality
        oversight of municipalities and regions. Two remits have no id in this project's
        taxonomy and are recorded here in prose: archives, and the coordinating role for
        communication technologies in § 12 odst. 6 — the latter is not tagged digital, because
        state digitalisation is the Digitální a informační agentura's and no Czech ministry holds
        it. The English name is the government's own even though the same site titles the
        minister "Minister of the Interior".
      es: >-
        El § 12 le atribuye el orden público y la seguridad interior incluida la seguridad viaria,
        los nombres y el registro civil, la nacionalidad, los documentos de identidad, el registro
        de residencia y el censo de población, el derecho de reunión y los partidos políticos, las
        colectas públicas, los archivos y la gestión documental, las armas y municiones, la
        protección contra incendios, los documentos de viaje y el «povolování pobytu cizinců a
        postavení uprchlíků» —de ahí migration, al no existir un ministerio de migración—, la
        división territorial del Estado, las fronteras, los símbolos del Estado, todas las
        elecciones celebradas en territorio checo y la gestión de crisis, la planificación civil
        de emergencia, la protección de la población y el sistema integrado de rescate, de ahí
        civil_protection. Se etiquetan public_administration y territorial_administration por los
        papeles coordinadores que le dan los apartados 2 y 3 del § 12 sobre el procedimiento
        administrativo y sobre la «organizace a výkonu veřejné správy», que en Chequia incluye el
        control de legalidad de municipios y regiones. Dos competencias no tienen id en la
        taxonomía del proyecto y aquí sólo constan en prosa: los archivos y el papel coordinador
        en tecnologías de comunicación del § 12 apartado 6; esta última no se etiqueta como
        digital, porque la digitalización del Estado es de la Digitální a informační agentura y
        ningún ministerio checo la tiene. El nombre inglés es el del propio gobierno aunque el
        mismo sitio titule al ministro «Minister of the Interior».

  - id: CZ-2025-ministerstvo-prumyslu-a-obchodu
    order: 10
    name_original: Ministerstvo průmyslu a obchodu
    abbreviation_original: null
    name_en: Ministry of Industry and Trade
    name_es: Ministerio de Industria y Comercio
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně průmyslu a obchodu
    head_title_en: Minister of Industry and Trade
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [industry, trade, energy, mining, small_business, consumer_protection, telecommunications, innovation]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://mpo.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        The widest portfolio in the Czech government. § 13 gives it industrial, commercial and
        external economic policy, raw-materials policy and the use of mineral wealth, energy,
        district heating and gas, the extraction and processing of oil, natural gas, solid
        fuels, radioactive raw materials, ores and non-ores — hence energy and mining — the whole
        span of manufacturing from metallurgy and engineering to textiles and building materials,
        internal trade and consumer protection, foreign trade and export promotion, the screening
        of foreign investment, small and medium enterprises and trades, technical standardisation
        and metrology, industrial research and the development of technology, and "elektronické
        komunikace a poštovní služby" except what is reserved to the Český telekomunikační úřad,
        hence telecommunications. innovation is tagged for industrial research and technology
        development, which is distinct from the education ministry's science policy. Energy
        *regulation* belongs to the Energetický regulační úřad, one of the central authorities of
        § 2, and mining supervision to the Český báňský úřad; neither is a ministry.
      es: >-
        La cartera más amplia del gobierno checo. El § 13 le atribuye la política industrial,
        comercial y económica exterior, la política de materias primas y el aprovechamiento de la
        riqueza mineral, la energía, la calefacción urbana y el gas, la extracción y el
        procesamiento de petróleo, gas natural, combustibles sólidos, materias primas radiactivas,
        minerales metálicos y no metálicos —de ahí energy y mining—, todo el arco manufacturero
        desde la metalurgia y la ingeniería hasta el textil y los materiales de construcción, el
        comercio interior y la protección del consumidor, el comercio exterior y el fomento de la
        exportación, el examen de la inversión extranjera, las pymes y los oficios, la
        normalización técnica y la metrología, la investigación industrial y el desarrollo
        tecnológico, y las «elektronické komunikace a poštovní služby» salvo lo reservado al Český
        telekomunikační úřad, de ahí telecommunications. Se etiqueta innovation por la
        investigación industrial y el desarrollo tecnológico, distintos de la política científica
        del ministerio de educación. La *regulación* energética es del Energetický regulační úřad,
        uno de los órganos centrales del § 2, y la supervisión minera del Český báňský úřad;
        ninguno de los dos es un ministerio.

  - id: CZ-2025-ministerstvo-pro-mistni-rozvoj
    order: 11
    name_original: Ministerstvo pro místní rozvoj
    abbreviation_original: null
    name_en: Ministry of Regional Development
    name_es: Ministerio de Desarrollo Regional
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně pro místní rozvoj
    head_title_en: Minister of Regional Development
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [regional_development, housing, spatial_planning, tourism]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://www.mmr.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        § 14 makes it the central authority for regional policy, housing policy and the
        development of the housing stock, the tenancy of flats and non-residential premises,
        spatial planning and the building code, expropriation, investment policy, tourism and
        funeral services; it administers the funds for housing and regional policy and
        coordinates the involvement of self-governing territorial units in European regional
        structures, which is why regional_development — the taxonomy's cohesion-funds area —
        leads its tags. Funeral services have no id in this project's taxonomy. The ministry's
        methodological assistance to regions and municipalities is oversight-adjacent rather
        than a local-government portfolio, so territorial_administration is tagged on the
        interior ministry instead.
      es: >-
        El § 14 lo hace órgano central para la política regional, la política de vivienda y el
        desarrollo del parque residencial, el arrendamiento de viviendas y locales, la ordenación
        del territorio y la normativa de edificación, la expropiación, la política de inversión,
        el turismo y los servicios funerarios; administra los fondos de vivienda y de política
        regional y coordina la incorporación de las entidades territoriales a las estructuras
        regionales europeas, razón por la que regional_development —el área de fondos de cohesión
        de la taxonomía— encabeza sus etiquetas. Los servicios funerarios no tienen id en la
        taxonomía del proyecto. La asistencia metodológica del ministerio a regiones y municipios
        se parece más a una tutela que a una cartera de administración local, de modo que
        territorial_administration se etiqueta en el ministerio del Interior.

  - id: CZ-2025-ministerstvo-zemedelstvi
    order: 12
    name_original: Ministerstvo zemědělství
    abbreviation_original: MZe
    name_en: Ministry of Agriculture
    name_es: Ministerio de Agricultura
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně zemědělství
    head_title_en: Minister of Agriculture
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [agriculture, food_safety, forestry, water, fisheries, animal_welfare]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://mze.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        § 15 gives it agriculture except the protection of the agricultural land fund, water
        management except the protection of natural water accumulation, water sources and the
        quality of surface and groundwater, and the food industry; it is also the central
        authority for forests, hunting and fisheries outside national parks, and for veterinary
        and phytosanitary care, food, the protection of animals against cruelty and rights in
        new plant varieties and animal breeds. water and forestry are therefore tagged here with
        the exceptions the section itself carves out and hands to the environment ministry, and
        both entities record the split. rural_development is deliberately not tagged: the
        ministry manages the rural development programme in practice, but § 15 does not name it,
        and this project tags statutory portfolios rather than programme management. The Státní
        zemědělská a potravinářská inspekce and the Státní veterinární správa are subordinate to
        it.
      es: >-
        El § 15 le atribuye la agricultura salvo la protección del fondo de suelo agrícola, la
        gestión del agua salvo la protección de la acumulación natural de aguas, de las fuentes y
        de la calidad de las aguas superficiales y subterráneas, y la industria alimentaria; es
        además órgano central para los bosques, la caza y la pesca fuera de los parques
        nacionales, y para la sanidad veterinaria y vegetal, los alimentos, la protección de los
        animales contra el maltrato y los derechos sobre nuevas variedades vegetales y razas
        animales. water y forestry se etiquetan por tanto aquí con las excepciones que el propio
        precepto reserva al ministerio de Medio Ambiente, y ambas entidades registran el reparto.
        rural_development no se etiqueta deliberadamente: el ministerio gestiona en la práctica el
        programa de desarrollo rural, pero el § 15 no lo menciona, y este proyecto etiqueta
        carteras legales y no gestión de programas. La Státní zemědělská a potravinářská inspekce
        y la Státní veterinární správa le están subordinadas.

  - id: CZ-2025-ministerstvo-obrany
    order: 13
    name_original: Ministerstvo obrany
    abbreviation_original: null
    name_en: Ministry of Defence
    name_es: Ministerio de Defensa
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně obrany
    head_title_en: Minister of Defence
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [defence]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://www.mo.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        § 16 makes it the central authority for securing the defence of the Republic, for
        commanding the Armed Forces and for administering the military training areas; it directs
        Vojenské zpravodajství, guarantees the inviolability of Czech airspace, organises
        mobilisation and conscription records, and exercises state supervision of radiation
        protection on military premises. Tagged defence only. Veterans' affairs are handled inside
        this ministry rather than by a body of their own, and are not tagged because the section
        does not name them as a portfolio.
      es: >-
        El § 16 lo hace órgano central para garantizar la defensa de la República, para el mando
        de las Fuerzas Armadas y para la administración de los campos de instrucción militar;
        dirige el Vojenské zpravodajství, garantiza la inviolabilidad del espacio aéreo checo,
        organiza la movilización y los registros del servicio militar y ejerce la supervisión
        estatal de la protección radiológica en instalaciones militares. Se etiqueta sólo defence.
        Los asuntos de veteranos se gestionan dentro de este ministerio y no por un órgano propio,
        y no se etiquetan porque el precepto no los nombra como cartera.

  - id: CZ-2025-ministerstvo-dopravy
    order: 14
    name_original: Ministerstvo dopravy
    abbreviation_original: null
    name_en: Ministry of Transport
    name_es: Ministerio de Transporte
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně dopravy
    head_title_en: Minister of Transport
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [transport, infrastructure]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://md.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        The shortest competence in the Act: § 17 is a single sentence making the ministry the
        central authority "ve věcech dopravy" and responsible for forming and implementing state
        transport policy. That one word covers road, rail, air and inland-waterway transport
        alike, and with them the transport infrastructure the state builds and maintains, which
        is why infrastructure is tagged alongside transport. Nothing narrower can be read out of
        the section, so no modal tags are assigned; shipping is not tagged, because the Act gives
        this ministry no maritime portfolio distinct from transport in general.
      es: >-
        La competencia más breve de la ley: el § 17 es una sola frase que hace al ministerio
        órgano central «ve věcech dopravy» y responsable de formular y ejecutar la política
        estatal de transporte. Esa única palabra cubre por igual el transporte por carretera,
        ferrocarril, aire y vías navegables interiores, y con ellos la infraestructura de
        transporte que el Estado construye y mantiene, razón por la que se etiqueta infrastructure
        junto a transport. Del precepto no cabe leer nada más específico, así que no se asignan
        etiquetas por modos; no se etiqueta shipping, porque la ley no da a este ministerio una
        cartera marítima distinta del transporte en general.

  - id: CZ-2025-ministerstvo-zivotniho-prostredi
    order: 15
    name_original: Ministerstvo životního prostředí
    abbreviation_original: MŽP
    name_en: Ministry of the Environment
    name_es: Ministerio de Medio Ambiente
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně životního prostředí
    head_title_en: Minister of the Environment
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [environment, water, climate, mining]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://mzp.gov.cz
    sources: [sb-2-1969, vlada-clenove-vlady, vlada-en-ministerstva, zakonyprolidi-2-1969]
    note:
      en: >-
        § 19 makes it the organ of supreme state supervision in environmental matters and the
        central authority for the protection of natural water accumulation, water sources and the
        quality of surface and groundwater — the water remit carved out of the agriculture
        ministry's § 15 — for air protection, for the protection of nature and the landscape, for
        zoos, for the protection of the agricultural land fund, for the state geological service
        and the protection of the rock environment including mineral resources and groundwater,
        for geological work and ecological supervision of mining, for waste management, for
        environmental impact assessment including transboundary effects, for hunting, fisheries
        and forestry inside national parks, for state ecological policy, for eco-labelling and for
        EMAS. mining is tagged for the state geological service and the ecological supervision of
        extraction, which is a different thing from the industry ministry's raw-materials policy
        and from the Český báňský úřad's mining supervision; both entities record the split.
        climate is tagged on the strength of "ochrana ovzduší" and "státní ekologická politika":
        Czechia has no climate ministry and no other department could hold the area, but the
        reader should know the Act itself does not use the word. Waste has no id in this project's
        taxonomy and is recorded here in prose. This is the ministry that had no minister of its
        own between 15 December 2025 and 23 February 2026; see the methodology notes.
      es: >-
        El § 19 lo hace órgano de supervisión estatal suprema en materia ambiental y órgano
        central para la protección de la acumulación natural de aguas, de las fuentes y de la
        calidad de las aguas superficiales y subterráneas —la parte del agua excluida del § 15 del
        ministerio de Agricultura—, para la protección del aire, para la protección de la
        naturaleza y el paisaje, para los zoológicos, para la protección del fondo de suelo
        agrícola, para el servicio geológico estatal y la protección del medio rocoso incluidos
        los recursos minerales y las aguas subterráneas, para los trabajos geológicos y la
        supervisión ecológica de la minería, para la gestión de residuos, para la evaluación de
        impacto ambiental incluida la transfronteriza, para la caza, la pesca y la silvicultura
        dentro de los parques nacionales, para la política ecológica estatal, para el etiquetado
        ecológico y para el EMAS. Se etiqueta mining por el servicio geológico estatal y la
        supervisión ecológica de la extracción, cosa distinta de la política de materias primas
        del ministerio de Industria y de la supervisión minera del Český báňský úřad; ambas
        entidades registran el reparto. climate se etiqueta sobre la base de «ochrana ovzduší» y
        «státní ekologická politika»: Chequia no tiene ministerio del clima y ningún otro
        departamento podría llevar el área, pero el lector debe saber que la ley misma no usa la
        palabra. Los residuos no tienen id en la taxonomía del proyecto y aquí sólo constan en
        prosa. Este es el ministerio que no tuvo ministro propio entre el 15 de diciembre de 2025
        y el 23 de febrero de 2026; véanse las notas metodológicas.

