      took_office — and the fact that the ministr pro sport, prevenci a zdraví is based at the
      Úřad vlády rather than at a ministry, which is what makes him a minister without
      portfolio. The Prime Minister himself had been appointed six days earlier, on
      9 December 2025; the date used here is the one on which the government as a body came
      into being.

