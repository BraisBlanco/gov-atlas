  - id: CZ-2025-ministr-pro-sport-prevenci-a-zdravi
    order: 16
    name_original: Ministr pro sport, prevenci a zdraví
    abbreviation_original: null
    name_en: Minister of Sport, Prevention and Health
    name_es: Ministro de Deporte, Prevención y Salud
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: ministr/ministryně pro sport, prevenci a zdraví
    head_title_en: Minister of Sport, Prevention and Health
    has_cabinet_seat: true
