      es: >-
        El § 7 apartado 1 le atribuye los centros de educación infantil, los establecimientos
        escolares, la enseñanza básica, secundaria y superior, la política científica, la
        investigación y el desarrollo incluida la cooperación internacional en ese campo, los
        grados académicos y la «státní péče o děti, mládež a tělesnou výchovu»; el § 7 apartado
        2 añade la coordinación del reconocimiento de cualificaciones profesionales y de las
        obtenidas en la formación continua, y de ahí la etiqueta vocational_training. Las áreas
        se ordenan como las ordena el propio nombre del ministerio. sport se etiqueta aquí y no
        en el nuevo ministr pro sport, prevenci a zdraví, que no dirige ningún departamento; la
        otra sede legal del deporte es la Národní sportovní agentura, uno de los órganos
        centrales del § 2, que tampoco es un ministerio. La Česká školní inspekce está
        subordinada a este ministerio.

