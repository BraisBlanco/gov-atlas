# Czechia — the government of předseda vlády Andrej Babiš, appointed 15 December 2025.
#
# See docs/DATA-CONTRACT.md. Five things worth knowing before reading the list:
#
#   1. Czechia is one of the countries in this dataset whose ministries are created by a
#      statute rather than by a reorganisation decree. The instrument is § 1 of zákon
#      č. 2/1969 Sb., the kompetenční zákon, which opens with "V České republice působí tyto
#      ústřední orgány státní správy, v jejichž čele je člen vlády" and lists fourteen.
#      Creating, abolishing or renaming a Czech ministry means amending that list, and the
#      October 2025 election and the change of government did not amend it.
#   2. Fourteen ministries, sixteen cabinet members. The předseda vlády heads no ministry,
#      and one further member — the ministr pro sport, prevenci a zdraví — heads no ministry
#      either: he is based at the Úřad vlády, which is what the Constitution's čl. 68 odst. 2
#      allows when it says the President charges ministers with running "ministerstev nebo
#      jiných úřadů".
#   3. § 2 of the same statute lists seventeen *other* central authorities — the Český
#      statistický úřad, the Úřad vlády, the Národní sportovní agentura, the Digitální a
#      informační agentura and so on. None of them is a ministry and none of their heads sits
#      in the cabinet, so none is recorded as an entity. See the methodology notes.
#   4. Four of the fourteen ministers are also místopředsedové vlády. A deputy premiership is
#      a personal office, not a department; it adds neither a ministry nor a seat.
#   5. The Ministerstvo životního prostředí had no minister of its own between 15 December
#      2025 and 23 February 2026 — the foreign minister was charged with running it. The
#      department existed throughout, so no entity here carries a valid_from.

country: CZ
cabinet_id: CZ-2025-12-15

cabinet_name_original: Vláda Andreje Babiše
cabinet_name_en: Babiš government
cabinet_name_es: Gobierno de Andrej Babiš

head_of_government_title_original: Předseda vlády
head_of_government_title_en: Prime Minister

took_office: 2025-12-15
left_office: null

methodology_notes:
  - en: >-
      14 ministries and 16 cabinet seats. The fourteen are exactly the central authorities
      listed in § 1 of zákon č. 2/1969 Sb. (the kompetenční zákon) in the consolidated
      redaction in force from 1 January 2026, and no other Czech body is a ministry: § 1 is
      the section that constitutes them, by naming them and by saying that a member of the
      government stands at the head of each. The sixteen seats are the předseda vlády, the
      fourteen ministers who lead those ministries, and one minister who leads none. Article
      67(2) of the Constitution makes the government "předsedy vlády, místopředsedů vlády a
      ministrů", so the Prime Minister's seat is a matter of constitutional law rather than
      of our interpretation, and article 68(2) is what allows a minister to be charged with
      running "jiných úřadů" instead of a ministry. Neither figure is wrong; they answer
      different questions, and this page never adds them.
    es: >-
      14 ministerios y 16 asientos en el gabinete. Los catorce son exactamente los órganos
      centrales enumerados en el § 1 de la zákon č. 2/1969 Sb. (la kompetenční zákon) en la
      redacción consolidada vigente desde el 1 de enero de 2026, y ningún otro órgano checo
      es un ministerio: el § 1 es el precepto que los constituye, al nombrarlos y al
      establecer que al frente de cada uno está un miembro del gobierno. Los dieciséis
      asientos son el předseda vlády, los catorce ministros que dirigen esos ministerios y un
      ministro que no dirige ninguno. El artículo 67.2 de la Constitución compone el gobierno
      de «předsedy vlády, místopředsedů vlády a ministrů», de modo que el asiento del primer
      ministro es cuestión de derecho constitucional y no de nuestra interpretación, y el
      artículo 68.2 es lo que permite encomendar a un ministro la dirección de «jiných úřadů»
      en lugar de un ministerio. Ninguna de las dos cifras es incorrecta: responden a
      preguntas distintas, y esta ficha nunca las suma.
  - en: >-
      The one minister without a portfolio, and why sport is tagged where it is. Boris
      Šťastný was sworn in on 15 December 2025 as ministr pro sport, prevenci a zdraví, a post
      this government created; the government's own press release says he "bude sídlit na
      Úřadu vlády", and § 1 of the kompetenční zákon was not amended to add a ministry for
      him. He therefore holds a cabinet seat and no department, and is recorded here as a
      minister without portfolio — the reason the cabinet is sixteen people and the government
      fourteen departments. The statutory home of sport is unchanged: § 7 odst. 1 gives
      "státní péče o děti, mládež a tělesnou výchovu" to the Ministerstvo školství, mládeže a
      tělovýchovy, whose name still ends in "a tělovýchovy", and the Národní sportovní
      agentura remains one of the central authorities of § 2. The sport area is therefore
      carried by the education ministry, not by the new post. Treating the new post as a
      fifteenth ministry — as several press summaries of the cabinet do, calling it a
      "ministerstvo sportu" — would give 15; that reading has no support in § 1.
    es: >-
      El único ministro sin cartera, y por qué el deporte se etiqueta donde se etiqueta. Boris
      Šťastný tomó posesión el 15 de diciembre de 2025 como ministr pro sport, prevenci a
      zdraví, un puesto creado por este gobierno; la propia nota de prensa del gobierno dice
      que «bude sídlit na Úřadu vlády», y el § 1 de la kompetenční zákon no se modificó para
      añadirle un ministerio. Ocupa por tanto un asiento en el gabinete sin departamento y se
      registra como ministro sin cartera: es la razón de que el gabinete sean dieciséis
      personas y el gobierno catorce departamentos. La sede legal del deporte no ha cambiado:
      el § 7 apartado 1 atribuye la «státní péče o děti, mládež a tělesnou výchovu» al
      Ministerstvo školství, mládeže a tělovýchovy, cuyo nombre sigue terminando en «a
      tělovýchovy», y la Národní sportovní agentura sigue siendo uno de los órganos centrales
      del § 2. El área de deporte la lleva por tanto el ministerio de educación y no el nuevo
      puesto. Tratar el nuevo puesto como un decimoquinto ministerio —como
      hacen varios resúmenes de prensa del gabinete, que lo llaman «ministerstvo sportu»—
      daría 15; esa lectura no tiene apoyo en el § 1.
  - en: >-
      Why the Úřad vlády České republiky is not recorded, and neither is any other body from
      § 2. The Úřad vlády (Office of the Government) is item 10 of § 2, the list of central
      authorities that are *not* headed by a member of the government. § 28 odst. 3 gives it
      the professional, organisational and technical support of the government, of its bodies
      and of "členů vlády, kteří nejsou pověřeni řízením ministerstva nebo jiného úřadu" —
      which is precisely the minister for sport's situation — and § 28 odst. 5 puts it under a
      vedoucí Úřadu vlády appointed and dismissed by the government, a civil servant who is
      not a minister and holds no seat. Recording it as an entity would either invent a
      fifteenth department or a seventeenth seat, so the předseda vlády is recorded instead,
      uncounted, as the office of the head of government. The same reasoning excludes the other
      sixteen § 2 authorities: the Český statistický úřad (the source of the population figure
      published for Czechia), the Český úřad zeměměřický a katastrální, the Úřad pro ochranu
      hospodářské soutěže, the Národní sportovní agentura, the Digitální a informační agentura
      and the rest are central authorities whose heads do not sit in the cabinet, and no
      official source presents any of them as cabinet-level. Two consequences are worth
      naming: Czechia has no ministry holding the digital portfolio — state digitalisation is
      the Digitální a informační agentura's, with the Ministerstvo vnitra holding only a
      coordinating role for communication technologies under § 12 odst. 6 — and it has no
      ministry of equality, of migration as such, or of European affairs. The Legislativní
      rada vlády, which § 28a lets the government establish as an advisory body chaired by a
      member of the government, is likewise not a department and adds no seat, because its
      chair already holds one.
    es: >-
      Por qué no se registra el Úřad vlády České republiky ni ningún otro órgano del § 2. El
      Úřad vlády (Oficina del Gobierno) es el punto 10 del § 2, la lista de órganos centrales
      que *no* están encabezados por un miembro del gobierno. El § 28 apartado 3 le atribuye
      el apoyo técnico, organizativo y especializado del gobierno, de sus órganos y de los
      «členů vlády, kteří nejsou pověřeni řízením ministerstva nebo jiného úřadu» —que es
      exactamente la situación del ministro de deporte— y el § 28 apartado 5 lo pone bajo un
      vedoucí Úřadu vlády nombrado y separado por el gobierno, un funcionario que no es
      ministro y no tiene asiento. Registrarlo como entidad inventaría un decimoquinto
      departamento o un decimoséptimo asiento, de modo que se registra en su lugar el předseda
      vlády, sin contarlo, como oficina del jefe de gobierno. El mismo razonamiento excluye a los
      otros dieciséis órganos del § 2: el Český statistický úřad (de donde procede la cifra de
      población publicada para Chequia), el Český úřad zeměměřický a katastrální, el Úřad pro
      ochranu hospodářské soutěže, la Národní sportovní agentura, la Digitální a informační
      agentura y los demás son órganos centrales cuyos titulares no se sientan en el gabinete,
      y ninguna fuente oficial los presenta como de rango ministerial. Dos consecuencias
      merecen mención: Chequia no tiene ningún ministerio con la cartera digital —la
      digitalización del Estado es de la Digitální a informační agentura, y el Ministerstvo
      vnitra sólo tiene un papel coordinador de las tecnologías de comunicación según el § 12
      apartado 6— y no tiene ministerio de igualdad, ni de migración como tal, ni de asuntos
      europeos. La Legislativní rada vlády, que el § 28a permite al gobierno crear como órgano
      consultivo presidido por un miembro del gobierno, tampoco es un departamento ni añade
      asiento, porque quien la preside ya tiene uno.
  - en: >-
      Deputy prime ministers add nothing to either figure. Four of the fourteen ministers are
      also místopředsedové vlády: the ministers of industry and trade (as 1. místopředseda
      vlády), of foreign affairs, of finance and of defence, as the government's own list of
      members shows. A deputy premiership is a personal office attached to a minister, not a
      department, so it creates neither a ministry nor a seat, and no entity here is recorded
      for it. Which ministers hold them can change with a reshuffle; the departmental
      structure of § 1 does not, and only the latter is recorded in this page. There is no
      deputy prime minister without a portfolio in this cabinet.
    es: >-
      Los viceprimeros ministros no añaden nada a ninguna de las dos cifras. Cuatro de los
      catorce ministros son además místopředsedové vlády: los de industria y comercio (como
      1. místopředseda vlády), asuntos exteriores, finanzas y defensa, según la propia lista
      de miembros del gobierno. Una vicepresidencia del gobierno es un cargo personal adscrito
      a un ministro, no un departamento, por lo que no crea ni ministerio ni asiento, y aquí
      no se registra ninguna entidad por ella. Quién las ostenta puede cambiar con una
      remodelación; la estructura departamental del § 1 no, y en esta ficha sólo se registra
      esta última. En este gabinete no hay ningún viceprimer ministro sin cartera.
  - en: >-
      One ministry ran without its own minister for ten weeks, and no entity records it. The
      President appointed fifteen of the sixteen members on 15 December 2025; the Motoristé
      sobě nominee for the environment was not appointed, and the foreign minister, Petr
      Macinka, was charged with running the Ministerstvo životního prostředí until Igor Červený
      was appointed to it on 23 February 2026. That was a vacancy in a ministerial post, not a
      change to the list of departments: § 1 was untouched, the ministry existed and acted
      throughout, and this page records the structure in force on the access date, so the
      environment entity is recorded with neither a start date of its own nor a shared head.
      A reader reconstructing
      the cabinet as it stood in January 2026 should note that the ministry then shared a head
      with the foreign ministry, and that the derived seat count for that period would have
      been fifteen rather than sixteen. The government won the confidence of the Poslanecká
      sněmovna on 15 January 2026, within the thirty days článek 68 odst. 3 allows; the date
      recorded here for the cabinet taking office is the date of appointment, not of the
      confidence vote.
    es: >-
      Un ministerio funcionó diez semanas sin ministro propio, y ninguna entidad lo refleja. El
      presidente nombró a quince de los dieciséis miembros el 15 de diciembre de 2025; el
      candidato de Motoristé sobě para medio ambiente no fue nombrado, y el ministro de Asuntos
      Exteriores, Petr Macinka, quedó encargado de dirigir el Ministerstvo životního prostředí
      hasta que Igor Červený fue nombrado el 23 de febrero de 2026. Fue una vacante en un
      puesto ministerial, no un cambio en la lista de departamentos: el § 1 no se tocó, el
      ministerio existió y actuó durante todo ese tiempo, y esta ficha registra la estructura
      vigente en la fecha de consulta, de modo que la entidad de medio ambiente se registra sin
      fecha de inicio propia y sin titular compartido. Quien reconstruya el gabinete tal como
      estaba en enero de
      2026 debe tener en cuenta que entonces el ministerio compartía titular con el de
      Exteriores y que el recuento derivado de asientos para ese periodo habría sido quince y
      no dieciséis. El gobierno obtuvo la confianza de la Poslanecká sněmovna el 15 de enero de
      2026, dentro de los treinta días que permite el artículo 68 apartado 3; la fecha de toma
      de posesión registrada aquí es la del nombramiento, no la de la votación de confianza.
  - en: >-
      English ministry names are the Czech government's own; Spanish names are ours. All
      fourteen English names are copied from the Ministries page of the English-language
      edition of vlada.gov.cz and are marked as the government's own names, as are the English
      ministerial titles, which come from the same site's list of members. Two inconsistencies
      in that source are reproduced faithfully rather than smoothed over: the site writes
      "Ministry of Interior" for the department but "Minister of the Interior" for its head,
      and it writes "Ministry of the Environment" as the department's heading while the body
      text of the same entry says "Ministry of Environment". Every Spanish name on this page is
      this project's own translation and is marked as such; so is the Spanish name of the
      country's own institutions in the notes. Czech has one official language, so the
      original names here raise no parallel-name questions.
    es: >-
      Los nombres ingleses de los ministerios son los del propio gobierno checo; los españoles
      son nuestros. Los catorce nombres en inglés están copiados de la página Ministries de la
      edición inglesa de vlada.gov.cz y se señalan como nombres propios del gobierno, igual que
      los títulos ministeriales en inglés, que proceden de la lista de miembros del mismo sitio.
      Dos incoherencias de esa fuente se reproducen fielmente en lugar de corregirse: el sitio
      escribe «Ministry of Interior» para el departamento pero «Minister of the Interior» para
      su titular, y escribe «Ministry of the Environment» como encabezamiento del departamento
      mientras el cuerpo de la misma entrada dice «Ministry of Environment». Todos los nombres
      en español de esta ficha son traducciones propias de este proyecto y así se indican;
      también lo es el nombre español de las instituciones del propio país en las notas. El
      checo es la única lengua oficial, de modo que los nombres originales no plantean aquí
      cuestiones de nombres paralelos.
  - en: >-
      A sourcing weakness a reader should know about. The instrument that enumerates the
      ministries is a statute, and the official Sbírka zákonů publishes it at e-sbirka.cz — but
      that site is a client-rendered application, and every web-archive snapshot of it,
      including the one cited here, preserves only the empty application shell, and fresh
      snapshots made as of the access date come out the same way. The quoted text of §§ 1, 2
      and 28 was
      therefore read from the official machine-readable ELI open data of the same system
      (opendata.eselpoint.gov.cz), fragment by fragment, and cross-checked word for word
      against two static renderings: the Ministry of Agriculture's official publication of the
      consolidated Act, whose server blocks archiving crawlers, and the commercial consolidated
      text at zakonyprolidi.cz, which is archived and is cited at tier 3 for that purpose. All
      three agree exactly. This is the reason Czechia's tier-1 citation cannot be checked by
      opening an archived snapshot, unlike what is usual in this project, and it is a property
      of the Czech official gazette rather than of this page.
    es: >-
      Una debilidad de las fuentes que el lector debe conocer. El instrumento que enumera los
      ministerios es una ley, y la Sbírka zákonů oficial la publica en e-sbirka.cz, pero ese
      sitio es una aplicación que se renderiza en el navegador y todas las copias de archivo
      web que existen de él —incluida la citada aquí— conservan sólo el armazón vacío de la
      aplicación, y las copias nuevas creadas a fecha de consulta salen igual. El texto citado
      de los §§ 1, 2 y 28 se leyó por ello en los datos abiertos oficiales legibles por máquina
      del mismo sistema (opendata.eselpoint.gov.cz), fragmento a fragmento, y se cotejó palabra
      por palabra con dos versiones estáticas: la publicación oficial del texto consolidado por
      el Ministerio de Agricultura, cuyo servidor bloquea a los rastreadores de archivo, y el
      texto consolidado comercial de zakonyprolidi.cz, que sí está archivado y se cita en nivel
      3 con ese fin. Las tres coinciden exactamente. Es la razón por la que la cita de nivel 1
      de Chequia no puede comprobarse abriendo una copia archivada, a diferencia de lo habitual
      en este proyecto, y es una propiedad del boletín oficial checo, no de esta ficha.
  - en: >-
      Perimeter. This page describes the central government of the Czech Republic. The fourteen
      kraje and the municipalities are subnational and out of scope; oversight of them is a
      portfolio of the Ministerstvo vnitra and the Ministerstvo pro místní rozvoj rather than a
      ministry of its own. The President of the Republic is head of state, appoints the
      government under článek 68, and is not a member of it. The Česká národní banka is an
      independent monetary authority outside the executive and is not one of the § 2 central
      authorities. § 1 lists fourteen items in the redaction in force on the access date and in
      the later redaction already published as taking effect on 1 January 2027, so the ministry
      count is not due to change on any instrument published as of the access date; § 2, by
      contrast, grows
      from seventeen items to nineteen in that 2027 redaction, which changes the count of
      central authorities and not the count of ministries.
    es: >-
      Perímetro. Esta ficha describe el gobierno central de la República Checa. Los catorce
      kraje y los municipios son subnacionales y quedan fuera de alcance; su tutela es una
      cartera del Ministerstvo vnitra y del Ministerstvo pro místní rozvoj y no un ministerio
      propio. El presidente de la República es jefe del Estado, nombra al gobierno según el
      artículo 68 y no forma parte de él. La Česká národní banka es una autoridad monetaria
      independiente ajena al ejecutivo y no figura entre los órganos centrales del § 2. El § 1
      enumera catorce puntos en la redacción vigente en la fecha de consulta y también en la
      redacción posterior ya publicada con efectos de 1 de enero de 2027, de modo que la cifra
      de ministerios no va a cambiar según ningún instrumento publicado a la fecha de consulta;
      el § 2, en
      cambio, pasa de diecisiete a diecinueve puntos en esa redacción de 2027, lo que altera el
      recuento de órganos centrales y no el de ministerios.

sources:
  - id: sb-2-1969
    tier: 1
    type: statute
    publisher: Sbírka zákonů a mezinárodních smluv (e-Sbírka) — Ministerstvo vnitra
    title: >-
      Zákon č. 2/1969 Sb., o zřízení ministerstev a jiných ústředních orgánů státní správy
      České republiky (kompetenční zákon), konsolidované znění účinné od 1. 1. 2026
    url: https://www.e-sbirka.cz/sb/1969/2
    archive_url: https://web.archive.org/web/20251015144441/https://www.e-sbirka.cz/sb/1969/2
    lang: cs
    published: 1969-01-08
    accessed: 2026-07-28
    quote: |-
      § 1
      V České republice působí tyto ústřední orgány státní správy, v jejichž čele je člen vlády:
      1. Ministerstvo financí,
      2. Ministerstvo zahraničních věcí,
      3. Ministerstvo školství, mládeže a tělovýchovy,
      4. Ministerstvo kultury,
      5. Ministerstvo práce a sociálních věcí,
      6. Ministerstvo zdravotnictví,
      7. Ministerstvo spravedlnosti,
      8. Ministerstvo vnitra,
      9. Ministerstvo průmyslu a obchodu,
      10. Ministerstvo pro místní rozvoj,
      11. Ministerstvo zemědělství,
      12. Ministerstvo obrany,
      13. Ministerstvo dopravy,
      14. Ministerstvo životního prostředí.
      § 2
      V České republice působí tyto další ústřední orgány státní správy:
      1. Český statistický úřad,
      2. Český úřad zeměměřický a katastrální,
      3. Český báňský úřad,
      4. Úřad průmyslového vlastnictví,
      5. Úřad pro ochranu hospodářské soutěže,
      6. Správa státních hmotných rezerv,
      7. Státní úřad pro jadernou bezpečnost,
      8. Národní bezpečnostní úřad,
      9. Energetický regulační úřad,
      10. Úřad vlády České republiky,
      11. Český telekomunikační úřad,
      12. Úřad pro ochranu osobních údajů,
      13. Rada pro rozhlasové a televizní vysílání,
      14. Úřad pro dohled nad hospodařením politických stran a politických hnutí,
      15. Národní úřad pro kybernetickou a informační bezpečnost,
      16. Národní sportovní agentura,
      17. Digitální a informační agentura.
      § 28
      (3) Úkoly spojené s odborným, organizačním a technickým zabezpečením činnosti vlády České republiky, jejích orgánů, členů vlády, kteří nejsou pověřeni řízením ministerstva nebo jiného úřadu, a orgánů, o nichž tak stanoví zvláštní zákon nebo tak rozhodne vláda, plní Úřad vlády České republiky.
      (5) Vedoucího Úřadu vlády České republiky jmenuje a odvolává vláda České republiky. Činnost Úřadu vlády České republiky řídí vedoucí Úřadu vlády České republiky, s výjimkou organizačních věcí státní služby a služebních vztahů státních zaměstnanců; v těchto věcech postupuje vedoucí Úřadu vlády České republiky podle zákona o státní službě.
    note: >-
      The enumerating instrument. § 1 constitutes the ministries by naming them and by stating
      that a member of the government stands at the head of each; § 2 lists the other central
      authorities, which are not ministries and whose heads hold no cabinet seat; § 28 odst. 3
      and 5 are quoted because they are why the Úřad vlády is not recorded as a department and
      why a minister can exist without one. The quotation reproduces those passages in the
      order of the document and omits everything between them, including the repealed § 1a and
      the ministry-by-ministry competences of §§ 4 to 19, which are the basis for the policy
      tags in the entity notes below. Consolidated text: e-Sbírka's own version metadata gives
      this redaction as type KONSOL with účinnost-znění-od 2026-01-01 and účinnost-znění-do
      2026-12-31, and the last amendments incorporated are zákon č. 448/2024 Sb. (in part) and
      zákon č. 220/2025 Sb.; the same source publishes a further redaction taking effect on
      1 January 2027 in which § 1 still lists the same fourteen items. IMPORTANT CAVEAT: the
      cited URL is a client-rendered application, so the archived snapshot preserves only its
      empty shell — attempts to create a fresh snapshot on the access date returned HTTP 520
      repeatedly. The quoted text was read instead from the official machine-readable ELI open
      data of the same system, one fragment at a time, under
      https://opendata.eselpoint.gov.cz/esel-esb/eli/cz/sb/1969/2/2026-01-01/dokument/norma/,
      and cross-checked word for word against the Ministry of Agriculture's official
      publication of the consolidated Act
      (https://mze.gov.cz/public/portal/regulation?ck=regulation&id=31338&name=2/1969, whose
      server blocks archiving crawlers) and against the archived consolidated text cited at
      tier 3 below. All three agree exactly. The published date is the date of the original Act.

  - id: ustava-1-1993
    tier: 1
    type: statute
    publisher: Parlament České republiky — Poslanecká sněmovna
    title: >-
      Ústava České republiky, ústavní zákon č. 1/1993 Sb., ve znění ústavních zákonů
      č. 347/1997 Sb., 300/2000 Sb., 448/2001 Sb., 395/2001 Sb., 515/2002 Sb., 319/2009 Sb.,
      71/2012 Sb. a 98/2013 Sb. — hlava třetí, Vláda
    url: https://www.psp.cz/docs/laws/constitution.html
    archive_url: https://web.archive.org/web/20260726130412/https://www.psp.cz/docs/laws/constitution.html
    lang: cs
    published: 1992-12-16
    accessed: 2026-07-28
    quote: |-
      Článek 67
      (1) Vláda je vrcholným orgánem výkonné moci.
      (2) Vláda se skládá z předsedy vlády, místopředsedů vlády a ministrů.
      Článek 68
      (1) Vláda je odpovědna Poslanecké sněmovně.
      (2) Předsedu vlády jmenuje prezident republiky a na jeho návrh jmenuje ostatní členy vlády a pověřuje je řízením ministerstev nebo jiných úřadů.
      (3) Vláda předstoupí do třiceti dnů po svém jmenování před Poslaneckou sněmovnu a požádá ji o vyslovení důvěry.
    note: >-
      Cited for three facts this file rests on: that the government consists of the předseda
      vlády, the místopředsedové vlády and the ministers, which is what makes the Prime
      Minister's cabinet seat a matter of constitutional law rather than of our interpretation;
      that the President appoints the members of the government and charges them with running
      "ministerstev nebo jiných úřadů", which is the constitutional basis for a minister
      without a ministry; and that a newly appointed government must seek the confidence of the
      Chamber of Deputies within thirty days, which is why the appointment date and the
      confidence date differ. The Chamber of Deputies' static publication of the constitutional
      Act is cited rather than e-Sbírka because it can actually be archived — see the note on
      the source above. Its text of articles 67 and 68 is identical, word for word, to the
      consolidated redaction e-Sbírka publishes as in force from 1 January 2026, and articles
      67 and 68 have not been amended since 1993. The published date is the date the Act was
      adopted.

