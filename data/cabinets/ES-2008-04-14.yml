    lang: es
    published: 2009-04-07
    accessed: 2026-07-29
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado se estructura en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores y de Cooperación.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Economía y Hacienda.
      Ministerio del Interior.
      Ministerio de Fomento.
      Ministerio de Educación.
      Ministerio de Trabajo e Inmigración.
      Ministerio de Industria, Turismo y Comercio.
      Ministerio de Medio Ambiente, y Medio Rural y Marino.
      Ministerio de la Presidencia.
      Ministerio de Política Territorial.
      Ministerio de Cultura.
      Ministerio de Sanidad y Política Social.
      Ministerio de Vivienda.
      Ministerio de Ciencia e Innovación.
      Ministerio de Igualdad.
    note: >-
      Entered into force on the day of publication. Also the evidence that Education
      assumed universities, which article 8 assigns to it alongside schools and vocational
      training.

  - id: boe-rd-1313-2010
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 1313/2010, de 20 de octubre, por el que se reestructuran los
      departamentos ministeriales
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2010-16023
    archive_url: https://web.archive.org/web/20250123234352/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2010-16023
    lang: es
    published: 2010-10-21
    accessed: 2026-07-29
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado se estructura en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores y de Cooperación.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Economía y Hacienda.
      Ministerio del Interior.
      Ministerio de Fomento.
      Ministerio de Educación.
      Ministerio de Trabajo e Inmigración.
      Ministerio de Industria, Turismo y Comercio.
      Ministerio de Medio Ambiente, y Medio Rural y Marino.
      Ministerio de la Presidencia.
      Ministerio de Política Territorial y Administración Pública.
      Ministerio de Cultura.
      Ministerio de Sanidad, Política Social e Igualdad.
      Ministerio de Ciencia e Innovación.
      [...]
      Disposición final primera. Supresión de órganos.
      Quedan suprimidos los siguientes departamentos ministeriales:
      Ministerio de Política Territorial.
      Ministerio de Sanidad y Política Social.
      Ministerio de Vivienda.
      Ministerio de Igualdad.
    note: >-
      Four departments suppressed and two created, which is how 17 becomes 15. The elision
      marked in the quote skips articles 2 to 16, which define each department in the same
      order as article 1. Article 7 assigns housing to Public Works.

  - id: boe-rd-436-2008
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 436/2008, de 12 de abril, por el que se nombran Ministros del Gobierno
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2008-6526
    archive_url: https://web.archive.org/web/20250124043042/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2008-6526
    lang: es
    published: 2008-04-14
    accessed: 2026-07-29
    quote: |-
      Ministro de Asuntos Exteriores y de Cooperación a don Miguel Ángel Moratinos Cuyaubé.
      Ministro de Justicia a don Mariano Fernández Bermejo.
      Ministra de Defensa a doña Carme Chacón Piqueras.
      Ministro de Economía y Hacienda a don Pedro Solbes Mira.
      Ministro del Interior a don Alfredo Pérez Rubalcaba.
      Ministra de Fomento a doña Magdalena Álvarez Arza.
      Ministra de Educación, Política Social y Deporte a doña Mercedes Cabrera Calvo-Sotelo.
      Ministro de Trabajo e Inmigración a don Celestino Corbacho Chaves.
      Ministro de Industria, Turismo y Comercio a don Miguel Sebastián Gascón.
      Ministra de Medio Ambiente, y Medio Rural y Marino a doña Elena Espinosa Mangana.
      Ministra de la Presidencia a doña María Teresa Fernández de la Vega Sanz.
      Ministra de Administraciones Públicas a doña Elena Salgado Méndez.
      Ministro de Cultura a don César Antonio Molina Sánchez.
      Ministro de Sanidad y Consumo a don Bernat Soria Escoms.
      Ministra de Vivienda a doña Beatriz Corredor Sierra.
      Ministra de Ciencia e Innovación a doña Cristina Garmendia Mendizábal.
      Ministra de Igualdad a doña Bibiana Aído Almagro.
    note: >-
      Seventeen ministers for seventeen departments, one each, which is what makes the seat
      count 18 once the Prime Minister is added. It also shows that the two vice-presidents
      appointed the same day each headed a department: the first was Minister of the
      Presidency and the second Minister of Economy and Finance. No minister was appointed
      without a portfolio.

