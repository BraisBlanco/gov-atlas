# Spain — government structure of the IX legislature (2008-2011).
#
# The hardest of the historical Spanish cabinets, and the reason it was curated first:
# its department structure changed twice mid-term, so the file exercises the whole
# valid_from / valid_to mechanism rather than describing one static list.
#
#   2008-04-14  Real Decreto 432/2008   17 departments
#   2009-04-07  Real Decreto 542/2009   17 departments, three of them different
#   2010-10-21  Real Decreto 1313/2010  15 departments
#
# The April 2009 step is the interesting one: the count does not move, so anything that
# plots only the number shows a flat line across a reshuffle that renamed three
# departments. That is why the departments in force on a given date are recorded here
# individually instead of as a total.
#
# Departments that lasted the whole term carry no dates. Departments that began or ended
# mid-term carry them, and remain counted for the period they existed — closing an entity
# with a date is what removes it from later snapshots, so they keep counting as ministries.

country: ES
cabinet_id: ES-2008-04-14

cabinet_name_original: Gobierno de España, IX Legislatura
cabinet_name_en: Government of Spain, 9th legislature
cabinet_name_es: Gobierno de España, IX Legislatura

head_of_government_title_original: Presidente del Gobierno
head_of_government_title_en: Prime Minister

took_office: 2008-04-14
left_office: 2011-12-21

methodology_notes:
  - en: >-
      This government's department structure changed twice while it was in office. It began
      with 17 ministerial departments on 14 April 2008, still had 17 after the restructuring
      of 7 April 2009, and fell to 15 on 21 October 2010, when the Ministries of Housing and
      of Equality were abolished. Any single figure for this term is therefore incomplete
      without its date.
    es: >-
      La estructura departamental de este Gobierno cambió dos veces durante su mandato.
      Comenzó con 17 departamentos ministeriales el 14 de abril de 2008, seguía teniendo 17
      tras la reestructuración del 7 de abril de 2009 y bajó a 15 el 21 de octubre de 2010,
      cuando se suprimieron los Ministerios de Vivienda y de Igualdad. Cualquier cifra
      única para esta legislatura queda incompleta sin su fecha.
  - en: >-
      The April 2009 restructuring left the total unchanged at 17 while replacing three
      departments: Education, Social Policy and Sport became Education, Public
      Administration became Territorial Policy, and Health and Consumer Affairs became
      Health and Social Policy. A reader following only the total would see no change at
      all.
    es: >-
      La reestructuración de abril de 2009 dejó el total en 17 pero sustituyó tres
      departamentos: Educación, Política Social y Deporte pasó a ser Educación,
      Administraciones Públicas pasó a ser Política Territorial, y Sanidad y Consumo pasó a
      ser Sanidad y Política Social. Quien siguiera únicamente el total no vería ningún
      cambio.
  - en: >-
      Cabinet seats outnumber departments by one throughout the term: 18 seats against 17
      departments until October 2010, and 16 against 15 afterwards. The Prime Minister holds
      a seat without heading a department. Every vice-presidency in this government was held
      by a serving minister — the first vice-president was also Minister of the Presidency
      in 2008 and Minister of the Interior in 2010, the second was Minister of Economy and
      Finance, and the third was Minister of Territorial Policy — so no vice-presidency adds
      either a department or a seat.
    es: >-
      Los asientos en el Consejo de Ministros superan en uno a los departamentos durante
      toda la legislatura: 18 asientos frente a 17 departamentos hasta octubre de 2010, y 16
      frente a 15 después. El presidente del Gobierno ocupa un asiento sin encabezar
      departamento alguno. Todas las vicepresidencias de este Gobierno las ostentaron
      ministros en ejercicio —el vicepresidente primero fue además ministro de la
      Presidencia en 2008 y ministro del Interior en 2010, el segundo fue ministro de
      Economía y Hacienda y el tercero ministro de Política Territorial—, por lo que ninguna
      vicepresidencia añade departamento ni asiento.
  - en: >-
      Two departments took on new responsibilities without being renamed, and the areas
      listed for them cover the whole term rather than a single moment. Public Works absorbed
      housing policy on 21 October 2010, when the Ministry of Housing was abolished.
      Universities moved out of Science and Innovation and into Education on 7 April 2009.
    es: >-
      Dos departamentos asumieron nuevas competencias sin cambiar de nombre, y las materias
      que aquí figuran para ellos abarcan toda la legislatura, no un momento concreto.
      Fomento absorbió la política de vivienda el 21 de octubre de 2010, al suprimirse el
      Ministerio de Vivienda. Las universidades salieron de Ciencia e Innovación y pasaron a
      Educación el 7 de abril de 2009.

sources:
  - id: boe-rd-432-2008
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 432/2008, de 12 de abril, por el que se reestructuran los departamentos
      ministeriales
    url: https://www.boe.es/boe/dias/2008/04/14/pdfs/A19757-19759.pdf
    archive_url: https://web.archive.org/web/20250625094522/https://www.boe.es/boe/dias/2008/04/14/pdfs/A19757-19759.pdf
    lang: es
    published: 2008-04-14
    accessed: 2026-07-29
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado queda estructurada en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores y de Cooperación.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Economía y Hacienda.
      Ministerio del Interior.
      Ministerio de Fomento.
      Ministerio de Educación, Política Social y Deporte.
      Ministerio de Trabajo e Inmigración.
      Ministerio de Industria, Turismo y Comercio.
      Ministerio de Medio Ambiente, y Medio Rural y Marino.
      Ministerio de la Presidencia.
      Ministerio de Administraciones Públicas.
      Ministerio de Cultura.
      Ministerio de Sanidad y Consumo.
      Ministerio de Vivienda.
      Ministerio de Ciencia e Innovación.
      Ministerio de Igualdad.
    note: >-
      The original text as published, cited rather than the consolidated version: the
      consolidated text of a superseded decree cannot show the structure that was in force
      in April 2008. Scanned facsimile of pages 19757-19759 of issue 90.

  - id: boe-rd-542-2009
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 542/2009, de 7 de abril, por el que se reestructuran los departamentos
