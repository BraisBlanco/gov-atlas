    note:
      en: >-
        Took over schools and vocational training from Education, Social Policy and Sport,
        and universities from Science and Innovation. Social policy went to Health instead,
        which is why this is a new department rather than a renaming.
      es: >-
        Asumió la educación y la formación profesional de Educación, Política Social y
        Deporte, y las universidades de Ciencia e Innovación. La política social pasó en
        cambio a Sanidad, y por eso se trata de un departamento nuevo y no de un cambio de
        nombre.

