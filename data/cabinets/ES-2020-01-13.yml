# Spain — government structure of the XIV legislature (2020-2023).
#
# Twenty-two departments, the largest in the Spanish series and five more than the government
# before it. Two of them were renamed in July 2021 without the total changing, so this file
# records two structural states: the departments in force from January 2020, and the same
# twenty-two with two different names from 12 July 2021.
#
# The original enumeration keeps listing positions 1 to 22. The two names that replaced entries
# 4 and 12 partway through appear at the end, because listing order has to be unique within a
# file and cannot hold two occupants of the same position.

country: ES
cabinet_id: ES-2020-01-13

cabinet_name_original: Gobierno de España, XIV Legislatura
cabinet_name_en: Government of Spain, 14th legislature
cabinet_name_es: Gobierno de España, XIV Legislatura

head_of_government_title_original: Presidente del Gobierno
head_of_government_title_en: Prime Minister

took_office: 2020-01-13
left_office: 2023-11-20

methodology_notes:
  - en: >-
      Twenty-two ministerial departments, five more than the government before it and the
      largest cabinet in this series. Consumer affairs, equality, universities, and inclusion
      with social security and migration each got a department of their own, and science was
      separated from universities.
    es: >-
      Veintidós departamentos ministeriales, cinco más que el Gobierno anterior y el gabinete
      más numeroso de esta serie. El consumo, la igualdad, las universidades y la inclusión con
      la seguridad social y las migraciones obtuvieron cada uno departamento propio, y la
      ciencia se separó de las universidades.
  - en: >-
      Twenty-three seats against twenty-two departments: the Prime Minister holds a seat without
      heading a department. This government had four vice-presidents, more than any other in the
      series, and every one of them headed a listed department — the Presidency, social rights,
      economic affairs and ecological transition — so none adds a seat. No minister was appointed
      without a portfolio.
    es: >-
      Veintitrés asientos frente a veintidós departamentos: el presidente del Gobierno ocupa un
      asiento sin encabezar departamento. Este Gobierno tuvo cuatro vicepresidencias, más que
      ningún otro de la serie, y todas ellas encabezaban un departamento de la lista —Presidencia,
      derechos sociales, asuntos económicos y transición ecológica—, por lo que ninguna añade
      asiento. Ningún ministro fue nombrado sin cartera.
  - en: >-
      On 12 July 2021 two departments were renamed and the total stayed at twenty-two: the civil
      service moved from territorial policy to finance, so finance became the Ministry of Finance
      and the Civil Service and territorial policy dropped the words from its title. Both names
      are recorded with the dates each was in use, rather than one being applied to the whole
      term.
    es: >-
      El 12 de julio de 2021 dos departamentos cambiaron de nombre y el total siguió en
      veintidós: la función pública pasó de Política Territorial a Hacienda, de modo que Hacienda
      pasó a ser Ministerio de Hacienda y Función Pública y Política Territorial suprimió esas
      palabras de su título. Se registran ambos nombres con las fechas en que estuvo vigente cada
      uno, y no uno de ellos aplicado a toda la legislatura.
  - en: >-
      Three further decrees, in January and July 2020 and in July 2021, amended the internal
      organisation of individual departments without touching the list of departments. They
      change neither figure reported here.
    es: >-
      Otros tres decretos, de enero y julio de 2020 y de julio de 2021, modificaron la
      organización interna de departamentos concretos sin afectar a la lista de departamentos. No
      alteran ninguna de las dos cifras que aquí se recogen.

sources:
  - id: boe-rd-2-2020
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 2/2020, de 12 de enero, por el que se reestructuran los departamentos
      ministeriales
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2020-410
    archive_url: https://web.archive.org/web/20260512041701/https://boe.es/diario_boe/txt.php?id=BOE-A-2020-410
    lang: es
    published: 2020-01-13
    accessed: 2026-07-29
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado se estructura en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores, Unión Europea y Cooperación.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Hacienda.
      Ministerio del Interior.
      Ministerio de Transportes, Movilidad y Agenda Urbana.
      Ministerio de Educación y Formación Profesional.
      Ministerio de Trabajo y Economía Social.
      Ministerio de Industria, Comercio y Turismo.
      Ministerio de Agricultura, Pesca y Alimentación.
      Ministerio de la Presidencia, Relaciones con las Cortes y Memoria Democrática.
      Ministerio de Política Territorial y Función Pública.
      Ministerio para la Transición Ecológica y el Reto Demográfico.
      Ministerio de Cultura y Deporte.
      Ministerio de Asuntos Económicos y Transformación Digital.
      Ministerio de Sanidad.
      Ministerio de Derechos Sociales y Agenda 2030.
      Ministerio de Ciencia e Innovación.
      Ministerio de Igualdad.
      Ministerio de Consumo.
      Ministerio de Inclusión, Seguridad Social y Migraciones.
      Ministerio de Universidades.
    note: >-
      The text as published, in force the same day, and the source for the names in use from
      January 2020 to 11 July 2021. Article 1 was rewritten in July 2021; two other decrees in
      2020 and one in 2021 amended individual departments' internal organisation only.

  - id: boe-rd-507-2021
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 507/2021, de 10 de julio, por el que se modifica el Real Decreto 2/2020, de 12
      de enero, por el que se reestructuran los departamentos ministeriales
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2021-11510
    archive_url: https://web.archive.org/web/20260201195038/https://boe.es/diario_boe/txt.php?id=BOE-A-2021-11510
    lang: es
    published: 2021-07-12
    accessed: 2026-07-29
    quote: |-
      Uno. El artículo 1 queda redactado de la siguiente manera:
      «Artículo 1. Departamentos ministeriales.
      La Administración General del Estado se estructura en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores, Unión Europea y Cooperación.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Hacienda y Función Pública.
      Ministerio del Interior.
      Ministerio de Transportes, Movilidad y Agenda Urbana.
      Ministerio de Educación y Formación Profesional.
      Ministerio de Trabajo y Economía Social.
      Ministerio de Industria, Comercio y Turismo.
      Ministerio de Agricultura, Pesca y Alimentación.
      Ministerio de la Presidencia, Relaciones con las Cortes y Memoria Democrática.
      Ministerio de Política Territorial.
      Ministerio para la Transición Ecológica y el Reto Demográfico.
      Ministerio de Cultura y Deporte.
      Ministerio de Asuntos Económicos y Transformación Digital.
      Ministerio de Sanidad.
      Ministerio de Derechos Sociales y Agenda 2030.
      Ministerio de Ciencia e Innovación.
      Ministerio de Igualdad.
      Ministerio de Consumo.
      Ministerio de Inclusión, Seguridad Social y Migraciones.
      Ministerio de Universidades.»
    note: >-
      Still twenty-two departments: entries 4 and 12 change name and nothing else does. In force
      the day it was published, which is why the two earlier names end on 11 July 2021.

  - id: boe-rd-8-2020
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 8/2020, de 12 de enero, por el que se nombran Ministros del Gobierno
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2020-416
    archive_url: https://web.archive.org/web/20260726082609/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2020-416
    lang: es
    published: 2020-01-13
    accessed: 2026-07-29
    quote: |-
      Ministra de la Presidencia, Relaciones con las Cortes y Memoria Democrática a doña María del Carmen Calvo Poyato.
      Ministra para la Transición Ecológica y el Reto Demográfico a doña Teresa Ribera Rodríguez.
      Ministra de Asuntos Económicos y Transformación Digital a doña Nadia María Calviño Santamaría.
      Ministro de Derechos Sociales y Agenda 2030 a don Pablo Iglesias Turrión.
      Ministra de Igualdad a doña Irene María Montero Gil.
      Ministro de Consumo a don Alberto Carlos Garzón Espinosa.
      Ministro de Inclusión, Seguridad Social y Migraciones a don José Luis Escrivá Belmonte.
      Ministro de Universidades a don Manuel Castells Oliván.
    note: >-
      Twenty-two ministers for twenty-two departments, one each and none without a portfolio,
      which is what makes the seat count twenty-three once the Prime Minister is added. The quote
      covers the four departments headed by the vice-presidents appointed the same day, along
      with the four created in this term.

  - id: boe-ley-50-1997
    tier: 1
    type: statute
    publisher: Boletín Oficial del Estado
    title: Ley 50/1997, de 27 de noviembre, del Gobierno (texto consolidado)
    url: https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    archive_url: https://web.archive.org/web/20260716135650/https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    lang: es
    published: 1997-11-28
    accessed: 2026-07-29
    quote: >-
      El Gobierno se compone del Presidente, del Vicepresidente o Vicepresidentes, en su
      caso, y de los Ministros.
    note: >-
      Cited for the composition of the Government, which is what makes the Prime Minister's
      seat a matter of statute rather than of interpretation.

