    counts_as_ministry: true
    url: https://www.auswaertiges-amt.de
    sources: [bgbl-2025-i-343-haushaltsgesetz-2026, bundesregierung-bundesministerien]
    note:
      en: >-
        The only counted department not called a "Bundesministerium": it keeps the older
        title Auswärtiges Amt, and its head is styled Bundesminister des Auswärtigen rather
        than Bundesminister für Auswärtiges. Einzelplan 05 of the budget act lists it among
        the departments, and it is counted on the same footing as the other 15. Two
        competences left it under the Organisationserlass of 6 May 2025 and are tagged to
        the receiving ministries instead: international climate policy and climate
        negotiations went to the environment ministry, and cultural and media relations
        concerning German minorities went to the interior ministry. "Federal Foreign
        Office" is the office's own English usage, but no archived snapshot of the page
        publishing it could be obtained, so the provenance is recorded conservatively as
        translated.
      es: >-
        El único departamento contado que no se denomina «Bundesministerium»: conserva el
        título histórico de Auswärtiges Amt, y su titular se intitula Bundesminister des
        Auswärtigen y no Bundesminister für Auswärtiges. El Einzelplan 05 de la ley de
        presupuestos lo enumera entre los departamentos, y se cuenta en igualdad con los
        otros 15. Dos competencias salieron de él con el Organisationserlass del 6 de mayo
        de 2025 y se etiquetan en los ministerios receptores: la política climática
        internacional y las negociaciones climáticas pasaron al ministerio de Medio
        Ambiente, y las relaciones culturales y mediáticas relativas a las minorías
        alemanas al ministerio del Interior. «Federal Foreign Office» es el uso inglés
        propio del organismo, pero no se pudo obtener copia archivada de la página que lo
        publica, por lo que la procedencia se registra de forma conservadora como
        traducción.

