  - id: DE-2025-digitales-staatsmodernisierung
    order: 15
    name_original: Bundesministerium für Digitales und Staatsmodernisierung
    abbreviation_original: BMDS
    name_en: Federal Ministry for Digital Transformation and Government Modernisation
    name_es: Ministerio Federal de Digitalización y Modernización del Estado
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister/in für Digitales und Staatsmodernisierung
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [digital, public_administration, telecommunications]
    counts_as_ministry: true
    url: https://www.bmds.bund.de
    sources: [bgbl-2025-i-131, bgbl-2025-i-343-haushaltsgesetz-2026, bundesregierung-bundesministerien]
    note:
      en: >-
        The only genuinely new department of this cabinet, created outright by section I of the
        Organisationserlass of 6 May 2025 — "Es wird ein Bundesministerium für Digitales und
        Staatsmodernisierung gebildet" — and assembled in section XII out of competences taken
        from the Chancellery and five existing ministries: digital administration, federal IT
        and its infrastructure, cybersecurity in the federal administration, the federal
        networks, network infrastructures, digital and data policy, better regulation and the
        reduction of bureaucracy, and the lead on implementing the EU AI Act. Section XIII gives
        it a consent veto over all material IT spending of the direct federal administration,
        with defence, police and intelligence and the tax administration carved out. Because it
        did not exist before 6 May 2025 and this cabinet took office on that same date, no
        valid_from is set: the entity is valid for the whole term. Its budget section, Einzelplan
        24, appears in the Haushaltsgesetz 2026 with no comparative figure for 2025, which is
        what a department created mid-year looks like in the gazette.
      es: >-
        El único departamento auténticamente nuevo de este gabinete, creado de raíz por la
        sección I del Organisationserlass del 6 de mayo de 2025 — «Es wird ein
        Bundesministerium für Digitales und Staatsmodernisierung gebildet» — y ensamblado en la
        sección XII con competencias tomadas de la Cancillería y de cinco ministerios
        existentes: administración digital, informática federal y su infraestructura,
        ciberseguridad en la administración federal, las redes del Estado, infraestructuras de
        red, política digital y de datos, mejora de la regulación y reducción de burocracia, y
        la dirección de la aplicación del Reglamento europeo de IA. La sección XIII le otorga
        un veto de conformidad sobre todo gasto informático relevante de la administración
        federal directa, con excepción de defensa, policía e inteligencia y la administración
        tributaria. Como no existía antes del 6 de mayo de 2025 y este gabinete tomó posesión
        esa misma fecha, no se fija valid_from: la entidad es válida para toda la legislatura.
        Su sección presupuestaria, el Einzelplan 24, figura en la Ley de Presupuestos de 2026
        sin cifra comparativa para 2025, que es el aspecto que tiene en el boletín un
        departamento creado a mitad de año.

