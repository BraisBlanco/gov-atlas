# Germany — federal government structure of the 21st Bundestag (Merz cabinet).
#
# Read docs/DATA-CONTRACT.md alongside this file. Three things to notice:
#
#   1. Nowhere does this file state "16". The count is derived from the entities below.
#   2. Germany has no statute that enumerates its ministries. The Chancellor's
#      Organisationserlass *renames* and *reassigns* departments but never lists them all
#      (it does not mention the Bundesministerium für Gesundheit at all), so the full
#      enumeration is taken from a second tier-1 instrument: the Gesamtplan of the
#      Haushaltsgesetz 2026, which names every Einzelplan.
#   3. The Bundeskanzleramt is recorded and deliberately not counted. See the first
#      methodology note: 16 as published, 17 if the Chancellery is treated as a ministry.

country: DE
cabinet_id: DE-2025-05-06

cabinet_name_original: Bundesregierung Merz, 21. Wahlperiode des Deutschen Bundestages
cabinet_name_en: Federal Government of Germany (Merz cabinet), 21st Bundestag
cabinet_name_es: Gobierno Federal de Alemania (gabinete Merz), 21.ª legislatura del Bundestag

head_of_government_title_original: Bundeskanzler
head_of_government_title_en: Federal Chancellor

took_office: 2025-05-06
left_office: null

methodology_notes:
  - en: >-
      The Federal Chancellery is the contested case in Germany, and it is the reason this
      country is counted as 16 rather than 17. Germany is counted here as having 16
      federal ministries; it has 17 if the Bundeskanzleramt is treated as a ministry.
      Three pieces of evidence support excluding it. Article 62 of the Basic Law defines
      the Federal Government as the Chancellor plus the federal ministers, and names no
      chancellery. The Gesamtplan of the Haushaltsgesetz 2026 gives the Chancellery its
      own budget section, Einzelplan 04, headed "Bundeskanzler und Bundeskanzleramt" —
      pointedly not "Bundesministerium" — while all 16 departments carry that word. And
      the Federal Government's own portal states that "16 Bundesministerien sind Teil der
      Bundesregierung" and does not list the Chancellery among them. Against that: the
      Chancellery is a supreme federal authority headed by a person of full ministerial
      rank, and the Organisationserlass of 6 May 2025 moves competences into and out of
      the "Geschäftsbereich des Bundeskanzleramtes" in exactly the same language it uses
      for ministries. A reader who prefers that reading should add one to every figure
      this site publishes for Germany.
    es: >-
      La Cancillería Federal es el caso discutido en Alemania, y es la razón por la que
      este país se cuenta como 16 y no como 17. Aquí se cuentan 16 ministerios federales;
      serían 17 si se considerase el Bundeskanzleramt como ministerio. Tres elementos
      respaldan su exclusión. El artículo 62 de la Ley Fundamental define el Gobierno
      Federal como el canciller más los ministros federales, y no menciona ninguna
      cancillería. El Gesamtplan de la Ley de Presupuestos de 2026 asigna a la Cancillería
      su propia sección presupuestaria, el Einzelplan 04, titulada «Bundeskanzler und
      Bundeskanzleramt» —y no «Bundesministerium»—, mientras que los 16 departamentos sí
      llevan esa palabra. Y el propio portal del Gobierno Federal afirma que «16
      Bundesministerien sind Teil der Bundesregierung» sin incluir la Cancillería entre
      ellos. En contra: la Cancillería es una autoridad federal suprema encabezada por
      una persona con rango pleno de ministro, y el Organisationserlass del 6 de mayo de
      2025 traslada competencias hacia y desde el «Geschäftsbereich des
      Bundeskanzleramtes» con el mismo lenguaje que emplea para los ministerios. Quien
      prefiera esa lectura debe sumar uno a todas las cifras que este sitio publica sobre
      Alemania.
  - en: >-
      Germany produces three different numbers, and they are not interchangeable. There
      are 16 federal ministries. There are 17 federal ministers, because the Head of the
      Federal Chancellery also holds the office of Bundesminister für besondere Aufgaben —
      a minister with cabinet rank and no portfolio department. And there are 18 members
      of the cabinet, once the Chancellor is added; the Federal Government's own cabinet
      page says the government "besteht aus Bundeskanzler Friedrich Merz sowie 17
      Bundesministerinnen und -ministern". This dataset therefore publishes
      ministries_count 16 and cabinet_seats_count 18. Neither figure is wrong and they are
      never added together.
    es: >-
      Alemania arroja tres cifras distintas que no son intercambiables. Hay 16 ministerios
      federales. Hay 17 ministros federales, porque el jefe de la Cancillería Federal
      ostenta además el cargo de Bundesminister für besondere Aufgaben, un ministro con
      rango de gabinete y sin departamento. Y hay 18 miembros del gabinete, sumando al
      canciller; la propia página del gabinete del Gobierno Federal dice que el gobierno
      «besteht aus Bundeskanzler Friedrich Merz sowie 17 Bundesministerinnen und
      -ministern». Este conjunto de datos publica por tanto ministries_count 16 y
      cabinet_seats_count 18. Ninguna de las dos cifras es incorrecta y nunca se suman.
  - en: >-
      Germany is a federal state and this file covers the Bundesregierung only. Each of
      the 16 Länder has its own cabinet of Landesministerien, and those departments hold
      primary competence for areas that in a centralised state such as Spain sit with a
      national ministry — school education, policing, culture and broadcasting above all.
      State ministries are out of scope for this dataset, so they are not listed at all
      rather than listed and excluded. A reader comparing Germany's 16 with Spain's 22 is
      therefore not comparing like with like in terms of governmental reach: the German
      figure covers a narrower slice of public administration.
    es: >-
      Alemania es un Estado federal y este fichero cubre únicamente la Bundesregierung.
      Cada uno de los 16 Länder tiene su propio gabinete de Landesministerien, y esos
      departamentos ostentan la competencia principal en materias que en un Estado
      centralizado como España corresponden a un ministerio nacional: sobre todo educación
      escolar, policía, cultura y radiodifusión. Los ministerios de los Länder quedan
      fuera del alcance de este conjunto de datos, por lo que no se listan en absoluto en
      lugar de listarse y excluirse. Quien compare los 16 de Alemania con los 22 de España
      no está comparando alcances de gobierno equivalentes: la cifra alemana cubre una
      porción más estrecha de la administración pública.
  - en: >-
      No German statute enumerates the federal ministries. The Chancellor constitutes,
      renames and dissolves them by Organisationserlass under Article 64 of the Basic Law,
      and the decree of 6 May 2025 creates one ministry and renames eight, but it never
      states the full list — it does not mention the Bundesministerium für Gesundheit at
      all, because nothing about that department changed. The complete enumeration is
      therefore taken from a second legal instrument, the Gesamtplan of the Haushaltsgesetz
      2026, which names every Einzelplan of the federal budget and so names all 16
      ministries. Both are tier-1 sources and they agree with each other and with the
      Federal Government's portal on the figure 16.
    es: >-
      Ninguna ley alemana enumera los ministerios federales. El canciller los crea,
      renombra y suprime mediante Organisationserlass al amparo del artículo 64 de la Ley
      Fundamental, y el decreto del 6 de mayo de 2025 crea un ministerio y renombra ocho,
      pero no enuncia la lista completa: no menciona en absoluto el Bundesministerium für
      Gesundheit, porque nada cambió en ese departamento. La enumeración completa se toma
      por ello de un segundo instrumento jurídico, el Gesamtplan de la Ley de Presupuestos
      de 2026, que nombra todos los Einzelpläne del presupuesto federal y con ello los 16
      ministerios. Ambas son fuentes de nivel 1 y coinciden entre sí y con el portal del
      Gobierno Federal en la cifra de 16.
  - en: >-
      The Vice-Chancellorship is a personal office held by a serving minister — currently
      by the Federal Minister of Finance — and adds neither a ministry nor a cabinet seat.
      Which minister holds it changes with reshuffles; the department structure does not,
      and only the latter is recorded here.
    es: >-
      La vicecancillería es un cargo personal que ostenta un ministro en ejercicio —
      actualmente el ministro federal de Hacienda — y no añade ni ministerio ni asiento en
      el gabinete. Quién la ostenta cambia con cada remodelación; la estructura
      departamental no, y aquí sólo se registra esta última.
  - en: >-
      Parlamentarische Staatssekretäre and Staatssekretäre are subordinate to a minister
      and work inside an existing department, so they are neither ministries nor cabinet
      seats and are not listed individually. One Staatsminister is recorded, because
      omitting it would hide a genuine structural fact: Germany has no culture ministry.
      Federal culture and media policy is run by the Beauftragte der Bundesregierung für
      Kultur und Medien, a Staatsminister attached directly to the Chancellor who heads a
      supreme federal authority of some 430 staff. That office attends cabinet meetings but
      its holder is not a Bundesminister, so under Article 62 of the Basic Law it is not a
      member of the Federal Government and it is recorded with no cabinet seat. A curator
      who counted meeting attendance as a seat would publish 19 seats rather than 18.
    es: >-
      Los Parlamentarische Staatssekretäre y los Staatssekretäre están subordinados a un
      ministro y encuadrados en un departamento existente, por lo que no son ministerios ni
      asientos de gabinete y no se listan individualmente. Sí se registra un Staatsminister,
      porque omitirlo ocultaría un hecho estructural real: Alemania no tiene ministerio de
      Cultura. La política federal de cultura y medios la dirige el Beauftragte der
      Bundesregierung für Kultur und Medien, un Staatsminister adscrito directamente al
      canciller que encabeza una autoridad federal suprema con unos 430 efectivos. Ese
      cargo asiste a las reuniones del gabinete, pero su titular no es Bundesminister, de
      modo que conforme al artículo 62 de la Ley Fundamental no es miembro del Gobierno
      Federal y se registra sin asiento en el gabinete. Un curador que contase la
      asistencia a las reuniones como asiento publicaría 19 asientos en lugar de 18.
  - en: >-
      The cabinet reshuffle announced on 24 July 2026 moved people, not departments: the
      Health Minister became Head of the Federal Chancellery and Federal Minister for
      Special Tasks, a member of the Bundestag took over the health portfolio, and a new
      Staatsminister for federal-state relations was appointed in the Chancellery. No
      ministry was created, renamed, merged or abolished, so no entity in this file carries
      a valid_to or a new valid_from. This dataset records departmental structure, not
      officeholders.
    es: >-
      La remodelación del gabinete anunciada el 24 de julio de 2026 cambió personas, no
      departamentos: la ministra de Sanidad pasó a jefa de la Cancillería Federal y
      ministra federal para Tareas Especiales, un diputado del Bundestag asumió la cartera
      de Sanidad y se nombró un nuevo Staatsminister para las relaciones entre la
      Federación y los Länder en la Cancillería. No se creó, renombró, fusionó ni suprimió
      ningún ministerio, por lo que ninguna entidad de este fichero lleva valid_to ni un
      valid_from nuevo. Este conjunto de datos registra la estructura departamental, no a
      los titulares.
  - en: >-
      English and Spanish ministry names here are the project's renderings, marked
      name_en_provenance and name_es_provenance accordingly, with three exceptions. The
      German Federal Government publishes English titles for its ministers but no
      consolidated English list of ministry names, and its ministries' own English sites
      are not uniform. Where a ministry publishes its own English name on its own site and
      that page could be archived and checked — Finance, Health, and Economic Cooperation
      and Development — the English name is marked official and the ministry's English
      page is cited. Everything else, including "Federal Foreign Office" for the
      Auswärtiges Amt, is recorded as translated: that particular name is in fact the
      office's own English usage, but no snapshot of the page could be obtained, and an
      unverifiable claim of officialness is worse than an understated one.
    es: >-
      Los nombres de ministerios en inglés y español son aquí traducciones del proyecto,
      señaladas como tales en name_en_provenance y name_es_provenance, con tres
      excepciones. El Gobierno Federal alemán publica títulos en inglés de sus ministros
      pero ninguna lista consolidada de nombres de ministerios en inglés, y las webs en
      inglés de sus ministerios no son uniformes. Cuando un ministerio publica su propio
      nombre en inglés en su web y esa página se ha podido archivar y comprobar — Hacienda,
      Sanidad y Cooperación Económica y Desarrollo — el nombre inglés se marca como oficial
      y se cita la página inglesa del ministerio. Todo lo demás, incluido «Federal Foreign
      Office» para el Auswärtiges Amt, se registra como traducción: ese nombre es de hecho
      el uso inglés propio de dicho organismo, pero no se pudo obtener ninguna copia
      archivada de la página, y una afirmación de oficialidad no verificable es peor que
      una subestimada.

sources:
  - id: bgbl-2025-i-131
    tier: 1
    type: official_gazette
    publisher: Bundesgesetzblatt
    title: Organisationserlass des Bundeskanzlers vom 6. Mai 2025 (BGBl. 2025 I Nr. 131)
    url: https://www.recht.bund.de/bgbl/1/2025/131/regelungstext.pdf?__blob=publicationFile&v=2
    archive_url: https://web.archive.org/web/20250607155000/https://www.recht.bund.de/bgbl/1/2025/131/regelungstext.pdf?__blob=publicationFile&v=2
    lang: de
    published: 2025-05-09
    accessed: 2026-07-27
    quote: |-
      Gemäß § 9 der Geschäftsordnung der Bundesregierung ordne ich mit sofortiger Wirkung an:
      I.
      Es wird ein Bundesministerium für Digitales und Staatsmodernisierung gebildet.
      II.
      Es erhalten
      1. das Bundesministerium für Wirtschaft und Klimaschutz die Bezeichnung Bundesministerium für Wirtschaft und Energie;
      2. das Bundesministerium des Innern und für Heimat die Bezeichnung Bundesministerium des Innern;
      3. das Bundesministerium der Justiz die Bezeichnung Bundesministerium der Justiz und für Verbraucherschutz;
      4. das Bundesministerium für Ernährung und Landwirtschaft die Bezeichnung Bundesministerium für Landwirtschaft, Ernährung und Heimat;
      5. das Bundesministerium für Familie, Senioren, Frauen und Jugend die Bezeichnung Bundesministerium für Bildung, Familie, Senioren, Frauen und Jugend;
      6. das Bundesministerium für Digitales und Verkehr die Bezeichnung Bundesministerium für Verkehr;
      7. das Bundesministerium für Umwelt, Naturschutz, nukleare Sicherheit und Verbraucherschutz die Bezeichnung Bundesministerium für Umwelt, Klimaschutz, Naturschutz und nukleare Sicherheit;
      8. das Bundesministerium für Bildung und Forschung die Bezeichnung Bundesministerium für Forschung, Technologie und Raumfahrt.
      XVII.
      Dem Geschäftsbereich des Bundeskanzleramtes werden übertragen
      1. aus dem Geschäftsbereich des Bundesministeriums des Innern die Zuständigkeiten für Sportpolitik sowie für das Themenfeld Ehrenamt;
      2. aus dem Geschäftsbereich des Bundesministeriums für Bildung, Familie, Senioren, Frauen und Jugend die Zuständigkeit für die Engagementpolitik.
      Diese Zuständigkeiten werden von einer Staatsministerin beim Bundeskanzler wahrgenommen.
      Berlin, den 6. Mai 2025
      Der Bundeskanzler
      Friedrich Merz
    note: >-
      The decree by which Chancellor Merz constituted the departments of his government
      under Article 64 of the Basic Law, published in the Bundesgesetzblatt three days
      after he took office. This is the instrument that creates the Bundesministerium für
      Digitales und Staatsmodernisierung and fixes the current name of eight other
      ministries, so it is the authority for how those nine are spelled today. It is not,
      however, an enumeration: sections III to XVI and XVIII transfer individual
      competences between named departments and are omitted from the quote, and no section
      lists the ministries as a set — the Bundesministerium für Gesundheit is never
      mentioned, because nothing about it changed. Section XVII is quoted in full because
      it is load-bearing for the Federal Chancellery decision: the decree moves
      competences into the "Geschäftsbereich des Bundeskanzleramtes" in the same language
      it uses for ministerial Geschäftsbereiche. Line breaks that the gazette's typesetting
      introduces mid-sentence are closed up; no words are altered. No later
      Organisationserlass had been published as of 27 July 2026.

  - id: bgbl-2025-i-343-haushaltsgesetz-2026
    tier: 1
    type: statute
    publisher: Bundesgesetzblatt
    title: >-
      Gesetz über die Feststellung des Bundeshaushaltsplans für das Haushaltsjahr 2026
      (Haushaltsgesetz 2026), Gesamtplan – Teil I: Haushaltsübersicht (BGBl. 2025 I Nr. 343)
    url: https://www.recht.bund.de/bgbl/1/2025/343/regelungstext.pdf?__blob=publicationFile&v=3
    archive_url: https://web.archive.org/web/20260109154036/https://www.recht.bund.de/bgbl/1/2025/343/regelungstext.pdf?__blob=publicationFile&v=3
    lang: de
    published: 2025-12-22
    accessed: 2026-07-27
    quote: |-
      Gesamtplan – Teil I: Haushaltsübersicht
      A. Einnahmen
      Epl. Bezeichnung
      01 Bundespräsident und Bundespräsidialamt
      02 Deutscher Bundestag
      03 Bundesrat
      04 Bundeskanzler und Bundeskanzleramt
      05 Auswärtiges Amt
      06 Bundesministerium des Innern
      07 Bundesministerium der Justiz und für Verbraucherschutz
      08 Bundesministerium der Finanzen
      09 Bundesministerium für Wirtschaft und Energie
      10 Bundesministerium für Landwirtschaft, Ernährung und Heimat
      11 Bundesministerium für Arbeit und Soziales
      12 Bundesministerium für Verkehr
      14 Bundesministerium der Verteidigung
      15 Bundesministerium für Gesundheit
      16 Bundesministerium für Umwelt, Klimaschutz, Naturschutz und nukleare Sicherheit
      17 Bundesministerium für Bildung, Familie, Senioren, Frauen und Jugend
      19 Bundesverfassungsgericht
      20 Bundesrechnungshof
      21 Die Bundesbeauftragte für den Datenschutz und die Informationsfreiheit
      22 Unabhängiger Kontrollrat
      23 Bundesministerium für wirtschaftliche Zusammenarbeit und Entwicklung
      24 Bundesministerium für Digitales und Staatsmodernisierung
      25 Bundesministerium für Wohnen, Stadtentwicklung und Bauwesen
      30 Bundesministerium für Forschung, Technologie und Raumfahrt
      32 Bundesschuld
      60 Allgemeine Finanzverwaltung
    note: >-
      The enumerating instrument. Because no German statute lists the ministries as such,
      the budget act does the work: the Gesamtplan attached to it gives every supreme
      federal body its own Einzelplan, and exactly 16 of them are designated
      "Bundesministerium". Enacted on 19 December 2025 and published on 22 December 2025,
      so it reflects the structure after the Organisationserlass of 6 May 2025 — including
      the new Einzelplan 24 for the Bundesministerium für Digitales und
      Staatsmodernisierung. The entity listing order in this file follows this table. Two
      things in the quote are load-bearing beyond the ministry names. Einzelplan 04 is
      headed "Bundeskanzler und Bundeskanzleramt", not "Bundesministerium", which is the
      tier-1 basis for not counting the Chancellery. And Einzelpläne 01, 02, 03, 19, 20,
      21, 22, 32 and 60 show what a non-ministerial supreme federal body looks like in the
      same list. The quote transcribes column 1 (Epl.) and column 2 (Bezeichnung) of the
      Haushaltsübersicht in the gazette's own order; the dot leaders and the three amount
      columns are omitted, and typesetting line breaks inside a designation are closed up.
      Wording is unaltered.

  - id: gg-art-62
    tier: 1
    type: statute
    publisher: Bundesministerium der Justiz und für Verbraucherschutz / Bundesamt für Justiz
    title: Grundgesetz für die Bundesrepublik Deutschland, Artikel 62
    url: https://www.gesetze-im-internet.de/gg/art_62.html
    archive_url: https://web.archive.org/web/20251001164146/https://www.gesetze-im-internet.de/gg/art_62.html
    lang: de
    published: 1949-05-23
    accessed: 2026-07-27
    quote: >-
      Die Bundesregierung besteht aus dem Bundeskanzler und aus den Bundesministern.
    note: >-
      One sentence of constitutional law that settles three questions in this file. It puts
      the Chancellor in the cabinet without giving him a department, which is why
      cabinet_seats_count exceeds ministries_count. It makes every Bundesminister a member
      of the Federal Government whether or not he heads a ministry, which is why the
      Bundesminister für besondere Aufgaben holds a seat. And by naming only the Chancellor
      and the ministers it excludes both the Chancellery as an institution and the
      Staatsminister, who are not Bundesminister, from membership of the Federal
      Government — so the Staatsminister für Kultur und Medien attends cabinet meetings
      without holding a seat in it.

  - id: bundesregierung-bundesministerien
    tier: 2
    type: government_website
    publisher: Bundesregierung — Presse- und Informationsamt der Bundesregierung
    title: Die Bundesministerien im Überblick
    url: https://www.bundesregierung.de/breg-de/bundesregierung/bundesministerien
    archive_url: https://web.archive.org/web/20260722142122/https://www.bundesregierung.de/breg-de/bundesregierung/bundesministerien
    lang: de
    published: null
    accessed: 2026-07-27
    quote: >-
      16 Bundesministerien sind Teil der Bundesregierung. Sie setzen die politischen Ziele
      für ihren Fachbereich um und erarbeiten dafür beispielsweise Gesetze. Zudem
      beaufsichtigen sie die ihnen nachgeordneten Behörden. Finden Sie hier alle
      Ministerien im Überblick.
    note: >-
      The Federal Government's own directory of its ministries, and the reason the derived
      figure of 16 in this file needs no defending against the publisher of the structure:
      the portal states the number itself. The page lists the same 16 departments as the
      Gesamtplan of the Haushaltsgesetz 2026, and it does not list the Bundeskanzleramt
      among them — the Chancellery appears elsewhere on the site, under the Federal
      Government rather than under the ministries. Snapshot of 22 July 2026, two days
      before the reshuffle of 24 July 2026, which changed officeholders but no department.

  - id: bundesregierung-bundeskabinett
    tier: 2
    type: government_website
    publisher: Bundesregierung — Presse- und Informationsamt der Bundesregierung
    title: Das Bundeskabinett im Überblick
    url: https://www.bundesregierung.de/breg-de/bundesregierung/bundeskabinett
    archive_url: https://web.archive.org/web/20260724091005/https://www.bundesregierung.de/breg-de/bundesregierung/bundeskabinett
    lang: de
    published: null
    accessed: 2026-07-27
    quote: >-
      Die aktuelle Bundesregierung besteht aus Bundeskanzler Friedrich Merz sowie 17
      Bundesministerinnen und -ministern. Gemeinsam bilden sie das Bundeskabinett.
      [...] Bundesminister für besondere Aufgaben/Chef des Bundeskanzleramtes
    note: >-
      Cited for cabinet composition and for the exact German wording of the office title
      "Bundesminister für besondere Aufgaben/Chef des Bundeskanzleramtes", which the page
      spells with that slash. This source is what makes the gap between the two published
      figures checkable: 17 federal ministers plus the Chancellor is 18 people in the
      cabinet, while only 16 of those ministers head a ministry. The quote joins the page's
      introductory sentences to the office title as it is listed further down; both are
      verbatim.

  - id: bundesregierung-kabinett-juli-2026
    tier: 2
    type: government_website
    publisher: Bundesregierung — Presse- und Informationsamt der Bundesregierung
    title: Kanzler Merz zu Veränderungen im Kabinett
    url: https://www.bundesregierung.de/breg-de/aktuelles/merz-veraenderungen-im-kabinett--2448244
    archive_url: https://web.archive.org/web/20260724142349/https://www.bundesregierung.de/breg-de/aktuelles/merz-veraenderungen-im-kabinett--2448244
    lang: de
    published: 2026-07-24
    accessed: 2026-07-27
    quote: >-
      Bundeskanzler Merz stellte in einer Pressekonferenz die künftigen neuen Mitglieder
      seines Kabinetts vor. So soll die bisherige Bundesgesundheitsministerin Nina Warken
      als Bundesministerin für besondere Aufgaben in Zukunft das Kanzleramt leiten und
      Carsten Linnemann wird das Amt des Bundesgesundheitsministers übernehmen. Außerdem
      wird Philipp Amthor neuer Staatsminister für die Bund-Länder-Beziehungen
    note: >-
      Recorded because the reshuffle happened three days before this file's access date and
      a reader checking the cabinet page today will see different names than the archived
      snapshot shows. It is cited for a negative fact as much as a positive one: the offices
      change hands, the office of Bundesminister für besondere Aufgaben continues to exist
      and continues to be combined with the leadership of the Chancellery, and no ministry
      is created, renamed or abolished. That is why no entity in this file carries a
      valid_to. The quote is truncated at the end of the clause naming the new
      Staatsminister; the sentence continues in the source.

  - id: kulturstaatsminister-amt
    tier: 2
    type: government_website
    publisher: Der Beauftragte der Bundesregierung für Kultur und Medien
    title: Staatsminister und sein Amt
    url: https://kulturstaatsminister.de/staatsminister-und-sein-amt
    archive_url: https://web.archive.org/web/20260708181828/https://kulturstaatsminister.de/staatsminister-und-sein-amt
    lang: de
    published: null
    accessed: 2026-07-27
    quote: >-
      Der Beauftragte der Bundesregierung für Kultur und Medien ist zuständig für die
      Kultur- und Medienpolitik des Bundes. Seit Mai 2025 hat Wolfram Weimer dieses Amt
      inne. Als Staatsminister ist er direkt dem Bundeskanzler zugeordnet und nimmt an den
      Sitzungen des Bundeskabinetts teil. Zugleich ist er Leiter einer obersten
      Bundesbehörde mit rund 430 Mitarbeiterinnen und Mitarbeitern in Berlin und Bonn.
    note: >-
      The official site of the body that runs federal culture and media policy in the
      absence of a culture ministry. Every clause of this quote does work in the
      classification. "Als Staatsminister" places the holder below ministerial rank, so
      under Article 62 of the Basic Law he is not a member of the Federal Government;
      "nimmt an den Sitzungen des Bundeskabinetts teil" is attendance, not membership, and
      is why has_cabinet_seat is false rather than true; "direkt dem Bundeskanzler
      zugeordnet" places the office inside the Chancellery rather than in a department of
      its own; and "Leiter einer obersten Bundesbehörde mit rund 430 Mitarbeiterinnen und
      Mitarbeitern" is why it is recorded at all instead of being dropped as a personal
      title.

