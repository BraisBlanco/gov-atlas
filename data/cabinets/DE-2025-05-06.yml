    name_es_provenance: translated
    head_title_original: Bundesminister/in für Umwelt, Klimaschutz, Naturschutz und nukleare Sicherheit
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [environment, climate, water]
    counts_as_ministry: true
    url: https://www.bundesumweltministerium.de
    sources: [bgbl-2025-i-131, bgbl-2025-i-343-haushaltsgesetz-2026, bundesregierung-bundesministerien]
    note:
      en: >-
        Renamed by section II.7 of the Organisationserlass of 6 May 2025: "Verbraucherschutz"
        was dropped and "Klimaschutz" gained, and both halves of that swap were real transfers
        of competence, out to the justice ministry under section V and in from the economics
        ministry and the Foreign Office under section IX. Germany therefore does have a
        dedicated climate portfolio, and it moved department on 6 May 2025. Nuclear safety has
        no id in this project's policy-area vocabulary; it is not tagged energy, because energy
        policy sits with the economics ministry and nuclear safety here is regulatory
        oversight. The missing id is flagged in the curator's hand-off notes.
      es: >-
        Renombrado por la sección II.7 del Organisationserlass del 6 de mayo de 2025: se
        suprimió «Verbraucherschutz» y se ganó «Klimaschutz», y ambas mitades de ese
        intercambio fueron traslados reales de competencia, hacia el ministerio de Justicia por
        la sección V y desde el ministerio de Economía y el Auswärtiges Amt por la sección IX.
        Alemania sí tiene por tanto una cartera climática propia, y cambió de departamento el
        6 de mayo de 2025. La seguridad nuclear no tiene id en el vocabulario de áreas de
        política de este proyecto; no se etiqueta como energía, porque la política energética
        corresponde al ministerio de Economía y la seguridad nuclear es aquí supervisión
        regulatoria. La carencia se señala en las notas de entrega del curador.

  - id: DE-2025-bildung-familie-senioren-frauen-jugend
    order: 13
    name_original: Bundesministerium für Bildung, Familie, Senioren, Frauen und Jugend
    abbreviation_original: BMBFSFJ
    name_en: Federal Ministry of Education, Family Affairs, Senior Citizens, Women and Youth
    name_es: Ministerio Federal de Educación, Familia, Mayores, Mujer y Juventud
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister/in für Bildung, Familie, Senioren, Frauen und Jugend
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [education, family, elderly, equality, youth, vocational_training]
    counts_as_ministry: true
    url: https://www.bmbfsfj.bund.de
    sources: [bgbl-2025-i-131, bgbl-2025-i-343-haushaltsgesetz-2026, bundesregierung-bundesministerien]
    note:
      en: >-
        Renamed by section II.5 of the Organisationserlass of 6 May 2025, which prefixed
        "Bildung" to the former Bundesministerium für Familie, Senioren, Frauen und Jugend;
        section VIII then moved general, school and vocational education, lifelong learning and
        the associated educational research and funding across from the research ministry. This
        is the most consequential reshaping in the 2025 decree after the creation of the
        digital ministry, and it is why education and vocational_training are tagged here
        rather than to the research ministry, which kept science and higher education. Note the
        federal limit: school education is substantively a competence of the Länder, and this
        ministry holds the federal share of it only.
      es: >-
        Renombrado por la sección II.5 del Organisationserlass del 6 de mayo de 2025, que
        antepuso «Bildung» al anterior Bundesministerium für Familie, Senioren, Frauen und
        Jugend; la sección VIII le trasladó después desde el ministerio de Investigación la
        educación general, escolar y profesional, el aprendizaje a lo largo de la vida y la
        investigación y financiación educativas asociadas. Es la reconfiguración de mayor
        alcance del decreto de 2025 después de la creación del ministerio de Digitalización, y
        por eso education y vocational_training se etiquetan aquí y no en el ministerio de
        Investigación, que conservó la ciencia y la enseñanza superior. Nótese el límite
        federal: la educación escolar es sustancialmente competencia de los Länder, y este
        ministerio ostenta únicamente la parte federal.

