        ningún lugar: no fue creado, ni renombrado, ni alterado en competencias, de modo que
        el decreto calla sobre él. Ese silencio es justamente la razón por la que este fichero
        necesita una segunda fuente de nivel 1. Su entrada aquí se apoya en el Einzelplan 15
        de la Ley de Presupuestos de 2026, y es la demostración más clara de que un
        Organisationserlass alemán es un registro de cambios y no una enumeración del
