# Listing order follows the Gesamtplan of the Haushaltsgesetz 2026, which is why
# Einzelplan 04 — the Federal Chancellery, recorded but not counted — comes first.
entities:
  # --- Einzelplan 04: recorded, not counted -------------------------------------
  - id: DE-2025-bundeskanzleramt
    order: 1
    name_original: Bundeskanzleramt
    abbreviation_original: BKAmt
    name_en: Federal Chancellery
    name_es: Cancillería Federal
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundeskanzler/in
    head_title_en: Federal Chancellor
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://www.bundesregierung.de/breg-de/bundesregierung/bundeskanzleramt
    sources: [bgbl-2025-i-131, bgbl-2025-i-343-haushaltsgesetz-2026, gg-art-62, bundesregierung-bundesministerien]
    note:
      en: >-
        The single most consequential judgement in this file: excluded, which is why
        Germany is published as 16 and not 17. The Gesamtplan of the Haushaltsgesetz 2026
        gives it Einzelplan 04 under the heading "Bundeskanzler und Bundeskanzleramt" and
        withholds the word "Bundesministerium" that all 16 counted departments carry;
        Article 62 of the Basic Law composes the Federal Government of the Chancellor and
        the ministers and names no chancellery; and the Federal Government's own directory
        of "16 Bundesministerien" leaves it out. It is recorded rather than omitted because
        the Chancellor sits in the cabinet, which is what makes the cabinet 18 people while
        the government has 16 departments. The contrary argument is real and is stated in
        the methodology notes: the Chancellery is a supreme federal authority whose head
        holds full ministerial rank, and the Organisationserlass of 6 May 2025 transfers
        competences to "dem Geschäftsbereich des Bundeskanzleramtes" in exactly the wording
        it uses for ministries. Read that way, every German figure on this site rises by
        one. Note that the person who administers this body is not the Chancellor but the
        Head of the Chancellery, recorded separately below; the seat recorded here is the
        Chancellor's own.
      es: >-
        El juicio de mayor consecuencia de este fichero: excluido, y por eso Alemania se
        publica como 16 y no como 17. El Gesamtplan de la Ley de Presupuestos de 2026 le
        asigna el Einzelplan 04 bajo el epígrafe «Bundeskanzler und Bundeskanzleramt» y le
        niega la palabra «Bundesministerium» que sí llevan los 16 departamentos contados;
        el artículo 62 de la Ley Fundamental compone el Gobierno Federal con el canciller y
        los ministros y no menciona ninguna cancillería; y el propio directorio
        gubernamental de «16 Bundesministerien» la deja fuera. Se registra en lugar de
        omitirse porque el canciller ocupa asiento en el gabinete, y eso es lo que hace que
        el gabinete sean 18 personas mientras el gobierno tiene 16 departamentos. El
        argumento contrario es real y consta en las notas metodológicas: la Cancillería es
        una autoridad federal suprema cuyo titular tiene rango pleno de ministro, y el
        Organisationserlass del 6 de mayo de 2025 traslada competencias «dem
        Geschäftsbereich des Bundeskanzleramtes» con la misma redacción que emplea para los
        ministerios. Leído así, toda cifra alemana de este sitio sube en uno. Nótese que
        quien administra este organismo no es el canciller sino el jefe de la Cancillería,
        registrado aparte más abajo; el asiento que aquí se registra es el del propio
        canciller.

  # --- the 16 counted federal ministries, in Einzelplan order -------------------
  - id: DE-2025-auswaertiges-amt
