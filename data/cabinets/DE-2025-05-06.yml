        Staatsministerin. La etiqueta migration cubre aquí por tanto la política de
        integración, mientras que el derecho de asilo y migración y la oficina federal de
        migración siguen en el ministerio del Interior: ambos ministerios llevan la etiqueta
        migration, deliberadamente, porque ambos tienen competencia principal sobre una parte
        de ella. La propia Staatsministerin no se registra como entidad: está subordinada a
        este ministro y encuadrada en este departamento.

