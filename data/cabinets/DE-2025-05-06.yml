        No fue renombrado en 2025, pero su ámbito creció: la sección VI del
        Organisationserlass del 6 de mayo de 2025 trasladó a la comisionada del Gobierno
        Federal para Migración, Refugiados e Integración y a la comisionada contra el racismo
