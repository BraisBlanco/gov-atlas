        Renombrado por la sección II.2 del Organisationserlass del 6 de mayo de 2025, que
        suprimió «und für Heimat» del anterior Bundesministerium des Innern und für Heimat.
        El cambio de nombre no fue cosmético: las competencias de Heimat sobre condiciones
        de vida equivalentes y cultura regional pasaron al ministerio de Agricultura, la
        política de deporte y voluntariado a la Cancillería, y el grueso de la
        administración digital y la informática federal al nuevo ministerio de
        Digitalización. Conserva policía, seguridad, migración y asilo, protección civil y
        el derecho de la función pública, y de ahí las cuatro áreas etiquetadas.

