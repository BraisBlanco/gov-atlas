        derecho urbanístico y el consumo de suelo, y la sección XV suprimió el cargo de
        comisionado del Gobierno Federal para el traslado a Berlín y la compensación a Bonn,
        dejando aquí sus competencias residuales.

  - id: DE-2025-forschung-technologie-raumfahrt
    order: 17
    name_original: Bundesministerium für Forschung, Technologie und Raumfahrt
    abbreviation_original: BMFTR
    name_en: Federal Ministry of Research, Technology and Space
    name_es: Ministerio Federal de Investigación, Tecnología y Espacio
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister/in für Forschung, Technologie und Raumfahrt
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [research, innovation, space, higher_education]
    counts_as_ministry: true
    url: https://www.bmftr.bund.de
    sources: [bgbl-2025-i-131, bgbl-2025-i-343-haushaltsgesetz-2026, bundesregierung-bundesministerien]
    note:
      en: >-
        Renamed by section II.8 of the Organisationserlass of 6 May 2025 from the
        Bundesministerium für Bildung und Forschung, and this is a case where a rename genuinely
        changed the department. It lost general, school and vocational education to the education
        and family ministry under section VIII, and gained space including the German Aerospace
        Center, innovation and technology policy, digital-technology development, the high-tech
        agenda, gigafactories, SPRIND and games from the economics ministry, plus earth
        observation and satellite navigation from transport, under section X. Quantum
        technologies and nuclear fusion were expressly confirmed as staying. Germany's federal
        education portfolio and its research portfolio are therefore in different ministries
        since 6 May 2025, which is unusual and is why education is not tagged here while
        higher_education is.
      es: >-
        Renombrado por la sección II.8 del Organisationserlass del 6 de mayo de 2025 desde el
        Bundesministerium für Bildung und Forschung, y es un caso en que el cambio de nombre sí
        alteró el departamento. Perdió la educación general, escolar y profesional en favor del
        ministerio de Educación y Familia por la sección VIII, y ganó el espacio incluido el
        Centro Aeroespacial Alemán, la política de innovación y tecnología, el desarrollo de
        tecnologías digitales, la agenda de alta tecnología, las gigafactorías, SPRIND y los
        videojuegos desde el ministerio de Economía, más la observación de la Tierra y la
        navegación por satélite desde Transporte, por la sección X. Las tecnologías cuánticas y
        la fusión nuclear se confirmaron expresamente como permanentes. La cartera federal de
        educación y la de investigación están por tanto en ministerios distintos desde el 6 de
        mayo de 2025, lo que es inusual y explica que aquí no se etiquete education y sí
        higher_education.

