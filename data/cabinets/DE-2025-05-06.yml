  - id: DE-2025-besondere-aufgaben
    order: 18
    name_original: Bundesminister/in für besondere Aufgaben (Chef/in des Bundeskanzleramtes)
    abbreviation_original: null
    name_en: Federal Minister for Special Tasks (Head of the Federal Chancellery)
    name_es: Ministro/a Federal para Tareas Especiales (jefe/a de la Cancillería Federal)
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister/in für besondere Aufgaben
    head_title_en: Federal Minister for Special Tasks
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: minister_without_portfolio
    url: https://www.bundesregierung.de/breg-de/bundesregierung/bundeskanzleramt
    sources: [gg-art-62, bundesregierung-bundeskabinett, bundesregierung-kabinett-juli-2026]
    note:
      en: >-
        A full member of the Federal Government with a cabinet seat and no ministry: this is
        the second half of the German Chancellery problem, and it is what makes 16 ministries
        coexist with 17 federal ministers. The Federal Government's cabinet page lists the
        office as "Bundesminister für besondere Aufgaben/Chef des Bundeskanzleramtes", so one
        person holds a ministerial appointment under Article 64 of the Basic Law and, by
        Article 62, sits in the Federal Government, while administering the Chancellery rather
        than a department. It is classified minister_without_portfolio rather than
        head_of_government_office because the Chancellor's own seat is already recorded on the
        Bundeskanzleramt entity above, and recording this office there as well would either
        lose a real cabinet member or double-count the Chancellery. If a reader takes the view
        that the Chancellery is a ministry, then this entity is its minister and Germany has
        17 ministries — the two questions have the same answer and are stated together in the
        first methodology note. No statutory basis for the title itself could be found: the
        Bundesministergesetz regulates the status of members of the Federal Government without
        naming ministers for special tasks, so this entity rests on Article 62 of the Basic
        Law plus the Federal Government's own publications rather than on a provision that
        creates the office.
      es: >-
        Miembro pleno del Gobierno Federal con asiento en el gabinete y sin ministerio: esta es
        la segunda mitad del problema de la Cancillería alemana, y es lo que hace que 16
        ministerios convivan con 17 ministros federales. La página del gabinete del Gobierno
        Federal enumera el cargo como «Bundesminister für besondere Aufgaben/Chef des
        Bundeskanzleramtes», de modo que una sola persona tiene un nombramiento ministerial al
        amparo del artículo 64 de la Ley Fundamental y, por el artículo 62, forma parte del
        Gobierno Federal, mientras administra la Cancillería y no un departamento. Se clasifica
        como minister_without_portfolio y no como head_of_government_office porque el asiento
        propio del canciller ya está registrado en la entidad Bundeskanzleramt anterior, y
        registrar aquí también ese cargo perdería un miembro real del gabinete o contaría dos
        veces la Cancillería. Si un lector sostiene que la Cancillería es un ministerio,
        entonces esta entidad es su ministro y Alemania tiene 17 ministerios: las dos preguntas
        tienen la misma respuesta y se exponen juntas en la primera nota metodológica. No se
        halló base legal para el título mismo: la Bundesministergesetz regula el estatuto de
        los miembros del Gobierno Federal sin nombrar a los ministros para tareas especiales,
        por lo que esta entidad se apoya en el artículo 62 de la Ley Fundamental y en las
        publicaciones del propio Gobierno Federal, y no en un precepto que cree el cargo.

  - id: DE-2025-kultur-medien
    order: 19
    name_original: Der Beauftragte der Bundesregierung für Kultur und Medien
    abbreviation_original: BKM
    name_en: Federal Government Commissioner for Culture and the Media
    name_es: Comisionado del Gobierno Federal para la Cultura y los Medios de Comunicación
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Staatsminister/in beim Bundeskanzler
    head_title_en: Minister of State to the Federal Chancellor
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: https://kulturstaatsminister.de
    sources: [gg-art-62, kulturstaatsminister-amt]
    note:
      en: >-
        Recorded rather than omitted because it answers a question the ministry list otherwise
        leaves hanging: Germany has no culture ministry, and this is where federal culture and
        media policy lives. The office is a supreme federal authority with roughly 430 staff,
        attached directly to the Chancellor and sitting inside Einzelplan 04. Its holder is a
        Staatsminister, not a Bundesminister, so under Article 62 of the Basic Law he is not a
        member of the Federal Government; he attends cabinet meetings without holding a seat in
        it, which is why has_cabinet_seat is false. That is a judgement a careful curator could
        make differently — counting attendance as a seat would publish 19 cabinet seats for
        Germany instead of 18 — and it is stated in the methodology notes rather than settled
        silently here. No policy area is tagged, because policy areas are only counted for
        counted ministries; a reader looking for German federal culture policy in the
        comparison views will correctly find no ministry holding it.
      es: >-
        Se registra en lugar de omitirse porque responde a una pregunta que la lista de
        ministerios deja en el aire: Alemania no tiene ministerio de Cultura, y aquí es donde
        reside la política federal de cultura y medios. El cargo encabeza una autoridad federal
        suprema con unos 430 efectivos, adscrita directamente al canciller y situada dentro del
        Einzelplan 04. Su titular es Staatsminister, no Bundesminister, de modo que conforme al
        artículo 62 de la Ley Fundamental no es miembro del Gobierno Federal; asiste a las
        reuniones del gabinete sin ocupar asiento en él, y por eso has_cabinet_seat es falso. Es
        un juicio que otro curador cuidadoso podría resolver de otro modo — contar la asistencia
        como asiento publicaría 19 asientos de gabinete para Alemania en vez de 18 — y consta en
        las notas metodológicas en lugar de zanjarse aquí en silencio. No se etiqueta ninguna
        área de política, porque las áreas sólo se cuentan para los ministerios contados; quien
        busque la política cultural federal alemana en las vistas comparativas encontrará
        correctamente que ningún ministerio la ostenta.
