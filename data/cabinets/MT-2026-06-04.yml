# Malta — government structure of the cabinet appointed on 4 June 2026, after the general
# election of 30 May 2026 (Robert Abela's third cabinet).
#
# Read docs/DATA-CONTRACT.md alongside this file. Seven Malta-specific things to know:
#
#   1. Malta does have an enumerating legal instrument, and it is not an act or a legal notice.
#      It is a Government Notice made under section 82 of the Constitution — "Assignment to
#      Ministers of Responsibility for the Business of the Government of Malta" — published in
#      a special issue of the Malta Government Gazette. It names every ministry and lists the
#      subjects assigned to it, in both official languages. Everything counted here rests on it.
#   2. That notice is not on the Department of Information's web pages for the gazette, which
#      skip the special issues; it exists only in the gazette PDF. Finding it is the difference
#      between grading Malta A and grading it B.
#   3. Both Maltese and English are official (Constitution, article 5) and the instrument itself
#      is printed in parallel columns in both. name_original is the Maltese column and name_en
#      is the English column of the same instrument, so name_en is `official`, not `translated`.
#   4. Policy-area tags follow the subjects the instrument assigns, not ministry titles. That is
#      how this file knows defence sits in the home affairs ministry and space in the justice one.
#   5. The Ministry for Gozo is central government, not a subnational one, and is counted.
#   6. Parliamentary secretaries are appointed under a different section of the Constitution, are
#      not members of the Cabinet, move neither figure, and are not recorded. There are two.
#   7. The Office of the Deputy Prime Minister is not a separate entity: the deputy prime
#      minister heads the health ministry and the instrument gives the two as one heading.

country: MT
cabinet_id: MT-2026-06-04

cabinet_name_original: Il-Kabinett ta' Robert Abela (2026)
cabinet_name_en: Cabinet of Robert Abela (2026)
cabinet_name_es: Gabinete de Robert Abela (2026)

head_of_government_title_original: Prim Ministru
head_of_government_title_en: Prime Minister

took_office: 2026-06-04
left_office: null

methodology_notes:
  - en: >-
      Malta has 21 ministries and 22 cabinet seats. The gap is the Prime Minister, who holds a
      seat and heads the Office of the Prime Minister rather than a portfolio department. The
      instrument that assigns the business of government lists 22 headings — the Prime Minister
      and 21 ministries — and the notice appointing the ministers names 21 people, each holding
      one of them, so no portfolio is shared and no ministry recorded here has a shared head.
      21 ministers plus the Prime Minister is 22 seats. The two figures answer
      different questions and are never added.
    es: >-
      Malta tiene 21 ministerios y 22 asientos en el gabinete. La diferencia es el primer
      ministro, que ocupa asiento y encabeza la Oficina del Primer Ministro y no un departamento
      con cartera. El instrumento que reparte los asuntos del gobierno enumera 22 encabezamientos
      —el primer ministro y 21 ministerios— y el aviso que nombra a los ministros designa a 21
      personas, cada una al frente de uno de ellos, de modo que no hay carteras compartidas ni
      ningún ministerio registrado aquí con titular compartido. 21 ministros más el primer
      ministro son 22 asientos. Las dos cifras responden a preguntas distintas y nunca se suman.
  - en: >-
      Where Malta's enumeration lives, and why it is easy to miss. There is no Maltese act or
      legal notice that lists the ministries: the Public Administration Act (Cap. 595) carries no
      such schedule, and nothing answering to a "Ministries and Departments (Allocation of
      Responsibilities)" order exists on legislation.mt. The enumeration is a Government Notice
      made under section 82 of the Constitution, by which the President, on the Prime Minister's
      advice, assigns to ministers "responsibility for the business of the Government of Malta,
      including the administration of Departments of Government". For this cabinet that is
      Government Notice 844, published with the appointments themselves (Government Notices 842
      and 843) in Government Gazette No. 21,661 of 5 June 2026 — a special issue the Department of
      Information titles "Government Gazette Ministers" and does not reproduce in the
      per-issue web pages it publishes for ordinary gazettes. Anyone who looks only at those
      web pages finds an unexplained gap in the notice numbering between 2 and 5 June and concludes
      that Malta publishes no enumeration; the notice is in the gazette PDF for that special issue
      and nowhere else on gov.mt. Because it is a legal instrument, Malta grades A: all 21 counted
      ministries, their names in both official languages, and the subjects assigned to each rest
      on it.
    es: >-
      Dónde está la enumeración maltesa, y por qué es fácil no verla. No hay ley ni aviso legal
      maltés que enumere los ministerios: la Public Administration Act (Cap. 595) no lleva anexo
      de ese tipo, y en legislation.mt no existe nada equivalente a una orden de «Ministries and
      Departments (Allocation of Responsibilities)». La enumeración es un Government Notice dictado
      conforme al artículo 82 de la Constitución, por el que el presidente de la República, con el
      consejo del primer ministro, asigna a los ministros «responsibility for the business of the
      Government of Malta, including the administration of Departments of Government». Para este
      gabinete es el Government Notice 844, publicado junto con los propios nombramientos
      (Government Notices 842 y 843) en la Gazzetta tal-Gvern n.º 21.661 del 5 de junio de 2026:
      un número especial que el Departamento de Información titula «Government Gazette Ministers»
      y que no reproduce en las páginas web que publica para cada número ordinario. Quien mire solo
      esas páginas web encuentra un hueco inexplicado en la numeración de los avisos entre el 2 y
      el 5 de junio y concluye que Malta no publica enumeración alguna; el aviso está en el PDF de
      ese número especial y en ningún otro sitio de gov.mt. Al ser instrumento jurídico, Malta
      tiene grado A: los 21 ministerios contados, sus nombres en las dos lenguas oficiales y las
      materias asignadas a cada uno se apoyan en él.
  - en: >-
      Both Maltese and English are official, and the English names are marked as the
      government's own rather than as translations for the strongest possible reason: the same
      instrument prints both. Article 5 of the
      Constitution makes Maltese the national language and provides that Maltese and English shall
      be the official languages of Malta, and Government Notice 844 is set in parallel columns,
      Maltese on the left and English on the right, so "Ministeru għall-Enerġija, l-Ambjent u
      r-Riġenerazzjoni tal-Port il-Kbir" and "Ministry for Energy, the Environment and the
      Regeneration of the Grand Harbour" are two official names of one department rather than a
      name and a rendering of it. The Maltese form is recorded as the original name, because
      Maltese is the national language. Only the Spanish names are this project's own
      translations, and only they are marked as such.
    es: >-
      El maltés y el inglés son ambos oficiales, y los nombres ingleses se señalan como nombres
      propios del gobierno y no como traducciones por la razón más fuerte posible: el mismo
      instrumento imprime los dos. El artículo 5 de la
      Constitución hace del maltés la lengua nacional y dispone que el maltés y el inglés serán las
      lenguas oficiales de Malta, y el Government Notice 844 se compone en columnas paralelas,
      maltés a la izquierda e inglés a la derecha, de modo que «Ministeru għall-Enerġija,
      l-Ambjent u r-Riġenerazzjoni tal-Port il-Kbir» y «Ministry for Energy, the Environment and
      the Regeneration of the Grand Harbour» son dos nombres oficiales de un mismo departamento y
      no un nombre y su versión. Como nombre original se recoge el maltés, porque el maltés es la
      lengua nacional. Solo los nombres españoles son traducciones de este proyecto, y solo ellos
      se señalan como tales.
  - en: >-
      Where the instrument and the government's own portal disagree, this page follows the
      instrument. gov.mt publishes a list of ministries and a portfolio page for each — the pages
      given here as the link for each body, and the pages a reader will actually find first — but it
      sets every name in full capitals and differs from Government Notice 844 in three places.
      The portal has "MINISTRY FOR EDUCATION AND SPORT" where the instrument has "Ministry for
      Education and Sports"; "MINISTRY FOR ECONOMY…" where the instrument has "Ministry for the
      Economy…"; and, in Maltese, "l-Implementazzjoni" where the instrument has
      "l-Implimentazzjoni". In each case the instrument's form is recorded here. A fourth
      difference runs the other way and is not adopted: the ministry's own portfolio page styles
      itself "Ministry for Arts, Culture and the National Heritage", while both the instrument and
      the portal's list drop the article, so "Ministry for Arts, Culture and National Heritage" is
      what is recorded here. None of these is a difference of substance; they are recorded rather
      than resolved silently because a reader comparing this page with gov.mt will see them.
    es: >-
      Cuando el instrumento y el propio portal del gobierno discrepan, esta ficha sigue al
      instrumento. gov.mt publica una lista de ministerios y una página de portafolio para cada
      uno —las páginas dadas aquí como enlace de cada organismo, y las que un lector encontrará
      antes—, pero escribe todos los nombres en mayúsculas y difiere del Government Notice 844 en
      tres puntos. El portal pone «MINISTRY FOR EDUCATION AND SPORT» donde el instrumento pone
      «Ministry for Education and Sports»; «MINISTRY FOR ECONOMY…» donde el instrumento pone
      «Ministry for the Economy…»; y, en maltés, «l-Implementazzjoni» donde el instrumento pone
      «l-Implimentazzjoni». En cada caso se registra la forma del instrumento. Una cuarta
      diferencia va en sentido contrario y no se adopta: la página del propio ministerio se titula
      «Ministry for Arts, Culture and the National Heritage», mientras que tanto el instrumento
      como la lista del portal suprimen el artículo, así que aquí se registra «Ministry for Arts,
      Culture and National Heritage». Ninguna es diferencia de fondo; se hacen constar en lugar de
      resolverse en silencio porque el lector que compare esta ficha con gov.mt las verá.
  - en: >-
      Policy-area tags follow the subjects the instrument assigns, not the ministry titles.
      Government Notice 844 prints, under each ministry's name, the list of subjects that ministry
      is responsible for, and those lists are what is tagged here. Doing it that way rather than
      reading the titles changes several of Malta's rows, which is the argument for it: Malta has
      no defence ministry, but "Defence" and "Armed Forces" head the subjects assigned to the
      Ministry for Home Affairs and Security, so Malta does appear in the defence column; "Space
      Strategy" is assigned to the justice ministry, not to a research or transport one;
      "Climate Change Policy" and "Water Policy" are assigned to an energy and environment
      ministry that names neither in its title; and migration is split, with "Legal Migration and
      Expatriate Affairs" assigned to the infrastructure and employment ministry and "Irregular
      Migration" to home affairs, so two ministries carry the migration area. A comparison built
      from ministry names alone would have got all of these wrong.
    es: >-
      Las áreas de política siguen las materias que asigna el instrumento, no los títulos
      ministeriales. El Government Notice 844 imprime, bajo el nombre de cada ministerio, la lista
      de materias de las que es responsable, y esas listas son lo que aquí se etiqueta. Hacerlo así
      en lugar de leer los títulos cambia varias filas de Malta, que es el argumento a favor: Malta
      no tiene ministerio de defensa, pero «Defence» y «Armed Forces» encabezan las materias
      asignadas al Ministerio del Interior y Seguridad, de modo que Malta sí aparece en la columna
      de defensa; «Space Strategy» se asigna al ministerio de justicia y no a uno de investigación
      o transporte; «Climate Change Policy» y «Water Policy» se asignan a un ministerio de energía
      y medio ambiente que no nombra ninguna de las dos en su título; y la migración se divide, con
      «Legal Migration and Expatriate Affairs» en el ministerio de infraestructuras y empleo e
      «Irregular Migration» en interior, así que dos ministerios llevan el área de migración. Una
      comparación construida solo con los nombres se habría equivocado en todo esto.
  - en: >-
      Parliamentary secretaries move neither figure and are not recorded here. They are the Maltese
      equivalent of junior ministers or state secretaries, and the constitutional distinction is
      visible in the gazette itself: the ministers were appointed under section 80 of the
      Constitution by Government Notice 842, the parliamentary secretaries under section 88 by
      Government Notice 843, and each of the latter is appointed to serve "within" a named ministry
      rather than over a department of their own. They are not members of the Cabinet, so they add
      no seat, and they head nothing, so they add no ministry. This legislature has exactly two —
      Deo Debattista within the Office of the Deputy Prime Minister and Ministry for Health, with
      responsibility for active ageing, and Alicia Bugeja Said within the Ministry for Energy, the
      Environment and the Regeneration of the Grand Harbour, with responsibility for animal
      welfare. Because Government Notice 844 assigns the elderly and animal-welfare subjects to
      those two ministries and not to the secretariats, the two remits are tagged as policy areas
      of the parent ministries — the elderly area on the health ministry and the animal-welfare
      area on the energy and environment ministry — which is why Malta appears in those columns
      without a
      department of its own for either. A source that answers "how big is the Maltese government?"
      with a number in the thirties is counting parliamentary secretaries alongside ministers, and
      is answering a different question.
    es: >-
      Los secretarios parlamentarios no mueven ninguna de las dos cifras y no se registran aquí.
      Son el equivalente maltés de los ministros junior o secretarios de Estado, y la distinción
      constitucional se ve en la propia Gazzetta: los ministros se nombraron conforme al artículo
      80 de la Constitución por el Government Notice 842, y los secretarios parlamentarios conforme
      al artículo 88 por el Government Notice 843, y cada uno de estos últimos se nombra para
      servir «dentro» («within») de un ministerio determinado y no al frente de un departamento
      propio. No son miembros del Gabinete, así que no añaden asiento, y no encabezan nada, así que
      no añaden ministerio. Esta legislatura tiene exactamente dos: Deo Debattista en la Oficina
      del Viceprimer Ministro y Ministerio de Sanidad, responsable del envejecimiento activo, y
      Alicia Bugeja Said en el Ministerio de Energía, Medio Ambiente y Regeneración del Gran
      Puerto, responsable del bienestar animal. Como el Government Notice 844 asigna las materias
      de mayores y de bienestar animal a esos dos ministerios y no a las secretarías, los dos
      cometidos se etiquetan como áreas de los ministerios matrices —el área de mayores en el de
      sanidad y la de bienestar animal en el de energía y medio ambiente—, y por eso Malta
      aparece en esas columnas
      sin departamento propio para ninguna. Una fuente que responde «¿de qué tamaño es el Gobierno
      maltés?» con una cifra de treinta y tantos está contando secretarios parlamentarios junto a
      los ministros: responde a otra pregunta.
  - en: >-
      The Ministry for Gozo is counted, and is not a subnational government. Gozo is Malta's second
      inhabited island; it has no legislature, no government and no devolved powers of its own. The
      Ministry for Gozo is a department of the national executive, headed by a member of the
      national Cabinet, appointed by the same instrument as every other minister and listed in
      Government Notice 844 between the inclusion ministry and the education ministry like any
      other. What that notice assigns to it is "Gozo Affairs (excluding health services and
      education but including all infrastructural works related to the education sector)" — a
      carve-up of central government business by territory, with two subjects explicitly carved
      back out, which is the opposite of devolution. Excluding it as subnational government would
      misread a central ministry with a territorial remit as a regional administration, and would
      put Malta's count at 20 for the wrong reason.
    es: >-
      El Ministerio de Gozo se cuenta y no es un gobierno subnacional. Gozo es la segunda isla
      habitada de Malta; no tiene legislatura, ni gobierno, ni competencias transferidas propias.
      El Ministerio de Gozo es un departamento del ejecutivo nacional, encabezado por un miembro
      del Gabinete nacional, nombrado por el mismo instrumento que todos los demás ministros y
      listado en el Government Notice 844 entre el de inclusión y el de educación como cualquier
      otro. Lo que ese aviso le asigna es «Gozo Affairs (excluding health services and education
      but including all infrastructural works related to the education sector)»: un reparto
      territorial de los asuntos del gobierno central, con dos materias expresamente excluidas, que
      es lo contrario de la descentralización. Excluirlo como administración subestatal sería leer
      un ministerio central con ámbito territorial como una administración regional, y dejaría el
      recuento de Malta en 20 por el motivo equivocado.
  - en: >-
      The perimeter. Counted: the 21 ministries listed in Government Notice 844, each headed by a
      minister appointed by Government Notice 842 and each a department of the national executive.
      Recorded but not counted: the Office of the Prime Minister. Government Notice 844 heads its
      first block simply "Prime Minister" and assigns to it the machinery of government — the
      public administration, the Cabinet Office, the Electoral Office, people and standards,
      internal audit and investigations, information, the Government Printing Press and the Office
      of the Public Service Commission — rather than a sector of policy, so this project excludes
      it as it excludes Spain's Presidencia del Gobierno. Counting it would give 22 ministries
      instead of 21. Not recorded at all: parliamentary secretaries (see above); the President of
      Malta, who is head of state and outside the executive this project counts; the Attorney
      General and the State Advocate, which Government Notice 844 lists as offices assigned to the
      justice ministry rather than as ministries; and the several hundred authorities, agencies,
      foundations, councils and boards that sit under the ministries.
    es: >-
      El perímetro. Se cuentan: los 21 ministerios listados en el Government Notice 844, cada uno
      encabezado por un ministro nombrado por el Government Notice 842 y cada uno departamento del
      ejecutivo nacional. Se registra sin contar: la Oficina del Primer Ministro. El Government
      Notice 844 encabeza su primer bloque simplemente «Prime Minister» y le asigna la maquinaria
      del gobierno —la administración pública, la Oficina del Gabinete, la Oficina Electoral,
      personal y estándares, la auditoría interna e investigaciones, la información, la Imprenta del
      Gobierno y la Oficina de la Comisión del Servicio Público— y no un sector de política, así que
      este proyecto la excluye igual que excluye la Presidencia del Gobierno española. Contarla
      daría 22 ministerios en lugar de 21. No se registran: los secretarios parlamentarios (véase
      más arriba); el presidente de Malta, jefe del Estado y ajeno al ejecutivo que cuenta este
      proyecto; el fiscal general y el abogado del Estado, que el Government Notice 844 enumera como
      oficinas asignadas al ministerio de justicia y no como ministerios; y los centenares de
      autoridades, agencias, fundaciones, consejos y comités situados bajo los ministerios.
  - en: >-
      Three dates, and why this page uses 4 June 2026. The general election was held on Saturday
      30 May 2026; the Electoral Commission's return of the members elected, in the Government
      Gazette of 1 June 2026, recites that date. The President appointed Robert Abela Prime Minister
      on 1 June 2026 (Government Notice 821). The ministers were appointed on 4 June 2026
      (Government Notice 842), and the assignment of responsibilities bears the same date
      (Government Notice 844), although both were printed in the gazette of 5 June. This page dates
      the cabinet from the ministers' appointment, as the project's other files do — Spain's cabinet
      is dated 21 November 2023, when its ministers were sworn in, not from the prime minister's own
      investiture four days earlier — because what the file describes is the composition of the
      cabinet, not the identity of its head. All three dates come from legal instruments; no datum
      in this page rests on a press report.
    es: >-
      Tres fechas, y por qué esta ficha usa el 4 de junio de 2026. Las elecciones generales se
      celebraron el sábado 30 de mayo de 2026; el aviso de la Comisión Electoral con los diputados
      electos, en la Gazzetta del 1 de junio de 2026, recoge esa fecha. El presidente de la
      República nombró primer ministro a Robert Abela el 1 de junio de 2026 (Government Notice 821).
      Los ministros fueron nombrados el 4 de junio de 2026 (Government Notice 842), y el reparto de
      responsabilidades lleva la misma fecha (Government Notice 844), aunque los dos se imprimieron
      en la Gazzetta del 5 de junio. Esta ficha fecha el gabinete en el nombramiento de los
      ministros, como hacen los demás ficheros del proyecto —el gabinete español se fecha el 21 de
      noviembre de 2023, cuando juraron sus ministros, y no en la investidura del presidente cuatro
      días antes—, porque lo que esta ficha describe es la composición del gabinete y no la
      identidad de su titular. Las tres fechas provienen de instrumentos jurídicos; ningún dato de
      esta ficha se apoya en una noticia de prensa.

sources:
  - id: gazzetta-21661-gn844-assignment
    tier: 1
    type: official_gazette
    publisher: Department of Information — Gazzetta tal-Gvern ta' Malta / The Malta Government Gazette
    title: >-
      Government Notice No. 844, Assignment to Ministers of Responsibility for the Business of the
      Government of Malta, Government Gazette No. 21,661 of 5th June 2026, pp. 12,385–12,397
    url: https://www.gov.mt/en/Government/DOI/Government%20Gazette/Documents/2026/06/Government%20Gazette%20-%205th%20June%20Ministers.pdf
    archive_url: null
    lang: en
    published: 2026-06-05
    accessed: 2026-07-28
    quote: |-
      No. 844
      ASSIGNMENT TO MINISTERS OF RESPONSIBILITY FOR THE BUSINESS OF THE GOVERNMENT OF MALTA
      IN exercise of the powers conferred by Section 82 of the Malta Constitution, the President of Malta, acting in accordance with the advice of the Prime Minister, has assigned to Ministers responsibility for the business of the Government of Malta, including the administration of Departments of Government, as follows:
      Prime Minister
      Office of the Deputy Prime Minister and Ministry for Health
      Ministry for Accommodation and Lands
      Ministry for Social Policy and the Family
      Ministry for Agriculture, Fisheries and Food Supply
      Ministry for the Economy, Technology and Strategic Projects
      Ministry for Inclusion and the Voluntary Sector
      Ministry for Gozo
      Ministry for Education and Sports
      Ministry for Energy, the Environment and the Regeneration of the Grand Harbour
      Ministry for Finance
      Ministry for Justice, Research and Innovation
      Ministry for Infrastructure, Planning and Employment
      Ministry for Tourism
      Ministry for Sustainable Mobility
      Ministry for Foreign and European Affairs
      Ministry for Local Government and Public Works
      Ministry for European Funds, Social Dialogue and Consumer Protection
      Ministry for Home Affairs and Security
      Ministry for Arts, Culture and National Heritage
      Ministry for Youth, Wellbeing and the Implementation of the Electoral Programme
      Ministry for Equality and Civil Rights
      4th June, 2026
    note: >-
      The enumerating instrument, and the tier-1 source on which every counted ministry in this
      file rests. Made under section 82 of the Constitution and dated 4 June 2026, printed in a
      special issue of the gazette that the Department of Information titles "Government Gazette
      Ministers" and that does not appear among the per-issue notice pages published on gov.mt.
      Two things about the quote. First, the notice is set in parallel columns, Maltese on the
      left and English on the right; the English column is quoted here and the Maltese heading of
      each ministry is what appears in name_original below. Second, the notice prints under each
      of these 22 headings the list of subjects assigned to that ministry — nine lines under
      "Prime Minister", six under the health ministry, and so on to "Foreign Communities" under
      the equality ministry — and those lists are omitted from the quote for length. They are the
      basis of the policy-area tags and are described in the entity notes; gov.mt reproduces them
      on each ministry's portfolio page, which is that entity's `url`. Nothing else is altered:
      the headings are verbatim and in the notice's own order, with the line breaks of the printed
      column joined up. Page numbering 12,385 to 12,397 is the gazette's own continuous pagination
      for the year. ARCHIVE OUTSTANDING: archive_url is null and the file therefore fails
      `source-archive-required`. This is not a judgement that the source cannot be archived — it is
      a PDF on a path from which the Wayback Machine has captured other gazette issues, most
      recently the issue of 13 January 2026 on 26 July 2026. No snapshot could be created while
      this file was curated because Save Page Now returned "Job failed" to every request over more
      than an hour, including control captures of unrelated URLs, and archive.today accepted
      capture jobs but never completed them and gates its status pages behind a CAPTCHA. The next
      curator to touch this file should retry Save Page Now on this URL, open the resulting
      snapshot, confirm that Government Notice 844 is legible in it, and only then paste the
      timestamp here.

