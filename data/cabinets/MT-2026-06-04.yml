      No. 842
      APPOINTMENT OF MINISTERS
      IN exercise of the powers conferred by Section 80 of the Constitution of Malta, the President of Malta, acting in accordance with the advice of the Prime Minister, has, on the 4th June 2026, appointed Dr Ian Borg LLB, Dip Not Pub, LLD, MP, Dr Owen Bonnici BA, LLD, MP, Dr Michael Falzon LLD, ACIB, MP, Dr Anton Refalo LLD, MP, Mr Silvio Schembri BCom(Hons), MA(Econ), MP, Ms Julia Farrugia MP, Perit Clint Camilleri BE&A(Hons), MP, Dr Byron Camilleri LLB, Dip Not Pub, LLD, MP, Dr Miriam Dalli BA (Hons), MA (Eur), MBA (Exec), LLD, MP, Mr Clyde Caruana BCom (Hons), MA (Econ), MP, Dr Clifton Grima LLB, LLD, MP, Dr Jonathan Attard B.Comm, LLB, Dip NP, LLD, MP, Mr Jo Etienne Abela MD, MPhil, MRCS, FRCS, FEBS, MP, Dr Chris Bonett BA LLM, LLD, MP, Mr Chris Fearne MD, FRCS(Ed), MP, Ms Alison Zerafa Civelli M.Ed, B.Ed, MP, Mr Keith Azzopardi Tanti B.Com(Hons)Mgt, FCCA, CPA, MIA, MP, Dr Glenn Bedingfield LLB, M Adv Melit, MP, Dr Malcolm Paul Agius Galea MD, MSc, MRCGP, MMCFD, MP, Mr Omar Farrugia MP, Ms Rosianne Cutajar BA (Hon), PGCE, MP to be Ministers as follows:
      Dr Ian Borg, LLB, Dip Not Pub, LLD, MP — Deputy Prime Minister and Minister for Health
      Dr Owen Bonnici, BA, LLD, MP — Minister for Accommodation and Lands
      Dr Michael Falzon, LLD, ACIB, MP — Minister for Social Policy and the Family
      Dr Anton Refalo, LLD, MP — Minister for Agriculture, Fisheries and Food Supply
      Mr Silvio Schembri, BCom(Hons), MA(Econ), MP — Minister for the Economy, Technology and Strategic Projects
      Ms Julia Farrugia, MP — Minister for Inclusion and the Voluntary Sector
      Perit Clint Camilleri, BE&A(Hons), MP — Minister for Gozo
      Dr Byron Camilleri, LLB, Dip Not Pub, LLD, MP — Minister for Education and Sports
      Dr Miriam Dalli, BA (Hons), MA (Eur), MBA (Exec), LLD, MP — Minister for Energy, the Environment and the Regeneration of the Grand Harbour
      Mr Clyde Caruana, BCom (Hons), MA (Econ), MP — Minister for Finance
      Dr Clifton Grima, LLB, LLD, MP — Minister for Justice, Research and Innovation
      Dr Jonathan Attard, B.Comm, LLB, Dip NP, LLD, MP — Minister for Infrastructure, Planning and Employment
      Mr Jo Etienne Abela, MD, MPhil, MRCS, FRCS, FEBS, MP — Minister for Tourism
      Dr Chris Bonett, BA LLM, LLD, MP — Minister for Sustainable Mobility
      Mr Chris Fearne, MD, FRCS(Ed), MP — Minister for Foreign and European Affairs
      Ms Alison Zerafa Civelli, M.Ed, B.Ed, MP — Minister for Local Government and Public Works
      Mr Keith Azzopardi Tanti, B.Com(Hons)Mgt, FCCA, CPA, MIA, MP — Minister for European Funds, Social Dialogue and Consumer Protection
      Dr Glenn Bedingfield, LLB, M Adv Melit, MP — Minister for Home Affairs and Security
      Dr Malcolm Paul Agius Galea, MD, MSc, MRCGP, MMCFD, MP — Minister for Arts, Culture and National Heritage
      Mr Omar Farrugia, MP — Ministry for Youth, Wellbeing and the Implementation of the Electoral Programme
      Ms Rosianne Cutajar, BA (Hon), PGCE, MP — Ministry for Equality and Civil Rights
      4th June 2026
    note: >-
      The appointment of the 21 ministers, and the source for took_office. Two transcription points.
      The notice sets each appointee's name on one line and the office on the next; the em dashes in
      this quote stand for that line break and are the only characters added. And the notice's last
      two entries read "Ministry for Youth…" and "Ministry for Equality…" where the preceding
      nineteen read "Minister for…"; that is the gazette's own slip, reproduced here rather than
      corrected, and it does not affect the ministry names, which come from Government Notice 844.
      Twenty-one named individuals, all different, is what fixes cabinet_seats_count at 22 once the
      Prime Minister is added. The companion Government Notice 843 in the same issue appoints, under
      section 88 of the Constitution, the two parliamentary secretaries, each "within" a named
      ministry; it is described in the methodology notes and is not separately cited, because no
      entity in this file depends on it. ARCHIVE OUTSTANDING: this notice is in the same PDF as
      Government Notice 844, so it carries the same missing snapshot and the same explanation —
      see the note on `gazzetta-21661-gn844-assignment`. One successful capture of that URL fixes
      both citations.

  - id: gazzetta-21656-gn821-pm
    tier: 1
    type: official_gazette
    publisher: Department of Information — Malta Government Gazette
    title: >-
      Government Notice No. 821, Appointment of Prime Minister, Government Gazette No. 21,656 of
      1st June 2026
    url: https://www.gov.mt/en/Government/DOI/Government%20Gazette/Government%20Notices/Pages/2026/06/GovNotices0106.aspx
    archive_url: https://web.archive.org/web/20260725125959/https://www.gov.mt/en/Government/DOI/Government%20Gazette/Government%20Notices/Pages/2026/06/GovNotices0106.aspx
    lang: en
    published: 2026-06-01
    accessed: 2026-07-28
    quote: >-
      No. 821 APPOINTMENT OF PRIME MINISTER IN exercise of the powers conferred by Article 80 of
      the Constitution of Malta, the President of Malta has, on the 1st June, 2026, appointed the
      Hon. Robert Abela, KUOM, BA, LLD, Adv. Trib. Melit., MP, to be Prime Minister. 1st June,
      2026
    note: >-
      The appointment of the head of government, three days before his ministers. The quote runs
      the notice number, heading, body and date together on one line because the Department of
      Information's web page for the issue sets them as adjacent blocks with no punctuation between
      them; no words are omitted or altered. The same page carries Government Notice 822, the
      Electoral Commission's return of the members elected "in the General Election held on
      Saturday, 30th May, 2026", which is where the election date in the methodology notes comes
      from. The archived snapshot used here was captured on 25 July 2026 and shows the quoted text.

entities:
  - id: MT-2026-opm
    order: 1
    name_original: Uffiċċju tal-Prim Ministru
    abbreviation_original: OPM
    name_en: Office of the Prime Minister
    name_es: Oficina del Primer Ministro
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Prim Ministru
    head_title_en: Prime Minister
    has_cabinet_seat: true
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    policy_areas: []
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/OPM.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21656-gn821-pm]
    note:
      en: >-
        First in the instrument that assigns the business of government, and excluded all the same.
        What is assigned to it is the machinery of government — public administration, the Cabinet
        Office, the Electoral Office, people and standards, internal audit and investigations,
        information, the Government Printing Press and the Office of the Public Service Commission
        — rather than a sector of policy, so it carries no policy area. Excluding it gives 21
        ministries; counting it, as the Irish file counts the Department of the Taoiseach, would
        give 22. It is excluded because, unlike Ireland's, no Maltese instrument constitutes it as
        one of a defined set of departments: Government Notice 844 heads its block "Prime Minister",
        the office of the head of government, where every other block is headed "Ministry for…" or,
        in the health case, "Office of the Deputy Prime Minister and Ministry for…". The name
        recorded here is the one the government uses for the department, Uffiċċju tal-Prim Ministru
        / Office of the Prime Minister. Its head holds a cabinet seat, which is why Malta's seat
        count is one higher than its ministry count.
      es: >-
        Primera en el instrumento que reparte los asuntos del gobierno, y excluida igualmente. Lo
        que se le asigna es la maquinaria del gobierno —administración pública, Oficina del
        Gabinete, Oficina Electoral, personal y estándares, auditoría interna e investigaciones,
        información, Imprenta del Gobierno y Oficina de la Comisión del Servicio Público— y no un
        sector de política, así que no lleva ninguna área. Excluirla da 21 ministerios; contarla,
        como la ficha irlandés cuenta el Departamento del Taoiseach, daría 22. Se excluye porque,
        a diferencia del irlandés, ningún instrumento maltés la constituye como uno de un conjunto
        definido de departamentos: el Government Notice 844 encabeza su bloque «Prime Minister», el
        cargo del jefe de gobierno, mientras todos los demás bloques se encabezan «Ministry for…»
        o, en el caso de sanidad, «Office of the Deputy Prime Minister and Ministry for…». El
        nombre aquí registrado es el que el gobierno usa para el departamento: Uffiċċju tal-Prim
        Ministru / Office of the Prime Minister. Su titular ocupa asiento en el gabinete, y de ahí
        que el recuento de asientos de Malta sea uno mayor que el de ministerios.

  - id: MT-2026-health
    order: 2
    name_original: Uffiċċju tad-Deputat Prim Ministru u Ministeru għas-Saħħa
    abbreviation_original: ODPM
    name_en: Office of the Deputy Prime Minister and Ministry for Health
    name_es: Oficina del Viceprimer Ministro y Ministerio de Sanidad
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Deputat Prim Ministru u Ministru
    head_title_en: Deputy Prime Minister and Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [health, elderly, parliamentary_relations]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Health.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        One entity, counted once, although its official name contains two offices. The deputy prime
        ministership is a personal office attached to a minister, not a department: Government
        Notice 844 gives the two as a single heading with a single list of subjects, and Government
        Notice 842 appoints one person to both. The subjects assigned are health services
        regulation and standards, health services, parliamentary affairs, the elderly, community
        care and homes for the elderly — hence parliamentary relations, which in most cabinets
        sits in the prime minister's office, and ageing and elderly care, exercised through the parliamentary
        secretary for active ageing who serves within this ministry.
      es: >-
        Una sola entidad, contada una sola vez, aunque su nombre oficial contenga dos cargos. La
        vicejefatura del gobierno es un cargo personal adscrito a un ministro, no un departamento:
        el Government Notice 844 da los dos como un único encabezamiento con una única lista de
        materias, y el Government Notice 842 nombra a una sola persona para ambos. Las materias
        asignadas son la regulación y estándares de los servicios de salud, los servicios de salud,
        los asuntos parlamentarios, los mayores, los cuidados comunitarios y las residencias de
        mayores: de ahí relaciones con el parlamento, que en la mayoría de gabinetes está en la oficina
        del primer ministro, y envejecimiento y cuidados de mayores, ejercida a través del secretario parlamentario de
        envejecimiento activo que sirve dentro de este ministerio.

  - id: MT-2026-accommodation-lands
    order: 3
    name_original: Ministeru għall-Akkomodazzjoni u l-Artijiet
    abbreviation_original: MAL
    name_en: Ministry for Accommodation and Lands
    name_es: Ministerio de Vivienda y Tierras
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [housing, state_assets]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Accommodation.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        "Accommodation" is social housing, affordable housing and rent; "Lands" is the state's own
        land and property, with the Lands Registry, which is why this ministry carries
        state assets and privatisation as well as housing. A reader looking for a "Ministry for Housing" will not
        find that name in this legislature.
      es: >-
        «Accommodation» es la vivienda social, la asequible y el alquiler; «Lands» son los terrenos
        y propiedades del Estado, con el Registro de la Propiedad, y por eso este ministerio lleva
        patrimonio estatal y privatizaciones además de vivienda. Quien busque un «Ministry for Housing» no encontrará ese
        nombre en esta legislatura.

  - id: MT-2026-social-policy-family
    order: 4
    name_original: Ministeru għall-Politika Soċjali u l-Familja
    abbreviation_original: MSF
    name_en: Ministry for Social Policy and the Family
    name_es: Ministerio de Política Social y Familia
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [social_affairs, family, social_security]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Family.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Malta's welfare ministry. The subjects assigned are social policy, family policy, child
        policy, social security, pensions and solidarity services, so it carries social security and pensions
        as well as social affairs and welfare — Malta has no separate pensions or social-insurance ministry —
        and family and children on the strength of the assignment rather than the title alone.
      es: >-
        El ministerio de bienestar de Malta. Las materias asignadas son la política social, la
        familiar, la de infancia, la seguridad social, las pensiones y los servicios de
        solidaridad, así que lleva seguridad social y pensiones además de asuntos sociales y bienestar —Malta no tiene
        ministerio separado de pensiones o seguridad social— y familia e infancia por la asignación y no solo
        por el título.

  - id: MT-2026-agriculture-fisheries-food
    order: 5
    name_original: Ministeru għall-Agrikoltura, is-Sajd u l-Provvista tal-Ikel
    abbreviation_original: MAFF
    name_en: Ministry for Agriculture, Fisheries and Food Supply
    name_es: Ministerio de Agricultura, Pesca y Abastecimiento Alimentario
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [agriculture, fisheries, food_safety, rural_development]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Agriculture.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Rural development heads the list of subjects assigned, ahead of agriculture, horticulture,
        plant protection, food, fisheries, aquaculture and veterinary services, which is why
        rural development is tagged although the title does not mention it. "Food Supply" in the
        title is food security and the supply chain — the point of the portfolio for an island that
        imports most of what it eats — and is tagged food and food safety, the nearest area in the
        project's fixed vocabulary and the one other countries' food portfolios use. Animal welfare
        is not tagged here: the instrument assigns it to the energy and environment ministry,
        although veterinary services are assigned to this one.
      es: >-
        El desarrollo rural encabeza la lista de materias asignadas, por delante de la agricultura,
        la horticultura, la protección vegetal, la alimentación, la pesca, la acuicultura y los
        servicios veterinarios, y por eso se etiqueta desarrollo rural aunque el título no lo
        mencione. «Food Supply» en el título es la seguridad del abastecimiento y la cadena de
        suministro —la razón de ser de la cartera en una isla que importa casi todo lo que come— y
        se etiqueta alimentación y seguridad alimentaria, el área más próxima del vocabulario fijo del proyecto y la que
        usan las carteras alimentarias de otros países. El bienestar animal no se etiqueta aquí: el
        instrumento lo asigna al ministerio de energía y medio ambiente, aunque los servicios
        veterinarios sí correspondan a este.

  - id: MT-2026-economy-technology
    order: 6
    name_original: Ministeru għall-Ekonomija, it-Teknoloġija u Proġetti Strateġiċi
    abbreviation_original: METP
    name_en: Ministry for the Economy, Technology and Strategic Projects
    name_es: Ministerio de Economía, Tecnología y Proyectos Estratégicos
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [economy, digital, industry, small_business, state_assets]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Economy.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Economic policy other than fiscal policy, which is assigned to the finance ministry. The
        subjects assigned run from artificial intelligence and the digital economy through
        industry, industrial parks and hubs, the Freeport, crafts and cooperatives to small
        businesses, government investments and privatisation — hence digital government and digitalisation, industry and manufacturing,
        small business and entrepreneurship and state assets and privatisation alongside economy. Research and innovation are not
        tagged here: the instrument assigns them to the justice ministry. The government's list of
        ministries drops the definite article from the English name; the instrument keeps it, as
        the Maltese does, and the instrument is followed.
      es: >-
        La política económica distinta de la fiscal, que se asigna al ministerio de finanzas. Las
        materias asignadas van de la inteligencia artificial y la economía digital a la industria,
        los parques y polos industriales, el Freeport, la artesanía y las cooperativas, hasta las
        pymes, las inversiones del Estado y las privatizaciones: de ahí digitalización y gobierno digital, industria y manufactura,
        pymes y emprendimiento y patrimonio estatal y privatizaciones junto a economía. La investigación y la innovación no se
        etiquetan aquí: el instrumento las asigna al ministerio de justicia. La lista oficial de
        ministerios suprime el artículo en el nombre inglés; el instrumento lo mantiene, como el
        maltés, y se sigue el instrumento.

  - id: MT-2026-inclusion-voluntary
    order: 7
    name_original: Ministeru għall-Inklużjoni u l-Volontarjat
    abbreviation_original: MIV
    name_en: Ministry for Inclusion and the Voluntary Sector
    name_es: Ministerio de Inclusión y Voluntariado
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [disability, social_affairs]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Inclusion.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        In Malta "inclusion" is principally disability policy: the subjects assigned are inclusion,
        persons with disability, care for persons with disability, and non-governmental and
        voluntary organisations. disability is therefore tagged first, ahead of social affairs and welfare.
        The voluntary and non-governmental sector, the second half of the title, has no id in the
        project's vocabulary and is not tagged at all; social affairs and welfare is the nearest home for it.
      es: >-
        En Malta «inclusión» es sobre todo política de discapacidad: las materias asignadas son la
        inclusión, las personas con discapacidad, su atención, y las organizaciones no
        gubernamentales y de voluntariado. Por eso se etiqueta discapacidad primero, antes de
        asuntos sociales y bienestar. El sector voluntario y no gubernamental, la segunda mitad del título, no
        tiene id en el vocabulario del proyecto y no se etiqueta; asuntos sociales y bienestar es su hogar más
        próximo.

  - id: MT-2026-gozo
    order: 8
    name_original: Ministeru għal Għawdex
    abbreviation_original: MFG
    name_en: Ministry for Gozo
    name_es: Ministerio de Gozo
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [regional_development, territorial_administration]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Gozo.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        A central-government ministry with a territorial remit, not a regional government, and
        counted for that reason. The instrument assigns it "Gozo Affairs (excluding health
        services and education but including all infrastructural works related to the education
        sector)" and wild birds regulation — a carve-up of national government business by
        territory, with two subjects carved back out, and not a transfer of power to an island
        that has no legislature and no devolved competences. Excluding it as subnational
        government would be a category error; see the methodology note.
      es: >-
        Un ministerio del gobierno central con ámbito territorial, no un gobierno regional, y
        por eso se cuenta. El instrumento le asigna «Gozo Affairs (excluding health services and
        education but including all infrastructural works related to the education sector)» y la
        regulación de las aves silvestres: un reparto territorial de los asuntos del gobierno
        nacional, con dos materias excluidas, y no una transferencia de poder a una isla que no
        tiene legislatura ni competencias propias. Excluirlo como administración subestatal
        sería un error de categoría; véase la nota metodológica.

  - id: MT-2026-education-sports
    order: 9
    name_original: Ministeru għall-Edukazzjoni u l-Isport
    abbreviation_original: MES
    name_en: Ministry for Education and Sports
    name_es: Ministerio de Educación y Deporte
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [education, higher_education, sport]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Education.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        One education ministry for all levels: the subjects assigned are childcare and early
        education, compulsory education, higher education, life-long learning, examinations, sport
        and sport complexes, so this entity carries both school education and higher education where
        Ireland splits them between two departments. Research is not tagged here — the instrument
        assigns it to justice. The ministry is also assigned citizenship, residence programmes and
        the monitoring of their promotion; that is not tagged migration and asylum, because Malta's
        investment-migration schemes are not the migration and asylum portfolio, which the
        instrument splits between home affairs and the infrastructure and employment ministry. The
        English name is the instrument's plural "Sports"; the government's portal writes "Sport".
      es: >-
        Un solo ministerio de educación para todos los niveles: las materias asignadas son el
        cuidado infantil y la educación temprana, la educación obligatoria, la superior, el
        aprendizaje permanente, los exámenes, y el deporte y sus instalaciones, de modo que esta
        entidad lleva educación escolar y universidades donde Irlanda los reparte entre dos
        departamentos. La investigación no se etiqueta aquí: el instrumento la asigna a justicia. Al
        ministerio se le asignan además la ciudadanía, los programas de residencia y la supervisión
        de su promoción; eso no se etiqueta migración y asilo, porque los programas de migración por
        inversión de Malta no son la cartera de migración y asilo, que el instrumento reparte entre
        interior y el ministerio de infraestructuras y empleo. El nombre inglés es el plural
        «Sports» del instrumento; el portal del gobierno escribe «Sport».

  - id: MT-2026-energy-environment
    order: 10
    name_original: Ministeru għall-Enerġija, l-Ambjent u r-Riġenerazzjoni tal-Port il-Kbir
    abbreviation_original: MEER
    name_en: Ministry for Energy, the Environment and the Regeneration of the Grand Harbour
    name_es: Ministerio de Energía, Medio Ambiente y Regeneración del Gran Puerto
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [energy, environment, climate, water, infrastructure, animal_welfare]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Energy.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        The widest assignment in the cabinet, and the clearest case for tagging from the instrument
        rather than the title. Alongside energy policy, alternative energy and environmental and
        resources policy, the subjects assigned include "Climate Change Policy" and "Water Policy",
        neither of which appears in the ministry's name, so Malta does have a ministry carrying
        climate and water. public works and infrastructure is for the regeneration of the Grand Harbour, the
        deep natural harbour around Valletta, together with urban embellishment and landscaping.
        animal welfare is tagged because the instrument assigns animal welfare here, exercised
        through the parliamentary secretary who serves within this ministry.
      es: >-
        La asignación más amplia del gabinete, y el caso más claro a favor de etiquetar por el
        instrumento y no por el título. Junto a la política energética, las energías alternativas y
        la política ambiental y de recursos, las materias asignadas incluyen «Climate Change Policy»
        y «Water Policy», ninguna de las cuales aparece en el nombre del ministerio, de modo que
        Malta sí tiene un ministerio que lleva clima y agua. obras públicas e infraestructuras corresponde a
        la regeneración del Gran Puerto, la rada natural profunda que rodea La Valeta, junto con el
        embellecimiento y el paisajismo urbanos. Se etiqueta bienestar animal porque el instrumento
        asigna aquí el bienestar animal, ejercido a través del secretario parlamentario que sirve
        dentro de este ministerio.

  - id: MT-2026-finance
    order: 11
    name_original: Ministeru għall-Finanzi
    abbreviation_original: MFF
    name_en: Ministry for Finance
    name_es: Ministerio de Finanzas
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [finance, budget, economy]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Finance.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Unlike Ireland, Malta does not split the treasury function: economic policy, fiscal policy,
        the Budget Office, the Treasury, inland revenue, indirect taxation, customs and excise,
        contracts, statistics, relations with the Central Bank of Malta, financial services and oil
        exploration are all assigned here, so one entity carries finance and treasury and budget and public spending. economy
        is tagged on both this ministry and the economy ministry, because economic policy is named
        in this assignment and the wider economic brief in the other — a shared area the matrix is
        meant to show rather than hide. The Central Bank of Malta appears in the assignment only as
        a body the ministry has relations with; it is an independent monetary authority outside the
        executive and is not recorded as an entity.
      es: >-
        A diferencia de Irlanda, Malta no divide la función de hacienda: la política económica, la
        fiscal, la Oficina del Presupuesto, el Tesoro, la recaudación, la imposición indirecta,
        aduanas e impuestos especiales, la contratación, la estadística, las relaciones con el Banco
        Central de Malta, los servicios financieros y la exploración petrolífera se asignan todos
        aquí, de modo que una sola entidad lleva hacienda y tesoro y presupuesto y gasto público. economía se etiqueta en este
        ministerio y en el de economía, porque la política económica figura en esta asignación y el
        mandato económico más amplio en la otra: un área compartida que la matriz debe mostrar y no
        ocultar. El Banco Central de Malta aparece en la asignación solo como organismo con el que
        el ministerio mantiene relaciones; es autoridad monetaria independiente ajena al ejecutivo y
        no se registra como entidad.

  - id: MT-2026-justice-research
    order: 12
    name_original: Ministeru għall-Ġustizzja, ir-Riċerka u l-Innovazzjoni
    abbreviation_original: MJRI
    name_en: Ministry for Justice, Research and Innovation
    name_es: Ministerio de Justicia, Investigación e Innovación
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [justice, research, innovation, space]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Justice.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        An unusual assignment, and a good argument for tagging by policy area rather than by name:
        research and innovation, science and "Space Strategy" are assigned alongside the Courts of
        Justice, the Office of the Attorney General, the Office of the State Advocate, the Notary to
        Government, data protection and freedom of information. space rests on that named
        subject. A cross-country comparison that looked for Malta's research or space portfolio
        under an education, science or transport ministry would not find it. The Attorney General
        and the State Advocate appear in the assignment as offices under this ministry; they are
        legal officers, not ministers, and are not recorded as entities.
      es: >-
        Una asignación inusual, y un buen argumento para etiquetar por área y no por nombre: la
        investigación y la innovación, la ciencia y la «Space Strategy» se asignan junto a los
        Tribunales de Justicia, la Oficina del Fiscal General, la Oficina del Abogado del Estado, el
        Notario del Gobierno, la protección de datos y el acceso a la información. espacio se apoya
        en esa materia expresa. Una comparación internacional que buscara la cartera de
        investigación o de espacio de Malta en un ministerio de educación, ciencia o transporte no
        la encontraría. El fiscal general y el abogado del Estado aparecen en la asignación como
        oficinas bajo este ministerio; son cargos jurídicos, no ministros, y no se registran como
        entidades.

  - id: MT-2026-infrastructure-planning-employment
    order: 13
    name_original: Ministeru għall-Infrastruttura, l-Ippjanar u x-Xogħol
    abbreviation_original: MIPE
    name_en: Ministry for Infrastructure, Planning and Employment
    name_es: Ministerio de Infraestructuras, Planificación y Empleo
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [infrastructure, spatial_planning, labour, migration]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/PLANNING.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        "Planning" here is development planning and the Planning Authority, not economic planning,
        hence spatial planning and land use. The subjects assigned are development planning, infrastructural
        projects, roads, employment and training, construction, occupational health and safety,
        national identity management, and "Legal Migration and Expatriate Affairs". migration and asylum is
        tagged for that last subject: Malta splits the migration brief, with legal migration and
        identity documentation here and irregular migration in home affairs, so two ministries carry
        the area. Employment law and workplace safety sit in the same ministry as roads and
        development consent, which is a Maltese peculiarity — social dialogue is assigned to a
        third ministry and benefits to a fourth.
      es: >-
        «Planning» aquí es la planificación del desarrollo y la Planning Authority, no la
        planificación económica, de ahí ordenación del territorio. Las materias asignadas son la
        planificación del desarrollo, los proyectos de infraestructura, las carreteras, el empleo y
        la formación, la construcción, la salud y seguridad laboral, la gestión de la identidad
        nacional y «Legal Migration and Expatriate Affairs». migración y asilo se etiqueta por esta última:
        Malta divide la cartera migratoria, con la migración legal y la documentación de identidad
        aquí y la irregular en interior, de modo que dos ministerios llevan el área. El derecho
        laboral y la seguridad en el trabajo están en el mismo ministerio que las carreteras y las
        licencias urbanísticas, peculiaridad maltesa: el diálogo social se asigna a un tercer
        ministerio y las prestaciones a un cuarto.

  - id: MT-2026-tourism
    order: 14
    name_original: Ministeru għat-Turiżmu
    abbreviation_original: MFT
    name_en: Ministry for Tourism
    name_es: Ministerio de Turismo
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [tourism]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Tourism.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        The narrowest assignment in the cabinet: the instrument gives this ministry two subjects,
        tourism and tourism studies, and nothing else. Malta is one of the smaller states that
        nonetheless gives tourism a department of its own rather than attaching it to the economy or
        to culture, which is precisely the kind of structural choice the policy-area matrix exists
        to surface.
      es: >-
        La asignación más estrecha del gabinete: el instrumento da a este ministerio dos materias,
        el turismo y los estudios turísticos, y nada más. Malta es uno de los estados pequeños que
        aun así da al turismo departamento propio en lugar de adosarlo a la economía o a la cultura,
        que es exactamente el tipo de decisión estructural que la matriz de áreas existe para hacer
        visible.

  - id: MT-2026-sustainable-mobility
    order: 15
    name_original: Ministeru għall-Mobbiltà Sostenibbli
    abbreviation_original: MSM
    name_en: Ministry for Sustainable Mobility
    name_es: Ministerio de Movilidad Sostenible
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [transport, shipping]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Sustainable_Mobility.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Malta's transport ministry, named for the policy goal rather than the sector. The instrument
        assigns it exactly four subjects — ports, maritime affairs, aviation and internal transport —
        so shipping and ports is tagged alongside transport, as it must be for an island state. Roads are
        assigned to the infrastructure ministry, so this is a ministry of movement rather than of
        tarmac.
      es: >-
        El ministerio de transporte de Malta, nombrado por el objetivo político y no por el sector.
        El instrumento le asigna exactamente cuatro materias —puertos, asuntos marítimos, aviación y
        transporte interno—, así que se etiqueta marina mercante y puertos junto a transporte, como debe ser en un
        estado insular. Las carreteras se asignan al ministerio de infraestructuras, así que este es
        un ministerio del movimiento y no del asfalto.

  - id: MT-2026-foreign-european-affairs
    order: 16
    name_original: Ministeru għall-Affarijiet Barranin u Ewropej
    abbreviation_original: MFEA
    name_en: Ministry for Foreign and European Affairs
    name_es: Ministerio de Asuntos Exteriores y Europeos
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [foreign_affairs, european_affairs, trade, diaspora]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Foreign.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Relations with foreign countries, with the European Union and with international
        organisations and institutions, plus EU internal coordination, commercial diplomacy,
        international trade and cooperation, and trade promotion — hence trade and commerce, which in many
        cabinets sits in an economy or enterprise ministry. diaspora and citizens abroad is tagged for "Maltese
        Communities Abroad": a small state with a large emigrant population gives that its own line.
        Development cooperation is not tagged, because the assignment names trade and cooperation
        together without a distinct development remit.
      es: >-
        Las relaciones con países extranjeros, con la Unión Europea y con las organizaciones e
        instituciones internacionales, más la coordinación interna sobre la UE, la diplomacia
        comercial, el comercio y la cooperación internacionales y la promoción comercial: de ahí
        comercio, que en muchos gabinetes está en un ministerio de economía o de empresa. diáspora y ciudadanos en el exterior
        se etiqueta por «Maltese Communities Abroad»: un estado pequeño con gran población emigrada
        le da línea propia. No se etiqueta la cooperación al desarrollo, porque la asignación nombra
        comercio y cooperación juntos sin un mandato de desarrollo distinto.

  - id: MT-2026-local-government-public-works
    order: 17
    name_original: Ministeru għall-Gvern Lokali u x-Xogħlijiet Pubbliċi
    abbreviation_original: MLGP
    name_en: Ministry for Local Government and Public Works
    name_es: Ministerio de Gobierno Local y Obras Públicas
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [territorial_administration, infrastructure]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Local_Government.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Malta's local councils are the only elected tier below the national government, and this is
        the central ministry to which the instrument assigns them, together with public works,
        manufacturing and services, and public cleansing and maintenance. It is tagged
        territorial and local government for that reason and is not excluded as a subnational body: it is
        itself central government, supervising local government rather than being part of it. It
        shares public works and infrastructure with two other ministries; three ministries holding one area is what
        the matrix is for.
      es: >-
        Los consejos locales malteses son el único nivel electo por debajo del gobierno nacional, y
        este es el ministerio central al que el instrumento se los asigna, junto con las obras
        públicas, la manufactura y los servicios, y la limpieza y el mantenimiento públicos. Se
        etiqueta administración territorial y local por eso y no se excluye como órgano subnacional: él
        mismo es gobierno central y supervisa al gobierno local en lugar de formar parte de él.
        Comparte obras públicas e infraestructuras con otros dos ministerios; que tres ministerios lleven una misma
        área es para lo que sirve la matriz.

  - id: MT-2026-european-funds
    order: 18
    name_original: Ministeru għall-Fondi Ewropej, id-Djalogu Soċjali u l-Protezzjoni tal-Konsumatur
    abbreviation_original: MFDC
    name_en: Ministry for European Funds, Social Dialogue and Consumer Protection
    name_es: Ministerio de Fondos Europeos, Diálogo Social y Protección del Consumidor
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [regional_development, labour, consumer_protection]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Eu_Funds.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Four subjects that go together in few other cabinets: European funds, social dialogue,
        employment and industrial relations, and consumer rights. European cohesion and recovery
        funds are tagged regional development and cohesion funds, the project's area for cohesion funds. Social
        dialogue and industrial relations are tagged labour and employment, which this ministry therefore shares
        with the infrastructure and employment ministry. Consumer protection is its own area, and
        Malta is one of the few countries that names it in a ministry title.
      es: >-
        Cuatro materias que van juntas en pocos gabinetes más: fondos europeos, diálogo social,
        empleo y relaciones industriales, y derechos del consumidor. Los fondos europeos de cohesión
        y recuperación se etiquetan desarrollo regional y fondos de cohesión, el área del proyecto para los fondos de
        cohesión. El diálogo social y las relaciones industriales se etiquetan trabajo y empleo, que este
        ministerio comparte por tanto con el de infraestructuras y empleo. La protección del
        consumidor es área propia, y Malta es uno de los pocos países que la nombra en el título de
        un ministerio.

  - id: MT-2026-home-affairs-security
    order: 19
    name_original: Ministeru għall-Intern u s-Sigurtà
    abbreviation_original: MHS
    name_en: Ministry for Home Affairs and Security
    name_es: Ministerio del Interior y Seguridad
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [interior, defence, migration, civil_protection]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Home_Affairs.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Malta has no defence ministry, but it does have a defence portfolio, and the instrument puts
        it here. The subjects assigned to this ministry begin "Defence, Armed Forces, Law
        Enforcement, Police, Immigration, Aviation Security, Correctional Services, Detention
        Services, Probation and Parole, Civil Protection, Protection of Critical Infrastructure,
        Irregular Migration", so defence rests on a named assignment rather than on the title — a
        reader who counted defence ministries by name would record Malta as having no defence
        portfolio at all, which is wrong. migration and asylum covers immigration and irregular migration;
        legal migration is assigned to the infrastructure and employment ministry, so the area
        appears twice in Malta's row. civil protection and emergencies is likewise a named subject.
      es: >-
        Malta no tiene ministerio de defensa, pero sí tiene cartera de defensa, y el instrumento la
        sitúa aquí. Las materias asignadas a este ministerio empiezan con «Defence, Armed Forces,
        Law Enforcement, Police, Immigration, Aviation Security, Correctional Services, Detention
        Services, Probation and Parole, Civil Protection, Protection of Critical Infrastructure,
        Irregular Migration», así que defensa se apoya en una asignación expresa y no en el
        título: quien contara ministerios de defensa por el nombre registraría que Malta no tiene
        ninguna cartera de defensa, lo cual es falso. migración y asilo cubre la inmigración y la
        migración irregular; la migración legal se asigna al ministerio de infraestructuras y empleo,
        así que el área aparece dos veces en la fila de Malta. protección civil y emergencias es igualmente
        materia expresa.

  - id: MT-2026-arts-culture-heritage
    order: 20
    name_original: Ministeru għall-Arti, il-Kultura u l-Wirt Nazzjonali
    abbreviation_original: MACH
    name_en: Ministry for Arts, Culture and National Heritage
    name_es: Ministerio de Artes, Cultura y Patrimonio Nacional
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [culture, media, language_policy]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Culture.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        The subjects assigned are cultural heritage, restoration, the arts, theatres, the Maltese
        language, the National Archives, the National Library, public broadcasting and the film
        industry. media and broadcasting is tagged because public broadcasting and the film industry are named
        subjects — Malta does not put broadcasting in a communications ministry. language policy is
        tagged for "The Maltese Language": the state's stewardship of the national language is
        assigned to culture here, where Ireland assigns the Gaeltacht to a rural development
        department. The ministry's own portfolio page styles it "…and the National Heritage"; the
        instrument and the government's list of ministries both drop the article, and the instrument
        is followed.
      es: >-
        Las materias asignadas son el patrimonio cultural, la restauración, las artes, los teatros,
        la lengua maltesa, el Archivo Nacional, la Biblioteca Nacional, la radiodifusión pública y la
        industria del cine. Se etiqueta medios y radiodifusión porque la radiodifusión pública y el cine son
        materias expresas: Malta no sitúa la radiodifusión en un ministerio de comunicaciones. Se
        etiqueta política lingüística por «The Maltese Language»: la tutela estatal de la lengua
        nacional se asigna aquí a cultura, donde Irlanda asigna la Gaeltacht a un departamento de
        desarrollo rural. La página de portafolio del propio ministerio lo titula «…and the National
        Heritage»; el instrumento y la lista oficial de ministerios suprimen el artículo, y se sigue
        el instrumento.

  - id: MT-2026-youth-wellbeing
    order: 21
    name_original: Ministeru għaż-Żgħażagħ, il-Benesseri u l-Implimentazzjoni tal-Programm Elettorali
    abbreviation_original: MYWI
    name_en: Ministry for Youth, Wellbeing and the Implementation of the Electoral Programme
    name_es: Ministerio de Juventud, Bienestar y Ejecución del Programa Electoral
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [youth, government_coordination]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Youths.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        The instrument assigns this ministry two subjects: youth, and implementation of the electoral
        programme. The second is not a sector but a function — a minister charged with driving
        delivery of the governing party's manifesto across the whole of government — and is tagged
        government coordination, the project's area for centre-of-government steering. That is why
        a ministry that sounds like a youth department also appears in the governance cluster. Malta
        is unusual in giving manifesto delivery a named ministry rather than a unit inside the prime
        minister's office. "Wellbeing" appears in the ministry's name but among its assigned subjects
        it does not, and it is therefore not tagged. The Maltese name follows the instrument's
        "l-Implimentazzjoni"; the government's portal writes "l-Implementazzjoni".
      es: >-
        El instrumento asigna a este ministerio dos materias: la juventud y la ejecución del programa
        electoral. La segunda no es un sector sino una función —un ministro encargado de impulsar la
        ejecución del programa del partido gobernante en todo el gobierno— y se etiqueta
        coordinación del gobierno, el área del proyecto para la dirección desde el centro del
        gobierno. Por eso un ministerio que suena a departamento de juventud aparece también en el
        grupo de gobernanza. Malta es inusual al dar a la ejecución del programa un ministerio con
        nombre propio en lugar de una unidad dentro de la oficina del primer ministro. «Wellbeing»
        figura en el nombre del ministerio pero no entre sus materias asignadas, y por eso no se
        etiqueta. El nombre maltés sigue el «l-Implimentazzjoni» del instrumento; el portal del
        gobierno escribe «l-Implementazzjoni».

  - id: MT-2026-equality-civil-rights
    order: 22
    name_original: Ministeru għall-Ugwaljanza u d-Drittijiet Ċivili
    abbreviation_original: MER
    name_en: Ministry for Equality and Civil Rights
    name_es: Ministerio de Igualdad y Derechos Civiles
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru
    head_title_en: Minister
    has_cabinet_seat: true
    counts_as_ministry: true
    policy_areas: [equality]
    url: https://www.gov.mt/en/Government/Government%20of%20Malta/Ministries%20and%20Entities/Pages/Ministries%202026/Equality.aspx
    sources: [gazzetta-21661-gn844-assignment, gazzetta-21661-gn842-ministers]
    note:
      en: >-
        Malta is one of the countries where equality is a ministry rather than a directorate inside
        one, which is exactly the sort of question the policy-area matrix is built to answer. The
        subjects assigned are equality, civil liberties, minority rights, reforms and foreign
        communities. Only equality and anti-discrimination is tagged: civil liberties and minority rights are the same
        portfolio seen from the rights side rather than separate areas, "reforms" is not a sector,
        and foreign communities here is a consultative and integration remit rather than the
        migration and asylum portfolio, which the instrument assigns to two other ministries.
      es: >-
        Malta es uno de los países donde la igualdad es un ministerio y no una dirección general
        dentro de otro, que es justo el tipo de pregunta que la matriz de áreas sirve para responder.
        Las materias asignadas son la igualdad, las libertades civiles, los derechos de las
        minorías, las reformas y las comunidades extranjeras. Solo se etiqueta igualdad y no discriminación: las
        libertades civiles y los derechos de las minorías son la misma cartera vista desde el lado de
        los derechos y no áreas distintas, «reformas» no es un sector, y las comunidades extranjeras
        son aquí un cometido consultivo y de integración y no la cartera de migración y asilo, que el
        instrumento asigna a otros dos ministerios.
