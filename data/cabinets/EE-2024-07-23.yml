entities:
  # --- the head of government: recorded, not counted --------------------------------------
  - id: EE-2024-peaminister
    order: 1
    name_original: Peaminister
    abbreviation_original: null
    name_en: Prime Minister
    name_es: Primer Ministro
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Peaminister
    head_title_en: Prime Minister
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    valid_from: null
    valid_to: null
    url: https://valitsus.ee/en/prime-minister-ministers/prime-minister-kristen-michal
    sources: [rt-vvs-2025-10-01, valitsus-54-koosseis, valitsus-en-ministries]
    note:
      en: >-
        Estonia's Prime Minister heads no ministry. § 3 lõige 1 of the Vabariigi Valitsuse
        seadus makes the members of the government the peaminister and the ministers, and
        § 45 lists no prime-ministerial department, so this entity is a seat without a
        portfolio and is excluded under head_of_government_office. It is recorded rather than
        omitted because that is what makes the cabinet seat count come out at 13 — the figure
        the government publishes for itself — against 11 ministries. The Riigikantselei
        (Government Office), which serves the government and the Prime Minister, is not
        recorded separately: § 76 places it beside the government rather than in it, and § 79
        puts it under a riigisekretär, a civil servant appointed by the Prime Minister who
        attends cabinet with the right to speak and holds no seat.
      es: >-
        El primer ministro estonio no dirige ningún ministerio. El § 3 apartado 1 de la
        Vabariigi Valitsuse seadus hace miembros del gobierno al peaminister y a los
        ministros, y el § 45 no enumera ningún departamento del primer ministro, de modo que
        esta entidad es un asiento sin cartera y se excluye por head_of_government_office. Se
        registra en lugar de omitirse porque es lo que hace que el recuento de asientos dé
        13 —la cifra que el propio gobierno publica— frente a 11 ministerios. La
        Riigikantselei (Oficina del Gobierno), que sirve al gobierno y al primer ministro, no
        se registra aparte: el § 76 la sitúa junto al gobierno y no dentro de él, y el § 79 la
        pone bajo un riigisekretär, funcionario nombrado por el primer ministro que asiste al
        consejo con voz y sin asiento.

  # --- the eleven ministries, in the statutory order of § 45 of the Vabariigi Valitsuse
  # seadus. The order is the Act's own, which is alphabetical in Estonian.
  - id: EE-2024-haridus-ja-teadusministeerium
    order: 2
    name_original: Haridus- ja Teadusministeerium
    abbreviation_original: null
    name_en: Ministry of Education and Research
    name_es: Ministerio de Educación e Investigación
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Haridus- ja teadusminister
    head_title_en: Minister of Education and Research
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [education, research, higher_education, vocational_training, youth, language_policy]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://www.hm.ee
    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, valitsus-en-ministries]
    note:
      en: >-
        § 58 gives this ministry education, research, archives, youth and language policy,
        and with them pre-school, basic, upper-secondary, vocational, higher, hobby and adult
        education. Language policy is tagged because the Keeleamet, the Language Board, is in
        its remit — Estonia has no separate ministry for it. Archives are also this
        ministry's, through the Rahvusarhiiv, and have no home in the project's taxonomy;
        they are not tagged on the Kultuuriministeerium, which holds heritage but not the
        state archives.
      es: >-
        El § 58 atribuye a este ministerio la política de educación, investigación, archivos,
        juventud y lengua, y con ella la educación infantil, básica, secundaria superior,
        profesional, superior, no formal y de adultos. Se etiqueta language_policy porque la
        Keeleamet, la Oficina de la Lengua, está en su ámbito: Estonia no tiene un ministerio
        propio para ello. Los archivos también son de este ministerio, a través del
        Rahvusarhiiv, y no tienen acomodo en la taxonomía del proyecto; no se etiquetan en el
        Kultuuriministeerium, que tiene el patrimonio pero no los archivos del Estado.

  - id: EE-2024-justiits-ja-digiministeerium
    order: 3
    name_original: Justiits- ja Digiministeerium
    abbreviation_original: null
    name_en: Ministry of Justice and Digital Affairs
    name_es: Ministerio de Justicia y Asuntos Digitales
    name_en_provenance: official
    name_es_provenance: translated
