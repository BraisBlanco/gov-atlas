        cartera principal en el sentido en que este dataset etiqueta, y en su ámbito están el
        Kaitsevägi, la Kaitseliit y el Välisluureamet.

  - id: EE-2024-kliimaministeerium
    order: 5
    name_original: Kliimaministeerium
    abbreviation_original: null
    name_en: Ministry of Climate
    name_es: Ministerio del Clima
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Energeetika- ja keskkonnaminister; taristuminister
    head_title_en: Minister of Energy and the Environment; Minister of Infrastructure
    has_cabinet_seat: true
    head_count: 2
    policy_areas: [climate, environment, energy, transport, infrastructure, water, housing, shipping, mining]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://kliimaministeerium.ee
    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, valitsus-uued-ministrid-2025-03-25, valitsus-en-ministries]
    note:
      en: >-
        The only Estonian ministry with two heads, and the reason the country has eleven
        ministries and twelve ministers. Points 4 and 11 of the Prime Minister's korraldus
        each say a minister "juhib Kliimaministeeriumi oma vastutusvaldkonnas", and point 14
        makes them co-equal by requiring joint decisions where their areas overlap; head_count
        is therefore 2 and the entity is counted once. The nine policy areas come from § 61,
        whose remit is much wider than the ministry's name: the green transition and climate
        policy, energy and renewables, environmental and nature protection, water and the
        marine environment, radiation and nuclear safety, subsoil resources and geological
        mapping, the circular economy and waste, housing and construction, and the whole of
        transport, including the Transpordiamet, the state fleet and the transport
        infrastructure. Roughly, the energy and environment minister holds the first half and
        the infrastructure minister the second, but the department is one. The
        energeetika- ja keskkonnaminister post replaced the kliimaminister on 25 March 2025;
        the ministry's statutory name did not change with it, and § 45 still reads
        Kliimaministeerium in the redaktsioonid in force to 1 January 2027.
      es: >-
        El único ministerio estonio con dos titulares, y la razón de que el país tenga once
        ministerios y doce ministros. Los puntos 4 y 11 de la korraldus del primer ministro
        dicen cada uno que un ministro «juhib Kliimaministeeriumi oma vastutusvaldkonnas», y
        el punto 14 los equipara al exigir decisión conjunta cuando sus ámbitos se solapan;
        head_count es por tanto 2 y la entidad se cuenta una sola vez. Las nueve áreas vienen
        del § 61, cuyo ámbito es mucho más amplio que el nombre del ministerio: la transición
        verde y la política climática, la energía y las renovables, la protección del medio
        ambiente y la naturaleza, el agua y el medio marino, la seguridad radiológica y
        nuclear, los recursos del subsuelo y la cartografía geológica, la economía circular y
        los residuos, la vivienda y la construcción, y todo el transporte, incluida la
        Transpordiamet, la flota estatal y las infraestructuras de transporte. A grandes
        rasgos, el ministro de Energía y Medio Ambiente tiene la primera mitad y el de
        Infraestructuras la segunda, pero el departamento es uno. El puesto de energeetika- ja
        keskkonnaminister sustituyó al de kliimaminister el 25 de marzo de 2025; el nombre
        legal del ministerio no cambió con él, y el § 45 sigue diciendo Kliimaministeerium en
        las redacciones vigentes hasta el 1 de enero de 2027.

