    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, justdigi-en, valitsus-en-ministries]
    note:
      en: >-
        The Justiitsministeerium under its pre-2025 name; item 2 of § 45 was amended with
        effect from 1 January 2025 (RT I, 30.12.2024, 1) and § 59 was rewritten at the same
        time to add digital society policy, the coordination of public e-services, digital
        skills, national cyber security, state information systems and data policy, and
        "telekommunikatsiooni korraldamine" — all of them taken from the Majandus- ja
        Kommunikatsiooniministeerium, along with the Riigi Infosüsteemi Amet. That is why
        digital and telecommunications are tagged here rather than on the ministry whose name
        still contains the word Kommunikatsiooni. The ministry also holds competition
        supervision and the Konkurentsiamet, which the project's taxonomy has no id for, and
        supervision of the legality of local authorities' administrative acts, which is
        recorded here in prose rather than as a territorial_administration tag because it is
        oversight rather than a local-government portfolio.
      es: >-
        El Justiitsministeerium bajo su nombre anterior a 2025; el punto 2 del § 45 se
        modificó con efectos de 1 de enero de 2025 (RT I, 30.12.2024, 1) y el § 59 se
        reescribió al mismo tiempo para añadir la política de sociedad digital, la
        coordinación de los servicios públicos electrónicos, las competencias digitales, la
        ciberseguridad nacional, los sistemas de información del Estado y la política de
        datos, y la «telekommunikatsiooni korraldamine», todo ello tomado del Majandus- ja
        Kommunikatsiooniministeerium junto con la Riigi Infosüsteemi Amet. Por eso digital y
        telecommunications se etiquetan aquí y no en el ministerio cuyo nombre todavía
        contiene la palabra Kommunikatsiooni. El ministerio tiene además la supervisión de la
        competencia y la Konkurentsiamet, para la que la taxonomía del proyecto no tiene id, y
        el control de legalidad de los actos administrativos de los municipios, que se
        registra aquí en prosa y no como etiqueta territorial_administration por tratarse de
        una tutela y no de una cartera de administración local.

