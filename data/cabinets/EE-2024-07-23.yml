    url: https://www.kul.ee
    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, valitsus-en-ministries]
    note:
      en: >-
        Two names in English, both the government's own: valitsus.ee calls it the "Ministry
        of Cultural Affairs" and the ministry's own site the "Ministry of Culture", while the
        minister is styled "Minister of Culture" on both. The portal's form is used for the
        ministry and the ministry's for the minister, and neither is this project's
        invention. § 62 gives it culture and heritage protection, cultural diversity and
        integration, the arts, sport and physical activity, and a part in the state's media
        policy; the korraldus adds that the minister is the responsible minister under the
        Eesti Rahvusringhääling Act, which is why media is tagged. Integration — the
        "lõimumine" that this ministry, not the interior ministry, is responsible for — has no
        id in the project's taxonomy and is recorded here only in prose.
      es: >-
        Dos nombres en inglés, ambos del propio gobierno: valitsus.ee lo llama «Ministry of
        Cultural Affairs» y la web del ministerio «Ministry of Culture», mientras que en
        ambas el titular es «Minister of Culture». Se usa la forma del portal para el
        ministerio y la del ministerio para el ministro, y ninguna es invención de este
        proyecto. El § 62 le atribuye la cultura y la protección del patrimonio, la diversidad
        cultural y la integración, las artes, el deporte y la actividad física, y una parte de
        la política de medios del Estado; la korraldus añade que el ministro es el responsable
        a efectos de la ley de la Eesti Rahvusringhääling, y por eso se etiqueta media. La
        integración —la «lõimumine» de la que responde este ministerio y no el del Interior—
        no tiene id en la taxonomía del proyecto y aquí sólo consta en prosa.

  - id: EE-2024-majandus-ja-kommunikatsiooniministeerium
    order: 7
    name_original: Majandus- ja Kommunikatsiooniministeerium
    abbreviation_original: null
    name_en: Ministry of Economic Affairs and Communications
    name_es: Ministerio de Asuntos Económicos y Comunicaciones
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Majandus- ja tööstusminister
    head_title_en: Minister of Economy and Industry
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [economy, industry, labour, trade, innovation, tourism, consumer_protection, spatial_planning, equality, space]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://www.mkm.ee
    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, valitsus-en-ministries]
    note:
      en: >-
        The ministry whose name has outlived its remit: communications left on 1 January 2025
        for the Justiits- ja Digiministeerium, and § 45 has not been amended to follow, so the
        Kommunikatsiooni in the name now refers to nothing this ministry does. What § 63 does
        give it is economic, enterprise, employment and labour-market policy, business R&D and
        innovation, the real-time economy, industry, space and tourism, exports and inward
        investment, metrology and standardisation, consumer protection and trade, industrial
        safety, employment relations and the working environment, equal treatment and gender
        equality including accessibility, and — since January 2025, taken from the regional
        ministry along with the Maa- ja Ruumiamet — land-use policy and spatial planning. The
        equality tag sits here for that reason and not on a ministry of equality, which
        Estonia does not have; note that drafting the gender equality act is expressly carved
        out and given to the justice and digital minister. Foreign trade is the other
        anomaly: § 69 gives it to the Välisministeerium, but point 6 of the Prime Minister's
        korraldus puts that ministry's trade units under this minister, so trade is tagged
        here. The minister's own title, majandus- ja tööstusminister, mentions industry rather
        than communications.
      es: >-
        El ministerio cuyo nombre ha sobrevivido a su ámbito: las comunicaciones se fueron el
        1 de enero de 2025 al Justiits- ja Digiministeerium y el § 45 no se ha modificado en
        consecuencia, de modo que el Kommunikatsiooni del nombre ya no se corresponde con nada
        que este ministerio haga. Lo que el § 63 sí le da es la política económica,
        empresarial, de empleo y de mercado laboral, la I+D y la innovación empresarial, la
        economía en tiempo real, la industria, el espacio y el turismo, la exportación y la
        captación de inversión, la metrología y la normalización, la protección del consumidor
        y el comercio, la seguridad industrial, las relaciones laborales y el entorno de
        trabajo, la igualdad de trato y la igualdad de género incluida la accesibilidad y
        —desde enero de 2025, tomadas del ministerio regional junto con la Maa- ja Ruumiamet—
        la política de uso del suelo y la ordenación del territorio. La etiqueta equality está
        aquí por esa razón y no en un ministerio de igualdad, que Estonia no tiene; nótese que
        la redacción del proyecto de ley de igualdad de género está expresamente excluida y
        atribuida al ministro de Justicia y Asuntos Digitales. El comercio exterior es la otra
        anomalía: el § 69 lo atribuye al Välisministeerium, pero el punto 6 de la korraldus
        del primer ministro pone las unidades comerciales de aquel ministerio bajo este
        ministro, así que trade se etiqueta aquí. El propio título del ministro, majandus- ja
        tööstusminister, menciona la industria y no las comunicaciones.

  - id: EE-2024-rahandusministeerium
    order: 8
    name_original: Rahandusministeerium
    abbreviation_original: null
    name_en: Ministry of Finance
    name_es: Ministerio de Finanzas
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Rahandusminister
    head_title_en: Minister of Finance
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [finance, budget, public_administration, state_assets]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://www.rahandusministeerium.ee
    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, valitsus-en-ministries]
    note:
      en: >-
        § 65 gives it budget, resource management, tax, customs and financial policy,
        economic analysis and forecasting, state aid, accounting and auditing, official
        statistics — the Statistikaamet is in its remit, which is where this dataset's
        Estonian population figure comes from — the civil service and state personnel policy,
        state assets and public procurement, the management of EU funds, and state lending
        and guarantees. public_administration is tagged for the civil service and the
        planning of state administration, and state_assets for state property, state-owned
        companies and the dividends they pay into the budget.
      es: >-
        El § 65 le atribuye la política presupuestaria, de gestión de recursos, fiscal,
        aduanera y financiera, el análisis y la previsión económica, las ayudas de Estado, la
        contabilidad y la auditoría, la estadística oficial —la Statistikaamet está en su
        ámbito, y de ahí procede la cifra de población estonia de este dataset—, la función
        pública y la política de personal del Estado, el patrimonio estatal y la contratación
        pública, la gestión de los fondos europeos y los préstamos y garantías del Estado. Se
        etiqueta public_administration por la función pública y la planificación de la
        administración del Estado, y state_assets por el patrimonio estatal, las empresas
        públicas y los dividendos que ingresan en el presupuesto.

  - id: EE-2024-regionaal-ja-pollumajandusministeerium
    order: 9
    name_original: Regionaal- ja Põllumajandusministeerium
    abbreviation_original: null
    name_en: Ministry of Regional Affairs and Agriculture
    name_es: Ministerio de Asuntos Regionales y Agricultura
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Regionaal- ja põllumajandusminister
    head_title_en: Minister of Regional Affairs and Agriculture
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [regional_development, agriculture, territorial_administration, rural_development, fisheries, food_safety, animal_welfare]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://www.agri.ee
    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, valitsus-en-ministries]
    note:
      en: >-
        The Maaeluministeerium reorganised into this ministry with effect from 1 July 2023 by
        RT I, 30.06.2023, 1, gaining regional and local-government policy. § 65¹ gives it
        rural, agricultural, fisheries and regional policy, local-government policy and the
        financial management of local authorities, domestic public transport policy, the
        protection of agricultural land and land improvement, food security and food safety,
        animal and plant health and welfare, postal services, and agricultural science and
        education. Two of those are not tagged and are recorded here instead. Domestic public
        transport policy would put a second transport tag on the Estonian row when the
        transport department, the Transpordiamet and the transport infrastructure are all in
        the Kliimaministeerium, so transport is tagged there only. Postal services have no id
        in the project's taxonomy. The ministry lost land-use policy, spatial planning and the
        Maa- ja Ruumiamet to the Majandus- ja Kommunikatsiooniministeerium on 1 January 2025,
        which is why spatial_planning is not tagged here.
      es: >-
        El Maaeluministeerium se reorganizó en este ministerio con efectos de 1 de julio de
        2023 por RT I, 30.06.2023, 1, ganando la política regional y de administración local.
        El § 65¹ le atribuye la política de desarrollo rural, agrícola, pesquera y regional,
        la política de los municipios y su gestión financiera, la política de transporte
        público interior, la protección de la tierra agrícola y las mejoras territoriales, la
        seguridad del abastecimiento alimentario y la seguridad alimentaria, la sanidad y el
        bienestar animal y vegetal, los servicios postales y la ciencia y la enseñanza
        agrarias. Dos de ellas no se etiquetan y constan aquí en su lugar. La política de
        transporte público interior pondría una segunda etiqueta transport en la fila estonia
        cuando el departamento de transporte, la Transpordiamet y las infraestructuras de
        transporte están todos en el Kliimaministeerium, así que transport se etiqueta sólo
        allí. Los servicios postales no tienen id en la taxonomía del proyecto. El ministerio
        perdió la política de uso del suelo, la ordenación del territorio y la Maa- ja
        Ruumiamet en favor del Majandus- ja Kommunikatsiooniministeerium el 1 de enero de
        2025, y por eso aquí no se etiqueta spatial_planning.

  - id: EE-2024-siseministeerium
    order: 10
    name_original: Siseministeerium
    abbreviation_original: null
    name_en: Ministry of the Interior
    name_es: Ministerio del Interior
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Siseminister
    head_title_en: Minister of the Interior
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [interior, migration, civil_protection, religion]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://www.siseministeerium.ee
    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, valitsus-en-ministries]
    note:
      en: >-
        § 66 gives it internal security, public order, the border guard, rescue services,
        emergency calls, citizenship and migration, the development of civil society,
        population protection, civil registration and religious associations, with the
        Kaitsepolitseiamet, the Politsei- ja Piirivalveamet, the Päästeamet and the
        Häirekeskus in its remit. Estonia has no separate migration ministry, so migration is
        tagged here; integration, by contrast, belongs to the Kultuuriministeerium. religion
        is tagged for religious associations. Civil society, which is also this ministry's,
        has no id in the project's taxonomy.
      es: >-
        El § 66 le atribuye la seguridad interior, el orden público, la guardia de fronteras,
        los servicios de rescate, las llamadas de emergencia, la ciudadanía y la migración, el
        desarrollo de la sociedad civil, la protección de la población, el registro civil y
        las asociaciones religiosas, con la Kaitsepolitseiamet, la Politsei- ja Piirivalveamet,
        la Päästeamet y el Häirekeskus en su ámbito. Estonia no tiene un ministerio de
        migración propio, así que migration se etiqueta aquí; la integración, en cambio,
        corresponde al Kultuuriministeerium. Se etiqueta religion por las asociaciones
        religiosas. La sociedad civil, también de este ministerio, no tiene id en la taxonomía
        del proyecto.

  - id: EE-2024-sotsiaalministeerium
    order: 11
    name_original: Sotsiaalministeerium
    abbreviation_original: null
    name_en: Ministry of Social Affairs
    name_es: Ministerio de Asuntos Sociales
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Sotsiaalminister
    head_title_en: Minister of Social Affairs
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [social_affairs, social_security, health, family, disability]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://www.sm.ee
    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, valitsus-uued-ministrid-2025-03-25, valitsus-en-ministries]
    note:
      en: >-
        One minister now, two until 25 March 2025. From the day this cabinet took office the
        ministry was led jointly by a sotsiaalkaitseminister and a terviseminister, on the
        same co-equal footing the Kliimaministeerium still uses; both posts were abolished in
        the March 2025 reconstitution and replaced by a single sotsiaalminister, which is the
        one ministerial post the reconstituted cabinet has fewer of. head_count is 1 because
        this file records the structure in force on the access date; the ministry itself was
        never split or merged, so no entity carries a valid_to. § 67 gives it social security,
        social welfare and pensions, the cross-border coordination of social insurance
        systems, children's rights and welfare, the quality of life of disabled people, public
        health, health care and the health system, health insurance, medicines and medical
        devices, with the Sotsiaalkindlustusamet, the Terviseamet and the Ravimiamet in its
        remit.
      es: >-
        Un ministro ahora, dos hasta el 25 de marzo de 2025. Desde el día en que este gobierno
        tomó posesión, el ministerio estuvo dirigido conjuntamente por un sotsiaalkaitseminister
        y un terviseminister, en el mismo pie de igualdad que sigue usando el
        Kliimaministeerium; ambos puestos se suprimieron en la reconstitución de marzo de 2025
        y se sustituyeron por un único sotsiaalminister, que es el puesto ministerial de menos
        que tiene el gabinete reconstituido. head_count es 1 porque este fichero registra la
        estructura vigente en la fecha de consulta; el ministerio en sí nunca se escindió ni se
        fusionó, de modo que ninguna entidad lleva valid_to. El § 67 le atribuye la seguridad
        social, la asistencia social y las pensiones, la coordinación transfronteriza de los
        sistemas de seguro social, los derechos y el bienestar de la infancia, la calidad de
        vida de las personas con discapacidad, la salud pública, la sanidad y el sistema de
        salud, el seguro de enfermedad, los medicamentos y los productos sanitarios, con la
        Sotsiaalkindlustusamet, la Terviseamet y la Ravimiamet en su ámbito.

  - id: EE-2024-valisministeerium
    order: 12
    name_original: Välisministeerium
    abbreviation_original: null
    name_en: Ministry of Foreign Affairs
    name_es: Ministerio de Asuntos Exteriores
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Välisminister
    head_title_en: Minister of Foreign Affairs
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [foreign_affairs, european_affairs, development_cooperation, diaspora]
    counts_as_ministry: true
    valid_from: null
    valid_to: null
    url: https://vm.ee
    sources: [rt-vvs-2025-10-01, rt-peaministri-korraldus-88, valitsus-54-koosseis, valitsus-en-ministries]
    note:
      en: >-
        § 69 gives it foreign policy, treaties, foreign economic relations, the defence of
        Estonia's positions in COREPER and before the Court of Justice, relations with foreign
        states and international organisations, protocol, the protection of Estonian citizens
        and interests abroad, international development and humanitarian aid, and the
        promotion of Estonia. european_affairs is tagged for the COREPER and General Affairs
        Council roles, with the caveat that the coordination of Estonia's EU positions across
        government is a Riigikantselei task under § 77, not this ministry's; diaspora is
        tagged for consular protection of citizens abroad, which is the closest fit the
        taxonomy offers. Foreign trade is not tagged here even though § 69 mentions
        välismajandus, because point 6 of the Prime Minister's korraldus places this
        ministry's trade units under the majandus- ja tööstusminister and point 13 carves that
        area out of the foreign minister's own responsibility; trade is therefore tagged on
        the Majandus- ja Kommunikatsiooniministeerium. Estonia's embassies and consulates are
        part of this ministry's structure, an addition made to § 46 with effect from 1 October
        2025.
      es: >-
        El § 69 le atribuye la política exterior, los tratados, las relaciones económicas
        exteriores, la defensa de las posiciones estonias en el COREPER y ante el Tribunal de
        Justicia, las relaciones con Estados extranjeros y organizaciones internacionales, el
        protocolo, la protección de los ciudadanos e intereses estonios en el extranjero, la
        ayuda internacional al desarrollo y humanitaria y la promoción de Estonia. Se etiqueta
        european_affairs por las funciones en el COREPER y el Consejo de Asuntos Generales,
        con la salvedad de que la coordinación de las posiciones estonias ante la UE en el
        conjunto del gobierno es tarea de la Riigikantselei según el § 77 y no de este
        ministerio; se etiqueta diaspora por la protección consular de los ciudadanos en el
        exterior, que es el encaje más próximo que ofrece la taxonomía. El comercio exterior
        no se etiqueta aquí pese a que el § 69 menciona la välismajandus, porque el punto 6 de
        la korraldus del primer ministro pone las unidades comerciales de este ministerio bajo
        el majandus- ja tööstusminister y el punto 13 excluye ese ámbito de la responsabilidad
        del ministro de Exteriores; trade se etiqueta por tanto en el Majandus- ja
        Kommunikatsiooniministeerium. Las embajadas y consulados de Estonia forman parte de la
        estructura de este ministerio, una adición al § 46 con efectos de 1 de octubre de
        2025.
