# Estonia — Vabariigi Valitsuse 54. koosseis, the government of peaminister Kristen Michal.
#
# See docs/DATA-CONTRACT.md. Four things worth knowing before reading the list:
#
#   1. Estonia is, with Finland, one of the countries in this dataset whose ministries are
#      enumerated in a statute rather than in a reorganisation decree. It is NOT § 3 of the
#      Vabariigi Valitsuse seadus — that section defines who the members of the government
#      are — but § 45, which opens chapter 4 with "Valitsemisalade korraldamiseks on
#      moodustatud järgmised ministeeriumid" and lists eleven. Creating, abolishing or
#      renaming an Estonian ministry means amending that list.
#   2. Eleven ministries, twelve ministers, thirteen cabinet members. The peaminister heads
#      no ministry, and the Kliimaministeerium is headed by two co-equal ministers. Both
#      facts come from the Prime Minister's own korraldus issued under § 3 lõige 2, which is
#      the instrument that says who leads what.
#   3. The count has been eleven throughout, but the names have not. The 2023 reform turned
#      the Keskkonnaministeerium into the Kliimaministeerium and the Maaeluministeerium into
#      the Regionaal- ja Põllumajandusministeerium; on 1 January 2025 the Justiitsministeerium
#      became the Justiits- ja Digiministeerium and took the state's digital and
#      telecommunications remit out of the Majandus- ja Kommunikatsiooniministeerium.
#   4. Ministers changed twice under this cabinet without the ministries changing. The
#      structural facts recorded here are those in force on the access date.

country: EE
cabinet_id: EE-2024-07-23

cabinet_name_original: Vabariigi Valitsuse 54. koosseis
cabinet_name_en: Michal government (54th composition of the Government of the Republic)
cabinet_name_es: Gobierno Michal (54.ª composición del Gobierno de la República)

head_of_government_title_original: Peaminister
head_of_government_title_en: Prime Minister

took_office: 2024-07-23
left_office: null

methodology_notes:
  - en: >-
      11 ministries and 13 cabinet seats. The eleven are exactly the ministries listed in
      § 45 of the Vabariigi Valitsuse seadus, in the consolidated redaktsioon in force from
      1 October 2025 to 30 September 2026, and no other body in Estonia is a ministry: § 46
      lõige 1 defines a ministeerium as a valitsusasutus discharging duties imposed by law,
      and the Act constitutes the ministries by naming them. The thirteen seats are the
      peaminister plus twelve ministers, which is the figure the government publishes for
      itself ("Kristen Michali juhitavas valitsuses on lisaks peaministrile 12 ministrit").
      The gap between eleven and twelve arises entirely inside the Kliimaministeerium, which
      has two ministers; see its entry below. Estonia's constitution caps the government at
      15 members (§ 3 lõige 4 of the Act: "Vabariigi Valitsuses ei ole üle 15 liikme"), so
      the 13 sitting members are two below the statutory ceiling.
    es: >-
      11 ministerios y 13 asientos en el gabinete. Los once son exactamente los ministerios
      enumerados en el § 45 de la Vabariigi Valitsuse seadus, en la redacción consolidada
      vigente del 1 de octubre de 2025 al 30 de septiembre de 2026, y ningún otro órgano
      estonio es un ministerio: el § 46 apartado 1 define el ministeerium como una
      valitsusasutus que cumple funciones impuestas por ley, y la propia ley constituye los
      ministerios al nombrarlos. Los trece asientos son el peaminister más doce ministros,
      que es la cifra que el propio gobierno publica («Kristen Michali juhitavas valitsuses
      on lisaks peaministrile 12 ministrit»). La diferencia entre once y doce se produce
      íntegramente dentro del Kliimaministeerium, que tiene dos ministros; véase su ficha
      más abajo. La ley limita el gobierno a 15 miembros (§ 3 apartado 4: «Vabariigi
      Valitsuses ei ole üle 15 liikme»), de modo que los 13 miembros actuales están dos por
      debajo del techo legal.
  - en: >-
      The Kliimaministeerium is one ministry with two co-equal heads, and that is the
      judgement call in this file. The Prime Minister's korraldus of 12 August 2024 (as
      amended to 31 March 2025) says the energeetika- ja keskkonnaminister "juhib
      Kliimaministeeriumi oma vastutusvaldkonnas, välja arvatud valdkondades, mis on antud
      taristuministri juhtida", and separately that the taristuminister "juhib
      Kliimaministeeriumi oma vastutusvaldkonnas". Neither is subordinate to the other:
      point 14 of the same korraldus provides that where several ministers lead a ministry,
      questions falling to more than one of them are decided jointly. The entity is
      therefore recorded once, counted once, with head_count 2 — one ministry, two seats. A
      curator who treated "Ministry of Energy and the Environment" and "Ministry of
      Infrastructure" as two departments, as several English-language summaries of the
      Estonian cabinet do, would publish 12 ministries; that reading has no support in § 45,
      which knows only the Kliimaministeerium.
    es: >-
      El Kliimaministeerium es un solo ministerio con dos titulares en pie de igualdad, y esa
      es la decisión discutible de este fichero. La korraldus del primer ministro de 12 de
      agosto de 2024 (en su redacción de 31 de marzo de 2025) dice que el energeetika- ja
      keskkonnaminister «juhib Kliimaministeeriumi oma vastutusvaldkonnas, välja arvatud
      valdkondades, mis on antud taristuministri juhtida» y, por separado, que el
      taristuminister «juhib Kliimaministeeriumi oma vastutusvaldkonnas». Ninguno está
      subordinado al otro: el punto 14 de la misma korraldus establece que, cuando varios
      ministros dirigen un ministerio, las cuestiones que afectan a más de uno se deciden
      conjuntamente. La entidad se registra por tanto una sola vez, se cuenta una sola vez y
      lleva head_count 2: un ministerio, dos asientos. Un curador que tratara «Ministry of
      Energy and the Environment» y «Ministry of Infrastructure» como dos departamentos,
      como hacen varios resúmenes en inglés del gabinete estonio, publicaría 12 ministerios;
      esa lectura no tiene apoyo en el § 45, que sólo conoce el Kliimaministeerium.
  - en: >-
      Why the peaminister is recorded but not counted, and why the Riigikantselei is not
      recorded at all. Estonia's Prime Minister heads no ministry: § 3 lõige 1 makes the
      members of the government the peaminister and the ministers, and § 45 does not list a
      prime-ministerial department. The body that serves the government is the
      Riigikantselei (Government Office), which § 76 places "Vabariigi Valitsuse juures" as a
      valitsusasutus and § 79 puts under a riigisekretär — a civil servant appointed by the
      Prime Minister, who attends cabinet with the right to speak but is not a minister and
      holds no seat. So the Riigikantselei is neither a ministry nor a cabinet member, and
      recording it as an entity would either invent a twelfth department or invent a
      fourteenth seat. The peaminister is recorded instead, uncounted, under
      head_of_government_office, which is what makes the seat count come out at 13. This is
      the opposite of the Finnish arrangement, where the valtioneuvoston kanslia is itself
      one of the statutory ministries and is counted.
    es: >-
      Por qué el peaminister se registra pero no se cuenta, y por qué la Riigikantselei no se
      registra en absoluto. El primer ministro estonio no dirige ningún ministerio: el § 3
      apartado 1 hace miembros del gobierno al peaminister y a los ministros, y el § 45 no
      enumera ningún departamento del primer ministro. El órgano que sirve al gobierno es la
      Riigikantselei (Oficina del Gobierno), que el § 76 sitúa «Vabariigi Valitsuse juures»
      como valitsusasutus y que el § 79 pone bajo un riigisekretär: un funcionario nombrado
      por el primer ministro que asiste al consejo con voz pero no es ministro ni tiene
      asiento. La Riigikantselei no es, por tanto, ni ministerio ni miembro del gabinete, y
      registrarla como entidad inventaría un duodécimo departamento o un decimocuarto
      asiento. Se registra en su lugar el peaminister, sin contarlo, por
      head_of_government_office, que es lo que hace que el recuento de asientos dé 13. Es lo
      contrario del caso finlandés, donde la valtioneuvoston kanslia es ella misma uno de los
      ministerios legales y se cuenta.
  - en: >-
      Two changes of ministers under this cabinet, neither of which moved either figure. The
      government took office on 23 July 2024 with the peaminister and 13 ministers. On 11
      March 2025 the three Sotsiaaldemokraatlik Erakond ministers left the coalition and the
      remaining ministers doubled up as acting heads; on 25 March 2025 five new ministers
      were sworn in before the Riigikogu and the government continued as the same 54th
      composition, one ministerial post smaller — "Valitsuse 54. uuenenud koosseisus on
      varasemaga võrreldes üks ministri ametikoht vähem, koos peaministriga on valitsuse
      liikmeid 13." The posts of sotsiaalkaitseminister and terviseminister, who between them
      led the Sotsiaalministeerium until then, were replaced by a single sotsiaalminister,
      and the kliimaminister was retitled energeetika- ja keskkonnaminister. Because the
      change was to ministerial posts and not to departments, no entity here carries a
      valid_to: the eleven ministries of § 45 were untouched, and the file records the
      structure in force on the access date. The government's own composition page still
      publishes the earlier rosters, and this file's took_office is the date the cabinet was
      first sworn in, not the date of the March 2025 reconstitution.
    es: >-
      Dos cambios de ministros bajo este gobierno, ninguno de los cuales movió ninguna de las
      dos cifras. El gobierno tomó posesión el 23 de julio de 2024 con el peaminister y 13
      ministros. El 11 de marzo de 2025 los tres ministros del Sotsiaaldemokraatlik Erakond
      abandonaron la coalición y los ministros restantes asumieron interinidades; el 25 de
      marzo de 2025 cinco nuevos ministros juraron ante el Riigikogu y el gobierno continuó
      como la misma 54.ª composición, con un puesto ministerial menos: «Valitsuse 54.
      uuenenud koosseisus on varasemaga võrreldes üks ministri ametikoht vähem, koos
      peaministriga on valitsuse liikmeid 13.» Los puestos de sotsiaalkaitseminister y
      terviseminister, que hasta entonces dirigían conjuntamente el Sotsiaalministeerium,
      fueron sustituidos por un único sotsiaalminister, y el kliimaminister pasó a titularse
      energeetika- ja keskkonnaminister. Como el cambio afectó a puestos ministeriales y no a
      departamentos, ninguna entidad lleva aquí valid_to: los once ministerios del § 45 no se
      tocaron, y el fichero registra la estructura vigente en la fecha de consulta. La propia
      página de composición del gobierno sigue publicando las listas anteriores, y el
      took_office de este fichero es la fecha en que el gabinete juró por primera vez, no la
      de la reconstitución de marzo de 2025.
  - en: >-
      Two ministry names no longer describe what the ministry does, and the tags follow the
      remit rather than the name. The Majandus- ja Kommunikatsiooniministeerium lost
      communications on 1 January 2025: digital society policy, public e-services,
      cybersecurity, state information systems and "telekommunikatsiooni korraldamine" all
      moved to the Justiits- ja Digiministeerium under § 59, and the Riigi Infosüsteemi Amet
      moved with them, so digital and telecommunications are tagged on the justice ministry
      and not on the one whose name still says Kommunikatsiooni. In the other direction, the
      Kliimaministeerium's remit under § 61 is far wider than climate — energy, environment,
      the marine economy, waste, housing and construction, and the whole of transport — which
      is why it carries nine policy areas. Foreign trade is a third case: § 69 gives it to
      the Välisministeerium, but point 6 of the Prime Minister's korraldus puts the relevant
      Välisministeerium units under the majandus- ja tööstusminister, so trade is tagged on
      the Majandus- ja Kommunikatsiooniministeerium, and the discrepancy is recorded on both
      entities.
    es: >-
      Dos nombres de ministerio ya no describen lo que el ministerio hace, y las etiquetas
      siguen el ámbito y no el nombre. El Majandus- ja Kommunikatsiooniministeerium perdió las
      comunicaciones el 1 de enero de 2025: la política de sociedad digital, los servicios
      públicos electrónicos, la ciberseguridad, los sistemas de información del Estado y la
      «telekommunikatsiooni korraldamine» pasaron al Justiits- ja Digiministeerium por el
      § 59, y con ellos la Riigi Infosüsteemi Amet, de modo que digital y telecommunications
      se etiquetan en el ministerio de justicia y no en el que todavía se llama de
      Comunicaciones. En sentido inverso, el ámbito del Kliimaministeerium según el § 61 es
      mucho más amplio que el clima —energía, medio ambiente, economía marítima, residuos,
      vivienda y construcción y todo el transporte—, y por eso lleva nueve áreas de política.
      El comercio exterior es un tercer caso: el § 69 lo atribuye al Välisministeerium, pero
      el punto 6 de la korraldus del primer ministro pone las unidades correspondientes del
      Välisministeerium bajo el majandus- ja tööstusminister, de modo que trade se etiqueta
      en el Majandus- ja Kommunikatsiooniministeerium y la discrepancia queda anotada en
      ambas entidades.
  - en: >-
      English names are the Estonian government's own, with one documented exception and one
      documented variant. Ten of the eleven English ministry names are copied from the
      ministries menu of the English-language edition of valitsus.ee and are marked
      name_en_provenance official. The exception is the Justiits- ja Digiministeerium: that
      menu still labels its link "Ministry of Justice", the name the ministry had before 1
      January 2025, while the same site's list of ministers already says "Minister of Justice
      and Digital Affairs" and the ministry's own English site is titled "Ministry of Justice
      and Digital Affairs". This file follows the ministry's own current name and cites it.
      The variant is the Kultuuriministeerium, which valitsus.ee calls "Ministry of Cultural
      Affairs" and its own site calls "Ministry of Culture"; the portal's form is used here
      for consistency with the rest of the list, and both are official. All Spanish names are
      this project's own renderings and are marked translated. Estonian has one official
      language, so name_original raises none of the parallel-name questions that Finland's or
      Belgium's entries do.
    es: >-
      Los nombres en inglés son los del propio gobierno estonio, con una excepción y una
      variante documentadas. Diez de los once nombres ingleses de ministerio están copiados
      del menú de ministerios de la edición inglesa de valitsus.ee y llevan
      name_en_provenance official. La excepción es el Justiits- ja Digiministeerium: ese menú
      todavía etiqueta su enlace como «Ministry of Justice», el nombre que el ministerio tuvo
      hasta el 1 de enero de 2025, mientras que la lista de ministros del mismo sitio ya dice
      «Minister of Justice and Digital Affairs» y la propia web inglesa del ministerio se
      titula «Ministry of Justice and Digital Affairs». Este fichero sigue el nombre actual
      del propio ministerio y lo cita. La variante es el Kultuuriministeerium, al que
      valitsus.ee llama «Ministry of Cultural Affairs» y su propia web «Ministry of Culture»;
      aquí se usa la forma del portal por coherencia con el resto de la lista, y ambas son
      oficiales. Todos los nombres en español son traducciones de este proyecto y llevan la
      marca translated. El estonio es la única lengua oficial, de modo que name_original no
      plantea aquí las cuestiones de nombres paralelos que sí plantean Finlandia o Bélgica.
  - en: >-
      Perimeter, and what a future reader should check. This file describes the central
      government of the Republic of Estonia; the 79 kohaliku omavalitsuse üksused are
      subnational and out of scope, and their supervision is a portfolio of the Justiits- ja
      Digiministeerium and the Regionaal- ja Põllumajandusministeerium rather than a ministry
      of their own. The President of the Republic is head of state and is not part of the
      government. The Vabariigi Valitsuse seadus has two later redaktsioonid already
      published at the access date — one in force from 1 October 2026 (RT I, 30.06.2026, 43)
      and one from 1 January 2027 (RT I, 11.07.2026, 157) — and the § 45 list of eleven is
      identical in both, so the count is not due to change before the March 2027 Riigikogu
      election on any instrument published so far.
    es: >-
      Perímetro y qué debería comprobar un lector futuro. Este fichero describe el gobierno
      central de la República de Estonia; las 79 kohaliku omavalitsuse üksused son
      subnacionales y quedan fuera de alcance, y su supervisión es una cartera del Justiits-
      ja Digiministeerium y del Regionaal- ja Põllumajandusministeerium y no un ministerio
      propio. El Presidente de la República es jefe del Estado y no forma parte del gobierno.
      La Vabariigi Valitsuse seadus tiene ya publicadas en la fecha de consulta dos
      redacciones posteriores —una vigente desde el 1 de octubre de 2026 (RT I, 30.06.2026,
      43) y otra desde el 1 de enero de 2027 (RT I, 11.07.2026, 157)— y la lista de once del
      § 45 es idéntica en ambas, de modo que la cifra no va a cambiar antes de las elecciones
      al Riigikogu de marzo de 2027 según ningún instrumento publicado hasta ahora.

sources:
  - id: rt-vvs-2025-10-01
    tier: 1
    type: statute
    publisher: Riigi Teataja — Riigikogu
    title: >-
      Vabariigi Valitsuse seadus (terviktekst, redaktsioon 01.10.2025–30.09.2026)
    url: https://www.riigiteataja.ee/akt/107052025009
    archive_url: https://web.archive.org/web/20260519033857/https://www.riigiteataja.ee/akt/107052025009
    lang: et
    published: 2025-05-07
    accessed: 2026-07-28
    quote: |-
      § 3. Vabariigi Valitsuse liikmed
      (1) Vabariigi Valitsuse liikmed on peaminister ja ministrid.
      (2) Ministrite pädevuse ministeeriumi juhtimisel ja ministrite vastutusvaldkonnad määrab peaminister oma korraldusega. Korraldus tehakse teatavaks Vabariigi Valitsuse istungil. Peaministri korraldus kehtib kuni selle muutmiseni või Vabariigi Valitsuse volituste lõppemiseni.
      (3) Vabariigi President võib peaministri ettepanekul nimetada ametisse ministreid, kes ei juhi ministeeriumi ja kelle ülesanded määrab kindlaks peaminister oma korraldusega, mis tehakse teatavaks Vabariigi Valitsuse istungil. Nende ministrite kulutused kaetakse Riigikantselei eelarves eraldi selleks ettenähtud vahenditest.
      (4) Vabariigi Valitsuses ei ole üle 15 liikme.
      § 45. Ministeeriumid
      Valitsemisalade korraldamiseks on moodustatud järgmised ministeeriumid:
      1) Haridus- ja Teadusministeerium;
      2) Justiits- ja Digiministeerium;
      3) Kaitseministeerium;
      4) Kliimaministeerium;
      5) Kultuuriministeerium;
      6) Majandus- ja Kommunikatsiooniministeerium;
      7) Rahandusministeerium;
      8) Regionaal- ja Põllumajandusministeerium;
      9) Siseministeerium;
      10) Sotsiaalministeerium;
      11) Välisministeerium.
      § 46. Ministeeriumi staatus ja struktuur
      (1) Ministeerium on valitsusasutus, mis täidab seadusest tulenevaid ja Vabariigi Valitsuse poolt seaduse alusel antud ülesandeid.
      § 76. Riigikantselei staatus
      Vabariigi Valitsuse juures on Riigikantselei. Riigikantselei on valitsusasutus, mis täidab seadusest tulenevaid ja Vabariigi Valitsuse poolt seaduse alusel antud ülesandeid.
      § 79. Riigisekretär
      (1) Riigikantseleid juhib riigisekretär, kelle nimetab ametisse ja vabastab ametist peaminister oma korraldusega.
      (3) Riigisekretär võtab sõnaõigusega osa valitsuse istungitest.
    note: >-
      The enumerating instrument. Note that the list of ministries is § 45, which opens
      chapter 4 (MINISTEERIUMID); § 3 is the section on the members of the government and is
      quoted here because it supplies three separate facts this file rests on — that the
      government consists of the peaminister and the ministers, that it is a korraldus of the
      Prime Minister and not the Act that assigns ministers to ministries, and that the
      government may not exceed 15 members. §§ 76 and 79 are quoted because they are the
      reason the Riigikantselei is not recorded as a department: it sits beside the
      government, not inside it, and its head is a civil servant who attends cabinet with the
      right to speak but holds no seat. Consolidated text as published by Riigi Teataja; this
      redaktsioon is in force from 1 October 2025 to 30 September 2026 and carries the
      publication mark RT I, 07.05.2025, 9. Item 2 of § 45 has read "Justiits- ja
      Digiministeerium" since 1 January 2025 (RT I, 30.12.2024, 1); the list itself was last
      restructured with effect from 1 July 2023 (RT I, 30.06.2023, 1), which replaced
      Keskkonnaministeerium with Kliimaministeerium and Maaeluministeerium with Regionaal- ja
      Põllumajandusministeerium without changing the number of items. Riigi Teataja renders
      its pages in the browser; the archived snapshot cited here is one that captured the
      rendered text, and the quoted passages were checked against both the snapshot and the
      live page on the access date. The ministry remits quoted in the entity notes below are
      §§ 58–69 of this same text.

  - id: rt-peaministri-korraldus-88
    tier: 1
    type: official_gazette
    publisher: Riigi Teataja — Peaminister
    title: >-
      Ministrite pädevus ministeeriumi juhtimisel ja ministrite vastutusvaldkonnad
      (peaministri 12.08.2024 korraldus nr 88, terviktekst)
    url: https://www.riigiteataja.ee/akt/301042025005
    archive_url: https://web.archive.org/web/20251007235236/https://www.riigiteataja.ee/akt/301042025005
    lang: et
    published: 2025-04-01
    accessed: 2026-07-28
    quote: |-
      Vabariigi Valitsuse seaduse § 3 lõike 2 alusel:
      1. Haridus- ja teadusminister juhib Haridus- ja Teadusministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala.
      2. Justiits- ja digiminister juhib Justiits- ja Digiministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala, samuti soolise võrdsuse ja võrdsete võimaluste seaduse eelnõu koostamine.
      3. Kaitseminister juhib Kaitseministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala.
      4. Energeetika- ja keskkonnaminister juhib Kliimaministeeriumi oma vastutusvaldkonnas, välja arvatud valdkondades, mis on antud taristuministri juhtida.
      5. Kultuuriminister juhib Kultuuriministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala.
      6. Majandus- ja tööstusminister juhib Majandus- ja Kommunikatsiooniministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala, välja arvatud soolise võrdsuse ja võrdsete võimaluste seaduse eelnõu koostamine.
      Majandus- ja tööstusministri vastutusvaldkonnas on lisaks väliskaubanduse valdkond ja Välisministeeriumi vastavate struktuuriüksuste tegevuse juhtimine.
      7. Rahandusminister juhib Rahandusministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala.
      8. Regionaal- ja põllumajandusminister juhib Regionaal- ja Põllumajandusministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala.
      9. Siseminister juhib Siseministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala.
      10. Sotsiaalminister juhib Sotsiaalministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala.
      11. Taristuminister juhib Kliimaministeeriumi oma vastutusvaldkonnas.
      12. [Kehtetu - RT III, 01.04.2025, 2 - jõust. 31.03.2025]
      13. Välisminister juhib Välisministeeriumi ja tema vastutusvaldkonnas on selle valitsemisala, välja arvatud valdkonnas, mis on antud majandus- ja tööstusministri juhtida.
      14. Kui ministeeriumi juhib mitu ministrit, siis mitme ministri vastutusvaldkonda langevad küsimused otsustavad need ministrid ühiselt.
    note: >-
      The Prime Minister's own order, issued under § 3 lõige 2 of the Vabariigi Valitsuse
      seadus and published in Riigi Teataja III, which is what makes the Estonian arithmetic
      checkable. It names the minister who leads each of the eleven ministries, which is why
      each entity below carries a head title, and it is the instrument that shows the
      Kliimaministeerium has two of them. The quotation reproduces the enabling clause and
      then each numbered point in the order of the document, abridged at the end of each
      point where the text continues into the minister's EU Council representation, agency
      list or board memberships; point 6's second paragraph is retained in full because it is
      the reason foreign trade is tagged on the Majandus- ja Kommunikatsiooniministeerium.
      Point 12, which until 31 March 2025 assigned the sotsiaalkaitseminister, is quoted as
      the consolidated text shows it — repealed — because its repeal is what reduced the
      cabinet from 14 members to 13. Consolidated text of 31 March 2025, publication mark
      RT III, 01.04.2025, 5; it is the version in force on the access date.

