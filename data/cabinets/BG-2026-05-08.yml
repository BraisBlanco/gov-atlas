        El único departamento de bienestar. Bulgaria no tiene ministerio de familia, infancia,
        discapacidad, mayores o igualdad; la seguridad social, la asistencia social, la
        política demográfica y la política de discapacidad son de este ministerio, y por eso
        se etiquetan cinco áreas en un nombre que solo menciona dos. Como en Defensa, el
        nombre en inglés conserva la ortografía estadounidense del propio gobierno, «Labor».

