  - id: BG-2026-ministar-predsedatel
    order: 19
    name_original: Министър-председател
    abbreviation_original: null
    name_en: Prime Minister
    name_es: Primer ministro
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Министър-председател
    head_title_en: Prime Minister
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: null
    sources: [konstitutsia-rb, dv-43-2026-izbiran-mp, gov-bg-sastav]
    note:
      en: >-
        The head of government holds a seat under article 108(1) of the Constitution without
        heading a ministry, and is the first of the three seats that separate 18 from 21. He
        is elected by the National Assembly rather than appointed by the head of state, which
        is why took_office is the date of the parliamentary vote and not of the presidential
        decree that preceded it. His services are the administration of the Council of
        Ministers, which the structure decision does not name as a ministry and which is
        therefore not recorded at all. This is the one entity whose English name is marked
        translated: the government's English cabinet-members page lists the twenty elected
        ministers but not the Prime Minister, so "Prime Minister" here is this project's
        rendering of Министър-председател rather than a name quoted from the portal.
      es: >-
        El jefe de gobierno ocupa asiento conforme al artículo 108.1 de la Constitución sin
        encabezar ningún ministerio, y es el primero de los tres asientos que separan el 18
        del 21. Lo elige la Asamblea Nacional en lugar de nombrarlo el jefe del Estado, y por
        eso took_office es la fecha de la votación parlamentaria y no del decreto presidencial
        que la precedió. Sus servicios son la administración del Consejo de Ministros, que la
        decisión de estructura no nombra como ministerio y que por tanto no se registra en
        absoluto. Es la única entidad cuyo nombre en inglés se marca como translated: la
        página inglesa de miembros del gabinete enumera a los veinte ministros elegidos pero
        no al primer ministro, así que «Prime Minister» es aquí la versión de este proyecto de
        Министър-председател y no un nombre citado del portal.

