      en: >-
        Broader than policing. The Bulgarian interior ministry also runs fire safety and
        population protection, which is why civil_protection is tagged here rather than to a
        separate emergencies department — Bulgaria has none. Migration is tagged here too:
        residence and migration enforcement is a directorate of this ministry, and there is
        no migration ministry. Asylum determination, by contrast, belongs to a state agency
        outside every ministry and so appears nowhere in this file.
      es: >-
        Más amplio que la policía. El ministerio del Interior búlgaro gestiona también la
        seguridad contra incendios y la protección de la población, y por eso
        civil_protection se etiqueta aquí y no en un departamento de emergencias aparte:
        Bulgaria no tiene ninguno. También se etiqueta «migración»: la gestión de la
        residencia y la migración es una dirección de este ministerio y no existe un
        ministerio de migración. La determinación del asilo, en cambio, corresponde a una
        agencia estatal ajena a todo ministerio y no aparece en este fichero.

