    sources: [dv-43-2026-struktura, dv-43-2026-izbiran-ms, gov-bg-cabinet-members-en]
    note:
      en: >-
        The tag that does not follow the name. Bulgaria's road network and its water-supply
        and sewerage services belong to this ministry, not to Transport or to Environment, so
        infrastructure is tagged here. It also owns spatial planning, the cadastre and housing
        renovation policy. A comparison that reads "regional development" as a cohesion-funds
        portfolio will understate this department considerably.
      es: >-
        La etiqueta que no sigue al nombre. La red de carreteras búlgara y los servicios de
        abastecimiento de agua y saneamiento pertenecen a este ministerio, no a Transporte ni
        a Medio Ambiente, así que «infraestructuras» se etiqueta aquí. También le corresponden
        la ordenación del territorio, el catastro y la política de rehabilitación de
        viviendas. Una comparación que lea «desarrollo regional» como una cartera de fondos de
        cohesión subestimará bastante este departamento.

