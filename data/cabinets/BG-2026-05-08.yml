        El departamento que hace que la cifra búlgara sea 18 y no 19. El punto 3 de la
        decisión de estructura fusionó el Ministerio de la Gobernanza Electrónica dentro del
        Ministerio de Innovación y Crecimiento y rebautizó el resultado, de modo que dos
        departamentos se convirtieron en uno. En la fecha de consulta el sitio web del órgano
        fusionado seguía luciendo la marca «Ministry of Innovation and Growth»; el nombre en
        inglés que se usa aquí es el actual del portal del gobierno.

  - id: BG-2026-regionalno-razvitie-i-blagoustroystvo
