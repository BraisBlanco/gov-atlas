    sources: [konstitutsia-rb, dv-43-2026-izbiran-ms, gov-bg-cabinet-members-en, gov-bg-sastav]
    note:
      en: >-
        The first of two deputy premierships carrying no department. The structure decision
        provides for four deputy prime ministers and the election decision shows two of them
        against a ministry and two against nothing else; the two bare posts are recorded here
        as separate entities because they are held by two different people and therefore
        contribute two seats. Neither decision assigns them a remit, so none is stated here.
      es: >-
        La primera de las dos vicepresidencias sin departamento. La decisión de estructura
        prevé cuatro viceprimeros ministros y la decisión de elección muestra a dos de ellos
        frente a un ministerio y a dos frente a nada más; los dos cargos desnudos se registran
        aquí como entidades separadas porque los ocupan dos personas distintas y aportan por
        tanto dos asientos. Ninguna de las dos decisiones les asigna un ámbito, así que aquí
        no se enuncia ninguno.

