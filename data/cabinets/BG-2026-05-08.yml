        The single welfare department. Bulgaria has no ministry for families, children,
        disability, the elderly or equality; social insurance, social assistance, demographic
        policy and disability policy are all this ministry's, which is why five areas are
        tagged to one name that mentions only two. As with Defense, the English name keeps the
        government's own American spelling, "Labor".
