        form of discrimination, and Article 26(2) places the Comissão para a Cidadania
        e a Igualdade de Género under this minister. Portugal therefore has no separate
        equality ministry, which a comparison by ministry name would miss.
      es: >-
        Se etiqueta igualdad porque el artículo 26(1) sitúa aquí la ciudadanía y la
        igualdad, incluida la prevención de la violencia contra las mujeres, la
        violencia doméstica y toda forma de discriminación, y el artículo 26(2) coloca
        la Comissão para a Cidadania e a Igualdade de Género bajo esta ministra.
        Portugal no tiene, por tanto, un ministerio de igualdad separado, algo que una
        comparación por nombres no vería.

