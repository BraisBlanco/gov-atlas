    note:
      en: >-
        The least contestable of the four exclusions. Article 17 is one sentence long —
        the minister "acompanha a atividade parlamentar e assegura as relações do
        Governo com a Assembleia da República e com os grupos parlamentares" — with no
        services, no agencies and no department; Article 13(3)(c) places him in the
        Presidência do Conselho de Ministros. He holds a Council of Ministers seat.
      es: >-
        La menos discutible de las cuatro exclusiones. El artículo 17 tiene una sola
        frase —el ministro «acompanha a atividade parlamentar e assegura as relações do
        Governo com a Assembleia da República e com os grupos parlamentares»— sin
        servicios, sin organismos y sin departamento; el artículo 13(3)(c) lo sitúa en
        la Presidência do Conselho de Ministros. Ocupa asiento en el Consejo de
        Ministros.

