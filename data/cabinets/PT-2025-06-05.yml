    sources: [dre-dl-87-a-2025, dre-dpr-47-c-2025, portugal-gov-gc25-posse]
    note:
      en: >-
        No "Ministério da Presidência" exists. Article 13(3)(a) integrates this
        minister in the Presidência do Conselho de Ministros, and Article 14 defines
        his competences — preparing and coordinating the Council of Ministers,
        inter-ministerial coordination, migration, media, the Sustainable Development
        Goals, and superintendence of the national statistical institute — without
        constituting a department. Recorded because he sits in the Council of
        Ministers. The Government's portal counts this area as one of "16 Ministérios".
      es: >-
        No existe ningún «Ministério da Presidência». El artículo 13(3)(a) integra a
        este ministro en la Presidência do Conselho de Ministros, y el artículo 14
        define sus competencias —preparar y coordinar el Consejo de Ministros,
        coordinación interministerial, migraciones, comunicación social, Objetivos de
        Desarrollo Sostenible y la tutela del instituto nacional de estadística— sin
        constituir departamento. Se registra porque forma parte del Consejo de
        Ministros. El portal del Gobierno cuenta esta área como uno de los «16
        Ministérios».

