  # --- recorded, not counted ---------------------------------------------------
  - id: PT-2025-presidencia-conselho-ministros
    order: 17
    name_original: Presidência do Conselho de Ministros
    abbreviation_original: null
    name_en: Presidency of the Council of Ministers
    name_es: Presidencia del Consejo de Ministros
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Primeiro-Ministro
    head_title_en: Prime Minister
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://portugal.gov.pt/gc25/primeiro-ministro
    sources: [dre-dl-87-a-2025, dre-dpr-47-b-2025, portugal-gov-gc25-posse]
    note:
      en: >-
        The department of the head of government, and the entity that carries his
        cabinet seat. Article 13(1) calls it "o departamento central do Governo" whose
        mission is to support the Council of Ministers, the Prime Minister and the
        members of the Government within it; Article 6(3) leaves the Prime Minister the
        powers over everything in it not assigned to those members. Not counted as a
        ministry: Section III never applies the constituting formula to it, and this
        project excludes the office of the head of government by default. It is also
        the reason four ministers above are recorded but not counted — Article 13(3)
        puts them here.
      es: >-
        El departamento del jefe de gobierno y la entidad que lleva su asiento en el
        gabinete. El artículo 13(1) la llama «o departamento central do Governo», cuya
        misión es apoyar al Consejo de Ministros, al primer ministro y a los miembros
        del Gobierno integrados en ella; el artículo 6(3) reserva al primer ministro
        los poderes sobre todo lo que contiene y no esté atribuido a esos miembros. No
        se cuenta como ministerio: la sección III nunca le aplica la fórmula
        constitutiva y este proyecto excluye por defecto la oficina del jefe de
        gobierno. Es también la razón por la que cuatro ministros anteriores se
        registran sin contarse: el artículo 13(3) los sitúa aquí.

  - id: PT-2025-secretario-estado-pcm
    order: 18
    name_original: Secretário de Estado da Presidência do Conselho de Ministros
    abbreviation_original: null
    name_en: Secretary of State to the Presidency of the Council of Ministers
    name_es: Secretario de Estado de la Presidencia del Consejo de Ministros
    name_en_provenance: translated
    name_es_provenance: translated
