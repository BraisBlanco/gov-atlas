    head_title_en: Secretary of State
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: null
    sources: [dre-dl-87-a-2025]
    note:
      en: >-
        The only one of the government's 43 secretaries of State recorded here, because he is
        the only one the decree admits to the Council of Ministers: Article 4(2) has him attend
        "sem direito a voto" unless the Prime Minister rules otherwise, and Article 5 has him
        chair the Reunião de Secretários de Estado in the absence of the Minister of the
        Presidency. Attendance without a vote is not a cabinet seat, so he is recorded without a
        seat and the cabinet remains 17 people; treating him as a member would make it 18. Not
        counted as a ministry: Article 10 gives secretaries of State no competence of their own
        beyond their private offices.
      es: >-
        El único de los 43 secretarios de Estado del Gobierno que se registra aquí, porque es el
        único al que el decreto admite en el Consejo de Ministros: el artículo 4(2) lo hace
        asistir «sem direito a voto» salvo decisión contraria del primer ministro, y el artículo
        5 le atribuye presidir la Reunião de Secretários de Estado en ausencia del ministro de
        la Presidencia. Asistir sin voto no es ocupar asiento, por lo que se registra sin
        asiento y el gabinete sigue siendo de 17 personas; considerarlo miembro lo elevaría a
        18. No se cuenta como ministerio: el artículo 10 no atribuye a los secretarios de Estado
        competencia propia más allá de sus gabinetes.
