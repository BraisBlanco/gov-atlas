    sources: [dre-dl-87-a-2025, dre-dpr-47-c-2025, portugal-gov-gc25-posse]
    note:
      en: >-
        The clearest case of the gap between the two sources. The Government's news
        release calls this "o recém-criado Ministério da Reforma do Estado", but no
        such ministry is constituted: Article 13(3)(b) places the minister in the
        Presidência do Conselho de Ministros and Article 16 gives him cross-cutting
        powers of intervention over services belonging to other ministries — public
        administration reform, simplification and digitalisation — expressly listing
        directorates-general that remain in Finance, Economy, Justice, Health,
        Education, Environment and Agriculture. A transversal mandate over other
        departments is not a department.
      es: >-
        El caso más claro de la discrepancia entre las dos fuentes. La nota de prensa
        del Gobierno lo llama «o recém-criado Ministério da Reforma do Estado», pero no
        se constituye tal ministerio: el artículo 13(3)(b) sitúa al ministro en la
        Presidência do Conselho de Ministros y el artículo 16 le da poderes
        transversales de intervención sobre servicios de otros ministerios —reforma de
        la Administración Pública, simplificación y digitalización— enumerando
        expresamente direcciones generales que siguen en Finanzas, Economía, Justicia,
        Sanidad, Educación, Medio Ambiente y Agricultura. Un mandato transversal sobre
        otros departamentos no es un departamento.

