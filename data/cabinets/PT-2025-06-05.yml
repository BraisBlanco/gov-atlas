    exclusion_reason: minister_without_portfolio
    url: https://portugal.gov.pt/pt/gc25/area-de-governo/infraestruturas-e-habitacao
    sources: [dre-dl-87-a-2025, dre-dpr-47-c-2025, portugal-gov-gc25-posse]
    note:
      en: >-
        The hardest call in this page, and the one most likely to be decided
        differently. This minister has an unmistakable portfolio — mobility, land, air
        and maritime transport, communications, ports, housing, urban regeneration,
        construction and public procurement — and directs services and State-owned
        companies of his own under Article 19. What he does not have is a ministério:
        Article 19 is headed "Ministro das Infraestruturas e Habitação", not
        "Infraestruturas e Habitação" like the twelve ministry articles, it never uses
        the constituting formula, Article 13(3)(d) integrates him in the Presidência do
        Conselho de Ministros, and Article 13(7) has that department provide the
        support services for the bodies under him. Excluded because the definition this
        project applies asks for a department; if you read the portfolio rather than
        the instrument, count 13.
      es: >-
        La decisión más difícil de esta ficha y la que más fácilmente admite otra lectura. Este
        ministro tiene una cartera inequívoca —movilidad, transportes terrestres, aéreos y
        marítimos, comunicaciones, puertos, vivienda, rehabilitación urbana, construcción y
        contratación pública— y dirige servicios y empresas públicas propios según el artículo
        19. Lo que no tiene es un ministério: el artículo 19 se titula «Ministro das
        Infraestruturas e Habitação», no «Infraestruturas e Habitação» como los doce artículos
        de ministerio, nunca emplea la fórmula constitutiva, el artículo 13(3)(d) lo integra en
        la Presidência do Conselho de Ministros y el artículo 13(7) atribuye a ese departamento
        los servicios de apoyo de los organismos que de él dependen. Se excluye porque la
        definición que aplica este proyecto exige un departamento; quien lea la cartera en lugar
        del instrumento contará 13.

