    note:
      en: >-
        The widest portfolio in this government: Article 15(1) merges economic policy
        (competitiveness, industry, trade, services, tourism, consumer protection) with
        territorial cohesion (local government, spatial planning, regional development,
        European territorial cooperation), and Article 15(2) adds management of EU
        cohesion funds and of the Recovery and Resilience Plan, which is what the
        "reconstruction" tag records.
      es: >-
        La cartera más amplia de este gobierno: el artículo 15(1) une la política
        económica (competitividad, industria, comercio, servicios, turismo, defensa del
        consumidor) con la cohesión territorial (administración local, ordenación del
        territorio, desarrollo regional, cooperación territorial europea), y el
        artículo 15(2) añade la gestión de los fondos de cohesión de la UE y del Plan
        de Recuperación y Resiliencia, que es lo que registra la etiqueta
        «reconstruction».

