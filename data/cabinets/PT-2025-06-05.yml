# Portugal — government structure of the XXV Governo Constitucional.
#
# Read docs/DATA-CONTRACT.md alongside this file.
#
# The one thing to understand before reading the entity list: Portugal's tier-1
# instrument enumerates *ministers* (Article 2, sixteen of them) and, separately,
# *ministries* (Section III, twelve of them). Four ministers hold no ministry: Article
# 13(3) integrates them in the Presidência do Conselho de Ministros. The Government's
# own portal says "16 Ministérios"; the decree that constitutes them names twelve. Both
# figures are recorded below — twelve counted, the rest recorded with a reason — and the
# gap is explained in methodology_notes rather than resolved silently.

country: PT
cabinet_id: PT-2025-06-05

cabinet_name_original: XXV Governo Constitucional
cabinet_name_en: XXV Constitutional Government
cabinet_name_es: XXV Gobierno Constitucional

head_of_government_title_original: Primeiro-Ministro
head_of_government_title_en: Prime Minister

took_office: 2025-06-05
left_office: null

methodology_notes:
  - en: >-
      Portugal is counted as having 12 ministries, not the 16 its own government portal
      publishes. Decreto-Lei n.º 87-A/2025 does two different things in two different
      places: Article 2 lists the sixteen ministers who make up the Government, and
      Section III ("Orgânica do Governo") constitutes the ministries, each with the
      formula "O Ministério X é o departamento governamental que tem por missão...".
      That formula appears exactly twelve times. The remaining four ministers —
      Presidência, Adjunto e Reforma do Estado, Assuntos Parlamentares, and
      Infraestruturas e Habitação — are placed by Article 13(3) inside the Presidência
      do Conselho de Ministros, and no article of the decree creates a ministry for any
      of them. The Government's news release of 5 June 2025 nonetheless states "O novo
      Executivo é composto por 16 Ministérios" and calls State Reform a "recém-criado
      Ministério". Following this project's rule of preferring the higher-tier source,
      the legal instrument prevails over the portal and the published figure is 12.
      Read 16 if you count ministers with a portfolio; read 12 if you count ministerial
      departments; read 13 if you also count the Presidência do Conselho de Ministros
      as a department in its own right.
    es: >-
      Portugal se cuenta con 12 ministerios, no con los 16 que publica su propio portal
      gubernamental. El Decreto-Lei n.º 87-A/2025 hace dos cosas distintas en dos
      lugares distintos: el artículo 2 enumera los dieciséis ministros que componen el
      Gobierno, y la sección III («Orgánica do Governo») constituye los ministerios,
      cada uno con la fórmula «O Ministério X é o departamento governamental que tem
      por missão...». Esa fórmula aparece exactamente doce veces. Los otros cuatro
      ministros —Presidencia, Adjunto y Reforma del Estado, Asuntos Parlamentarios e
      Infraestructuras y Vivienda— quedan situados por el artículo 13(3) dentro de la
      Presidência do Conselho de Ministros, y ningún artículo del decreto crea un
      ministerio para ellos. Aun así, la nota de prensa del Gobierno del 5 de junio de
      2025 afirma «O novo Executivo é composto por 16 Ministérios» y llama a la Reforma
      del Estado «recém-criado Ministério». Aplicando la regla del proyecto de seguir la
      fuente de nivel superior, prevalece el instrumento jurídico y la cifra publicada
      es 12. Lea 16 si cuenta ministros con cartera; 12 si cuenta departamentos
      ministeriales; 13 si además cuenta la Presidência do Conselho de Ministros como
      departamento propio.
  - en: >-
      Portugal has 12 ministries but 17 cabinet seats. Article 4(1) of Decreto-Lei n.º
      87-A/2025 makes the Conselho de Ministros the Prime Minister plus all sixteen
      ministers. The Prime Minister holds a seat without heading a ministry, and four
      ministers hold a seat without heading one either, which is where the five-seat
      gap comes from. Neither number is wrong; they answer different questions, and
      this site never adds them.
    es: >-
      Portugal tiene 12 ministerios pero 17 asientos en el gabinete. El artículo 4(1)
      del Decreto-Lei n.º 87-A/2025 compone el Conselho de Ministros con el
      primer ministro y los dieciséis ministros. El primer ministro ocupa asiento sin
      encabezar ministerio, y cuatro ministros también ocupan asiento sin encabezarlo:
      de ahí la diferencia de cinco. Ninguna cifra es incorrecta; responden a preguntas
      distintas, y este sitio nunca las suma.
  - en: >-
      The four ministers who head no ministry are recorded as ministers without
      portfolio, and the label is imprecise. Three of them hold
      substantial policy responsibilities — migration, media and government
      coordination (Presidência); public-administration reform and digitalisation
      (Adjunto e Reforma do Estado); infrastructure, transport, housing and urban
      regeneration (Infraestruturas e Habitação) — and only Assuntos Parlamentares is a
      genuinely portfolio-free liaison office (Article 17 is a single sentence). The
      label was chosen because this project defines it by exactly the test applied
      here — "holds ministerial rank and a cabinet seat but no administrative
      department" — and because it has the correct counting behaviour.
    es: >-
      Los cuatro ministros que no encabezan ministerio se registran como ministros sin
      cartera, y la etiqueta es imprecisa. Tres de ellos tienen
      responsabilidades sustantivas —migraciones, comunicación social y coordinación
      gubernamental (Presidencia); reforma de la Administración Pública y
      digitalización (Adjunto y Reforma del Estado); infraestructuras, transportes,
      vivienda y rehabilitación urbana (Infraestructuras y Vivienda)— y solo Asuntos
      Parlamentarios es una verdadera oficina de enlace sin cartera (el artículo 17 es
      una sola frase). Se eligió esa etiqueta porque este proyecto la define
      exactamente con la prueba aplicada aquí
      —«tiene rango ministerial y asiento en el gabinete pero ningún departamento
      administrativo»— y porque su efecto sobre los recuentos es el correcto.
  - en: >-
      The Presidência do Conselho de Ministros is recorded but not counted. Article
      13(1) calls it "o departamento central do Governo", not a ministério; its mission
      is to support the Council of Ministers, the Prime Minister and the members of the
      Government inside it, and Article 13(5) sweeps into it every service "não
      expressamente integrados em outros ministérios". Under this project's default the
      office of the head of government is excluded as the apex of the cabinet rather
      than a portfolio department. Counting it would give 13 rather than 12.
    es: >-
      La Presidência do Conselho de Ministros se registra pero no se cuenta. El
      artículo 13(1) la llama «o departamento central do Governo», no un ministério; su
      misión es apoyar al Consejo de Ministros, al primer ministro y a los miembros del
      Gobierno integrados en ella, y el artículo 13(5) le atribuye todo servicio «não
      expressamente integrados em outros ministérios». Por defecto, este proyecto
      excluye la oficina del jefe de gobierno por ser la cúspide del gabinete y no un
      departamento con cartera. Contarla daría 13 en lugar de 12.
  - en: >-
      Secretários de Estado are not recorded individually. Article 3 of the decree
      attaches 43 of them to the sixteen ministers; Article 10 gives them no competence
      of their own, and Article 4 keeps them out of the Council of Ministers. They are
      junior ministers inside an existing department and would add neither a ministry
      nor a seat. The one exception is recorded: the Secretário de Estado da
      Presidência do Conselho de Ministros, who under Article 4(2) attends the Council
      of Ministers but without a vote, and is therefore listed with no cabinet seat.
      Counting him would make the cabinet 18.
    es: >-
      Los secretarios de Estado no se registran individualmente. El artículo 3 del
      decreto adscribe 43 de ellos a los dieciséis ministros; el artículo 10 no les
      atribuye competencia propia y el artículo 4 los deja fuera del Consejo de
      Ministros. Son ministros junior dentro de un departamento existente y no
      añadirían ni ministerio ni asiento. Se registra la única excepción: el Secretário
      de Estado da Presidência do Conselho de Ministros, que según el artículo 4(2)
      asiste al Consejo de Ministros pero sin derecho de voto, y por eso figura sin
      asiento en el gabinete. Contarlo haría del gabinete 18 personas.
  - en: >-
      Portugal is recorded as a semi-presidential republic. The President is elected by
      direct universal suffrage and holds real powers — appointing the Prime Minister,
      dissolving the Assembleia da República, vetoing legislation, referring laws to
      the Constitutional Court — and the ministers recorded here were appointed by
      presidential decree (Decreto do Presidente da República n.º 47-C/2025). The
      classification could defensibly be "parliamentary republic" instead, because
      since the 1982 constitutional revision the President cannot dismiss the
      Government at will and the executive is answerable to parliament alone;
      comparative datasets split on this. The published value follows this project's
      cross-country convention.
    es: >-
      Portugal se registra como república semipresidencial. El presidente se elige por
      sufragio universal directo y tiene poderes reales —nombrar al primer ministro,
      disolver la Assembleia da República, vetar leyes, someterlas al Tribunal
      Constitucional— y los ministros aquí registrados fueron nombrados por decreto
      presidencial (Decreto do Presidente da República n.º 47-C/2025). La
      clasificación podría ser, con razones, «república parlamentaria», porque desde
      la revisión constitucional de 1982 el presidente no puede destituir al Gobierno
      a voluntad y el ejecutivo responde solo ante el parlamento; los conjuntos de
      datos comparativos discrepan. El valor publicado sigue la convención entre
      países de este proyecto.
  - en: >-
      All English and Spanish names on this page are the project's own. The Government's
      English-language portal does publish short area labels under a heading
      "Ministries" — "Foreign Affairs", "Home Affairs", "Agriculture and Maritime
      Affairs" — and those wordings are followed here, but the full "Ministry of X"
      form is ours, so every name is marked as a translation.
    es: >-
      Todos los nombres en inglés y español de esta ficha son propios del proyecto. El
      portal en inglés del Gobierno publica etiquetas breves de área bajo el
      encabezado «Ministries» —«Foreign Affairs», «Home Affairs», «Agriculture and
      Maritime Affairs»— y aquí se sigue esa terminología, pero la forma completa
      «Ministry of X» es nuestra, de modo que todos los nombres se señalan como
      traducciones.
  - en: >-
      This page records departments, not officeholders. The nomination decree is cited
      for the set of ministerial offices actually filled on 5 June 2025, not for who
      occupies them today: the Minister of Home Affairs named in it resigned in
      February 2026 and was replaced, which changed no department. No abbreviation is
      recorded for any ministry, because Decreto-Lei n.º 87-A/2025 does not establish
      acronyms and this project does not publish unsourced data.
    es: >-
      Esta ficha registra departamentos, no titulares. El decreto de nombramiento se
      cita por el conjunto de cargos ministeriales efectivamente cubiertos el 5 de
      junio de 2025, no por quién los ocupa hoy: la ministra de Administração Interna
      que figura en él dimitió en febrero de 2026 y fue sustituida, sin que cambiara
      ningún departamento. No se registra ninguna sigla, porque el Decreto-Lei n.º
      87-A/2025 no establece acrónimos y este proyecto no publica datos sin fuente.

sources:
  - id: dre-dl-87-a-2025
    tier: 1
    type: official_gazette
    publisher: Diário da República
    title: >-
      Decreto-Lei n.º 87-A/2025, de 25 de julho — Aprova o regime de organização e
      funcionamento do XXV Governo Constitucional
    url: https://files.diariodarepublica.pt/1s/2025/07/14201/0000200027.pdf
    archive_url: https://web.archive.org/web/20260106173829/https://files.diariodarepublica.pt/1s/2025/07/14201/0000200027.pdf
    lang: pt
    published: 2025-07-25
    accessed: 2026-07-27
    quote: |-
      Artigo 1.º
      Composição
      1 — O Governo é constituído pelo Primeiro-Ministro, pelos ministros e pelos secretários de Estado.
      2 — São órgãos colegiais do Governo o Conselho de Ministros e a Reunião de Secretários de Estado.
      Artigo 2.º
      Ministros
      Integram o Governo os seguintes ministros:
      a) Ministro de Estado e dos Negócios Estrangeiros;
      b) Ministro de Estado e das Finanças;
      c) Ministro da Presidência;
      d) Ministro da Economia e da Coesão Territorial;
      e) Ministro Adjunto e da Reforma do Estado;
      f) Ministro dos Assuntos Parlamentares;
      g) Ministro da Defesa Nacional;
      h) Ministro das Infraestruturas e Habitação;
      i) Ministra da Justiça;
      j) Ministra da Administração Interna;
      k) Ministro da Educação, Ciência e Inovação;
      l) Ministra da Saúde;
      m) Ministra do Trabalho, Solidariedade e Segurança Social;
      n) Ministra do Ambiente e Energia;
      o) Ministra da Cultura, Juventude e Desporto;
      p) Ministro da Agricultura e Mar.
      Artigo 4.º
      Composição do Conselho de Ministros
      1 — O Conselho de Ministros é constituído pelo Primeiro-Ministro, que preside, e pelos ministros.
      2 — Salvo determinação em contrário do Primeiro-Ministro, participa nas reuniões do Conselho de Ministros, sem direito a voto, o Secretário de Estado da Presidência do Conselho de Ministros.
      SECÇÃO III
      Orgânica do Governo
      Artigo 11.º
      Negócios Estrangeiros
      1 — O Ministério dos Negócios Estrangeiros é o departamento governamental [...]
      Artigo 12.º
      Finanças
      1 — O Ministério das Finanças é o departamento governamental [...]
      Artigo 13.º
      Presidência do Conselho de Ministros
      1 — A Presidência do Conselho de Ministros é o departamento central do Governo que tem por missão prestar apoio ao Conselho de Ministros, ao Primeiro-Ministro e aos demais membros do Governo nela integrados e promover a coordenação interministerial dos diversos departamentos governamentais.
      [...]
      3 — A Presidência do Conselho de Ministros integra os seguintes membros do Governo:
      a) Ministro da Presidência;
      b) Ministro Adjunto e da Reforma do Estado;
      c) Ministro dos Assuntos Parlamentares;
      d) Ministro das Infraestruturas e Habitação;
      [...]
      5 — A Presidência do Conselho de Ministros compreende ainda todos os serviços, organismos, entidades e estruturas não expressamente integrados em outros ministérios [...]
      Artigo 15.º
      Economia e Coesão Territorial
      1 — O Ministério da Economia e da Coesão Territorial é o departamento governamental [...]
      Artigo 18.º
      Defesa Nacional
      1 — O Ministério da Defesa Nacional é o departamento governamental [...]
      Artigo 20.º
      Justiça
      1 — O Ministério da Justiça é o departamento governamental [...]
      Artigo 21.º
      Administração Interna
      1 — O Ministério da Administração Interna é o departamento governamental [...]
      Artigo 22.º
      Educação, Ciência e Inovação
      1 — O Ministério da Educação, Ciência e Inovação é o departamento governamental [...]
      Artigo 23.º
      Saúde
      1 — O Ministério da Saúde é o departamento governamental [...]
      Artigo 24.º
      Trabalho, Solidariedade e Segurança Social
      1 — O Ministério do Trabalho, Solidariedade e Segurança Social é o departamento governamental [...]
      Artigo 25.º
      Ambiente e Energia
      1 — O Ministério do Ambiente e Energia é o departamento governamental [...]
      Artigo 26.º
      Cultura, Juventude e Desporto
      1 — O Ministério da Cultura, Juventude e Desporto é o departamento governamental [...]
      Artigo 27.º
      Agricultura e Mar
      1 — O Ministério da Agricultura e Mar é o departamento governamental [...]
      Artigo 40.º
      Produção de efeitos
      O presente decreto-lei produz efeitos a 5 de junho de 2025, considerando-se ratificados todos os atos entretanto praticados.
    note: >-
      The tier-1 instrument for this cabinet: the Lei Orgânica do XXV Governo. Cited
      from the Diário da República's own PDF of Suplemento 1 to DR n.º 142, 1.ª série,
      25 July 2025 — the original publication. DRE's consolidated-text page
      (https://diariodarepublica.pt/dr/legislacao-consolidada/decreto-lei/2025-926588602)
      is a client-rendered application that web archives capture only as an empty
      shell, so it is not usable as an archive_url; the consolidated version as of the
      access date reflects two changes, neither touching the list of ministries or
      ministers. Declaração de Retificação n.º 38/2025/1, of 22 September 2025,
      corrects one body's name in Article 26(11)(b) ("Conselho Nacional da Juventude"
      to "Conselho Consultivo da Juventude"). Decreto-Lei n.º 139/2026, of 10 July
      2026, amends only Article 33, on the administration of State real estate.
      The quote is an extract, not the whole decree: it reproduces Articles 1, 2 and 4,
      the heading of Section III, Articles 11, 12, 13, 15, 18, 20 to 27 and Article 40
      of a 41-article instrument, in the order the gazette prints them, and every
      elision is marked. Quotation convention: each line is verbatim as printed, with
      section, article and article-subject headings on their own lines; a trailing
      "[...]" marks truncation of the remainder of that sentence or paragraph; a
      standalone "[...]" line marks paragraphs omitted inside a quoted article;
      articles not reproduced are simply absent. Nothing inside a quoted line is
      altered. The twelve Section III articles quoted here are every occurrence in the
      decree of the formula constituting a ministério; Articles 14, 16, 17 and 19
      define the competences of the other four ministers without creating a department
      for them.

  - id: dre-dpr-47-c-2025
    tier: 1
    type: official_gazette
    publisher: Diário da República
    title: >-
      Decreto do Presidente da República n.º 47-C/2025, de 5 de junho — nomeação dos
      ministros do XXV Governo Constitucional
    url: https://files.diariodarepublica.pt/1s/2025/06/10801/0000400005.pdf
    archive_url: https://web.archive.org/web/20251206032801/https://files.diariodarepublica.pt/1s/2025/06/10801/0000400005.pdf
    lang: pt
    published: 2025-06-05
    accessed: 2026-07-27
    quote: |-
      O Presidente da República decreta, nos termos do artigo 133.º, alínea h), da Constituição, o seguinte:
      São nomeados, sob proposta do Primeiro-Ministro:
      Paulo Artur dos Santos de Castro de Campos Rangel, Ministro de Estado e dos Negócios Estrangeiros;
      Joaquim José Miranda Sarmento, Ministro de Estado e das Finanças;
      António Egrejas Leitão Amaro, Ministro da Presidência;
      Manuel Castro Almeida, Ministro da Economia e da Coesão Territorial;
      Gonçalo Nuno da Cruz Saraiva Matias, Ministro Adjunto e da Reforma do Estado;
      Carlos Eduardo Almeida de Abreu Amorim, Ministro dos Assuntos Parlamentares;
      João Nuno Lacerda Teixeira de Melo, Ministro da Defesa Nacional;
      Miguel Martinez de Castro Pinto Luz, Ministro das Infraestruturas e Habitação;
      Rita Fragoso de Rhodes Alarcão Júdice de Abreu e Mota, Ministra da Justiça;
      Maria Lúcia da Conceição Abrantes Amaral, Ministra da Administração Interna;
      Fernando Manuel de Almeida Alexandre, Ministro da Educação, Ciência e Inovação;
      Ana Paula Mecheiro de Almeida Martins Silvestre Correia, Ministra da Saúde;
      Maria do Rosário Valente Rebelo Pinto Palma Ramalho, Ministra do Trabalho, Solidariedade e Segurança Social;
      Maria da Graça Martins da Silva Carvalho, Ministra do Ambiente e Energia;
      Ana Margarida Balseiro de Sousa Lopes, Ministra da Cultura, Juventude e Desporto;
      José Manuel Ferreira Fernandes, Ministro da Agricultura e Mar.
      Assinado em 5 de junho de 2025.
    note: >-
      The appointment decree, published in Suplemento 1 to DR n.º 108, 1.ª série. It
      fixes took_office at 5 June 2025 and shows that all sixteen ministerial offices
      of Article 2 were actually filled — including the four that head no ministry,
      which is why they are recorded here rather than omitted. Cited for the offices,
      not the officeholders: this dataset does not record who currently holds them, and
      at least one has changed since.

  - id: dre-dpr-47-b-2025
    tier: 1
    type: official_gazette
    publisher: Diário da República
    title: >-
      Decreto do Presidente da República n.º 47-B/2025, de 5 de junho — nomeação do
      Primeiro-Ministro do XXV Governo Constitucional
    url: https://files.diariodarepublica.pt/1s/2025/06/10801/0000300003.pdf
    archive_url: https://web.archive.org/web/20251206024556/https://files.diariodarepublica.pt/1s/2025/06/10801/0000300003.pdf
    lang: pt
    published: 2025-06-05
    accessed: 2026-07-27
    quote: |-
      O Presidente da República decreta, nos termos do artigo 133.º, alínea f), da Constituição, o seguinte:
      É nomeado Primeiro-Ministro do XXV Governo Constitucional Luís Filipe Montenegro Cardoso de Morais Esteves.
      Assinado em 5 de junho de 2025.
    note: >-
      Establishes that the cabinet recorded in this file is the XXV Governo
      Constitucional and that its head of government took office on 5 June 2025. Cited
      on the Presidência do Conselho de Ministros entity, which is what carries the
      Prime Minister's cabinet seat.

  - id: portugal-gov-gc25-posse
    tier: 2
    type: government_website
    publisher: Governo da República Portuguesa — XXV Governo Constitucional
    title: XXV Governo Constitucional tomou posse
    url: "https://www.portugal.gov.pt/pt/gc25/comunicacao/noticia?i=xxv-governo-constitucional-tomou-posse"
    archive_url: "https://web.archive.org/web/20250618154233/https://www.portugal.gov.pt/pt/gc25/comunicacao/noticia?i=xxv-governo-constitucional-tomou-posse"
    lang: pt
    published: 2025-06-05
    accessed: 2026-07-27
    quote: >-
      O Primeiro-Ministro Luís Montenegro e os 16 Ministros que compõem o XXV Governo
      Constitucional tomaram posse numa cerimónia presidida pelo Presidente da
      República, Marcelo Rebelo de Sousa, no Palácio Nacional da Ajuda, em Lisboa. O
      novo Executivo é composto por 16 Ministérios, menos um do que o Governo anterior,
      refletindo uma reorganização estrutural que visa reforçar a eficácia da ação
      governativa e responder de forma mais direta aos desafios atuais.
    note: >-
      The Government's own account of the swearing-in, and the source that disagrees
      with the decree: it counts sixteen ministries where Decreto-Lei n.º 87-A/2025
      constitutes twelve. Recorded deliberately, cited on every entity whose
      classification the disagreement affects, and explained in methodology_notes; the
      tier-1 instrument is followed. The snapshot is from 18 June 2025 because it is
      the earliest capture of this page that is not a 403, and the page is a dated news
      item that has not changed since.

entities:
  - id: PT-2025-negocios-estrangeiros
    order: 1
    name_original: Ministério dos Negócios Estrangeiros
    abbreviation_original: null
    name_en: Ministry of Foreign Affairs
    name_es: Ministerio de Asuntos Exteriores
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministro/a de Estado e dos Negócios Estrangeiros
    head_title_en: Minister of State and Foreign Affairs
    has_cabinet_seat: true
    policy_areas: [foreign_affairs, european_affairs, development_cooperation, diaspora]
    counts_as_ministry: true
    url: https://portugal.gov.pt/pt/gc25/area-de-governo/negocios-estrangeiros
    sources: [dre-dl-87-a-2025, dre-dpr-47-c-2025]
    note:
      en: >-
        Its minister also carries the precedence title "Ministro de Estado". Under
        Article 7 that title only fixes who stands in for the Prime Minister; it adds
        neither a department nor a seat.
      es: >-
        Su titular ostenta además el título de precedencia «Ministro de Estado». Según
        el artículo 7, ese título solo determina quién sustituye al primer ministro; no
        añade departamento ni asiento.

  - id: PT-2025-financas
    order: 2
    name_original: Ministério das Finanças
    abbreviation_original: null
    name_en: Ministry of Finance
    name_es: Ministerio de Finanzas
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministro/a de Estado e das Finanças
    head_title_en: Minister of State and Finance
    has_cabinet_seat: true
    policy_areas: [finance, budget, public_administration, state_assets]
    counts_as_ministry: true
    url: https://portugal.gov.pt/pt/gc25/area-de-governo/financas
    sources: [dre-dl-87-a-2025, dre-dpr-47-c-2025]
    note:
      en: >-
        Article 12(1) gives it "políticas para a Administração Pública e o emprego
        público" alongside State finances, which is why public administration is tagged
        here as well as being a responsibility of two ministers inside the Presidência
        do Conselho de Ministros. Article 12(7) leaves it the residual shareholder
        function over State-owned enterprises, hence state_assets.
      es: >-
        El artículo 12(1) le atribuye «políticas para a Administração Pública e o
        emprego público» junto con las finanzas del Estado, y de ahí la etiqueta de
        administración pública, que además comparten dos ministros integrados en la
        Presidência do Conselho de Ministros. El artículo 12(7) le deja la función
        accionarial residual sobre el sector empresarial del Estado, de ahí
        state_assets.

  - id: PT-2025-ministro-presidencia
    order: 3
    name_original: Ministro da Presidência
    abbreviation_original: null
    name_en: Minister of the Presidency
    name_es: Ministro de la Presidencia
    name_en_provenance: translated
    name_es_provenance: translated
