    tier: 2
    type: government_website
    publisher: Gobierno de España — La Moncloa
    title: >-
      XV Legislatura: biografías de las ministras y ministros del Gobierno de España
    url: https://www.lamoncloa.gob.es/gobierno/paginas/biografias-xv-legislatura/nuevos-ministros-y-ministras-gobierno-espana-2023.aspx
    archive_url: https://web.archive.org/web/20250423005432/https://www.lamoncloa.gob.es/gobierno/paginas/biografias-xv-legislatura/nuevos-ministros-y-ministras-gobierno-espana-2023.aspx
    lang: es
    published: 2026-03-27
    accessed: 2026-07-27
    quote: >-
      Vicepresidente primero y ministro de Economía, Comercio y Empresa
    note: >-
      Corroborates that each vice-presidency is held by a serving minister of a listed
      department, so no vice-presidency adds a department or a seat. The newest archived
      snapshot is from 23 April 2025 and therefore predates the March 2026 reshuffle; it
      supports the structural claim, not the current list of officeholders, which this
      dataset does not record.

