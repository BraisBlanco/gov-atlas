    accessed: 2026-07-29
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado se estructura en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores, Unión Europea y Cooperación.
      Ministerio de la Presidencia, Justicia y Relaciones con las Cortes.
      Ministerio de Defensa.
      Ministerio de Hacienda y Función Pública.
      Ministerio del Interior.
      Ministerio de Transportes y Movilidad Sostenible.
      Ministerio de Educación, Formación Profesional y Deportes.
      Ministerio de Trabajo y Economía Social.
      Ministerio de Industria y Turismo.
      Ministerio de Agricultura, Pesca y Alimentación.
      Ministerio de Política Territorial y Memoria Democrática.
      Ministerio para la Transición Ecológica y el Reto Demográfico.
      Ministerio de Vivienda y Agenda Urbana.
      Ministerio de Cultura.
      Ministerio de Economía, Comercio y Empresa.
      Ministerio de Sanidad.
      Ministerio de Derechos Sociales, Consumo y Agenda 2030.
      Ministerio de Ciencia, Innovación y Universidades.
      Ministerio de Igualdad.
      Ministerio de Inclusión, Seguridad Social y Migraciones.
      Ministerio de Transformación Digital.
      Ministerio de Juventud e Infancia.
    note: >-
      The text as published on 21 November 2023, cited alongside the consolidated version
      because the two differ: positions 4 and 21 read "Hacienda y Función Pública" and
      "Transformación Digital" here, and the consolidated text shows the names they carry
      after 29 December 2023. This is the source for what the departments were called during
      the government's first five weeks.

  - id: boe-rd-1230-2023
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 1230/2023, de 29 de diciembre, por el que se modifica el Real Decreto
      829/2023, de 20 de noviembre, por el que se reestructuran los departamentos
      ministeriales
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2023-26727
    archive_url: https://web.archive.org/web/20240524072619/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2023-26727
    lang: es
    published: 2023-12-29
    accessed: 2026-07-29
    quote: |-
      Disposición final primera. Supresión de órganos.
      Quedan suprimidos los siguientes órganos superiores:
      Ministerio de Hacienda y Función Pública.
      Ministerio de Transformación Digital.
      La Secretaría de Estado de Derechos Sociales y Agenda 2030.
      La Secretaría de Estado de Igualdad y contra la Violencia de Género.
    note: >-
      Rewrites article 1 and suppresses the two department names it replaces, in force the
      day it was published. The enumeration still lists 22 departments, so this changes what
      two of them are called and not how many there are.

  - id: boe-ley-50-1997
    tier: 1
    type: statute
    publisher: Boletín Oficial del Estado
    title: Ley 50/1997, de 27 de noviembre, del Gobierno (texto consolidado)
    url: https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    archive_url: https://web.archive.org/web/20260716135650/https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    lang: es
    published: 1997-11-28
    accessed: 2026-07-27
    quote: >-
      El Gobierno se compone del Presidente, del Vicepresidente o Vicepresidentes, en su
      caso, y de los Ministros.
    note: >-
      Cited for the composition of the Government, which is what makes the Prime
      Minister's seat a matter of statute rather than of our interpretation, and
      therefore why cabinet_seats_count is 23 while ministries_count is 22.

