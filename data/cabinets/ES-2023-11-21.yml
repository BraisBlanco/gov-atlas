# Spain — government structure of the XV legislature.
#
# REFERENCE FILE. This is the worked example every other country file is modelled on.
# Read docs/DATA-CONTRACT.md alongside it.
#
# Three things to notice before you copy it:
#
#   1. Nowhere does this file state "22". The count is derived from the entities below,
#      so the headline figure and the list underneath it cannot drift apart.
#   2. `Presidencia del Gobierno` is recorded even though it is not counted. Excluded
#      bodies carry a reason, which is how the site can defend 22 against sources that
#      say 23 without anyone re-doing the research.
#   3. Article 1 of the decree is quoted in full. A reader can confirm the whole list in
#      one glance instead of re-reading a 40-page instrument.

country: ES
cabinet_id: ES-2023-11-21

cabinet_name_original: Gobierno de España, XV Legislatura
cabinet_name_en: Government of Spain, 15th legislature
cabinet_name_es: Gobierno de España, XV Legislatura

head_of_government_title_original: Presidente del Gobierno
head_of_government_title_en: Prime Minister

took_office: 2023-11-21
left_office: null

methodology_notes:
  - en: >-
      Spain has 22 ministerial departments but 23 members of the Council of Ministers.
      The Prime Minister holds a seat without heading a department, which is why the two
      figures differ by one. Neither number is wrong; they answer different questions.
    es: >-
      España tiene 22 departamentos ministeriales pero 23 miembros del Consejo de
      Ministros. El presidente del Gobierno ocupa un asiento sin encabezar ningún
      departamento, y de ahí la diferencia de uno. Ninguna de las dos cifras es
      incorrecta; responden a preguntas distintas.
  - en: >-
      Three of the 22 ministers also hold vice-presidencies of the Government. A
      vice-presidency is a personal office attached to a minister, not a department, so
      it adds neither a ministry nor a cabinet seat. Which ministers hold them changes
      with reshuffles; the department structure does not, and only the latter is recorded
      here.
    es: >-
      Tres de los 22 ministros ostentan además vicepresidencias del Gobierno. Una
      vicepresidencia es un cargo personal adscrito a un ministro, no un departamento,
      por lo que no añade ni ministerio ni asiento en el gabinete. Quién las ostenta
      cambia con cada remodelación; la estructura departamental no, y aquí sólo se
      registra esta última.
  - en: >-
      Two departments changed name five weeks into the term, on 29 December 2023: finance
      gave up the civil service and became simply the Ministry of Finance, and digital
      transformation took it on. The number of departments did not move — it was 22 before
      and 22 after — so the two names are recorded with the dates each was in use rather
      than the later one being applied to the whole term.
    es: >-
      Dos departamentos cambiaron de nombre a las cinco semanas de legislatura, el 29 de
      diciembre de 2023: hacienda cedió la función pública y pasó a ser simplemente
      Ministerio de Hacienda, y transformación digital la asumió. El número de departamentos
      no se movió —22 antes y 22 después—, así que se registran los dos nombres con las
      fechas en que estuvo vigente cada uno, en lugar de aplicar el posterior a toda la
      legislatura.
  - en: >-
      Do not confuse the two entries containing the word "Presidencia". The "Ministerio
      de la Presidencia, Justicia y Relaciones con las Cortes" is a full department and
      is counted. "Presidencia del Gobierno" is the Prime Minister's own office and is
      not.
    es: >-
      No confundir las dos entradas que contienen la palabra «Presidencia». El
      «Ministerio de la Presidencia, Justicia y Relaciones con las Cortes» es un
      departamento completo y se cuenta. La «Presidencia del Gobierno» es la oficina del
      propio presidente y no se cuenta.

sources:
  - id: boe-rd-829-2023
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 829/2023, de 20 de noviembre, por el que se reestructuran los
      departamentos ministeriales (texto consolidado)
    url: https://www.boe.es/buscar/act.php?id=BOE-A-2023-23537
    archive_url: https://web.archive.org/web/20260512160805/https://boe.es/buscar/act.php?id=BOE-A-2023-23537
    lang: es
    published: 2023-11-21
    accessed: 2026-07-27
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado se estructura en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores, Unión Europea y Cooperación.
      Ministerio de la Presidencia, Justicia y Relaciones con las Cortes.
      Ministerio de Defensa.
      Ministerio de Hacienda.
      Ministerio del Interior.
      Ministerio de Transportes y Movilidad Sostenible.
      Ministerio de Educación, Formación Profesional y Deportes.
      Ministerio de Trabajo y Economía Social.
      Ministerio de Industria y Turismo.
      Ministerio de Agricultura, Pesca y Alimentación.
      Ministerio de Política Territorial y Memoria Democrática.
      Ministerio para la Transición Ecológica y el Reto Demográfico.
      Ministerio de Vivienda y Agenda Urbana.
      Ministerio de Cultura.
      Ministerio de Economía, Comercio y Empresa.
      Ministerio de Sanidad.
      Ministerio de Derechos Sociales, Consumo y Agenda 2030.
      Ministerio de Ciencia, Innovación y Universidades.
      Ministerio de Igualdad.
      Ministerio de Inclusión, Seguridad Social y Migraciones.
      Ministerio para la Transformación Digital y de la Función Pública.
      Ministerio de Juventud e Infancia.
    note: >-
      Consolidated text, last amended 29 December 2023 by Real Decreto 1230/2023. The
      listing order below follows this article, and articles 2 to 23 define each
      department in the same sequence. Later decrees in 2024-2026 altered internal
      organic structure (directorates, secretariats) without changing this list of
      departments.

