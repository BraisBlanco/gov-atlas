    sources: [gov-ie-departments, gov-ie-government-ministers]
    note:
      en: >-
        Taxation, banking and economic policy. Public spending is a separate department, so a
        comparison that expects one finance ministry per country will find two halves here.
        Its minister is also Tánaiste, the deputy head of government; that is a personal
        office attached to a minister, not a department, so it adds neither ministry nor seat.
      es: >-
        Fiscalidad, banca y política económica. El gasto público es un departamento aparte,
        de modo que una comparación que espere un solo ministerio de hacienda por país
        encontrará aquí dos mitades. Su ministro es además Tánaiste, vicejefe del gobierno;
        ese es un cargo personal adscrito a un ministro, no un departamento, y no añade ni
        ministerio ni asiento.

