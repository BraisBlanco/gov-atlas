    quote: |-
      The members of the 35th Government of Ireland are listed below.
      Taoiseach: Micheál Martin
      Tánaiste and Minister for Finance: Simon Harris
      Minister for Public Expenditure, Infrastructure, Public Service Reform and Digitalisation: Jack Chambers
      Minister for Foreign Affairs and Trade; and Minister for Defence: Helen McEntee
      Minister for Climate, Energy and the Environment; and Minister for Transport: Darragh O'Brien
