    sources: [isb-si-242-2025-justice, gov-ie-departments, gov-ie-government-ministers]
    note:
      en: >-
        Ireland has no separate interior or migration department: policing, immigration and
        asylum all sit here alongside justice, which is why this one entity carries three
        policy areas that are usually spread across two or three departments elsewhere.
      es: >-
        Irlanda no tiene departamento separado de interior ni de migración: policía,
        inmigración y asilo conviven aquí con justicia, y por eso esta sola entidad lleva tres
        áreas de política que en otros países suelen repartirse entre dos o tres departamentos.

