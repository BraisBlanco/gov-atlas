      The source for which departments share a minister, and therefore for the seat count:
      three lines name two departments each. Last updated 2 June 2026 and archived on the
      access date, so it reflects the changes of officeholder since January 2025 — Finance
      and Foreign Affairs both changed hands during the term without a new Government being
      appointed. The typographic apostrophes in the page are transcribed here as straight
      ones; nothing else in the quote is altered. The page's Ministers of State section,
      about twenty entries, is not quoted: none of them is a member of the Government.

  - id: isb-bunreacht-art28
    tier: 1
    type: statute
    publisher: Office of the Attorney General — electronic Irish Statute Book
    title: Bunreacht na hÉireann (Constitution of Ireland), Article 28
    url: https://www.irishstatutebook.ie/eli/cons/en/html
    archive_url: https://web.archive.org/web/20260721114629/https://www.irishstatutebook.ie/eli/cons/en/html
    lang: en
    published: null
    accessed: 2026-07-27
    quote: >-
      The Government shall consist of not less than seven and not more than fifteen members
      who shall be appointed by the President in accordance with the provisions of this
      Constitution.
    note: >-
      Article 28.1. This is why Ireland's ministry count exceeds its cabinet-seat count
      rather than the other way round: the number of departments is set by ordinary law and
      administrative practice, the number of ministers by the Constitution. The validator
      reports this source as uncited by any entity, and that is deliberate: it supports the
      methodology note on cabinet size, not the existence of any one department. Attaching it
      to the Department of the Taoiseach would raise that department's best source tier to 1
      and imply that a legal instrument names it, which article 28 does not.

