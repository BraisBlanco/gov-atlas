    note:
      en: >-
        Heritage here means built and natural heritage, national parks and the protection of
        monuments, which is why this department is tagged with culture as well as the culture
        department. Two departments holding one area is exactly what the policy-area matrix is
        for.
      es: >-
        Patrimonio significa aquí patrimonio construido y natural, parques nacionales y
        protección de monumentos, y por eso este departamento lleva también el área
        «cultura», igual que el departamento de Cultura. Que dos departamentos compartan un
        área es precisamente lo que la matriz de áreas de política sirve para mostrar.

