    note:
      en: >-
        Employment law and workplace regulation sit here, while social insurance and
        jobseeker payments sit in Social Protection. Ireland has no single labour ministry,
        so the labour policy area is tagged to this department and social_security to that one.
      es: >-
        El derecho laboral y la regulación del trabajo están aquí, mientras que la seguridad
        social y las prestaciones por desempleo están en Protección Social. Irlanda no tiene
        un ministerio de trabajo único, así que el área «trabajo» se etiqueta en este
        departamento y «seguridad social» en aquel.

