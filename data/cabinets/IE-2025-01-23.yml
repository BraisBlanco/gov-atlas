    note:
      en: >-
        The Gaeltacht is the set of districts where Irish is the community language, and
        supporting the language there is a departmental responsibility. That is why this
        department, and not an education or culture one, carries the language_policy area.
      es: >-
        La Gaeltacht es el conjunto de distritos donde el irlandés es la lengua de la
        comunidad, y sostenerla allí es una competencia departamental. Por eso este
        departamento, y no uno de educación o cultura, lleva el área «política lingüística».

