# Ireland — government structure of the 35th Government.
#
# Read docs/DATA-CONTRACT.md alongside this file. Four Ireland-specific things to know:
#
#   1. Departments outnumber ministers, by constitutional design. Article 28.1 caps the
#      Government at fifteen members; there are eighteen Departments of State, so three
#      ministers hold two departments each. Those pairs are recorded with shared_head_with,
#      which is what keeps ministries_count at 18 and cabinet_seats_count at 15.
#   2. There is no Irish instrument that enumerates the departments. The Ministers and
#      Secretaries Act 1924 created eleven under their 1924 names and every change since has
#      been made one department at a time, most recently by nine Alteration of Name of
#      Department and Title of Minister Orders in 2025. Those nine are cited as tier 1 for
#      the departments they renamed; the other nine departments rest on the government's own
#      list of departments, which is tier 2. Ireland is therefore graded B, not A.
#   3. The Department of the Taoiseach is counted. See the methodology note for the figure a
#      reader gets by excluding it.
#   4. Ministers of State — including the four who attend Cabinet — are not members of the
#      Government and are not recorded here. Neither is the Attorney General.

country: IE
cabinet_id: IE-2025-01-23

cabinet_name_original: 35th Government of Ireland
cabinet_name_en: 35th Government of Ireland
cabinet_name_es: 35.º Gobierno de Irlanda

head_of_government_title_original: Taoiseach
head_of_government_title_en: Prime Minister (Taoiseach)

took_office: 2025-01-23
left_office: null

methodology_notes:
  - en: >-
      Ireland has 18 departments but 15 members of the Government. The cap is constitutional:
      article 28.1 of Bunreacht na hÉireann provides that the Government "shall consist of
      not less than seven and not more than fifteen members". With eighteen Departments of
      State to fill, three ministers hold two departments each — Foreign Affairs and Trade
      with Defence, Climate, Energy and the Environment with Transport, and Social Protection
      with Rural and Community Development and the Gaeltacht. Each pair is one person, one
      seat and two ministries. 18 and 15 answer different questions and are never added.
    es: >-
      Irlanda tiene 18 departamentos pero 15 miembros del Gobierno. El tope es
      constitucional: el artículo 28.1 de la Bunreacht na hÉireann dispone que el Gobierno
      «estará compuesto por no menos de siete y no más de quince miembros». Con dieciocho
      departamentos de Estado que cubrir, tres ministros ostentan dos departamentos cada uno
      —Asuntos Exteriores y Comercio con Defensa, Clima, Energía y Medio Ambiente con
      Transporte, y Protección Social con Desarrollo Rural y Comunitario y Gaeltacht—. Cada
      pareja es una persona, un asiento y dos ministerios. 18 y 15 responden a preguntas
      distintas y nunca se suman.
  - en: >-
      The Department of the Taoiseach is counted here, giving 18. Excluding it as the office
      of the head of government, the way this project excludes Spain's Presidencia del
      Gobierno, would give 17. It is counted because Irish law does not treat it as an office
      attached to the Taoiseach but as one of the Departments of State: it is the first
      department listed in section 1 of the Ministers and Secretaries Act 1924 (as the
      Department of the President of the Executive Council, the office the 1937 Constitution
      renamed Taoiseach), it appears in the government's own list of eighteen departments
      alongside the rest, it has its own Vote in the annual estimates and its own Secretary
      General, and Ministers of State are assigned to it as they are to any department. Both
      figures are published here so a reader can choose: 18 including the Department of the
      Taoiseach, 17 excluding it.
    es: >-
      El Departamento del Taoiseach se cuenta aquí, lo que da 18. Excluirlo como oficina del
      jefe de gobierno, tal como este proyecto excluye la Presidencia del Gobierno española,
      daría 17. Se cuenta porque el derecho irlandés no lo trata como un cargo adscrito al
      Taoiseach sino como uno más de los departamentos de Estado: es el primero de la lista
      del artículo 1 de la Ministers and Secretaries Act 1924 (como Department of the
      President of the Executive Council, cargo que la Constitución de 1937 renombró
      Taoiseach), figura en la lista oficial de dieciocho departamentos junto a los demás,
      tiene su propia partida en los presupuestos y su propio secretario general, y se le
      asignan ministros de Estado como a cualquier departamento. Aquí se publican ambas
      cifras para que el lector elija: 18 contando el Departamento del Taoiseach, 17 sin él.
  - en: >-
      Ministers of State are not counted and not recorded. There are around twenty of them,
      they are appointed to work inside a department under its minister, and they are not
      members of the Government within the meaning of article 28. Four of them attend Cabinet
      meetings — the arrangement Irish politics calls "super junior" ministers, upheld by the
      Supreme Court in 2025 — but attendance is not membership: they do not vote and they are
      not appointed under article 28.1, so they add no seat here. The Attorney General also
      attends without being a member, and is likewise not recorded here. A source that
      answers "how big is the Irish government?" with a number in the thirties is counting
      Ministers of State; it is answering a different question.
    es: >-
      Los ministros de Estado no se cuentan ni se registran. Son una veintena, se nombran
      para trabajar dentro de un departamento bajo su ministro y no son miembros del Gobierno
      en el sentido del artículo 28. Cuatro de ellos asisten al Consejo de Ministros —lo que
      la política irlandesa llama ministros «super junior», figura avalada por el Tribunal
      Supremo en 2025—, pero asistir no es ser miembro: no votan ni se nombran conforme al
      artículo 28.1, de modo que no suman asiento aquí. El fiscal general (Attorney General)
      también asiste sin ser miembro y tampoco se registra aquí. Una fuente que
      responde «¿de qué tamaño es el Gobierno irlandés?» con una cifra de treinta y tantos
      está contando a los ministros de Estado: responde a otra pregunta.
  - en: >-
      Where the government's own two pages disagree, this page follows the department name.
      The list of departments and the Department of Agriculture, Food and the Marine's own
      pages both give that name, and no Alteration of Name of Department and Title of
      Minister Order has been made for it — there were nine such orders in 2025 and none in
      2026 up to the access date. The page listing the members of the Government nonetheless
      styles its minister "Minister for Agriculture, Food, Fisheries and the Marine". Until
      an order is made, the department's name is the one recorded here, and the fuller
      ministerial style is noted rather than silently adopted.
    es: >-
      Cuando las dos páginas del propio Gobierno discrepan, esta ficha sigue el nombre del
      departamento. La lista de departamentos y las páginas del propio Department of
      Agriculture, Food and the Marine dan ese nombre, y no se ha dictado ninguna Alteration
      of Name of Department and Title of Minister Order para él: hubo nueve en 2025 y ninguna
      en 2026 hasta la fecha de consulta. Aun así, la página con los miembros del Gobierno
      titula a su ministro «Minister for Agriculture, Food, Fisheries and the Marine». Hasta
      que se dicte una orden, el nombre del departamento es el aquí registrado, y el título
      ministerial más extenso se anota en lugar de adoptarse en silencio.
  - en: >-
      Both languages are official, and the original name shown here is the English one. Every
      Department of State has an equally official Irish name — the nine 2025 orders cited here
      alter both in the same instrument, so that the Department of Justice became, in Irish,
      an Roinn Dlí agus Cirt, Gnóthaí Baile agus Imirce and, in English, the Department of
      Justice, Home Affairs and Migration. English is recorded as the original name because it
      is the form given for all eighteen departments in every source cited here, and the
      English names are therefore marked as the government's own rather than as translations.
      No Irish name has been attributed to a department whose Irish name was not read in an
      official instrument.
    es: >-
      Ambas lenguas son oficiales, y el nombre original que se muestra aquí es el inglés.
      Todo departamento de Estado tiene un nombre irlandés igualmente oficial: las nueve
      órdenes de 2025 aquí citadas modifican los dos en el mismo instrumento, de modo que el
      Department of Justice pasó a ser, en irlandés, an Roinn Dlí agus Cirt, Gnóthaí Baile
      agus Imirce y, en inglés, the Department of Justice, Home Affairs and Migration. Se
      registra el inglés como nombre original porque es la forma que dan para los dieciocho
      departamentos todas las fuentes citadas, y por eso los nombres ingleses se señalan como
      propios del gobierno y no como traducciones. No se atribuye nombre irlandés a ningún
      departamento cuyo nombre irlandés no se haya leído en un instrumento oficial.
  - en: >-
      Why Ireland is graded B. Nine departments cite the 2025 order that gave them their
      current name, which is a legal instrument and therefore tier 1. The other nine —
      Agriculture, Food and the Marine; Defence; Finance; Further and Higher Education,
      Research, Innovation and Science; Health; Housing, Local Government and Heritage;
      Social Protection; the Taoiseach; and Transport — were last renamed or created by
      instruments not traced here, some of them a century old, so they rest on the
      government's list of departments, which is tier 2. The grade reflects a gap in the
      research, not a doubt about the departments: all eighteen appear on the same official
      list, and all eighteen have a serving minister named on the government's own page.
    es: >-
      Por qué Irlanda tiene grado B. Nueve departamentos citan la orden de 2025 que les dio su
      nombre actual, que es un instrumento jurídico y por tanto nivel 1. Los otros nueve
      —Agricultura, Alimentación y Marina; Defensa; Hacienda; Educación Superior,
      Investigación, Innovación y Ciencia; Sanidad; Vivienda, Gobierno Local y Patrimonio;
      Protección Social; el Taoiseach; y Transporte— fueron renombrados o creados por
      instrumentos que no se han rastreado aquí, algunos de hace un siglo, por lo que se
      apoyan en la lista oficial de departamentos, que es nivel 2. El grado refleja una
      laguna de la investigación, no una duda sobre los departamentos: los dieciocho constan
      en la misma lista oficial y los dieciocho tienen ministro en ejercicio en la página del
      propio Gobierno.

