      es: >-
        Se cuenta, a diferencia del órgano equivalente en España, porque el derecho irlandés
        lo constituye como uno de los departamentos de Estado y no como la oficina privada
        del jefe de gobierno. La nota metodológica da la cifra que obtiene quien lo excluye.

