  - id: LV-2026-valsts-kanceleja
    order: 16
    name_original: Valsts kanceleja
    abbreviation_original: null
    name_en: State Chancellery
    name_es: Cancillería del Estado
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Valsts kancelejas direktors
    head_title_en: Director of the State Chancellery
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://www.mk.gov.lv/lv/valsts-kanceleja
    sources: [mk-gov-lv-cabinet-composition-en, mk-gov-lv-sastavs, likumi-mk-iekartas-likums]
    note:
      en: >-
        Recorded because a reader comparing Latvia with Germany or Finland will look for a
        chancellery and should find the answer here rather than infer it from an absence. The
        Valsts kanceleja is, in the government's own English words, "a central public
        administration institution ... directly subordinated to the Prime Minister": it
        services the Cabinet, prepares its sittings and runs public-administration
        development policy. It is not counted for the plainest of reasons — section 5(1) of
        the Ministru kabineta iekārtas likums does not list it, and its head is the Valsts
        kancelejas direktors, a civil servant, not a minister. It adds no cabinet seat, so
        Latvia's figures are unaffected either way; the German Bundeskanzleramt debate and the
        Finnish valtioneuvoston kanslia decision have no Latvian counterpart.
      es: >-
        Se registra porque quien compare Letonia con Alemania o Finlandia buscará una
        cancillería y debe encontrar aquí la respuesta en vez de deducirla de una ausencia. La
        Valsts kanceleja es, en palabras inglesas del propio gobierno, «a central public
        administration institution ... directly subordinated to the Prime Minister»: da
        servicio al gabinete, prepara sus sesiones y lleva la política de desarrollo de la
        administración pública. No se cuenta por la razón más simple: el artículo 5(1) de la
        Ministru kabineta iekārtas likums no la enumera, y su titular es el Valsts kancelejas
        direktors, un funcionario y no un ministro. No añade asiento en el gabinete, de modo
        que las cifras de Letonia no varían en ningún caso; el debate del Bundeskanzleramt
        alemán y la decisión sobre la valtioneuvoston kanslia finlandesa no tienen equivalente
        letón.
