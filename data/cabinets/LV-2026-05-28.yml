# Latvia — government structure of Ministru prezidenta Andra Kulberga vadītais Ministru
# kabinets, Latvia's 43rd government.
#
# See docs/DATA-CONTRACT.md. Four things worth knowing before reading the list:
#
#   1. Like Finland, Latvia enumerates its ministries in a statute — but it enumerates them
#      obliquely. Section 5(1) of the Ministru kabineta iekārtas likums lists the ministers
#      "kuriem ir pakļautas attiecīgās ministrijas", the ministers to whom the respective
#      ministries are subordinate. Creating or abolishing a Latvian ministry means amending
#      that list, so the count is a legal fact rather than a reading of a reorganisation
#      decree.
#   2. The list is numbered 1 to 15 but has fourteen items. Clauses 3 and 10 were repealed in
#      2009 and 2010 and their numbers were never reused, while the ministry added in 2023
#      was inserted as clause 7.1. Anyone who counts the numbers instead of the entries gets
#      fifteen. This is the single commonest way to get Latvia wrong.
#   3. Fourteen ministries, fifteen cabinet seats. The Ministru prezidents heads no ministry:
#      section 5(1) puts him outside the enumeration, and the State Chancellery that serves
#      him is headed by a civil-service director, not a minister.
#   4. This cabinet is two months old. Evika Siliņa's cabinet of 15 September 2023 gave way
#      to this one on 28 May 2026, when the Saeima expressed confidence in it; under section
#      17 of the same Act its members took office the same day.

country: LV
cabinet_id: LV-2026-05-28

cabinet_name_original: Ministru prezidenta Andra Kulberga vadītais Ministru kabinets
cabinet_name_en: Kulbergs cabinet
cabinet_name_es: Gobierno Kulbergs

head_of_government_title_original: Ministru prezidents
head_of_government_title_en: Prime Minister

took_office: 2026-05-28
left_office: null

methodology_notes:
  - en: >-
      14 ministries and 15 cabinet seats. The fourteen are the ministries whose ministers are
      enumerated in section 5, paragraph one of the Ministru kabineta iekārtas likums; the
      fifteenth seat is the Ministru prezidenta, who heads no ministry. The statute is
      explicit about the difference: paragraph one lists the Prime Minister first and then
      "šādi ministri, kuriem ir pakļautas attiecīgās ministrijas" — the following ministers to
      whom the respective ministries are subordinate. The Saeima's notice of 28 May 2026
      publishes exactly the same shape: one Ministru prezidents and fourteen named ministers.
      The two figures are never added together.
    es: >-
      14 ministerios y 15 asientos en el gabinete. Los catorce son los ministerios cuyos
      ministros enumera el artículo 5, apartado primero, de la Ministru kabineta iekārtas
      likums; el decimoquinto asiento es el del Ministru prezidents, que no encabeza ningún
      ministerio. La ley es explícita al respecto: el apartado primero nombra primero al
      primer ministro y después «šādi ministri, kuriem ir pakļautas attiecīgās ministrijas»,
      los siguientes ministros a los que están subordinados los respectivos ministerios. El
      aviso del Saeima de 28 de mayo de 2026 publica exactamente la misma forma: un Ministru
      prezidents y catorce ministros nombrados. Las dos cifras nunca se suman.
  - en: >-
      Why the statutory list is numbered to 15 and still contains fourteen ministries. Clause
      3 was repealed by the law of 28 May 2009 and clause 10 by the law of 16 December 2010;
      Latvian legislative practice leaves the repealed clause in place as "(izslēgts ar ...
      likumu)" rather than renumbering, so both slots are still visible in the consolidated
      text. In the other direction, the Klimata un enerģētikas ministrija created on 1 January
      2023 was inserted as clause 7.1, printed with a superscript, rather than as a new final
      number. The result is a list running 1, 2, 4, 5, 6, 7, 7.1, 8, 9, 11, 12, 13, 14, 15 —
      fourteen entries under fifteen numbers. A reader who counts the highest number rather
      than the entries will publish 15, and several secondary compilations do.
    es: >-
      Por qué la lista legal llega al número 15 y aun así contiene catorce ministerios. El
      punto 3 fue derogado por la ley de 28 de mayo de 2009 y el punto 10 por la de 16 de
      diciembre de 2010; la práctica legislativa letona deja el punto derogado en su sitio
      como «(izslēgts ar ... likumu)» en vez de renumerar, de modo que ambos huecos siguen
      visibles en el texto consolidado. En sentido contrario, el Klimata un enerģētikas
      ministrija, creado el 1 de enero de 2023, se insertó como punto 7.1, impreso con un
      superíndice, y no como un número final nuevo. El resultado es una lista 1, 2, 4, 5, 6,
      7, 7.1, 8, 9, 11, 12, 13, 14, 15: catorce entradas bajo quince números. Quien cuente el
      número más alto en lugar de las entradas publicará 15, y varias recopilaciones
      secundarias lo hacen.
  - en: >-
      This cabinet has no deputy prime minister and no minister for special assignments, and
      that is a fact about this cabinet rather than about Latvia. Section 5, paragraph two of
      the Act expressly allows the Cabinet to contain "viens vai vairāki ministri, kuriem var
      nebūt pakļautas ministrijas" — one or several ministers who may have no ministry
      subordinate to them — namely a Ministru prezidenta biedrs and an īpašu uzdevumu
      ministrs. Earlier Latvian cabinets used both: the Kariņš cabinet confirmed on 23 January
      2019 had two deputy prime ministers, each of whom also held a ministry. The Saeima's
      notice of 28 May 2026 names neither office. If one were created mid-term it would add a
      cabinet seat and, unless it were combined with a ministry, no ministry. A Latvian deputy
      prime minister who also holds a ministry is counted once, through that ministry, as
      section 7, paragraph two contemplates.
    es: >-
      Este gabinete no tiene viceprimer ministro ni ministro para encargos especiales, y eso
      es un hecho sobre este gabinete y no sobre Letonia. El artículo 5, apartado segundo, de
      la ley permite expresamente que el gabinete incluya «viens vai vairāki ministri, kuriem
      var nebūt pakļautas ministrijas» —uno o varios ministros que pueden no tener ministerio
      subordinado—, a saber, un Ministru prezidenta biedrs y un īpašu uzdevumu ministrs.
      Gabinetes letones anteriores usaron ambas figuras: el gabinete Kariņš confirmado el 23
      de enero de 2019 tuvo dos viceprimeros ministros, y cada uno ostentaba además un
      ministerio. El aviso del Saeima de 28 de mayo de 2026 no nombra ninguna de las dos
      figuras. Si se creara una a mitad de legislatura sumaría un asiento y, salvo que se
      combinara con un ministerio, ningún ministerio. Un viceprimer ministro letón que además
      ostente un ministerio se cuenta una sola vez, a través de ese ministerio, como prevé el
      artículo 7, apartado segundo.
  - en: >-
      Which cabinet is in office, and from when. Evika Siliņa's cabinet took office on 15
      September 2023 and is not the sitting government: on 28 May 2026 the Saeima, at an
      extraordinary sitting, expressed confidence in a cabinet led by Andris Kulbergs, formed
      by Apvienotais saraksts, Jaunā Vienotība, Zaļo un Zemnieku savienība and Nacionālā
      apvienība. `took_office` is the date of that vote and not of any later ceremony, because
      section 17 of the Ministru kabineta iekārtas likums provides that members of the Cabinet
      "stājas pie amata pienākumu pildīšanas tūlīt pēc tam, kad Saeima viņiem izteikusi
      uzticību" — they begin performing their duties immediately after the Saeima has
      expressed confidence in them. Latvia's 15th Saeima election falls in October 2026, so
      this cabinet is recorded as sitting with a term that will be short.
    es: >-
      Qué gabinete está en funciones, y desde cuándo. El gabinete de Evika Siliņa tomó
      posesión el 15 de septiembre de 2023 y no es el gobierno vigente: el 28 de mayo de 2026
      el Saeima, en sesión extraordinaria, expresó su confianza en un gabinete encabezado por
      Andris Kulbergs, formado por Apvienotais saraksts, Jaunā Vienotība, Zaļo un Zemnieku
      savienība y Nacionālā apvienība. `took_office` es la fecha de esa votación y no la de
      ninguna ceremonia posterior, porque el artículo 17 de la Ministru kabineta iekārtas
      likums dispone que los miembros del gabinete «stājas pie amata pienākumu pildīšanas
      tūlīt pēc tam, kad Saeima viņiem izteikusi uzticību», es decir, empiezan a ejercer sus
      funciones inmediatamente después de que el Saeima les haya expresado confianza. Las
      elecciones al 15.º Saeima son en octubre de 2026, de modo que este gabinete se registra
      como vigente con un mandato que será corto.
  - en: >-
      Environmental competence is split between two ministries, deliberately, and the statute
      says so. Transitional provision 19, added by the law of 6 June 2024, records that the
      former Vides aizsardzības un reģionālās attīstības ministrija now corresponds both to
      the Viedās administrācijas un reģionālās attīstības ministrija, "ņemot vērā ...
      kompetenci dabas aizsardzības jomā" (nature protection), and to the Klimata un
      enerģētikas ministrija, "ņemot vērā ... kompetenci vides aizsardzības jomā"
      (environmental protection). The project's taxonomy has one id, `environment`, covering
      "environment and nature", so it is tagged on both, and each of the two entities carries
      a note saying which half it holds. Counting these as two environment ministries would
      overstate Latvia's structure; counting neither would lose the split entirely.
    es: >-
      La competencia ambiental está repartida deliberadamente entre dos ministerios, y así lo
      dice la ley. La disposición transitoria 19, añadida por la ley de 6 de junio de 2024,
      recoge que el antiguo Vides aizsardzības un reģionālās attīstības ministrija corresponde
      ahora tanto al Viedās administrācijas un reģionālās attīstības ministrija, «ņemot vērā
      ... kompetenci dabas aizsardzības jomā» (protección de la naturaleza), como al Klimata
      un enerģētikas ministrija, «ņemot vērā ... kompetenci vides aizsardzības jomā»
      (protección del medio ambiente). La taxonomía del proyecto tiene un solo id,
      `environment`, que cubre «medio ambiente y naturaleza», por lo que se etiqueta en ambos,
      y cada una de las dos entidades lleva una nota que indica qué mitad tiene. Contarlos
      como dos ministerios de medio ambiente exageraría la estructura letona; no etiquetar
      ninguno haría desaparecer el reparto.
  - en: >-
      Two official sources publish a figure or a name that this file does not follow, and both
      are worth knowing about. First, the English edition of mk.gov.lv carries two
      descriptions of the government: the "Cabinet composition" item says "the Prime Minister
      and 14 sectoral ministers", matching the Latvian page and the statute, while the
      neighbouring "Sittings of the Cabinet of Ministers" item still says 13 — a stale menu
      description left over from before the Klimata un enerģētikas ministrija was created in
      2023. Second, the State Language Centre's English translation of the Act on likumi.lv is
      expressly flagged "The translation of this document is outdated. Translation validity:
      15.03.2023.–30.06.2024. Amendments not included: 06.06.2024.", so its clause 14 still
      reads "the Minister for Environmental Protection and Regional Development". The English
      minister titles used here are mk.gov.lv's current ones, which give "Minister for Smart
      Administration and Regional Development".
    es: >-
      Dos fuentes oficiales publican una cifra o un nombre que este fichero no sigue, y
      conviene conocer ambas. Primero, la edición inglesa de mk.gov.lv lleva dos descripciones
      del gobierno: la del apartado «Cabinet composition» dice «the Prime Minister and 14
      sectoral ministers», coincidiendo con la página en letón y con la ley, mientras que la
      contigua de «Sittings of the Cabinet of Ministers» sigue diciendo 13, una descripción de
      menú obsoleta anterior a la creación del Klimata un enerģētikas ministrija en 2023.
      Segundo, la traducción inglesa de la ley del Centro Estatal de Lengua publicada en
      likumi.lv está marcada expresamente como «The translation of this document is outdated.
      Translation validity: 15.03.2023.–30.06.2024. Amendments not included: 06.06.2024.», de
      modo que su punto 14 aún dice «the Minister for Environmental Protection and Regional
      Development». Los títulos ministeriales en inglés usados aquí son los actuales de
      mk.gov.lv, que dan «Minister for Smart Administration and Regional Development».
  - en: >-
      Names and provenance. The Latvian government publishes official English titles for its
      ministers ("Minister for Defence", "Minister for Welfare", "Minister for Smart
      Administration and Regional Development"), and those are what this file records in
      `head_title_en`. It does not publish a consolidated English list of the ministries as
      institutions, so every `name_en` below is this project's rendering of the Latvian
      institutional name, formed to match the government's own English title of the
      corresponding minister, and is marked `translated`; the two entities whose English names
      the government does publish — "Prime Minister" and "State Chancellery" — are marked
      `official`. All Spanish names are this project's. Latvian minister titles are gendered:
      the Saeima's notice writes "ārlietu ministre" and "izglītības un zinātnes ministre" of
      the women holding those posts and "aizsardzības ministrs" of the man holding his.
      `head_title_original` records the masculine form, which is the form the statute uses for
      the office irrespective of who holds it.
    es: >-
      Nombres y procedencia. El gobierno letón publica títulos oficiales en inglés para sus
      ministros («Minister for Defence», «Minister for Welfare», «Minister for Smart
      Administration and Regional Development»), y eso es lo que este fichero recoge en
      `head_title_en`. No publica una lista consolidada en inglés de los ministerios como
      instituciones, de modo que cada `name_en` de abajo es una traducción de este proyecto
      del nombre institucional letón, construida para coincidir con el título inglés oficial
      del ministro correspondiente, y lleva la marca `translated`; las dos entidades cuyo
      nombre inglés sí publica el gobierno —«Prime Minister» y «State Chancellery»— llevan
      `official`. Todos los nombres en español son de este proyecto. Los títulos ministeriales
      letones tienen género: el aviso del Saeima escribe «ārlietu ministre» e «izglītības un
      zinātnes ministre» de las mujeres que ocupan esos puestos y «aizsardzības ministrs» del
      hombre que ocupa el suyo. `head_title_original` recoge la forma masculina, que es la que
      usa la ley para el cargo con independencia de quién lo ocupe.
  - en: >-
      Listing order and perimeter. `order` follows the order of the statute and of the
      Saeima's notice, both of which name the Ministru prezidents first and then the ministers
      in the same sequence; that is why the head of government stands at position 1 even
      though he is not counted. The State Chancellery is recorded last, outside both lists,
      because no source treats it as a member of the Cabinet. This file describes the central
      government of the Republic of Latvia only: the 42 local governments and the five
      planning regions are subnational and out of scope, and appear here only as the subject
      matter of a ministry.
    es: >-
      Orden de listado y perímetro. `order` sigue el orden de la ley y el del aviso del
      Saeima, que nombran ambos primero al Ministru prezidents y luego a los ministros en la
      misma secuencia; por eso el jefe de gobierno ocupa la posición 1 aunque no se cuente. La
      Cancillería del Estado se registra al final, fuera de ambas listas, porque ninguna
      fuente la trata como miembro del gabinete. Este fichero describe únicamente el gobierno
      central de la República de Letonia: los 42 gobiernos locales y las cinco regiones de
      planificación son subnacionales y quedan fuera de alcance, y aparecen aquí sólo como
      materia de un ministerio.

sources:
  - id: likumi-mk-iekartas-likums
    tier: 1
    type: statute
    publisher: Latvijas Republikas Saeima / Oficiālais izdevējs "Latvijas Vēstnesis" (Likumi.lv)
    title: Ministru kabineta iekārtas likums (konsolidētā redakcija, spēkā no 01.07.2025.)
    url: https://likumi.lv/ta/id/175919-ministru-kabineta-iekartas-likums
    archive_url: https://web.archive.org/web/20250523203503/https://likumi.lv/ta/id/175919-ministru-kabineta-iekartas-likums
    lang: lv
    published: 2008-05-28
    accessed: 2026-07-28
    quote: |-
      5.pants. Ministru kabineta locekļi
      (1) Ministru kabineta sastāvā ir Ministru prezidents un šādi ministri, kuriem ir pakļautas attiecīgās ministrijas:
      1) aizsardzības ministrs;
      2) ārlietu ministrs;
      3) (izslēgts ar 28.05.2009. likumu);
      4) ekonomikas ministrs;
      5) finanšu ministrs;
      6) iekšlietu ministrs;
      7) izglītības un zinātnes ministrs;
      7¹) klimata un enerģētikas ministrs;
      8) kultūras ministrs;
      9) labklājības ministrs;
      10) (izslēgts ar 16.12.2010. likumu);
      11) satiksmes ministrs;
      12) tieslietu ministrs;
      13) veselības ministrs;
      14) viedās administrācijas un reģionālās attīstības ministrs;
      15) zemkopības ministrs.
      (2) Ministru kabineta sastāvā var būt viens vai vairāki ministri, kuriem var nebūt pakļautas ministrijas:
      1) Ministru prezidenta biedrs;
      2) īpašu uzdevumu ministrs.
      (Ar grozījumiem, kas izdarīti ar 11.12.2008., 28.05.2009., 16.12.2010., 01.12.2022. un 06.06.2024. likumu, kas stājas spēkā 01.07.2024.)
      17.pants. Ministru kabineta locekļu stāšanās amatā
      Ministru kabineta locekļi stājas pie amata pienākumu pildīšanas tūlīt pēc tam, kad Saeima viņiem izteikusi uzticību.
      19. Līdz dienai, kad stājas spēkā attiecīgi grozījumi citos normatīvajos aktos, tajos lietotais termins "Vides aizsardzības un reģionālās attīstības ministrija" atbilst terminam "Viedās administrācijas un reģionālās attīstības ministrija", ņemot vērā Viedās administrācijas un reģionālās attīstības ministrijas kompetenci dabas aizsardzības jomā, un terminam "Klimata un enerģētikas ministrija", ņemot vērā Klimata un enerģētikas ministrijas kompetenci vides aizsardzības jomā.
    note: >-
      The enumerating instrument, and the reason Latvia's ministry count is a legal fact:
      section 5, paragraph one lists the ministers to whom the ministries are subordinate, and
      adding or removing a ministry requires amending it. The quotation reproduces that
      section in full, including paragraph two on ministers without a ministry and the
      amendment history line that closes it; then section 17, which fixes the date this
      cabinet took office; then transitional provision 19, which is the only place in the Act
      where the two ministries renamed and re-scoped in 2024 are named as institutions rather
      than through their ministers. Clause 7.1 is printed in the original with a superscript
      one, transcribed here as 7¹. Consolidated text as published by Likumi.lv: the displayed
      version is the one in force from 1 July 2025, and it is the newest — the amending law of
      29 May 2025 touched sections 27 to 30 (handling of matters, sittings, transparency,
      decision-making) and none of the passages quoted here, while section 5 was last amended
      by the law of 6 June 2024 in force from 1 July 2024, which is when the vides aizsardzības
      un reģionālās attīstības ministrs became the viedās administrācijas un reģionālās
      attīstības ministrs. The archived snapshot is of 23 May 2025 and therefore shows the
      previous consolidated version (1 July 2024 – 30 June 2025); the live page was read on the
      access date and every passage quoted here is identical in both, which was checked
      against the snapshot rather than assumed.

  - id: lv-vestnesis-uzticiba-2026-05-28
    tier: 1
    type: official_gazette
    publisher: Oficiālais izdevums "Latvijas Vēstnesis"
    title: >-
      Saeimas paziņojums "Par uzticības izteikšanu Ministru kabinetam" (Latvijas Vēstnesis,
      28.05.2026., Nr. 101A, OP 2026/101A.1)
    url: https://www.vestnesis.lv/op/2026/101A.1
    archive_url: https://web.archive.org/web/20260714230217/https://www.vestnesis.lv/op/2026/101A.1
    lang: lv
    published: 2026-05-28
    accessed: 2026-07-28
    quote: |-
      Daru zināmu, ka Saeima šā gada 28. maija sēdē izteikusi uzticību Ministru kabinetam šādā sastāvā:
      Ministru prezidents — Andris Kulbergs,
      aizsardzības ministrs — Raivis Melnis,
      ārlietu ministre — Baiba Braže,
      ekonomikas ministrs — Viktors Valainis,
      finanšu ministrs — Māris Kučinskis,
      iekšlietu ministrs — Jānis Dombrava,
      izglītības un zinātnes ministre — Ilze Indriksone,
      klimata un enerģētikas ministrs — Jānis Vitenbergs,
      kultūras ministrs — Nauris Puntulis,
      labklājības ministrs — Reinis Uzulnieks,
      satiksmes ministrs — Rihards Kozlovskis,
      tieslietu ministrs — Edvards Smiltēns,
      veselības ministrs — Hosams Abu Meri,
      viedās administrācijas un reģionālās attīstības ministrs — Edgars Tavars,
      zemkopības ministrs — Uldis Augulis.
      Saeimas priekšsēdētāja D. Mieriņa
      Rīgā 2026. gada 28. maijā
    note: >-
      The instrument that constitutes this cabinet, published in the official gazette the same
      evening as the vote (issue 101A of 28 May 2026, timed 18:01). It is quoted in full
      because it settles three things at once: the date, which section 17 of the Ministru
      kabineta iekārtas likums makes the date the members took office; the perimeter, since it
      names one Ministru prezidents and fourteen ministers and no Ministru prezidenta biedrs
      or īpašu uzdevumu ministrs; and the order, which is the same as the statute's. Its
      wording — "uzticību Ministru kabinetam šādā sastāvā", confidence in the Cabinet in the
      following composition — is why a confidence vote rather than an appointment decree is
      the tier-1 source for a Latvian cabinet.

