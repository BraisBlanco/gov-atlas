  - id: LV-2026-viedas-administracijas-ministrija
    order: 14
    name_original: Viedās administrācijas un reģionālās attīstības ministrija
    abbreviation_original: VARAM
    name_en: Ministry of Smart Administration and Regional Development
    name_es: Ministerio de Administración Inteligente y Desarrollo Regional
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Viedās administrācijas un reģionālās attīstības ministrs
    head_title_en: Minister for Smart Administration and Regional Development
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [digital, public_administration, regional_development, territorial_administration, spatial_planning, environment]
    counts_as_ministry: true
    url: https://www.varam.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        The same institution as the former Vides aizsardzības un reģionālās attīstības
        ministrija, renamed and re-scoped on 1 July 2024 by the law of 6 June 2024, which kept
        the abbreviation VARAM. It is not a new ministry and the count did not move. The
        ministry now describes itself as making sectoral policy in nature protection, regional
        development and the governance of digital transformation; local government, national
        and municipal spatial development planning and the one-stop-shop network are also
        its. `environment` is tagged for the dabas aizsardzība half of the old environment
        portfolio, which transitional provision 19 of the Act expressly leaves here while
        assigning vides aizsardzība to the Ministry of Climate and Energy. Note that the
        government's own English translation of the Act still calls this post "Minister for
        Environmental Protection and Regional Development", because that translation stops at
        30 June 2024.
      es: >-
        La misma institución que el antiguo Vides aizsardzības un reģionālās attīstības
        ministrija, renombrada y con competencias redefinidas el 1 de julio de 2024 por la ley
        de 6 de junio de 2024, que conservó la sigla VARAM. No es un ministerio nuevo y la
        cifra no se movió. El ministerio se describe ahora como el que elabora la política
        sectorial en protección de la naturaleza, desarrollo regional y gobernanza de la
        transformación digital; también son suyos el gobierno local, la planificación del
        desarrollo territorial nacional y municipal y la red de ventanillas únicas.
        `environment` se etiqueta por la mitad de dabas aizsardzība de la antigua cartera
        ambiental, que la disposición transitoria 19 de la ley deja expresamente aquí mientras
        asigna la vides aizsardzība al Ministerio de Clima y Energía. Nótese que la propia
        traducción inglesa oficial de la ley sigue llamando a este cargo «Minister for
        Environmental Protection and Regional Development», porque esa traducción se detiene
        el 30 de junio de 2024.

  - id: LV-2026-zemkopibas-ministrija
    order: 15
    name_original: Zemkopības ministrija
    abbreviation_original: ZM
    name_en: Ministry of Agriculture
    name_es: Ministerio de Agricultura
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Zemkopības ministrs
    head_title_en: Minister for Agriculture
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [agriculture, forestry, fisheries, food_safety, rural_development, animal_welfare]
    counts_as_ministry: true
    url: https://www.zm.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        "Zemkopība" is husbandry rather than agriculture narrowly, and the ministry is the
        leading authority in agriculture, forestry and fisheries alike — forestry matters in
        a country slightly more than half of which is forest. Food and food safety and animal
        protection and welfare are also its, through the Pārtikas un veterinārais dienests,
        which is why `food_safety` and `animal_welfare` are tagged although neither appears in
        the name.
      es: >-
        «Zemkopība» significa labranza más que agricultura en sentido estricto, y el
        ministerio es la autoridad rectora tanto en agricultura como en silvicultura y pesca;
        la silvicultura pesa en un país cuya superficie es algo más de la mitad bosque. La
        alimentación y la seguridad alimentaria y la protección y el bienestar de los animales
        también son suyos, a través del Pārtikas un veterinārais dienests, y por eso se
        etiquetan `food_safety` y `animal_welfare` aunque ninguno aparezca en el nombre.

