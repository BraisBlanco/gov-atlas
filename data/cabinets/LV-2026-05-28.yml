      Minister for Interior
      Minister for Transport
      Minister for Welfare
      Minister for Climate and Energy
      The State Chancellery is a central public administration institution. It is directly subordinated to the Prime Minister.
    note: >-
      The English-language edition of mk.gov.lv, published by the Latvian government itself,
      which is what fixes the English titles of the ministers in this file and the English
      names of the two entities marked name_en_provenance official, "Prime Minister" and
      "State Chancellery". It also states the figure 14 in English. The same page's menu
      carries one stale description, attached to the "Sittings of the Cabinet of Ministers"
      item, still reading "the Prime Minister and 13 sectoral ministers"; it is a leftover from
      before the Klimata un enerģētikas ministrija was created and is discussed in the
      methodology notes. The snapshot was created on the access date because none existed.

  - id: likumi-mk-structure-law-en
    tier: 2
    type: government_website
    publisher: Valsts valodas centrs / Oficiālais izdevējs "Latvijas Vēstnesis" (Likumi.lv)
    title: Cabinet of Ministers Structure Law (official English translation, Likumi.lv)
    url: https://likumi.lv/ta/en/en/id/175919-cabinet-of-ministers-structure-law
    archive_url: https://web.archive.org/web/20260728092652/https://likumi.lv/ta/en/en/id/175919-cabinet-of-ministers-structure-law
    lang: en
    published: null
    accessed: 2026-07-28
    quote: |-
      The translation of this document is outdated.
      Translation validity: 15.03.2023.–30.06.2024.
      Amendments not included: 06.06.2024.
      (1) The Cabinet shall be composed of the Prime Minister and the following ministers to whom the relevant ministries are subordinated:
      1) the Minister for Defence;
      2) the Minister for Foreign Affairs;
      3) [28 May 2009];
      4) the Minister for Economics;
      5) the Minister for Finance;
      6) the Minister for the Interior;
      7) the Minister for Education and Science;
      71) the Minister for Climate and Energy;
      8) the Minister for Culture;
      9) the Minister for Welfare;
      10) [16 December 2010];
      11) the Minister for Transport;
      12) the Minister for Justice;
      13) the Minister for Health;
      14) the Minister for Environmental Protection and Regional Development;
      15) the Minister for Agriculture.
      (2) The Cabinet may be composed of one or several ministers who do not have ministries subordinated to them:
      1) the Deputy Prime Minister;
      2) the Minister for Special Assignments.
    note: >-
      The State Language Centre's English translation of the Act, published on Likumi.lv
      alongside the Latvian text. Tier 2 rather than tier 1 because a translation is not the
      legal act: Likumi.lv itself notes that in case of contradiction the official publication
      prevails. It is cited for two reasons. First, it is the government's own English
      rendering of the statutory list, and it confirms that "shall be composed of the Prime
      Minister and the following ministers" separates the head of government from the fourteen.
      Second, it is quoted with its own warning banner, because the page is expressly marked
      outdated: it reflects the text in force to 30 June 2024 and therefore still calls clause
      14 "the Minister for Environmental Protection and Regional Development", a post that no
      longer exists under that name. The current English title is mk.gov.lv's "Minister for
      Smart Administration and Regional Development", which is what this file uses. The
      superscript in clause 7.1 is flattened to "71" by the page itself and is transcribed here
      as the page prints it. The snapshot was created on the access date because none existed.

entities:
  # Order follows section 5(1) of the Ministru kabineta iekārtas likums and the Saeima's
  # notice of 28 May 2026, both of which name the Prime Minister first and then the ministers
  # in the same sequence. The Prime Minister is therefore first and is not counted.
  - id: LV-2026-ministru-prezidents
    order: 1
    name_original: Ministru prezidents
    abbreviation_original: null
    name_en: Prime Minister
    name_es: Primer ministro
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministru prezidents
    head_title_en: Prime Minister
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://www.mk.gov.lv/lv/ministru-prezidents
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        The head of government holds a seat without heading a ministry, and Latvian statute is
        unusually explicit about it: section 5(1) names the Ministru prezidents and then,
        separately, the ministers "kuriem ir pakļautas attiecīgās ministrijas". Section 6(2)
        allows him to take over one minister's duties permanently or temporarily, which would
        change who runs a ministry but not how many there are. His own department is the
        Valsts kanceleja, recorded last in this file and not counted because it is headed by a
        civil-service director rather than a minister. This is the difference between Latvia
        and Finland, where the Prime Minister's Office is itself one of the statutory
        ministries and is counted.
      es: >-
        El jefe de gobierno ocupa asiento sin encabezar ningún ministerio, y la ley letona es
        inusualmente explícita al respecto: el artículo 5(1) nombra al Ministru prezidents y
        después, por separado, a los ministros «kuriem ir pakļautas attiecīgās ministrijas».
        El artículo 6(2) le permite asumir de forma permanente o temporal las funciones de un
        ministro, lo que cambiaría quién dirige un ministerio pero no cuántos hay. Su
        departamento propio es la Valsts kanceleja, registrada al final de este fichero y no
        contada porque la dirige un funcionario y no un ministro. Esta es la diferencia con
        Finlandia, donde la Oficina del Primer Ministro es ella misma uno de los ministerios
        legales y sí se cuenta.

  # --- the fourteen ministries, in the statutory order of section 5(1) --------------------
  - id: LV-2026-aizsardzibas-ministrija
    order: 2
    name_original: Aizsardzības ministrija
    abbreviation_original: null
    name_en: Ministry of Defence
    name_es: Ministerio de Defensa
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Aizsardzības ministrs
    head_title_en: Minister for Defence
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [defence]
    counts_as_ministry: true
    url: https://www.mod.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        Tagged defence only. Latvia's compulsory national service, the Valsts aizsardzības
        dienests introduced in 2023, and military cyber defence are this ministry's, but
        civil protection and the rescue service are the Ministry of the Interior's, and this
        dataset tags the ministry that holds the subject matter.
      es: >-
        Se etiqueta sólo defence. El servicio nacional obligatorio letón, el Valsts
        aizsardzības dienests introducido en 2023, y la ciberdefensa militar son de este
        ministerio, pero la protección civil y el servicio de salvamento son del Ministerio
        del Interior, y este dataset etiqueta al ministerio que tiene la materia.

  - id: LV-2026-arlietu-ministrija
    order: 3
    name_original: Ārlietu ministrija
    abbreviation_original: null
    name_en: Ministry of Foreign Affairs
    name_es: Ministerio de Asuntos Exteriores
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ārlietu ministrs
    head_title_en: Minister for Foreign Affairs
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [foreign_affairs, european_affairs, development_cooperation, diaspora]
    counts_as_ministry: true
    url: https://www.mfa.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        Latvia has no separate ministry for European affairs, for development cooperation or
        for the diaspora, and all three sit here: the ministry runs development cooperation
        and, under the Diasporas likums, coordinates diaspora policy. Trade is not tagged
        here even though the ministry's economic relations directorate promotes exports,
        because trade policy proper belongs to the Ministry of Economics.
      es: >-
        Letonia no tiene ministerio propio de asuntos europeos, de cooperación al desarrollo
        ni de diáspora, y los tres están aquí: el ministerio gestiona la cooperación al
        desarrollo y, conforme a la Diasporas likums, coordina la política de diáspora. No se
        etiqueta trade aunque la dirección de relaciones económicas del ministerio promueva
        las exportaciones, porque la política comercial propiamente dicha es del Ministerio de
        Economía.

  - id: LV-2026-ekonomikas-ministrija
    order: 4
    name_original: Ekonomikas ministrija
    abbreviation_original: EM
    name_en: Ministry of Economics
    name_es: Ministerio de Economía
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ekonomikas ministrs
    head_title_en: Minister for Economics
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [economy, industry, trade, small_business, innovation, housing, tourism, consumer_protection]
    counts_as_ministry: true
    url: https://www.em.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        The widest remit in the Latvian government, and the longest tag list here: the
        ministry describes itself as making structural economic policy and the policy for
        industry, construction, tourism, external economic relations, the internal market in
        goods and services, business development, investment and consumer protection, and it
        also holds housing policy. Two cautions. Energy is not tagged here although the
        ministry's own summary still mentions it: energy left this ministry on 1 January 2023
        for the Klimata un enerģētikas ministrija, which was created by reorganising this
        ministry and the former Vides aizsardzības un reģionālās attīstības ministrija.
        Construction is not tagged as `infrastructure` either, because what this ministry
        holds is building regulation rather than public works, which are the Ministry of
        Transport's.
      es: >-
        El ámbito más amplio del gobierno letón, y la lista de etiquetas más larga de este
        fichero: el ministerio se describe como responsable de la política estructural de la
        economía nacional y de la política de industria, construcción, turismo, relaciones
        económicas exteriores, mercado interior de bienes y servicios, desarrollo empresarial,
        inversiones y protección de los consumidores, y además tiene la política de vivienda.
        Dos cautelas. No se etiqueta energy aunque el propio resumen del ministerio siga
        mencionándola: la energía salió de este ministerio el 1 de enero de 2023 hacia el
        Klimata un enerģētikas ministrija, creado reorganizando este ministerio y el antiguo
        Vides aizsardzības un reģionālās attīstības ministrija. Tampoco se etiqueta la
        construcción como `infrastructure`, porque lo que tiene este ministerio es la
        regulación de la edificación y no la obra pública, que es del Ministerio de
        Transporte.

  - id: LV-2026-finansu-ministrija
    order: 5
    name_original: Finanšu ministrija
    abbreviation_original: FM
    name_en: Ministry of Finance
    name_es: Ministerio de Finanzas
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Finanšu ministrs
    head_title_en: Minister for Finance
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [finance, budget]
    counts_as_ministry: true
    url: https://www.fm.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        Tax policy, the annual budget, the tax and customs administration and macroeconomic
        supervision. It is also Latvia's managing authority for the EU cohesion funds, which
        would fit the taxonomy's `regional_development` ("regional development and cohesion
        funds"); that tag is deliberately left on the Ministry of Smart Administration and
        Regional Development instead, which makes regional policy, so that a cross-country
        reader is not shown two Latvian regional-development ministries where there is one.
      es: >-
        Política fiscal, presupuesto anual, administración tributaria y aduanera y
        supervisión macroeconómica. Es además la autoridad de gestión letona de los fondos de
        cohesión de la UE, lo que encajaría con `regional_development` («desarrollo regional y
        fondos de cohesión») de la taxonomía; esa etiqueta se deja deliberadamente en el
        Ministerio de Administración Inteligente y Desarrollo Regional, que hace la política
        regional, para que un lector transnacional no vea dos ministerios letones de
        desarrollo regional donde hay uno.

  - id: LV-2026-iekslietu-ministrija
    order: 6
    name_original: Iekšlietu ministrija
    abbreviation_original: null
    name_en: Ministry of the Interior
    name_es: Ministerio del Interior
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Iekšlietu ministrs
    head_title_en: Minister for Interior
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [interior, civil_protection, migration]
    counts_as_ministry: true
    url: https://www.iem.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        The ministry defines its own sector as covering crime prevention, public order and
        security, protection of persons' rights, state border security, fire safety,
        firefighting, rescue, civil protection, population registration and documentation, and
        migration. Latvia has no separate migration ministry and no separate civil-protection
        ministry: the State Fire and Rescue Service and the Office of Citizenship and
        Migration Affairs are both subordinate to this one.
      es: >-
        El ministerio define su sector como la lucha contra la delincuencia, el orden y la
        seguridad públicos, la protección de los derechos de las personas, la seguridad de la
        frontera estatal, la seguridad contra incendios, la extinción de incendios, el
        salvamento, la protección civil, el registro y la documentación de la población y la
        migración. Letonia no tiene ministerio de migración ni de protección civil propios: el
        Servicio Estatal de Bomberos y Salvamento y la Oficina de Asuntos de Ciudadanía y
        Migración dependen ambos de este.

  - id: LV-2026-izglitibas-un-zinatnes-ministrija
    order: 7
    name_original: Izglītības un zinātnes ministrija
    abbreviation_original: IZM
    name_en: Ministry of Education and Science
    name_es: Ministerio de Educación y Ciencia
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Izglītības un zinātnes ministrs
    head_title_en: Minister for Education and Science
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [education, higher_education, vocational_training, research, sport, youth, language_policy, space]
    counts_as_ministry: true
    url: https://www.izm.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        Four of the eight tags are invisible in the two-word name. The ministry describes
        itself as the leading authority in education, science and sport and in youth, space
        and state language policy. Sport and youth have no ministry of their own in Latvia.
        Space is a policy area of this ministry rather than of the economy ministry, which is
        unusual in this dataset. Language policy is tagged here because this ministry makes
        it and the Latviešu valodas aģentūra is subordinate to it; enforcement of the State
        Language Law sits with the Valsts valodas centrs under the Ministry of Justice, so a
        reader looking for Latvian language policy should look at both.
      es: >-
        Cuatro de las ocho etiquetas no se aprecian en un nombre de dos palabras. El
        ministerio se describe como la autoridad rectora en educación, ciencia y deporte y en
        política de juventud, espacio y lengua estatal. El deporte y la juventud no tienen
        ministerio propio en Letonia. El espacio es área de política de este ministerio y no
        del de Economía, algo poco habitual en este dataset. La política lingüística se
        etiqueta aquí porque la elabora este ministerio y la Latviešu valodas aģentūra depende
        de él; la vigilancia del cumplimiento de la Ley de la Lengua Estatal corresponde al
        Valsts valodas centrs, adscrito al Ministerio de Justicia, de modo que quien busque la
        política lingüística letona debe mirar ambos.

  - id: LV-2026-klimata-un-energetikas-ministrija
    order: 8
    name_original: Klimata un enerģētikas ministrija
    abbreviation_original: KEM
    name_en: Ministry of Climate and Energy
    name_es: Ministerio de Clima y Energía
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Klimata un enerģētikas ministrs
    head_title_en: Minister for Climate and Energy
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [climate, energy, environment, water]
    counts_as_ministry: true
    url: https://www.kem.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        The newest Latvian ministry, created on 1 January 2023 by reorganising the Ministry of
        Economics and the former Vides aizsardzības un reģionālās attīstības ministrija, and
        inserted into the statutory list as clause 7.1 rather than at its end. It is one of
        the few dedicated climate ministries in this dataset. The `environment` tag is the
        contestable one: transitional provision 19 of the Act gives this ministry the
        vides aizsardzība half of the old environment portfolio — waste management,
        circular economy, surface, ground and marine water resources, pollution and
        environmental quality — while nature protection went to the Ministry of Smart
        Administration and Regional Development, which is tagged `environment` too. `water` is
        tagged here for the same reason.
      es: >-
        El ministerio letón más reciente, creado el 1 de enero de 2023 reorganizando el
        Ministerio de Economía y el antiguo Vides aizsardzības un reģionālās attīstības
        ministrija, e insertado en la lista legal como punto 7.1 y no al final. Es uno de los
        pocos ministerios de clima propios de este dataset. La etiqueta `environment` es la
        discutible: la disposición transitoria 19 de la ley le da la mitad de vides
        aizsardzība de la antigua cartera ambiental —gestión de residuos, economía circular,
        aguas superficiales, subterráneas y marinas, contaminación y calidad ambiental—,
        mientras que la protección de la naturaleza pasó al Ministerio de Administración
        Inteligente y Desarrollo Regional, que también lleva `environment`. Por la misma razón
        se etiqueta aquí `water`.

  - id: LV-2026-kulturas-ministrija
    order: 9
    name_original: Kultūras ministrija
    abbreviation_original: KM
    name_en: Ministry of Culture
    name_es: Ministerio de Cultura
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Kultūras ministrs
    head_title_en: Minister for Culture
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [culture, media]
    counts_as_ministry: true
    url: https://www.km.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        The ministry describes itself as forming and coordinating state cultural policy,
        making state policy on the integration of society, and making mass-media policy —
        hence `media` alongside `culture`. Its third stated task, sabiedrības integrācija, has
        no home in the project's taxonomy: it is neither migration nor equality but social
        cohesion, and it is recorded here in prose rather than forced into a tag that would
        misdescribe it.
      es: >-
        El ministerio se describe como el que forma y coordina la política cultural estatal,
        elabora la política estatal de integración de la sociedad y elabora la política de
        medios de comunicación de masas; de ahí `media` junto a `culture`. Su tercera tarea
        declarada, la sabiedrības integrācija, no tiene sitio en la taxonomía del proyecto: no
        es migración ni igualdad, sino cohesión social, y se recoge aquí en prosa en lugar de
        forzarla en una etiqueta que la describiría mal.

  - id: LV-2026-labklajibas-ministrija
    order: 10
    name_original: Labklājības ministrija
    abbreviation_original: LM
    name_en: Ministry of Welfare
    name_es: Ministerio de Bienestar
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Labklājības ministrs
    head_title_en: Minister for Welfare
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [social_affairs, labour, social_security, family, disability, equality]
    counts_as_ministry: true
    url: https://www.lm.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        Latvia has no labour ministry, no pensions ministry, no family ministry and no
        equality ministry: this one is all of them. Its own description of the welfare sector
        covers pensions, benefits, social insurance, social inclusion, family and children,
        social work and services, the labour market, employment relations and occupational
        safety, disability and gender equality. `equality` is tagged for that last item and
        for the ministry's statutory lead on equal opportunities for persons with
        disabilities; Latvia has no wider anti-discrimination department.
      es: >-
        Letonia no tiene ministerio de trabajo, ni de pensiones, ni de familia, ni de
        igualdad: este los reúne todos. Su propia descripción del sector del bienestar abarca
        pensiones, prestaciones, seguridad social, inclusión social, familia e infancia,
        trabajo social y servicios sociales, mercado laboral, relaciones laborales y seguridad
        en el trabajo, discapacidad e igualdad de género. `equality` se etiqueta por esto
        último y por la competencia legal del ministerio en igualdad de oportunidades de las
        personas con discapacidad; Letonia no tiene un departamento más amplio de no
        discriminación.

  - id: LV-2026-satiksmes-ministrija
    order: 11
    name_original: Satiksmes ministrija
    abbreviation_original: SM
    name_en: Ministry of Transport
    name_es: Ministerio de Transporte
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Satiksmes ministrs
    head_title_en: Minister for Transport
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [transport, telecommunications, shipping, infrastructure]
    counts_as_ministry: true
    url: https://www.sam.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        "Satiksme" is transport and "sakari" is communications, and this ministry is the
        leading authority in both. The transport sector is defined as covering rail, road,
        maritime and aviation, together with passenger, transit and dangerous-goods carriage;
        the road sub-sector includes the state road network, which is why `infrastructure` is
        tagged. `telecommunications` covers the communications half — electronic
        communications and postal services — which is separate from the digital-government
        portfolio held by the Ministry of Smart Administration and Regional Development.
      es: >-
        «Satiksme» es transporte y «sakari» comunicaciones, y este ministerio es la autoridad
        rectora en ambos. El sector del transporte se define como ferrocarril, carretera,
        marítimo y aviación, junto con el transporte de pasajeros, de tránsito y de mercancías
        peligrosas; el subsector de carretera incluye la red estatal de carreteras, y por eso
        se etiqueta `infrastructure`. `telecommunications` cubre la mitad de comunicaciones
        —comunicaciones electrónicas y servicios postales—, distinta de la cartera de gobierno
        digital que tiene el Ministerio de Administración Inteligente y Desarrollo Regional.

  - id: LV-2026-tieslietu-ministrija
    order: 12
    name_original: Tieslietu ministrija
    abbreviation_original: null
    name_en: Ministry of Justice
    name_es: Ministerio de Justicia
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Tieslietu ministrs
    head_title_en: Minister for Justice
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [justice, religion]
    counts_as_ministry: true
    url: https://www.tm.gov.lv
    sources: [likumi-mk-iekartas-likums, lv-vestnesis-uzticiba-2026-05-28, mk-gov-lv-sastavs, mk-gov-lv-cabinet-composition-en, likumi-mk-structure-law-en]
    note:
      en: >-
        The ministry describes itself as the leading authority in the justice sector — legal
        system policy, the court system and court administration — and in the other fields
        assigned to it by its statutes. `religion` is tagged because the activity of religious
        organisations is one of those fields; Latvia has no ministry of religious affairs.
        Enforcement of the State Language Law also sits here, through the Valsts valodas
        centrs, but language policy is made by the Ministry of Education and Science and is
        tagged there.
      es: >-
        El ministerio se describe como la autoridad rectora del sector de la justicia
        —política del sistema jurídico, sistema judicial y administración de los tribunales— y
        de los demás ámbitos que le asigna su reglamento. Se etiqueta `religion` porque la
        actividad de las organizaciones religiosas es uno de ellos; Letonia no tiene
        ministerio de asuntos religiosos. La vigilancia del cumplimiento de la Ley de la
        Lengua Estatal también está aquí, a través del Valsts valodas centrs, pero la política
        lingüística la elabora el Ministerio de Educación y Ciencia y se etiqueta allí.

