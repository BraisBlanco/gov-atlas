    note: >-
      The government's own composition page, cited for the figure the government itself
      publishes — "Ministru prezidents un 14 nozaru ministri", the Prime Minister and 14
      sectoral ministers — which is the same 14 the statute yields, and for the date the
      Prime Minister took office. The quotation takes that sentence, then the page's own list
      of the fifteen offices in its own order (which puts tieslietu before ārlietu, unlike the
      statute), then the sentence about the Prime Minister from further down the same page.
      The archived snapshot is of 26 June 2026, a month into this cabinet, and contains every
      quoted sentence.

