# Cyprus — government structure of the government of Nikos Christodoulides.
#
# Read docs/DATA-CONTRACT.md alongside this file. Cyprus is the last country in v1 scope and
# the most structurally unusual one in it. Seven things to know before reading the list:
#
#   1. **There is no prime minister.** Cyprus is a presidential republic. The President of
#      the Republic is head of state and head of government at once; ministers are appointed
#      by him and answerable to him, not to the House of Representatives. So
#      `head_of_government_title_original` is Πρόεδρος της Δημοκρατίας, and the
#      `head_of_government_office` exclusion is applied to a presidency, not a premiership.
#   2. **No instrument enumerates the ministries.** Article 46 of the 1960 Constitution
#      constitutes the Council of Ministers and names only three departments (foreign
#      affairs, defence, finance); the rest were created and renamed one at a time. The
#      listing order below is the Republic's own ceremonial precedence order, taken from the
#      Press and Information Office's announcement of the swearing-in.
#   3. **Article 46 has been overtaken by the law of necessity.** It provides for a Council
#      of seven Greek and three Turkish ministers, a Turkish Cypriot Vice-President, and one
#      of foreign affairs/defence/finance reserved to a Turkish Cypriot minister. The Turkish
#      Cypriot members withdrew in 1964. The Republic has since functioned with eleven
#      ministries, all held by Greek Cypriots. See methodology_notes.
#   4. **The Vice-Presidency carries `head_count: 0`.** The post exists in the Constitution
#      and has been vacant since 1964. That is what `head_count: 0` encodes: a seat at the
#      table that nobody holds. It is not silently dropped and it is not counted as filled.
#   5. **The six Υφυπουργεία are the central judgement call.** They are free-standing
#      departments created by their own statutes — and their heads are not ministers and may
#      not vote in the Council of Ministers. They are recorded, not counted. Both figures are
#      stated in methodology_notes; nothing in this file adds them.
#   6. **The northern part of the island is out of scope**, and so is anything administered
#      there. The population figure in data/countries/CY.yml is on the same basis.
#   7. Nowhere does this file state "11", "12" or "17". All three are derived from the
#      entities below.

country: CY
cabinet_id: CY-2023-03-01

cabinet_name_original: Κυβέρνηση Νίκου Χριστοδουλίδη
cabinet_name_en: Government of Nikos Christodoulides
cabinet_name_es: Gobierno de Nikos Christodoulides

head_of_government_title_original: Πρόεδρος της Δημοκρατίας
head_of_government_title_en: President of the Republic

took_office: 2023-03-01
left_office: null

methodology_notes:
  - en: >-
      Three figures, and it matters which is published. Eleven ministries. Twelve seats in
      the Council of Ministers. Seventeen departments, if the six Deputy Ministries were
      counted as ministries. The eleven are the departments listed in the Republic's own
      ceremonial precedence order, recorded here in that order, each headed by a Υπουργός
      (Minister). The twelve seats are those eleven ministers plus the President of the
      Republic, who heads no department; the Vice-Presidency is a thirteenth seat that has
      been vacant since 1964 and therefore contributes nothing. The seventeen would be the
      eleven plus the six Υφυπουργεία (Deputy Ministries) — Shipping, Tourism, Research,
      Innovation and Digital Policy, Social Welfare, Culture, and Migration and International
      Protection — which are real departments but are not headed by ministers. The reasoning
      is set out in the next note. The Republic's own portal states the first figure without
      qualification: "the President of the Republic appoints eleven Ministers, who constitute
      the Council of Ministers of the state". These figures answer different questions and
      this page never adds them.
    es: >-
      Tres cifras, e importa cuál se publica. Once ministerios. Doce asientos en el Consejo de
      Ministros. Diecisiete departamentos, si se contaran como ministerios los seis
      Υφυπουργεία (Viceministerios). Los once son los departamentos que figuran en el orden de
      precedencia ceremonial de la propia República, recogidos aquí en ese orden, cada uno
      encabezado por un Υπουργός (ministro). Los doce asientos son esos once ministros más el
      Presidente de la República, que no encabeza ningún departamento; la Vicepresidencia es
      un decimotercer asiento vacante desde 1964 y por tanto no aporta nada. Los diecisiete
      serían los once más los seis Υφυπουργεία — Marina Mercante, Turismo, Investigación,
      Innovación y Política Digital, Bienestar Social, Cultura, y Migración y Protección
      Internacional —, que son departamentos reales pero no están encabezados por ministros.
      El razonamiento está en la nota siguiente. El propio portal de la República enuncia la
      primera cifra sin matices: «el Presidente de la República nombra once ministros, que
      constituyen el Consejo de Ministros del Estado». Estas cifras responden a preguntas
      distintas y esta ficha nunca las suma.

  - en: >-
      The Deputy Ministries, and why they are recorded but not counted. This is the hardest
      call in the Cypriot file, and the honest position is that it is close. Cyprus has six
      Υφυπουργεία, each created by its own statute: Shipping (law 123(I)/2017), Tourism
      (123(I)/2018), Research, Innovation and Digital Policy (14(I)/2020), Social Welfare
      (89(I)/2021), Culture (55(I)/2022) and Migration and International Protection
      (23(I)/2024). They are not units inside a ministry. Each is a free-standing central
      department with its own director-general, its own budget vote submitted through the
      Minister of Finance, and its own subordinate departments; the government's own website
      directory groups them alongside the eleven ministries. On this project's criteria
      they satisfy the first (central government) and the third (named in an
      official source) without difficulty. They fail the second, and they fail it on the
      words of the statutes that created them rather than on our reading. The head of each is
      a Υφυπουργός παρά τω Προέδρω — a Deputy Minister *to the President* — not a Υπουργός,
      and Cypriot law keeps the two ranks apart throughout. Every one of the six constitutive
      laws contains the same provision: the Deputy Minister may submit proposals to the
      Council of Ministers and attend its sittings on matters within his competence, "χωρίς
      να συμμετέχει στη διαδικασία λήψης αποφάσεων" — without taking part in the
      decision-making process (article 12 of 123(I)/2017, article 11 of 123(I)/2018, article
      11 of 14(I)/2020, article 11 of 89(I)/2021, article 19 of 55(I)/2022, article 14 of
      23(I)/2024). The Constitution reinforces it from the other direction: article 46
      composes the Council of Ministers of ministers only, and the word υφυπουργός does not
      appear anywhere in the constitutional text. So a Deputy Minister has no vote and no
      seat, and the six are recorded here without a cabinet seat, excluded as junior
      ministers or state secretaries. That reason understates them, and the
      understatement should be visible: unlike a Spanish secretario de Estado or a Greek
      υφυπουργός, a Cypriot Deputy Minister heads a whole department rather than working
      inside someone else's. A reader who thinks the departmental character should win over
      the rank has the other figure, seventeen, stated in the note above and can recompute
      from the list below. What this project will not do is publish one figure while implying
      the other.
    es: >-
      Los Viceministerios, y por qué se registran pero no se cuentan. Es la decisión más
      difícil de la ficha chipriota, y lo honesto es reconocer que está reñida. Chipre tiene
      seis Υφυπουργεία, cada uno creado por su propia ley: Marina Mercante (ley 123(I)/2017),
      Turismo (123(I)/2018), Investigación, Innovación y Política Digital (14(I)/2020),
      Bienestar Social (89(I)/2021), Cultura (55(I)/2022) y Migración y Protección
      Internacional (23(I)/2024). No son unidades dentro de un ministerio. Cada uno es un
      departamento central autónomo, con su director general, su propia partida
      presupuestaria presentada a través del ministro de Hacienda y sus propios departamentos
      subordinados; el directorio web del propio Gobierno los agrupa junto a los once
      ministerios. Con los criterios de este proyecto cumplen sin dificultad el primero
      (gobierno central) y el tercero (nombrados en fuente oficial). Incumplen el segundo, y
      lo incumplen por el texto de las leyes que los crearon, no por nuestra lectura. Al
      frente de cada uno hay un Υφυπουργός παρά τω Προέδρω —un viceministro *ante el
      Presidente*—, no un Υπουργός, y el derecho chipriota mantiene separados ambos rangos.
      Las seis leyes constitutivas contienen la misma disposición: el viceministro puede
      presentar propuestas al Consejo de Ministros y asistir a sus sesiones en los asuntos de
      su competencia, «χωρίς να συμμετέχει στη διαδικασία λήψης αποφάσεων» —sin participar en
      el proceso de toma de decisiones— (artículo 12 de 123(I)/2017, artículo 11 de
      123(I)/2018, artículo 11 de 14(I)/2020, artículo 11 de 89(I)/2021, artículo 19 de
      55(I)/2022, artículo 14 de 23(I)/2024). La Constitución lo refuerza desde el otro lado:
      el artículo 46 compone el Consejo de Ministros solo de ministros, y la palabra
      υφυπουργός no aparece en ningún lugar del texto constitucional. Así que un viceministro
      no tiene voto ni asiento, y los seis se registran aquí sin asiento en el gabinete,
      excluidos como secretarios de Estado o ministros júnior. Ese motivo se queda corto,
      y conviene que se vea: a diferencia de un secretario de Estado español o de un
      υφυπουργός griego, el viceministro chipriota encabeza un departamento entero en lugar de
      trabajar dentro del de otro. Quien considere que debe primar el carácter departamental
      sobre el rango tiene la otra cifra, diecisiete, en la nota anterior y puede recalcularla
      con la lista de abajo. Lo que este proyecto no hará es publicar una cifra insinuando la
      otra.

  - en: >-
      A cost of that decision, stated plainly because it distorts the comparison views.
      Because the six Deputy Ministries are not counted, six policy areas that Cyprus does
      run as free-standing departments register as *absent* in the country × policy-area
      matrix: shipping, tourism, culture, research, innovation and digital, social affairs,
      and migration. Cyprus therefore appears in those columns as a government with no
      dedicated department, when in fact it has one — headed by a Deputy Minister rather than
      a Minister. Tagging policy areas onto uncounted entities would not fix it: the matrix is
      built from counted ministries only, and excluded bodies never carry policy-area
      tags. A reader comparing Cyprus on tourism or shipping should read this note
      first, and should treat a zero in those cells as "no ministry", not as "no department".
    es: >-
      Un coste de esa decisión, dicho sin rodeos porque distorsiona las vistas comparativas.
      Como los seis Viceministerios no se cuentan, seis áreas de política que Chipre sí
      gestiona con departamentos propios aparecen como *ausentes* en la matriz país × área:
      marina mercante, turismo, cultura, investigación, innovación y digitalización, asuntos
      sociales y migración. Chipre figura por tanto en esas columnas como un gobierno sin
      departamento dedicado cuando en realidad tiene uno, encabezado por un viceministro y no
      por un ministro. Etiquetar áreas en entidades no contadas no lo arreglaría: la matriz se
      construye solo con los ministerios contados, y los órganos excluidos nunca llevan
      etiquetas de área. Quien compare a Chipre en turismo o marina mercante debería leer
      antes esta nota, y entender un cero en esas celdas como «ningún ministerio», no como
      «ningún departamento».

  - en: >-
      The 1964 vacancies: the Vice-Presidency and the Turkish Cypriot ministers. The 1960
      Constitution is bicommunal by design. Article 46 provides that the President and the
      Vice-President of the Republic "have a Council of Ministers composed of seven Greek
      ministers and three Turkish ministers", that the ministers are designated by the
      President and the Vice-President respectively and appointed by an instrument signed by
      both, and that one of the ministries of foreign affairs, defence or finance is assigned
      to a Turkish minister. Article 36 makes the President the Head of the State and the
      Vice-President the Deputy Head of the State. In 1964 the Turkish Cypriot Vice-President
      and the three Turkish Cypriot ministers withdrew from the government, and none of those
      posts has been filled since. Two consequences are recorded here, and a third is
      deliberately not. First, the Vice-Presidency is recorded as an entity
      with a cabinet seat but no holder — the constitutional post exists, nobody
      holds it, and the seat count therefore adds nothing for it. That is how any vacant
      seat is recorded, and it is why the seat figure is twelve
      rather than thirteen. Second, the article 46 numbers no longer describe the government:
      under the law of necessity the President alone appoints the ministers, and there are
      eleven ministries rather than the constitutional ten. Third — and this is the thing not
      done — no phantom entities have been created for "three Turkish Cypriot ministries". No
      official source identifies any such department today. The Republic's own portal is
      explicit that since 1964 the government "has been functioning by necessity only with
      Greek Cypriots in all ministries, which have been subsequently increased to eleven": the
      eleven *are* the Council of Ministers, and they include the department that would
      constitutionally have gone to a Turkish Cypriot minister. Inventing three vacant
      ministries alongside the eleven would have double-counted the same posts and fabricated
      structure that no instrument describes.
    es: >-
      Las vacantes de 1964: la Vicepresidencia y los ministros turcochipriotas. La
      Constitución de 1960 es bicomunal por diseño. El artículo 46 dispone que el Presidente y
      el Vicepresidente de la República «tienen un Consejo de Ministros compuesto por siete
      ministros griegos y tres ministros turcos», que los ministros son designados
      respectivamente por el Presidente y el Vicepresidente y nombrados por acto firmado por
      ambos, y que uno de los ministerios de asuntos exteriores, defensa o hacienda se asigna
      a un ministro turco. El artículo 36 hace del Presidente el Jefe del Estado y del
      Vicepresidente el Subjefe del Estado. En 1964 el Vicepresidente turcochipriota y los
      tres ministros turcochipriotas se retiraron del gobierno, y ninguno de esos cargos se ha
      cubierto desde entonces. Aquí se registran dos consecuencias, y deliberadamente no una
      tercera. Primera: la Vicepresidencia se registra como entidad con
      asiento en el gabinete pero sin titular —el cargo constitucional existe, nadie lo
      ocupa, y por tanto el recuento de asientos no le suma nada—. Así se registra toda
      vacante de asiento, y explica que la cifra de asientos sea doce y no
      trece. Segunda: los números del artículo 46 ya no describen al gobierno: por el derecho
      de necesidad el Presidente nombra solo a los ministros, y hay once ministerios en lugar
      de los diez constitucionales. Tercera —y esto es lo que no se ha hecho—: no se han
      creado entidades fantasma para «tres ministerios turcochipriotas». Ninguna fuente
      oficial identifica hoy tal departamento. El propio portal de la República es explícito:
      desde 1964 el gobierno «ha venido funcionando por necesidad solo con grecochipriotas en
      todos los ministerios, que se han incrementado posteriormente a once». Los once *son* el
      Consejo de Ministros, e incluyen el departamento que constitucionalmente habría
      correspondido a un ministro turcochipriota. Inventar tres ministerios vacantes junto a
      los once habría contado dos veces los mismos cargos y fabricado una estructura que
      ningún instrumento describe.

  - en: >-
      Perimeter: which Cyprus this page describes. The Republic of Cyprus does not exercise
      effective control over the northern part of the island. The administrative structures
      operating there are not organs of the Republic, they are not established by its laws,
      their heads are not appointed by its President, and they are out of scope for this
      project, which records the departments of a state's central executive. Nothing in the
      entity list below refers to them, and no figure on this page or on the
      country page includes them: the population figure on the country page is the
      Statistical Service's estimate for the government-controlled area, which is the only
      basis on which the Republic publishes population data, and the source note says so. This
      is a scope statement about what the data covers, not a position on the political
      question.
    es: >-
      Perímetro: de qué Chipre habla esta ficha. La República de Chipre no ejerce control
      efectivo sobre la parte norte de la isla. Las estructuras administrativas que operan
      allí no son órganos de la República, no están creadas por sus leyes, sus titulares no
      son nombrados por su Presidente y quedan fuera del alcance de este proyecto,
      que registra los departamentos del ejecutivo central de un Estado. Nada de la lista de
      entidades de abajo se refiere a ellas, y ninguna cifra de esta ficha ni de la
      ficha de país las incluye: la población de la ficha de país es la estimación de
      la Servicio de Estadística para el área bajo control del Gobierno, única base sobre la
      que la República publica datos de población, y la nota de la fuente lo indica. Es una
      delimitación de alcance sobre lo que cubren los datos, no una posición sobre la cuestión
      política.

  - en: >-
      A presidency, not a premiership, and what that does to the seat count. European
      states ordinarily separate the head of state from the head of government. Cyprus
      does not: under articles 36 and 46 of the Constitution the President of the Republic is
      the Head of the State and, with no prime minister in the constitutional order, also the
      head of the executive. He presides over the Council of Ministers, and the ministers hold
      office at his pleasure. He is therefore recorded here as an entity with
      a cabinet seat but not as a ministry, excluded as the office of the head of
      government — the same treatment as a prime minister's office elsewhere,
      because he occupies the same position in the structure: the apex of the cabinet rather
      than a portfolio department. Two caveats a careful reader will want. First, on a strict
      reading of article 46 the President is not a *member* of the Council of Ministers: the
      text says the President and the Vice-President "have" a Council of Ministers composed of
      the ministers. This page follows the project's uniform convention of giving the head of
      government a seat, because doing otherwise would make Cyprus's seat figure mean
      something different from every other country's. Second, excluding him instead as
      head-of-state was considered and rejected: that ground applies "where
      distinct from the head of government", and in Cyprus the two offices are the same
      person.
    es: >-
      Una presidencia, no una jefatura de gobierno, y qué implica para el recuento de
      asientos. Los Estados europeos separan por lo general al jefe del Estado del jefe
      del gobierno. Chipre no: conforme a los artículos 36 y 46 de la Constitución, el
      Presidente de la República es el Jefe del Estado y, al no existir primer ministro en el
      orden constitucional, también el jefe del ejecutivo. Preside el Consejo de Ministros, y
      los ministros ocupan el cargo mientras él quiera. Por eso se registra aquí como entidad
      con asiento en el gabinete pero no como ministerio, excluida como oficina del jefe
      de gobierno —el mismo tratamiento que la oficina de un primer ministro en
      otros países, porque ocupa el mismo lugar en la estructura: la cúspide del gabinete y no
      un departamento con cartera—. Dos matices para el lector atento. Primero: en una lectura
      estricta del artículo 46 el Presidente no es *miembro* del Consejo de Ministros, pues el
      texto dice que el Presidente y el Vicepresidente «tienen» un Consejo de Ministros
      compuesto por los ministros. Esta ficha sigue la convención uniforme del proyecto de
      dar asiento al jefe de gobierno, porque lo contrario haría que la cifra de asientos de
      Chipre significara algo distinto de la de los demás países. Segundo: se consideró y
      descartó excluirlo como jefatura del Estado, motivo que se aplica «cuando es
      distinto del jefe de gobierno», y en Chipre ambos cargos son la misma persona.

  - en: >-
      Why this cabinet is dated 1 March 2023, and why reshuffles have not restarted it. In a
      presidential republic the government does not fall and re-form the way a parliamentary
      one does: there is no investiture vote and no confidence relationship with the House of
      Representatives, and the President's five-year term runs to 2028. Two dates were
      candidates. Nikos Christodoulides won the second round of the presidential election on
      12 February 2023 and assumed office before a special sitting of the House on 28
      February 2023; the members of his Council of Ministers were sworn in at the Presidential
      Palace on Wednesday 1 March 2023. This page takes the second, because the unit of this
      project is a cabinet rather than a presidential term, and 1 March 2023 is the day the
      eleven ministers took office. The government has been reshuffled repeatedly since —
      among others the Ministers of Defence, Energy, Commerce and Industry, Agriculture,
      Labour, Justice and Health have all changed hands, the last two in a reshuffle of 8
      December 2025 — and one Deputy Ministry and one Deputy Minister post have been created.
      None of that created a new government: no new cabinet was appointed, so the date the
      cabinet took office remains 1 March 2023 and no end date is recorded. Officeholders'
      names are not recorded by this project, which curates departments and posts; the
      mid-term creations are recorded with their own start dates, which is how the structure
      stays replayable.
    es: >-
      Por qué este gabinete se fecha el 1 de marzo de 2023 y por qué las remodelaciones no lo
      han reiniciado. En una república presidencial el gobierno no cae ni se rehace como en
      una parlamentaria: no hay voto de investidura ni relación de confianza con la Cámara de
      Representantes, y el mandato quinquenal del Presidente llega hasta 2028. Había dos
      fechas candidatas. Nikos Christodoulides ganó la segunda vuelta de las elecciones
      presidenciales el 12 de febrero de 2023 y asumió el cargo ante una sesión especial de la
      Cámara el 28 de febrero de 2023; los miembros de su Consejo de Ministros prestaron
      juramento en el Palacio Presidencial el miércoles 1 de marzo de 2023. Esta ficha toma
      la segunda, porque la unidad de este proyecto es un gabinete y no un mandato
      presidencial, y el 1 de marzo de 2023 es el día en que los once ministros asumieron. El
      gobierno se ha remodelado repetidamente desde entonces —entre otros han cambiado de
      titular Defensa, Energía, Comercio e Industria, Agricultura, Trabajo, Justicia y Sanidad,
      los dos últimos en una remodelación del 8 de diciembre de 2025— y se han creado un
      Viceministerio y un puesto de viceministro. Nada de ello creó un gobierno nuevo: no se
      nombró un gabinete nuevo, de modo que la fecha de toma de posesión sigue siendo el 1 de
      marzo de 2023 y no se registra fecha de cese. Este proyecto no registra nombres de
      titulares, sino departamentos y cargos; las creaciones a mitad de legislatura se
      registran con su propia fecha de inicio, que es lo que mantiene reconstruible la
      estructura.

  - en: >-
      Two posts that move with the calendar, and one that lapses on 31 July 2026.
      The Deputy Ministry of Migration and International Protection did not exist when this
      cabinet took office: law 23(I)/2024 was published on 15 March 2024 and the Minister of
      the Interior fixed 17 June 2024 as its commencement date by notification Κ.Δ.Π.
      203/2024, so that entity is recorded with 17 June 2024 as its start date. The Deputy Minister to the
      President for European Affairs is stranger still. The post was created by law
      119(I)/2023 (Official Gazette 4968 of 1 December 2023), which is expressly a law of
      "Προσωρινές Διατάξεις" — temporary provisions — enacted for Cyprus's Presidency of the
      Council of the European Union in the first half of 2026, and whose article 9 provides
      that the Law commences on a date fixed by the Council of Ministers and "λήγει την 31η
      Ιουλίου 2026", expires on 31 July 2026. The entity is therefore recorded
      with 31 July 2026 as its end date. It was still in place on the access date, two days
      before that expiry, so it appears in the current snapshot; from 1 August 2026 it drops
      out, and this country's totals of recorded and excluded bodies will fall by one while
      the published ministry and seat counts stay put. That is a consequence of recording
      posts with their legal end dates, not a defect. Its start date is set to 1 December
      2023, the date the law was published, which is the earliest date the post could exist;
      the Council of Ministers decision actually bringing the law into force is published in
      the Gazette's fourth annex and could not be located.
    es: >-
      Dos cargos que se mueven con el calendario, y uno que caduca el 31 de julio de
      2026. El Viceministerio de Migración y Protección Internacional no existía
      cuando este gabinete asumió: la ley 23(I)/2024 se publicó el 15 de marzo de 2024 y el
      ministro del Interior fijó el 17 de junio de 2024 como fecha de entrada en vigor
      mediante la notificación Κ.Δ.Π. 203/2024, de modo que esa entidad se registra con
      fecha de inicio el 17 de junio de 2024. El viceministro ante el Presidente para Asuntos Europeos es
      aún más curioso. El cargo fue creado por la ley 119(I)/2023 (Boletín Oficial 4968 de 1
      de diciembre de 2023), que es expresamente una ley de «Προσωρινές Διατάξεις»
      —disposiciones temporales— aprobada para la Presidencia chipriota del Consejo de la Unión
      Europea en el primer semestre de 2026, y cuyo artículo 9 dispone que la ley entra en
      vigor en la fecha que fije el Consejo de Ministros y «λήγει την 31η Ιουλίου 2026»,
      expira el 31 de julio de 2026. La entidad se registra por tanto con el 31 de julio de
      2026 como fecha de fin. Seguía vigente en la fecha de consulta, dos días antes de esa
      expiración, así que aparece en la foto actual; desde el 1 de agosto de 2026 desaparece,
      y las cifras de órganos registrados y excluidos de este país bajarán en uno mientras
      las cifras publicadas de ministerios y asientos no se mueven. Es la consecuencia de
      registrar los cargos con sus fechas legales de fin, no un defecto. Su fecha de inicio
      se fija en el 1 de diciembre de 2023, fecha de publicación de la ley, que es la más
      temprana en que el cargo podía existir; la decisión del Consejo de Ministros que
      efectivamente puso la ley en vigor se publica en el cuarto anexo del Boletín y no
      pudo localizarse.

  - en: >-
      Why Cyprus is graded B and cannot honestly be graded A. Grade A requires every counted
      ministry to rest on a tier-1 legal instrument, and Cyprus has no instrument that
      enumerates its ministries. There is nothing here like Spain's Real Decreto 829/2023 or
      Greece's precedence decision Υ 1: the consolidated-legislation index of Cypriot law
      contains no "law on ministries", and departments are created, renamed and split one at a
      time. Five of the eleven do rest on a legal instrument and are cited to one. Foreign
      affairs, defence and finance are named in article 46 of the Constitution itself, which is
      why they are the three the Constitution reserves rotation over. Education, Sport and
      Youth rests on law 56(I)/2022, which renamed it when culture left for the new Deputy
      Ministry, and Energy, Commerce and Industry on law 151(I)/2018, which renamed it when
      tourism left for the same reason. For the remaining six — Interior, Transport,
      Communications and Works, Agriculture, Rural Development and Environment, Labour and
      Social Insurance, Justice and Public Order, and Health — no constituting or renaming
      instrument in force could be found. Interior, Transport and Health appear never to have
      been renamed by statute at all: they have carried their names since independence and no
      Cypriot law names them as departments. They therefore rest on tier 2, the Republic's own
      portal and the Press and Information Office's precedence list, and the grade follows.
      One further piece of provenance a reader is entitled to. The gazette PDFs cited at tier 1
      are the Official Gazette's own typeset pages, carrying its "Ε.Ε. Παρ. Ι(Ι)" masthead,
      issue number, date and pagination — but they are served from cylaw.org, the Pancyprian
      Bar Association's legislation service, because the Government Printing Office's online
      gazette does not reach back to the years in question. The tier reflects what the document
      is; the URL and every source note disclose whose copy it is. The Constitution itself is
      cited from the House of Representatives, an organ of the Republic, and not from cylaw.
    es: >-
      Por qué Chipre recibe grado B y no puede recibir honestamente un A. El grado A exige que
      todos los ministerios contados se apoyen en un instrumento jurídico de nivel 1, y Chipre
      no tiene ningún instrumento que enumere sus ministerios. Aquí no hay nada equivalente al
      Real Decreto 829/2023 español ni a la decisión de precedencia Υ 1 griega: el índice de
      legislación consolidada chipriota no contiene ninguna «ley de ministerios», y los
      departamentos se crean, renombran y escinden de uno en uno. Cinco de los once sí se
      apoyan en un instrumento jurídico y se citan a uno. Asuntos Exteriores, Defensa y
      Hacienda están nombrados en el propio artículo 46 de la Constitución, que es la razón por
      la que son los tres sobre los que la Constitución reserva la rotación. Educación, Deporte
      y Juventud se apoya en la ley 56(I)/2022, que lo renombró cuando la cultura pasó al nuevo
      Viceministerio, y Energía, Comercio e Industria en la ley 151(I)/2018, que lo renombró
      cuando el turismo salió por el mismo motivo. Para los seis restantes —Interior,
      Transportes, Comunicaciones y Obras, Agricultura, Desarrollo Rural y Medio Ambiente,
      Trabajo y Seguros Sociales, Justicia y Orden Público, y Sanidad— no se encontró
      instrumento vigente de creación o cambio de nombre. Interior, Transportes y Sanidad
      parecen no haber sido renombrados nunca por ley: llevan sus nombres desde la
      independencia y ninguna ley chipriota los nombra como departamentos. Se apoyan por tanto
      en nivel 2, el portal de la propia República y la lista de precedencia del Gabinete de
      Prensa e Información, y el grado se sigue de ello. Una precisión más de procedencia a la
      que el lector tiene derecho. Los PDF de boletín citados en nivel 1 son las páginas
      compuestas del propio Boletín Oficial, con su cabecera «Ε.Ε. Παρ. Ι(Ι)», número de
      ejemplar, fecha y paginación, pero se sirven desde cylaw.org, el servicio de legislación
      del Colegio de Abogados Panchipriota, porque el boletín en línea del Tipografía
      Gubernamental no alcanza a esos años. El nivel refleja qué es el documento; la URL y cada
      nota de fuente revelan de quién es la copia. La Constitución se cita de la Cámara de
      Representantes, órgano de la República, y no de cylaw.

  - en: >-
      Names, and where each language's version comes from. The Greek names are the official
      ones, taken from the Republic's own directory of ministries and deputy ministries and
      matching the statutes. The English names are the government's own — gov.cy publishes an
      English edition that names every department — so all of them are marked as the
      government's names rather than as this project's translations, which few governments
      make possible. The Spanish names are this project's translations. Three details. The Republic's own
      English is not internally consistent about the deputy ministries: five are "Deputy
      Ministry of X" but the shipping one is published as "Shipping Deputy Ministry", and that
      is recorded as it is published rather than tidied up. Cyprus's own Greek is not quite
      consistent either: the justice department appears as Υπουργείο Δικαιοσύνης και Δημοσίας
      Τάξεως in the statute that renamed it (20(I)/1993), in the Press and Information Office's
      precedence list and in the government's website directory, but as Δημόσιας Τάξεως on the
      Presidency's composition page; the statutory spelling is used here. And Υπουργείο
      Εσωτερικών is translated "Ministry of the Interior" but is not the police ministry:
      policing and public order belong to the Ministry of Justice and Public Order, which is
      why that ministry, and not Εσωτερικών, carries the interior policy area — the same
      pattern as Greece.
    es: >-
      Los nombres, y de dónde sale la versión en cada idioma. Los nombres griegos son los
      oficiales, tomados del directorio de ministerios y viceministerios de la propia República
      y coincidentes con las leyes. Los nombres en inglés son los del propio Gobierno —gov.cy
      publica una edición inglesa que nombra cada departamento—, así que todos se señalan
      como nombres del propio Gobierno y no como traducciones de este proyecto, algo que
      pocos gobiernos hacen posible. Los nombres en español son traducciones de este proyecto.
      Tres detalles. El inglés de la propia República no es internamente coherente con los
      viceministerios: cinco son «Deputy Ministry of X» pero el de marina mercante se publica
      como «Shipping Deputy Ministry», y así se registra, sin corregirlo. El griego de Chipre
      tampoco es del todo coherente: el departamento de justicia aparece como Υπουργείο
      Δικαιοσύνης και Δημοσίας Τάξεως en la ley que lo renombró (20(I)/1993), en la lista de
      precedencia del Gabinete de Prensa e Información y en el directorio web del Gobierno,
      pero como Δημόσιας Τάξεως en la página de composición de la Presidencia; aquí se usa la
      grafía legal. Y Υπουργείο Εσωτερικών se traduce «Ministerio del Interior» pero no es el
      ministerio de la policía: la policía y el orden público corresponden al Ministerio de
      Justicia y Orden Público, y por eso ese ministerio, y no Εσωτερικών, lleva el área de
      interior —el mismo patrón que en Grecia—.

  - en: >-
      Posts on the government's composition page that are deliberately absent from this page.
      The Presidency publishes, alongside the President, the eleven ministers and the eight
      deputy ministers, three further officials: the Government Spokesman, the Deputy
      Government Spokesman and the Secretary of the Council of Ministers. None is recorded
      here, because none moves either published figure: none heads a ministry and none holds a
      seat — the Secretary of the Council of Ministers is a civil servant who services the
      Council, and the spokesmen are appointed officials without departments. The same
      reasoning excludes the five Commissioners sworn in with the government (for the
      Presidency, the Environment, the Citizen, Gender Equality and the Development of
      Mountain Communities), which are offices attached to the Presidency rather than
      departments of the executive. A source that answers "how large is the Cypriot
      government?" with a number in the twenties is counting some of these; it is not wrong, it
      is answering a different question.
    es: >-
      Cargos que figuran en la página de composición del Gobierno y están deliberadamente
      ausentes de esta ficha. La Presidencia publica, junto al Presidente, los once ministros
      y los ocho viceministros, tres funcionarios más: el Portavoz del Gobierno, el Portavoz
      adjunto y el Secretario del Consejo de Ministros. Ninguno se registra aquí, porque
      ninguno mueve ninguna de las dos cifras publicadas: ninguno encabeza un ministerio y
      ninguno tiene asiento —el Secretario del Consejo de Ministros es un funcionario que
      asiste al Consejo, y los portavoces son cargos designados sin departamento—. El mismo
      razonamiento excluye a los cinco Comisionados que juraron con el Gobierno (de la
      Presidencia, del Medio Ambiente, del Ciudadano, de Igualdad de Género y de Desarrollo de
      las Comunidades de Montaña), que son oficinas adscritas a la Presidencia y no
      departamentos del ejecutivo. Una fuente que responde «¿de qué tamaño es el Gobierno
      chipriota?» con una cifra de veintitantos está contando algunos de estos: no se equivoca,
      responde a otra pregunta.

sources:
  - id: syntagma-1960
    tier: 1
    type: statute
    publisher: Κυπριακή Δημοκρατία — Βουλή των Αντιπροσώπων
    title: >-
      Το Σύνταγμα της Κυπριακής Δημοκρατίας (1960), ενοποιημένο κείμενο με τους περί
      Τροποποιήσεως του Συντάγματος Νόμους — ΑΡΘΡΟΝ 46
    url: https://www.parliament.cy/images/media/redirectfile/2-%CE%A3%CE%A5%CE%9D%CE%A4%CE%91%CE%93%CE%9C%CE%91%20%CE%A4%CE%97%CE%A3%20%CE%9A%CE%A5%CE%A0%CE%A1%CE%99%CE%91%CE%9A%CE%97%CE%A3%20%CE%94%CE%97%CE%9C%CE%9F%CE%9A%CE%A1%CE%91%CE%A4%CE%99%CE%91%CE%A3%20(1).pdf
    archive_url: https://web.archive.org/web/20250907015043/https://www.parliament.cy/images/media/redirectfile/2-%CE%A3%CE%A5%CE%9D%CE%A4%CE%91%CE%93%CE%9C%CE%91%20%CE%A4%CE%97%CE%A3%20%CE%9A%CE%A5%CE%A0%CE%A1%CE%99%CE%91%CE%9A%CE%97%CE%A3%20%CE%94%CE%97%CE%9C%CE%9F%CE%9A%CE%A1%CE%91%CE%A4%CE%99%CE%91%CE%A3%20(1).pdf
    lang: el
    published: null
    accessed: 2026-07-28
    quote: >-
      Η εκτελεστική εξουσία διασφαλίζεται υπό του Προέδρου και του Αντιπροέδρου της
      Δημοκρατίας. Ο Πρόεδρος και ο Αντιπρόεδρος της Δημοκρατίας προς τον σκοπόν της
      διασφαλίσεως της εκτελεστικής εξουσίας έχουσιν Υπουργικόν Συμβούλιον αποτελούμενον εξ
      επτά ελλήνων υπουργών και εκ τριών τούρκων υπουργών. Οι υπουργοί υποδεικνύονται
      αντιστοίχως υπό του Προέδρου και του Αντιπροέδρου της Δημοκρατίας, οίτινες διορίζουσι
      τούτους διά πράξεως υπογραφομένης υπό αμφοτέρων. Οι υπουργοί δύνανται να επιλέγωνται
      και εκτός της Βουλής των Αντιπροσώπων. Εν εκ των κάτωθι υπουργείων, ήτοι το υπουργείον
      των εξωτερικών, το υπουργείον αμύνης ή το υπουργείον των οικονομικών ανατίθεται εις
      τούρκον υπουργόν. Εάν ο Πρόεδρος και ο Αντιπρόεδρος της Δημοκρατίας συμφωνώσι, δύνανται
      ν’ αντικαταστήσωσι το σύστημα τούτο διά συστήματος εναλλαγής εκ περιτροπής. Το
      Υπουργικόν Συμβούλιον ασκεί εκτελεστικήν εξουσίαν κατά τα εν άρθρω 54 οριζόμενα.
    note: >-
      Article 46 in full, from the consolidated text of the Constitution published by the
      House of Representatives — an organ of the Republic, deliberately preferred to the
      private legislation databases for the constitutional text. This is the closest thing
      Cyprus has to an instrument constituting its executive, and it is the source for four
      things in this file: that executive power is vested jointly in the President and the
      Vice-President; that the Council of Ministers is composed of ministers only, seven
      Greek and three Turkish, with no mention anywhere in the Constitution of a υφυπουργός;
      that the ministries of foreign affairs, defence and finance exist and one of them is
      reserved to a Turkish Cypriot minister; and that decisions are taken by absolute
      majority. Note what it does *not* do: it enumerates no other ministry, which is why
      this country cannot be graded A. Article 46 has never been amended — the consolidated
      text carries amendment annotations against articles 41, 4, 7Α, 12, 16, 18 and others,
      and none against 46 — so the seven-plus-three composition it prescribes is still the
      formal law, superseded in practice by the law of necessity since 1964. The quote is
      verbatim and continuous except that a page number ("29") falls inside the article in
      the PDF's layout between the first and second paragraphs and is omitted; that is the
      one probe a citation checker will fail on this source.

  - id: pio-diaveveosi-2023-03-01
    tier: 2
    type: government_website
    publisher: Κυπριακή Δημοκρατία — Γραφείο Τύπου και Πληροφοριών
    title: >-
      Ανακοινωθέν: Τελετή διαβεβαίωσης των μελών του νέου Υπουργικού Συμβουλίου και άλλων
      αξιωματούχων και ανάληψη του χαρτοφυλακίου από τους προκατόχους τους - 1η Μαρτίου 2023
    url: https://www.pio.gov.cy/%CE%B1%CE%BD%CE%B1%CE%BA%CE%BF%CE%B9%CE%BD%CF%89%CE%B8%CE%AD%CE%BD%CF%84%CE%B1-%CE%AC%CF%81%CE%B8%CF%81%CE%BF.html?id=33107
    archive_url: https://web.archive.org/web/20230403215833/https://www.pio.gov.cy/%CE%B1%CE%BD%CE%B1%CE%BA%CE%BF%CE%B9%CE%BD%CF%89%CE%B8%CE%AD%CE%BD%CF%84%CE%B1-%CE%AC%CF%81%CE%B8%CF%81%CE%BF.html?id=33107
    lang: el
    published: 2023-02-24
    accessed: 2026-07-28
    quote: >-
      Τελετή διαβεβαίωσης των μελών του νέου Υπουργικού Συμβουλίου και άλλων αξιωματούχων και
      ανάληψη του χαρτοφυλακίου από τους προκατόχους τους - 1η Μαρτίου 2023 Η τελετή
      διαβεβαίωσης θα λάβει χώρα στην Αίθουσα Εκδηλώσεων του Προεδρικού Μεγάρου, την Τετάρτη,
      1 η Μαρτίου 2023 και ώρα 10π.μ. Κατά την τελετή, ο Διευθυντής Εθιμοτυπίας θα
      ανακοινώσει, με βάση την ισχύουσα εθιμοταξική σειρά, τα ονόματα των Υπουργών, ως
      ακολούθως: 1. Υπουργός Εξωτερικών 2. Υπουργός Οικονομικών 3. Υπουργός Εσωτερικών 4.
      Υπουργός Άμυνας 5. Υπουργός Παιδείας, Αθλητισμού και Νεολαίας 6. Υπουργός Μεταφορών,
      Επικοινωνιών και Έργων 7. Υπουργός Ενέργειας, Εμπορίου και Βιομηχανίας 8. Υπουργός
      Γεωργίας, Αγροτικής Ανάπτυξης και Περιβάλλοντος 9. Υπουργός Εργασίας και Κοινωνικών
      Ασφαλίσεων 10. Υπουργός Δικαιοσύνης και Δημοσίας Τάξεως 11. Υπουργός Υγείας Μετά το
      πέρας της διαβεβαίωσης των νέων Υπουργών, ο Διευθυντής Εθιμοτυπίας θα ανακοινώσει τα
      ονόματα των ακόλουθων Αξιωματούχων: 1. Κυβερνητικός Εκπρόσωπος 2. Υφυπουργός παρά τω
      Προέδρω 3. Υφυπουργός Ναυτιλίας παρά τω Προέδρω 4. Υφυπουργός Τουρισμού παρά τω Προέδρω
      5. Υφυπουργός Έρευνας, Καινοτομίας και Ψηφιακής Πολιτικής παρά τω Προέδρω 6. Υφυπουργός
      Κοινωνικής Πρόνοιας παρά τω Προέδρω 7. Υφυπουργός Πολιτισμού παρά τω Προέδρω
    note: >-
      The most useful single document in this file, and it does two jobs. It is the source for
      `took_office`: it announces that the members of the new Council of Ministers were sworn
      in at the Presidential Palace on Wednesday 1 March 2023. And, because Cyprus publishes
      no gazette list of ministries, it is the source for the *order* of the entities below:
      the Director of Protocol announces the ministers "με βάση την ισχύουσα εθιμοταξική
      σειρά", according to the applicable order of precedence, and that order — foreign
      affairs, finance, interior, defence, education, transport, energy, agriculture, labour,
      justice, health — is the order used here. It is the same order in which the Presidency's
      composition page and the government's website directory list the eleven, three years
      later, so the sequence is stable and not an artefact of one document. Note what the list
      of "Αξιωματούχοι" that follows shows: on 1 March 2023 there were six deputy ministers,
      the Government Spokesman ranked above all of them, and neither the Deputy Minister for
      European Affairs nor the Deputy Ministry of Migration and International Protection yet
      existed. The live URL no longer resolves to this announcement — pio.gov.cy has been
      rebuilt and the id-based article URLs now redirect to the site's front page — so the
      archived capture of 3 April 2023, five weeks after publication, is the only usable copy;
      it was checked as a raw capture rather than through the archive's rewriting layer.

  - id: govcy-kyvernisi-en
    tier: 2
    type: government_website
    publisher: Κυπριακή Δημοκρατία — gov.cy (Republic of Cyprus, government portal)
    title: Government — The Republic of Cyprus, State Symbols, Composition of Government
    url: https://www.gov.cy/en/government/
    archive_url: https://web.archive.org/web/20260618120938/https://www.gov.cy/en/government/
    lang: en
    published: null
    accessed: 2026-07-28
    quote: >-
      In 1964, the Turkish Cypriot Vice-President and the three Turkish Cypriot ministers
      withdrew from government, and since then the government has been functioning by
      necessity only with Greek Cypriots in all ministries, which have been subsequently
      increased to eleven. The post of Vice-President remains vacant. Consequently, under the
      Law of Necessity, the President of the Republic appoints eleven Ministers, who
      constitute the Council of Ministers of the state, and, with the exception of the guarded
      and explicitly defined, by the Constitution, powers of the President and the
      Vice-President of the Republic, exercise the state’s executive power. Furthermore, the
      Constitution grants power to the President of the Republic to appoint the independent
      state officials and the judges of the Supreme Court. Moreover, the President of the
      Republic has the authority, according to the provisions of the relevant national
      legislation, to appoint Deputy Ministers.
    note: >-
      The Republic's own account of its executive, and the source that carries most of the
      interpretive weight in this file. Four claims come from it. That the ministries number
      eleven and that those eleven Ministers "constitute the Council of Ministers of the
      state" — which is what makes the seat count a matter of the government's own statement
      rather than our inference, and which excludes the deputy ministers from the Council.
      That the Vice-Presidency remains vacant, and that the Turkish Cypriot Vice-President and
      three Turkish Cypriot ministers withdrew in 1964, which is the basis for
      `head_count: 0`. That the arrangement rests on the Law of Necessity, which is how eleven
      ministries coexist with a constitutional text prescribing ten. And that Deputy Ministers
      are appointed by the President "according to the provisions of the relevant national
      legislation" — ordinary statute, not the Constitution. The same page carries the
      Composition of Government block from which the official English name of every ministry
      and deputy ministry in this file is taken; the block lists the same eleven ministers, in
      the same order, and the same eight deputy ministers as the Presidency's Greek page. The
      archived capture is of 18 June 2026 and matches the live page on the access date.

  - id: govcy-synthesi-kyvernisis
    tier: 2
    type: government_website
    publisher: Προεδρία της Κυπριακής Δημοκρατίας
    title: Σύνθεση Κυβέρνησης
    url: https://www.gov.cy/presidency/about/government-gr/
    archive_url: https://web.archive.org/web/20251219111541/https://www.gov.cy/presidency/about/government-gr/
    lang: el
    published: null
    accessed: 2026-07-28
    quote: >-
      Νίκος Χριστοδουλίδης Πρόεδρος της Δημοκρατίας Κωνσταντίνος Κόμπος Υπουργός Εξωτερικών
      Μάκης Κεραυνός Υπουργός Οικονομικών Κωνσταντίνος Ιωάννου Υπουργός Εσωτερικών Βασίλης
      Πάλμας Υπουργός Άμυνας Αθηνά Μιχαηλίδου Υπουργός Παιδείας, Αθλητισμού Και Νεολαίας
      Αλέξης Βαφεάδης Υπουργός Μεταφορών, Επικοινωνιών και Έργων Μιχάλης Δαμιανός Υπουργός
      Ενέργειας, Εμπορίου και Βιομηχανίας Μαρία Παναγιώτου Υπουργός Γεωργίας, Αγροτικής
      Ανάπτυξης και Περιβάλλοντος Μαρίνος Μουσιούττας Υπουργός Εργασίας και Κοινωνικών
      Ασφαλίσεων Κώστας Φυτιρής Υπουργός Δικαιοσύνης και Δημόσιας Τάξεως Νεόφυτος
      Χαραλαμπίδης Υπουργός Υγείας Ειρήνη Πική Υφυπουργός παρά τω Προέδρω Μαρίνα Χατζημανώλη
      Υφυπουργός Ναυτιλίας Κώστας Κουμής Υφυπουργός Τουρισμού Δρ. Νικόδημος Δαμιανού
      Υφυπουργός Έρευνας, Καινοτομίας και Ψηφιακής Πολιτικής Κλέα Χατζηστεφάνου Παπαέλληνα
      Υφυπουργός Κοινωνικής Πρόνοιας Βασιλική Κασσιανίδου Υφυπουργός Πολιτισμού Μαριλένα
      Ραουνά Υφυπουργός για Ευρωπαϊκά Θέματα Δρ. Νικόλας Α. Ιωαννίδης Υφυπουργός Μετανάστευσης
      και Διεθνούς Προστασίας Κωνσταντίνος Λετυμπιώτης Κυβερνητικός Εκπρόσωπος Γιάννης
      Αντωνίου Αναπληρωτής Κυβερνητικός Εκπρόσωπος Πηνελόπη Παπαβασιλείου Γραμματέας
      Υπουργικού Συμβουλίου
    note: >-
      The Presidency's composition page: the government as it stands, in Greek, and the source
      for which posts currently exist. It establishes that eight deputy ministers are in
      office — the six who head a Deputy Ministry plus the Deputy Minister to the President
      and the Deputy Minister for European Affairs, neither of whom heads a department — and
      that the only other officials published alongside the Council are the Government
      Spokesman, his deputy and the Secretary of the Council of Ministers. The archived capture
      is of 19 December 2025; it was compared line by line against the live page on the access
      date, 29 July 2026, and the two are identical — same eleven ministers, same eight deputy
      ministers, same order, same three officials — so nothing turns on the seven-month gap.
      The page gives ministers' titles rather than department names, which is why the
      department names in this file are taken from the government's website directory instead;
      it is also the page that spells the justice portfolio "Δημόσιας Τάξεως" where the statute
      spells it "Δημοσίας Τάξεως". Officeholders' names appear in the quote because they are
      what the page publishes; this dataset records posts and departments, not people.

  - id: govcy-istoselides-el
    tier: 2
    type: government_website
    publisher: Κυπριακή Δημοκρατία — gov.cy (Republic of Cyprus, government portal)
    title: Ιστοσελίδες — Υπουργεία / Υφυπουργεία
    url: https://www.gov.cy/websites/
    archive_url: https://web.archive.org/web/20260202091254/https://www.gov.cy/websites/
    lang: el
    published: null
    accessed: 2026-07-28
    quote: >-
      Υφυπουργείο Ναυτιλίας Υφυπουργείο Τουρισμού 3 σχετικές ιστοσελίδες Heartland of Legends
      Visit Cyprus Κυπριακή Εταιρεία Αγροτουρισμού Υφυπουργείο Έρευνας, Καινοτομίας και
      Ψηφιακής Πολιτικής 3 σχετικές ιστοσελίδες Τμήμα Ηλεκτρονικών Επικοινωνιών Τμήμα
      Υπηρεσιών Πληροφορικής Digital Services Factory Υφυπουργείο Κοινωνικής Πρόνοιας 4
      σχετικές ιστοσελίδες Τμήμα Κοινωνικής Ενσωμάτωσης Ατόμων με Αναπηρίες Ευρωπαϊκή Κάρτα
      Αναπηρίας Υπηρεσία Διαχείρισης Επιδομάτων Πρόνοιας Υπηρεσίες Κοινωνικής Ευημερίας
      Υφυπουργείο Πολιτισμού 4 σχετικές ιστοσελίδες Κρατικό Αρχείο Τμήμα Αρχαιοτήτων Τμήμα
      Σύγχρονου Πολιτισμού Υπηρεσία Κυπριακής Χειροτεχνίας Υφυπουργείο Μετανάστευσης και
      Διεθνούς Προστασίας 2 σχετικές ιστοσελίδες Τμήμα Μετανάστευσης Υπηρεσία Ασύλου
    note: >-
      The government's own directory of its web estate, and the source for the Greek
      *department* names used in this file (Υπουργείο X and Υφυπουργείο X, as against the
      ministerial titles Υπουργός X that the Presidency's composition page gives). It groups
      eighteen entries under the heading "Υπουργεία / Υφυπουργεία" — the Presidency, the eleven
      ministries and the six deputy ministries — and lists the eleven in the same precedence
      order as the Press and Information Office's announcement. It is quoted here at the
      deputy-ministry end of that list, because the passage does double duty: it names all six
      Υφυπουργεία in the Republic's own nomenclature, and it shows the subordinate departments
      under each — the Department of Antiquities and the State Archive under Culture, the
      Migration Department and the Asylum Service under Migration, the Departments of
      Electronic Communications and of Information Technology Services under Research,
      Innovation and Digital Policy. That is the concrete evidence that these are departments
      of state and not portfolios inside a ministry, which is the half of the Deputy Ministries
      argument that runs in their favour. This is also the page whose Interior block names the
      Town Planning and Housing Department, the Lands and Surveys Department and the District
      Administrations, which is the basis for that ministry's policy-area tags. Archived
      2 February 2026.

  - id: ee-4616-2017-yfyp-naftilias
    tier: 1
    type: official_gazette
    publisher: >-
      Κυπριακή Δημοκρατία — Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας, Παράρτημα Πρώτο,
      Μέρος Ι
    title: >-
      Ν. 123(Ι)/2017 — Ο περί της Ίδρυσης Υφυπουργείου Ναυτιλίας και περί Διορισμού
      Υφυπουργού Ναυτιλίας παρά τω Προέδρω και Συναφών Θεμάτων Νόμος του 2017 (Ε.Ε. Παρ.
      Ι(Ι), Αρ. 4616, 28.7.2017)
    url: http://www.cylaw.org/nomoi/arith/2017_1_123.pdf
    archive_url: https://web.archive.org/web/20220220223747/http://www.cylaw.org/nomoi/arith/2017_1_123.pdf
    lang: el
    published: 2017-07-28
    accessed: 2026-07-28
    quote: >-
      ΝΟΜΟΣ ΠΟΥ ΠΡΟΒΛΕΠΕΙ ΓΙΑ ΤΗΝ ΙΔΡΥΣΗ ΥΦΥΠΟΥΡΓΕΙΟΥ ΝΑΥΤΙΛΙΑΣ, ΔΙΟΡΙΣΜΟΥ ΥΦΥΠΟΥΡΓΟΥ
      ΝΑΥΤΙΛΙΑΣ ΠΑΡΑ ΤΩ ΠΡΟΕΔΡΩ ΚΑΙ ΓΙΑ ΣΥΝΑΦΗ ΘΕΜΑΤΑ ΤΟΥ 2017
    note: >-
      The first of the six Deputy Ministries, and the template for all of them. Article 3
      establishes the Υφυπουργείο Ναυτιλίας as the transformation of the former Department of
      Merchant Shipping, which until then sat inside the Ministry of Transport,
      Communications and Works; article 4 provides that references in shipping legislation to
      that Ministry are henceforth references to the Deputy Ministry and references to that
      Minister are references to the Deputy Minister of Shipping to the President; article 7
      has the Deputy Minister appointed by an act of the President; article 11 has him submit
      his own budget through the Minister of Finance. Article 12, the provision on which this
      file's central judgement call turns, reads in full: "Ο Υφυπουργός δύναται να υποβάλλει
      προτάσεις προς το Υπουργικό Συμβούλιο και να παρίσταται στις συνεδρίες αυτού για θέματα
      για τα οποία του ανατίθεται εξουσία ή αρμοδιότητα δυνάμει των διατάξεων του παρόντος
      Νόμου ή από το Υπουργικό Συμβούλιο, χωρίς να συμμετέχει στη διαδικασία λήψης
      αποφάσεων." The quote field carries the law's operative title rather than article 12,
      because the Gazette sets the marginal rubric alongside the body text and a
      layout-preserving text extraction interleaves the two, so no long continuous extract of
      that article is possible; the identical provision is quoted from a gazette page where it
      *is* continuous in source ee-4744-2020-yfyp-erevnas. In force from 1 March 2018 (article
      14), as amended by 15(I)/2023. On provenance: this PDF is the Official Gazette's own
      typeset pages, carrying its masthead, issue number and pagination, but it is served from
      cylaw.org, the Pancyprian Bar Association's legislation service, because the Government
      Printing Office's online gazette does not reach back to 2017. See the methodology note
      on grading.

  - id: ee-4669-2018-yfyp-tourismou
    tier: 1
    type: official_gazette
    publisher: >-
