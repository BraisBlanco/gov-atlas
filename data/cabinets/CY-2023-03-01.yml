        Last in the order of precedence. Like Interior and Transport, it appears never to have
        been renamed by statute — it has carried the same name since independence and no
        Cypriot law names it as a department — so it rests on tier 2.
      es: >-
        Último en el orden de precedencia. Como Interior y Transportes, parece no haber sido
        renombrado nunca por ley —lleva el mismo nombre desde la independencia y ninguna ley
        chipriota lo nombra como departamento—, así que se apoya en nivel 2.

  # --- recorded, not counted ---------------------------------------------------
  - id: CY-2023-proedros-dimokratias
    order: 12
    name_original: Πρόεδρος της Δημοκρατίας
    abbreviation_original: null
    name_en: President of the Republic
    name_es: Presidente de la República
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Πρόεδρος της Δημοκρατίας
    head_title_en: President of the Republic
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://www.gov.cy/presidency/
    sources: [syntagma-1960, govcy-kyvernisi-en, govcy-synthesi-kyvernisis]
    note:
      en: >-
        The head of government holds a seat without heading a ministry — but in Cyprus he is
        also the head of state, which no other entry in this dataset carrying
        head_of_government_office is. Article 36(1) of the Constitution makes the President the
        Head of the State who "takes precedence over all persons in the Republic"; article 46
        vests the executive power in him and the Vice-President and gives them the Council of
        Ministers to secure it; there is no prime minister anywhere in the constitutional
        order. He presides over the Council of Ministers, appoints and dismisses the ministers,
        and appoints the Deputy Ministers under ordinary statute. He is excluded from the
        ministry count for the ordinary reason — the presidency is the apex of the cabinet, not
        a portfolio department — and given a seat for the project's uniform reason, so that
        Cyprus's seat figure means the same thing as everyone else's. The strict reading of
        article 46, on which the Council "consists of" the ministers and the President merely
        "has" it, is discussed in the methodology notes.
      es: >-
        El jefe de gobierno ocupa asiento sin encabezar ningún ministerio, pero en Chipre es
        además el jefe del Estado, lo que no ocurre en ninguna otra entrada de este conjunto de
        datos con head_of_government_office. El artículo 36.1 de la Constitución hace del
        Presidente el Jefe del Estado que «precede a todas las personas en la República»; el
        artículo 46 le atribuye, junto al Vicepresidente, el poder ejecutivo y les da el
        Consejo de Ministros para asegurarlo; no hay primer ministro en ninguna parte del orden
        constitucional. Preside el Consejo de Ministros, nombra y cesa a los ministros y nombra
        a los viceministros por ley ordinaria. Se excluye del recuento de ministerios por el
        motivo habitual —la presidencia es la cúspide del gabinete, no un departamento con
        cartera— y se le da asiento por el motivo uniforme del proyecto, para que la cifra de
        asientos de Chipre signifique lo mismo que la de los demás. La lectura estricta del
        artículo 46, según la cual el Consejo «se compone de» los ministros y el Presidente
        solo lo «tiene», se discute en las notas metodológicas.

  - id: CY-2023-antiproedros-dimokratias
    order: 13
    name_original: Αντιπρόεδρος της Δημοκρατίας
    abbreviation_original: null
    name_en: Vice-President of the Republic
    name_es: Vicepresidente de la República
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Αντιπρόεδρος της Δημοκρατίας
    head_title_en: Vice-President of the Republic
    has_cabinet_seat: true
    head_count: 0
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: deputy_head_without_portfolio
    url: null
    sources: [syntagma-1960, govcy-kyvernisi-en]
    note:
      en: >-
        A constitutional office that has been vacant since 1964, recorded here rather than
        ignored, and recorded as vacant rather than as filled. Under article 46 the executive
        power is secured by the President *and the Vice-President* jointly; under article 36
        the Vice-President is the Υπαρχηγός της Πολιτείας, the Deputy Head of the State, second
        in precedence to the President; under article 47 a list of executive powers is
        exercised by the two of them acting together, including the appointment of the members
        of the Council of Ministers. The office is reserved to a Turkish Cypriot, and the holder
        withdrew from the government in 1964 along with the three Turkish Cypriot ministers;
        the Republic's own portal states that "the post of Vice-President remains vacant". It
        is therefore recorded with `has_cabinet_seat: true` and `head_count: 0`: the seat exists
        at the table and nobody holds it, so it contributes nothing to the seat count, which is
        twelve rather than thirteen. `deputy_head_without_portfolio` is the closest fit in this
        project's vocabulary and it is imperfect in both directions — the Vice-President heads
        no department, which the reason captures, but he is a deputy head of *state* who shares
        in the executive power rather than a deputy prime minister, which it does not.
        `ceremonial_or_head_of_state` was rejected because its definition applies where the
        office is distinct from the head of government, and here it is the President who is
        both.
      es: >-
        Un cargo constitucional vacante desde 1964, registrado aquí en lugar de ignorado, y
        registrado como vacante y no como ocupado. Según el artículo 46 el poder ejecutivo lo
        aseguran conjuntamente el Presidente *y el Vicepresidente*; según el artículo 36 el
        Vicepresidente es el Υπαρχηγός της Πολιτείας, el Subjefe del Estado, segundo en
        precedencia tras el Presidente; según el artículo 47 una lista de poderes ejecutivos la
        ejercen ambos actuando de común acuerdo, incluido el nombramiento de los miembros del
        Consejo de Ministros. El cargo está reservado a un turcochipriota, y su titular se
        retiró del gobierno en 1964 junto con los tres ministros turcochipriotas; el propio
        portal de la República afirma que «el cargo de Vicepresidente permanece vacante». Por
        eso se registra con `has_cabinet_seat: true` y `head_count: 0`: el asiento existe en la
        mesa y nadie lo ocupa, así que no aporta nada al recuento de asientos, que es doce y no
        trece. `deputy_head_without_portfolio` es lo más aproximado del vocabulario de este
        proyecto y es imperfecto en ambas direcciones: el Vicepresidente no encabeza
        departamento alguno, lo que el motivo sí capta, pero es un subjefe del *Estado* que
        participa del poder ejecutivo y no un viceprimer ministro, lo que no capta. Se descartó
        `ceremonial_or_head_of_state` porque su definición se aplica cuando el cargo es distinto
        del jefe de gobierno, y aquí es el Presidente quien es ambos.

  - id: CY-2023-yfypourgos-para-to-proedro
    order: 14
    name_original: Υφυπουργός παρά τω Προέδρω
    abbreviation_original: null
    name_en: Deputy Minister to the President
    name_es: Viceministro ante el Presidente
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υφυπουργός
    head_title_en: Deputy Minister
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: null
    sources: [pio-diaveveosi-2023-03-01, govcy-synthesi-kyvernisis, govcy-kyvernisi-en]
    note:
      en: >-
        The one deputy minister who has always been part of this government and heads no
        department. Sworn in on 1 March 2023 immediately after the Government Spokesman and
        before the five deputy ministers who did head Deputy Ministries, the post sits in the
        Presidency with responsibility for coordinating and monitoring delivery of the
        government's programme. No Υφυπουργείο corresponds to it, so `url` is null and no
        constitutive statute is cited: unlike the six Deputy Ministries and unlike the European
        Affairs post, this one rests on the President's power to appoint Deputy Ministers under
        ordinary legislation, which the Republic's portal states in general terms, rather than
        on a law of its own. It adds neither a ministry nor a seat.
      es: >-
        El único viceministro que ha formado parte de este gobierno desde el principio y no
        encabeza departamento alguno. Juramentado el 1 de marzo de 2023 inmediatamente después
        del Portavoz del Gobierno y antes de los cinco viceministros que sí encabezaban
        Viceministerios, el cargo reside en la Presidencia con la responsabilidad de coordinar
        y supervisar la ejecución del programa de gobierno. No le corresponde ningún
        Υφυπουργείο, de modo que `url` es null y no se cita ley constitutiva: a diferencia de
        los seis Viceministerios y del cargo de Asuntos Europeos, este se apoya en la potestad
        del Presidente de nombrar viceministros conforme a la legislación ordinaria, que el
        portal de la República enuncia en términos generales, y no en una ley propia. No suma
        ni ministerio ni asiento.

  - id: CY-2023-yfypourgeio-naftilias
    order: 15
    name_original: Υφυπουργείο Ναυτιλίας
    abbreviation_original: null
    name_en: Shipping Deputy Ministry
    name_es: Viceministerio de Marina Mercante
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υφυπουργός Ναυτιλίας παρά τω Προέδρω
    head_title_en: Shipping Deputy Minister
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: https://www.gov.cy/dms/
    sources: [ee-4616-2017-yfyp-naftilias, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        The first Deputy Ministry, in force from 1 March 2018, created out of the Department of
        Merchant Shipping which had sat inside the Ministry of Transport, Communications and
        Works; law 123(I)/2017 provides that references in shipping legislation to that
        Ministry and Minister are now references to this Deputy Ministry and its Deputy
        Minister. It runs the Cyprus register of ships, one of the largest in the European
        Union. It is a department in every practical sense and is not counted as a ministry
        only because its head is a Υφυπουργός who attends the Council of Ministers without a
        vote — see the methodology note, which states the alternative figure. The English name
        is the government's own and is the odd one out: the Republic publishes the other five
        as "Deputy Ministry of X" and this one as "Shipping Deputy Ministry", and it is recorded
        as published.
      es: >-
        El primer Viceministerio, en vigor desde el 1 de marzo de 2018, creado a partir del
        Departamento de Marina Mercante que residía dentro del Ministerio de Transportes,
        Comunicaciones y Obras; la ley 123(I)/2017 dispone que las referencias de la
        legislación marítima a ese Ministerio y Ministro se entienden hechas a este
        Viceministerio y su viceministro. Gestiona el registro chipriota de buques, uno de los
        mayores de la Unión Europea. Es un departamento en todo sentido práctico y no se cuenta
        como ministerio solo porque su titular es un Υφυπουργός que asiste al Consejo de
        Ministros sin voto: véase la nota metodológica, que da la cifra alternativa. El nombre
        en inglés es el del propio Gobierno y es el discordante: la República publica los otros
        cinco como «Deputy Ministry of X» y este como «Shipping Deputy Ministry», y así se
        registra.

  - id: CY-2023-yfypourgeio-tourismou
    order: 16
    name_original: Υφυπουργείο Τουρισμού
    abbreviation_original: null
    name_en: Deputy Ministry of Tourism
    name_es: Viceministerio de Turismo
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υφυπουργός Τουρισμού παρά τω Προέδρω
    head_title_en: Deputy Minister of Tourism
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: https://www.gov.cy/tourism/
    sources: [ee-4669-2018-yfyp-tourismou, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        Created by law 123(I)/2018 and operating from 1 January 2019, replacing the Cyprus
        Tourism Organisation and taking the tourism competence out of what was then the
        Ministry of Energy, Commerce, Industry and Tourism. Tourism matters more to the Cypriot
        economy than to almost any other in this dataset, so the consequence of not counting
        this department is worth stating twice: Cyprus registers no tourism ministry in the
        policy-area matrix, and the cell should be read as "no ministry", not "no department".
      es: >-
        Creado por la ley 123(I)/2018 y operativo desde el 1 de enero de 2019, en sustitución
        de la Organización de Turismo de Chipre y sacando la competencia turística de lo que
        entonces era el Ministerio de Energía, Comercio, Industria y Turismo. El turismo pesa
        más en la economía chipriota que en casi ninguna otra de este conjunto, así que conviene
        repetir la consecuencia de no contar este departamento: Chipre no registra ningún
        ministerio de turismo en la matriz de áreas, y la celda debe leerse como «ningún
        ministerio», no como «ningún departamento».

  - id: CY-2023-yfypourgeio-erevnas-kainotomias
    order: 17
    name_original: Υφυπουργείο Έρευνας, Καινοτομίας και Ψηφιακής Πολιτικής
    abbreviation_original: null
    name_en: Deputy Ministry of Research, Innovation and Digital Policy
    name_es: Viceministerio de Investigación, Innovación y Política Digital
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υφυπουργός Έρευνας, Καινοτομίας και Ψηφιακής Πολιτικής παρά τω Προέδρω
    head_title_en: Deputy Minister of Research, Innovation and Digital Policy
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: https://www.gov.cy/dmrid/
    sources: [ee-4744-2020-yfyp-erevnas, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        Created by law 14(I)/2020, absorbing the Department of Information Technology Services
        from the Ministry of Finance and the Department of Electronic Communications from the
        Ministry of Transport, Communications and Works. Its constitutive law is the one whose
        gazette page allows the decisive no-vote provision to be quoted continuously, so it
        carries the citation that the whole Deputy Ministries argument rests on. Three policy
        areas — research, innovation and digital — are tagged to no counted Cypriot ministry
        because of that argument, which in a comparison of where digital government sits makes
        Cyprus look empty when it is in fact one of the few countries here with a dedicated
        digital department.
      es: >-
        Creado por la ley 14(I)/2020, absorbiendo el Departamento de Servicios de Informática
        del Ministerio de Hacienda y el Departamento de Comunicaciones Electrónicas del
        Ministerio de Transportes, Comunicaciones y Obras. Su ley constitutiva es aquella cuya
        página de boletín permite citar de forma continua la disposición decisiva sobre la
        ausencia de voto, así que lleva la cita en la que se apoya todo el argumento de los
        Viceministerios. Tres áreas —research, innovation y digital— no quedan etiquetadas en
        ningún ministerio chipriota contado por ese argumento, lo que en una comparación de
        dónde reside el gobierno digital hace que Chipre parezca vacío cuando en realidad es uno
        de los pocos países de aquí con un departamento digital dedicado.

