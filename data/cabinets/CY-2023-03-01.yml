    sources: [ee-4986-2024-yfyp-metanastefsis, kdp-203-2024, govcy-synthesi-kyvernisis, govcy-istoselides-el]
    note:
      en: >-
        The only department created during this cabinet's term, and the reason it carries
        `valid_from`. Law 23(I)/2024 was published on 15 March 2024 but did not commence on
        publication; the Minister of the Interior fixed 17 June 2024 by notification Κ.Δ.Π.
        203/2024, and that is the date used. It took the Migration Department and the Asylum
        Service out of the Ministry of the Interior, which is why the migration policy area is
        no longer tagged there — and, because this department is not counted, why Cyprus
        registers no migration ministry at all despite being among the EU member states with
        the highest per-capita asylum caseload. It did not exist when the cabinet was sworn in
        on 1 March 2023 and does not appear in the Press and Information Office's precedence
        list of that date, which is why that source is not cited here.
      es: >-
        El único departamento creado durante esta legislatura, y la razón por la que lleva
        `valid_from`. La ley 23(I)/2024 se publicó el 15 de marzo de 2024 pero no entró en vigor
        con la publicación; el ministro del Interior fijó el 17 de junio de 2024 mediante la
        notificación Κ.Δ.Π. 203/2024, y esa es la fecha utilizada. Sacó el Departamento de
        Migración y el Servicio de Asilo del Ministerio del Interior, y por eso el área
        migration ya no se etiqueta allí y, como este departamento no se cuenta, Chipre no
        registra ningún ministerio de migración pese a estar entre los Estados miembros de la UE
        con mayor carga de asilo por habitante. No existía cuando el gabinete juró el 1 de marzo
        de 2023 y no figura en la lista de precedencia del Gabinete de Prensa e Información de
        esa fecha, razón por la cual esa fuente no se cita aquí.
