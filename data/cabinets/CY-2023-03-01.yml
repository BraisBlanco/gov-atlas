    sources: [ee-4837-2021-yfyp-pronoias, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        Created by law 89(I)/2021 out of the Social Welfare Services, which had been the
        welfare arm of the Ministry of Labour, Welfare and Social Insurance; the Department for
        the Social Inclusion of Persons with Disabilities and the welfare-benefits function
        followed it. It is the reason the labour ministry's name lost the word Προνοίας, and the
        reason the social_affairs and disability policy areas are tagged to no counted Cypriot
        ministry.
      es: >-
        Creado por la ley 89(I)/2021 a partir de los Servicios de Bienestar Social, que eran el
        brazo asistencial del Ministerio de Trabajo, Bienestar y Seguros Sociales; le siguieron
        el Departamento de Inclusión Social de Personas con Discapacidad y la gestión de
        prestaciones asistenciales. Es la razón por la que el nombre del ministerio de trabajo
        perdió la palabra Προνοίας, y la razón por la que las áreas social_affairs y disability
        no quedan etiquetadas en ningún ministerio chipriota contado.

  - id: CY-2023-yfypourgeio-politismou
    order: 19
    name_original: Υφυπουργείο Πολιτισμού
    abbreviation_original: null
    name_en: Deputy Ministry of Culture
    name_es: Viceministerio de Cultura
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υφυπουργός Πολιτισμού παρά τω Προέδρω
    head_title_en: Deputy Minister of Culture
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: https://www.gov.cy/culture/
    sources: [ee-4889-2022-yfyp-politismou, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        Created by law 55(I)/2022, bringing together the Cultural Services, the Department of
        Antiquities, the Department of Contemporary Culture and the State Archive, all
        previously in the education ministry. Its constitutive law is the most explicit of the
        six about the departmental relationship: the Deputy Minister is the person appointed by
        the President who "προΐσταται του Υφυπουργείου Πολιτισμού", heads the Deputy Ministry of
        Culture — and who under article 19 nonetheless attends the Council of Ministers without
        taking part in decisions. Cyprus runs the archaeology of an island with a very long
        recorded history from a department this project does not count as a ministry; the
        culture policy area is therefore tagged nowhere for Cyprus.
      es: >-
        Creado por la ley 55(I)/2022, reuniendo los Servicios Culturales, el Departamento de
        Antigüedades, el Departamento de Cultura Contemporánea y el Archivo del Estado, todos
        antes en el ministerio de educación. Su ley constitutiva es la más explícita de las seis
        sobre la relación departamental: el viceministro es la persona nombrada por el
        Presidente que «προΐσταται του Υφυπουργείου Πολιτισμού», encabeza el Viceministerio de
        Cultura, y que conforme al artículo 19 asiste sin embargo al Consejo de Ministros sin
        participar en las decisiones. Chipre gestiona la arqueología de una isla con una
        historia registrada muy larga desde un departamento que este proyecto no cuenta como
        ministerio; el área culture no se etiqueta por tanto en ninguna parte para Chipre.

  - id: CY-2023-yfypourgos-evropaikon-thematon
    order: 20
    name_original: Υφυπουργός παρά τω Προέδρω για Ευρωπαϊκά Θέματα
    abbreviation_original: null
    name_en: Deputy Minister for European Affairs
    name_es: Viceministro para Asuntos Europeos
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υφυπουργός
    head_title_en: Deputy Minister
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: null
    valid_from: 2023-12-01
    valid_to: 2026-07-31
    sources: [ee-4968-2023-yfyp-evropaikon, govcy-synthesi-kyvernisis, govcy-kyvernisi-en]
    note:
      en: >-
        A post, not a department, and a temporary one. Law 119(I)/2023 provides for the
        appointment of a Υφυπουργός παρά τω Προέδρω for European Affairs and establishes no
        Υφυπουργείο, so `url` is null; the holder worked in the Presidency and coordinated
        Cyprus's Presidency of the Council of the European Union in the first half of 2026.
        Article 9 of that law fixes its own expiry: the Law "λήγει την 31η Ιουλίου 2026",
        expires on 31 July 2026, which is this entity's `valid_to`. It was still in office on
        the access date of 29 July 2026, two days short of that, so it is part of the current
        snapshot; from 1 August 2026 it leaves the snapshot and this country's excluded and
        total entity counts drop by one, while the eleven ministries and twelve seats are
        unaffected. `valid_from` is the date the law was published, 1 December 2023, which is
        the earliest the post could have existed; the Council of Ministers decision that
        actually commenced the law is published in the fourth annex of the Gazette and could
        not be located, so a future curator should replace the date if they find it. The 2012
        Council Presidency had an identical temporary post under law 123(I)/2011.
      es: >-
        Un cargo, no un departamento, y además temporal. La ley 119(I)/2023 prevé el
        nombramiento de un Υφυπουργός παρά τω Προέδρω para Asuntos Europeos y no crea ningún
        Υφυπουργείο, así que `url` es null; su titular trabajaba en la Presidencia y coordinó la
        Presidencia chipriota del Consejo de la Unión Europea del primer semestre de 2026. El
        artículo 9 de esa ley fija su propia caducidad: la ley «λήγει την 31η Ιουλίου 2026»,
        expira el 31 de julio de 2026, que es el `valid_to` de esta entidad. Seguía en el cargo
        en la fecha de consulta, 29 de julio de 2026, dos días antes, así que forma parte de la
        foto actual; desde el 1 de agosto de 2026 sale de la foto y los recuentos de entidades
        excluidas y totales de este país bajan en uno, mientras los once ministerios y los doce
        asientos no se ven afectados. `valid_from` es la fecha de publicación de la ley, 1 de
        diciembre de 2023, la más temprana en que el cargo podía existir; la decisión del
        Consejo de Ministros que efectivamente puso la ley en vigor se publica en el cuarto
        anexo del Boletín y no pudo localizarse, así que un curador futuro debería sustituir la
        fecha si la encuentra. La Presidencia del Consejo de 2012 tuvo un cargo temporal
        idéntico con la ley 123(I)/2011.

  - id: CY-2023-yfypourgeio-metanastefsis
    order: 21
