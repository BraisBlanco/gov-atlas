    title: >-
      Ν. 123(Ι)/2018 — Ο περί της Ίδρυσης Υφυπουργείου Τουρισμού και Διορισμού Υφυπουργού
      Τουρισμού παρά τω Προέδρω και Συναφών Θεμάτων Νόμος του 2018 (Ε.Ε. Παρ. Ι(Ι), Αρ. 4669,
      30.7.2018)
    url: http://www.cylaw.org/nomoi/arith/2018_1_123.pdf
    archive_url: https://web.archive.org/web/20251119181704/http://www.cylaw.org/nomoi/arith/2018_1_123.pdf
    lang: el
    published: 2018-07-30
    accessed: 2026-07-28
    quote: >-
      ΝΟΜΟΣ ΠΟΥ ΠΡΟΒΛΕΠΕΙ ΓΙΑ ΤΗΝ ΙΔΡΥΣΗ ΥΦΥΠΟΥΡΓΕΙΟΥ ΤΟΥΡΙΣΜΟΥ, ΤΟΝ ΔΙΟΡΙΣΜΟ ΥΦΥΠΟΥΡΓΟΥ
      ΤΟΥΡΙΣΜΟΥ ΠΑΡΑ ΤΩ ΠΡΟΕΔΡΩ ΚΑΙ ΓΙΑ ΣΥΝΑΦΗ ΘΕΜΑΤΑ
    note: >-
      Establishes the Deputy Ministry of Tourism, taking over the functions of the former
      Cyprus Tourism Organisation, whose staff and posts Part V transfers to it. Article 3
      gives it the drawing up of the national tourism strategy and the enforcement of tourism
      legislation. Article 11 carries the same restriction as every other deputy-ministry law:
      the Deputy Minister may submit proposals to and attend the Council of Ministers "χωρίς
      όμως να συμμετέχει στη διαδικασία λήψης αποφάσεων". This law is also why the Ministry of
      Energy, Commerce, Industry and Tourism lost its tourism competence and was renamed —
      see source ee-4679-2018-metonomasia-energeias, passed five months later. Amended by
      152(I)/2018, 189(I)/2021 and 159(I)/2022. Same provenance caveat as
      ee-4616-2017-yfyp-naftilias: gazette pages, hosted by cylaw.org.

  - id: ee-4744-2020-yfyp-erevnas
    tier: 1
    type: official_gazette
    publisher: >-
      Κυπριακή Δημοκρατία — Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας, Παράρτημα Πρώτο,
      Μέρος Ι
    title: >-
      Ν. 14(Ι)/2020 — Ο περί της Ίδρυσης Υφυπουργείου Έρευνας, Καινοτομίας και Ψηφιακής
      Πολιτικής και Διορισμού Υφυπουργού Έρευνας, Καινοτομίας και Ψηφιακής Πολιτικής παρά τω
      Προέδρω και Συναφών Θεμάτων Νόμος του 2020 (Ε.Ε. Παρ. Ι(Ι), Αρ. 4744, 21.2.2020)
    url: http://www.cylaw.org/nomoi/arith/2020_1_014.pdf
    archive_url: https://web.archive.org/web/20250802170043/http://www.cylaw.org/nomoi/arith/2020_1_014.pdf
    lang: el
    published: 2020-02-21
    accessed: 2026-07-28
    quote: >-
      εξουσίες ή αρμοδιότητες ανατίθενται σε αυτόν από το Υπουργικό Συμβούλιο, χωρίς όμως να
      συμμετέχει στη διαδικασία λήψης απόφασης.
    note: >-
      Establishes the Deputy Ministry of Research, Innovation and Digital Policy, absorbing
      the Department of Information Technology Services and the Department of Electronic
      Communications. It is cited here for the provision that decides whether a Cypriot Deputy
      Minister holds a cabinet seat, and this gazette page is the one place among the six laws
      where that provision can be quoted continuously: in every other one the Gazette's
      marginal rubric runs alongside all four lines of the article and interleaves with it in
      a layout-preserving extraction, whereas here the rubric ("Υποβολή προτάσεων στο
      Υπουργικό Συμβούλιο") is four lines against a five-line article, leaving the closing
      words clear. The quote is therefore the end of article 11; the article in full reads
      "Ο Υφυπουργός δύναται να υποβάλλει προτάσεις στο Υπουργικό Συμβούλιο και να παρίσταται
      στις συνεδρίες του αναφορικά με θέματα που υπάγονται στις δυνάμει των διατάξεων του
      παρόντος Νόμου ανατεθείσες σε αυτόν εξουσίες ή αρμοδιότητες και/ή σε οποιεσδήποτε άλλες
      εξουσίες ή αρμοδιότητες ανατίθενται σε αυτόν από το Υπουργικό Συμβούλιο, χωρίς όμως να
      συμμετέχει στη διαδικασία λήψης απόφασης." Read it against article 46 of the
      Constitution: the Council of Ministers is composed of ministers, and a deputy minister
      attends it without a vote. Amended by 95(I)/2023. Same provenance caveat as
      ee-4616-2017-yfyp-naftilias.

  - id: ee-4837-2021-yfyp-pronoias
    tier: 1
    type: official_gazette
    publisher: >-
      Κυπριακή Δημοκρατία — Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας, Παράρτημα Πρώτο,
      Μέρος Ι
    title: >-
      Ν. 89(Ι)/2021 — Ο περί της Ίδρυσης Υφυπουργείου Κοινωνικής Πρόνοιας και περί Συναφών
      Θεμάτων Νόμος του 2021 (Ε.Ε. Παρ. Ι(Ι), Αρ. 4837, 6.5.2021)
    url: http://www.cylaw.org/nomoi/arith/2021_1_089.pdf
    archive_url: https://web.archive.org/web/20250805043645/http://www.cylaw.org/nomoi/arith/2021_1_089.pdf
    lang: el
    published: 2021-05-06
    accessed: 2026-07-28
    quote: >-
      Ο περί της Ίδρυσης Υφυπουργείου Κοινωνικής Πρόνοιας και περί Συναφών Θεμάτων Νόμος του
      2021 εκδίδεται με δημοσίευση στην Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας σύμφωνα με
      το Άρθρο 52 του Συντάγματος.
    note: >-
      Establishes the Deputy Ministry of Social Welfare out of the former Social Welfare
      Services, which sat in the Ministry of Labour, Welfare and Social Insurance; article 12
      allows the Council of Ministers to transfer to it the Department for the Social
      Inclusion of Persons with Disabilities and the benefits-assessment competence. Article
      11 carries the standard restriction — proposals and attendance at the Council of
      Ministers "χωρίς να συμμετέχει στη διαδικασία λήψης αποφάσεων". The quote is the
      enactment formula, which is the longest passage on the page free of the Gazette's
      marginal rubric; it establishes that the instrument is a statute promulgated under
      article 52 of the Constitution. Note for anyone chasing the labour ministry's name: this
      law does not itself rename Υπουργείο Εργασίας, Προνοίας και Κοινωνικών Ασφαλίσεων, and
      no renaming statute for its present name, Υπουργείο Εργασίας και Κοινωνικών
      Ασφαλίσεων, could be found — which is part of why Cyprus is graded B. Amended by
      29(I)/2022. Same provenance caveat as ee-4616-2017-yfyp-naftilias.

  - id: ee-4889-2022-yfyp-politismou
    tier: 1
    type: official_gazette
    publisher: >-
      Κυπριακή Δημοκρατία — Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας, Παράρτημα Πρώτο,
      Μέρος Ι
    title: >-
      Ν. 55(Ι)/2022 — Ο περί της Ίδρυσης Υφυπουργείου Πολιτισμού και Διορισμού Υφυπουργού
      Πολιτισμού παρά τω Προέδρω και Συναφών Θεμάτων Νόμος του 2022 (Ε.Ε. Παρ. Ι(Ι), Αρ. 4889,
      20.4.2022)
    url: http://www.cylaw.org/nomoi/arith/2022_1_055.pdf
    archive_url: https://web.archive.org/web/20240705110734/http://www.cylaw.org/nomoi/arith/2022_1_055.pdf
    lang: el
    published: 2022-04-20
    accessed: 2026-07-28
    quote: >-
      Ο περί της Ίδρυσης Υφυπουργείου Πολιτισμού και Διορισμού Υφυπουργού Πολιτισμού παρά τω
      Προέδρω και Συναφών Θεμάτων Νόμος του 2022 εκδίδεται με δημοσίευση στην Επίσημη
      Εφημερίδα της Κυπριακής Δημοκρατίας σύμφωνα με το Άρθρο 52 του Συντάγματος.
    note: >-
      Establishes the Deputy Ministry of Culture, bringing together the Cultural Services, the
      Department of Antiquities and the State Archive, which had belonged to the Ministry of
      Education, Culture, Sport and Youth. Its interpretation article is unusually explicit
      about the departmental relationship this file had to weigh: the Υφυπουργός Πολιτισμού
      παρά τω Προέδρω is the person appointed by the President "το οποίο προΐσταται του
      Υφυπουργείου Πολιτισμού" — who heads the Deputy Ministry of Culture. He nevertheless
      attends the Council of Ministers under article 19 "χωρίς να συμμετέχει στη διαδικασία
      λήψης αποφάσεων". Passed on the same gazette day, and as part of the same
      reorganisation, as the law renaming the education ministry — see
      ee-4889-2022-metonomasia-paideias. Amended by 204(I)/2025. Same provenance caveat as
      ee-4616-2017-yfyp-naftilias.

  - id: ee-4986-2024-yfyp-metanastefsis
    tier: 1
    type: official_gazette
    publisher: >-
      Κυπριακή Δημοκρατία — Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας, Παράρτημα Πρώτο,
      Μέρος Ι
    title: >-
      Ν. 23(Ι)/2024 — Ο περί Ίδρυσης Υφυπουργείου Μετανάστευσης και Διεθνούς Προστασίας και
      Συναφών Θεμάτων Νόμος του 2024 (Ε.Ε. Παρ. Ι(Ι), Αρ. 4986, 15.3.2024)
    url: http://www.cylaw.org/nomoi/arith/2024_1_023.pdf
    archive_url: https://web.archive.org/web/20260418132426/http://www.cylaw.org/nomoi/arith/2024_1_023.pdf
    lang: el
    published: 2024-03-15
    accessed: 2026-07-28
    quote: >-
      ΝΟΜΟΣ ΠΟΥ ΠΡΟΒΛΕΠΕΙ ΓΙΑ ΤΗΝ ΙΔΡΥΣΗ ΥΦΥΠΟΥΡΓΕΙΟΥ ΜΕΤΑΝΑΣΤΕΥΣΗΣ ΚΑΙ ΔΙΕΘΝΟΥΣ ΠΡΟΣΤΑΣΙΑΣ
      ΚΑΙ ΓΙΑ ΣΥΝΑΦΗ ΘΕΜΑΤΑ
    note: >-
      The newest of the six, and the only department in this file created after the cabinet
      took office. It establishes the Deputy Ministry of Migration and International
      Protection and transfers to it the Migration Department and the Asylum Service from the
      Ministry of the Interior. Article 14 carries the standard restriction: proposals to and
      attendance at the Council of Ministers "χωρίς να συμμετέχει στη διαδικασία λήψης
      αποφάσεων". Article 20 does not itself commence the law — it provides that the Law comes
      into force on a date fixed by the Council of Ministers by notification in the Official
      Gazette, and that different dates may be fixed for different provisions. That
      notification is source kdp-203-2024, and it is where the entity's `valid_from` comes
      from. Amended by 51(I)/2026. Same provenance caveat as ee-4616-2017-yfyp-naftilias.

  - id: ee-4968-2023-yfyp-evropaikon
    tier: 1
    type: official_gazette
    publisher: >-
      Κυπριακή Δημοκρατία — Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας, Παράρτημα Πρώτο,
      Μέρος Ι
    title: >-
      Ν. 119(Ι)/2023 — Ο περί Υφυπουργού παρά τω Προέδρω για Ευρωπαϊκά Θέματα (Προσωρινές
      Διατάξεις) Νόμος του 2023 (Ε.Ε. Παρ. Ι(Ι), Αρ. 4968, 1.12.2023)
    url: http://www.cylaw.org/nomoi/arith/2023_1_119.pdf
    archive_url: https://web.archive.org/web/20250803192431/http://www.cylaw.org/nomoi/arith/2023_1_119.pdf
    lang: el
    published: 2023-12-01
    accessed: 2026-07-28
    quote: >-
      Ο περί Υφυπουργού παρά τω Προέδρω για Ευρωπαϊκά Θέματα (Προσωρινές Διατάξεις) Νόμος του
      2023 εκδίδεται με δημοσίευση στην Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας σύμφωνα με
      το Άρθρο 52 του Συντάγματος.
    note: >-
      The instrument behind the one post in this file with an expiry date. Note what its title
      says and does not say: it provides for the appointment of a Υφυπουργός παρά τω Προέδρω
      for European Affairs, not for the establishment of a Υφυπουργείο. There is no Deputy
      Ministry of European Affairs, which is why this entity is recorded as a post rather than
      a department and carries no url. The law is expressly one of "Προσωρινές Διατάξεις",
      temporary provisions, enacted ahead of Cyprus's Presidency of the Council of the
      European Union in the first half of 2026; it repeats the pattern of law 123(I)/2011,
      which created the equivalent post for the 2012 Presidency and has since lapsed. Article
      9 provides that the Law comes into force on a date fixed by decision of the Council of
      Ministers published in the Official Gazette "και λήγει την 31η Ιουλίου 2026" — and
      expires on 31 July 2026. That is the source of the entity's `valid_to`. Article 4 sets
      the Deputy Minister's competences "χωρίς επηρεασμό των εξουσιών του Υπουργικού
      Συμβουλίου και των υπουργών της Δημοκρατίας", without prejudice to the powers of the
      Council of Ministers and the ministers of the Republic. The consolidated-legislation
      index records no amendment to this law, so nothing had extended it on the access date.
      Same provenance caveat as ee-4616-2017-yfyp-naftilias.

  - id: ee-4889-2022-metonomasia-paideias
    tier: 1
    type: official_gazette
    publisher: >-
      Κυπριακή Δημοκρατία — Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας, Παράρτημα Πρώτο,
      Μέρος Ι
    title: >-
      Ν. 56(Ι)/2022 — Ο περί Μετονομασίας του Υπουργείου Παιδείας, Πολιτισμού, Αθλητισμού και
      Νεολαίας Νόμος του 2022 (Ε.Ε. Παρ. Ι(Ι), Αρ. 4889, 20.4.2022)
    url: http://www.cylaw.org/nomoi/arith/2022_1_056.pdf
    archive_url: https://web.archive.org/web/20260317000509/http://www.cylaw.org/nomoi/arith/2022_1_056.pdf
    lang: el
    published: 2022-04-20
    accessed: 2026-07-28
    quote: >-
      ΕΠΕΙΔΗ, το Υπουργικό Συμβούλιο με την Απόφασή του ημερομηνίας 8 Ιουλίου 2020 ενέκρινε τη
      δημιουργία του Υφυπουργείου Πολιτισμού, ΚΑΙ ΕΠΕΙΔΗ, το Υπουργικό Συμβούλιο με την
      Απόφασή του ημερομηνίας 10 Μαρτίου 2021 ενέκρινε τη μετονομασία του Υπουργείου Παιδείας,
      Πολιτισμού, Αθλητισμού και Νεολαίας σε Υπουργείο Παιδείας, Αθλητισμού και Νεολαίας,
    note: >-
      The legal instrument that gives the Ministry of Education, Sport and Youth its present
      name, and therefore the tier-1 basis for that entity. Its preamble is quoted rather than
      its operative article because the preamble is continuous in the Gazette's layout while
      article 2 is interleaved with the marginal rubric; the preamble carries the same content
      and rather more context, recording that the Council of Ministers approved the creation
      of the Deputy Ministry of Culture on 8 July 2020 and the consequent renaming of the
      ministry on 10 March 2021. Article 2(1) then enacts that "Το Υπουργείο Παιδείας,
      Πολιτισμού, Αθλητισμού και Νεολαίας μετονομάζεται σε Υπουργείο Παιδείας, Αθλητισμού και
      Νεολαίας", article 3 repeals the previous renaming law 94(I)/2019, and article 4 brings
      it into force on a date before 1 July 2022 fixed by the Council of Ministers. This is the
      clearest illustration in the file of how the two tiers of Cypriot department interact: a
      policy area leaves a ministry, a Deputy Ministry is created to hold it, and the ministry
      is renamed by statute to match. Same provenance caveat as ee-4616-2017-yfyp-naftilias.

  - id: ee-4679-2018-metonomasia-energeias
    tier: 1
    type: official_gazette
    publisher: >-
      Κυπριακή Δημοκρατία — Επίσημη Εφημερίδα της Κυπριακής Δημοκρατίας, Παράρτημα Πρώτο,
      Μέρος Ι
    title: >-
      Ν. 151(Ι)/2018 — Ο περί Μετονομασίας του Υπουργείου Ενέργειας, Εμπορίου, Βιομηχανίας και
      Τουρισμού Νόμος του 2018 (Ε.Ε. Παρ. Ι(Ι), Αρ. 4679, 19.12.2018)
    url: http://www.cylaw.org/nomoi/arith/2018_1_151.pdf
    archive_url: https://web.archive.org/web/20241203140333/http://www.cylaw.org/nomoi/arith/2018_1_151.pdf
    lang: el
    published: 2018-12-19
    accessed: 2026-07-28
    quote: >-
      (2) Οπουδήποτε σε οποιοδήποτε νόμο ή κανονισμούς ή διάταγμα, γίνεται αναφορά στο
      «Υπουργείο Ενέργειας, Εμπορίου, Βιομηχανίας και Τουρισμού» και στον «Υπουργό Ενέργειας,
      Εμπορίου, Βιομηχανίας και Τουρισμού» θα λογίζεται ότι είναι αναφορά στο «Υπουργείο
      Ενέργειας, Εμπορίου και Βιομηχανίας» και στον «Υπουργό Ενέργειας, Εμπορίου και
      Βιομηχανίας», αντίστοιχα.
    note: >-
      The legal instrument that gives the Ministry of Energy, Commerce and Industry its
      present name, and the tier-1 basis for that entity. Article 2(2) is quoted because it
      names both the old and the new name in one continuous passage clear of the Gazette's
      marginal rubric; article 2(1), which is interleaved with the rubric, enacts the renaming
      itself. Article 3 repeals the earlier renaming law 57(Ι)/2013 and article 4 brings this
      one into force on 2 January 2019 — the day after the Deputy Ministry of Tourism began
      operating, which is the point: tourism left this ministry for the new Deputy Ministry
      and the ministry's name was corrected by statute to follow. Same provenance caveat as
      ee-4616-2017-yfyp-naftilias.

  - id: kdp-203-2024
    tier: 3
    type: other
    publisher: >-
      Κυπριακή Δημοκρατία — Υπουργός Εσωτερικών, γνωστοποίηση δημοσιευθείσα στην Επίσημη
      Εφημερίδα (Παράρτημα Τρίτο(Ι))
    title: >-
      Κ.Δ.Π. 203/2024 — Γνωστοποίηση με βάση το άρθρο 20 του περί Ίδρυσης Υφυπουργείου
      Μετανάστευσης και Διεθνούς Προστασίας και Συναφών Θεμάτων Νόμου του 2024 (Ε.Ε. Παρ.
      ΙΙΙ(Ι), Αρ. 5876, 7.6.2024)
    url: http://www.cylaw.org/KDP/data/2024_1_203.pdf
    archive_url: null
    lang: el
    published: 2024-06-07
    accessed: 2026-07-28
    quote: >-
      Με την παρούσα, ο Υπουργός Εσωτερικών γνωστοποιεί την 17η Ιουνίου 2024 ως την
      ημερομηνία έναρξης της ισχύος του περί Ίδρυσης Υφυπουργείου Μετανάστευσης και Διεθνούς
      Προστασίας και Συναφών Θεμάτων Νόμου του 2024, πλην του άρθρου 6(3) του εν λόγω Νόμου.
    note: >-
      The commencement notification, and the source of `valid_from: 2024-06-17` on the Deputy
      Ministry of Migration and International Protection. Law 23(I)/2024 did not commence on
      publication: article 20 left the date to the Council of Ministers, and this notification
      by the Minister of the Interior fixed 17 June 2024 for the whole Law except article 6(3),
      for which it fixed 1 January 2025. Recorded at tier 3, deliberately, and the tier is the
      honest one rather than the flattering one. The document itself is a regulatory
      administrative act published in the third annex of the Official Gazette, which would be
      tier 1; but no archived copy of an official original could be obtained — Archive.org's
      Save Page Now was returning HTTP 520 for every URL throughout the access date, and no
      Wayback capture of this PDF exists — and the only copy available is a third party's,
      hosted by cylaw.org. Claiming tier 1 would have required an archived snapshot the
      project could not produce; claiming tier 2 would have described a bar association as the
      government. Tier 3 requires no archive, and because this entity is not a counted
      ministry the rule that no counted ministry may rest only on a tier-3 source is not
      engaged. A future curator with a working archive should re-cite this at tier 1. The live
      URL served the quoted text, as a readable PDF of the Gazette page, on the access date.

entities:
  - id: CY-2023-exoterikon
    order: 1
    name_original: Υπουργείο Εξωτερικών
    abbreviation_original: null
    name_en: Ministry of Foreign Affairs
    name_es: Ministerio de Asuntos Exteriores
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [foreign_affairs, european_affairs]
    counts_as_ministry: true
    url: https://www.gov.cy/mfa/
    sources: [syntagma-1960, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        First in the Republic's order of precedence, and one of the three departments the
        Constitution itself names: article 46 reserves one of foreign affairs, defence or
        finance to a Turkish Cypriot minister, which is why those three and no others rest on
        a tier-1 instrument in this file. The european_affairs area is tagged here because the
        ministry runs Cyprus's EU business, but note that a separate Deputy Minister for
        European Affairs sits in the Presidency on a temporary statute — recorded further down
        this list — and coordinated the 2026 Council Presidency.
      es: >-
        Primero en el orden de precedencia de la República, y uno de los tres departamentos
        que nombra la propia Constitución: el artículo 46 reserva a un ministro turcochipriota
        uno de los de asuntos exteriores, defensa o hacienda, y por eso esos tres y no otros
        se apoyan aquí en un instrumento de nivel 1. El área european_affairs se etiqueta aquí
        porque el ministerio gestiona los asuntos europeos de Chipre, pero conviene notar que
        un viceministro para Asuntos Europeos aparte, con ley temporal, reside en la
        Presidencia —registrado más abajo— y coordinó la Presidencia del Consejo de 2026.

  - id: CY-2023-oikonomikon
    order: 2
    name_original: Υπουργείο Οικονομικών
    abbreviation_original: null
    name_en: Ministry of Finance
    name_es: Ministerio de Hacienda
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [finance, budget, economy, public_administration]
    counts_as_ministry: true
    url: https://www.gov.cy/mof/
    sources: [syntagma-1960, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        Named in article 46 of the Constitution, hence tier 1. Tagged with
        public_administration, which in most countries in this dataset sits in an interior or
        public-administration ministry: in Cyprus the Public Administration and Personnel
        Department and the Cyprus Academy of Public Administration are under Finance, not
        under Εσωτερικών. Every Deputy Ministry's budget is also submitted through this
        minister, which is one of the features that makes the deputy ministries look like
        departments in their own right.
      es: >-
        Nombrado en el artículo 46 de la Constitución, de ahí el nivel 1. Se etiqueta con
        public_administration, que en la mayoría de los países de este conjunto reside en un
        ministerio de interior o de administración pública: en Chipre el Departamento de
        Administración Pública y Personal y la Academia Chipriota de Administración Pública
        dependen de Hacienda y no de Εσωτερικών. El presupuesto de cada Viceministerio se
        presenta también a través de este ministro, uno de los rasgos que hace que los
        viceministerios parezcan departamentos de pleno derecho.

  - id: CY-2023-esoterikon
    order: 3
    name_original: Υπουργείο Εσωτερικών
    abbreviation_original: null
    name_en: Ministry of Interior
    name_es: Ministerio del Interior
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [territorial_administration, spatial_planning, housing]
    counts_as_ministry: true
    url: https://www.gov.cy/moi/
    sources: [pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        Not the police ministry, and not tagged with the interior policy area for that reason:
        policing and public order belong to the Ministry of Justice and Public Order, the same
        split Greece has. What this department does run, on the government's own directory, is
        the District Administrations, the Civil Registry and Migration archive, the Lands and
        Surveys Department, the Town Planning and Housing Department, elections and civil
        defence — hence territorial_administration, spatial_planning and housing. Migration
        was its largest remaining area until 2024, when the Migration Department and the Asylum
        Service were transferred to the new Deputy Ministry of Migration and International
        Protection; the migration area is therefore no longer tagged here, and because that
        Deputy Ministry is not counted, Cyprus registers no migration ministry at all. One of
        the six ministries with no constituting or renaming statute, so it rests on tier 2.
      es: >-
        No es el ministerio de la policía, y por eso no lleva el área interior: la policía y el
        orden público corresponden al Ministerio de Justicia y Orden Público, la misma
        separación que en Grecia. Lo que sí gestiona, según el directorio del propio Gobierno,
        son las Administraciones Provinciales, el archivo del registro civil y de migración, el
        Departamento de Catastro y Topografía, el Departamento de Urbanismo y Vivienda, las
        elecciones y la defensa civil: de ahí territorial_administration, spatial_planning y
        housing. La migración fue su área remanente más importante hasta 2024, cuando el
        Departamento de Migración y el Servicio de Asilo se transfirieron al nuevo
        Viceministerio de Migración y Protección Internacional; el área migration ya no se
        etiqueta aquí y, como ese Viceministerio no se cuenta, Chipre no registra ningún
        ministerio de migración. Es uno de los seis ministerios sin ley de creación o cambio de
        nombre, así que se apoya en nivel 2.

  - id: CY-2023-amynas
    order: 4
    name_original: Υπουργείο Άμυνας
    abbreviation_original: null
    name_en: Ministry of Defence
    name_es: Ministerio de Defensa
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [defence]
    counts_as_ministry: true
    url: https://www.gov.cy/mod/
    sources: [syntagma-1960, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        The third of the departments named in article 46 of the Constitution. Responsible for
        the National Guard and for compulsory military service, which article 47(ζ) makes a
        matter for the President and the Vice-President acting jointly.
      es: >-
        El tercero de los departamentos nombrados en el artículo 46 de la Constitución.
        Responsable de la Guardia Nacional y del servicio militar obligatorio, que el artículo
        47(ζ) atribuye al Presidente y al Vicepresidente actuando conjuntamente.

  - id: CY-2023-paideias-athlitismou-neolaias
    order: 5
    name_original: Υπουργείο Παιδείας, Αθλητισμού και Νεολαίας
    abbreviation_original: null
    name_en: Ministry of Education, Sport and Youth
    name_es: Ministerio de Educación, Deporte y Juventud
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [education, higher_education, vocational_training, sport, youth]
    counts_as_ministry: true
    url: https://www.gov.cy/moec/
    sources: [ee-4889-2022-metonomasia-paideias, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        Culture is not here. Until 2022 this was the Ministry of Education, Culture, Sport and
        Youth; law 56(I)/2022 renamed it when the Cultural Services, the Department of
        Antiquities and the State Archive left for the new Deputy Ministry of Culture. That
        renaming statute is why this is one of only five ministries in the file resting on a
        tier-1 instrument. The culture policy area is consequently tagged to no counted Cypriot
        ministry — see the methodology note on the cost of the Deputy Ministries decision.
      es: >-
        La cultura no está aquí. Hasta 2022 este era el Ministerio de Educación, Cultura,
        Deporte y Juventud; la ley 56(I)/2022 lo renombró cuando los Servicios Culturales, el
        Departamento de Antigüedades y el Archivo del Estado pasaron al nuevo Viceministerio de
        Cultura. Esa ley de cambio de nombre es la razón por la que este es uno de los solo
        cinco ministerios del fichero apoyados en un instrumento de nivel 1. En consecuencia,
        el área culture no queda etiquetada en ningún ministerio chipriota contado: véase la
        nota metodológica sobre el coste de la decisión de los Viceministerios.

  - id: CY-2023-metaforon-epikoinonion-ergon
    order: 6
    name_original: Υπουργείο Μεταφορών, Επικοινωνιών και Έργων
    abbreviation_original: null
    name_en: Ministry of Transport, Communications and Works
    name_es: Ministerio de Transportes, Comunicaciones y Obras
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [transport, infrastructure, telecommunications]
    counts_as_ministry: true
    url: https://www.gov.cy/mtcw/
    sources: [pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        The department that has lost most to the deputy-ministry tier. Merchant shipping left
        it in 2018 to become the Shipping Deputy Ministry, and electronic communications left
        it in 2020 for the Deputy Ministry of Research, Innovation and Digital Policy; the
        shipping policy area is therefore not tagged here and is tagged to no counted Cypriot
        ministry. Telecommunications is retained because postal services and transport
        telematics remain, but a reader comparing digital or shipping portfolios should read
        the methodology notes. Another of the six ministries with no naming statute: tier 2.
      es: >-
        El departamento que más ha perdido en favor del nivel de los viceministerios. La marina
        mercante lo dejó en 2018 para convertirse en el Viceministerio de Marina Mercante, y
        las comunicaciones electrónicas en 2020 para el Viceministerio de Investigación,
        Innovación y Política Digital; el área shipping no se etiqueta aquí y no queda
        etiquetada en ningún ministerio chipriota contado. Se mantiene telecommunications
        porque siguen los servicios postales y la telemática del transporte, pero quien compare
        carteras digitales o de marina mercante debería leer las notas metodológicas. Otro de
        los seis ministerios sin ley de nombre: nivel 2.

  - id: CY-2023-energeias-emporiou-viomichanias
    order: 7
    name_original: Υπουργείο Ενέργειας, Εμπορίου και Βιομηχανίας
    abbreviation_original: null
    name_en: Ministry of Energy, Commerce and Industry
    name_es: Ministerio de Energía, Comercio e Industria
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [energy, trade, industry, consumer_protection]
    counts_as_ministry: true
    url: https://www.gov.cy/meci/
    sources: [ee-4679-2018-metonomasia-energeias, pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        Tourism is not here. Until the end of 2018 this was the Ministry of Energy, Commerce,
        Industry and Tourism; law 151(I)/2018 renamed it with effect from 2 January 2019, the
        day after the Deputy Ministry of Tourism began operating. That statute is its tier-1
        basis. It keeps the Registrar of Companies and Intellectual Property, the Consumer
        Protection Service and the Cyprus Organisation for Standardisation, hence
        consumer_protection; the tourism policy area is tagged to no counted Cypriot ministry.
      es: >-
        El turismo no está aquí. Hasta finales de 2018 este era el Ministerio de Energía,
        Comercio, Industria y Turismo; la ley 151(I)/2018 lo renombró con efecto desde el 2 de
        enero de 2019, un día después de que empezara a operar el Viceministerio de Turismo.
        Esa ley es su base de nivel 1. Conserva el Registro de Sociedades y Propiedad
        Intelectual, el Servicio de Protección del Consumidor y el Organismo Chipriota de
        Normalización, de ahí consumer_protection; el área tourism no queda etiquetada en
        ningún ministerio chipriota contado.

  - id: CY-2023-georgias-agrotikis-anaptyxis-perivallontos
    order: 8
    name_original: Υπουργείο Γεωργίας, Αγροτικής Ανάπτυξης και Περιβάλλοντος
    abbreviation_original: null
    name_en: Ministry of Agriculture, Rural Development and Environment
    name_es: Ministerio de Agricultura, Desarrollo Rural y Medio Ambiente
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [agriculture, rural_development, environment, water, fisheries, forestry]
    counts_as_ministry: true
    url: https://www.gov.cy/moa/
    sources: [pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        A broad portfolio: the Departments of Agriculture, of Forests, of Fisheries and Marine
        Research, of Environment, of Geological Survey and of Water Development, plus the
        Veterinary Services and the Agricultural Research Institute. Fisheries are tagged here
        rather than to shipping, as in Greece, because the Republic treats fisheries and
        marine research as an agriculture department while the Shipping Deputy Ministry handles
        merchant shipping and the registry. Climate is deliberately not tagged: Cyprus has no
        climate department and climate work sits inside the Department of Environment, so
        tagging it would overstate the structure. Tier 2 — no naming statute in force could be
        found; the 1994 law that renamed the former Ministry of Agriculture and Natural
        Resources does not produce the present name, and the only instrument found naming this
        ministry does so incidentally, while renaming its Mines Service.
      es: >-
        Cartera amplia: los Departamentos de Agricultura, de Bosques, de Pesca e Investigación
        Marina, de Medio Ambiente, de Estudios Geológicos y de Desarrollo Hidráulico, más los
        Servicios Veterinarios y el Instituto de Investigación Agrícola. La pesca se etiqueta
        aquí y no en marina mercante, como en Grecia, porque la República trata la pesca y la
        investigación marina como departamento agrícola mientras el Viceministerio de Marina
        Mercante se ocupa de la marina mercante y del registro. El clima no se etiqueta
        deliberadamente: Chipre no tiene departamento de clima y esa labor reside dentro del
        Departamento de Medio Ambiente, de modo que etiquetarlo exageraría la estructura. Nivel
        2: no se encontró ley de nombre en vigor; la ley de 1994 que renombró el antiguo
        Ministerio de Agricultura y Recursos Naturales no produce el nombre actual, y el único
        instrumento hallado que nombra este ministerio lo hace de pasada, al renombrar su
        Servicio de Minas.

  - id: CY-2023-ergasias-koinonikon-asfaliseon
    order: 9
    name_original: Υπουργείο Εργασίας και Κοινωνικών Ασφαλίσεων
    abbreviation_original: null
    name_en: Ministry of Labour and Social Insurance
    name_es: Ministerio de Trabajo y Seguros Sociales
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [labour, social_security]
    counts_as_ministry: true
    url: https://www.gov.cy/mlsi/
    sources: [pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        Welfare is not here, and the name records the fact. Law 48(I)/2014 had renamed this
        department Υπουργείο Εργασίας, Προνοίας και Κοινωνικών Ασφαλίσεων — Labour, Welfare and
        Social Insurance — and the welfare half left in 2021 for the Deputy Ministry of Social
        Welfare, after which the present shorter name came back into use. No statute
        implementing that reversion could be found: law 89(I)/2021 does not rename the
        ministry, and the consolidated index records no later renaming law. So the current name
        rests on the government's own publications, at tier 2, and this is the clearest single
        example of why Cyprus cannot be graded A. The social_affairs policy area is tagged to
        no counted Cypriot ministry.
      es: >-
        El bienestar social no está aquí, y el nombre lo registra. La ley 48(I)/2014 había
        renombrado este departamento Υπουργείο Εργασίας, Προνοίας και Κοινωνικών Ασφαλίσεων
        —Trabajo, Bienestar y Seguros Sociales— y la mitad de bienestar se marchó en 2021 al
        Viceministerio de Bienestar Social, tras lo cual volvió a usarse el nombre corto
        actual. No se encontró ley que aplicara esa reversión: la ley 89(I)/2021 no renombra el
        ministerio, y el índice consolidado no registra ninguna ley posterior de cambio de
        nombre. Así que el nombre actual se apoya en las publicaciones del propio Gobierno, en
        nivel 2, y es el ejemplo más claro de por qué Chipre no puede recibir un grado A. El
        área social_affairs no queda etiquetada en ningún ministerio chipriota contado.

  - id: CY-2023-dikaiosynis-dimosias-taxeos
    order: 10
    name_original: Υπουργείο Δικαιοσύνης και Δημοσίας Τάξεως
    abbreviation_original: null
    name_en: Ministry of Justice and Public Order
    name_es: Ministerio de Justicia y Orden Público
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Υπουργός
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [justice, interior]
    counts_as_ministry: true
    url: https://www.gov.cy/mjpo/
    sources: [pio-diaveveosi-2023-03-01, govcy-kyvernisi-en, govcy-istoselides-el]
    note:
      en: >-
        The department responsible for the Cyprus Police, prisons and public order as well as
        for justice, which is why it carries the interior policy area even though the ministry
        called "of the Interior" in Cyprus is a different department. A comparison that maps
        "interior" onto policing will misread Cyprus in the same way it misreads Greece. Two
        source notes. The Greek name is spelled Δημοσίας Τάξεως in the 1993 statute that
        created it, in the Press and Information Office's precedence list and in the
        government's website directory, but Δημόσιας Τάξεως on the Presidency's composition
        page; the statutory spelling is used here. And although a renaming statute does exist —
        law 20(I)/1993, which provided that references to the Ministry of Justice are to be
        read as references to the Ministry of Justice and Public Order — it is not cited as a
        tier-1 source: the only archived copy is a 1993 scan whose optical character
        recognition garbles the operative article, and a citation whose quote cannot be
        checked against the document is worse than none. This ministry therefore rests on tier
        2.
      es: >-
        El departamento responsable de la Policía de Chipre, las prisiones y el orden público
        además de la justicia, y por eso lleva el área interior aunque el ministerio que en
        Chipre se llama «del Interior» sea otro departamento. Una comparación que asocie
        «interior» con policía leerá mal a Chipre igual que lee mal a Grecia. Dos notas de
        fuente. El nombre griego se escribe Δημοσίας Τάξεως en la ley de 1993 que lo creó, en
        la lista de precedencia del Gabinete de Prensa e Información y en el directorio web del
        Gobierno, pero Δημόσιας Τάξεως en la página de composición de la Presidencia; aquí se
        usa la grafía legal. Y aunque existe una ley de cambio de nombre —la 20(I)/1993, que
        dispuso que las referencias al Ministerio de Justicia se entiendan hechas al Ministerio
        de Justicia y Orden Público—, no se cita como fuente de nivel 1: la única copia
        archivada es un escaneo de 1993 cuyo reconocimiento óptico de caracteres corrompe el
        artículo operativo, y una cita cuyo texto no puede comprobarse contra el documento es
        peor que ninguna. Este ministerio se apoya por tanto en nivel 2.

  - id: CY-2023-ygeias
    order: 11
    name_original: Υπουργείο Υγείας
