      and the Chancellery's own newsroom shows the same Chancellor acting on 27 July 2026.

entities:
  # --- the 13 Bundesministerien of § 1 Abs. 1 BMG, in the statute's own order ----------
  - id: AT-2025-bundeskanzleramt
    order: 1
    name_original: Bundeskanzleramt
    abbreviation_original: BKA
    name_en: Federal Chancellery
    name_es: Cancillería Federal
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundeskanzler
    head_title_en: Federal Chancellor
    has_cabinet_seat: true
    policy_areas: [government_coordination, public_administration, digital, european_affairs, family, youth, religion]
    counts_as_ministry: true
    url: https://www.bundeskanzleramt.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bvg-art-77, bvg-art-69, bka-bundesministerien]
    note:
      en: >-
        The single most consequential judgement in this file, and it goes the other way from
        the German one: counted, which is why Austria is published as 13 and not 12. Item 1
        of § 1 Abs. 1 BMG says "Bundesministerien im Sinne des Art. 77 B-VG sind: 1. das
        Bundeskanzleramt", and Article 77 Abs. 3 B-VG speaks of "der Leitung der anderen
        Bundesministerien", so both the statute and the Constitution class it as one of the
        ministries rather than as something adjacent to them. It is also not a bare apex
        office: section A of the Annex to § 2 gives it twenty-nine numbered competences of
        its own, including the constitutional service, the law of the civil service, digital
        government, religious affairs, the recognised ethnic groups, family policy, youth
        policy outside school, alternative civilian service and integration — subject matter
        that in most European cabinets sits in a named department. The tagged areas follow
        those items; integration and Volksgruppen are untagged only because the project's
        vocabulary has no id for them, which is recorded in the methodology notes. The
        contrary argument is real and is stated there too: this is the office of the head of
        government, led by the Chancellor in person, and the project's default is to exclude
        such an office, as it does for Spain's Presidencia del Gobierno and for the German
        Bundeskanzleramt. Read that way, every Austrian ministry figure on this site falls by
        one, to 12. The seat recorded here is the Chancellor's own; the federal minister who
        runs part of this ministry's business is recorded separately below and holds her own
        seat, so no seat is double-counted and head_count stays at 1.
      es: >-
        El juicio de mayor consecuencia de este fichero, y se resuelve al contrario que el
        alemán: se cuenta, y por eso Austria se publica como 13 y no como 12. El punto 1 del
        § 1 Abs. 1 BMG dice «Bundesministerien im Sinne des Art. 77 B-VG sind: 1. das
        Bundeskanzleramt», y el artículo 77 Abs. 3 B-VG habla de «der Leitung der anderen
        Bundesministerien», de modo que tanto la ley como la Constitución lo clasifican como
        uno de los ministerios y no como algo contiguo a ellos. Tampoco es una simple
        oficina de cúspide: la sección A del Anexo al § 2 le atribuye veintinueve
        competencias numeradas propias, entre ellas el servicio constitucional, el derecho
        de la función pública, la administración digital, los asuntos religiosos, los grupos
        étnicos reconocidos, la política de familia, la política de juventud extraescolar,
        el servicio civil sustitutorio y la integración: materias que en la mayoría de los
        gabinetes europeos residen en un departamento con nombre propio. Las áreas
        etiquetadas siguen esos puntos; integración y Volksgruppen quedan sin etiquetar sólo
        porque el vocabulario del proyecto no tiene identificador para ellas, lo que consta
        en las notas metodológicas. El argumento contrario es real y también consta allí:
        esta es la oficina del jefe de gobierno, dirigida por el canciller en persona, y el
        criterio por defecto del proyecto es excluirla, como hace con la Presidencia del
        Gobierno española y con el Bundeskanzleramt alemán. Leído así, toda cifra austriaca
        de ministerios de este sitio baja en uno, a 12. El asiento que aquí se registra es el
        del propio canciller; la ministra federal que dirige parte de los asuntos de este
        ministerio se registra aparte más abajo y ocupa su propio asiento, por lo que ningún
        asiento se cuenta dos veces y head_count queda en 1.

  - id: AT-2025-wohnen-kunst-kultur-medien-sport
    order: 2
    name_original: Bundesministerium für Wohnen, Kunst, Kultur, Medien und Sport
    abbreviation_original: BMWKMS
    name_en: Federal Ministry for Housing, Art, Culture, Media and Sport
    name_es: Ministerio Federal de Vivienda, Arte, Cultura, Medios y Deporte
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [housing, culture, media, telecommunications, sport]
    counts_as_ministry: true
    valid_from: 2025-04-01
    url: https://www.bmwkms.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bgbl-2025-i-10-bmg-novelle, bka-bundesministerien, bka-mitglieder-bundesregierung]
    note:
      en: >-
        Created in this form on 1 April 2025 by the Bundesministeriengesetz-Novelle 2025,
        which took the former Bundesministerium für Kunst, Kultur, öffentlichen Dienst und
        Sport, moved the civil service out of it to the Bundeskanzleramt, and moved housing
        and media in. Its minister is also Vice-Chancellor in this cabinet: a personal
        office attached to a serving minister, not a department, so it adds neither a
        ministry nor a cabinet seat and is not recorded as an entity. The housing tag needs
        reading with care — the Annex gives this ministry only "Koordination in
        Angelegenheiten der nationalen und internationalen Wohnungspolitik" and building
        coordination, while the substantive Bau-, Wohnungs- und Siedlungswesen and the
        Wohnbauförderung stayed with the economy ministry, so Austria has a ministry named
        for housing and a different ministry holding most of the housing law. Culture covers
        art, the Bundestheater, film funding, museums, monument protection and public
        libraries; Austria has no separate culture ministry. Telecommunications is tagged
        because the Annex assigns it the regulation of posts and telecommunications, which
        sits oddly next to sport and is the residue of an older ministry's remit.
      es: >-
        Creado en esta forma el 1 de abril de 2025 por la Bundesministeriengesetz-Novelle
        2025, que tomó el anterior Bundesministerium für Kunst, Kultur, öffentlichen Dienst
        und Sport, le sacó la función pública hacia el Bundeskanzleramt y le incorporó
        vivienda y medios. Su titular es además vicecanciller en este gabinete: cargo
        personal adscrito a un ministro en ejercicio, no departamento, por lo que no añade ni
        ministerio ni asiento y no se registra como entidad. La etiqueta de vivienda hay que
        leerla con cuidado: el Anexo le da sólo la «Koordination in Angelegenheiten der
        nationalen und internationalen Wohnungspolitik» y la coordinación de la
        construcción, mientras que el Bau-, Wohnungs- und Siedlungswesen sustantivo y la
        Wohnbauförderung se quedaron en el ministerio de Economía, de modo que Austria tiene
        un ministerio que lleva el nombre de la vivienda y otro distinto que ostenta la mayor
        parte de su derecho. Cultura abarca arte, los Bundestheater, el fomento del cine, los
        museos, la protección de monumentos y las bibliotecas públicas; Austria no tiene
        ministerio de Cultura separado. Se etiqueta telecomunicaciones porque el Anexo le
        asigna la regulación de correos y telecomunicaciones, que casa mal con el deporte y
        es el residuo del ámbito de un ministerio anterior.

  - id: AT-2025-europaeische-internationale-angelegenheiten
    order: 3
    name_original: Bundesministerium für europäische und internationale Angelegenheiten
    abbreviation_original: BMEIA
    name_en: Federal Ministry for European and International Affairs
    name_es: Ministerio Federal de Asuntos Europeos e Internacionales
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesministerin
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [foreign_affairs, european_affairs, development_cooperation, public_administration]
    counts_as_ministry: true
    url: https://www.bmeia.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bka-bundesministerien]
    note:
      en: >-
        Austria's foreign ministry, and one of the six departments whose statutory
        designation the Bundesministeriengesetz-Novelle 2025 left untouched, which is why it
        carries no valid_from. Section C of the Annex contains only two numbered items. The
        first is foreign affairs in the widest sense — foreign policy, international law,
        treaty negotiation, representation of the Republic, the diplomatic and consular
        network, cultural relations abroad, protection of Austrian citizens abroad, and
        expressly "Angelegenheiten der Entwicklungszusammenarbeit sowie Koordination der
        internationalen Entwicklungspolitik", which is why development cooperation is tagged
        and Austria has no separate development ministry. The second is deregulation and
        cutting red tape, which has nothing to do with foreign affairs and is why
        public_administration is tagged here as well as on the Chancellery; a reader who
        finds that surprising should note that it is one of only two items in the section,
        so it cannot be dismissed as incidental. European affairs are shared with the
        Chancellery by design: the Annex gives the Chancellery the coordination of EU
        business and this ministry the representation of Austrian interests in the Union,
        each in agreement with the other.
      es: >-
        El ministerio de Exteriores austriaco, y uno de los seis departamentos cuya
        denominación legal no tocó la Bundesministeriengesetz-Novelle 2025, y por eso no
        lleva valid_from. La sección C del Anexo contiene sólo dos puntos numerados. El
        primero son los asuntos exteriores en el sentido más amplio —política exterior,
        derecho internacional, negociación de tratados, representación de la República, red
        diplomática y consular, relaciones culturales en el exterior, protección de los
        ciudadanos austriacos en el extranjero— y expresamente «Angelegenheiten der
        Entwicklungszusammenarbeit sowie Koordination der internationalen
        Entwicklungspolitik», motivo por el que se etiqueta cooperación al desarrollo y por
        el que Austria no tiene ministerio de Cooperación separado. El segundo es la
        desregulación y la desburocratización, que nada tiene que ver con la acción exterior
        y es la razón de que se etiquete aquí administración pública además de en la
        Cancillería; a quien le sorprenda conviene recordarle que es uno de los dos únicos
        puntos de la sección, así que no puede despacharse como accesorio. Los asuntos
        europeos se comparten con la Cancillería por diseño: el Anexo da a la Cancillería la
        coordinación de los asuntos de la Unión y a este ministerio la representación de los
        intereses austriacos en ella, cada uno de acuerdo con el otro.

  - id: AT-2025-arbeit-soziales-gesundheit-pflege-konsumentenschutz
    order: 4
    name_original: Bundesministerium für Arbeit, Soziales, Gesundheit, Pflege und Konsumentenschutz
    abbreviation_original: BMASGPK
    name_en: >-
      Federal Ministry of Labour, Social Affairs, Health, Care and Consumer Protection
    name_es: >-
      Ministerio Federal de Trabajo, Asuntos Sociales, Sanidad, Cuidados y Consumo
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesministerin
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [labour, social_affairs, health, social_security, elderly, disability, consumer_protection, food_safety, animal_welfare]
    counts_as_ministry: true
    valid_from: 2025-04-01
    url: https://www.sozialministerium.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bgbl-2025-i-10-bmg-novelle, bka-bundesministerien, bka-mitglieder-bundesregierung]
    note:
      en: >-
        Renamed and enlarged on 1 April 2025: the former Bundesministerium für Soziales,
        Gesundheit, Pflege und Konsumentenschutz gained "Arbeit" at the front of its name
        and, with it, labour law, the labour market and unemployment insurance, which had
        been in the Bundesministerium für Arbeit und Wirtschaft. It is the broadest
        department in this cabinet, and its nine tagged areas are all separately numbered
        items of section D of the Annex. Two of them will surprise a reader scanning for a
        food or an animal ministry: food safety is here because item 15 gives it the
        Nahrungsmittelkontrolle, and animal welfare because item 13 gives it "Allgemeine
        Angelegenheiten des Tierschutzes" alongside veterinary affairs. Pensions are tagged
        as social_security because item 5 covers Sozialversicherung as a whole; ageing is
        tagged because items 7, 8 and 10 give it long-term care provision and policy for
        older people, which in several other cabinets is a ministry of its own.
      es: >-
        Renombrado y ampliado el 1 de abril de 2025: el anterior Bundesministerium für
        Soziales, Gesundheit, Pflege und Konsumentenschutz ganó «Arbeit» al frente de su
        nombre y, con ello, el derecho del trabajo, el mercado laboral y el seguro de
        desempleo, que estaban en el Bundesministerium für Arbeit und Wirtschaft. Es el
        departamento más amplio de este gabinete, y sus nueve áreas etiquetadas son todas
        puntos numerados por separado de la sección D del Anexo. Dos sorprenderán a quien
        busque un ministerio de Alimentación o de Animales: la seguridad alimentaria está
        aquí porque el punto 15 le da la Nahrungsmittelkontrolle, y el bienestar animal
        porque el punto 13 le da las «Allgemeine Angelegenheiten des Tierschutzes» junto a
        los asuntos veterinarios. Las pensiones se etiquetan como seguridad social porque el
        punto 5 cubre la Sozialversicherung en su conjunto; el envejecimiento se etiqueta
        porque los puntos 7, 8 y 10 le dan la previsión de cuidados de larga duración y la
        política de mayores, que en varios otros gabinetes es un ministerio propio.

  - id: AT-2025-bildung
    order: 5
    name_original: Bundesministerium für Bildung
    abbreviation_original: BMB
    name_en: Federal Ministry of Education
    name_es: Ministerio Federal de Educación
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [education]
    counts_as_ministry: true
    valid_from: 2025-04-01
    url: https://www.bmb.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bgbl-2025-i-10-bmg-novelle, bka-bundesministerien, bka-mitglieder-bundesregierung]
    note:
      en: >-
        Reduced to schools on 1 April 2025. The predecessor Bundesministerium für Bildung,
        Wissenschaft und Forschung lost universities and research to the new
        Bundesministerium für Frauen, Wissenschaft und Forschung, and what is left is the
        narrowest section in the Annex: coordination of early-childhood pedagogy, the school
        system including kindergartens and after-school care, the teacher-training
        Pädagogische Hochschulen, school foundations and school mobility programmes. Only
        `education` is tagged even though the Pädagogische Hochschulen are formally tertiary
        institutions, because tagging higher_education here would make Austria appear to have
        two higher-education ministries when the universities are unambiguously elsewhere.
        Vocational training is not tagged either: apprenticeship training is assigned by the
        Annex to the economy ministry, not to this one.
      es: >-
        Reducido a la escuela el 1 de abril de 2025. El predecesor Bundesministerium für
        Bildung, Wissenschaft und Forschung perdió las universidades y la investigación en
        favor del nuevo Bundesministerium für Frauen, Wissenschaft und Forschung, y lo que
        queda es la sección más estrecha del Anexo: coordinación de la pedagogía infantil, el
        sistema escolar incluidas guarderías y centros de día, las Pädagogische Hochschulen
        de formación del profesorado, las fundaciones escolares y los programas escolares de
        movilidad. Se etiqueta sólo `education` aunque las Pädagogische Hochschulen sean
        formalmente instituciones terciarias, porque etiquetar aquí higher_education haría
        parecer que Austria tiene dos ministerios de universidades cuando estas están sin
        ambigüedad en otro. Tampoco se etiqueta formación profesional: el Anexo asigna la
        formación de aprendices al ministerio de Economía, no a este.

  - id: AT-2025-finanzen
    order: 6
    name_original: Bundesministerium für Finanzen
    abbreviation_original: BMF
    name_en: Federal Ministry of Finance
    name_es: Ministerio Federal de Hacienda
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [finance, budget, economy, state_assets, mining]
    counts_as_ministry: true
    url: https://www.bmf.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bka-bundesministerien]
    note:
      en: >-
        One of the six departments the 2025 amendment left named as it was. Section F of the
        Annex is unusually wide for a finance ministry: besides the fiscal constitution, the
        Finanzausgleich between the Federation, the Länder and the municipalities, the
        federal budget and banking, capital-market and insurance supervision, item 5 gives it
        general economic policy "soweit sie nicht in die Zuständigkeit eines anderen
        Bundesministeriums fallen", item 7 the administration and disposal of federal
        property, and item 15 mining. `economy` is therefore tagged here as well as on the
        economy ministry, and `state_assets` here as well as there: in Austria the general
        and the sectoral halves of economic policy, and the property and the enterprise
        halves of state ownership, sit in different departments. Mining is the tag most
        likely to look like a mistake and is not one — "Angelegenheiten des Bergwesens" has
        been a Finance competence since the 2025 amendment moved it.
      es: >-
        Uno de los seis departamentos que la reforma de 2025 dejó con el mismo nombre. La
        sección F del Anexo es inusualmente amplia para un ministerio de Hacienda: además de
        la constitución financiera, el Finanzausgleich entre Federación, Länder y municipios,
        el presupuesto federal y la supervisión bancaria, de mercados de capitales y de
        seguros, el punto 5 le da la política económica general «soweit sie nicht in die
        Zuständigkeit eines anderen Bundesministeriums fallen», el punto 7 la administración
        y disposición del patrimonio federal y el punto 15 la minería. Por eso se etiqueta
        aquí `economy` además de en el ministerio de Economía, y `state_assets` aquí además
        de allí: en Austria las mitades general y sectorial de la política económica, y las
        mitades patrimonial y empresarial de la propiedad estatal, residen en departamentos
        distintos. La minería es la etiqueta que más parece un error y no lo es: las
        «Angelegenheiten des Bergwesens» son competencia de Hacienda desde que la reforma de
        2025 las trasladó.

  - id: AT-2025-frauen-wissenschaft-forschung
    order: 7
    name_original: Bundesministerium für Frauen, Wissenschaft und Forschung
    abbreviation_original: BMFWF
    name_en: Federal Ministry for Women, Science and Research
    name_es: Ministerio Federal de Mujeres, Ciencia e Investigación
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesministerin
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [equality, higher_education, research]
    counts_as_ministry: true
    valid_from: 2025-04-01
    url: https://www.bmfwf.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bgbl-2025-i-10-bmg-novelle, bka-bundesministerien, bka-mitglieder-bundesregierung]
    note:
      en: >-
        A new department, created by the Bundesministeriengesetz-Novelle 2025 with effect
        from 1 April 2025 and inserted into § 1 Abs. 1 as item 7, which is why valid_from is
        set. It joins two remits that were previously apart: women's and equal-treatment
        policy, which had been run from the Bundeskanzleramt, and universities and research,
        which came from the former Bundesministerium für Bildung, Wissenschaft und
        Forschung. Its minister was one of the two sworn in provisionally without a portfolio
        on 3 March 2025, because this department did not exist for the cabinet's first four
        weeks. Higher education covers the public universities, the private universities and
        the Fachhochschulen; research covers the Austrian Science Fund and the Academy of
        Sciences. Equality is tagged first because the ministry's name puts "Frauen" first
        and because the Annex gives it the Gleichbehandlungskommission and the equal
        treatment ombuds office as items of their own.
      es: >-
        Departamento nuevo, creado por la Bundesministeriengesetz-Novelle 2025 con efecto
        desde el 1 de abril de 2025 e insertado en el § 1 Abs. 1 como punto 7, y por eso
        lleva valid_from. Reúne dos ámbitos antes separados: la política de mujeres e
        igualdad de trato, que se dirigía desde el Bundeskanzleramt, y las universidades y la
        investigación, procedentes del anterior Bundesministerium für Bildung, Wissenschaft
        und Forschung. Su titular fue una de las dos juramentadas provisionalmente sin
        cartera el 3 de marzo de 2025, porque este departamento no existió durante las
        primeras cuatro semanas del gabinete. Universidades abarca las universidades
        públicas, las privadas y las Fachhochschulen; investigación abarca el Fondo
        Austriaco de Ciencia y la Academia de Ciencias. La igualdad se etiqueta primero
        porque el nombre del ministerio pone «Frauen» delante y porque el Anexo le asigna la
        Gleichbehandlungskommission y la defensoría de la igualdad de trato como puntos
        propios.

  - id: AT-2025-inneres
    order: 8
    name_original: Bundesministerium für Inneres
    abbreviation_original: BMI
    name_en: Federal Ministry of the Interior
    name_es: Ministerio Federal del Interior
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [interior, migration, civil_protection, territorial_administration, historical_memory]
    counts_as_ministry: true
    url: https://www.bmi.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bka-bundesministerien]
    note:
      en: >-
        Named as it was before the 2025 amendment, hence no valid_from. Item 1 of section H
        carries policing and public security and, within the same item, "Aufenthaltsverbot,
        Ausweisung und Abschiebung; Asyl", the rescue services and the fire brigades,
        national crisis and disaster-response coordination, international disaster relief and
        civil defence — which is why migration and civil protection are both tagged here
        rather than anywhere else. Territorial administration follows items 7 and 8, the
        organisation of the internal administration in the Länder and the affairs of the
        municipalities. Historical memory follows items 10 and 11: the care of war graves and
        the running of the Mauthausen concentration-camp memorial, a competence that in Spain
        sits in a ministry named for democratic memory and in Austria sits with the police
        ministry. Elections are also run from here, under item 6, and are untagged only
        because the project's vocabulary has no id for electoral administration.
      es: >-
        Con el mismo nombre que antes de la reforma de 2025, de ahí que no lleve valid_from.
        El punto 1 de la sección H lleva la policía y la seguridad pública y, dentro del
        mismo punto, «Aufenthaltsverbot, Ausweisung und Abschiebung; Asyl», los servicios de
        rescate y los bomberos, la coordinación estatal de crisis y catástrofes, la ayuda
        internacional en catástrofes y la protección civil: por eso migración y protección
        civil se etiquetan aquí y no en otro sitio. La administración territorial sigue a los
        puntos 7 y 8, la organización de la administración interior en los Länder y los
        asuntos de los municipios. La memoria histórica sigue a los puntos 10 y 11: el
        cuidado de las tumbas de guerra y la gestión del memorial del campo de concentración
        de Mauthausen, competencia que en España reside en un ministerio que lleva la memoria
        democrática en el nombre y en Austria reside en el ministerio de la policía. Las
        elecciones también se dirigen desde aquí, por el punto 6, y quedan sin etiquetar sólo
        porque el vocabulario del proyecto no tiene identificador para la administración
        electoral.

  - id: AT-2025-innovation-mobilitaet-infrastruktur
    order: 9
    name_original: Bundesministerium für Innovation, Mobilität und Infrastruktur
    abbreviation_original: BMIMI
    name_en: Federal Ministry for Innovation, Mobility and Infrastructure
    name_es: Ministerio Federal de Innovación, Movilidad e Infraestructuras
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [innovation, transport, infrastructure, research, space, shipping]
    counts_as_ministry: true
    valid_from: 2025-04-01
    url: https://www.bmimi.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bgbl-2025-i-10-bmg-novelle, bka-bundesministerien, bka-mitglieder-bundesregierung]
    note:
      en: >-
        The other department created on 1 April 2025, and the successor to the largest part
        of the dissolved Bundesministerium für Klimaschutz, Umwelt, Energie, Mobilität,
        Innovation und Technologie. It kept that ministry's transport, infrastructure,
        applied research, patents and space competences; climate, environment and water went
        to the agriculture ministry and energy to the economy ministry. That split is the
        single most consequential structural change of this cabinet's term: Austria had a
        combined climate-and-transport ministry until 31 March 2025 and has not had one
        since. Research is tagged alongside the science ministry because item 11 of section I
        gives this department "Angelegenheiten der wirtschaftlich-technischen Forschung";
        innovation follows the same item and item 12 on industrial property and patents;
        shipping follows item 2 and item 6 on the navigable Danube and the other waterways;
        space follows item 13, "Weltraumangelegenheiten", which is a numbered competence of
        its own.
      es: >-
        El otro departamento creado el 1 de abril de 2025, y sucesor de la mayor parte del
        disuelto Bundesministerium für Klimaschutz, Umwelt, Energie, Mobilität, Innovation
        und Technologie. Conservó de aquel ministerio el transporte, las infraestructuras, la
        investigación aplicada, las patentes y el espacio; clima, medio ambiente y agua
        pasaron al ministerio de Agricultura y la energía al de Economía. Esa escisión es el
        cambio estructural de mayor consecuencia de esta legislatura: Austria tuvo un
        ministerio conjunto de clima y transporte hasta el 31 de marzo de 2025 y no lo ha
        tenido desde entonces. La investigación se etiqueta junto al ministerio de Ciencia
        porque el punto 11 de la sección I da a este departamento las «Angelegenheiten der
        wirtschaftlich-technischen Forschung»; la innovación sigue al mismo punto y al 12,
        sobre propiedad industrial y patentes; la marina mercante sigue a los puntos 2 y 6,
        sobre el Danubio navegable y las demás vías fluviales; el espacio sigue al punto 13,
        «Weltraumangelegenheiten», que es una competencia numerada propia.

  - id: AT-2025-justiz
    order: 10
    name_original: Bundesministerium für Justiz
    abbreviation_original: BMJ
    name_en: Federal Ministry of Justice
    name_es: Ministerio Federal de Justicia
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesministerin
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [justice]
    counts_as_ministry: true
    url: https://www.bmj.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bka-bundesministerien]
    note:
      en: >-
        Named as it was before the 2025 amendment. Section J is long but single-subject:
        civil law, criminal law, the courts, the public prosecution service, enforcement,
        insolvency, the prisons, the bar and the notariat, court fees, and the legal aspects
        of public procurement and of data protection. Only `justice` is tagged, because every
        item is an aspect of the administration of justice; the prosecution service is part
        of this department in Austria rather than an independent body, which is worth knowing
        when comparing with countries where it is not.
      es: >-
        Con el mismo nombre que antes de la reforma de 2025. La sección J es larga pero
        monotemática: derecho civil, derecho penal, los tribunales, el ministerio fiscal, la
        ejecución, la insolvencia, las prisiones, la abogacía y el notariado, las tasas
        judiciales y los aspectos jurídicos de la contratación pública y de la protección de
        datos. Se etiqueta sólo `justice`, porque todos los puntos son aspectos de la
        administración de justicia; en Austria la fiscalía forma parte de este departamento y
        no es un organismo independiente, lo que conviene saber al comparar con países donde
        no es así.

  - id: AT-2025-land-forstwirtschaft-klima-umweltschutz
    order: 11
    name_original: >-
      Bundesministerium für Land- und Forstwirtschaft, Klima- und Umweltschutz, Regionen und
      Wasserwirtschaft
    abbreviation_original: BMLUK
    name_en: >-
      Federal Ministry of Agriculture and Forestry, Climate and Environmental Protection,
      Regions and Water Management
    name_es: >-
      Ministerio Federal de Agricultura y Silvicultura, Clima y Medio Ambiente, Regiones y
      Gestión del Agua
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [agriculture, forestry, climate, environment, water, regional_development, spatial_planning, fisheries]
    counts_as_ministry: true
    valid_from: 2025-04-01
    url: https://www.bmluk.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bgbl-2025-i-10-bmg-novelle, bka-bundesministerien, bka-mitglieder-bundesregierung]
    note:
      en: >-
        Renamed on 1 April 2025: the former Bundesministerium für Land- und Forstwirtschaft,
        Regionen und Wasserwirtschaft took "Klima- und Umweltschutz" into its title and, with
        it, the climate and environment competences of the dissolved climate ministry —
        general climate policy including carbon management, waste management and
        contaminated-land remediation, species protection, nature and landscape
        conservation, radiation protection and nuclear coordination. Austria therefore has no
        environment ministry as such: environmental and climate policy is a second remit of
        the agriculture ministry, which is a comparison a reader should be able to see rather
        than have to infer. Fisheries is tagged from item 14, "Angelegenheiten der Jagd und
        der Fischerei"; the taxonomy's fisheries id covers maritime affairs too, which is
        vacuous for a landlocked state, so it should be read here as inland fishing and
        hunting. Regional development and spatial planning follow items 16 and 17, the
        financial handling of the European Regional Development Fund and the coordination of
        Raumordnung, Raumplanung and Regionalpolitik. Ernährungswesen — food and nutrition
        other than food inspection — is also here, under item 1, but food_safety is tagged on
        the social ministry instead, which holds the Nahrungsmittelkontrolle that the tag
        actually describes.
      es: >-
        Renombrado el 1 de abril de 2025: el anterior Bundesministerium für Land- und
        Forstwirtschaft, Regionen und Wasserwirtschaft incorporó «Klima- und Umweltschutz» a
        su título y, con ello, las competencias de clima y medio ambiente del disuelto
        ministerio de Clima: política climática general incluida la gestión del carbono,
        gestión de residuos y saneamiento de suelos contaminados, protección de especies,
        protección de la naturaleza y del paisaje, protección radiológica y coordinación
        nuclear. Austria no tiene por tanto ministerio de Medio Ambiente como tal: la
        política ambiental y climática es un segundo ámbito del ministerio de Agricultura, y
        es una comparación que el lector debe poder ver y no tener que deducir. La pesca se
        etiqueta desde el punto 14, «Angelegenheiten der Jagd und der Fischerei»; el
        identificador fisheries de la taxonomía abarca también los asuntos marítimos, vacíos
        en un Estado sin litoral, así que aquí debe leerse como pesca continental y caza. El
        desarrollo regional y la ordenación del territorio siguen a los puntos 16 y 17, la
        gestión financiera del Fondo Europeo de Desarrollo Regional y la coordinación de
        Raumordnung, Raumplanung y Regionalpolitik. El Ernährungswesen —alimentación y
        nutrición al margen del control alimentario— también está aquí, en el punto 1, pero
        food_safety se etiqueta en el ministerio de lo social, que ostenta la
        Nahrungsmittelkontrolle que la etiqueta describe realmente.

  - id: AT-2025-landesverteidigung
    order: 12
    name_original: Bundesministerium für Landesverteidigung
    abbreviation_original: BMLV
    name_en: Federal Ministry of Defence
    name_es: Ministerio Federal de Defensa
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesministerin
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [defence]
    counts_as_ministry: true
    url: https://www.bmlv.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bka-bundesministerien]
    note:
      en: >-
        Named as it was before the 2025 amendment. Section L of the Annex is the only one
        with no numbered items at all: it reads simply "Militärische Angelegenheiten",
        followed by a list of particulars covering the Bundesheer's constitutional tasks,
        its operational command, military aviation, armament and procurement, military
        medicine, the attaché service, the Heeresgeschichtliches Museum and the European
        Defence Agency. Only `defence` is tagged. Note that Austria's alternative civilian
        service, the Zivildienst, is not here but in the Bundeskanzleramt, and conscription
        policy therefore straddles two departments.
      es: >-
        Con el mismo nombre que antes de la reforma de 2025. La sección L del Anexo es la
        única sin puntos numerados: dice simplemente «Militärische Angelegenheiten», seguido
        de una relación de particulares que cubre las tareas constitucionales del Bundesheer,
        su mando operativo, la aviación militar, el armamento y la adquisición, la medicina
        militar, el servicio de agregados, el Heeresgeschichtliches Museum y la Agencia
        Europea de Defensa. Se etiqueta sólo `defence`. Nótese que el servicio civil
        sustitutorio austriaco, el Zivildienst, no está aquí sino en el Bundeskanzleramt, de
        modo que la política de reclutamiento se reparte entre dos departamentos.

  - id: AT-2025-wirtschaft-energie-tourismus
    order: 13
    name_original: Bundesministerium für Wirtschaft, Energie und Tourismus
    abbreviation_original: BMWET
    name_en: Federal Ministry for Economy, Energy and Tourism
    name_es: Ministerio Federal de Economía, Energía y Turismo
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister
    head_title_en: Federal Minister
    has_cabinet_seat: true
    policy_areas: [economy, energy, tourism, industry, trade, small_business, vocational_training, housing, state_assets]
    counts_as_ministry: true
    valid_from: 2025-04-01
    url: https://www.bmwet.gv.at
    sources: [ris-bmg-1986-p1, ris-bmg-1986-anlage, bgbl-2025-i-10-bmg-novelle, bka-bundesministerien, bka-mitglieder-bundesregierung]
    note:
      en: >-
        Renamed on 1 April 2025 from Bundesministerium für Arbeit und Wirtschaft: labour left
        for the social ministry and energy arrived from the dissolved climate ministry, which
        is a swap large enough that treating this as the same department under a new name is
        itself a judgement. It keeps the trades and industry, competition and price
        regulation, the internal market, foreign trade policy and the WTO mission, the
        management of federal buildings and land, technical standards and metrology, and the
        state-owned enterprises. Two tags need explaining. Housing is tagged here as well as
        on the ministry named for it, because item 17 gives this department "Angelegenheiten
        des Bau-, Wohnungs- und Siedlungswesens" including the Wohnbauförderung. Vocational
        training is tagged only here, because item 1 gives it the "betriebliche
        Berufsausbildung und Berufsfortbildung" — Austria's apprenticeship system sits with
        economic affairs, not with education.
      es: >-
        Renombrado el 1 de abril de 2025 desde Bundesministerium für Arbeit und Wirtschaft: el
        trabajo se marchó al ministerio de lo social y la energía llegó del disuelto
        ministerio de Clima, un intercambio lo bastante grande como para que tratarlo como el
        mismo departamento con nombre nuevo sea ya un juicio. Conserva el comercio y la
        industria, la competencia y la regulación de precios, el mercado interior, la
        política comercial exterior y la misión ante la OMC, la administración de los
        edificios y terrenos federales, las normas técnicas y la metrología, y las empresas
        públicas. Dos etiquetas requieren explicación. La vivienda se etiqueta aquí además de
        en el ministerio que la lleva en el nombre, porque el punto 17 da a este departamento
        las «Angelegenheiten des Bau-, Wohnungs- und Siedlungswesens», incluida la
        Wohnbauförderung. La formación profesional se etiqueta sólo aquí, porque el punto 1 le
        da la «betriebliche Berufsausbildung und Berufsfortbildung»: el sistema austriaco de
        aprendizaje reside en Economía y no en Educación.

  # --- recorded, not counted: a federal minister with no ministry of her own -----------
  - id: AT-2025-bundesministerin-im-bundeskanzleramt
    order: 14
    name_original: Bundesministerin für Europa, Integration und Familie im Bundeskanzleramt
    abbreviation_original: null
    name_en: >-
      Federal Minister for Europe, Integration and Family in the Federal Chancellery
    name_es: >-
      Ministra Federal de Europa, Integración y Familia en la Cancillería Federal
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesministerin im Bundeskanzleramt
    head_title_en: Federal Minister in the Federal Chancellery
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: minister_without_portfolio
    url: https://www.bundeskanzleramt.gv.at
    sources: [ris-bmg-1986-p1, bvg-art-77, bvg-art-69, bvg-art-78, bgbl-2025-ii-62-entschliessung, bka-mitglieder-bundesregierung]
    note:
      en: >-
        A full member of the Bundesregierung with a cabinet seat and no ministry of her own:
        this is the second half of the Austrian Chancellery problem, and it is what makes 13
        ministries coexist with 14 cabinet seats even though the Chancellery is counted. The
        mechanism is § 1 Abs. 2 BMG and Article 77 Abs. 3 B-VG: the Federal President may
        transfer the sachliche Leitung of specified matters belonging to the Chancellery's
        remit to a separate federal minister, who then holds "die Stellung eines zuständigen
        Bundesministers" for them while the matters remain part of the Chancellery. That
        transfer was made by Entschließung of 8 April 2025, BGBl. II Nr. 62/2025, covering
        European coordination, religious affairs, national minorities, family, youth,
        integration and the Zivildienst. She is recorded as an entity rather than folded into
        the Bundeskanzleramt because she is a distinct person holding a distinct
        appointment; folding her in would have required head_count 2 on the Chancellery and
        would have hidden a real office. She is classified minister_without_portfolio rather
        than head_of_government_office because the Chancellor's own seat is already recorded
        on the Bundeskanzleramt, and because § 1 Abs. 1 does not list her office as a
        fourteenth Bundesministerium — her matters are the Chancellery's. No policy area is
        tagged, because areas are counted only for counted ministries; the areas she runs are
        tagged on the Bundeskanzleramt, which is where the Annex puts them. valid_from is
        deliberately left null even though the Entschließung took effect on 8 April 2025: she
        was appointed a federal minister on 3 March 2025, one of the two sworn in
        provisionally without a portfolio, so her cabinet seat runs from the swearing-in, and
        a valid_from of April would make a replay of March 2025 understate the seats. What
        began in April is the title recorded here, not the seat.
      es: >-
        Miembro pleno de la Bundesregierung con asiento en el gabinete y sin ministerio
        propio: esta es la segunda mitad del problema austriaco de la Cancillería, y es lo
        que hace que 13 ministerios convivan con 14 asientos aunque la Cancillería sí se
        cuente. El mecanismo es el § 1 Abs. 2 BMG y el artículo 77 Abs. 3 B-VG: el presidente
        federal puede transferir la sachliche Leitung de determinadas materias del ámbito de
        la Cancillería a una ministra federal propia, que pasa a tener respecto de ellas «die
        Stellung eines zuständigen Bundesministers» mientras las materias siguen siendo de la
        Cancillería. Esa transferencia se hizo por Entschließung del 8 de abril de 2025, BGBl.
        II Nr. 62/2025, y abarca la coordinación europea, los asuntos religiosos, los grupos
        étnicos, la familia, la juventud, la integración y el Zivildienst. Se registra como
        entidad y no se integra en el Bundeskanzleramt porque es una persona distinta con un
        nombramiento distinto; integrarla habría exigido head_count 2 en la Cancillería y
        habría ocultado un cargo real. Se clasifica como minister_without_portfolio y no como
        head_of_government_office porque el asiento propio del canciller ya está registrado
        en el Bundeskanzleramt y porque el § 1 Abs. 1 no enumera su cargo como decimocuarto
        Bundesministerium: sus materias son las de la Cancillería. No se etiqueta ninguna área
        de política, porque las áreas sólo cuentan para los ministerios contados; las áreas
        que ella dirige se etiquetan en el Bundeskanzleramt, que es donde las sitúa el Anexo.
        valid_from se deja deliberadamente en null aunque la Entschließung entrase en vigor el
        8 de abril de 2025: fue nombrada ministra federal el 3 de marzo de 2025, una de las
        dos juramentadas provisionalmente sin cartera, así que su asiento corre desde la
        juramentación, y un valid_from de abril haría que una reconstrucción de marzo de 2025
        subestimase los asientos. Lo que empezó en abril es el título aquí registrado, no el
        asiento.

  # --- recorded, not counted: the seven Staatssekretäre -------------------------------
  # Listed individually, in the order of the ministry they are attached to, because a
  # reader asking why Austria is not 21 people deserves to see the seven names of the
  # posts rather than a sentence asserting they exist. None holds a cabinet seat.
  - id: AT-2025-staatssekretaer-bundeskanzleramt
    order: 15
    name_original: Staatssekretär im Bundeskanzleramt
    abbreviation_original: null
    name_en: State Secretary in the Federal Chancellery
    name_es: Secretario de Estado en la Cancillería Federal
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Staatssekretär
    head_title_en: State Secretary
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: https://www.bundeskanzleramt.gv.at
    sources: [bvg-art-78, bvg-art-69, bka-mitglieder-bundesregierung]
    note:
      en: >-
        Attached to the Federal Chancellor rather than to a minister, which Article 78 Abs. 2
        B-VG expressly provides for. In practice this post runs the Chancellery's
        digitalisation and public-service innovation business, which is why those areas are
        tagged on the Bundeskanzleramt and not here: policy areas are counted only for
        counted ministries. No cabinet seat, for the reason given in the second methodology
        note.
      es: >-
        Adscrito al canciller federal y no a un ministro, posibilidad que el artículo 78 Abs.
        2 B-VG prevé expresamente. En la práctica este cargo dirige los asuntos de
        digitalización e innovación administrativa de la Cancillería, y por eso esas áreas se
        etiquetan en el Bundeskanzleramt y no aquí: las áreas de política sólo cuentan para
        los ministerios contados. Sin asiento en el gabinete, por la razón expuesta en la
        segunda nota metodológica.

