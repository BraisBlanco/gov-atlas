      en: >-
        Item 2 of § 1 Abs. 1 BMG until 31 March 2025. From 1 April 2025 the same department
        continues as the Bundesministerium für Wohnen, Kunst, Kultur, Medien und Sport, minus
        the civil service, which went to the Bundeskanzleramt, and plus housing and media.
        Recorded for the historical record, with no seat because this file does not
        reconstruct the March 2025 allocation of ministers.
      es: >-
        Punto 2 del § 1 Abs. 1 BMG hasta el 31 de marzo de 2025. Desde el 1 de abril de 2025
        el mismo departamento continúa como Bundesministerium für Wohnen, Kunst, Kultur,
        Medien und Sport, menos la función pública, que pasó al Bundeskanzleramt, y más
        vivienda y medios. Se registra para el histórico, sin asiento porque este fichero no
        reconstruye el reparto de ministros de marzo de 2025.

