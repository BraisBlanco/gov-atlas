      Die Namen und Zuständigkeitsbereiche der einzelnen Bundesministerien sind im Bundesministeriengesetz geregelt. Das Bundesministeriengesetz wurde zuletzt am 18. März 2025 novelliert und trat mit 1. April 2025 in Kraft.
    note: >-
      The Austrian government's own directory of its ministries, and a second, independent
      reason to count the Bundeskanzleramt: the page is headed "Bundesministerien" and the
      Chancellery is the first entry in it, which is the opposite of what the equivalent
      German page does. The page corroborates the statutory list item for item and adds
      nothing to it — thirteen bodies, the same thirteen. Its closing note also confirms that
      no Bundesministeriengesetz amendment has followed BGBl. I Nr. 10/2025 as of the access
      date. The quote lists the entries in the page's own order, which is the Chancellery
      first and then alphabetical by German name and therefore not the statutory order; each
      entry's postal address, telephone number and internet domain are omitted, and the
