    note: >-
      The government's own roster, cited for three things the statute cannot give: the exact
      official title of the federal minister in the Chancellery, which ministries have a
      Staatssekretär, and the fact that the Vice-Chancellorship is held by a serving minister
      rather than existing as an office of its own. Fourteen members of the Bundesregierung
      are listed — one Chancellor and thirteen federal ministers, one of whom is also
      Vice-Chancellor — followed by seven Staatssekretäre. The quote transcribes the office
      titles in the page's own order, which is the Chancellor, then the Vice-Chancellor, then
      the ministers and the state secretaries alphabetically by surname; the officeholders'
      names, academic titles and photograph credits are omitted, and where the page breaks a
      title across two lines it is closed up. The page carries the internal revision date
      "Stand: 2. April 2025", which is the day eight ministers were sworn in again to match
