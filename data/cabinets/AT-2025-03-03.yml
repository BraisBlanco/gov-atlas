# Austria — federal government structure under the Stocker cabinet.
#
# Read docs/DATA-CONTRACT.md alongside this file. Four things to notice:
#
#   1. Nowhere does this file state "13". The count is derived from the entities below.
#   2. Austria enumerates its ministries by statute. § 1 Abs. 1 of the
#      Bundesministeriengesetz 1986 lists them, so the whole list can be read off one
#      provision — no budget act or organisational decree has to stand in for it.
#   3. The Bundeskanzleramt is recorded and deliberately IS counted, which is the opposite
#      of the decision taken for Germany in DE-2025-05-06.yml. The reason is not a change
#      of policy but a difference in the statutes: § 1 Abs. 1 Z 1 BMG says in as many words
#      that the Bundeskanzleramt is a Bundesministerium. See the first methodology note:
#      13 as published, 12 if the Chancellery is treated as a mere head-of-government
#      office.
#   4. This cabinet took office on 3 March 2025 but reorganised its departments on
#      1 April 2025, when the Bundesministeriengesetz-Novelle 2025 entered into force. The
#      six designations that ceased on 31 March 2025 are recorded with `valid_to`.

country: AT
cabinet_id: AT-2025-03-03

cabinet_name_original: Bundesregierung Stocker, XXVIII. Gesetzgebungsperiode des Nationalrates
cabinet_name_en: Federal Government of Austria (Stocker government), 28th legislative period
cabinet_name_es: Gobierno Federal de Austria (gabinete Stocker), XXVIII legislatura del Consejo Nacional

head_of_government_title_original: Bundeskanzler
head_of_government_title_en: Federal Chancellor

took_office: 2025-03-03
left_office: null

methodology_notes:
  - en: >-
      The Federal Chancellery is the contested case in Austria, and unlike in Germany it is
      counted. Austria is counted here as having 13 federal ministries; it has 12 if the
      Bundeskanzleramt is treated as the office of the head of government rather than as a
      ministry. The decisive evidence is that Austrian law says the Chancellery is a
      ministry, in the very provision that enumerates them: § 1 Abs. 1 of the
      Bundesministeriengesetz 1986 opens "Bundesministerien im Sinne des Art. 77 B-VG
      sind:" and its first item is "das Bundeskanzleramt". Article 77 Abs. 3 of the
      Constitution reinforces it by contrast — "Mit der Leitung des Bundeskanzleramtes ist
      der Bundeskanzler, mit der Leitung der anderen Bundesministerien je ein Bundesminister
      betraut" — calling the other twelve "the other federal ministries". Part 2 of the
      Annex to § 2 BMG then gives the Chancellery section A on exactly the same footing as
      the twelve sections B to M, with substantive competences no other ministry holds:
      the constitutional service, the civil service, digital government, religious affairs,
      national minorities, family policy, youth policy and integration. And the Federal
      Chancellery's own list of "Bundesministerien" opens with itself. Against counting it:
      it is led by the Chancellor in person, it is the apex of the cabinet, and this
      project's default — applied to Spain's Presidencia del Gobierno and to the German
      Bundeskanzleramt — is to exclude such an office. A reader who prefers that reading
      should subtract one from every ministry figure this site publishes for Austria. The
      difference from Germany is a difference between the two statutes, not a difference
      of judgement: German law never designates the Bundeskanzleramt a Bundesministerium, and
      the German budget act pointedly heads its budget section "Bundeskanzler und
      Bundeskanzleramt" while reserving the word "Bundesministerium" for the sixteen
      departments; Austrian law designates it one, first in the list.
    es: >-
      La Cancillería Federal es el caso discutido en Austria y, a diferencia de Alemania,
      aquí sí se cuenta. Se cuentan 13 ministerios federales; serían 12 si se considerase
      el Bundeskanzleramt como oficina del jefe de gobierno y no como ministerio. La prueba
      decisiva es que la ley austriaca dice que la Cancillería es un ministerio, y lo dice
      en el precepto que los enumera: el § 1 Abs. 1 de la Bundesministeriengesetz 1986
      empieza «Bundesministerien im Sinne des Art. 77 B-VG sind:» y su primer punto es «das
      Bundeskanzleramt». El artículo 77 Abs. 3 de la Constitución lo refuerza por contraste
      —«Mit der Leitung des Bundeskanzleramtes ist der Bundeskanzler, mit der Leitung der
      anderen Bundesministerien je ein Bundesminister betraut»—, al llamar «los otros
      ministerios federales» a los otros doce. La Parte 2 del Anexo al § 2 BMG asigna
      además a la Cancillería la sección A en pie de igualdad con las doce secciones B a M,
      con competencias sustantivas que ningún otro ministerio ostenta: el servicio
      constitucional, la función pública, la administración digital, los asuntos
      religiosos, los grupos étnicos reconocidos, la política de familia, la de juventud y
      la de integración. Y la propia lista de «Bundesministerien» que publica la
      Cancillería se abre con ella misma. En contra: la dirige el canciller en persona, es
      la cúspide del gabinete, y el criterio por defecto de este proyecto —aplicado a la
      Presidencia del Gobierno española y al Bundeskanzleramt alemán— es excluir esa
      oficina. Quien prefiera esa lectura debe restar uno a todas las cifras de ministerios
      que este sitio publica sobre Austria. La diferencia con Alemania es una diferencia
      entre las dos leyes, no una diferencia de criterio: la ley alemana nunca designa al
      Bundeskanzleramt como Bundesministerium, y la ley de presupuestos alemana titula su
      sección presupuestaria «Bundeskanzler und Bundeskanzleramt» reservando la palabra
      «Bundesministerium» para los dieciséis departamentos; la ley austriaca sí lo designa
      ministerio, y en primer lugar de la lista.
  - en: >-
      Austria produces three numbers and they are not interchangeable. There are 13
      Bundesministerien, because § 1 Abs. 1 BMG lists 13. There are 14 members of the
      Bundesregierung: the Federal Chancellor, plus twelve federal ministers each leading
      one of the other twelve ministries, plus one further federal minister who leads no
      ministry of her own but the "sachliche Leitung" of specified matters inside the
      Chancellery's remit, under § 1 Abs. 2 BMG and Article 77 Abs. 3 B-VG. And there are
      21 people appointed by the Federal President to the government's ranks, once the
      seven Staatssekretäre are added. This site publishes 13 as the ministries figure and
      14 as the cabinet-seats figure. The Staatssekretäre carry no cabinet seat: Article 69
      Abs. 1 B-VG composes the Bundesregierung of the Chancellor, the Vice-Chancellor and
      the other federal ministers and no one else, and Article 78 Abs. 3 makes a
      Staatssekretär subordinate to and bound by the instructions of his minister. They
      attend the Ministerrat but are not members of it. Counting attendance as a seat would
      give 21 seats rather than 14. The two figures are never added together.
    es: >-
      Austria arroja tres cifras que no son intercambiables. Hay 13 Bundesministerien,
      porque el § 1 Abs. 1 BMG enumera 13. Hay 14 miembros de la Bundesregierung: el
      canciller federal, doce ministros federales que dirigen cada uno de los otros doce
      ministerios, y una ministra federal más que no dirige ministerio propio sino la
      «sachliche Leitung» de determinadas materias del ámbito de la Cancillería, al amparo
      del § 1 Abs. 2 BMG y del artículo 77 Abs. 3 B-VG. Y hay 21 personas nombradas por el
      presidente federal para los cargos del gobierno, sumando los siete Staatssekretäre.
      Este sitio publica 13 como cifra de ministerios y 14 como cifra de asientos en el
      gabinete. Los Staatssekretäre no ocupan asiento en el gabinete: el artículo 69 Abs. 1
      B-VG compone la Bundesregierung con el canciller, el vicecanciller y los demás
      ministros federales, y con nadie más, y el artículo 78 Abs. 3 subordina al
      Staatssekretär a su ministro y lo vincula a sus instrucciones. Asisten al Consejo de
      Ministros pero no son miembros de él. Contar la asistencia como asiento daría 21
      asientos en lugar de 14. Las dos cifras nunca se suman.
  - en: >-
      The department structure changed 29 days into this cabinet's term. When the government
      was sworn in on 3 March 2025 the Bundesministeriengesetz still listed 12
      Bundesministerien, in the version last amended by the Bundesministeriengesetz-Novelle
      2024; two of the incoming ministers were therefore sworn in provisionally without a
      portfolio, because their departments did not yet exist. The
      Bundesministeriengesetz-Novelle 2025, BGBl. I Nr. 10/2025, was published on 18 March
      2025 and entered into force on 1 April 2025, raising the number to 13: it created the
      Bundesministerium für Frauen, Wissenschaft und Forschung and the Bundesministerium
      für Innovation, Mobilität und Infrastruktur, renamed five other departments, and
      dissolved the Bundesministerium für Klimaschutz, Umwelt, Energie, Mobilität,
      Innovation und Technologie by distributing its competences. Eight ministers and three
      state secretaries were sworn in again on 2 April 2025 to match their new departments.
      Austria's count under this cabinet was therefore 12 until 31 March 2025 and has been
      13 since 1 April 2025. The seven entities created or renamed on that date are
      recorded with 1 April 2025 as their start date; the six designations that ceased are
      recorded below with 31 March 2025 as their end date, so the change is visible rather
      than inferred. Those six are recorded as not counted and carry no cabinet seat — the
      treatment this project gives departments superseded during a cabinet's term — because
      this page does not reconstruct which minister held which of them in March 2025. The
      consequence is explicit rather than hidden: a replay of any date before 1 April 2025
      returns six ministries and seven seats, understating both, and only the snapshot from
      1 April 2025 onward is a figure this project stands behind. Everything else on this
      page describes the structure in force from 1 April 2025 to the access date.
    es: >-
      La estructura departamental cambió a los 29 días de legislatura. Cuando el gobierno
      tomó posesión el 3 de marzo de 2025, la Bundesministeriengesetz seguía enumerando 12
      Bundesministerien, en la versión modificada por última vez por la
      Bundesministeriengesetz-Novelle 2024; dos de las ministras entrantes fueron por ello
      juramentadas provisionalmente sin cartera, porque sus departamentos aún no existían.
      La Bundesministeriengesetz-Novelle 2025, BGBl. I Nr. 10/2025, se publicó el 18 de
      marzo de 2025 y entró en vigor el 1 de abril de 2025, elevando la cifra a 13: creó el
      Bundesministerium für Frauen, Wissenschaft und Forschung y el Bundesministerium für
      Innovation, Mobilität und Infrastruktur, renombró otros cinco departamentos y
      disolvió el Bundesministerium für Klimaschutz, Umwelt, Energie, Mobilität, Innovation
      und Technologie repartiendo sus competencias. Ocho ministros y tres secretarias de
      Estado volvieron a ser juramentados el 2 de abril de 2025 conforme a sus nuevos
      departamentos. La cifra austriaca bajo este gobierno fue por tanto 12 hasta el 31 de
      marzo de 2025 y es 13 desde el 1 de abril de 2025. Las siete entidades creadas o
      renombradas en esa fecha se registran con el 1 de abril de 2025 como fecha de inicio;
      las seis denominaciones que cesaron se registran abajo con el 31 de marzo de 2025 como
      fecha de fin, para que el cambio sea visible y no deducido. Esas seis se registran como
      no contadas y sin asiento en el gabinete —el tratamiento que este proyecto da a los
      departamentos sustituidos durante la legislatura—, porque esta ficha no reconstruye qué
      ministro ocupaba cada una de ellas en marzo de 2025. La consecuencia es explícita y no
      oculta: una reconstrucción de cualquier fecha anterior al 1 de abril de 2025 devuelve
      seis ministerios y siete asientos, subestimando ambos, y sólo la foto desde el 1 de
      abril de 2025 es una cifra que este proyecto respalda. Todo lo demás en esta
      ficha describe la estructura vigente desde el 1 de abril de 2025 hasta la fecha de
      consulta.
  - en: >-
      The Vice-Chancellorship is a personal office held by a serving minister — in this
      cabinet by the Federal Minister for Housing, Art, Culture, Media and Sport — and adds
      neither a ministry nor a cabinet seat. Article 69 Abs. 2 B-VG makes the
      Vice-Chancellor the Chancellor's deputy across the Chancellor's whole remit, which is
      a function, not a department. Which minister holds it changes with reshuffles; the
      department structure does not, and only the latter is recorded here.
    es: >-
      La vicecancillería es un cargo personal que ostenta un ministro en ejercicio —en este
      gabinete el ministro federal de Vivienda, Arte, Cultura, Medios y Deporte— y no añade
      ni ministerio ni asiento en el gabinete. El artículo 69 Abs. 2 B-VG convierte al
      vicecanciller en sustituto del canciller en todo su ámbito, lo que es una función y no
      un departamento. Quién lo ostenta cambia con las remodelaciones; la estructura
      departamental no, y aquí sólo se registra esta última.
  - en: >-
      Policy areas here are tagged by a rule, not by impression: an area is tagged when Part
      2 of the Annex to § 2 BMG assigns the ministry a numbered item (a "Ziffer") whose
      subject matter is that area. The rule produces a few results a reader should not read
      as errors. Housing is tagged on two ministries, because the Bundesministerium für
      Wohnen, Kunst, Kultur, Medien und Sport holds only the coordination of housing policy
      while the substantive Bau-, Wohnungs- und Siedlungswesen and the housing subsidy
      remain with the Bundesministerium für Wirtschaft, Energie und Tourismus. Public
      administration is tagged on two, because the Bundesministerium für europäische und
      internationale Angelegenheiten holds deregulation and cutting red tape as one of only
      two items in its whole section. Economy and state assets are each tagged on two,
      because general economic policy and the administration of federal property sit with
      Finance while sectoral economic policy and the state-owned enterprises sit with
      Economy. Research is tagged on two, because academic research sits with the science
      ministry and applied industrial research with the innovation ministry. Austria has no
      dedicated environment ministry, no dedicated culture ministry and no dedicated
      education-and-science ministry: those areas are tagged where the Annex actually puts
      them.
    es: >-
      Las áreas de política se etiquetan aquí con una regla, no a ojo: un área se etiqueta
      cuando la Parte 2 del Anexo al § 2 BMG asigna al ministerio un punto numerado (una
      «Ziffer») cuya materia es esa área. La regla produce algunos resultados que el lector
      no debe tomar por errores. La vivienda se etiqueta en dos ministerios, porque el
      Bundesministerium für Wohnen, Kunst, Kultur, Medien und Sport sólo tiene la
      coordinación de la política de vivienda, mientras que el Bau-, Wohnungs- und
      Siedlungswesen sustantivo y la ayuda a la construcción de viviendas siguen en el
      Bundesministerium für Wirtschaft, Energie und Tourismus. La administración pública se
      etiqueta en dos, porque el Bundesministerium für europäische und internationale
      Angelegenheiten tiene la desregulación y la desburocratización como uno de los dos
      únicos puntos de toda su sección. Economía y patrimonio estatal se etiquetan en dos
      cada una, porque la política económica general y la administración del patrimonio
      federal están en Hacienda mientras la política económica sectorial y las empresas
      públicas están en Economía. La investigación se etiqueta en dos, porque la
      investigación científica está en el ministerio de Ciencia y la industrial aplicada en
      el de Innovación. Austria no tiene ministerio propio de Medio Ambiente, ni de Cultura,
      ni de Educación y Ciencia conjunto: esas áreas se etiquetan donde el Anexo las sitúa
      realmente.
  - en: >-
      Two competences that the Annex assigns to the Bundeskanzleramt are not tagged at all,
      because this project's policy areas include none that covers them. One is Integration —
      "Angelegenheiten der gesellschaftlichen Integration und des Zusammenlebens von
      Menschen mit und ohne Migrationshintergrund", item 25 of section A, which is a
      distinct competence from the migration and asylum powers held by the interior
      ministry and is not the same thing as social welfare. The other is Volksgruppen, item
      15 of section A: the affairs of Austria's six legally recognised ethnic groups, which
      is neither language policy nor equality as this project defines those areas. Both are
      named in the title the Federal Chancellery gives the minister who runs them —
      "Bundesministerin für Europa, Integration und Familie im Bundeskanzleramt" — so a
      reader who looks for Austrian integration policy in the comparison views will not
      find it.
    es: >-
      Dos competencias que el Anexo asigna al Bundeskanzleramt no se etiquetan en absoluto,
      porque las áreas de política de este proyecto no incluyen ninguna que las cubra. Una
      es la Integración —«Angelegenheiten der gesellschaftlichen Integration und
      des Zusammenlebens von Menschen mit und ohne Migrationshintergrund», punto 25 de la
      sección A—, competencia distinta de las de migración y asilo que ostenta el
      ministerio del Interior y que no es lo mismo que la asistencia social. La otra son los
      Volksgruppen, punto 15 de la sección A: los asuntos de los seis grupos étnicos
      legalmente reconocidos de Austria, que no son ni política lingüística ni igualdad tal
      como este proyecto define esas áreas. Ambas figuran en el título que la Cancillería
      Federal da a la ministra que las dirige —«Bundesministerin für Europa, Integration und
      Familie im Bundeskanzleramt»—, de modo que quien busque la política austriaca de
      integración en las vistas comparativas no la encontrará.
  - en: >-
      The Präsidentschaftskanzlei, the office of the Federal President, is not recorded as
      an entity at all rather than recorded and excluded. It is not a Bundesministerium —
      § 1 Abs. 1 BMG does not list it — and under Article 69 Abs. 1 B-VG the executive
      business of the Federation belongs to the Chancellor and the ministers "soweit diese
      nicht dem Bundespräsidenten übertragen sind", which places the President outside the
      Bundesregierung rather than inside it as a non-counted member. No Austrian source
      presents the office at cabinet level, so listing it would invent a candidacy nobody
      asserts. The same reasoning excludes the Rechnungshof and the Volksanwaltschaft, which
      are organs of the Nationalrat.
    es: >-
      La Präsidentschaftskanzlei, la oficina del presidente federal, no se registra como
      entidad en absoluto, en lugar de registrarse y excluirse. No es un Bundesministerium
      —el § 1 Abs. 1 BMG no la enumera— y conforme al artículo 69 Abs. 1 B-VG los asuntos
      ejecutivos superiores de la Federación corresponden al canciller y a los ministros
      «soweit diese nicht dem Bundespräsidenten übertragen sind», lo que sitúa al presidente
      fuera de la Bundesregierung y no dentro de ella como miembro no contado. Ninguna
      fuente austriaca presenta esa oficina a nivel de gabinete, de modo que listarla sería
      inventar una candidatura que nadie sostiene. El mismo razonamiento excluye al
      Rechnungshof y a la Volksanwaltschaft, órganos del Consejo Nacional.
  - en: >-
      Austria is a federal state and this page covers the Bundesregierung only. Each of the
      nine Länder has its own Landesregierung whose members hold competences that in a
      centralised state would sit with a national ministry — building law, nature
      conservation, youth welfare, hospitals and kindergartens above all, and the
      administration of much federal law through the Länder under Article 102 B-VG. State
      governments are out of scope for this project, so they are not listed at all rather
      than listed and excluded. Austria's federalism is nonetheless less far-reaching than
      Germany's: school education, policing and culture are federal competences here and
      state competences there, which is part of why Austria's 13 and Germany's 16 are not a
      like-for-like measure of governmental reach.
    es: >-
      Austria es un Estado federal y esta ficha cubre únicamente la Bundesregierung. Cada
      uno de los nueve Länder tiene su propia Landesregierung, cuyos miembros ostentan
      competencias que en un Estado centralizado corresponderían a un ministerio nacional:
      sobre todo derecho de la edificación, protección de la naturaleza, protección de la
      juventud, hospitales y guarderías, además de la ejecución de gran parte del derecho
      federal a través de los Länder conforme al artículo 102 B-VG. Los gobiernos de los
      Länder quedan fuera del alcance de este proyecto, por lo que no se listan en
      absoluto en lugar de listarse y excluirse. El federalismo austriaco es sin embargo
      menos extenso que el alemán: la educación escolar, la policía y la cultura son aquí
      competencias federales y allí competencias de los Länder, y en parte por eso los 13 de
      Austria y los 16 de Alemania no miden el mismo alcance de gobierno.
  - en: >-
      Every English and Spanish ministry name on this page is this project's own
      translation, and is marked as such. The Austrian federal government publishes no
      consolidated list of its ministries' names in either language: the Federal
      Chancellery's English pages do not carry one, and RIS notes that the English
      translation of the Bundesministeriengesetz lives in a separate "Austrian Laws"
      application as an expressly non-binding aid. Several ministries do publish an English
      name of their own on their own sites, and adopting those would be defensible, but no
      archived snapshot of those pages has been obtained, and an unverifiable claim of
      officialness is worse than an understated one. The original German name is shown
      alongside every rendering.
    es: >-
      Todos los nombres de ministerios en inglés y español de esta ficha son traducciones
      de este proyecto, señaladas como tales. El gobierno federal austriaco no publica una lista
      consolidada de los nombres de sus ministerios en ninguno de los dos idiomas: las
      páginas en inglés de la Cancillería Federal no la incluyen, y RIS advierte que la
      traducción inglesa de la Bundesministeriengesetz reside en una aplicación aparte,
      «Austrian Laws», como auxilio expresamente no vinculante. Varios ministerios sí
      publican un nombre inglés propio en sus webs, y adoptarlo sería defendible, pero no se
      ha obtenido copia archivada de esas páginas, y una afirmación de oficialidad no
      verificable es peor que una subestimada. El nombre alemán original se muestra junto
      a cada traducción.

sources:
  - id: ris-bmg-1986-p1
    tier: 1
    type: statute
    publisher: Bundeskanzleramt — Rechtsinformationssystem des Bundes (RIS)
    title: >-
      Bundesgesetz über die Zahl, den Wirkungsbereich und die Einrichtung der
      Bundesministerien (Bundesministeriengesetz 1986 – BMG), § 1, Bundesrecht
      konsolidiert
    url: https://ris.bka.gv.at/Dokumente/Bundesnormen/NOR40268742/NOR40268742.pdf
    archive_url: https://web.archive.org/web/20260728100507/https://ris.bka.gv.at/Dokumente/Bundesnormen/NOR40268742/NOR40268742.pdf
    lang: de
    published: 2025-03-18
    accessed: 2026-07-28
    quote: |-
      Abschnitt I
      Allgemeine Bestimmungen
      Bundesministerien und Bundesminister im Bundeskanzleramt
      § 1. (1) Bundesministerien im Sinne des Art. 77 B-VG sind:
      1. das Bundeskanzleramt,
      2. das Bundesministerium für Wohnen, Kunst, Kultur, Medien und Sport,
      3. das Bundesministerium für europäische und internationale Angelegenheiten,
      4. das Bundesministerium für Arbeit, Soziales, Gesundheit, Pflege und Konsumentenschutz,
      5. das Bundesministerium für Bildung,
      6. das Bundesministerium für Finanzen,
      7. das Bundesministerium für Frauen, Wissenschaft und Forschung,
      8. das Bundesministerium für Inneres,
      9. das Bundesministerium für Innovation, Mobilität und Infrastruktur,
      10. das Bundesministerium für Justiz,
      11. das Bundesministerium für Land- und Forstwirtschaft, Klima- und Umweltschutz, Regionen und Wasserwirtschaft,
      12. das Bundesministerium für Landesverteidigung,
      13. das Bundesministerium für Wirtschaft, Energie und Tourismus.
      (2) Soweit der Bundespräsident mit Entschließung gemäß Art. 77 Abs. 3 B-VG die sachliche Leitung bestimmter, zum Wirkungsbereich des Bundeskanzleramtes gehörender Angelegenheiten einem eigenen Bundesminister überträgt, führt dieser einen auf die ihm übertragenen Angelegenheiten hinweisenden Titel.
    note: >-
      The enumerating instrument, and the reason Austria needs no substitute for one. RIS
      states this consolidated version of § 1 as "BGBl. Nr. 76/1986 zuletzt geändert durch
      BGBl. I Nr. 10/2025" with "Inkrafttretensdatum 01.04.2025", so it reflects the
      Bundesministeriengesetz-Novelle 2025 and nothing later; the consolidated text of the
      whole Act, retrieved for the version valid on 28 July 2026, lists BGBl. I Nr. 10/2025
      as its most recent amendment. `published` is the date that amending Act was published
      in the Bundesgesetzblatt, 18 March 2025, since a consolidated text has no publication
      date of its own. The quote reproduces the section heading, the provision's own
      heading, the whole of Abs. 1 and the whole of Abs. 2 from the RIS PDF; the PDF's
      indentation is normalised and the line break the typesetter puts inside item 11 is
      closed up, and no wording is altered. Abs. 2 is quoted because it is the legal basis
      for the Bundesministerin im Bundeskanzleramt recorded below. Note that the version of
      this provision rendered in RIS's HTML interface interleaves an accessibility rendering
      that expands abbreviations ("Paragraph eins,", "Ziffer eins"); that rendering is not
      part of the enacted text and the PDF cited here does not contain it. The listing order
      of the entities in this file follows Abs. 1.

  - id: ris-bmg-1986-anlage
    tier: 1
    type: statute
    publisher: Bundeskanzleramt — Rechtsinformationssystem des Bundes (RIS)
    title: >-
      Bundesministeriengesetz 1986 – BMG, Anlage zu § 2 (Wirkungsbereich der
      Bundesministerien), Bundesrecht konsolidiert
    url: https://ris.bka.gv.at/Dokumente/Bundesnormen/NOR40268786/NOR40268786.pdf
    archive_url: https://web.archive.org/web/20260728100518/https://ris.bka.gv.at/Dokumente/Bundesnormen/NOR40268786/NOR40268786.pdf
    lang: de
    published: 2025-03-18
    accessed: 2026-07-28
    quote: |-
      A. Bundeskanzleramt
      1. Angelegenheiten der allgemeinen Regierungspolitik einschließlich der Koordination der gesamten Verwaltung des Bundes, soweit sie nicht in den Wirkungsbereich eines anderen Bundesministeriums fällt.
      3. Angelegenheiten der staatlichen Verfassung.
      12. Angelegenheiten des Kultus.
      15. Angelegenheiten der Volksgruppen.
      16. Allgemeine Angelegenheiten der Familienpolitik einschließlich der Koordination der Familienpolitik und der Familienförderung sowie Bevölkerungspolitik in Angelegenheiten der Familie und Jugend.
      22. Angelegenheiten der außerschulischen Jugenderziehung, soweit es sich nicht um außerschulische Berufsausbildung handelt.
      24. Allgemeine Personalangelegenheiten von öffentlich Bediensteten, soweit sie nicht in den Wirkungsbereich des Bundesministeriums für Finanzen fallen.
      25. Angelegenheiten der Integration.
      27. Angelegenheiten der Digitalisierung einschließlich der staatlichen Verwaltung für das Service und die Interaktion mit Bürgern und Unternehmen.
    note: >-
      The instrument that defines what each ministry actually does, and therefore the source
      for every policy-area tag in this file. Part 1 lists the housekeeping business every
      ministry conducts; Part 2 divides the substantive subject matter into thirteen
      lettered sections, A to M, one per Bundesministerium in the order of § 1 Abs. 1, with
      section A the Bundeskanzleramt. The quote transcribes the heading of section A and
      nine of its twenty-nine numbered items, chosen because they are the ones the
      Chancellery's counted policy areas rest on; the items' subordinate paragraphs ("Dazu
      gehören insbesondere auch: ...") and the items not tagged here are omitted, and no
      wording is altered. Sections B to M are structured identically and are read the same
      way for the twelve other ministries. Same consolidated version and same `published`
      reasoning as ris-bmg-1986-p1.

  - id: bgbl-2025-i-10-bmg-novelle
    tier: 1
