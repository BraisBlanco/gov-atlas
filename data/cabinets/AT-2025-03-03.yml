  - id: AT-2025-klimaschutz-umwelt-energie-mobilitaet
    order: 25
    name_original: >-
      Bundesministerium für Klimaschutz, Umwelt, Energie, Mobilität, Innovation und
      Technologie
    abbreviation_original: BMK
    name_en: >-
      Federal Ministry for Climate Action, Environment, Energy, Mobility, Innovation and
      Technology
    name_es: >-
      Ministerio Federal de Acción Climática, Medio Ambiente, Energía, Movilidad, Innovación
      y Tecnología
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Bundesminister
    head_title_en: Federal Minister
    has_cabinet_seat: false
    head_count: 0
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: superseded_within_cabinet
    valid_to: 2025-03-31
    url: null
    sources: [ris-bmg-1986-p1-bis-2025-03-31, bgbl-2025-i-10-bmg-novelle]
    note:
      en: >-
        Item 9 of § 1 Abs. 1 BMG until 31 March 2025, and the only department dissolved
        outright rather than renamed. On 1 April 2025 its competences were distributed three
        ways: transport, infrastructure, applied research, patents and space to the new
        Bundesministerium für Innovation, Mobilität und Infrastruktur; climate, environment
        and water to the Bundesministerium für Land- und Forstwirtschaft, Klima- und
        Umweltschutz, Regionen und Wasserwirtschaft; energy to the Bundesministerium für
        Wirtschaft, Energie und Tourismus. Austria has had no combined climate ministry since.
        Recorded for the historical record, with no seat.
      es: >-
        Punto 9 del § 1 Abs. 1 BMG hasta el 31 de marzo de 2025, y el único departamento
        disuelto de plano en lugar de renombrado. El 1 de abril de 2025 sus competencias se
        repartieron en tres: transporte, infraestructuras, investigación aplicada, patentes y
        espacio al nuevo Bundesministerium für Innovation, Mobilität und Infrastruktur; clima,
        medio ambiente y agua al Bundesministerium für Land- und Forstwirtschaft, Klima- und
        Umweltschutz, Regionen und Wasserwirtschaft; energía al Bundesministerium für
        Wirtschaft, Energie und Tourismus. Austria no ha tenido desde entonces un ministerio
        de Clima conjunto. Se registra para el histórico, sin asiento.

