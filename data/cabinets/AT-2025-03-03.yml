    quote: |-
      10. Bundesgesetz, mit dem das Bundesministeriengesetz 1986 geändert wird (Bundesministeriengesetz-Novelle 2025)
      Der Nationalrat hat beschlossen:
      Das Bundesgesetz über die Zahl, den Wirkungsbereich und die Einrichtung der Bundesministerien (Bundesministeriengesetz 1986 – BMG), BGBl. Nr. 76/1986, zuletzt geändert durch die Bundesministeriengesetz-Novelle 2024, BGBl. I Nr. 44/2024, wird wie folgt geändert:
      Anlage zu § 2
      Teil 1
      Teil 2
      Abschnitt A Bundeskanzleramt
      Abschnitt B Bundesministerium für Wohnen, Kunst, Kultur, Medien und Sport
      Abschnitt C Bundesministerium für europäische und internationale Angelegenheiten
      Abschnitt D Bundesministerium für Arbeit, Soziales, Gesundheit, Pflege und Konsumentenschutz
      Abschnitt E Bundesministerium für Bildung
      Abschnitt F Bundesministerium für Finanzen
      Abschnitt G Bundesministerium für Frauen, Wissenschaft und Forschung
      Abschnitt H Bundesministerium für Inneres
      Abschnitt I Bundesministerium für Innovation, Mobilität und Infrastruktur
      Abschnitt J Bundesministerium für Justiz
      Abschnitt K Bundesministerium für Land- und Forstwirtschaft, Klima- und Umweltschutz, Regionen und Wasserwirtschaft
      Abschnitt L Bundesministerium für Landesverteidigung
      Abschnitt M Bundesministerium für Wirtschaft, Energie und Tourismus
      4. § 1 Abs. 1 lautet:
      1. Das Inhaltsverzeichnis, die Überschrift des Abschnitts I, die Überschrift zu § 1, § 1 Abs. 1, die §§ 1a, 2 und 3 samt Überschriften, ... sowie die Anlage zu § 2 in der Fassung der Bundesministeriengesetz-Novelle 2025, BGBl. I Nr. 10/2025, treten mit 1. April 2025 in Kraft
    note: >-
      The amending Act, cited for the date of the reorganisation and for the fact that the
      thirteen sections of the Annex are established as a set. The quote reproduces the
      Act's title, its enacting formula, the Annex portion of the table of contents it
      inserts, the opening line of its item 4 (which replaces § 1 Abs. 1 — the replacement
      text itself is quoted in full under ris-bmg-1986-p1 instead of being repeated here),
      and the entry-into-force provision it appends as § 16 Abs. 33 Z 1. Within that last
      sentence an ellipsis marks a long list of further provisions that is omitted; it is
      the only elision in the quote and it removes no words bearing on the date. Items 1 to
      3 and 5 to 42 of the Act, which renumber and reword provisions unrelated to the list
      of ministries, are omitted entirely. The gazette's typesetting line breaks inside a
      designation are closed up and its indentation is normalised; no wording is altered.
      A second entry-into-force date of 1 September 2025 applies under Z 2 to §§ 3a Abs. 3,
      4, 7 Abs. 8 and 11, none of which touches the number or the names of the ministries.

  - id: bvg-art-77
    tier: 1
    type: statute
    publisher: Bundeskanzleramt — Rechtsinformationssystem des Bundes (RIS)
    title: Bundes-Verfassungsgesetz (B-VG), Artikel 77
    url: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000138&Artikel=77&Paragraf=&Anlage=&Uebergangsrecht=
    archive_url: https://web.archive.org/web/20260518084600/https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000138&Artikel=77&Paragraf=&Anlage=&Uebergangsrecht=
    lang: de
    published: 1930-01-01
    accessed: 2026-07-28
    quote: |-
      Artikel 77. (1) Zur Besorgung der Geschäfte der Bundesverwaltung sind die Bundesministerien und die ihnen unterstellten Ämter berufen.
      (2) Die Zahl der Bundesministerien, ihr Wirkungsbereich und ihre Einrichtung werden durch Bundesgesetz bestimmt.
      (3) Mit der Leitung des Bundeskanzleramtes ist der Bundeskanzler, mit der Leitung der anderen Bundesministerien je ein Bundesminister betraut. Der Bundespräsident kann die sachliche Leitung bestimmter, zum Wirkungsbereich des Bundeskanzleramtes gehörender Angelegenheiten, und zwar auch einschließlich der Aufgaben der Personalverwaltung und der Organisation, unbeschadet des Fortbestandes ihrer Zugehörigkeit zum Bundeskanzleramt eigenen Bundesministern übertragen; solche Bundesminister haben bezüglich der betreffenden Angelegenheiten die Stellung eines zuständigen Bundesministers.
      (4) Der Bundeskanzler und die übrigen Bundesminister können ausnahmsweise auch mit der Leitung eines zweiten Bundesministeriums betraut werden.
    note: >-
      Four paragraphs of constitutional law that settle most of this file. Abs. 2 is why
      Austria has a statutory enumeration at all: the number of ministries is a matter for
      an Act of Parliament, which is what the Bundesministeriengesetz is. Abs. 3 is
      load-bearing for the Chancellery decision — it says the Chancellor leads the
      Bundeskanzleramt and a federal minister leads each of "the other federal ministries",
      so the Constitution itself treats the Chancellery as one of the ministries. Its second
      sentence creates the office of a Bundesminister inside the Chancellery's remit and
      gives such a minister "die Stellung eines zuständigen Bundesministers" for the matters
      transferred, which is why the entity recorded for that office below holds a full
      cabinet seat. Abs. 4 permits one person to lead two ministries; no minister in this
      cabinet does, so no entity in this file carries shared_head_with. `published` is
      recorded as 1930-01-01 because the B-VG's reissued version is the Fassung of 1930 and
      RIS gives no day-precise publication date for the consolidated article; the article
      has not been amended since 15 September 2016 according to RIS's own "Zuletzt
      aktualisiert" line. Quote transcribed from the RIS page with the inline accessibility
      expansions ("Absatz eins,", "Artikel 77,") removed, as they are not part of the
      enacted text.

  - id: bvg-art-69
    tier: 1
    type: statute
    publisher: Bundeskanzleramt — Rechtsinformationssystem des Bundes (RIS)
    title: Bundes-Verfassungsgesetz (B-VG), Artikel 69
    url: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000138&Artikel=69&Paragraf=&Anlage=&Uebergangsrecht=
    archive_url: https://web.archive.org/web/20260208171754/https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000138&Artikel=69&Paragraf=&Anlage=&Uebergangsrecht=
    lang: de
    published: 1930-01-01
    accessed: 2026-07-28
    quote: |-
      Artikel 69. (1) Mit den obersten Verwaltungsgeschäften des Bundes sind, soweit diese nicht dem Bundespräsidenten übertragen sind, der Bundeskanzler, der Vizekanzler und die übrigen Bundesminister betraut. Sie bilden in ihrer Gesamtheit die Bundesregierung unter dem Vorsitz des Bundeskanzlers.
      (2) Der Vizekanzler ist zur Vertretung des Bundeskanzlers in dessen gesamtem Wirkungsbereich berufen.
    note: >-
      The provision that fixes who holds a cabinet seat in Austria, and therefore what
      cabinet_seats_count means here. It puts the Chancellor in the Bundesregierung, which
      is why the Bundeskanzleramt entity carries a seat. It makes every Bundesminister a
      member whether or not he leads a ministry, which is why the Bundesministerin im
      Bundeskanzleramt carries one. And by naming only the Chancellor, the Vice-Chancellor
      and the other federal ministers it excludes the seven Staatssekretäre from membership,
      which is why they carry none. Its opening clause also puts the Federal President
      outside the Bundesregierung. Abs. 2 makes the Vice-Chancellorship a function of
      deputising for the Chancellor rather than a department. Abs. 3, on how the government
      takes decisions, is omitted from the quote. Same `published` and transcription
      reasoning as bvg-art-77.

  - id: bvg-art-78
    tier: 1
    type: statute
    publisher: Bundeskanzleramt — Rechtsinformationssystem des Bundes (RIS)
    title: Bundes-Verfassungsgesetz (B-VG), Artikel 78
    url: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000138&Artikel=78&Paragraf=&Anlage=&Uebergangsrecht=
    archive_url: https://web.archive.org/web/20260214200700/https://ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000138&Artikel=78&Paragraf=&Anlage=&Uebergangsrecht=
    lang: de
    published: 1930-01-01
    accessed: 2026-07-28
    quote: |-
      Artikel 78. (1) In besonderen Fällen können Bundesminister auch ohne gleichzeitige Betrauung mit der Leitung eines Bundesministeriums bestellt werden.
      (2) Den Bundesministern können zur Unterstützung in der Geschäftsführung und zur parlamentarischen Vertretung Staatssekretäre beigegeben werden, die unter denselben Voraussetzungen und in gleicher Weise wie die Bundesminister bestellt werden und aus dem Amt scheiden.
      (3) Der Bundesminister kann den Staatssekretär mit dessen Zustimmung auch mit der Besorgung bestimmter Aufgaben betrauen. Der Staatssekretär ist dem Bundesminister auch bei Erfüllung dieser Aufgaben unterstellt und an seine Weisungen gebunden.
    note: >-
      The constitutional basis for the two kinds of entity in this file that hold
      ministerial rank without a ministry of their own. Abs. 1 allows a Bundesminister to be
      appointed without being charged with leading a ministry, which is the Austrian
      equivalent of a minister without portfolio. Abs. 2 and Abs. 3 settle the Staatssekretär
      question: a Staatssekretär is attached to a minister, is appointed and leaves office
      exactly as a minister does — which is why the Federal Chancellery lists all seven
      alongside the ministers — but is subordinate to that minister and bound by his
      instructions, and Article 69 Abs. 1 does not name him a member of the Bundesregierung.
      The second and third sentences of Abs. 2, on how the Chancellor and Vice-Chancellor
      may be represented in Parliament by each other's state secretaries, are omitted from
      the quote. Same `published` and transcription reasoning as bvg-art-77.

  - id: bgbl-2025-ii-62-entschliessung
    tier: 1
    type: official_gazette
    publisher: Bundesgesetzblatt für die Republik Österreich
    title: >-
      62. Entschließung des Bundespräsidenten, mit der die sachliche Leitung bestimmter,
      zum Wirkungsbereich des Bundeskanzleramtes gehörender Angelegenheiten einer eigenen
      Bundesministerin übertragen wird, BGBl. II Nr. 62/2025
    url: https://www.ris.bka.gv.at/Dokumente/BgblAuth/BGBLA_2025_II_62/BGBLA_2025_II_62.pdf
    archive_url: https://web.archive.org/web/20260728101500/https://www.ris.bka.gv.at/Dokumente/BgblAuth/BGBLA_2025_II_62/BGBLA_2025_II_62.pdf
    lang: de
    published: 2025-04-08
    accessed: 2026-07-28
    quote: |-
      Aufgrund des Art. 77 Abs. 3 B-VG übertrage ich der Bundesministerin im Bundeskanzleramt Claudia PLAKOLM die sachliche Leitung folgender, zum Wirkungsbereich des Bundeskanzleramtes gehörender Angelegenheiten:
      (1) 1. Koordination in Angelegenheiten der Europäischen Union; Erteilung von Weisungen für den Ausschuss der Ständigen Vertreter (I, II) und für mit diesem eng zusammenarbeitende Gruppen, jeweils im Einvernehmen mit dem Bundesministerium für europäische und internationale Angelegenheiten.
      2. Angelegenheiten des Kultus.
      5. Angelegenheiten der Volksgruppen.
      6. Allgemeine Angelegenheiten der Familienpolitik einschließlich der Koordination der Familienpolitik und der Familienförderung sowie Bevölkerungspolitik in Angelegenheiten der Familie und Jugend.
      14. Angelegenheiten der Integration.
      15. Angelegenheiten des Zivildienstes.
      (2) Abs. 1 gilt nicht für Aufgaben der Personalverwaltung und der Organisation.
      (4) Diese Entschließung tritt mit ihrer Kundmachung in Kraft.
    note: >-
      The instrument that constitutes the one office in this cabinet that is a federal
      ministry's worth of business without being a federal ministry. It transfers to a
      federal minister inside the Bundeskanzleramt, by name, the sachliche Leitung of
      fifteen groups of matters drawn from section A of the Annex — European coordination,
      religious affairs, national minorities, family, youth, integration and civil service
      in the alternative-service sense — while, as Article 77 Abs. 3 requires, those matters
      remain part of the Chancellery's remit. The quote reproduces the operative opening
      sentence, six of the fifteen numbered groups, and paragraphs 2 and 4; groups 3, 4, 7 to
      13 and paragraph 3 are omitted, as is the signature block. It is the only Entschließung
      of this kind published under this cabinet: a title search of the Bundesgesetzblatt for
      2025 returns this one and no other. The minister named here has since taken the surname
      Bauer, which the Federal Chancellery notes as "Claudia Bauer (vormals Plakolm)"; this
      dataset records offices rather than officeholders, so the change alters nothing in this
      file.

  - id: ris-bmg-1986-p1-bis-2025-03-31
    tier: 1
    type: statute
    publisher: Bundeskanzleramt — Rechtsinformationssystem des Bundes (RIS)
    title: >-
      Bundesministeriengesetz 1986 – BMG, § 1 in der Fassung BGBl. I Nr. 98/2022, gültig
      bis 31. März 2025, Bundesrecht konsolidiert
    url: https://www.ris.bka.gv.at/Dokumente/Bundesnormen/NOR40245504/NOR40245504.pdf
    archive_url: https://web.archive.org/web/20241004185658/https://www.ris.bka.gv.at/Dokumente/Bundesnormen/NOR40245504/NOR40245504.pdf
    lang: de
    published: 2022-07-18
    accessed: 2026-07-28
    quote: |-
      Abschnitt I
      Zahl der Bundesministerien
      § 1. (1) Bundesministerien im Sinne des Art. 77 B-VG sind:
      1. das Bundeskanzleramt,
      2. das Bundesministerium für Kunst, Kultur, öffentlichen Dienst und Sport,
      3. das Bundesministerium für europäische und internationale Angelegenheiten,
      4. das Bundesministerium für Arbeit und Wirtschaft,
      5. das Bundesministerium für Bildung, Wissenschaft und Forschung,
      6. das Bundesministerium für Finanzen,
      7. das Bundesministerium für Inneres,
      8. das Bundesministerium für Justiz,
      9. das Bundesministerium für Klimaschutz, Umwelt, Energie, Mobilität, Innovation und Technologie,
      10. das Bundesministerium für Landesverteidigung,
      11. das Bundesministerium für Land- und Forstwirtschaft, Regionen und Wasserwirtschaft,
      12. das Bundesministerium für Soziales, Gesundheit, Pflege und Konsumentenschutz.
    note: >-
      The version of the enumerating provision that was in force when this cabinet was sworn
      in on 3 March 2025, and until 31 March 2025 — RIS gives it
      "Außerkrafttretensdatum 31.03.2025" and "zuletzt geändert durch BGBl. I Nr. 98/2022".
      Cited for the six designations that ceased to exist on that date, which are recorded
      below with valid_to so that the reorganisation four weeks into the term is visible in
      the data rather than only in a note. Twelve ministries, against thirteen from 1 April
      2025. The archived snapshot predates the amendment and therefore shows exactly this
      superseded text. The quote reproduces the section heading, the provision's heading and
      the whole of Abs. 1; Abs. 2, identical in substance to the current one, is omitted.

