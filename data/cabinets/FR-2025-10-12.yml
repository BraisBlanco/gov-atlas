    note:
      en: >-
        One post, listed twice on the official page — once under the Prime Minister as
        government spokesperson and once under the economy ministry as delegated minister
        for energy — and recorded once here, so that a reader counting the official page
        does not arrive at 37 members. The spokesperson role dates from 12 October 2025; the
        energy remit was added on 26 February 2026. Like the post above, the composition
        decree grants it unrestricted participation in the conseil des ministres, so the
        same 22-seat reading is available.
      es: >-
        Un solo puesto, listado dos veces en la página oficial —una bajo el primer ministro
        como portavoz del Gobierno y otra bajo el ministerio de economía como ministra
        delegada de Energía— y registrado aquí una sola vez, para que quien cuente la página
        oficial no llegue a 37 miembros. La portavocía data del 12 de octubre de 2025; la
        competencia de energía se añadió el 26 de febrero de 2026. Igual que el puesto
        anterior, el decreto de composición le concede participación sin restricciones en el
        conseil des ministres, por lo que cabe la misma lectura de 22 asientos.

