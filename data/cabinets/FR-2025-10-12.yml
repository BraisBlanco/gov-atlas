        francés lleva décadas asumiendo la política de prensa y audiovisual, a través de su
        dirección general de medios e industrias culturales, y ningún otro departamento reclama
        el área; quien etiquetara solo culture dejaría media sin titular en la fila de Francia.
        La titular de este departamento cambió el 26 de febrero de 2026; el departamento no.

