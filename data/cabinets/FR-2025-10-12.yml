        Rural development is not tagged here either; it is a delegated portfolio of the
        territorial-planning department.
      es: >-
        La pesca no se etiqueta aquí, a diferencia de la mayoría de gobiernos de la UE: en
        este gobierno el mar y la pesca son una delegación del departamento de transición
        ecológica. El desarrollo rural tampoco se etiqueta aquí; es una delegación del
        departamento de ordenación del territorio.

