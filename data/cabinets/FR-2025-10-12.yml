        labour; tagging the area on both would double-count it, so it is tagged here, on the
        schools side.
      es: >-
        Solo enseñanza escolar: la enseñanza superior, la investigación y el espacio son un
        departamento aparte. La etiqueta vocational_training refleja a la ministra delegada de
        Enseñanza y Formación Profesionales y Aprendizaje, que desde el 26 de febrero de 2026
        depende conjuntamente de este departamento y de trabajo; etiquetar el área en ambos la
        contaría dos veces, así que se etiqueta aquí, del lado escolar.

  - id: FR-2025-europe-affaires-etrangeres
