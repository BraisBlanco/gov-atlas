        de la vida— en consumer_protection; la taxonomía no tiene id para ninguna de las dos.
        La etiqueta trade la lleva también el departamento de asuntos exteriores, que tiene el
        comercio exterior; esta es el comercio interior. La navegación del directorio oficial
        escribe el nombre con un «et» de más antes de «du Tourisme»; aquí se usa la redacción
        del decreto.

