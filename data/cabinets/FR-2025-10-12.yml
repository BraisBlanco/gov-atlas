        Worth flagging for the comparison views: equality is a delegated portfolio attached
        to the Prime Minister in France, not a ministerial department as it is in Spain. The
        France row therefore shows no ministry tagged "equality", and that absence is a
        finding about structure rather than a gap in the data.
      es: >-
        Merece señalarse para las vistas comparativas: en Francia la igualdad es una
        delegación adscrita al primer ministro, no un departamento ministerial como en
        España. La fila de Francia no muestra por tanto ningún ministerio etiquetado
        «equality», y esa ausencia es un hallazgo sobre la estructura, no una laguna de los
        datos.

