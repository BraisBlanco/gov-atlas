    sources: [info-gouv-composition-2026-02-26, info-gouv-composition-directory]
    note:
      en: >-
        The migration tag does not come from the name, which is a single word. It comes from
        the décret n° 2025-995 du 29 octobre 2025 relatif aux attributions du ministre de
        l'intérieur, whose article 1 charges the minister with "la sécurité intérieure, les
        libertés publiques, l'immigration, l'asile, l'intégration des étrangers en France".
        France has no separate migration ministry, so omitting the tag would make it look as
        though nobody owns the area.
      es: >-
        La etiqueta de migración no procede del nombre, que es una sola palabra, sino del
        décret n° 2025-995 du 29 octobre 2025 relatif aux attributions du ministre de
        l'intérieur, cuyo artículo 1 encomienda al ministro «la sécurité intérieure, les
        libertés publiques, l'immigration, l'asile, l'intégration des étrangers en France».
        Francia no tiene un ministerio de migración separado, de modo que omitir la etiqueta
        haría parecer que nadie asume esa área.

