      en: >-
        The official name puts Europe first, but foreign_affairs is listed first here because
        it is the department's principal area; the ordering rule is about prominence in the
        name and this is the one place we depart from it. The last three tags come from its
        three delegated ministers: external trade, international partnerships — which is how
        France frames development cooperation — and French citizens abroad.
      es: >-
        El nombre oficial pone Europa primero, pero aquí foreign_affairs figura primero porque
        es el área principal del departamento; la regla de orden se refiere a la prominencia
        en el nombre y este es el único punto en que nos apartamos de ella. Las tres últimas
        etiquetas provienen de sus tres ministros delegados: comercio exterior, asociaciones
        internacionales —así enmarca Francia la cooperación al desarrollo— y franceses en el
        exterior.

