        La etiqueta social_security es un juicio. El nombre solo dice «Travail et
        Solidarités», pero este es el departamento que lleva la sécurité sociale y Francia no
        tiene un ministerio de seguridad social aparte; la lectura alternativa, etiquetar
        solo labour y social_affairs, dejaría el área sin titular en la fila de Francia.
        Nótese que familias, autonomía y discapacidad no están aquí: corresponden al
        ministerio de sanidad.

