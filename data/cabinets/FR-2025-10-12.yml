    note:
      en: >-
        Energy is deliberately not tagged here. Despite the name, "souveraineté énergétique"
        belongs to the economy ministry, which also holds the delegated minister for energy —
        a reversal of the arrangement most EU governments use, and the single most likely
        thing for a cross-country reader to get wrong about France. Fisheries and maritime
        affairs are tagged here because the delegated minister for the sea and fisheries is
        attached to this department.
      es: >-
        La energía no se etiqueta aquí, deliberadamente. A pesar del nombre, la «souveraineté
        énergétique» corresponde al ministerio de economía, que además tiene a la ministra
        delegada de Energía: lo contrario de lo que hace la mayoría de gobiernos de la UE, y
        lo que con más probabilidad malinterpretará quien compare países. La pesca y los
        asuntos marítimos se etiquetan aquí porque la ministra delegada del Mar y la Pesca
        está adscrita a este departamento.

