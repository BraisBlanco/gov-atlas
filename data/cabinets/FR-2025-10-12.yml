        department, and inventing a plausible one is worse than leaving it empty.
      es: >-
        Este departamento, y no el ministerio del Interior, asume la descentralización y las
        relaciones con las entidades locales; el ministerio del Interior asume la administración
        prefectoral del Estado. Es fácil confundirlos y el reparto es un rasgo real del ejecutivo
        francés. El desarrollo rural se etiqueta aquí porque el ministro delegado de Ruralidad
        está en este departamento. url queda en null: no pudo verificarse ningún sitio ministerial
        único para este departamento, e inventar uno plausible es peor que dejarlo vacío.

