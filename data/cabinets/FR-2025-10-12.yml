  # --- closed during the term, kept for the historical record ---------------------
  - id: FR-2025-md-fonction-publique
    order: 37
    name_original: Ministre délégué auprès de la ministre de l’Action et des Comptes publics, chargé de la Fonction publique et de la Réforme de l’État
    abbreviation_original: null
    name_en: Delegated Minister to the Minister of Public Action and Public Accounts, for the Civil Service and State Reform
    name_es: Ministro delegado ante la Ministra de Acción y Cuentas Públicas, encargado de la Función Pública y la Reforma del Estado
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministre délégué
    head_title_en: Delegated Minister
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    valid_to: 2026-02-22
    url: null
    sources: [info-gouv-composition-2025-10-12, info-gouv-composition-2026-02-26]
    note:
      en: >-
        Recorded rather than deleted, because a post that existed for four months of the term is a
        fact about the term. It appears in the composition of 12 October 2025 and is absent from the
        composition of 26 February 2026; the closing date is that of the Décret du 22 février 2026
        relatif à la composition du Gouvernement (NOR HRUX2605372D, JORF n° 0046), which ended its
        holder's functions on promoting him to head the Ministère de l'Action et des Comptes publics
        and did not name a successor to the delegated post. That decree was read on Légifrance but
        could not be archived, so the exact day rests on it while the two archived sources bracket the
        change; a curator preferring to date the closure only from archived evidence would write
        2026-02-26. No ministerial department was affected either way, so no count moves.
      es: >-
        Se registra en lugar de borrarse, porque un puesto que existió cuatro meses de la legislatura
        es un hecho de la legislatura. Figura en la composición del 12 de octubre de 2025 y falta en
        la del 26 de febrero de 2026; la fecha de cierre es la del Décret du 22 février 2026 relatif à
        la composition du Gouvernement (NOR HRUX2605372D, JORF n° 0046), que puso fin a las funciones
        de su titular al ascenderlo a encabezar el Ministère de l'Action et des Comptes publics y no
        nombró sucesor en la delegación. Ese decreto se consultó en Légifrance pero no pudo
        archivarse, de modo que el día exacto se apoya en él mientras las dos fuentes archivadas
        acotan el cambio; un curador que prefiriera fechar el cierre solo con evidencia archivada
        pondría 2026-02-26. En ningún caso se vio afectado un departamento ministerial, así que
        ningún recuento se mueve.
