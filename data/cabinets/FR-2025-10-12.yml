      en: >-
        France splits what most governments keep together: the budget and public accounts are a
        department of their own, separate from the economy and finance ministry. Its head changed
        on 22 February 2026, when the delegated minister for the civil service was promoted into
        it and his delegated post was not refilled; the department itself is unchanged since 12
        October 2025. url is null because budget.gouv.fr could not be confirmed as this
        department's own site rather than a cross-government budget portal.
      es: >-
        Francia separa lo que la mayoría de gobiernos mantiene junto: el presupuesto y las
        cuentas públicas son un departamento propio, distinto del ministerio de economía y
        hacienda. Su titular cambió el 22 de febrero de 2026, cuando el ministro delegado de
        Función Pública ascendió a encabezarlo y su puesto delegado no se volvió a cubrir; el
        departamento en sí no ha cambiado desde el 12 de octubre de 2025. url es null porque no
        pudo confirmarse que budget.gouv.fr sea el sitio propio de este departamento y no un
        portal presupuestario interministerial.

