# France — government structure of the Lecornu government (2025-10-12 to date).
#
# Read docs/DATA-CONTRACT.md alongside this file. Three France-specific things to know:
#
#   1. France's hierarchy drives the count. Only the ministres named in article 1 of the
#      composition decree head a ministerial department. Ministres délégués are attached
#      to a minister and work inside an existing department, so they are recorded with
#      counts_as_ministry: false and junior_minister_or_state_secretary.
#   2. This government has no secrétaires d'État at all — unusual for France.
#   3. The tier-1 instrument (Légifrance) could not be archived; see methodology_notes
#      and the source notes. The enumeration therefore rests on tier 2, so France is
#      graded B rather than A.

country: FR
cabinet_id: FR-2025-10-12

cabinet_name_original: Gouvernement de Sébastien Lecornu
cabinet_name_en: Government of Sébastien Lecornu
cabinet_name_es: Gobierno de Sébastien Lecornu

head_of_government_title_original: Premier ministre
head_of_government_title_en: Prime Minister

took_office: 2025-10-12
left_office: null

methodology_notes:
  - en: >-
      France has 19 ministerial departments but 36 members of the Government. The gap is
      the Prime Minister, who holds a seat without heading a department, and 16 ministres
      délégués, who are attached to a minister and act inside an existing department
      rather than heading one of their own. Sources that answer "how big is the French
      government?" with 36 are not wrong; they are answering a different question. This
      dataset counts departments.
    es: >-
      Francia tiene 19 departamentos ministeriales pero 36 miembros del Gobierno. La
      diferencia son el primer ministro, que ocupa asiento sin encabezar departamento, y
      16 ministros delegados, adscritos a un ministro y que actúan dentro de un
      departamento existente en lugar de encabezar uno propio. Las fuentes que responden
      «¿de qué tamaño es el Gobierno francés?» con 36 no se equivocan: responden a otra
      pregunta. Este conjunto de datos cuenta departamentos.
  - en: >-
      cabinet_seats_count is 20: the Prime Minister plus the 19 ministres. Two readings
      would give a larger number. The composition decree grants two ministres délégués —
      relations with Parliament, and the government spokesperson — participation in the
      conseil des ministres without restriction, which would make 22; the other 14 attend
      only "pour les affaires relevant de leurs attributions", i.e. for their own agenda
      items, which is attendance rather than a standing seat. Counting every member of
      the Government would give 36. We take the narrowest reading, the one the
      Constitution supports directly, and record the alternatives here rather than
      leaving a reader to guess which we used.
    es: >-
      cabinet_seats_count es 20: el primer ministro más los 19 ministros. Dos lecturas
      darían una cifra mayor. El decreto de composición concede a dos ministros delegados
      —relaciones con el Parlamento y portavoz del Gobierno— participación sin
      restricciones en el conseil des ministres, lo que daría 22; los otros 14 asisten
      solo «pour les affaires relevant de leurs attributions», es decir para sus propios
      asuntos, lo que es asistencia y no asiento permanente. Contar a todos los miembros
      del Gobierno daría 36. Adoptamos la lectura más estricta, la que sostiene
      directamente la Constitución, y dejamos aquí constancia de las alternativas en vez
      de obligar al lector a adivinar cuál se usó.
  - en: >-
      Why the cabinet is still dated 12 October 2025 despite the February 2026 reshuffle.
      Sébastien Lecornu was appointed by the décret du 10 octobre 2025 portant nomination
      du Premier ministre and his ministers by the décret du 12 octobre 2025 relatif à la
      composition du Gouvernement. The reshuffle decrees of 22 and 26 February 2026 both
      open with "Vu le décret du 10 octobre 2025 portant nomination du Premier ministre ;
      Vu le décret du 12 octobre 2025 relatif à la composition du Gouvernement", and no
      décret portant nomination du Premier ministre was issued in February or March 2026;
      an arrêté of 30 June 2026 on the Prime Minister's own staff still cites the 10
      October 2025 appointment and is signed by Lecornu. In French practice a remaniement
      that does not re-appoint the Prime Minister changes officeholders, not the
      government, so this is one cabinet and took_office is 12 October 2025. It is
      commonly called "Lecornu II" to distinguish it from the government of 5-6 October
      2025, which lasted about fourteen hours; that name is journalistic, not official.
    es: >-
      Por qué el gabinete sigue fechado el 12 de octubre de 2025 pese a la remodelación de
      febrero de 2026. Sébastien Lecornu fue nombrado por el décret du 10 octobre 2025
      portant nomination du Premier ministre y sus ministros por el décret du 12 octobre
      2025 relatif à la composition du Gouvernement. Los decretos de remodelación de 22 y
      26 de febrero de 2026 empiezan ambos con «Vu le décret du 10 octobre 2025 portant
      nomination du Premier ministre ; Vu le décret du 12 octobre 2025 relatif à la
      composition du Gouvernement», y no se dictó ningún décret portant nomination du
      Premier ministre en febrero ni marzo de 2026; un arrêté del 30 de junio de 2026
      sobre el gabinete del propio primer ministro sigue citando el nombramiento del 10 de
      octubre de 2025 y lo firma Lecornu. En la práctica francesa, una remodelación que no
      renombra al primer ministro cambia titulares, no gobierno: por tanto es un solo
      gabinete y took_office es el 12 de octubre de 2025. Se le llama habitualmente
      «Lecornu II» para distinguirlo del gobierno del 5-6 de octubre de 2025, que duró
      unas catorce horas; ese nombre es periodístico, no oficial.
  - en: >-
      Source weakness, stated plainly. The instrument that enumerates the departments is
      the Décret du 12 octobre 2025 relatif à la composition du Gouvernement (NOR
      HRUX2527927D, JORF n° 0241 du 13 octobre 2025), as amended by the décrets of 22 and
      26 February 2026 (NOR HRUX2605372D, JORF n° 0046; NOR HRUX2605723D, JORF n° 0050).
      That text was read on Légifrance, but Légifrance sits behind a bot challenge: the
      Internet Archive's Save Page Now returns an error for every Légifrance URL, the one
      capture it did produce is the challenge page rather than the decree, and
      archive.today is CAPTCHA-gated. Rather than cite a tier-1 source with an archive_url
      that does not show the cited text, this file rests its enumeration on two archived
      pages of the government's own portal, info.gouv.fr, which reproduce the decree's
      list. France is therefore graded B, not A. The decree is real and its reference is
      given here so any reader can check it; what is missing is a durable snapshot, not
      the source.
    es: >-
      Debilidad de fuentes, dicha sin rodeos. El instrumento que enumera los departamentos
      es el Décret du 12 octobre 2025 relatif à la composition du Gouvernement (NOR
      HRUX2527927D, JORF n° 0241 du 13 octobre 2025), modificado por los decretos de 22 y
      26 de febrero de 2026 (NOR HRUX2605372D, JORF n° 0046; NOR HRUX2605723D, JORF
      n° 0050). Ese texto se consultó en Légifrance, pero Légifrance está tras un filtro
      antibots: el Save Page Now de Internet Archive devuelve error en todas las URL de
      Légifrance, la única captura que llegó a generar es la página del filtro y no el
      decreto, y archive.today exige CAPTCHA. Antes que citar una fuente de nivel 1 con un
      archive_url que no muestra el texto citado, este fichero apoya su enumeración en dos
      páginas archivadas del propio portal del Gobierno, info.gouv.fr, que reproducen la
      lista del decreto. Francia queda por tanto calificada B y no A. El decreto es real y
      su referencia se da aquí para que cualquiera lo compruebe; lo que falta es una copia
      archivada duradera, no la fuente.
  - en: >-
      Two things a comparison view will get wrong about France unless it reads this.
      Energy is not in the ecological-transition ministry: "souveraineté énergétique" sits
      in the Ministère de l'Économie, des Finances et de la Souveraineté industrielle,
      énergétique et numérique, which also has a delegated minister for energy. And the
      budget is not in the finance ministry: public accounts and the civil service are a
      separate department, the Ministère de l'Action et des Comptes publics. Immigration
      and asylum are tagged to the Ministère de l'Intérieur, which the décret d'attributions
      of 29 October 2025 charges with "l'immigration, l'asile, l'intégration des étrangers
      en France", even though its one-word name says nothing about it.
    es: >-
      Dos cosas que una vista comparativa entenderá mal sobre Francia si no lee esto. La
      energía no está en el ministerio de transición ecológica: la «souveraineté
      énergétique» está en el Ministère de l'Économie, des Finances et de la Souveraineté
      industrielle, énergétique et numérique, que además tiene una ministra delegada de
      Energía. Y el presupuesto no está en el ministerio de finanzas: las cuentas públicas
      y la función pública son un departamento aparte, el Ministère de l'Action et des
      Comptes publics. La inmigración y el asilo se etiquetan en el Ministère de
      l'Intérieur, al que el décret d'attributions del 29 de octubre de 2025 encomienda
      «l'immigration, l'asile, l'intégration des étrangers en France», aunque su nombre de
      una sola palabra no lo diga.
  - en: >-
      What the February 2026 reshuffle did and did not change. Not one ministerial
      department was created, merged, renamed or abolished, so all 19 carry no
      valid_from/valid_to. Among the delegated posts it did move things: a delegated
      minister for citizenship and one for vocational education and apprenticeship were
      created on 26 February 2026 and carry valid_from; the delegated portfolio for the
      civil service and state reform was ended on 22 February 2026, when its holder was
      promoted to head the Ministère de l'Action et des Comptes publics, and it is kept in
      the file with valid_to rather than deleted. One person, the government spokesperson,
      holds two delegated posts at once and appears twice on the official composition page;
      she is recorded once.
    es: >-
      Qué cambió y qué no en la remodelación de febrero de 2026. No se creó, fusionó,
      renombró ni suprimió ningún departamento ministerial, de modo que los 19 no llevan
      valid_from ni valid_to. Entre los puestos delegados sí hubo movimiento: se crearon el
      26 de febrero de 2026 una ministra delegada de Ciudadanía y otra de Enseñanza y
      Formación Profesionales y Aprendizaje, que llevan valid_from; la delegación de
      Función Pública y Reforma del Estado se extinguió el 22 de febrero de 2026, cuando su
      titular pasó a encabezar el Ministère de l'Action et des Comptes publics, y se
      conserva en el fichero con valid_to en lugar de borrarse. Una misma persona, la
      portavoz del Gobierno, ocupa dos puestos delegados a la vez y figura dos veces en la
      página oficial de composición; se registra una sola vez.

sources:
  - id: info-gouv-composition-2026-02-26
    tier: 2
    type: government_website
    publisher: Gouvernement de la République française — info.gouv.fr
    title: La nouvelle composition du Gouvernement de Sébastien Lecornu
    url: https://www.info.gouv.fr/actualite/la-nouvelle-composition-du-gouvernement-de-sebastien-lecornu
    archive_url: https://web.archive.org/web/20260312025425/https://www.info.gouv.fr/actualite/la-nouvelle-composition-du-gouvernement-de-sebastien-lecornu
    lang: fr
    published: 2026-02-26
    accessed: 2026-07-27
    quote: |-
      La composition du Gouvernement résultant du décret signé jeudi 26 février 2026 sur la proposition du Premier ministre est la suivante :
      Les ministres
      M. Laurent NUNEZ, ministre de l’Intérieur ;
      Mme Catherine VAUTRIN, ministre des Armées et des Anciens combattants ;
      M. Jean-Pierre FARANDOU, ministre du Travail et des Solidarités ;
      Mme Monique BARBUT, ministre de la Transition écologique, de la Biodiversité et des Négociations internationales sur le climat et la nature ;
      M. Gérald DARMANIN, garde des Sceaux, ministre de la Justice ;
      M. Roland LESCURE, ministre de l’Économie, des Finances et de la Souveraineté industrielle, énergétique et numérique ;
      M. Serge PAPIN, ministre des Petites et moyennes entreprises, du Commerce, de l’Artisanat, du Tourisme et du Pouvoir d’achat ;
      Mme Annie GENEVARD, ministre de l’Agriculture, de l’Agro-alimentaire et de la Souveraineté alimentaire ;
      M. Édouard GEFFRAY, ministre de l’Éducation nationale ;
      M. Jean-Noël BARROT, ministre de l’Europe et des Affaires étrangères ;
      Mme Stéphanie RIST, ministre de la Santé, des Familles, de l’Autonomie et des Personnes handicapées ;
      Mme Catherine PÉGARD, ministre de la Culture ;
      Mme Naïma MOUTCHOU, ministre des Outre-mer ;
      Mme Françoise GATEL, ministre de l’Aménagement du territoire et de la Décentralisation ;
      M. David AMIEL, ministre de l’Action et des Comptes publics ;
      M. Philippe BAPTISTE, ministre de l’Enseignement supérieur, de la Recherche et de l’Espace ;
      Mme Marina FERRARI, ministre des Sports, de la Jeunesse et de la Vie associative ;
      M. Philippe TABAROT, ministre des Transports ;
      M. Vincent JEANBRUN, ministre de la Ville et du Logement.
      Les ministres délégués
      Auprès du Premier ministre :
      M. Laurent PANIFOUS, chargé des Relations avec le Parlement ;
      Mme Maud BREGEON, porte-parole du Gouvernement et chargée de l’Énergie auprès du ministre de l’Economie, des Finances et de la Souveraineté industrielle, énergétique et numérique ;
      Mme Aurore BERGÉ, chargée de l’Égalité entre les femmes et les hommes et de la Lutte contre les discriminations ;
      Auprès du ministre de l’Intérieur :
      M. Jean-Didier BERGER ;
      Mme Marie-Pierre VEDRENNE, chargée de la Citoyenneté ;
      Auprès de la ministre des Armées et des Anciens combattants :
      Mme Alice RUFO ;
      Auprès du ministre du Travail et des Solidarités et du ministre de l’Éducation nationale :
      Mme Sabrina ROUBACHE, chargée de l’Enseignement et de la Formation professionnels et de l’Apprentissage ;
      Auprès de la ministre de la Transition écologique, de la Biodiversité et des Négociations internationales sur le climat et la nature :
      Mme Catherine CHABAUD, chargée de la Mer et de la Pêche ;
      M. Mathieu LEFÈVRE, chargé de la Transition écologique ;
      Auprès du ministre de l’Économie, des Finances et de la Souveraineté industrielle, énergétique et numérique :
      M. Sébastien MARTIN, chargé de l’Industrie ;
      Mme Anne LE HÉNANFF, chargée de l’Intelligence artificielle et du Numérique ;
      Auprès du ministre de l’Europe et des Affaires étrangères :
      M. Benjamin HADDAD, chargé de l’Europe ;
      M. Nicolas FORISSIER, chargé du Commerce extérieur et de l'Attractivité ;
      Mme Éléonore CAROIT, chargée de la Francophonie, des Partenariats internationaux et des Français de l’étranger ;
      Auprès de la ministre de la Santé, des Familles, de l’Autonomie et des Personnes handicapées :
      Mme Camille GALLIARD-MINIER, chargée de l’Autonomie et des Personnes handicapées ;
      Auprès de la ministre de l’Aménagement du territoire et de la Décentralisation :
      M. Michel FOURNIER, chargé de la Ruralité.
    note: >-
      The government's own reproduction of the composition as it stands after the February
      2026 reshuffle, i.e. the décret du 12 octobre 2025 as amended by the décrets of 22
      and 26 February 2026 — the currently applicable composition. This is the primary
      enumerating source for this file, at tier 2 rather than tier 1 only because the
      Légifrance text of the decree itself cannot be archived; see methodology_notes. The
      page carries "Publié le 26/02/2026" and "Modifié le 27/02/2026". The décrets
      d'attributions of 18 March 2026 (nos 2026-184, 2026-185, 2026-186, 2026-187 and
      2026-192) independently corroborate the five delegated posts this composition
      created or re-scoped.

