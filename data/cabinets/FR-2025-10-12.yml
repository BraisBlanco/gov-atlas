        overseas départements and collectivités and runs their development programmes, but it is
        not a territorial-administration ministry in the sense the id implies. An
        overseas_territories id is the addition this curator would propose.
      es: >-
        La taxonomía no tiene id para territorios de ultramar o dependientes, y esa es la única
        laguna que este país ha hecho notar de verdad. Ambas etiquetas son aproximaciones: el
        departamento administra los departamentos y colectividades de ultramar y gestiona sus
        programas de desarrollo, pero no es un ministerio de administración territorial en el
        sentido que sugiere el id. Un id overseas_territories es la adición que este curador
        propondría.

