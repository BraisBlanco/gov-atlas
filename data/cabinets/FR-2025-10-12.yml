      Ministère des Sports, de la Jeunesse et de la Vie associative
      Ministère des Transports
      Ministère de la Ville et du Logement
    note: >-
      The standing official directory of the Government, snapshotted 18 July 2026, nine
      days before the access date. Two things make it worth citing alongside the February
      announcement. First, its navigation names the departments as departments — nineteen
      "Ministère de ..." headings plus "Premier ministre" — which is what this dataset
      counts, whereas the decree names ministers. Second, it shows the same nineteen
      departments and the same sixteen delegated ministers still in place in July 2026, so
      nothing changed between the reshuffle and the access date. One discrepancy with the
      February announcement and with Légifrance, recorded rather than smoothed over: this
      navigation writes "du Commerce, de l’Artisanat et du Tourisme et du Pouvoir d’achat"
      where both the decree and the announcement write "du Commerce, de l’Artisanat, du
      Tourisme et du Pouvoir d’achat". We follow the decree's wording for the department's
      name_original. The page is dated "Annoncé le 26/02/2026".

  - id: info-gouv-composition-2025-10-12
    tier: 2
    type: government_website
    publisher: Gouvernement de la République française — info.gouv.fr
    title: Composition du gouvernement de Sébastien Lecornu
    url: https://www.info.gouv.fr/actualite/composition-du-gouvernement-du-sebastien-lecornu
    archive_url: https://web.archive.org/web/20260215071913/https://www.info.gouv.fr/actualite/composition-du-gouvernement-du-sebastien-lecornu
    lang: fr
    published: 2025-10-12
    accessed: 2026-07-27
    quote: |-
      Le palais de l'Élysée a annoncé la nomination du gouvernement de Sébastien Lecornu dimanche 12 octobre 2025.
      Auprès de la ministre de l’Action et des Comptes publics :
      M. David AMIEL, chargé de la Fonction publique et de la Réforme de l’État.
      Le Président de la République réunira l’ensemble des membres du Gouvernement pour un Conseil des ministres qui se tiendra le mardi 14 octobre à 10 heures.
    note: >-
      Cited for two things the current composition cannot show. It establishes took_office
      — the ministers were named on 12 October 2025, two days after the Prime Minister's
      own appointment decree of 10 October 2025 — and it evidences the one delegated
      portfolio that has since disappeared, "chargé de la Fonction publique et de la
      Réforme de l'État", which the February 2026 composition no longer contains. Its
      nineteen ministres are the same nineteen departments as today's, under the same
      names, which is the check that no department was created, merged or renamed during
      the term. The order of two entries differs from the current one, Culture and Santé
      having swapped rank when the culture minister was replaced; precedence order is not a
      structural fact and this file follows the current listing.

  - id: constitution-1958
    tier: 1
    type: statute
    publisher: Conseil constitutionnel
    title: Constitution du 4 octobre 1958 — texte intégral en vigueur
    url: https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur
    archive_url: https://web.archive.org/web/20260706131408/https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur
    lang: fr
    published: null
    accessed: 2026-07-27
    quote: |-
      ARTICLE 8.
      Le Président de la République nomme le Premier ministre. Il met fin à ses fonctions sur la présentation par celui-ci de la démission du Gouvernement.
      Sur la proposition du Premier ministre, il nomme les autres membres du Gouvernement et met fin à leurs fonctions.
      ARTICLE 9.
      Le Président de la République préside le conseil des ministres.
      ARTICLE 21.
      Le Premier ministre dirige l'action du Gouvernement.
    note: >-
      Cited only for the Prime Minister's office, and deliberately not for any counted
      ministry: the Constitution establishes that the Prime Minister heads the Government
      and that the President, not the Prime Minister, chairs the conseil des ministres, but
      it names no department, so it cannot support the existence of one. That is why France
      is graded B — attaching this tier-1 source to the nineteen departments would raise the
      grade to A on evidence that does not mention them.

entities:
  # Listing order follows the official directory: Premier ministre, the ministres
  # délégués attached to him, then each ministerial department with its own délégués.
  - id: FR-2025-premier-ministre
    order: 1
    name_original: Premier ministre
    abbreviation_original: null
    name_en: Office of the Prime Minister
    name_es: Oficina del Primer Ministro
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Premier ministre
    head_title_en: Prime Minister
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: null
    sources: [constitution-1958, info-gouv-composition-directory, info-gouv-composition-2025-10-12]
    note:
      en: >-
        Not a ministerial department: the composition decree does not name it among the
        ministres and it holds no portfolio. It is recorded because its holder heads the
        Government under article 21 of the Constitution, which is what makes the seat count
        20 while the department count is 19. The Prime Minister is appointed by a separate
        decree from the one that appoints the ministers.
      es: >-
        No es un departamento ministerial: el decreto de composición no lo enumera entre
        los ministres y no tiene cartera. Se registra porque su titular dirige el Gobierno
        conforme al artículo 21 de la Constitución, y eso es lo que hace que los asientos
        sean 20 mientras los departamentos son 19. El primer ministro se nombra por un
        decreto distinto del que nombra a los ministros.

  - id: FR-2025-md-relations-parlement
    order: 2
    name_original: Ministre délégué auprès du Premier ministre, chargé des Relations avec le Parlement
    abbreviation_original: null
    name_en: Delegated Minister to the Prime Minister for Relations with Parliament
    name_es: Ministro delegado ante el Primer Ministro, encargado de las Relaciones con el Parlamento
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministre délégué
    head_title_en: Delegated Minister
    has_cabinet_seat: false
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: null
    sources: [info-gouv-composition-2026-02-26, info-gouv-composition-directory]
    note:
      en: >-
        A borderline case, recorded so the borderline is visible. Unlike the other
        delegated ministers this one is granted participation in the conseil des ministres
        without restriction by the composition decree, so a defensible curator could set
        has_cabinet_seat: true here and raise cabinet_seats_count to 22. We do not, because
        the post heads no department and the clause granting participation could not be
        cited from an archived source. It is still not a ministry on any reading.
      es: >-
        Caso fronterizo, registrado para que la frontera se vea. A diferencia de los demás
        ministros delegados, el decreto de composición le concede participación sin
        restricciones en el conseil des ministres, por lo que un curador defendible podría
        poner aquí has_cabinet_seat: true y elevar cabinet_seats_count a 22. No lo hacemos,
        porque el puesto no encabeza ningún departamento y la cláusula que concede esa
        participación no pudo citarse desde una fuente archivada. En ninguna lectura es un
        ministerio.

  - id: FR-2025-md-porte-parole-energie
    order: 3
    name_original: Ministre déléguée, porte-parole du Gouvernement auprès du Premier ministre et ministre déléguée, chargée de l’Énergie auprès du ministre de l’Économie, des Finances et de la Souveraineté industrielle, énergétique et numérique
    abbreviation_original: null
