    note: >-
      The instrument that enumerates the Government, published in Monitorul Oficial al
      României, Partea I, nr. 580 of 23 June 2025 and adopted by the Chamber of Deputies and
      the Senate in joint session the same day. Anexa nr. 1 is quoted in full above; Anexa
      nr. 2, not quoted, is the 2025-2028 government programme of the PSD-PNL-USR-UDMR
