        se etiqueta `regional_development` (que en esta taxonomía cubre los fondos de cohesión) y
        `reconstruction` (fondos de recuperación). Deliberadamente no se etiqueta
        `european_affairs`: administra dinero, mientras que las relaciones con la Unión Europea
