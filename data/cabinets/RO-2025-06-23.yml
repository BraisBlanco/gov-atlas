    note:
      en: >-
        Position 17 of Anexa nr. 1 to Hotărârea Parlamentului nr. 25/2025. Its name and its
        breadth are the work of article 1 of OUG nr. 153/2024, which merged the Ministerul
        Familiei, Tineretului și Egalității de Șanse into the labour ministry by absorption and
        renamed the result. One consequence is worth stating: equality lost its department in
        that merger, and this cabinet has no ministry tagged `equality` at all.
        `social_security` is tagged because the pension house and the pension system sit here.
        On the access date this portfolio had no minister of its own. It fell vacant when the
        PSD ministers resigned in April 2026, and it is discharged ad interim by the minister of
        investments and European projects under article 46(2) and (3) of the Codul
        administrativ, which lets the Prime Minister propose that another member of the
        Government take on the duties for at most 45 days pending the appointment of a successor
        — an appointment a Government whose mandate has ended cannot make. `head_count: 0` is
        what encodes that vacancy, and it is why this cabinet is thirteen people rather than
        nineteen posts. It does not mean the department is unled or that it has no minister at
        all: `has_cabinet_seat` stays true because the seat exists and is filled at the
        Government's table by the interim minister, and `counts_as_ministry` stays true because
        the ministry exists and its head holds ministerial rank. No `shared_head_with` links
        this entity to that minister's own department, because the two posts are not merged and
        recording them as one would be a false structural claim about Romania.
      es: >-
        Posición 17 del anexo n.º 1 de la Hotărârea Parlamentului nr. 25/2025. Su nombre y su
        amplitud son obra del artículo 1 de la OUG nr. 153/2024, que fusionó por absorción el
        Ministerul Familiei, Tineretului și Egalității de Șanse en el ministerio de Trabajo y
        renombró el resultado. Conviene decir una consecuencia: la igualdad perdió su
        departamento en esa fusión, y este gabinete no tiene ningún ministerio etiquetado
        `equality`. Se etiqueta `social_security` porque la caja de pensiones y el sistema de
        pensiones están aquí. En la fecha de consulta esta cartera no tenía ministro propio.
        Quedó vacante cuando los ministros del PSD dimitieron en abril de 2026, y la desempeña
        de forma interina el ministro de Inversiones y Proyectos Europeos conforme al artículo
        46(2) y (3) del Codul administrativ, que permite al primer ministro proponer que otro
        miembro del Gobierno asuma las atribuciones durante un máximo de 45 días hasta el
        nombramiento de un sucesor, nombramiento que un Gobierno cuyo mandato ha terminado no
        puede hacer. `head_count: 0` es lo que codifica esa vacante, y es la razón por la que
        este gabinete son trece personas y no diecinueve puestos. No significa que el
        departamento esté sin dirección ni que no tenga ningún ministro: `has_cabinet_seat`
        sigue siendo verdadero porque el asiento existe y lo ocupa en la mesa del Gobierno el
        ministro interino, y `counts_as_ministry` sigue siendo verdadero porque el ministerio
        existe y su titular tiene rango ministerial. Ningún `shared_head_with` enlaza esta
        entidad con el departamento propio de ese ministro, porque los dos cargos no están
        fusionados y registrarlos como uno sería una afirmación estructural falsa sobre Rumanía.

