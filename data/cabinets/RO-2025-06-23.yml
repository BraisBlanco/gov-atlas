    sources: [mo-hp-25-2025, mo-oug-153-2024, gov-ro-ministere, gov-ro-cabinet-ministri, gov-ro-ministries-en]
    note:
      en: >-
        Position 18 of the investiture list, and the widest portfolio in this cabinet. The first
        four tags follow the four words of its name. The last four are added on the authority of
        OUG nr. 153/2024, which is why this entity cites it: article 6(1) gave the ministry its
        current name, article 5(b) transferred digitalisation, innovation and communications to
        it from the abolished Ministerul Cercetării, Inovării și Digitalizării, and article 6(2)
        gave it the state's shareholder role and the privatisation remit for the companies under
        its authority. So `telecommunications`, `innovation` and `state_assets` are primary
        responsibilities of this department even though none of them appears in its name, and
        Romania has no separate ministry for digitalisation, for industry or for state holdings.
        Eight tags is the most any entity in this file carries, and it is a fact about Romanian
        cabinet structure rather than a failure to choose.
      es: >-
        Posición 18 de la lista de investidura, y la cartera más amplia de este gabinete. Las
        cuatro primeras etiquetas siguen las cuatro palabras de su nombre. Las cuatro últimas se
        añaden con fundamento en la OUG nr. 153/2024, y por eso esta entidad la cita: el artículo
        6(1) dio al ministerio su nombre actual, el artículo 5(b) le transfirió la digitalización,
        la innovación y las comunicaciones desde el suprimido Ministerul Cercetării, Inovării și
        Digitalizării, y el artículo 6(2) le atribuyó la condición de accionista del Estado y la
        competencia de privatización de las sociedades bajo su autoridad. Así que
        `telecommunications`, `innovation` y `state_assets` son responsabilidades principales de
        este departamento aunque ninguna figure en su nombre, y Rumanía no tiene un ministerio
        separado de digitalización, de industria ni de patrimonio estatal. Ocho etiquetas es lo
        máximo que lleva una entidad de este fichero, y es un hecho sobre la estructura del
        gabinete rumano y no una incapacidad de elegir.

