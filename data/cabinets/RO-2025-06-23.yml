entities:
  # --- the head of government -----------------------------------------------------
  - id: RO-2025-prim-ministru
    order: 1
    name_original: Prim-ministru
    abbreviation_original: null
    name_en: Office of the Prime Minister
    name_es: Presidencia del Gobierno
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: prim-ministru
    head_title_en: Prime Minister
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://www.gov.ro
    sources:
      - mo-hp-25-2025
      - cod-administrativ
      - gov-ro-cabinet-ministri
      - juridice-motiune-cenzura-2026
      - euronews-ro-investire-vestea
    note:
      en: >-
        Position 1 of Anexa nr. 1 to Hotărârea Parlamentului nr. 25/2025, and the apex of the
        cabinet rather than a portfolio department: article 28 of the Codul administrativ gives
        the Prime Minister the direction of the Government and the coordination of its members,
        and no field of activity. Recorded because the post carries a seat in the Government
        under article 18, which is what makes the seat count one higher than it would otherwise
        be. On the access date the Prime Minister was additionally interim minister of energy;
        that is recorded on the energy ministry's entity and adds no seat here.
      es: >-
        Posición 1 del anexo n.º 1 de la Hotărârea Parlamentului nr. 25/2025, y cúspide del
        gabinete y no departamento con cartera: el artículo 28 del Codul administrativ atribuye
        al primer ministro la dirección del Gobierno y la coordinación de sus miembros, y ningún
        ámbito de actividad. Se registra porque el cargo lleva asiento en el Gobierno conforme al
        artículo 18, y eso es lo que hace que el recuento de asientos sea uno más alto de lo que
        sería. En la fecha de consulta el primer ministro era además ministro interino de
        Energía; eso se recoge en la entidad del ministerio de Energía y no añade asiento aquí.

  # --- deputy prime ministers holding no portfolio ---------------------------------
  - id: RO-2025-viceprim-ministru-2
    order: 2
    name_original: Viceprim-ministru
    abbreviation_original: null
    name_en: Deputy Prime Minister (second position in the investiture list)
    name_es: Viceprimer ministro (segunda posición de la lista de investidura)
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: viceprim-ministru
    head_title_en: Deputy Prime Minister
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: deputy_head_without_portfolio
    valid_to: 2026-04-27
    url: null
    sources: [mo-hp-25-2025, cod-administrativ, juridice-decret-243-2026]
    note:
      en: >-
        Position 2 of Anexa nr. 1 to Hotărârea Parlamentului nr. 25/2025: a member of the
        Government holding the title of viceprim-ministru and no ministry, which is the textbook
        case of `deputy_head_without_portfolio`. It carried a seat under article 18 of the Codul
        administrativ and no field of activity, and its holder had only the aparatul propriu de
        lucru that article 21 gives a deputy prime minister, which is a personal office and not
        a department. Closed on 27 April 2026, when Decretul nr. 243/2026 took note of Marian
        Neacșu's resignation and declared the post vacant after the PSD withdrew its support
        from the coalition; the cabinet went from twenty seats to nineteen. It was not refilled,
        and could not be: eight days later the Government's mandate ended on a censure motion,
        and article 37(3) of the Codul administrativ leaves a dismissed Government only the
        acts needed to administer public affairs. The entity is named by its position in the
        annex rather than by its holder because this dataset records the seat, not the person.
      es: >-
        Posición 2 del anexo n.º 1 de la Hotărârea Parlamentului nr. 25/2025: un miembro del
        Gobierno con el título de viceprim-ministru y sin ministerio, que es el caso de manual de
        `deputy_head_without_portfolio`. Llevaba asiento conforme al artículo 18 del Codul
        administrativ y ningún ámbito de actividad, y su titular sólo disponía del aparatul
        propriu de lucru que el artículo 21 concede a un viceprimer ministro, que es un gabinete
        personal y no un departamento. Cerrado el 27 de abril de 2026, cuando el Decretul nr.
        243/2026 tomó nota de la dimisión de Marian Neacșu y declaró vacante el cargo tras la
        retirada del apoyo del PSD a la coalición; el gabinete pasó de veinte asientos a
        diecinueve. No se volvió a ocupar, ni podía: ocho días después el mandato del Gobierno
        terminó por una moción de censura, y el artículo 37(3) del Codul administrativ sólo deja
        a un Gobierno destituido los actos necesarios para administrar los asuntos públicos. La
        entidad se nombra por su posición en el anexo y no por su titular porque este conjunto de
        datos registra el asiento, no la persona.

