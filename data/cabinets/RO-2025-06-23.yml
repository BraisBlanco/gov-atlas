    title: >-
      HOTĂRÂRE nr. 25 din 23 iunie 2025 pentru acordarea încrederii Guvernului
    url: https://legislatie.just.ro/Public/DetaliiDocument/299203
    archive_url: https://web.archive.org/web/20260121184300/https://legislatie.just.ro/public/DetaliiDocument/299203
    lang: ro
    published: 2025-06-23
    accessed: 2026-07-28
    quote: |-
      HOTĂRÂRE nr. 25 din 23 iunie 2025 pentru acordarea încrederii Guvernului
      Articolul 1
      (1) Se acordă încredere Guvernului, în componența prevăzută în anexa nr. 1, pentru realizarea Programului de guvernare prevăzut în anexa nr. 2.
      (2) Anexele nr. 1 și 2 fac parte integrantă din prezenta hotărâre.
      Anexa nr. 1
      LISTA
      Guvernului României
      1. Ilie-Gavril Bolojan - prim-ministru
      2. Marian Neacșu - viceprim-ministru
      3. Tánczos Barna - viceprim-ministru
      4. Michael-Dragoș Anastasiu - viceprim-ministru
      5. Marian-Cătălin Predoiu - viceprim-ministru, ministrul afacerilor interne
      6. Liviu-Ionuț Moșteanu - viceprim-ministru, ministrul apărării naționale
      7. Ciprian-Constantin Șerban - ministrul transporturilor și infrastructurii
      8. Alexandru Nazare - ministrul finanțelor
      9. Radu Marinescu - ministrul justiției
      10. Florin-Ionuț Barbu - ministrul agriculturii și dezvoltării rurale
