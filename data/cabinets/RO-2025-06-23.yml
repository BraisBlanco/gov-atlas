    note:
      en: >-
        Position 7 of Anexa nr. 1 to Hotărârea Parlamentului nr. 25/2025. `shipping` is tagged
        because the naval authority and the maritime and inland ports sit in this ministry,
        which is where a reader looking for a Romanian ministry of the sea would otherwise fail
        to find one. On the access date this portfolio had no minister of its own. It fell
        vacant when the PSD ministers resigned in April 2026, and it is discharged ad interim by
        the minister of national defence under article 46(2) and (3) of the Codul administrativ,
        which lets the Prime Minister propose that another member of the Government take on the
        duties for at most 45 days pending the appointment of a successor — an appointment a
        Government whose mandate has ended cannot make. `head_count: 0` is what encodes that
        vacancy, and it is why this cabinet is thirteen people rather than nineteen posts. It
        does not mean the department is unled or that it has no minister at all:
        `has_cabinet_seat` stays true because the seat exists and is filled at the Government's
        table by the interim minister, and `counts_as_ministry` stays true because the ministry
        exists and its head holds ministerial rank. No `shared_head_with` links this entity to
        that minister's own department, because the two posts are not merged and recording them
        as one would be a false structural claim about Romania.
      es: >-
        Posición 7 del anexo n.º 1 de la Hotărârea Parlamentului nr. 25/2025. Se etiqueta
        `shipping` porque la autoridad naval y los puertos marítimos y fluviales están en este
        ministerio, que es donde un lector que buscara un ministerio rumano del mar no lo
        encontraría de otro modo. En la fecha de consulta esta cartera no tenía ministro propio.
        Quedó vacante cuando los ministros del PSD dimitieron en abril de 2026, y la desempeña
        de forma interina el ministro de Defensa Nacional conforme al artículo 46(2) y (3) del
        Codul administrativ, que permite al primer ministro proponer que otro miembro del
        Gobierno asuma las atribuciones durante un máximo de 45 días hasta el nombramiento de un
        sucesor, nombramiento que un Gobierno cuyo mandato ha terminado no puede hacer.
        `head_count: 0` es lo que codifica esa vacante, y es la razón por la que este gabinete
        son trece personas y no diecinueve puestos. No significa que el departamento esté sin
        dirección ni que no tenga ningún ministro: `has_cabinet_seat` sigue siendo verdadero
        porque el asiento existe y lo ocupa en la mesa del Gobierno el ministro interino, y
        `counts_as_ministry` sigue siendo verdadero porque el ministerio existe y su titular
        tiene rango ministerial. Ningún `shared_head_with` enlaza esta entidad con el
        departamento propio de ese ministro, porque los dos cargos no están fusionados y
        registrarlos como uno sería una afirmación estructural falsa sobre Rumanía.

