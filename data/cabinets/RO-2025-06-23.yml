      rather than ministries and includes the holder of each post, which is why the
      `name_original` of each entity in this file comes from OUG nr. 153/2024 and the
      Government's register instead. The holders named in the annex are those of 23 June 2025
      and several have since changed; this file records posts, not people. Article 2 of the
      resolution, not quoted, suspends the minister of finance from the board of the National
      Bank for the duration of his mandate.

  - id: cod-administrativ
    tier: 1
    type: statute
    publisher: Monitorul Oficial al României, Partea I
    title: >-
      ORDONANȚĂ DE URGENȚĂ nr. 57 din 3 iulie 2019 privind Codul administrativ (text
      consolidat)
    url: https://legislatie.just.ro/Public/DetaliiDocument/215925
    archive_url: https://web.archive.org/web/20260314102748/https://legislatie.just.ro/Public/DetaliiDocument/215925
    lang: ro
    published: 2019-07-05
    accessed: 2026-07-28
    quote: |-
      Articolul 18 Componența Guvernului
      Guvernul este alcătuit din prim-ministru și miniștri. Din Guvern pot face parte: viceprim-miniștri, miniștri de stat, miniștri delegați, miniștri cu însărcinări speciale pe lângă prim-ministru, numiți de Președintele României pe baza votului de încredere acordat de Parlament.
      Articolul 19 Structura aparatului de lucru al Guvernului
      Aparatul de lucru al Guvernului este alcătuit din Secretariatul General al Guvernului, Cancelaria Prim-ministrului, aparatul propriu de lucru al viceprim-ministrului, departamente și alte structuri organizatorice cu atribuții specifice stabilite prin hotărâre a Guvernului.
      Articolul 20 Secretariatul General al Guvernului
      (1) Guvernul are un Secretariat General care este condus de secretarul general al Guvernului care are rang de ministru, numit prin decizie a prim-ministrului.
      Articolul 22 Cancelaria Prim-Ministrului
      (2) Cancelaria Prim-Ministrului este condusă de șeful Cancelariei Prim-Ministrului, care are rang de ministru, numit și eliberat din funcție prin decizie a prim-ministrului.
      Articolul 37
      (3) În cazul încetării mandatului sau, în condițiile prevăzute de Constituție, până la depunerea jurământului de către membrii noului Guvern, Guvernul continuă să emită numai actele cu caracter individual sau normativ, necesare pentru administrarea treburilor publice, fără a promova politici noi. În această perioadă, Guvernul nu poate să emită ordonanțe sau ordonanțe de urgență și nu poate iniția proiecte de lege.
      Articolul 46 Interimatul funcției de membru al Guvernului
      (2) Prevederile alin. (1) se aplică în mod corespunzător și celorlalți membri ai Guvernului, la propunerea prim-ministrului, pentru o perioadă de cel mult 45 de zile.
      (3) În situațiile prevăzute la alin. (2), înăuntrul termenului de 45 de zile, prim-ministrul iniţiază procedurile prevăzute de lege pentru numirea unui alt membru al Guvernului în calitate de ministru interimar.
      Articolul 52 Rolul și atribuțiile ministerelor
      (1) Ministerele sunt organe de specialitate ale administrației publice centrale care realizează politica guvernamentală în domeniile de interes stabilite de Guvern.
      Articolul 54 Personalitatea juridică a ministerelor
      Ministerele sunt persoane juridice de drept public, au sediul în municipiul București și sunt conduse de miniștri.
    note: >-
      Consolidated text of the Administrative Code, published in Monitorul Oficial al
      României, Partea I, nr. 555 of 5 July 2019 and amended many times since; the snapshot
      cited reflects the consolidation available in March 2026, the latest amendment shown in
      the relevant titles being of November 2025. The quotation is a compilation of the
      articles this file relies on, reproduced verbatim and in the document's own order, each
      under its own article number and marginal title. Cited for four distinct claims: who
      belongs to the Government (art. 18, which is why a viceprim-ministru holds a cabinet
      seat and the secretary-general does not), what the Secretariatul General al Guvernului
      and the Cancelaria Prim-Ministrului are (arts. 19, 20, 22), what a dismissed Government
      may still do (art. 37(3)), and what an interim minister is (art. 46). Article 597(2)
      letter c), not quoted here for length, repeals the Legea nr. 90/2001 privind
      organizarea și funcționarea Guvernului României și a ministerelor by name — worth
      recording because secondary sources still describe that repealed act as Romania's
      framework act for the Government.

  - id: mo-oug-153-2024
    tier: 1
    type: official_gazette
    publisher: Monitorul Oficial al României, Partea I
    title: >-
      ORDONANȚĂ DE URGENȚĂ nr. 153 din 23 decembrie 2024 privind stabilirea unor măsuri la
      nivelul administrației publice centrale (text consolidat)
    url: https://legislatie.just.ro/Public/DetaliiDocument/293015
    archive_url: https://web.archive.org/web/20251118075833/https://legislatie.just.ro/Public/DetaliiDocument/293015
    lang: ro
    published: 2024-12-24
    accessed: 2026-07-28
    quote: |-
      Având în vedere Hotărârea Parlamentului României nr. 33/2024 pentru acordarea încrederii Guvernului, luând în considerare necesitatea stabilirii măsurilor care să permită îndeplinirea, în cel mai scurt timp, în noua structură, a activității Guvernului și a ministerelor,
      Articolul 1
      (1) La data intrării în vigoare a prezentei ordonanțe de urgență, Ministerul Muncii și Solidarității Sociale se reorganizează prin fuziune prin absorbție cu Ministerul Familiei, Tineretului și Egalității de Șanse, care se desființează.
      (2) Ca urmare a reorganizării prin fuziune prin absorbție conform alin. (1), Ministerul Muncii și Solidarității Sociale își schimbă denumirea în Ministerul Muncii, Familiei, Tineretului și Solidarității Sociale.
      Articolul 5
      La data intrării în vigoare a prezentei ordonanțe de urgență, Ministerul Cercetării, Inovării și Digitalizării se reorganizează prin divizare totală și își încetează activitatea, prin împărțirea întregului său patrimoniu, personal și a activității după cum urmează:
      a) patrimoniul, personalul, posturile și activitățile aferente domeniului cercetare se preiau de către Ministerul Educației și Cercetării pentru Autoritatea Națională pentru Cercetare;
      b) patrimoniul, personalul, posturile și activitățile aferente domeniilor digitalizare, inovare și comunicații se preiau de către Ministerul Economiei, Antreprenoriatului și Turismului.
      Articolul 6
      (1) Ministerul Economiei, Antreprenoriatului și Turismului își schimbă denumirea în Ministerul Economiei, Digitalizării, Antreprenoriatului și Turismului.
      Articolul 7
      (1) Ministerul Educației își schimbă denumirea în Ministerul Educației și Cercetării.
    note: >-
      The reorganisation ordinance that produced the sixteen-ministry structure this cabinet
      inherited, published in Monitorul Oficial al României, Partea I, nr. 1319 of 24
      December 2024. It was issued after the previous investiture — Hotărârea Parlamentului
      nr. 33/2024, for the Ciolacu Government — and is cited here because the Bolojan
      Government made no reorganisation of its own: the sixteen portfolios in Hotărârea nr.
      25/2025 are the sixteen ministries left standing by this ordinance. It is the source for
      the current legal names of four of them, and for the fact that digitalisation,
      innovation and communications sit in the economy ministry while research sits in the
      education ministry, which is why those areas are tagged where they are. Cited as the
      consolidated text, whose recorded consolidations are of 31 January and 31 March 2025.

