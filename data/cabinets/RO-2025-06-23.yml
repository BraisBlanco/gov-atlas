        PSD dimitieron en abril de 2026, y la desempeña de forma interina el ministro de
        Desarrollo, Obras Públicas y Administración conforme al artículo 46(2) y (3) del Codul
        administrativ, que permite al primer ministro proponer que otro miembro del Gobierno
        asuma las atribuciones durante un máximo de 45 días hasta el nombramiento de un sucesor,
        nombramiento que un Gobierno cuyo mandato ha terminado no puede hacer. `head_count: 0`
        es lo que codifica esa vacante, y es la razón por la que este gabinete son trece
        personas y no diecinueve puestos. No significa que el departamento esté sin dirección ni
        que no tenga ningún ministro: `has_cabinet_seat` sigue siendo verdadero porque el
        asiento existe y lo ocupa en la mesa del Gobierno el ministro interino, y
        `counts_as_ministry` sigue siendo verdadero porque el ministerio existe y su titular
        tiene rango ministerial. Ningún `shared_head_with` enlaza esta entidad con el
        departamento propio de ese ministro, porque los dos cargos no están fusionados y
        registrarlos como uno sería una afirmación estructural falsa sobre Rumanía.

