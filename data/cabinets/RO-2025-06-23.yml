        continua, creada con el gabinete y nunca cerrada, porque lo que este conjunto de datos
        registra es el cargo y no su ocupante: el titular nombrado en el anexo lo dejó en el
        curso de 2025 y el Decretul nr. 1017/2025 del 30 de octubre de 2025 nombró a
        Oana-Clara Gheorghiu miembro del Gobierno como viceprim-ministru, que es el cargo que
        ocupa en la fecha de consulta. Conviene declarar una laguna del registro en lugar de
        disimularla. Entre la salida del primer titular y el 30 de octubre de 2025 el cargo
        parece haber estado cubierto por una designación interina, pero el decreto que lo
        acreditaría no pudo alcanzarse desde esta red y aquí no se recoge ninguna fecha para él.
        Por eso `valid_from` se deja nulo, lo cual es correcto para el cargo y puede sobrestimar
        en uno el recuento de asientos para un lector que reconstruya una fecha dentro de esa
        laguna. Nada de la foto actual depende de ello.

