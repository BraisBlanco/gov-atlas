  # --- recorded, not counted: ministry rank without a portfolio ---------------------
  - id: RO-2025-secretariat-general-guvern
    order: 21
    name_original: Secretariatul General al Guvernului
    abbreviation_original: null
    name_en: General Secretariat of the Government
    name_es: Secretaría General del Gobierno
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: secretarul general al Guvernului
    head_title_en: Secretary-General of the Government
    has_cabinet_seat: false
    head_count: 0
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://sgg.gov.ro
    sources: [cod-administrativ]
    note:
      en: >-
        The Government's own secretariat, and the closest thing Romania has to a chancellery.
        Recorded because its head holds the rank of minister under article 20(1) of the Codul
        administrativ and a reader who counts ministry-rank bodies will find it. It is not
        counted, and the exclusion reason chosen needs stating plainly: `not_headed_by_minister`
        is used rather than `head_of_government_office` because the decisive fact is not that
        the body serves the Prime Minister — it serves the Government as a whole, and article
        20(3) calls it the element of continuity and stability of governance — but that its head
        is not a member of the Government. Article 18 does not list the post among those that
        may belong to the Government, and article 31(b) has the secretary-general appointed by a
        decision of the Prime Minister rather than by presidential decree on a parliamentary
        vote of confidence. Rank of minister is not membership of the Government in Romanian
        law. `has_cabinet_seat` is false and `head_count` is 0 accordingly: the secretary-general
        attends and countersigns, but holds no seat, so this entity moves neither figure.
      es: >-
        El secretariado propio del Gobierno, y lo más parecido a una cancillería que tiene
        Rumanía. Se registra porque su titular tiene rango de ministro conforme al artículo 20(1)
        del Codul administrativ y un lector que cuente órganos con rango ministerial lo
        encontrará. No se cuenta, y el motivo de exclusión elegido conviene explicarlo con
        claridad: se usa `not_headed_by_minister` y no `head_of_government_office` porque el
        hecho decisivo no es que el órgano sirva al primer ministro —sirve al Gobierno en su
        conjunto, y el artículo 20(3) lo llama el elemento de enlace y estabilidad de la
        gobernación— sino que su titular no es miembro del Gobierno. El artículo 18 no enumera el
        cargo entre los que pueden formar parte del Gobierno, y el artículo 31(b) hace que el
        secretario general sea nombrado por decisión del primer ministro y no por decreto
        presidencial sobre un voto de confianza parlamentario. El rango de ministro no es la
        condición de miembro del Gobierno en el derecho rumano. `has_cabinet_seat` es falso y
        `head_count` es 0 en consecuencia: el secretario general asiste y refrenda, pero no ocupa
        asiento, así que esta entidad no mueve ninguna de las dos cifras.

  - id: RO-2025-cancelaria-prim-ministrului
    order: 22
    name_original: Cancelaria Prim-Ministrului
    abbreviation_original: null
    name_en: Chancellery of the Prime Minister
    name_es: Cancillería del Primer Ministro
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: șeful Cancelariei Prim-Ministrului
    head_title_en: Head of the Prime Minister's Chancellery
    has_cabinet_seat: false
    head_count: 0
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: null
    sources: [cod-administrativ]
    note:
      en: >-
        A legal person in the subordination of the Prime Minister, financed through the budget of
        the General Secretariat, and part of the aparatul de lucru al Guvernului under article 19
        of the Codul administrativ. Recorded for the same reason as the General Secretariat:
        article 22(2) gives its head the rank of minister. Excluded as
        `head_of_government_office` rather than `not_headed_by_minister` — the reverse of the
        choice made one entity above — because here the decisive fact is what the body is: unlike
        the General Secretariat it serves the Prime Minister personally and sits in his
        subordination, which is precisely the office-of-the-head-of-government case. Its head is
        appointed and dismissed by decision of the Prime Minister and is not a member of the
        Government, so it carries no seat either. No official website of its own is published;
        the field is null rather than pointed at gov.ro, which is recorded as the Prime
        Minister's office above.
      es: >-
        Una persona jurídica en subordinación del primer ministro, financiada a través del
        presupuesto de la Secretaría General, y parte del aparatul de lucru al Guvernului conforme
        al artículo 19 del Codul administrativ. Se registra por la misma razón que la Secretaría
        General: el artículo 22(2) da rango de ministro a su titular. Se excluye como
        `head_of_government_office` y no como `not_headed_by_minister` —al revés que en la entidad
        anterior— porque aquí el hecho decisivo es lo que el órgano es: a diferencia de la
        Secretaría General sirve al primer ministro personalmente y está en su subordinación, que
        es exactamente el caso de la oficina del jefe de gobierno. Su titular es nombrado y cesado
        por decisión del primer ministro y no es miembro del Gobierno, así que tampoco lleva
        asiento. No se publica una web propia; el campo es nulo en lugar de apuntar a gov.ro, que
        se registra arriba como oficina del primer ministro.
