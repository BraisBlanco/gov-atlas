# Romania — government structure of the 135th Government of Romania (Guvernul Ilie Bolojan).
#
# See docs/DATA-CONTRACT.md. Six things worth knowing before reading the list:
#
#   1. Romania does not enumerate its ministries in a statute. The Codul administrativ
#      (OUG nr. 57/2019) says what a ministry *is* and who belongs to the Government, but
#      it names no department. The enumerating instrument is the parliamentary resolution
#      granting confidence: Anexa nr. 1 to Hotărârea Parlamentului nr. 25/2025 lists the
#      twenty members of the Government one by one, and those twenty positions contain
#      exactly sixteen ministerial portfolios.
#   2. The cabinet recorded here has been dismissed and is still in office. A motion of
#      censure carried on 5 May 2026; under article 37(3) of the Codul administrativ the
#      Government continues to issue only the acts needed to administer public affairs
#      until a new Government is sworn in. No new Government has been invested: the last
#      attempt failed the confidence vote on 22 June 2026. So `took_office` is still
#      2025-06-23 and `left_office` is still null.
#   3. Three figures, and the first methodology note says which is published and why:
#      sixteen ministries, nineteen posts of member of the Government, and thirteen people
#      actually in the Government on 28 July 2026. `cabinet_seats_count` is the thirteen,
#      because the project defines the seat count as distinct people.
#   4. Six of the sixteen portfolios have no minister of their own. The PSD ministers
#      resigned in April 2026 and a dismissed Government cannot appoint replacements, so
#      six portfolios are run *ad interim* by ministers of other departments. Those six
#      entities carry `head_count: 0` — the seat exists, nobody of their own holds it —
#      and deliberately no `shared_head_with`, which would assert a merger that does not
#      exist. The sixteen is structural and stable; the thirteen moves with the crisis.
#   5. Five members of the Government hold the title of viceprim-ministru. Two of them
#      head a ministry and are counted through it; three do not and are recorded as
#      deputy heads without portfolio, one of whose posts has since been vacated.
#   6. Nowhere does this file state "16" or "19". Both are derived from the entities.

country: RO
cabinet_id: RO-2025-06-23

cabinet_name_original: Guvernul Ilie Bolojan
cabinet_name_en: Bolojan Government
cabinet_name_es: Gobierno Bolojan

head_of_government_title_original: Prim-ministru
head_of_government_title_en: Prime Minister

took_office: 2025-06-23
left_office: null

methodology_notes:
  - en: >-
      Three figures, and it matters which one is published. 16 ministries. 19 posts of member
      of the Government. 13 people actually in the Government on 28 July 2026. The sixteen are
      the ministerial portfolios named in Anexa nr. 1 to Hotărârea Parlamentului nr. 25/2025,
      recorded here in that annex's own order. The nineteen posts are those sixteen plus the
      Prime Minister, who heads no department, plus the two serving deputy prime ministers who
      hold no portfolio. The thirteen is the number of distinct individuals, and it is the
      figure this file publishes as `cabinet_seats_count`, because that is what METHODOLOGY.md
      defines the seat count to be: distinct people holding a seat in the cabinet. Publishing
      19 would have made Romania's seat figure mean posts while every other country's means
      people, and a cross-country chart would then have mixed the two silently. The gap between
      19 and 13 is six vacancies: the PSD ministers resigned in April 2026 after their party
      withdrew from the coalition, and a Government whose mandate has ended cannot appoint
      successors, so six of the sixteen portfolios are discharged ad interim by ministers of
      other departments. Article 46(2) and (3) of the Codul administrativ is what makes those
      posts vacant rather than doubly held: an interim is one member of the Government taking on
      another's duties for at most 45 days, expressly pending the appointment of a new member.
      Each of the six therefore carries `head_count: 0`, which is how the vacancy is encoded,
      and none carries `shared_head_with`, which would have asserted a merger that does not
      exist. Read the two published figures differently: the 16 is structural and has not moved
      since this cabinet was invested, while the 13 is volatile and will change with the next
      appointment or investiture. This file never adds them.
    es: >-
      Tres cifras, y importa cuál se publica. 16 ministerios. 19 puestos de miembro del
      Gobierno. 13 personas realmente en el Gobierno el 28 de julio de 2026. Los dieciséis son
      las carteras ministeriales enumeradas en el anexo n.º 1 de la Hotărârea Parlamentului nr.
      25/2025, recogidas aquí en el orden de ese propio anexo. Los diecinueve puestos son esos
      dieciséis más el primer ministro, que no encabeza ningún departamento, más los dos
      viceprimeros ministros en ejercicio que no tienen cartera. Los trece son las personas
      distintas, y es la cifra que este fichero publica como `cabinet_seats_count`, porque es lo
      que METHODOLOGY.md define como recuento de asientos: personas distintas con asiento en el
      gabinete. Publicar 19 habría hecho que la cifra de asientos de Rumanía significara puestos
      mientras que la de todos los demás países significa personas, y un gráfico comparativo
      habría mezclado ambas cosas en silencio. La diferencia entre 19 y 13 son seis vacantes:
      los ministros del PSD dimitieron en abril de 2026 tras la retirada de su partido de la
      coalición, y un Gobierno cuyo mandato ha terminado no puede nombrar sucesores, así que
      seis de las dieciséis carteras las desempeñan de forma interina ministros de otros
      departamentos. El artículo 46(2) y (3) del Codul administrativ es lo que hace que esos
      cargos estén vacantes y no doblemente ocupados: una interinidad es un miembro del Gobierno
      que asume las atribuciones de otro durante un máximo de 45 días, expresamente hasta el
      nombramiento de un nuevo miembro. Cada una de las seis lleva por tanto `head_count: 0`,
      que es como se codifica la vacante, y ninguna lleva `shared_head_with`, que habría
      afirmado una fusión que no existe. Las dos cifras publicadas se leen de modo distinto: el
      16 es estructural y no se ha movido desde la investidura de este gabinete, mientras que el
      13 es volátil y cambiará con el próximo nombramiento o la próxima investidura. Este
      fichero nunca las suma.

  - en: >-
      Which cabinet is sitting, and why the question had to be asked. On the access date
      Romania had been governed for almost three months by a Government that Parliament had
      already dismissed. A motion of censure — moțiunea de cenzură MC.1/2026, "STOP
      «Planului Bolojan»", tabled by the PSD, AUR and PACE groups — was carried in the joint
      session of the Chamber of Deputies and the Senate on 5 May 2026 by 281 votes to 4, the
      largest majority ever recorded for a censure motion in Romania. That ended the
      Government's mandate, but not its office: article 37(3) of the Codul administrativ
      provides that until the members of the new Government are sworn in the Government
      continues to issue only the individual or normative acts necessary for administering
      public affairs, without promoting new policies, and may issue no ordinance and
      initiate no bill. No new Government has been invested: the most recent attempt, the
      cabinet proposed by the designated prime minister Adrian Veștea, was rejected by
      Parliament on 22 June 2026 by 189 votes to 23, short of the 233 that article 103(3) of
      the Constitution requires, and at the access date the Government's own register of
      cabinet members still listed the Bolojan cabinet. This
      dataset therefore records the Bolojan Government as the sitting cabinet, with
      `took_office` 2025-06-23 — the date it was invested and sworn in — and `left_office`
      null. The alternative readings are rejected: 5 May 2026 is not a `left_office`,
      because a Romanian government whose mandate has ended remains in office and this
      cabinet has no successor to hand over to; and the caretaker period is not a separate
      cabinet, because no new investiture, no presidential appointment decree and no new
      oath took place — it is the same Government under a reduced mandate.
    es: >-
      Qué gabinete está en funciones y por qué había que preguntarlo. En la fecha de consulta
      Rumanía llevaba casi tres meses gobernada por un Gobierno que el Parlamento ya había
      destituido. Una moción de censura —moțiunea de cenzură MC.1/2026, «STOP "Planului
      Bolojan"», presentada por los grupos del PSD, AUR y PACE— fue aprobada en la sesión
      conjunta de la Cámara de Diputados y el Senado el 5 de mayo de 2026 por 281 votos
      contra 4, la mayor mayoría jamás registrada para una moción de censura en Rumanía. Eso
      puso fin al mandato del Gobierno, pero no a su ejercicio: el artículo 37(3) del Codul
      administrativ establece que, hasta que los miembros del nuevo Gobierno tomen posesión,
      el Gobierno sigue emitiendo únicamente los actos individuales o normativos necesarios
      para la administración de los asuntos públicos, sin promover políticas nuevas, y no
      puede emitir ordenanzas ni iniciar proyectos de ley. No se ha investido ningún Gobierno
      nuevo. El presidente Nicușor Dan designó a Eugen Tomac, que se retiró el 14 de junio de
      2026, y después a Adrian Veștea, cuyo gabinete fue rechazado por el Parlamento el 22 de
      junio de 2026 con 189 votos a favor frente a los 233 exigidos; en la fecha de consulta
      no se había hecho ninguna designación posterior. Este conjunto de datos registra por
      tanto el Gobierno Bolojan como el gabinete vigente, con `took_office` 2025-06-23 —la
      fecha en que fue investido y juró— y `left_office` nulo. Se descartan las lecturas
      alternativas: el 5 de mayo de 2026 no es un `left_office`, porque un gobierno rumano
      cuyo mandato ha terminado sigue en funciones y este gabinete no tiene sucesor al que
      entregar los poderes; y el periodo en funciones no es un gabinete distinto, porque no
      hubo nueva investidura, ni decreto presidencial de nombramiento, ni nuevo juramento: es
      el mismo Gobierno con un mandato reducido.

  - en: >-
      Where the list of ministries comes from, and why it takes three documents. Romania has
      no equivalent of Spain's Real Decreto 829/2023: no legal instrument in force
      enumerates the ministerial departments. The Codul administrativ (OUG nr. 57/2019),
      which since 2019 has replaced the Legea nr. 90/2001 that older sources still cite as
      the framework act — article 597(2) letter c) repeals it by name — defines a ministry
      in article 52 and fixes the composition of the Government in article 18, but names not
      one department. The enumeration therefore rests on Anexa nr. 1 to Hotărârea
      Parlamentului nr. 25/2025, which lists the twenty members of the Government with their
      functions, quoted here in full: sixteen of the twenty positions are ministerial
      portfolios. That annex names *ministers* ("ministrul afacerilor interne"), not
      ministries, so the `name_original` field of each entity carries the ministry's own
      name, and those names come from two further sources — the reorganisation ordinance OUG
      nr. 153/2024, which is the instrument that gave four of them their current names, and
      the Government's own register of ministries on gov.ro, which publishes all sixteen.
      The three lists are the same sixteen bodies, and a reader can check that against the
      quotations in this file without opening any of the documents.
    es: >-
      De dónde sale la lista de ministerios y por qué hacen falta tres documentos. Rumanía no
      tiene un equivalente del Real Decreto 829/2023 español: ningún instrumento jurídico en
      vigor enumera los departamentos ministeriales. El Codul administrativ (OUG nr. 57/2019),
      que desde 2019 sustituye a la Legea nr. 90/2001 que las fuentes antiguas siguen citando
      como ley marco —el artículo 597(2) letra c) la deroga expresamente—, define lo que es un
      ministerio en su artículo 52 y fija la composición del Gobierno en su artículo 18, pero
      no nombra ni un departamento. La enumeración se apoya por tanto en el anexo n.º 1 de la
      Hotărârea Parlamentului nr. 25/2025, que enumera los veinte miembros del Gobierno con
      sus funciones y que aquí se cita íntegro: dieciséis de las veinte posiciones son carteras
      ministeriales. Ese anexo nombra *ministros* («ministrul afacerilor interne»), no
      ministerios, así que el campo `name_original` de cada entidad lleva el nombre propio del
      ministerio, y esos nombres provienen de dos fuentes adicionales: la ordenanza de
      reorganización OUG nr. 153/2024, que es el instrumento que dio a cuatro de ellos su
      nombre actual, y el registro de ministerios que el propio Gobierno publica en gov.ro,
      que recoge los dieciséis. Las tres listas son los mismos dieciséis órganos, y el lector
      puede comprobarlo con las citas de este fichero sin abrir ninguno de los documentos.

  - en: >-
      How the six vacancies are encoded, and why not with `shared_head_with`. On the access date
      the Government's own register showed the Prime Minister as interim minister of energy, the
      deputy prime minister Tánczos Barna as interim minister of agriculture, the minister of
      internal affairs as interim minister of justice, the minister of national defence as
      interim minister of transport, the minister of investments and European projects as
      interim minister of labour, and the minister of development as interim minister of health.
      Six portfolios, no minister of their own. Each of those six entities carries
      `has_cabinet_seat: true` and `head_count: 0`: the seat exists and is filled at the table
      by the interim minister, but nobody of the department's own holds it, so it contributes no
      person to the count. That is the whole mechanism, and it yields 13. What is deliberately
      not used is `shared_head_with`. It would produce the same 13, but it would do so by
      asserting that internal affairs and justice, or defence and transport, share a head as a
      standing arrangement — and they do not. Article 46(2) and (3) of the Codul administrativ
      makes an interim a temporary discharge of another member's duties, capped at 45 days and
      expressly pending the appointment of a new member: the post is vacant, not held twice. A
      vacancy is what `head_count: 0` says; a merger is what `shared_head_with` would have said.
      Two further things a reader should carry away. The 45-day cap has long since been
      exceeded, because article 47 requires a presidential appointment on the Prime Minister's
      proposal to end an interim and article 37(3) leaves a dismissed Government no power to
      make one — the vacancies are a symptom of the deadlock, not of neglect. And none of this
      touches `ministries_count`: all sixteen ministries exist, each is headed by a person of
      ministerial rank, and each is counted.
    es: >-
      Cómo se codifican las seis vacantes y por qué no con `shared_head_with`. En la fecha de
      consulta el propio registro del Gobierno mostraba al primer ministro como ministro interino
      de Energía, al viceprimer ministro Tánczos Barna como ministro interino de Agricultura, al
      ministro del Interior como ministro interino de Justicia, al ministro de Defensa Nacional
      como ministro interino de Transportes, al ministro de Inversiones y Proyectos Europeos como
      ministro interino de Trabajo y al ministro de Desarrollo como ministro interino de Sanidad.
      Seis carteras sin ministro propio. Cada una de esas seis entidades lleva
      `has_cabinet_seat: true` y `head_count: 0`: el asiento existe y lo ocupa en la mesa el
      ministro interino, pero nadie propio del departamento lo tiene, así que no aporta ninguna
      persona al recuento. Ése es todo el mecanismo, y da 13. Lo que deliberadamente no se usa es
      `shared_head_with`. Produciría el mismo 13, pero lo haría afirmando que Interior y Justicia,
      o Defensa y Transportes, comparten titular como arreglo estable, y no es así. El artículo
      46(2) y (3) del Codul administrativ configura la interinidad como el desempeño temporal de
      las atribuciones de otro miembro, limitado a 45 días y expresamente hasta el nombramiento de
      un nuevo miembro: el cargo está vacante, no doblemente ocupado. Una vacante es lo que dice
      `head_count: 0`; una fusión es lo que habría dicho `shared_head_with`. Dos cosas más que el
      lector debe llevarse. El límite de 45 días se ha superado con mucho, porque el artículo 47
      exige un nombramiento presidencial a propuesta del primer ministro para poner fin a una
      interinidad y el artículo 37(3) no deja a un Gobierno destituido poder para hacerlo: las
      vacantes son un síntoma del bloqueo y no de una negligencia. Y nada de esto afecta a
      `ministries_count`: los dieciséis ministerios existen, cada uno está encabezado por una
      persona con rango ministerial y cada uno se cuenta.

  - en: >-
      Five deputy prime ministers, two ministries, three seats without a portfolio. Anexa nr.
      1 to Hotărârea Parlamentului nr. 25/2025 gives the title of viceprim-ministru to five
      of the twenty members: positions 2, 3 and 4 hold it alone, while positions 5 and 6 hold
      it together with the internal affairs and national defence portfolios. Positions 5 and
      6 are counted once each, through their ministry, exactly as the data contract
      prescribes: the deputy-premiership adds nothing to either figure. Positions 2, 3 and 4
      are recorded as separate entities with `deputy_head_without_portfolio`, because each
      carries a seat in the Government under article 18 of the Codul administrativ and heads
      no department. Their ids and their `order` follow the annex's numbering rather than
      naming a holder, because the seat and not the person is what this dataset records. Two
      of the three were still in place at the access date; the third was vacated in April
      2026 and, because a dismissed Government cannot fill a vacancy, was not refilled.
      Romania publishes no count of its own that these figures can be checked against: the
      Government's register lists members without totalling them.
    es: >-
      Cinco viceprimeros ministros, dos ministerios, tres asientos sin cartera. El anexo n.º 1
      de la Hotărârea Parlamentului nr. 25/2025 atribuye el título de viceprim-ministru a cinco
      de los veinte miembros: las posiciones 2, 3 y 4 lo ostentan en solitario, mientras que
      las posiciones 5 y 6 lo ostentan junto con las carteras de Interior y de Defensa
      Nacional. Las posiciones 5 y 6 se cuentan una sola vez cada una, a través de su
      ministerio, exactamente como prescribe el contrato de datos: la vicepresidencia no añade
      nada a ninguna de las dos cifras. Las posiciones 2, 3 y 4 se registran como entidades
      separadas con `deputy_head_without_portfolio`, porque cada una lleva asiento en el
      Gobierno conforme al artículo 18 del Codul administrativ y no encabeza ningún
      departamento. Sus identificadores y su `order` siguen la numeración del anexo en lugar de
      nombrar a un titular, porque lo que este conjunto de datos registra es el asiento y no la
      persona. Dos de los tres seguían en pie en la fecha de consulta; el tercero quedó vacante
      en abril de 2026 y, como un Gobierno destituido no puede cubrir una vacante, no se
      volvió a ocupar. Rumanía no publica ninguna cifra propia con la que contrastar estos
      números: el registro del Gobierno enumera miembros sin totalizarlos.

  - en: >-
      Two bodies of ministerial rank are recorded and not counted, and both are genuine
      judgement calls. The Secretariatul General al Guvernului is the Government's own
      secretariat: article 20(1) of the Codul administrativ gives its head, the secretarul
      general al Guvernului, the rank of minister, and article 20(3) makes it "elementul de
      legătură și stabilitate al guvernării". It is excluded because it is not a portfolio
      department but part of the aparatul de lucru al Guvernului under article 19, and because
      its head is not a member of the Government: article 18 does not list the post, and
      article 31(b) has the secretary-general appointed by a decision of the Prime Minister
      rather than by presidential decree on a vote of confidence. It therefore carries no
      cabinet seat either, which is why it does not move the seat count. The Cancelaria
      Prim-Ministrului is excluded on the same reasoning — article 22(2) gives its head the
      rank of minister and has the Prime Minister appoint and dismiss him by decision — with
      the additional point that it sits in the Prime Minister's subordination. If a reader
      prefers to treat rank of minister as decisive, Romania has 18 ministry-rank bodies
      rather than 16; that is the figure those two entities would add, and it is stated here
      rather than left to be discovered.
    es: >-
      Se registran dos órganos con rango de ministro que no se cuentan, y ambos son verdaderas
      decisiones de criterio. El Secretariatul General al Guvernului es el secretariado propio
      del Gobierno: el artículo 20(1) del Codul administrativ da a su titular, el secretarul
      general al Guvernului, rango de ministro, y el artículo 20(3) lo convierte en «elementul
      de legătură și stabilitate al guvernării». Se excluye porque no es un departamento con
      cartera sino parte del aparatul de lucru al Guvernului conforme al artículo 19, y porque
      su titular no es miembro del Gobierno: el artículo 18 no enumera el cargo y el artículo
      31(b) hace que el secretario general sea nombrado por decisión del primer ministro y no
      por decreto presidencial sobre un voto de confianza. Por eso tampoco lleva asiento en el
      gabinete, y de ahí que no mueva el recuento de asientos. La Cancelaria Prim-Ministrului
      se excluye por el mismo razonamiento —el artículo 22(2) da rango de ministro a su
      titular y hace que el primer ministro lo nombre y lo cese por decisión— con la
      precisión añadida de que está en subordinación del primer ministro. Si un lector
      prefiere considerar decisivo el rango de ministro, Rumanía tiene 18 órganos con rango
      ministerial en lugar de 16; ésa es la cifra que sumarían esas dos entidades, y se dice
      aquí en vez de dejarla para que se descubra.

  - en: >-
      The perimeter, and the English and Spanish names. Out of scope, and therefore not
      recorded even as exclusions: the secretari de stat and subsecretari de stat inside each
      ministry, who are junior appointees named by decision of the Prime Minister under
      article 31 of the Codul administrativ and hold no seat; the consilieri de stat and the
      aparatul propriu de lucru of each deputy prime minister under article 21; the
      departamente and other structures of the Government's working apparatus under article
      23; the agencies, authorities and other organe de specialitate subordinate to or
      coordinated by the Government or by a ministry under article 51, including bodies whose
      heads rank as secretary of state; the prefects, who represent the Government in the
      counties but head no department; the county and local authorities, which are local
      self-government; and the Presidency of the Republic and the Banca Națională a României,
      which are outside the executive. The head of state matters more in Romania than in a
      parliamentary republic — this is a semi-presidential system in which the President
      designates the prime minister and appoints the Government by decree — but the
      Presidential Administration is not a department of the Government and is not recorded.
      The English names of the sixteen ministries are `official`, which is unusual in this
      dataset: the Government publishes an English edition of its register of ministries, and
      those names are reproduced verbatim from it rather than translated here — which is why
      three of them read "Digitalization", "Waters" and "Ministry for Development" instead of
      the forms an English editor would choose. That English page is stale in one respect,
      listing a ministry abolished in December 2024, so it is used for nomenclature only and
      never for membership of the list. Every `name_es` is `translated`, as is the `name_en` of
      each of the six entities that are not ministries: the Government publishes no Spanish
      edition, and its English edition names no body other than a ministry.
    es: >-
      El perímetro y los nombres en inglés y español. Fuera de alcance, y por tanto no
      registrados ni como exclusiones: los secretari de stat y subsecretari de stat de cada
      ministerio, nombrados por decisión del primer ministro conforme al artículo 31 del Codul
      administrativ y sin asiento; los consilieri de stat y el aparatul propriu de lucru de
      cada viceprimer ministro conforme al artículo 21; los departamente y demás estructuras
      del aparato de trabajo del Gobierno conforme al artículo 23; las agencias, autoridades y
      demás organe de specialitate subordinadas o coordinadas por el Gobierno o por un
      ministerio conforme al artículo 51, incluidos los órganos cuyos titulares tienen rango de
      secretario de Estado; los prefectos, que representan al Gobierno en los condados pero no
      encabezan ningún departamento; las autoridades de condado y locales, que son autogobierno
      local; y la Presidencia de la República y la Banca Națională a României, ajenas al
      ejecutivo. La jefatura del Estado importa más en Rumanía que en una república
      parlamentaria —es un sistema semipresidencial en el que el presidente designa al primer
      ministro y nombra al Gobierno por decreto— pero la Administración Presidencial no es un
      departamento del Gobierno y no se registra. Todos los valores `name_en` y `name_es` de
      este fichero son `translated`: son traducciones de este proyecto, no del Gobierno.
      gov.ro publica una edición en inglés, pero sus nombres de ministerio no se verificaron
      contra el registro rumano para este fichero, así que ningún nombre se marca como
      `official`; un futuro curador que los verifique podrá elevar `name_en`.

