# Spain — government structure of the XII legislature (2016-2018).
#
# Also thirteen departments, and the second of the two places in the Spanish series where the
# total does not move across a restructuring. Six of the thirteen changed name or remit, so a
# chart of the number alone shows nothing happening between December 2011 and June 2018.

country: ES
cabinet_id: ES-2016-11-04

cabinet_name_original: Gobierno de España, XII Legislatura (2016-2018)
cabinet_name_en: Government of Spain, 12th legislature (2016-2018)
cabinet_name_es: Gobierno de España, XII Legislatura (2016-2018)

head_of_government_title_original: Presidente del Gobierno
head_of_government_title_en: Prime Minister

took_office: 2016-11-04
left_office: 2018-06-06

methodology_notes:
  - en: >-
      Thirteen ministerial departments, the same total as the outgoing government but not the
      same thirteen. Public administration moved from finance to the Presidency department,
      energy and tourism were recombined with the new digital agenda, industry joined economic
      policy, and fisheries returned to the agriculture department's name. A figure for the
      number of departments cannot show any of this.
    es: >-
      Trece departamentos ministeriales, el mismo total que el Gobierno saliente pero no los
      mismos trece. La función pública pasó de Hacienda al departamento de la Presidencia, la
      energía y el turismo se recombinaron con la nueva agenda digital, la industria se unió a
      la política económica y la pesca volvió al nombre del departamento de Agricultura. Una
      cifra del número de departamentos no puede mostrar nada de esto.
  - en: >-
      Fourteen seats against thirteen departments: the Prime Minister holds a seat without
      heading a department. A single vice-president, who also headed the Presidency and
      territorial administration department, and no minister without a portfolio.
    es: >-
      Catorce asientos frente a trece departamentos: el presidente del Gobierno ocupa un
      asiento sin encabezar departamento. Una sola vicepresidencia, que encabezaba además el
      departamento de la Presidencia y para las Administraciones Territoriales, y ningún
      ministro sin cartera.
  - en: >-
      This is the shortest term in the Spanish series. The government took office in November
      2016 and left in June 2018, when a motion of no confidence succeeded, so the structure
      lasted nineteen months and was never amended.
    es: >-
      Es la legislatura más corta de la serie española. El Gobierno tomó posesión en noviembre
      de 2016 y cesó en junio de 2018, al prosperar una moción de censura, de modo que la
      estructura duró diecinueve meses y no se modificó nunca.

sources:
  - id: boe-rd-415-2016
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 415/2016, de 3 de noviembre, por el que se reestructuran los departamentos
      ministeriales
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2016-10167
    archive_url: https://web.archive.org/web/20260114173021/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2016-10167
    lang: es
    published: 2016-11-04
    accessed: 2026-07-29
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado se estructura en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores y de Cooperación.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Hacienda y Función Pública.
      Ministerio del Interior.
      Ministerio de Fomento.
      Ministerio de Educación, Cultura y Deporte.
      Ministerio de Empleo y Seguridad Social.
      Ministerio de Energía, Turismo y Agenda Digital.
      Ministerio de Agricultura y Pesca, Alimentación y Medio Ambiente.
      Ministerio de la Presidencia y para las Administraciones Territoriales.
      Ministerio de Economía, Industria y Competitividad.
      Ministerio de Sanidad, Servicios Sociales e Igualdad.
    note: >-
      The text as published, in force the same day. The gazette records no amendment to it
      before it was superseded in June 2018, so this enumeration describes the whole term.

  - id: boe-rd-417-2016
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 417/2016, de 3 de noviembre, por el que se nombran Ministros del Gobierno
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2016-10169
    archive_url: https://web.archive.org/web/20230514031512/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2016-10169
    lang: es
    published: 2016-11-04
    accessed: 2026-07-29
    quote: |-
      Ministro de Hacienda y Función Pública a don Cristóbal Montoro Romero.
      Ministro de Energía, Turismo y Agenda Digital a don Álvaro María Nadal Belda.
      Ministra de la Presidencia y para las Administraciones Territoriales a doña María Soraya Sáenz de Santamaría Antón.
      Ministro de Economía, Industria y Competitividad a don Luis de Guindos Jurado.
    note: >-
      Thirteen ministers for thirteen departments, one each and none without a portfolio, which
      is what makes the seat count fourteen once the Prime Minister is added. The quote
      includes the sole vice-president, appointed the same day to the Presidency and
      territorial administration department.

  - id: boe-ley-50-1997
    tier: 1
    type: statute
    publisher: Boletín Oficial del Estado
    title: Ley 50/1997, de 27 de noviembre, del Gobierno (texto consolidado)
    url: https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    archive_url: https://web.archive.org/web/20260716135650/https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    lang: es
    published: 1997-11-28
    accessed: 2026-07-29
    quote: >-
      El Gobierno se compone del Presidente, del Vicepresidente o Vicepresidentes, en su
      caso, y de los Ministros.
    note: >-
      Cited for the composition of the Government, which is what makes the Prime Minister's
      seat a matter of statute rather than of interpretation.

