        Economische Zaken en Klimaat.
      es: >-
        Con el gabinete Schoof existía un Ministerie van Klimaat en Groene Groei. Se
        suprimió el 23 de febrero de 2026 y su materia pasó a Economische Zaken en Klimaat,
        donde ahora la ejerce este ministro sin cartera, que además asumió la política de
        economía circular de Infrastructuur en Waterstaat. Los Países Bajos ya no tienen,
        por tanto, un ministerio de clima propio: la etiqueta de clima está en Economische
        Zaken en Klimaat.

