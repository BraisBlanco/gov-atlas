      en: >-
        Under the kabinet-Schoof there was a Ministerie van Klimaat en Groene Groei. It was
        abolished on 23 February 2026 and its subject-matter given to Economische Zaken en
        Klimaat, where this minister zonder portefeuille now exercises it, having also
        gained circular-economy policy from Infrastructuur en Waterstaat. The Netherlands
