        del primer ministro y un ministerio en sentido ordinario: el artículo 44.1 de la
        Grondwet define el ministerio como órgano creado por real decreto y dirigido por un
        ministro, el título del primer ministro es Minister van Algemene Zaken y el
        departamento figura en la lista oficial de ministerios. Excluirlo por
        head_of_government_office daría 11 ministerios en lugar de 12; véase la primera
        nota metodológica. Su asiento es el del jefe de gobierno, por lo que no se registra
        aparte ninguna oficina del primer ministro.

