# Netherlands — government structure of the kabinet-Jetten.
#
# See docs/DATA-CONTRACT.md. Three things worth knowing before reading the list:
#
#   1. The Netherlands has no statute that enumerates its ministries. Article 44 of the
#      Grondwet says ministries are established by koninklijk besluit, one at a time, so
#      the "official list" only exists as the accumulated stock of those decrees. The
#      enumerating instrument used here is article 2 of the Vervangingsregeling KB of
#      23 February 2026, which names every minister of this cabinet in precedence order
#      and — because it is built around "de staatssecretaris van hetzelfde ministerie" —
#      separates the twelve ministers who lead a ministry (a to l) from the six who do
#      not (m to r). The official list of twelve ministries on rijksoverheid.nl agrees.
#   2. The 23 February 2026 reorganisation is why this cabinet has fewer ministries than
#      its predecessor: three ministries were abolished and their portfolios continue as
#      ministers zonder portefeuille inside surviving departments. Any description of the
#      Dutch government written before that date counts three more ministries.
#   3. The Ministerie van Algemene Zaken is counted. It is a ministry in Dutch law and in
#      the government's own list, and it is also the Prime Minister's own department — see
#      the first methodology note for the figure a reader gets by excluding it.

country: NL
cabinet_id: NL-2026-02-23

cabinet_name_original: Kabinet-Jetten
cabinet_name_en: Jetten cabinet
cabinet_name_es: Gabinete Jetten

head_of_government_title_original: Minister-President
head_of_government_title_en: Prime Minister

took_office: 2026-02-23
left_office: null

methodology_notes:
  - en: >-
      The Netherlands is counted here as having 12 ministries, and the Ministerie van
      Algemene Zaken is one of them. Excluding it as the office of the head of government,
      the way this project excludes Spain's Presidencia del Gobierno, would give 11. It is
      counted because Dutch law does not treat it as an office attached to the Prime
      Minister but as a ministry like any other: article 44 of the Grondwet provides that
      ministries are established by royal decree and are headed by a minister, the Prime
      Minister's full title is "Minister-President, Minister van Algemene Zaken", the
      department appears in the government's own list of ministries at rijksoverheid.nl
      and in the English list at government.nl, and it carries its own chapter in the
      annual budget. This is the case the exclusion reason head_of_government_office
      describes as contested, and both figures are published here so a reader can choose:
      12 ministries including Algemene Zaken, 11 excluding it.
    es: >-
      Aquí se cuentan 12 ministerios para los Países Bajos, y el Ministerie van Algemene
      Zaken es uno de ellos. Excluirlo como oficina del jefe de gobierno, tal como este
      proyecto excluye la Presidencia del Gobierno española, daría 11. Se cuenta porque el
      derecho neerlandés no lo trata como un cargo adscrito al primer ministro sino como
      un ministerio más: el artículo 44 de la Grondwet establece que los ministerios se
      crean por real decreto y están dirigidos por un ministro, el título completo del
      primer ministro es «Minister-President, Minister van Algemene Zaken», el
      departamento figura en la lista oficial de ministerios de rijksoverheid.nl y en la
      lista inglesa de government.nl, y tiene su propio capítulo en el presupuesto anual.
      Este es el supuesto que el motivo de exclusión head_of_government_office califica de
      discutido, y aquí se publican ambas cifras para que el lector elija: 12 ministerios
      contando Algemene Zaken, 11 sin contarlo.
  - en: >-
      12 ministries but 18 cabinet seats. Six of the eighteen ministers are ministers
      zonder portefeuille: they hold full ministerial rank and a seat in the ministerraad
      but lead no department of their own, working instead inside an existing ministry.
      Article 44(2) of the Grondwet provides for exactly this ("Ook kunnen ministers worden
      benoemd die niet belast zijn met de leiding van een ministerie"), and article 3 of
      the appointment decree of 23 February 2026 appoints all six by name. They are the
      ministers for Buitenlandse Handel en Ontwikkelingssamenwerking (inside Buitenlandse
      Zaken), Asiel en Migratie (inside Justitie en Veiligheid), Volkshuisvesting en
      Ruimtelijke Ordening (inside Binnenlandse Zaken en Koninkrijksrelaties), Klimaat en
      Groene Groei (inside Economische Zaken en Klimaat), Werk en Participatie (inside
      Sociale Zaken en Werkgelegenheid) and Langdurige Zorg, Jeugd en Sport (inside
      Volksgezondheid, Welzijn en Sport). Each is recorded below, not counted as a
      ministry, and each adds one cabinet seat. 12 + 6 = 18; the two numbers are never
      added together.
    es: >-
      12 ministerios pero 18 asientos en el gabinete. Seis de los dieciocho ministros son
      ministers zonder portefeuille (ministros sin cartera): tienen rango ministerial
      pleno y asiento en el ministerraad, pero no dirigen ningún departamento propio y
      trabajan dentro de un ministerio existente. El artículo 44.2 de la Grondwet prevé
      precisamente esto («Ook kunnen ministers worden benoemd die niet belast zijn met de
      leiding van een ministerie»), y el artículo 3 del real decreto de nombramiento de 23
      de febrero de 2026 los nombra a los seis. Son los ministros de Buitenlandse Handel en
      Ontwikkelingssamenwerking (dentro de Buitenlandse Zaken), Asiel en Migratie (dentro
      de Justitie en Veiligheid), Volkshuisvesting en Ruimtelijke Ordening (dentro de
      Binnenlandse Zaken en Koninkrijksrelaties), Klimaat en Groene Groei (dentro de
      Economische Zaken en Klimaat), Werk en Participatie (dentro de Sociale Zaken en
      Werkgelegenheid) y Langdurige Zorg, Jeugd en Sport (dentro de Volksgezondheid,
      Welzijn en Sport). Cada uno se registra abajo, no se cuenta como ministerio y suma un
      asiento. 12 + 6 = 18; las dos cifras nunca se suman.
  - en: >-
      The cabinet also has 10 staatssecretarissen, so sources reporting "28
      bewindspersonen" are counting ministers plus state secretaries. They are not recorded
      as entities here, and the reading taken is that a staatssecretaris holds no cabinet
      seat. Article 45(1) of the Grondwet is explicit that it is the ministers who form
      the ministerraad ("De ministers vormen te zamen de ministerraad"); article 46(2)
      makes a staatssecretaris act in the minister's place only "in de gevallen waarin de
      minister het nodig acht", and article 1 of the Vervangingsregeling of 23 February
      2026 adds that in those cases the state secretary may attend the ministerraad only
      with an advisory vote ("met raadgevende stem"). A staatssecretaris is therefore
      neither a department nor a member of the cabinet, and would change neither published
      figure. Readers who want the larger number should use 28 bewindspersonen: 12
      departmental ministers, 6 ministers zonder portefeuille and 10 staatssecretarissen.
    es: >-
      El gabinete cuenta además con 10 staatssecretarissen, de modo que las fuentes que
      hablan de «28 bewindspersonen» suman ministros y secretarios de Estado. Aquí no se
      registran como entidades, y la lectura adoptada es que un staatssecretaris no ocupa
      asiento en el gabinete. El artículo 45.1 de la Grondwet es explícito en que son los
      ministros quienes forman el ministerraad («De ministers vormen te zamen de
      ministerraad»); el artículo 46.2 hace que el staatssecretaris actúe en lugar del
      ministro sólo «in de gevallen waarin de minister het nodig acht», y el artículo 1 de
      la Vervangingsregeling de 23 de febrero de 2026 añade que en esos casos puede asistir
      al ministerraad únicamente con voz consultiva («met raadgevende stem»). Un
      staatssecretaris no es, por tanto, ni un departamento ni miembro del gabinete, y no
      alteraría ninguna de las dos cifras publicadas. Quien busque la cifra mayor debe usar
      28 bewindspersonen: 12 ministros departamentales, 6 ministros sin cartera y 10
      secretarios de Estado.
  - en: >-
      Two ministers also hold the rank of Vice-Minister-President: the Minister van
      Defensie and the minister zonder portefeuille for Asiel en Migratie, appointed as
      such by article 4 of the decree of 23 February 2026. A vice-premiership is a personal
      rank attached to a serving minister, not a department, so it adds neither a ministry
      nor a cabinet seat. Note that one of the two vice-premiers heads no ministry at all;
      he is recorded once, as a minister zonder portefeuille.
    es: >-
      Dos ministros ostentan además el rango de Vice-Minister-President: el ministro de
      Defensie y el ministro sin cartera de Asiel en Migratie, nombrados como tales por el
      artículo 4 del real decreto de 23 de febrero de 2026. La vicepresidencia es un rango
      personal adscrito a un ministro en ejercicio, no un departamento, por lo que no añade
      ni ministerio ni asiento en el gabinete. Nótese que uno de los dos vicepresidentes no
      dirige ningún ministerio; se registra una sola vez, como ministro sin cartera.
  - en: >-
      Three of the twelve ministries carry titles that changed on 23 February 2026, and the
      change is the reason the Dutch count fell. The decree of that date charged Justitie
      en Veiligheid with everything belonging to the Ministerie van Asiel en Migratie,
      Binnenlandse Zaken en Koninkrijksrelaties with everything belonging to the Ministerie
      van Volkshuisvesting en Ruimtelijke Ordening, and Economische Zaken en Klimaat with
      everything belonging to the Ministerie van Klimaat en Groene Groei, and then
      abolished all three ministries. A separate decree of the same date renamed the
      Ministerie van Economische Zaken to Ministerie van Economische Zaken en Klimaat, and
      a third moved digital affairs from Binnenlandse Zaken en Koninkrijksrelaties to
      Economische Zaken en Klimaat and circular-economy policy from Infrastructuur en
      Waterstaat to the minister for Klimaat en Groene Groei. No ministry was created. Any
      source describing the Dutch government before 23 February 2026 therefore lists three
      more ministries than this file does, and does not use the name Economische Zaken en
      Klimaat.
    es: >-
      Tres de los doce ministerios llevan denominaciones que cambiaron el 23 de febrero de
      2026, y ese cambio es la razón de que la cifra neerlandesa haya bajado. El real
      decreto de esa fecha encargó a Justitie en Veiligheid todos los asuntos del
      Ministerie van Asiel en Migratie, a Binnenlandse Zaken en Koninkrijksrelaties todos
      los del Ministerie van Volkshuisvesting en Ruimtelijke Ordening y a Economische Zaken
      en Klimaat todos los del Ministerie van Klimaat en Groene Groei, y a continuación
      suprimió los tres ministerios. Otro real decreto de la misma fecha renombró el
      Ministerie van Economische Zaken como Ministerie van Economische Zaken en Klimaat, y
      un tercero trasladó los asuntos digitales de Binnenlandse Zaken en Koninkrijksrelaties
      a Economische Zaken en Klimaat y la política de economía circular de Infrastructuur en
      Waterstaat al ministro de Klimaat en Groene Groei. No se creó ningún ministerio. Por
      tanto, cualquier fuente que describa el gobierno neerlandés antes del 23 de febrero de
      2026 enumera tres ministerios más que este fichero y no usa el nombre Economische
      Zaken en Klimaat.
  - en: >-
      There is no Dutch legal instrument that lists the ministries in one place, so the
      enumeration here is assembled rather than copied. Article 44(1) of the Grondwet
      establishes ministries by individual royal decree, which means the current set is
      the accumulated stock of decrees rather than a schedule to a statute. The instrument
      used as the enumerating source is article 2 of the Vervangingsregeling in geval van
      tijdelijke afwezigheid van een minister 2026: it names all eighteen ministers in
      precedence order, and its own structure — a minister is first replaced by "de
      staatssecretaris van hetzelfde ministerie" — distinguishes the twelve who lead a
      ministry from the six who do not. The government's own list of ministries at
      rijksoverheid.nl and its English counterpart at government.nl both contain exactly
      the same twelve, so the derived count of 12 matches every official source consulted.
      The annual budget laws are also an enumeration of departments in Dutch practice, but
      the 2026 budget was enacted before the February 2026 reorganisation and still carries
      separate chapters for the three abolished ministries; it was therefore not used.
    es: >-
      No existe un instrumento jurídico neerlandés que enumere los ministerios en un solo
      lugar, de modo que la enumeración aquí se compone en lugar de copiarse. El artículo
      44.1 de la Grondwet crea los ministerios mediante reales decretos individuales, con
      lo que el conjunto vigente es el acumulado de esos decretos y no un anexo de una ley.
      El instrumento usado como fuente enumeradora es el artículo 2 de la Vervangingsregeling
      in geval van tijdelijke afwezigheid van een minister 2026: nombra a los dieciocho
      ministros por orden de precedencia y su propia estructura —un ministro es sustituido
      en primer lugar por «de staatssecretaris van hetzelfde ministerie»— distingue a los
      doce que dirigen un ministerio de los seis que no. La lista oficial de ministerios de
      rijksoverheid.nl y su equivalente inglesa de government.nl contienen exactamente los
      mismos doce, por lo que el recuento derivado de 12 coincide con todas las fuentes
      oficiales consultadas. Las leyes de presupuestos anuales también son una enumeración
      de departamentos en la práctica neerlandesa, pero el presupuesto de 2026 se aprobó
      antes de la reorganización de febrero de 2026 y todavía contiene capítulos separados
      para los tres ministerios suprimidos; por eso no se ha utilizado.
  - en: >-
      Perimeter. This file describes the central government of the Netherlands, the country
      whose government sits in The Hague. Aruba, Curaçao and Sint Maarten are separate
      countries of the Kingdom of the Netherlands with their own governments and their own
      ministers, and they are out of scope; their Gevolmachtigde Ministers, who appear in
      the closing formula of every decree cited here, are not ministers of this cabinet and
      are not recorded. Kingdom affairs are a portfolio of the Ministerie van Binnenlandse
      Zaken en Koninkrijksrelaties. The population figure in data/countries/NL.yml is on the
      same perimeter.
    es: >-
      Perímetro. Este fichero describe el gobierno central de los Países Bajos, el país
      cuyo gobierno tiene su sede en La Haya. Aruba, Curazao y San Martín son países
      distintos del Reino de los Países Bajos, con sus propios gobiernos y sus propios
      ministros, y quedan fuera de alcance; sus Gevolmachtigde Ministers, que aparecen en
      la fórmula final de todos los reales decretos aquí citados, no son ministros de este
      gabinete y no se registran. Los asuntos del Reino son una cartera del Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties. La cifra de población de
      data/countries/NL.yml se refiere al mismo perímetro.
  - en: >-
      English ministry names are the Dutch government's own. All twelve are taken verbatim
      from government.nl, the English-language edition of rijksoverheid.nl, and are marked
      name_en_provenance: official. The English and Spanish titles of the six ministers
      zonder portefeuille, and all Spanish names, are this project's renderings and are
      marked translated.
    es: >-
      Los nombres ingleses de los ministerios son los del propio gobierno neerlandés. Los
      doce se toman literalmente de government.nl, la edición en inglés de rijksoverheid.nl,
      y llevan name_en_provenance: official. Los títulos en inglés y español de los seis
      ministros sin cartera, y todos los nombres en español, son traducciones de este
      proyecto y llevan la marca translated.

sources:
  - id: stcrt-2026-8194
    tier: 1
    type: official_gazette
    publisher: Staatscourant van het Koninkrijk der Nederlanden
    title: >-
      Besluit van 23 februari 2026, nr. 2026000417, houdende wijziging van de
      vervangingsregeling in geval van tijdelijke afwezigheid van een minister
      (Vervangingsregeling in geval van tijdelijke afwezigheid van een minister 2026)
    url: https://zoek.officielebekendmakingen.nl/stcrt-2026-8194.html
    archive_url: https://web.archive.org/web/20260727183016/https://zoek.officielebekendmakingen.nl/stcrt-2026-8194.html
    lang: nl
    published: 2026-02-24
    accessed: 2026-07-27
    quote: |-
      Artikel 2
      Bij gelijktijdige afwezigheid van een minister en een staatssecretaris, alsmede bij afwezigheid van een minister in het geval er geen staatssecretaris van hetzelfde ministerie is, dan wel indien een minister door ziekte of om een andere reden tijdelijk niet in de gelegenheid is zijn taak uit te oefenen en aanwijzingen aan de staatssecretaris van hetzelfde ministerie te geven, wordt deze vervangen door een andere minister met dien verstande dat:
      a. De Minister-President, Minister van Algemene Zaken wordt vervangen door D. Yeşilgöz-Zegerius, bij haar afwezigheid door G. van den Brink en bij zijn afwezigheid door de oudst aanwezige minister in jaren;
      b. De Minister van Buitenlandse Zaken door D. Yeşilgöz-Zegerius;
      c. De Minister van Justitie en Veiligheid door G. van den Brink;
      d. De Minister van Binnenlandse Zaken en Koninkrijksrelaties door E. Boekholt-O’Sullivan;
      e. De Minister van Onderwijs, Cultuur en Wetenschap door S.Th.M. Hermans;
      f. De Minister van Financiën door H.G. Herbert;
      g. De Minister van Defensie door T.B.W. Berendsen;
      h. De Minister van Infrastructuur en Waterstaat door S. van Veldhoven-van der Meer;
      i. De Minister van Economische Zaken en Klimaat door E. Heinen;
      j. De Minister van Landbouw, Visserij, Voedselzekerheid en Natuur door E. Boekholt-O’Sullivan;
      k. De Minister van Sociale Zaken en Werkgelegenheid door A.A. Aartsen;
      l. De Minister van Volksgezondheid, Welzijn en Sport door W.R.C. Sterk;
      m. De Minister van Buitenlandse Handel en Ontwikkelingssamenwerking door T.B.W. Berendsen;
      n. De Minister van Asiel en Migratie door D.M. van Weel;
      o. De Minister van Volkshuisvesting en Ruimtelijke Ordening door P.E. Heerma;
      p. De Minister van Klimaat en Groene Groei door H.G. Herbert;
      q. De Minister van Werk en Participatie door J.A. Vijlbrief;
      r. De Minister van Langdurige Zorg, Jeugd en Sport door S.Th.M. Hermans.
    note: >-
      The enumerating instrument for this cabinet, and the source of the listing order
      below. Because the Netherlands establishes each ministry by a separate royal decree
      under article 44 of the Grondwet, no single instrument lists the ministries; this
      one lists every minister in precedence order and, by resting on "de staatssecretaris
      van hetzelfde ministerie", separates the twelve ministers who lead a ministry
      (items a to l) from the six ministers zonder portefeuille (items m to r). Article 1,
      not quoted in full here, also establishes that a state secretary who stands in for
      an absent minister may take part in the ministerraad "met raadgevende stem" only.
      This decree replaced the corresponding decree of 2 July 2024 (nr. 2024001723) and
      took effect retroactively to 23 February 2026.

  - id: stcrt-2026-8177
    tier: 1
    type: official_gazette
    publisher: Staatscourant van het Koninkrijk der Nederlanden
    title: >-
      Besluit van 23 februari 2026, nr. 2026000404, houdende herindeling aangelegenheden
      betreffende de Ministeries van Asiel en Migratie, van Volkshuisvesting en Ruimtelijke
      Ordening en van Klimaat en Groene Groei en opheffing van deze ministeries
    url: https://zoek.officielebekendmakingen.nl/stcrt-2026-8177.html
    archive_url: https://web.archive.org/web/20260727182708/https://zoek.officielebekendmakingen.nl/stcrt-2026-8177.html
    lang: nl
    published: 2026-02-24
    accessed: 2026-07-27
    quote: |-
      Artikel 1
      1. Het Ministerie van Justitie en Veiligheid wordt belast met de behartiging van alle aangelegenheden die het Ministerie van Asiel en Migratie betreffen.
      2. Het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties wordt belast met de behartiging van alle aangelegenheden die het Ministerie van Volkshuisvesting en Ruimtelijke Ordening betreffen.
      3. Het Ministerie van Economische Zaken en Klimaat wordt belast met de behartiging van alle aangelegenheden die het Ministerie van Klimaat en Groene Groei betreffen.
      Artikel 2
      Het Ministerie van Asiel en Migratie, het Ministerie van Volkshuisvesting en Ruimtelijke Ordening en het Ministerie van Klimaat en Groene Groei worden opgeheven.
    note: >-
      The instrument that reduced the number of Dutch ministries. It abolishes three
      ministries and creates none, and it transfers their subject-matter to three surviving
      departments; the three portfolios themselves continue as ministers zonder
      portefeuille appointed the same day. Took effect on the second day after the
      Staatscourant of publication, retroactive to 23 February 2026.

  - id: stcrt-2026-8178
    tier: 1
    type: official_gazette
    publisher: Staatscourant van het Koninkrijk der Nederlanden
    title: >-
      Besluit van 23 februari 2026, nr. 2026000405, houdende niet verlening van ontslag aan
      vier ministers alsmede benoeming van dertien nieuwe ministers en twee
      Vice-Minister-Presidenten
    url: https://zoek.officielebekendmakingen.nl/stcrt-2026-8178.html
    archive_url: https://web.archive.org/web/20260727182729/https://zoek.officielebekendmakingen.nl/stcrt-2026-8178.html
    lang: nl
    published: 2026-02-24
    accessed: 2026-07-27
    quote: |-
      Artikel 3
      Met ingang van heden te benoemen tot minister zonder portefeuille:
      S.W. Sjoerdsma, en hem te belasten met de aangelegenheden betreffende Buitenlandse Handel en Ontwikkelingssamenwerking;
      G. van den Brink, en hem te belasten met de aangelegenheden betreffende Asiel en Migratie;
      E. Boekholt-O’Sullivan, en haar te belasten met de aangelegenheden betreffende Volkshuisvesting en Ruimtelijke Ordening;
      S. van Veldhoven-van der Meer, en haar te belasten met de aangelegenheden betreffende Klimaat en Groene Groei;
      A.A. Aartsen, en hem te belasten met de aangelegenheden betreffende Werk en Participatie;
      W.R.C. Sterk, en haar te belasten met de aangelegenheden betreffende Langdurige Zorg, Jeugd en Sport.
      Artikel 4
      Met ingang van heden te benoemen tot Vice-Minister-President:
      Onze Minister van Defensie, D. Yeşilgöz-Zegerius;
      Onze Minister van Asiel en Migratie, G. van den Brink.
    note: >-
      Cited for the six ministers zonder portefeuille and for the two vice-premierships.
      Article 2, not quoted here, appoints seven ministers and charges each with "de
      leiding van het Ministerie van ..." — the wording that distinguishes a departmental
      minister from a minister zonder portefeuille, who is instead charged with "de
      aangelegenheden betreffende ...". Article 1 keeps four ministers of the outgoing
      kabinet-Schoof in office and reassigns them to different departments. This dataset
      records departments, not officeholders, so the names appear only in quotations.

  - id: stcrt-2026-8176
    tier: 1
    type: official_gazette
    publisher: Staatscourant van het Koninkrijk der Nederlanden
    title: >-
      Besluit van 23 februari 2026, nr. 2026000403, houdende naamswijziging van het
      Ministerie van Economische Zaken
    url: https://zoek.officielebekendmakingen.nl/stcrt-2026-8176.html
    archive_url: https://web.archive.org/web/20260727182810/https://zoek.officielebekendmakingen.nl/stcrt-2026-8176.html
    lang: nl
    published: 2026-02-24
    accessed: 2026-07-27
    quote: >-
      De naam van het Ministerie van Economische Zaken te wijzigen in: Ministerie van
      Economische Zaken en Klimaat.
    note: >-
      A rename, not a new department: the Ministerie van Economische Zaken of the
      kabinet-Schoof and the Ministerie van Economische Zaken en Klimaat of this cabinet
      are the same body. Recorded as a single entity under the new name, per the
      data contract's rule that a rename is a fact rather than a typo.

  - id: stcrt-2026-8180
    tier: 1
    type: official_gazette
    publisher: Staatscourant van het Koninkrijk der Nederlanden
    title: >-
      Besluit van 23 februari 2026, nr. 2026000406, houdende departementale herindelingen
      met betrekking tot digitale zaken en circulaire economie
    url: https://zoek.officielebekendmakingen.nl/stcrt-2026-8180.html
    archive_url: https://web.archive.org/web/20260727182929/https://zoek.officielebekendmakingen.nl/stcrt-2026-8180.html
    lang: nl
    published: 2026-02-24
    accessed: 2026-07-27
    quote: |-
      Artikel 1
      Onze Minister van Economische Zaken en Klimaat wordt belast met de behartiging van de aangelegenheden op het terrein van digitale zaken voor zover deze voor 23 februari 2026 waren opgedragen aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
      Artikel 2
      De taken van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties worden dienovereenkomstig gewijzigd.
      Artikel 3
      De organisatorische, personele en rechtspositionele aspecten van de in de artikelen 1 en 2 bedoelde herindeling van departementale taken worden uitgewerkt in overleg tussen Onze Minister van Economische Zaken en Klimaat en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
      Artikel 4
      Onze Minister van Klimaat en Groene Groei wordt belast met de behartiging van de aangelegenheden op het terrein van het beleid ten aanzien van circulaire economie voor zover deze voor 23 februari 2026 waren opgedragen aan Onze Minister van Infrastructuur en Waterstaat.
      Artikel 5
      De taken van het Ministerie van Infrastructuur en Waterstaat worden dienovereenkomstig gewijzigd.
    note: >-
      Cited for two portfolio transfers that change how the policy areas below are tagged:
      digital affairs moved from Binnenlandse Zaken en Koninkrijksrelaties to Economische
      Zaken en Klimaat, and circular-economy policy moved from Infrastructuur en Waterstaat
      to the minister for Klimaat en Groene Groei, who works inside Economische Zaken en
      Klimaat. No ministry was created or abolished by this decree.

  - id: grondwet-2023-02-22
    tier: 1
    type: statute
    publisher: Overheid.nl — Wettenbank (wetten.overheid.nl)
    title: Grondwet voor het Koninkrijk der Nederlanden (geconsolideerde tekst)
    url: https://wetten.overheid.nl/BWBR0001840/2023-02-22
    archive_url: https://web.archive.org/web/20260721143124/https://wetten.overheid.nl/BWBR0001840/2023-02-22
    lang: nl
    published: 2023-02-22
    accessed: 2026-07-27
    quote: |-
      Artikel 44
      Bij koninklijk besluit worden ministeries ingesteld. Zij staan onder leiding van een minister.
      Ook kunnen ministers worden benoemd die niet belast zijn met de leiding van een ministerie.
      Artikel 45
      De ministers vormen te zamen de ministerraad.
      De minister-president is voorzitter van de ministerraad.
      De ministerraad beraadslaagt en besluit over het algemeen regeringsbeleid en bevordert de eenheid van dat beleid.
      Artikel 46
      Bij koninklijk besluit kunnen staatssecretarissen worden benoemd en ontslagen.
      Een staatssecretaris treedt in de gevallen waarin de minister het nodig acht en met inachtneming van diens aanwijzingen, in zijn plaats als minister op. De staatssecretaris is uit dien hoofde verantwoordelijk, onverminderd de verantwoordelijkheid van de minister.
    note: >-
      The constitutional basis for all three classification decisions in this file: article
      44(1) makes a ministry a body established by royal decree and headed by a minister
      (which is why Algemene Zaken is counted), article 44(2) provides for ministers who
      lead no ministry (which is why the six ministers zonder portefeuille are recorded but
      not counted), and article 45(1) makes the ministers, and only the ministers, the
      members of the ministerraad (which is why cabinet_seats_count is 18 and why
      staatssecretarissen hold no seat). Consolidated text as in force from 22 February
      2023, the version current on the date of access. The quote reproduces each lid
      (paragraph) of articles 44, 45 and 46 on its own line, in order, without adding lid
      numbers: wetten.overheid.nl renders the numbers as separate labels, so writing "1."
      inline would put a character in the quotation that is not in the source. Read them as
      44(1), 44(2), 45(1), 45(2), 45(3), 46(1), 46(2).

