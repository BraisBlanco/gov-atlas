    note:
      en: >-
        This is where Slovenia now keeps digital policy, which is the tag most likely to be
        looked for on the wrong ministry. The Golob government's Ministrstvo za digitalno
        preobrazbo was abolished outright in May 2026 and its whole field of activity, along
        with that of the Ministrstvo za javno upravo except local self-government, was folded
        into the interior ministry; article 34 of the Zakon o državni upravi accordingly gives
        it the information society, electronic communications, the informatisation of the
        state administration, the eUprava portal, secure mailboxes and the central electronic
        signature service. state_assets is tagged because the same article gives it the
        centralised management of the state's physical property. Two areas a reader might
        expect here are elsewhere: civil protection is the defence ministry's, and local
        self-government went to the Ministry of Local Self-Government, Cohesion and Regional
        Development. Migration is here in the administrative sense — residence, asylum
        procedure and the migration directorate; the reception and integration of migrants is a
        separate government office outside this file's perimeter.
      es: >-
        Aquí es donde Eslovenia guarda ahora la política digital, la etiqueta que más
        probablemente se busque en el ministerio equivocado. El Ministrstvo za digitalno
        preobrazbo del gobierno de Golob se suprimió por completo en mayo de 2026 y todo su
        ámbito de actividad, junto con el del Ministrstvo za javno upravo salvo el autogobierno
        local, se integró en el ministerio del Interior; el artículo 34 de la Zakon o državni
        upravi le atribuye en consecuencia la sociedad de la información, las comunicaciones
        electrónicas, la informatización de la administración estatal, el portal eUprava, los
        buzones seguros y el servicio central de firma electrónica. Se etiqueta state_assets
        porque ese mismo artículo le atribuye la gestión centralizada del patrimonio físico del
        Estado. Dos áreas que un lector esperaría aquí están en otra parte: la protección civil
        es del ministerio de Defensa y el autogobierno local pasó al Ministerio de Autogobierno
        Local, Cohesión y Desarrollo Regional. La migración está aquí en su sentido
        administrativo —residencia, procedimiento de asilo y la dirección de migraciones—; la
        acogida e integración de migrantes corresponde a una oficina gubernamental aparte,
        fuera del perímetro de este fichero.

  - id: SI-2026-infrastruktura-energetika
    order: 4
    name_original: Ministrstvo za infrastrukturo in energetiko
    abbreviation_original: null
    name_en: Ministry of Infrastructure and Energy
    name_es: Ministerio de Infraestructuras y Energía
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za infrastrukturo in energetiko
    head_title_en: Minister of Infrastructure and Energy
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [transport, infrastructure, energy, shipping]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-infrastrukturo-in-energetiko/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        Energy moved here in May 2026 and that is the single most consequential tag change in
        this file: until then it belonged to the Ministrstvo za okolje, podnebje in energijo,
        so a comparison against Slovenia's previous cabinet will show energy under environment
        and here under infrastructure. ZVRS-K transferred energy, the supply of petroleum
        products, alternative-fuel infrastructure in transport, sustainable mobility, integrated
        transport planning and domestic and cross-border public passenger transport into this
        ministry by name. Article 38 of the Zakon o državni upravi adds road, rail, cableway,
        air and maritime transport and inland navigation, which is why shipping is tagged here
        and not on any fisheries or maritime ministry; Slovenia has neither. Climate is not
        tagged here: it stayed with the environment ministry.
      es: >-
        La energía se trasladó aquí en mayo de 2026 y ése es el cambio de etiqueta más
        consecuente de este fichero: hasta entonces pertenecía al Ministrstvo za okolje,
        podnebje in energijo, de modo que una comparación con el gabinete esloveno anterior
        mostrará la energía bajo medio ambiente y aquí bajo infraestructuras. La ZVRS-K le
        transfirió por su nombre la energía, el abastecimiento de derivados del petróleo, la
        infraestructura de combustibles alternativos en el transporte, la movilidad sostenible,
        la planificación integrada del transporte y el transporte público de pasajeros interno y
        transfronterizo. El artículo 38 de la Zakon o državni upravi añade el transporte por
        carretera, ferroviario, por cable, aéreo y marítimo y la navegación interior, y por eso
        shipping se etiqueta aquí y no en un ministerio de pesca o de asuntos marítimos:
        Eslovenia no tiene ninguno. El clima no se etiqueta aquí: se quedó en el ministerio de
        medio ambiente.

  - id: SI-2026-izobrazevanje-znanost-mladina
    order: 5
    name_original: Ministrstvo za izobraževanje, znanost in mladino
    abbreviation_original: null
    name_en: Ministry of Education, Science and Youth
    name_es: Ministerio de Educación, Ciencia y Juventud
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za izobraževanje, znanost in mladino
    head_title_en: Minister of Education, Science and Youth
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [education, research, youth, higher_education, innovation]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-izobrazevanje-znanost-in-mladino/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        The reunification of a portfolio Slovenia had split. The Golob government ran a
        Ministrstvo za vzgojo in izobraževanje and a separate Ministrstvo za visoko šolstvo,
        znanost in inovacije; ZVRS-K merged the second into the first and added youth to the
        name. Article 39 of the Zakon o državni upravi therefore covers pre-school education,
        primary, secondary and short-cycle higher vocational schooling, adult education, youth,
        higher education, scientific research and innovation, and technological development —
        which is why research, higher_education and innovation are all tagged here even though
        the name mentions only science. vocational_training is deliberately not tagged here:
        ZVRS-K moved poklicno usposabljanje, vocational training in the labour-market sense, to
        the Ministry of the Economy, Labour and Sport, and the statute leaves this ministry only
        the school-based part. The physical education of children and young people inside school
        programmes is expressly this ministry's, but sport as a policy area is the economy
        ministry's and is tagged there.
      es: >-
        La reunificación de una cartera que Eslovenia había dividido. El gobierno de Golob tenía
        un Ministrstvo za vzgojo in izobraževanje y un Ministrstvo za visoko šolstvo, znanost in
        inovacije aparte; la ZVRS-K fusionó el segundo en el primero y añadió la juventud al
        nombre. El artículo 39 de la Zakon o državni upravi abarca por tanto la educación
        preescolar, la enseñanza primaria, secundaria y superior de ciclo corto, la educación de
        adultos, la juventud, la enseñanza superior, la investigación científica y la innovación
        y el desarrollo tecnológico —de ahí que research, higher_education e innovation se
        etiqueten aquí aunque el nombre sólo mencione la ciencia—. vocational_training no se
        etiqueta aquí a propósito: la ZVRS-K trasladó el poklicno usposabljanje, la formación
        profesional en su sentido de mercado laboral, al Ministerio de Economía, Trabajo y
        Deporte, y la ley deja a este ministerio sólo la parte escolar. La educación física de
        niños y jóvenes dentro de los programas escolares es expresamente de este ministerio,
        pero el deporte como área de política es del ministerio de economía y allí se etiqueta.

  - id: SI-2026-zdravje
    order: 6
    name_original: Ministrstvo za zdravje
    abbreviation_original: null
    name_en: Ministry of Health
    name_es: Ministerio de Sanidad
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za zdravje
    head_title_en: Minister of Health
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [health]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-zdravje/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        Health alone. Untouched by the May 2026 reorganisation, and tagged with the single area
        its statutory field of activity covers: public health, health protection, health
        insurance, health services, medicines and medical devices, chemical safety and radiation
        protection. Article 40 of the Zakon o državni upravi splits food safety with the
        agriculture ministry along an unusually explicit line — this ministry holds food and
        catering only "z vidika preprečevanja in obvladovanja nalezljivih bolezni", from the
        point of view of preventing and controlling communicable disease — so food_safety is
        tagged on agriculture and not here. Long-term care is not this ministry's either; it
        went to the Ministry of Demography, Family and Social Affairs.
      es: >-
        Sólo sanidad. Intacto en la reorganización de mayo de 2026, y etiquetado con la única
        área que cubre su ámbito legal de actividad: salud pública, protección de la salud,
        seguro de enfermedad, servicios sanitarios, medicamentos y productos sanitarios,
        seguridad química y protección radiológica. El artículo 40 de la Zakon o državni upravi
        reparte la seguridad alimentaria con el ministerio de agricultura por una línea
        inusualmente explícita —este ministerio tiene los alimentos y la restauración sólo «z
        vidika preprečevanja in obvladovanja nalezljivih bolezni», desde el punto de vista de la
        prevención y control de las enfermedades transmisibles—, así que food_safety se etiqueta
        en agricultura y no aquí. Los cuidados de larga duración tampoco son de este ministerio:
        pasaron al Ministerio de Demografía, Familia y Asuntos Sociales.

  - id: SI-2026-okolje-prostor
    order: 7
    name_original: Ministrstvo za okolje in prostor
    abbreviation_original: null
    name_en: Ministry of the Environment and Spatial Planning
    name_es: Ministerio de Medio Ambiente y Ordenación del Territorio
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za okolje in prostor
    head_title_en: Minister of the Environment and Spatial Planning
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [environment, spatial_planning, climate, water, housing, mining]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-okolje-in-prostor/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        The most heavily rearranged of the fourteen. ZVRS-K stripped energy and sustainable
        mobility out of the former Ministrstvo za okolje, podnebje in energijo, merged in the
        whole of the Ministrstvo za naravne vire in prostor, and added the housing policy of the
        abolished Ministrstvo za solidarno prihodnost. Article 38.a of the Zakon o državni
        upravi therefore gives it environmental protection, environmental assessment, climate
        change and waste, nature conservation, water management and water infrastructure,
        nuclear safety and radiation protection, the remediation of natural disasters, mining,
        spatial planning and construction, surveying, and housing policy. Slovenia has no
        housing ministry and no climate ministry, so housing and climate are tagged here; mining
        is tagged because rudarstvo is named in the article and has no other home. Nuclear
        safety is regulatory and is not tagged energy — energy is the infrastructure ministry's.
        The remediation of natural disasters is here, but the civil-protection system itself is
        the defence ministry's, and civil_protection is tagged there.
      es: >-
        El más reorganizado de los catorce. La ZVRS-K le quitó al antiguo Ministrstvo za okolje,
        podnebje in energijo la energía y la movilidad sostenible, le fusionó íntegramente el
        Ministrstvo za naravne vire in prostor y le añadió la política de vivienda del suprimido
        Ministrstvo za solidarno prihodnost. El artículo 38.a de la Zakon o državni upravi le
        atribuye por tanto la protección del medio ambiente, las evaluaciones ambientales, el
        cambio climático y los residuos, la conservación de la naturaleza, la gestión del agua y
        la infraestructura hídrica, la seguridad nuclear y la protección radiológica, la
        reparación de los daños por catástrofes naturales, la minería, la ordenación del
        territorio y la edificación, la actividad geodésica y la política de vivienda. Eslovenia
        no tiene ministerio de vivienda ni de clima, así que housing y climate se etiquetan
        aquí; mining se etiqueta porque rudarstvo figura nombrado en el artículo y no tiene otro
        hogar. La seguridad nuclear es regulatoria y no lleva la etiqueta energy: la energía es
        del ministerio de infraestructuras. La reparación de los daños por catástrofes naturales
        está aquí, pero el sistema de protección civil en sí es del ministerio de Defensa, y
        civil_protection se etiqueta allí.

  - id: SI-2026-demografija-druzina-socialne-zadeve
    order: 8
    name_original: Ministrstvo za demografijo, družino in socialne zadeve
    abbreviation_original: null
    name_en: Ministry of Demography, Family and Social Affairs
    name_es: Ministerio de Demografía, Familia y Asuntos Sociales
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za demografijo, družino in socialne zadeve
    head_title_en: Minister of Demography, Family and Social Affairs
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [social_affairs, family, social_security, disability, elderly, equality]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-demografijo-druzino-in-socialne-zadeve/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en, rtvslo-izvolitev-vlade]
    note:
      en: >-
        The successor to the Ministrstvo za delo, družino, socialne zadeve in enake možnosti,
        minus labour and plus demography and long-term care. It is the only ministry in this
        cabinet whose name announces a policy objective — demografija — rather than a sector,
        and article 28 of the Zakon o državni upravi lists demography first, then family,
        social affairs, disability protection, equal opportunities, long-term care,
        deinstitutionalisation, the long-lived society, and the institutional part of social
        care. equality is tagged on the strength of "enakih možnosti": Slovenia has no ministry
        of equality, and the equal-opportunities portfolio came here with the rest of the old
        social ministry. elderly is tagged for long-term care and the dolgoživa družba
        programme. labour is emphatically not tagged: ZVRS-K moved employment relations, rights
        at work, employment and vocational training to the Ministry of the Economy, Labour and
        Sport. social_security is tagged and is the one genuinely contested tag in this file —
        neither the ZVRS nor article 28 names the pension system, the point was raised in the
        National Assembly, and the tag rests on ZVRS-K's transfer of the old ministry's whole
        field of activity except the four labour areas it lists. See the methodology note.
      es: >-
        El sucesor del Ministrstvo za delo, družino, socialne zadeve in enake možnosti, menos el
        trabajo y más la demografía y los cuidados de larga duración. Es el único ministerio de
        este gabinete cuyo nombre anuncia un objetivo de política —demografija— y no un sector,
        y el artículo 28 de la Zakon o državni upravi enumera primero la demografía, después la
        familia, los asuntos sociales, la protección de la discapacidad, la igualdad de
        oportunidades, los cuidados de larga duración, la desinstitucionalización, la sociedad
        longeva y la parte institucional de la atención social. equality se etiqueta por «enakih
        možnosti»: Eslovenia no tiene ministerio de igualdad, y la cartera de igualdad de
        oportunidades llegó aquí con el resto del antiguo ministerio social. elderly se etiqueta
        por los cuidados de larga duración y el programa de la dolgoživa družba. labour no se
        etiqueta en absoluto: la ZVRS-K trasladó las relaciones laborales, los derechos
        derivados del trabajo, el empleo y la formación profesional al Ministerio de Economía,
        Trabajo y Deporte. social_security sí se etiqueta y es la única etiqueta realmente
        discutida de este fichero: ni la ZVRS ni el artículo 28 nombran el sistema de pensiones,
        la cuestión se planteó en la Asamblea Nacional, y la etiqueta se apoya en la
        transferencia que hace la ZVRS-K de todo el ámbito de actividad del antiguo ministerio
        salvo las cuatro áreas laborales que enumera. Véase la nota metodológica.

  - id: SI-2026-pravosodje
    order: 9
    name_original: Ministrstvo za pravosodje
    abbreviation_original: null
    name_en: Ministry of Justice
    name_es: Ministerio de Justicia
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za pravosodje
    head_title_en: Minister of Justice
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [justice]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-pravosodje/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        Untouched by the reorganisation, and tagged with justice alone. Article 37 of the Zakon
        o državni upravi gives it the organisation and status of the courts, the state
        prosecutor's office, the state attorney's office, the Constitutional Court and the
        Human Rights Ombudsman, civil and criminal law, court procedure, the prison service,
        legal professions, data protection, e-justice and the systemic regulation of
        anti-corruption. The courts, the Državno tožilstvo and the Ustavno sodišče are
        constitutionally outside the executive and are not recorded in this file even as
        exclusions, because they are not government departments; this ministry administers
        their organisation, not their work. The police belong to the interior ministry.
      es: >-
        Intacto en la reorganización, y etiquetado sólo con justicia. El artículo 37 de la Zakon
        o državni upravi le atribuye la organización y el estatuto de los tribunales, la
        fiscalía del Estado, la abogacía del Estado, el Tribunal Constitucional y el Defensor de
        los Derechos Humanos, el derecho civil y penal, el procedimiento judicial, el sistema
        penitenciario, las profesiones jurídicas, la protección de datos, la e-justicia y la
        regulación sistémica de la lucha contra la corrupción. Los tribunales, el Državno
        tožilstvo y el Ustavno sodišče están constitucionalmente fuera del ejecutivo y no se
        registran en este fichero ni siquiera como exclusiones, porque no son departamentos de
        gobierno; este ministerio administra su organización, no su trabajo. La policía
        pertenece al ministerio del Interior.

  - id: SI-2026-kmetijstvo
    order: 10
    name_original: Ministrstvo za kmetijstvo
    abbreviation_original: null
    name_en: Ministry of Agriculture
    name_es: Ministerio de Agricultura
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za kmetijstvo
    head_title_en: Minister of Agriculture
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [agriculture, rural_development, food_safety, forestry, fisheries, animal_welfare]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-kmetijstvo/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        A rename with no change of substance, and a warning against reading a cabinet by its
        labels. It was the Ministrstvo za kmetijstvo, gozdarstvo in prehrano until May 2026,
        when ZVRS-K shortened the name to Ministrstvo za kmetijstvo while transferring "delovnim
        področjem Ministrstva za kmetijstvo, gozdarstvo in prehrano" — its field of activity —
        unchanged. Forestry, food and food safety are therefore still this ministry's even
        though the name no longer says so, and article 32 of the Zakon o državni upravi confirms
        it: agriculture, rural development, nutrition, plant protection, veterinary services and
        animal breeding, forestry, hunting, fisheries, and the safety and quality of feed and
        food. animal_welfare is tagged for veterinarstvo and zootehnika, which is the closest
        the taxonomy comes to a veterinary-administration portfolio. Unlike Lithuania, Slovenia
        puts forests with agriculture rather than with the environment.
      es: >-
        Un cambio de nombre sin cambio de fondo, y una advertencia contra leer un gabinete por
        sus etiquetas. Fue el Ministrstvo za kmetijstvo, gozdarstvo in prehrano hasta mayo de
        2026, cuando la ZVRS-K abrevió el nombre a Ministrstvo za kmetijstvo transfiriéndole sin
        cambios «delovnim področjem Ministrstva za kmetijstvo, gozdarstvo in prehrano», su
        ámbito de actividad. La silvicultura, la alimentación y la seguridad alimentaria siguen
        por tanto siendo de este ministerio aunque el nombre ya no lo diga, y el artículo 32 de
        la Zakon o državni upravi lo confirma: agricultura, desarrollo rural, nutrición,
        protección vegetal, veterinaria y zootecnia, silvicultura, caza, pesca y seguridad y
        calidad de los piensos y los alimentos. animal_welfare se etiqueta por veterinarstvo y
        zootehnika, que es lo más cercano que ofrece el vocabulario a una cartera de
        administración veterinaria. A diferencia de Lituania, Eslovenia sitúa los bosques en
        agricultura y no en medio ambiente.

  - id: SI-2026-kultura
    order: 11
    name_original: Ministrstvo za kulturo
    abbreviation_original: null
    name_en: Ministry of Culture
    name_es: Ministerio de Cultura
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za kulturo
    head_title_en: Minister of Culture
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [culture, media, language_policy, religion]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-kulturo/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        Untouched by the reorganisation, and one of the few ministries in this dataset whose
        statutory field of activity is short enough to quote whole: article 32.a of the Zakon o
        državni upravi gives it "umetnosti, kulture, kulturne dediščine, filma, medijev,
        slovenskega jezika in verske svobode" — the arts, culture, cultural heritage, film,
        media, the Slovene language and religious freedom. All four tags come straight from
        that sentence, which is why this is one of the few entities where language_policy and
        religion appear without interpretation. Sport is not here; it is the economy ministry's.
      es: >-
        Intacto en la reorganización, y uno de los pocos ministerios de este conjunto de datos
        cuyo ámbito legal de actividad es lo bastante breve para citarlo entero: el artículo
        32.a de la Zakon o državni upravi le atribuye «umetnosti, kulture, kulturne dediščine,
        filma, medijev, slovenskega jezika in verske svobode» —las artes, la cultura, el
        patrimonio cultural, el cine, los medios, la lengua eslovena y la libertad religiosa—.
        Las cuatro etiquetas salen directamente de esa frase, y por eso es una de las pocas
        entidades donde language_policy y religion aparecen sin interpretación. El deporte no
        está aquí: es del ministerio de economía.

  - id: SI-2026-lokalna-samouprava-kohezija-regionalni-razvoj
    order: 12
    name_original: Ministrstvo za lokalno samoupravo, kohezijo in regionalni razvoj
    abbreviation_original: null
    name_en: Ministry of Local Self-Government, Cohesion and Regional Development
    name_es: Ministerio de Autogobierno Local, Cohesión y Desarrollo Regional
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za lokalno samoupravo, kohezijo in regionalni razvoj
    head_title_en: Minister of Local Self-Government, Cohesion and Regional Development
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [territorial_administration, regional_development]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-lokalno-samoupravo-kohezijo-in-regionalni-razvoj/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        The former Ministrstvo za kohezijo in regionalni razvoj, which took local
        self-government from the abolished Ministrstvo za javno upravo in May 2026 and put it
        first in its new name. Article 32.b of the Zakon o državni upravi gives it local
        self-government, European cohesion policy and the programming and management of its
        funds, other sources of non-repayable funds for reducing economic and social
        disparities, and regional development. In most of this dataset's countries these two
        areas are split between an interior ministry and a finance ministry; Slovenia gives them
        a department of their own, and this is where the coalition's stated commitment to
        decentralisation and to the creation of pokrajine — a regional tier Slovenia does not
        yet have — would be administered. The municipalities themselves are subnational
        government and out of scope; local self-government appears here as a portfolio.
      es: >-
        El antiguo Ministrstvo za kohezijo in regionalni razvoj, que tomó el autogobierno local
        del suprimido Ministrstvo za javno upravo en mayo de 2026 y lo puso en primer lugar en
        su nuevo nombre. El artículo 32.b de la Zakon o državni upravi le atribuye el
        autogobierno local, la política europea de cohesión y la programación y gestión de sus
        fondos, otras fuentes de fondos no reembolsables para reducir las diferencias económicas
        y sociales, y el desarrollo regional. En la mayoría de los países de este conjunto de
        datos esas dos áreas se reparten entre un ministerio del interior y uno de hacienda;
        Eslovenia les da un departamento propio, y aquí es donde se administraría el compromiso
        declarado de la coalición con la descentralización y con la creación de pokrajine, un
        nivel regional que Eslovenia todavía no tiene. Los municipios mismos son gobierno
        subnacional y quedan fuera de alcance; el autogobierno local figura aquí como cartera.

  - id: SI-2026-obramba
    order: 13
    name_original: Ministrstvo za obrambo
    abbreviation_original: null
    name_en: Ministry of Defence
    name_es: Ministerio de Defensa
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za obrambo
    head_title_en: Minister of Defence
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [defence, civil_protection, veterans]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-obrambo/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        Untouched by the reorganisation, and the reason civil_protection is not on the interior
        ministry where most of this dataset's countries keep it. Article 35 of the Zakon o
        državni upravi gives this ministry the defence system, the "sistem varstva pred
        naravnimi in drugimi nesrečami" — the system of protection against natural and other
        disasters, which is Slovenia's civil-protection and rescue service — and war invalids,
        war veterans, victims of war violence and war graves, which is what veterans is tagged
        for. Slovenia has no separate ministry for veterans or for emergencies, so both areas
        land here.
      es: >-
        Intacto en la reorganización, y la razón de que civil_protection no esté en el
        ministerio del Interior, donde la sitúan la mayoría de los países de este conjunto de
        datos. El artículo 35 de la Zakon o državni upravi atribuye a este ministerio el sistema
        de defensa, el «sistem varstva pred naravnimi in drugimi nesrečami» —el sistema de
        protección frente a catástrofes naturales y de otro tipo, que es el servicio esloveno de
        protección civil y rescate— y los inválidos de guerra, los veteranos de guerra, las
        víctimas de la violencia de guerra y las tumbas de guerra, que es lo que motiva la
        etiqueta veterans. Eslovenia no tiene un ministerio propio de veteranos ni de
        emergencias, así que las dos áreas caen aquí.

  - id: SI-2026-zunanje-evropske-zadeve
    order: 14
    name_original: Ministrstvo za zunanje in evropske zadeve
    abbreviation_original: null
    name_en: Ministry of Foreign and European Affairs
    name_es: Ministerio de Asuntos Exteriores y Europeos
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za zunanje in evropske zadeve
    head_title_en: Minister of Foreign and European Affairs
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [foreign_affairs, european_affairs, development_cooperation]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-zunanje-in-evropske-zadeve/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        Untouched by the reorganisation. Slovenia has neither a European affairs minister nor a
        development minister: article 41 of the Zakon o državni upravi gives this ministry
        foreign affairs, economic diplomacy including the protection of Slovenian economic
        interests abroad, consular protection, international law and treaty-making,
        international development cooperation and humanitarian aid, European affairs, and
        relations with the OECD. european_affairs is on the ministry's own name and needs no
        interpretation, which is unusual in this dataset. trade is not tagged here even though
        economic diplomacy is: trade policy proper is named in article 30 as the economy
        ministry's, and this ministry's role is the diplomatic representation of it. Relations
        with Slovenians abroad are not this ministry's either — they belong to the minister
        without portfolio recorded below, which is the arrangement most likely to surprise a
        reader used to a diaspora directorate inside a foreign ministry.
      es: >-
        Intacto en la reorganización. Eslovenia no tiene ministro de Asuntos Europeos ni de
        Desarrollo: el artículo 41 de la Zakon o državni upravi atribuye a este ministerio los
        asuntos exteriores, la diplomacia económica —incluida la protección de los intereses
        económicos eslovenos en el exterior—, la protección consular, el derecho internacional y
        la celebración de tratados, la cooperación internacional al desarrollo y la ayuda
        humanitaria, los asuntos europeos y las relaciones con la OCDE. european_affairs figura
        en el propio nombre del ministerio y no requiere interpretación, algo poco frecuente en
        este conjunto de datos. trade no se etiqueta aquí aunque sí exista diplomacia económica:
        la política comercial propiamente dicha figura en el artículo 30 como del ministerio de
        economía, y el papel de esta casa es su representación diplomática. Las relaciones con
        los eslovenos del exterior tampoco son de este ministerio: corresponden a la ministra
        sin cartera que se registra más abajo, el arreglo que con mayor probabilidad sorprenderá
        a un lector acostumbrado a una dirección de diáspora dentro de un ministerio de
        exteriores.

  # --- recorded, not counted --------------------------------------------------------------
  - id: SI-2026-predsednik-vlade
    order: 15
    name_original: Predsednik vlade
    abbreviation_original: null
    name_en: Prime Minister
    name_es: Presidente del Gobierno
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Predsednik vlade
    head_title_en: Prime Minister
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://www.gov.si/drzavni-organi/vlada/
    sources: [pisrs-zvrs-npb19, ul-715-2026-izvolitev-predsednika-vlade, gov-si-o-vladi, gov-si-about-the-government-en, dvk-volitve-dz-2026, rtvslo-izvolitev-vlade]
    note:
      en: >-
        Not a ministry and not a department: article 8(1) of the ZVRS does not list one, and
        article 14 gives the Prime Minister the direction and coordination of the government's
        work, the representation of the government and the chairing of its sessions — no
        portfolio. It is recorded because gov.si states that "Vlado sestavljajo predsednik vlade
        in ministri", which is what makes the cabinet sixteen people against fourteen
        departments. The holder is Janez Janša, elected by the Državni zbor on 22 May 2026 under
        the second and third paragraphs of Article 111 of the Constitution; this is his fourth
        government. Do not confuse this entry with the Kabinet predsednika Vlade Republike
        Slovenije below: this is the constitutional office of the head of government, that is
        the vladna služba which serves it, and each is excluded for a different reason. Slovenia
        has no separate deputy-prime-minister entity either: under article 8(5) of the ZVRS the
        function is conferred by the government on one or more serving ministers, and in this
        cabinet on the ministers of the economy and of infrastructure, so it adds neither a
        ministry nor a seat.
      es: >-
        No es un ministerio ni un departamento: el artículo 8(1) de la ZVRS no enumera ninguno,
        y el artículo 14 atribuye al presidente del Gobierno la dirección y coordinación del
        trabajo del gobierno, su representación y la presidencia de sus sesiones —ninguna
        cartera—. Se registra porque gov.si afirma que «Vlado sestavljajo predsednik vlade in
        ministri», que es lo que hace que el gabinete sean dieciséis personas frente a catorce
        departamentos. El titular es Janez Janša, elegido por la Asamblea Nacional el 22 de mayo
        de 2026 conforme a los apartados segundo y tercero del artículo 111 de la Constitución;
        es su cuarto gobierno. No confundir esta entrada con el Kabinet predsednika Vlade
        Republike Slovenije de más abajo: ésta es la oficina constitucional del jefe de
        gobierno, aquél la vladna služba que la sirve, y cada uno se excluye por un motivo
        distinto. Eslovenia tampoco tiene una entidad separada de viceprimer ministro: según el
        artículo 8(5) de la ZVRS la función se confiere por el gobierno a uno o varios ministros
        en ejercicio, y en este gabinete a los de economía e infraestructuras, de modo que no
        añade ni ministerio ni asiento.

  - id: SI-2026-urad-za-slovence-v-zamejstvu-in-po-svetu
    order: 16
    name_original: Urad Vlade Republike Slovenije za Slovence v zamejstvu in po svetu
    abbreviation_original: null
    name_en: Government Office for Slovenians Abroad
    name_es: Oficina del Gobierno para los Eslovenos en el Exterior
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister brez resorja
    head_title_en: Minister without Portfolio
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: minister_without_portfolio
    url: https://www.gov.si/drzavni-organi/vladne-sluzbe/urad-vlade-za-slovence-v-zamejstvu-in-po-svetu/
    sources: [pisrs-zvrs-npb19, ul-872-2026-imenovanje-ministrov, gov-si-vladne-sluzbe, gov-si-government-offices-en, gov-si-about-the-government-en, rtvslo-izvolitev-vlade]
    note:
      en: >-
        A cabinet seat and no ministry, and the reason the seat count is sixteen rather than
        fifteen. Slovenia is unusual in making a minister without portfolio compulsory: the
        second paragraph of article 8 of the ZVRS provides that the government "ima ... ministra
        brez resorja za področje odnosov med Republiko Slovenijo in avtohtono slovensko narodno
        skupnostjo v sosednjih državah ter med Republiko Slovenijo in Slovenci po svetu", giving
        effect to article 14(1) of the Zakon o odnosih Republike Slovenije s Slovenci zunaj
        njenih meja. The post is not optional and not at the Prime Minister's discretion, unlike
        the up to two further ministers without portfolio the third paragraph permits, of which
        this cabinet has none. The entity is recorded under the name of the government office
        the minister heads, because that office is the administrative body and is what gov.si
        publishes; it is a vladna služba under article 25 of the ZVRS, which expressly allows a
        vladna služba to be headed by a minister without portfolio. It is not counted as a
        ministry because article 8(1) does not list the portfolio and section 4 of the Zakon o
        državni upravi gives the office no article — counting it would make fifteen ministries.
        The holder is Suzana Lep Šimenko, appointed on 4 June 2026 with the full designation the
        gazette gives; the government's own English rendering of that designation is "Minister
        for Relations between the Republic of Slovenia and the Autochthonous Slovenian National
        Community in Neighbouring Countries, and between the Republic of Slovenia and Slovenians
        Abroad". No policy area is tagged, because policy areas are only recorded for counted
        ministries; a reader looking for where diaspora policy sits in Slovenia will find it
        here rather than in the foreign ministry.
      es: >-
        Un asiento en el gabinete y ningún ministerio, y la razón de que los asientos sean
        dieciséis y no quince. Eslovenia es inusual porque hace obligatorio un ministro sin
        cartera: el apartado segundo del artículo 8 de la ZVRS establece que el gobierno «ima
        ... ministra brez resorja za področje odnosov med Republiko Slovenijo in avtohtono
        slovensko narodno skupnostjo v sosednjih državah ter med Republiko Slovenijo in Slovenci
        po svetu», dando efecto al artículo 14(1) de la Zakon o odnosih Republike Slovenije s
        Slovenci zunaj njenih meja. El cargo no es opcional ni queda a discreción del presidente
        del Gobierno, a diferencia de los hasta dos ministros sin cartera adicionales que
        permite el apartado tercero, de los que este gabinete no tiene ninguno. La entidad se
        registra con el nombre de la oficina gubernamental que la ministra dirige, porque esa
        oficina es el órgano administrativo y es lo que publica gov.si; es una vladna služba del
        artículo 25 de la ZVRS, que permite expresamente que una vladna služba esté dirigida por
        un ministro sin cartera. No se cuenta como ministerio porque el artículo 8(1) no enumera
        la cartera y la sección 4 de la Zakon o državni upravi no dedica ningún artículo a la
        oficina: contarla daría quince ministerios. La titular es Suzana Lep Šimenko, nombrada
        el 4 de junio de 2026 con la designación completa que da el boletín oficial; la versión
        inglesa del propio gobierno de esa designación es «Minister for Relations between the
        Republic of Slovenia and the Autochthonous Slovenian National Community in Neighbouring
        Countries, and between the Republic of Slovenia and Slovenians Abroad». No se etiqueta
        ninguna área de política, porque las áreas sólo se registran para los ministerios
        contados; quien busque dónde se sitúa la política de diáspora en Eslovenia la
        encontrará aquí y no en el ministerio de exteriores.

  - id: SI-2026-kabinet-predsednika-vlade
    order: 17
    name_original: Kabinet predsednika Vlade Republike Slovenije
    abbreviation_original: null
    name_en: Office of the Prime Minister
    name_es: Gabinete del Presidente del Gobierno
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Direktor
    head_title_en: Director
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://www.gov.si/drzavni-organi/vladne-sluzbe/kabinet-predsednika-vlade/
    sources: [pisrs-zvrs-npb19, gov-si-vladne-sluzbe, gov-si-government-offices-en]
    note:
      en: >-
        Recorded so that the perimeter is visible, and excluded on the narrowest available
        ground. The fifth paragraph of article 25 of the ZVRS constitutes it as a vladna služba
        — "Kot vladna služba deluje tudi kabinet predsednika vlade" — and provides that where
        its head is a direktor, the Prime Minister appoints and dismisses him outside the civil
        service selection procedure. It is therefore not headed by a minister, holds no cabinet
        seat and is not a ministry: article 8(1) of the ZVRS does not list it and the Zakon o
        državni upravi gives it no article. Two cautions. First, gov.si's English edition calls
        it the "Office of the Prime Minister", which reads like the constitutional office of the
        head of government recorded separately above; the two are different things and are kept
        apart here. Second, article 24(2) of the ZVRS provides that a state secretary
        responsible for dialogue with civil society is appointed in the Prime Minister's
        cabinet — a junior appointment inside this body, not a cabinet seat, and not recorded
        as an entity of its own.
      es: >-
        Se registra para que el perímetro sea visible, y se excluye por el motivo más estricto
        disponible. El apartado quinto del artículo 25 de la ZVRS lo constituye como vladna
        služba —«Kot vladna služba deluje tudi kabinet predsednika vlade»— y establece que
        cuando su titular es un direktor, el presidente del Gobierno lo nombra y lo cesa al
        margen del procedimiento de selección de la función pública. No está por tanto dirigido
        por un ministro, no lleva asiento en el gabinete y no es un ministerio: el artículo 8(1)
        de la ZVRS no lo enumera y la Zakon o državni upravi no le dedica ningún artículo. Dos
        advertencias. Primera: la edición inglesa de gov.si lo llama «Office of the Prime
        Minister», que se lee como la oficina constitucional del jefe de gobierno registrada por
        separado más arriba; son cosas distintas y aquí se mantienen separadas. Segunda: el
        artículo 24(2) de la ZVRS prevé que en el gabinete del presidente del Gobierno se nombre
        un secretario de Estado responsable del diálogo con la sociedad civil —un cargo
        subordinado dentro de este órgano, no un asiento en el gabinete, y no registrado como
        entidad propia—.

  - id: SI-2026-generalni-sekretariat-vlade
    order: 18
    name_original: Generalni sekretariat Vlade Republike Slovenije
    abbreviation_original: null
    name_en: Secretariat-General of the Government of the Republic of Slovenia
    name_es: Secretaría General del Gobierno de la República de Eslovenia
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Generalni sekretar vlade
    head_title_en: Secretary-General of the Government
    has_cabinet_seat: false
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: not_headed_by_minister
    url: https://www.gov.si/drzavni-organi/vladne-sluzbe/generalni-sekretariat-vlade/
    sources: [pisrs-zvrs-npb19, gov-si-vladne-sluzbe, gov-si-government-offices-en]
    note:
      en: >-
        The administrative apparatus of the government, and the closest Slovenian equivalent of
        Lithuania's Vyriausybės kanceliarija or the Spanish Ministerio de la Presidencia's
        secretariat function — but a service and not a department. The third paragraph of
        article 25 of the ZVRS constitutes it as a vladna služba headed by the generalni
        sekretar, whom the government appoints and dismisses on the Prime Minister's proposal
        and who prepares the government's sessions and sees its decisions carried out on the
        Prime Minister's instructions. The generalni sekretar is not a minister, is not a member
        of the government and does not sit in the cabinet, so this entity is excluded as
        not_headed_by_minister and carries no seat; counting it would give fifteen ministries
        and giving its secretary-general a seat would give seventeen seats, and neither is done
        here. Compare Finland, where the equivalent body appears in the statutory list of
        ministries and is counted, and Lithuania, where it is excluded on exactly this ground.
      es: >-
        El aparato administrativo del gobierno, y el equivalente esloveno más cercano a la
        Vyriausybės kanceliarija lituana o a la función de secretaría del Ministerio de la
        Presidencia español —pero un servicio y no un departamento—. El apartado tercero del
        artículo 25 de la ZVRS lo constituye como vladna služba dirigida por el generalni
        sekretar, a quien el gobierno nombra y cesa a propuesta del presidente del Gobierno y
        que prepara las sesiones del gobierno y vela por la ejecución de sus decisiones según
        las instrucciones del presidente. El generalni sekretar no es ministro, no es miembro
        del gobierno y no tiene asiento en el gabinete, de modo que esta entidad se excluye por
        not_headed_by_minister y no lleva asiento; contarla daría quince ministerios y dar
        asiento a su secretario general daría diecisiete asientos, y aquí no se hace ni lo uno
        ni lo otro. Compárese con Finlandia, donde el órgano equivalente figura en la lista
        legal de ministerios y sí se cuenta, y con Lituania, donde se excluye exactamente por
        este motivo.
