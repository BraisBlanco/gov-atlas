      cited is the register's own PDF export of this edition, served as ZAKO3225_NPB25.pdf.

  - id: ul-872-2026-imenovanje-ministrov
    tier: 1
    type: official_gazette
    publisher: >-
      Uradni list Republike Slovenije (izdajatelj: Služba Vlade Republike Slovenije za
      zakonodajo)
    title: >-
      Sklep o imenovanju ministric in ministrov, Uradni list RS, št. 872/2026 z dne 8. 6. 2026
    url: https://pisrs.si/api/uradni-list/objava/u20260872.pdf
    archive_url: https://web.archive.org/web/20260728102313/https://pisrs.si/api/uradni-list/objava/u20260872.pdf
    lang: sl
    published: 2026-06-08
    accessed: 2026-07-28
    quote: |-
      Na podlagi 112. člena Ustave Republike Slovenije (Uradni list RS, št. 33/91-I, 42/97, 66/00, 24/03, 69/04, 68/06, 47/13, 75/16, 92/21 in 98/25) ter 112. in 232. člena Poslovnika državnega zbora (Uradni list RS, št. 92/07 – uradno prečiščeno besedilo, 105/10, 80/13, 38/17, 46/20, 105/21 – odl. US, 111/21, 58/23 in 35/24) je Državni zbor na seji 4. junija 2026 sprejel
      Sklep o imenovanju ministric in ministrov
      Za ministrice in ministre se imenujejo:
      – Janez Cigler Kralj za ministra za kmetijstvo,
      – dr. Ignacija Fridl Jarc za ministrico za kulturo,
      – mag. Valentin Hajdinjak za ministra za obrambo,
      – Tone Kajzer za ministra za zunanje in evropske zadeve,
      – dr. Monika Kirbiš Rojs za ministrico za lokalno samoupravo, kohezijo in regionalni razvoj,
      – Suzana Lep Šimenko za ministrico brez resorja za področje odnosov med Republiko Slovenijo in avtohtono slovensko narodno skupnostjo v sosednjih državah ter med Republiko Slovenijo in Slovenci po svetu,
      – dr. Anže Logar za ministra za gospodarstvo, delo in šport,
      – Franci Matoz za ministra za notranje zadeve in javno upravo,
      – dr. Tadej Ostrc za ministra za zdravje,
      – Mateja Ribič za ministrico za demografijo, družino in socialne zadeve,
      – mag. Polona Rifelj za ministrico za okolje in prostor,
      – dr. Borut Rončević za ministra za izobraževanje, znanost in mladino,
      – mag. Andrej Šircelj za ministra za finance,
      – Jernej Vrtovec za ministra za infrastrukturo in energetiko ter
      – Mihael Zupančič za ministra za pravosodje.
      Ljubljana, dne 4. junija 2026
    note: >-
      The Državni zbor's own decision appointing the government, under Article 112 of the
      Constitution, and the source for this cabinet's start date and for the closure of its
      roster. It appoints exactly fifteen people: fourteen portfolio ministers, one per
      portfolio in article 8(1) of the ZVRS, and one minister without portfolio. Nobody is
      appointed to two portfolios and no portfolio is left vacant, which is what makes the
      seat count checkable — sixteen people including the Prime Minister, who was elected
      separately on 22 May. Two details worth reading. First, the decision lists appointees in
      Slovene alphabetical order of surname, not in the statutory order of portfolios, so the
      order of entities in this file follows the ZVRS rather than this decision. Second, it
      gives the minister without portfolio her full statutory designation, "ministrico brez
      resorja za področje odnosov med Republiko Slovenijo in avtohtono slovensko narodno
      skupnostjo v sosednjih državah ter med Republiko Slovenijo in Slovenci po svetu", which
      is the form followed here; Slovenian press usage shortens this to "ministrica brez
      listnice za Slovence v zamejstvu in po svetu", and "brez listnice" is a colloquialism
      that no instrument uses. The item identifier is 2026-01-1532 and the EPA number 94-X.

