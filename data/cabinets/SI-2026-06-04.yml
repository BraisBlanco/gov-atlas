      appointed on 4 June 2026, which agrees with the gazette. Second, that Slovenia publishes
      its own arithmetic as "15 ministrov" — fifteen ministers, i.e. sixteen seats less the
      Prime Minister, and not a count of departments. Third, that exactly two of those
      ministers, Anže Logar and Jernej Vrtovec, also hold the function of deputy prime
      minister, which under article 8(5) of the ZVRS is conferred on a serving minister by the
      government and therefore adds neither a ministry nor a seat. The quotation reproduces
