    note: >-
      The statute that names the ministries and defines what each one does — article 9 of the
      ZVRS sends the question here. Section 4 gives each ministry an article of its own whose
      heading is the ministry's name, and the quotation reproduces that section's headings
      complete, deleted articles included, so that a reader can count fourteen live ministries
      and see the nine articles the reorganisation struck out. This is neuradno prečiščeno
      besedilo št. 25, the edition incorporating the Zakon o spremembah in dopolnitvah Zakona
      o državni upravi (ZDU-1P), Uradni list RS št. 979/26 of 17 June 2026, which harmonised
      the ZDU-1 with ZVRS-K inside the two-month deadline that article 2 of ZVRS-K set. The
      full text of each article is not quoted here for length, but the fields of activity it
      sets out are what the policy-area tags below follow, and each ministry's note names the
      article it relies on. The same address caveat applies as for the ZVRS: pisrs.si serves
      the consolidated text through a single-page application whose page
