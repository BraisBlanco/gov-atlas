    quote: |-
      Na podlagi drugega in tretjega odstavka 111. člena Ustave Republike Slovenije (Uradni list RS, št. 33/91-I, 42/97, 66/00, 24/03, 69/04, 68/06, 47/13, 75/16, 92/21 in 98/25) ter 112. in 227. člena Poslovnika državnega zbora (Uradni list RS, št. 92/07 – uradno prečiščeno besedilo, 105/10, 80/13, 38/17, 46/20, 105/21 – odl. US, 111/21, 58/23 in 35/24) je Državni zbor na seji 22. maja 2026 sprejel
      Sklep o izvolitvi predsednika Vlade Republike Slovenije
      Za predsednika Vlade Republike Slovenije se izvoli Janez (Ivan) Janša.
      Ljubljana, dne 22. maja 2026
    note: >-
      The election of the Prime Minister, thirteen days before the ministers were appointed.
      Cited for two things: that the head of government holds his office by a decision of the
      Državni zbor and not by presidential appointment, which is why this dataset files
      Slovenia as a parliamentary rather than a semi-presidential republic; and that 22 May
      2026 is not this cabinet's start date, because on that date the government had no
      ministers. The decision rests on the second and third paragraphs of Article 111 of the
      Constitution, which is the route used when a Prime Minister is elected by an absolute
      majority after the President's first candidate fails or, as here, on a later ballot. The
      item identifier is 2026-01-1375 and the EPA number 76-X.

