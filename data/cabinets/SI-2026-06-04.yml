  - id: dvk-volitve-dz-2026
    tier: 2
    type: government_website
    publisher: Državna volilna komisija Republike Slovenije (DVK)
    title: Volitve v Državni zbor 2026 — Državna volilna komisija
    url: >-
      https://www.dvk-rs.si/volitve-in-referendumi/drzavni-zbor-rs/volitve-drzavnega-zbora-rs/volitve-v-drzavni-zbor/
    archive_url: >-
      https://web.archive.org/web/20260728104354/https://www.dvk-rs.si/volitve-in-referendumi/drzavni-zbor-rs/volitve-drzavnega-zbora-rs/volitve-v-drzavni-zbor/
    lang: sl
    published: null
    accessed: 2026-07-28
    quote: |-
      VOLITVE V DRŽAVNI ZBOR 2026
      Volitve v Državni zbor Republike Slovenije so bile v nedeljo, 22. marca 2026.
      Na podlagi splošne volilne pravice je glasovalo skupaj 1.190.932 volivcev ali 70,25% od vseh volivcev, ki so imeli pravico voliti.
      Za izvolitev 88 poslancev Državnega zbora je bilo oddanih 1.190.819 glasovnic. Ker so bile prazne oziroma volja volivca na glasovnici ni bila jasno izražena, je bilo neveljavnih 11.050 glasovnic. Veljavnih je bilo 1.179.769 glasovnic.
      Izid glasovanja je naslednji:
      Gibanje Svoboda 28,66%
      Slovenska demokratska stranka - SDS 27,88%
    note: >-
      The State Election Commission's own record of the general election that produced this
      cabinet, cited for the single fact this file needs from it: that Slovenia went to the
      polls on 22 March 2026, so the government sitting on this file's access date is not the
      one that governed before. It is also the check on a trap for the unwary — Gibanje
      Svoboda won the most votes and did not form the government, so a curator who inferred the
      cabinet from the election result rather than from the gazette would have recorded the
      wrong one. No counted ministry rests on this source.

  - id: rtvslo-izvolitev-vlade
    tier: 3
    type: press
    publisher: RTV Slovenija (RTVSLO.si)
    title: Državni zbor je izvolil četrto vlado Janeza Janše
    url: https://www.rtvslo.si/slovenija/drzavni-zbor-je-izvolil-cetrto-vlado-janeza-janse/784264
    archive_url: >-
      https://web.archive.org/web/20260725100525/https://www.rtvslo.si/slovenija/drzavni-zbor-je-izvolil-cetrto-vlado-janeza-janse/784264
    lang: sl
    published: 2026-06-04
    accessed: 2026-07-28
    quote: |-
      Državni zbor je z 49 glasovi za in 30 proti potrdil listo 15 ministrov, s čimer je bila izvoljena nova vlada Janeza Janše. Prisotnih je bilo 79 poslancev.
      Po izvolitvi so pred državnim zborom prisegli novi ministri. Sledila je predaja poslov med novim predsednikom vlade Janšo in nekdanjim premierjem Robertom Golobom. Nato se je začela prva seja nove vlade.
      Poslanec Martin Mikolič (NSi, SLS in Fokus) je zadovoljen, da bo Slovenija z novo vlado dobila "optimalno" število ministrstev.
      Meira Hot je bila še posebej kritična do združitve resorja za gospodarstvo in delo. Po njenih besedah še vedno ni jasno, kdo bo odgovoren za socialne in delavske pravice, pa tudi v čigavi pristojnosti bodo pokojninski sistem in položaj invalidov.
    note: >-
      The public broadcaster's report of the National Assembly sitting of 4 June 2026, cited
      for three things the gazette does not record: the vote (49 for, 30 against, 79 deputies
      present), that the ministers took the oath before the National Assembly and took over
      from the outgoing government on the same day as their appointment — which is what closes
      the question of this cabinet's start date — and the parliamentary objection that the
      reorganisation left it unclear who is now responsible for the pension system, which is
      the disclosed weakness behind the social_security tag on the Ministry of Demography,
      Family and Social Affairs. Tier 3, and no counted ministry rests on it: it corroborates
      a date and records a dispute that the two statutes and the gazette decision already
      settle in outline. Note that this report calls the minister without portfolio "ministrica
      brez listnice", a colloquialism; the gazette's "brez resorja" is the form used here.

