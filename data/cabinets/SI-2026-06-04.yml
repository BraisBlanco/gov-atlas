# Slovenia — government structure of the 16th Government of the Republic of Slovenia.
#
# See docs/DATA-CONTRACT.md. Five things worth knowing before reading the list:
#
#   1. Slovenia enumerates its ministers by statute. Article 8(1) of the Zakon o Vladi
#      Republike Slovenije (ZVRS) says "V vladi so ministrice ali ministri ... za:" and
#      lists fourteen portfolios; article 9 adds that the number of ministries, their
#      competences and their organisation are fixed by statute. The count is therefore a
#      legal fact and cannot move without an act of the Državni zbor.
#   2. That article was rewritten seven weeks before this cabinet took office. The Zakon o
#      spremembah Zakona o Vladi Republike Slovenije (ZVRS-K), Uradni list RS št. 555/2026
#      of 7 May 2026, replaced the whole of article 8(1) and cut the list from twenty
#      portfolios to fourteen. The Zakon o državni upravi (ZDU-1) was then harmonised by
#      ZDU-1P, Uradni list RS št. 979/26 of 17 June 2026, which is where the fourteen
#      ministries get their formal names and their fields of activity.
#   3. Fourteen ministries, sixteen cabinet seats. The Prime Minister heads no ministry, and
#      one of the fifteen ministers is a minister without portfolio whose post article 8(2)
#      of the ZVRS makes mandatory.
#   4. Nobody holds two portfolios. Two ministers are also deputy prime ministers, which
#      under article 8(5) of the ZVRS is a function conferred on a serving minister and adds
#      neither a ministry nor a seat.
#   5. This cabinet followed a general election, and the election is the reason to check
#      rather than assume. Slovenia voted on 22 March 2026; Robert Golob's government lost
#      its majority; the Državni zbor elected Janez Janša Prime Minister on 22 May 2026 and
#      appointed his fifteen ministers on 4 June 2026, when they were sworn in and took
#      over. The previous cabinet is not the sitting one.

country: SI
cabinet_id: SI-2026-06-04

cabinet_name_original: 16. Vlada Republike Slovenije
cabinet_name_en: 16th Government of the Republic of Slovenia
cabinet_name_es: XVI Gobierno de la República de Eslovenia

head_of_government_title_original: Predsednik vlade
head_of_government_title_en: Prime Minister

took_office: 2026-06-04
left_office: null

methodology_notes:
  - en: >-
      14 ministries and 16 cabinet seats. The fourteen are exactly the portfolios listed in
      article 8(1) of the Zakon o Vladi Republike Slovenije as replaced by ZVRS-K, recorded
      here in the statute's own order, and each of the fourteen has a named article and a
      field of activity in the Zakon o državni upravi. The two seats that are not ministries
      are the Prime Minister, who heads no department, and the minister without portfolio for
      relations with Slovenians in neighbouring countries and around the world, whose post
      article 8(2) of the ZVRS makes obligatory. Slovenia's own arithmetic is published
      differently and both figures are correct: gov.si says "V 16. Vladi Republike
      Slovenije, ki jo vodi Janez Janša, je 15 ministrov" — fifteen ministers, which is the
      seat count minus the Prime Minister, and never a count of departments. This file
      publishes the two figures separately and never adds them.
    es: >-
      14 ministerios y 16 asientos en el gabinete. Los catorce son exactamente las carteras
      enumeradas en el artículo 8(1) de la Zakon o Vladi Republike Slovenije en su redacción
      dada por la ZVRS-K, recogidas aquí en el orden de la propia ley, y cada uno de los
      catorce tiene un artículo propio y un ámbito de actividad en la Zakon o državni upravi.
      Los dos asientos que no son ministerios son el del presidente del Gobierno, que no
      encabeza ningún departamento, y el de la ministra sin cartera para las relaciones con
      los eslovenos de los países vecinos y del resto del mundo, un cargo que el artículo
      8(2) de la ZVRS hace obligatorio. La aritmética que publica Eslovenia es distinta y
      ambas cifras son correctas: gov.si dice «V 16. Vladi Republike Slovenije, ki jo vodi
      Janez Janša, je 15 ministrov» —quince ministros—, que es el número de asientos menos el
      presidente del Gobierno, y nunca un recuento de departamentos. Este fichero publica las
      dos cifras por separado y nunca las suma.
  - en: >-
      Which cabinet is sitting, and why the question had to be asked. Slovenia held a
      National Assembly election on 22 March 2026 — the Državna volilna komisija records
      "Volitve v Državni zbor Republike Slovenije so bile v nedeljo, 22. marca 2026" — and
      the government that emerged is not the one that governed before it. Gibanje Svoboda
      finished first on votes (28,66 % against the SDS's 27,88 %) but the outgoing coalition
      lost its majority, and the cabinet recorded here is a right-of-centre coalition of SDS,
      Demokrati and the joint NSi–SLS–Fokus list, supported by Resni.ca and the two national
      community deputies. The sequence is documented act by act in the official gazette: the
      Državni zbor elected Janez Janša Prime Minister at its session of 22 May 2026 (Sklep o
      izvolitvi predsednika Vlade Republike Slovenije, Uradni list RS št. 715/2026) and
      appointed the fifteen ministers at its session of 4 June 2026 (Sklep o imenovanju
      ministric in ministrov, Uradni list RS št. 872/2026). 4 June 2026 is therefore the date
      this cabinet took office: article 11(3) of the ZVRS provides that a government is
      deemed to have entered office once more than two thirds of the ministers are appointed,
      excluding ministers without portfolio, and all fourteen portfolio ministers were
      appointed in that single vote, took the oath before the National Assembly the same day
      and took over from the outgoing government immediately afterwards. gov.si states the
      same date in as many words. The alternative reading — 22 May, when the Prime Minister
      alone was elected — is rejected because on that date the government had no ministers
      and the previous cabinet was still conducting current business.
    es: >-
      Qué gabinete está en funciones y por qué había que preguntarlo. Eslovenia celebró
      elecciones a la Asamblea Nacional el 22 de marzo de 2026 —la Državna volilna komisija
      recoge «Volitve v Državni zbor Republike Slovenije so bile v nedeljo, 22. marca
      2026»— y el gobierno resultante no es el que gobernaba antes. Gibanje Svoboda fue la
      lista más votada (28,66 % frente al 27,88 % del SDS), pero la coalición saliente perdió
      la mayoría, y el gabinete que aquí se recoge es una coalición de centro-derecha de SDS,
      Demokrati y la lista conjunta NSi–SLS–Fokus, con el apoyo de Resni.ca y los dos
      diputados de las comunidades nacionales. La secuencia está documentada acto por acto en
      el boletín oficial: la Asamblea Nacional eligió a Janez Janša presidente del Gobierno en
      su sesión del 22 de mayo de 2026 (Sklep o izvolitvi predsednika Vlade Republike
      Slovenije, Uradni list RS n.º 715/2026) y nombró a los quince ministros en su sesión del
      4 de junio de 2026 (Sklep o imenovanju ministric in ministrov, Uradni list RS n.º
      872/2026). El 4 de junio de 2026 es por tanto la fecha en que este gabinete tomó
      posesión: el artículo 11(3) de la ZVRS establece que se considera que el gobierno ha
      entrado en funciones cuando están nombrados más de dos tercios de los ministros, sin
      contar a los ministros sin cartera, y los catorce ministros con cartera fueron nombrados
      en esa única votación, juraron ante la Asamblea Nacional ese mismo día y recibieron los
      poderes del gobierno saliente inmediatamente después. gov.si da la misma fecha con todas
      las letras. Se descarta la lectura alternativa —el 22 de mayo, cuando se eligió sólo al
      presidente del Gobierno— porque en esa fecha el gobierno no tenía ministros y el
      gabinete anterior seguía despachando los asuntos corrientes.
  - en: >-
      Article 8(1) of the ZVRS lists ministers, not ministries, and that distinction does
      real work here. The statute reads "V vladi so ministrice ali ministri ... za: finance,
      gospodarstvo, delo in šport, ..." — fourteen portfolios, each naming a minister rather
      than a department. Article 9 sends the ministries themselves to another statute, the
      Zakon o državni upravi, whose section 4 gives each ministry an article of its own with
      its name in the heading and its fields of activity in the text. The `name_original`
      fields here are the ministry names from that statute, which are also the names the
      government publishes on gov.si; the ministerial portfolios are reproduced verbatim in
      the ZVRS quotation, so a reader can check that the two lists are the same fourteen in
      the same order. This is not a formality: between 4 June and 17 June 2026 the ministers
      were in office under the new article 8 while the ZDU-1 still carried the old
      twenty-ministry structure, and the ministries operated under the transitional provision
      of ZVRS-K, which named each renamed or merged body explicitly. ZDU-1P closed that gap
      on 17 June 2026, seven weeks before this file's access date, so no entity here needs a
      `valid_from` of its own.
    es: >-
      El artículo 8(1) de la ZVRS enumera ministros, no ministerios, y esa distinción hace
      aquí un trabajo real. La ley dice «V vladi so ministrice ali ministri ... za: finance,
      gospodarstvo, delo in šport, ...» —catorce carteras, cada una nombrando a un ministro y
      no a un departamento—. El artículo 9 remite los ministerios mismos a otra ley, la Zakon
      o državni upravi, cuya sección 4 da a cada ministerio un artículo propio con su nombre
      en el epígrafe y sus ámbitos de actividad en el texto. Los campos `name_original` de
      este fichero son los nombres de ministerio de esa ley, que son también los que el
      gobierno publica en gov.si; las carteras ministeriales se reproducen textualmente en la
      cita de la ZVRS, de modo que el lector puede comprobar que las dos listas son los mismos
      catorce en el mismo orden. No es una formalidad: entre el 4 y el 17 de junio de 2026 los
      ministros estuvieron en el cargo bajo el nuevo artículo 8 mientras la ZDU-1 conservaba
      todavía la estructura de veinte ministerios, y los ministerios funcionaron al amparo de
      la disposición transitoria de la ZVRS-K, que nombraba expresamente cada órgano
      renombrado o fusionado. La ZDU-1P cerró ese desfase el 17 de junio de 2026, siete
      semanas antes de la fecha de consulta de este fichero, así que ninguna entidad necesita
      aquí un `valid_from` propio.
  - en: >-
      What the reorganisation did, because it is the largest single change in this dataset and
      it moves policy areas rather than just names. ZVRS-K cut the government from twenty
      portfolios to fourteen, and the transitional provision of its article 2 sets out
      exactly which body continued as which. The Ministrstvo za notranje zadeve absorbed the
      whole of the abolished Ministrstvo za digitalno preobrazbo and the Ministrstvo za javno
      upravo (except local self-government) and became the Ministrstvo za notranje zadeve in
      javno upravo. The Ministrstvo za okolje, podnebje in energijo lost energy and sustainable
      mobility, absorbed the Ministrstvo za naravne vire in prostor and the housing side of the
      abolished Ministrstvo za solidarno prihodnost, and became the Ministrstvo za okolje in
      prostor. The Ministrstvo za infrastrukturo took energy and became the Ministrstvo za
      infrastrukturo in energetiko. The Ministrstvo za vzgojo in izobraževanje absorbed the
      Ministrstvo za visoko šolstvo, znanost in inovacije and became the Ministrstvo za
      izobraževanje, znanost in mladino. The Ministrstvo za gospodarstvo, turizem in šport took
      labour relations, employment and vocational training from the labour ministry and became
      the Ministrstvo za gospodarstvo, delo in šport. The Ministrstvo za delo, družino,
      socialne zadeve in enake možnosti lost exactly those areas, gained demography and the
      rest of the Ministrstvo za solidarno prihodnost, and became the Ministrstvo za
      demografijo, družino in socialne zadeve. The Ministrstvo za kohezijo in regionalni razvoj
      took local self-government and became the Ministrstvo za lokalno samoupravo, kohezijo in
      regionalni razvoj. The Ministrstvo za kmetijstvo, gozdarstvo in prehrano was renamed
      Ministrstvo za kmetijstvo with its field of activity unchanged. Six ministries — finance,
      health, justice, culture, defence, and foreign and European affairs — were untouched.
      Because this dataset publishes one cabinet per country and the previous cabinet is not
      in it, all of that is recorded here as background rather than as closed entities.
    es: >-
      Qué hizo la reorganización, porque es el mayor cambio individual de este conjunto de
      datos y mueve áreas de política y no sólo nombres. La ZVRS-K redujo el gobierno de
      veinte carteras a catorce, y la disposición transitoria de su artículo 2 establece
      exactamente qué órgano continuó como cuál. El Ministrstvo za notranje zadeve absorbió
      íntegramente el suprimido Ministrstvo za digitalno preobrazbo y el Ministrstvo za javno
      upravo (salvo el autogobierno local) y pasó a ser el Ministrstvo za notranje zadeve in
      javno upravo. El Ministrstvo za okolje, podnebje in energijo perdió la energía y la
      movilidad sostenible, absorbió el Ministrstvo za naravne vire in prostor y la parte de
      vivienda del suprimido Ministrstvo za solidarno prihodnost, y pasó a ser el Ministrstvo
      za okolje in prostor. El Ministrstvo za infrastrukturo se quedó con la energía y pasó a
      ser el Ministrstvo za infrastrukturo in energetiko. El Ministrstvo za vzgojo in
      izobraževanje absorbió el Ministrstvo za visoko šolstvo, znanost in inovacije y pasó a
      ser el Ministrstvo za izobraževanje, znanost in mladino. El Ministrstvo za gospodarstvo,
      turizem in šport tomó del ministerio de trabajo las relaciones laborales, el empleo y la
      formación profesional y pasó a ser el Ministrstvo za gospodarstvo, delo in šport. El
      Ministrstvo za delo, družino, socialne zadeve in enake možnosti perdió exactamente esas
      áreas, ganó la demografía y el resto del Ministrstvo za solidarno prihodnost, y pasó a
      ser el Ministrstvo za demografijo, družino in socialne zadeve. El Ministrstvo za kohezijo
      in regionalni razvoj tomó el autogobierno local y pasó a ser el Ministrstvo za lokalno
      samoupravo, kohezijo in regionalni razvoj. El Ministrstvo za kmetijstvo, gozdarstvo in
      prehrano se renombró Ministrstvo za kmetijstvo sin cambiar su ámbito de actividad. Seis
      ministerios —finanzas, sanidad, justicia, cultura, defensa y asuntos exteriores y
      europeos— quedaron intactos. Como este conjunto de datos publica un gabinete por país y
      el anterior no figura en él, todo lo anterior se recoge aquí como contexto y no como
      entidades cerradas.
  - en: >-
      Four bodies are recorded and not counted, for three different reasons. The Predsednik
      vlade is the office of the head of government: article 14 of the ZVRS gives the Prime
      Minister the direction of the government's work and no portfolio, and article 8(1) does
      not list one, so the post carries a cabinet seat and no ministry. The Urad Vlade
      Republike Slovenije za Slovence v zamejstvu in po svetu is headed by a minister without
      portfolio, which is why it carries a seat, but it is a vladna služba under article 25
      of the ZVRS and not a ministry: article 8(1) does not name it and the Zakon o državni
      upravi gives it no article. The Kabinet predsednika Vlade Republike Slovenije and the
      Generalni sekretariat Vlade Republike Slovenije are the two vladne službe that article
      25 of the ZVRS constitutes by name; both are headed by officials — a direktor appointed
      by the Prime Minister, and the generalni sekretar appointed by the government — who are
      not ministers and do not sit in the cabinet, so each is excluded as
      not_headed_by_minister and carries no seat. The remaining eleven vladne službe listed on
      gov.si (among them the Statistical Office, the intelligence agency, the Office for
      Legislation and the Office for National Minorities) are directorates of the same kind,
      are equally headed by directors, and are outside the perimeter of this file, which is
      the statutory list of ministers plus the bodies that carry a cabinet seat or that the
      ZVRS names as an organ of the government. Slovenia's državni sekretarji — up to two per
      ministry, three or four in the six largest under article 17 of the ZDU-1 — are junior
      appointees inside a counted ministry, hold no seat and are not recorded individually.
    es: >-
      Se registran cuatro órganos que no se cuentan, por tres motivos distintos. El Predsednik
      vlade es la oficina del jefe de gobierno: el artículo 14 de la ZVRS le atribuye la
      dirección del trabajo del gobierno y ninguna cartera, y el artículo 8(1) no enumera
      ninguna, así que el cargo lleva asiento en el gabinete y ningún ministerio. El Urad
      Vlade Republike Slovenije za Slovence v zamejstvu in po svetu lo dirige una ministra sin
      cartera, y de ahí que lleve asiento, pero es una vladna služba del artículo 25 de la
      ZVRS y no un ministerio: el artículo 8(1) no lo nombra y la Zakon o državni upravi no le
      dedica ningún artículo. El Kabinet predsednika Vlade Republike Slovenije y el Generalni
      sekretariat Vlade Republike Slovenije son las dos vladne službe que el artículo 25 de la
      ZVRS constituye por su nombre; a ambos los dirigen funcionarios —un direktor nombrado
      por el presidente del Gobierno y el generalni sekretar nombrado por el gobierno— que no
      son ministros y no tienen asiento en el gabinete, de modo que cada uno se excluye por
      not_headed_by_minister y no lleva asiento. Las once vladne službe restantes que enumera
      gov.si (entre ellas la oficina de estadística, la agencia de inteligencia, el servicio de
      legislación y la oficina para las nacionalidades) son direcciones de la misma naturaleza,
      están igualmente dirigidas por directores y quedan fuera del perímetro de este fichero,
      que es la lista legal de ministros más los órganos que llevan asiento en el gabinete o
      que la ZVRS nombra como órgano del gobierno. Los državni sekretarji eslovenos —hasta dos
      por ministerio, tres o cuatro en los seis mayores según el artículo 17 de la ZDU-1— son
      cargos subordinados dentro de un ministerio contado, no tienen asiento y no se registran
      uno a uno.
  - en: >-
      Names, and what "official" means here. The English name of every ministry, of the Prime
      Minister and of the three government bodies below is the Slovenian government's own,
      taken from the English edition of gov.si, and is marked name_en_provenance: official. One
      liberty is taken and disclosed: gov.si's English ministry index writes "Ministry of the
      Economy, Labour and Sport", "Ministry of the Environment and Spatial Planning" and
      "Ministry of the Interior and Public Administration" with a definite article that the
      other eleven do not carry, and those forms are reproduced exactly as published rather
      than regularised. The Slovene names are the statutory ones from section 4 of the Zakon o
      državni upravi, which gov.si also uses; note that the statute prints the ministry name in
      lower case inside a bracketed article heading — "(ministrstvo za finance)" — and that
      name_original follows the capitalisation the government and the ministries themselves
      use. No abbreviation is recorded for any Slovenian ministry: the reorganisation of May
      2026 renamed eight of the fourteen, neither the gazette nor gov.si publishes an official
      short form for the new names, and inventing one would be a fabrication of exactly the
      kind this dataset exists to avoid. Spanish names throughout are this project's renderings
      and are marked translated.
    es: >-
      Los nombres, y qué significa aquí «oficial». El nombre inglés de cada ministerio, del
      presidente del Gobierno y de los tres órganos gubernamentales que siguen es el del propio
      gobierno esloveno, tomado de la edición inglesa de gov.si, y lleva la marca
      name_en_provenance: official. Se toma y se declara una licencia: el índice inglés de
      ministerios de gov.si escribe «Ministry of the Economy, Labour and Sport», «Ministry of
      the Environment and Spatial Planning» y «Ministry of the Interior and Public
      Administration» con un artículo determinado que los otros once no llevan, y esas formas
      se reproducen tal como se publican y no se regularizan. Los nombres eslovenos son los
      legales de la sección 4 de la Zakon o državni upravi, que gov.si también usa; nótese que
      la ley imprime el nombre del ministerio en minúscula dentro de un epígrafe de artículo
      entre paréntesis —«(ministrstvo za finance)»— y que name_original sigue la mayúscula que
      usan el gobierno y los propios ministerios. No se registra abreviatura para ningún
      ministerio esloveno: la reorganización de mayo de 2026 renombró ocho de los catorce, ni
      el boletín oficial ni gov.si publican una forma corta oficial para los nuevos nombres, e
      inventarla sería exactamente la clase de fabricación que este conjunto de datos existe
      para evitar. Todos los nombres en español son traducciones de este proyecto y llevan la
      marca translated.
  - en: >-
      Ministerial titles are recorded in the generic masculine, which is a limitation of a
      structural dataset and not a statement about the officeholders. Slovene inflects the
      title for gender and the statute itself carries both forms — article 8(1) opens "V vladi
      so ministrice ali ministri (v nadaljnjem besedilu: ministri)", naming the feminine first
      and then adopting the masculine as the working term — and the gazette's appointment
      decision writes "za ministrico" for the six women in this cabinet. head_title_original
      follows the statute's own drafting convention and gives the masculine form of each
      portfolio title; the feminine "ministrica za ..." is equally correct and is the form
      Slovenian usage applies to the six women who currently hold these offices. This file
      records departments, not people.
    es: >-
      Los títulos ministeriales se recogen en masculino genérico, lo que es una limitación de un
      conjunto de datos estructural y no una afirmación sobre quienes ocupan los cargos. El
      esloveno flexiona el título por género y la propia ley recoge ambas formas —el artículo
      8(1) empieza «V vladi so ministrice ali ministri (v nadaljnjem besedilu: ministri)»,
      nombrando primero el femenino y adoptando después el masculino como término de trabajo— y
      el acuerdo de nombramiento publicado en el boletín escribe «za ministrico» para las seis
      mujeres de este gabinete. head_title_original sigue la convención de redacción de la propia
      ley y da la forma masculina de cada título de cartera; el femenino «ministrica za ...» es
      igualmente correcto y es la forma que el uso esloveno aplica a las seis mujeres que hoy
      ocupan estos cargos. Este fichero registra departamentos, no personas.
  - en: >-
      Three policy-area tags sit where a reader would not look for them, and all three are
      consequences of the May 2026 reorganisation. Digital government and telecommunications
      are tagged on the Ministry of the Interior and Public Administration: Slovenia abolished
      its Ministrstvo za digitalno preobrazbo and article 34 of the ZDU-1 now gives the
      interior ministry "informacijske družbe, elektronskih komunikacij, informatizacije
      državne uprave" and the state e-government portal. Labour is tagged on the Ministry of
      the Economy, Labour and Sport, not on the Ministry of Demography, Family and Social
      Affairs, because ZVRS-K moved employment relations, rights at work, employment and
      vocational training out of the social ministry by name. Civil protection is tagged on the
      Ministry of Defence, whose statutory field of activity includes the "sistema varstva
      pred naravnimi in drugimi nesrečami", and not on the interior ministry where most of this
      dataset's countries keep it. Housing and mining are on the Ministry of the Environment
      and Spatial Planning; energy is on the Ministry of Infrastructure and Energy and not on
      the environment ministry, which held it until May 2026.
    es: >-
      Tres etiquetas de área de política están donde un lector no las buscaría, y las tres son
      consecuencia de la reorganización de mayo de 2026. La digitalización y las
      telecomunicaciones se etiquetan en el Ministerio del Interior y Administración Pública:
      Eslovenia suprimió su Ministrstvo za digitalno preobrazbo y el artículo 34 de la ZDU-1
      atribuye ahora al ministerio del Interior «informacijske družbe, elektronskih komunikacij,
      informatizacije državne uprave» y el portal estatal de administración electrónica. El
      trabajo se etiqueta en el Ministerio de Economía, Trabajo y Deporte y no en el de
      Demografía, Familia y Asuntos Sociales, porque la ZVRS-K sacó del ministerio social, por
      su nombre, las relaciones laborales, los derechos derivados del trabajo, el empleo y la
      formación profesional. La protección civil se etiqueta en el Ministerio de Defensa, cuyo
      ámbito legal de actividad incluye el «sistema varstva pred naravnimi in drugimi
      nesrečami», y no en el ministerio del Interior, donde la sitúan la mayoría de los países
      de este conjunto de datos. La vivienda y la minería están en el Ministerio de Medio
      Ambiente y Ordenación del Territorio; la energía está en el Ministerio de Infraestructuras
      y Energía y no en el de medio ambiente, que la tuvo hasta mayo de 2026.
  - en: >-
      One contested tag, disclosed rather than smoothed over. social_security is tagged on the
      Ministry of Demography, Family and Social Affairs even though neither article 8(1) of the
      ZVRS nor article 28 of the ZDU-1 mentions pensions, and the point was raised in the
      National Assembly during the confirmation debate: the leader of the Social Democrats'
      group said it was still unclear "v čigavi pristojnosti bodo pokojninski sistem in položaj
      invalidov". The tag rests on the transitional provision of ZVRS-K, which transfers to
      this ministry the whole field of activity of the former Ministrstvo za delo, družino,
      socialne zadeve in enake možnosti "razen delovnega področja delovnih razmerij, pravic iz
      dela, zaposlovanja in poklicnega usposabljanja" — everything except labour relations,
      rights at work, employment and vocational training. Pension and invalidity insurance sat
      with that ministry and are not among the excepted areas, so they follow the rest of the
      portfolio here. A curator reading article 28 alone could defensibly leave the tag off.
    es: >-
      Una etiqueta discutida, declarada en lugar de disimulada. social_security se etiqueta en
      el Ministerio de Demografía, Familia y Asuntos Sociales aunque ni el artículo 8(1) de la
      ZVRS ni el artículo 28 de la ZDU-1 mencionan las pensiones, y la cuestión se planteó en
      la Asamblea Nacional durante el debate de confirmación: la portavoz del grupo
      socialdemócrata dijo que seguía sin estar claro «v čigavi pristojnosti bodo pokojninski
      sistem in položaj invalidov». La etiqueta se apoya en la disposición transitoria de la
      ZVRS-K, que transfiere a este ministerio todo el ámbito de actividad del antiguo
      Ministrstvo za delo, družino, socialne zadeve in enake možnosti «razen delovnega področja
      delovnih razmerij, pravic iz dela, zaposlovanja in poklicnega usposabljanja» —todo salvo
      las relaciones laborales, los derechos derivados del trabajo, el empleo y la formación
      profesional—. El seguro de pensiones y de invalidez correspondía a ese ministerio y no
      figura entre las áreas exceptuadas, así que sigue aquí al resto de la cartera. Un curador
      que leyera sólo el artículo 28 podría dejar la etiqueta fuera con buenos argumentos.
  - en: >-
      Perimeter and evidence. This file describes the central government of the Republic of
      Slovenia, a unitary state with no federated or devolved tier: its municipalities are local
      self-government and out of scope, and the interior ministry's and cohesion ministry's
      responsibilities for public
      administration and local self-government are recorded as portfolios rather than as a tier
      of government. Every counted ministry rests on two statutes and a gazette publication, so
      the country grades A. The weakest link in the file is not the list but the addresses. The
      Pravno-informacijski sistem was rebuilt as a single-page application guarded by a
      proof-of-work challenge, so its consolidated-text pages archive as empty shells; the two
      consolidated statutes are therefore cited at the register's own PDF export of the same
      consolidated edition, whose filenames (ZAKO242_NPB19.pdf and ZAKO3225_NPB25.pdf) identify
      them, with the human-readable register page named in each source note. Slovenia also
      changed how it publishes its gazette on 1 March 2026: each publication now gets its own
      issue number and its own PDF, which is why the citations below read "Uradni list RS, št.
      555/2026" and "št. 872/2026" rather than the familiar year-based numbering, and why the
      consolidated ZVRS lists its latest amendment as "555/26".
    es: >-
      Perímetro y evidencia. Este fichero describe el gobierno central de la República de
      Eslovenia, un Estado unitario sin nivel federado ni autonómico: sus municipios son
      autogobierno local y quedan fuera
      de alcance, y las competencias del ministerio del Interior y del de cohesión sobre la
      administración pública y el autogobierno local se registran como carteras y no como un
      nivel de gobierno. Todos los ministerios contados se apoyan en dos leyes y en una
      publicación del boletín oficial, por lo que el país obtiene el grado A. El eslabón más
      débil del fichero no es la lista sino las direcciones. El Pravno-informacijski sistem se
      reconstruyó como una aplicación de página única protegida por un desafío de prueba de
      trabajo, de modo que sus páginas de texto consolidado se archivan como cáscaras vacías;
      las dos leyes consolidadas se citan por ello en la propia exportación en PDF del registro
      de la misma edición consolidada, cuyos nombres de archivo (ZAKO242_NPB19.pdf y
      ZAKO3225_NPB25.pdf) las identifican, indicando en la nota de cada fuente la página
      legible del registro. Eslovenia cambió además el 1 de marzo de 2026 la forma de publicar
      su boletín: cada publicación recibe ahora su propio número de edición y su propio PDF, y
      de ahí que las citas siguientes digan «Uradni list RS, št. 555/2026» y «št. 872/2026» en
      lugar de la numeración anual habitual, y que la ZVRS consolidada indique su última
      modificación como «555/26».

sources:
  - id: ul-555-2026-zvrs-k
    tier: 1
    type: official_gazette
    publisher: >-
      Uradni list Republike Slovenije (izdajatelj: Služba Vlade Republike Slovenije za
      zakonodajo)
    title: >-
      Zakon o spremembah Zakona o Vladi Republike Slovenije (ZVRS-K), Uradni list RS, št.
      555/2026 z dne 7. 5. 2026
    url: https://pisrs.si/api/uradni-list/objava/u20260555.pdf
    archive_url: https://web.archive.org/web/20260728102031/https://pisrs.si/api/uradni-list/objava/u20260555.pdf
    lang: sl
    published: 2026-05-07
    accessed: 2026-07-28
    quote: |-
      Zakon o spremembah Zakona o Vladi Republike Slovenije (ZVRS-K)
      1. člen
      V Zakonu o Vladi Republike Slovenije (Uradni list RS, št. 24/05 – uradno prečiščeno besedilo, 109/08, 38/10 – ZUKN, 8/12, 21/13, 47/13 – ZDU-1G, 65/14, 55/17, 163/22 in 57/25 – ZF) se v 8. členu prvi odstavek spremeni tako, da se glasi:
      »V vladi so ministrice ali ministri (v nadaljnjem besedilu: ministri) za:
      − finance,
      − gospodarstvo, delo in šport,
      − notranje zadeve in javno upravo,
      − infrastrukturo in energetiko,
      − izobraževanje, znanost in mladino,
      − zdravje,
      − okolje in prostor,
      − demografijo, družino in socialne zadeve,
      − pravosodje,
      − kmetijstvo,
      − kulturo,
      − lokalno samoupravo, kohezijo in regionalni razvoj,
      − obrambo,
      − zunanje in evropske zadeve.«.
      PREHODNI IN KONČNA DOLOČBA
      2. člen
      Zakon o državni upravi (Uradni list RS, št. 113/05 – uradno prečiščeno besedilo, 89/07 – odl. US, 126/07 – ZUP-E, 48/09, 8/10 – ZUP-G, 8/12 – ZVRS-F, 21/12, 47/13, 12/14, 90/14, 51/16, 36/21, 82/21, 189/21, 153/22, 18/23 in 83/25 – ZOUL; v nadaljnjem besedilu: Zakon o državni upravi) se uskladi z določbami tega zakona najkasneje v dveh mesecih od dne, ko prisežejo ministri, imenovani po tem zakonu.
      Z dnem, ko prisežejo pristojni ministri, pa do dne uveljavitve Zakona o državni upravi iz prejšnjega odstavka nadaljujejo z delom kot isti proračunski uporabnik:
      − Ministrstvo za notranje zadeve kot Ministrstvo za notranje zadeve in javno upravo z delovnim področjem Ministrstva za notranje zadeve, kot ga določa 34. člen Zakona o državni upravi, delovnim področjem Ministrstva za digitalno preobrazbo, kot ga določa 28.a člen Zakona o državni upravi in delovnim področjem Ministrstva za javno upravo, kot ga določa 34.a člen Zakona o državni upravi, razen delovnega področja lokalne samouprave,
      − Ministrstvo za okolje, podnebje in energijo kot Ministrstvo za okolje in prostor z delovnim področjem Ministrstva za okolje, podnebje in energijo, kot ga določa 38.b člen Zakona o državni upravi, razen delovnega področja energetike, oskrbe z naftnimi derivati in infrastrukture za alternativna goriva v prometu ter trajnostne mobilnosti, celostnega prometnega načrtovanja in javnega potniškega prometa v notranjem in čezmejnem prometu, delovnim področjem Ministrstva za naravne vire in prostor, kot ga določa 38.a člen Zakona o državni upravi in delom delovnega področja Ministrstva za solidarno prihodnost, ki se nanaša na stanovanjsko politiko,
      − Ministrstvo za infrastrukturo kot Ministrstvo za infrastrukturo in energetiko z delovnim področjem Ministrstva za infrastrukturo, kot ga določa iz 38. člen Zakona o državni upravi in delom delovnega področja Ministrstva za okolje, podnebje in energijo, ki se nanaša na energetiko, oskrbo z naftnimi derivati in infrastrukturo za alternativna goriva v prometu, trajnostno mobilnost, celostno prometno načrtovanje in javni potniški promet v notranjem in čezmejnem prometu,
      − Ministrstvo za vzgojo in izobraževanje kot Ministrstvo za izobraževanje, znanost in mladino z delovnim področjem Ministrstva za vzgojo in izobraževanje, kot ga določa 39. člen Zakona o državni upravi in delovnim področjem Ministrstva za visoko šolstvo znanost in inovacije, kot ga določa 38.č člen Zakona o državni upravi,
      − Ministrstvo za gospodarstvo, turizem in šport kot Ministrstvo za gospodarstvo, delo in šport z delovnim področjem Ministrstva za gospodarstvo, turizem in šport, kot ga določa 30. člen Zakona o državni upravi in delom delovnega področja Ministrstva za delo, družino, socialne zadeve in enake možnosti, ki se nanaša na delovna razmerja in pravice iz dela, zaposlovanje in poklicno usposabljanje,
      − Ministrstvo za kmetijstvo, gozdarstvo in prehrano kot Ministrstvo za kmetijstvo z delovnim področjem Ministrstva za kmetijstvo, gozdarstvo in prehrano, kot ga določa 32. člen Zakona o državni upravi,
      − Ministrstvo za delo, družino, socialne zadeve in enake možnosti kot Ministrstvo za demografijo, družino in socialne zadeve z delovnim področjem demografije, delovnim področjem Ministrstva za delo, družno, socialne zadeve in enake možnosti, kot ga določa 28. člen Zakona o državni upravi, razen delovnega področja delovnih razmerij, pravic iz dela, zaposlovanja in poklicnega usposabljanja, in delovnim področjem Ministrstva za solidarno prihodnost iz 38.c člena Zakona o državni upravi, razen delovnega področja stanovanjske politike,
      − Ministrstvo za kohezijo in regionalni razvoj kot Ministrstvo za lokalno samoupravo, kohezijo in regionalni razvoj z delovnim področjem Ministrstva za kohezijo in regionalni razvoj, kot ga določa 32.b člen Zakona o državni upravi in delom delovnega področja Ministrstva za javno upravo, ki se nanaša na lokalno samoupravo.
      4. člen
      Ta zakon začne veljati naslednji dan po objavi v Uradnem listu Republike Slovenije.
    note: >-
      The enumerating instrument. Article 1 replaces the whole of the first paragraph of
      article 8 of the ZVRS, which is where Slovenia lists the members of its government by
      portfolio, and the fourteen dashes in that paragraph are the fourteen ministries counted
      in this file. The act was passed by the Državni zbor on 29 April 2026, promulgated by
      President Nataša Pirc Musar on 7 May 2026, published the same day and, under its article
      4, entered into force on 8 May 2026 — four weeks before this cabinet was appointed, which
      is what makes the new structure the one the incoming ministers were confirmed into. The
      quotation also reproduces the whole of the transitional provision in article 2, because it
      is the only instrument that says which former ministry continued as which new one, and it
      is the evidence behind the reorganisation and the labour and pensions notes above. Two
      flaws in the official text are reproduced as printed rather than silently corrected: "kot
      ga določa iz 38. člen" in the infrastructure dash, and "Ministrstva za delo, družno,
      socialne zadeve" for "družino" in the demography dash. Article 3 of the act, on budget
      appropriations, is omitted from the quotation as immaterial to the count. Slovenia
      switched to per-publication gazette numbering on 1 March 2026, so this act's reference is
      issue 555/2026 rather than a conventional year issue; its item identifier is 2026-01-1215
      and its EPA number 33-X.

  - id: pisrs-zvrs-npb19
    tier: 1
    type: statute
    publisher: >-
      Republika Slovenija — Pravno-informacijski sistem (PISRS), Služba Vlade Republike
      Slovenije za zakonodajo
    title: >-
      Zakon o Vladi Republike Slovenije (ZVRS), neuradno prečiščeno besedilo št. 19
    url: https://pisrs.si/api/datoteke/integracije/556825123
    archive_url: https://web.archive.org/web/20260728102429/https://pisrs.si/api/datoteke/integracije/556825123
    lang: sl
    published: 2026-05-08
    accessed: 2026-07-28
    quote: |-
      8. člen
      V vladi so ministrice ali ministri (v nadaljnjem besedilu: ministri) za:
      - finance,
      - gospodarstvo, delo in šport,
      - notranje zadeve in javno upravo,
      - infrastrukturo in energetiko,
      - izobraževanje, znanost in mladino,
      - zdravje,
      - okolje in prostor,
      - demografijo, družino in socialne zadeve,
      - pravosodje,
      - kmetijstvo,
      - kulturo,
      - lokalno samoupravo, kohezijo in regionalni razvoj,
      - obrambo,
      - zunanje in evropske zadeve.
      Vlada ima v skladu s prvim odstavkom 14. člena Zakona o odnosih Republike Slovenije s Slovenci zunaj njenih meja (Uradni list RS, št. 43/06 in 76/10) ministra brez resorja za področje odnosov med Republiko Slovenijo in avtohtono slovensko narodno skupnostjo v sosednjih državah ter med Republiko Slovenijo in Slovenci po svetu.
      Poleg ministra brez resorja iz prejšnjega odstavka ima lahko vlada največ dva ministra brez resorja, ki pomagata predsedniku vlade pri usklajevanju dela in opravljanju njegove funkcije v okviru danih pooblastil.
      Funkcijo podpredsednika vlade opravlja eden ali več ministrov, ki jih na predlog predsednika vlade imenuje vlada.
      9. člen
      Število ministrstev, njihove pristojnosti in organizacijo ministrstev ter drugih upravnih organov določa zakon.
      11. člen
      Šteje se, da je vlada nastopila funkcijo, če je imenovanih več kot dve tretjini ministrov, pri čemer se ne vštevajo ministri brez resorja.
      14. člen
      Predsednik vlade vodi in usmerja delo vlade, skrbi za enotnost politične in upravne usmeritve vlade, usklajuje delo ministrov, predstavlja vlado ter sklicuje in vodi njene seje.
      18. člen
      Minister v skladu s sprejeto politiko vodi in predstavlja ministrstvo, daje politične usmeritve za delo ministrstva in organov v njegovi sestavi, nadzoruje njihovo delo, izdaja predpise in druge akte iz pristojnosti ministrstva in organov v njegovi sestavi ter opravlja druge naloge, ki jih določa zakon ali drug predpis.
      25. člen
      Za organizacijsko, strokovno in drugo pomoč pri delovanju vlade in usklajevanju dela ministrstev lahko vlada ustanavlja vladne službe.
      Vladno službo vodi minister brez resorja, državni sekretar ali direktorica oziroma direktor (v nadaljevanju: direktor). Direktor vladne službe je odgovoren predsedniku vlade, ministru ali generalni sekretarki oziroma generalnemu sekretarju (v nadaljevanju: generalni sekretar) vlade.
      Kot vladna služba deluje tudi generalni sekretariat vlade. Generalni sekretariat vlade vodi generalni sekretar, ki ga imenuje in razreši vlada na predlog predsednika vlade.
      Kot vladna služba deluje tudi kabinet predsednika vlade. Če je predstojnik kabineta predsednika vlade direktor, ga imenuje in razreši predsednik vlade.
    note: >-
      The consolidated text of the Law on the Government, and the reason Slovenia's ministry
      count is a legal fact rather than a reading of a reorganisation decree: article 8(1)
      lists the portfolios and article 9 reserves the number of ministries, their competences
      and their organisation to statute. This is neuradno prečiščeno besedilo št. 19, the
      edition that incorporates ZVRS-K, and the register lists the act's amendments as
      "Uradni list RS, št. 24/05 – uradno prečiščeno besedilo, 109/08, 38/10 – ZUKN, 8/12,
      21/13, 47/13 – ZDU-1G, 65/14, 55/17, 163/22, 57/25 – ZF in 555/26"; 555/26 is ZVRS-K and
      is the most recent amendment as at the access date. The quotation takes, in the Act's
      own order, the whole of article 8 except its fourth paragraph on delegated coordination,
      article 9, the operative sentence of article 11(3) that fixes when a government enters
      office, article 14 on the Prime Minister's functions, article 18 on a minister's
      relation to a ministry, and the four paragraphs of article 25 that constitute the
      vladne službe and name the generalni sekretariat and the kabinet predsednika vlade.
      Two notes on the address. First, "neuradno prečiščeno besedilo" is styled unofficial and
      the register disclaims liability for it, but each of its constituent acts is a gazette
      publication and article 8(1) is quoted here identically from ZVRS-K itself, so nothing
      in this file rests on the consolidation alone. Second, the register serves this text
      through an Angular application guarded by a proof-of-work challenge, and its page
      https://pisrs.si/pregledPredpisa?id=ZAKO242 archives as an empty shell; the address
      cited is the "PDF" download offered on that page, which the register serves as
      ZAKO242_NPB19.pdf and which does archive with its text intact. The gazette's dashes are
      typeset with a minus sign and the register's with a hyphen; each is reproduced as its
      own source spells it.

