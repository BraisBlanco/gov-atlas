    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-finance/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        One of the six ministries the May 2026 reorganisation left completely untouched.
        Article 29 of the Zakon o državni upravi gives it macroeconomic policy and the
        coordination of structural reforms as well as the treasury, public accounting, the
        programme budget, the tax and customs system, public debt and state aid; only finance
        and budget are tagged, because Slovenia's economic-development portfolio sits with the
        Ministry of the Economy, Labour and Sport, and tagging economy here as well would make
        the comparison view report two economy ministries where there is one.
      es: >-
        Uno de los seis ministerios que la reorganización de mayo de 2026 dejó intactos por
        completo. El artículo 29 de la Zakon o državni upravi le atribuye la política
        macroeconómica y la coordinación de las reformas estructurales, además del tesoro, la
        contabilidad pública, el presupuesto por programas, el sistema fiscal y aduanero, la
        deuda pública y las ayudas de Estado; sólo se etiquetan finanzas y presupuesto, porque
        la cartera de desarrollo económico corresponde en Eslovenia al Ministerio de Economía,
        Trabajo y Deporte, y etiquetar también economy aquí haría que la vista comparativa
        informase de dos ministerios de economía donde hay uno.

  - id: SI-2026-gospodarstvo-delo-sport
    order: 2
    name_original: Ministrstvo za gospodarstvo, delo in šport
    abbreviation_original: null
    name_en: Ministry of the Economy, Labour and Sport
    name_es: Ministerio de Economía, Trabajo y Deporte
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Minister za gospodarstvo, delo in šport
    head_title_en: Minister of the Economy, Labour and Sport
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [economy, labour, sport, industry, trade, tourism, small_business, consumer_protection, vocational_training, space]
    counts_as_ministry: true
    url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-gospodarstvo-delo-in-sport/
    sources: [ul-555-2026-zvrs-k, pisrs-zvrs-npb19, pisrs-zdu-1-npb25, ul-872-2026-imenovanje-ministrov, gov-si-ministrstva, gov-si-ministries-en]
    note:
      en: >-
        The widest remit in the Slovenian cabinet, and the entity most likely to be tagged
        differently by another curator. It was the Ministrstvo za gospodarstvo, turizem in
        šport until May 2026, when ZVRS-K moved employment relations, rights at work,
        employment and vocational training into it from the labour ministry — which is why
        labour and vocational_training are tagged here and not on the Ministry of Demography,
        Family and Social Affairs, and why the opposition attacked the merger of the economy
        and labour portfolios during the confirmation debate. Article 30 of the Zakon o državni
        upravi also gives it tourism (Slovenia has no tourism ministry), competition and
        consumer protection, trade policy, small business and crafts, company law, intellectual
        property, metrology, postal services, state commodity reserves, and space — the only
        home in this cabinet for space policy, which is why an eleventh-hour reader may find
        that tag surprising. Sport is here rather than with education, except for the physical
        education of children and young people delivered inside school programmes, which the
        statute expressly carves out for the education ministry.
      es: >-
        La cartera más amplia del gabinete esloveno y la entidad que otro curador etiquetaría
        con mayor probabilidad de forma distinta. Fue el Ministrstvo za gospodarstvo, turizem in
        šport hasta mayo de 2026, cuando la ZVRS-K le trasladó desde el ministerio de trabajo
        las relaciones laborales, los derechos derivados del trabajo, el empleo y la formación
        profesional —por eso labour y vocational_training se etiquetan aquí y no en el
        Ministerio de Demografía, Familia y Asuntos Sociales, y por eso la oposición atacó la
        fusión de las carteras de economía y trabajo en el debate de confirmación—. El artículo
        30 de la Zakon o državni upravi le atribuye además el turismo (Eslovenia no tiene
        ministerio de turismo), la competencia y la protección de los consumidores, la política
        comercial, las pymes y la artesanía, el derecho de sociedades, la propiedad intelectual,
        la metrología, los servicios postales, las reservas estatales de mercancías y el espacio
        —el único hogar de la política espacial en este gabinete, de ahí que esa etiqueta pueda
        sorprender—. El deporte está aquí y no en educación, salvo la educación física de niños
        y jóvenes impartida en los programas escolares, que la ley reserva expresamente al
        ministerio de educación.

