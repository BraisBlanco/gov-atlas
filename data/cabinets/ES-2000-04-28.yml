# Spain — government structure of the VII legislature (2000-2004).
#
# The only Spanish cabinet in this series with a minister without portfolio, which is why it
# is the only one whose seat count exceeds its department count by two rather than one. That
# post was abolished halfway through the term, so the seat figure changes on a date when the
# number of departments does not move at all — the mirror image of the reshuffles that change
# department names without changing the total.

country: ES
cabinet_id: ES-2000-04-28

cabinet_name_original: Gobierno de España, VII Legislatura
cabinet_name_en: Government of Spain, 7th legislature
cabinet_name_es: Gobierno de España, VII Legislatura

head_of_government_title_original: Presidente del Gobierno
head_of_government_title_en: Prime Minister

took_office: 2000-04-28
left_office: 2004-04-17

methodology_notes:
  - en: >-
      Fifteen ministerial departments, one more than the previous term. The restructuring
      split economy and finance into two departments and created a Ministry of Science and
      Technology, which took research from education, industry from industry and energy, and
      communications from public works.
    es: >-
      Quince departamentos ministeriales, uno más que la legislatura anterior. La
      reestructuración dividió Economía y Hacienda en dos departamentos y creó un Ministerio
      de Ciencia y Tecnología, que asumió la investigación de Educación, la industria de
      Industria y Energía y las comunicaciones de Fomento.
  - en: >-
      Seventeen seats against fifteen departments for the first two years, and sixteen
      afterwards. The gap is two rather than the usual one because alongside the Prime
      Minister this government had a minister without portfolio, the government spokesman,
      who sat in the Council of Ministers without heading a department. The post was
      abolished in the reshuffle of 9 July 2002 and the spokesman's role passed to the first
      vice-president, who was also Minister of the Presidency. From that date the seat count
      falls by one while the number of departments stays at fifteen.
    es: >-
      Diecisiete asientos frente a quince departamentos durante los dos primeros años, y
      dieciséis después. La diferencia es de dos y no de uno porque, junto al presidente del
      Gobierno, este Ejecutivo tuvo un ministro sin cartera, el portavoz, que formaba parte
      del Consejo de Ministros sin encabezar departamento alguno. El puesto se suprimió en la
      remodelación del 9 de julio de 2002 y la portavocía pasó al vicepresidente primero, que
      era además ministro de la Presidencia. Desde esa fecha los asientos bajan en uno
      mientras los departamentos siguen siendo quince.
  - en: >-
      Both vice-presidencies were held by serving ministers: the first vice-president also
      headed the Presidency department and the second, styled vice-president for economic
      affairs, headed the economy department. Neither adds a department or a seat.
    es: >-
      Las dos vicepresidencias las ostentaron ministros en ejercicio: el vicepresidente
      primero encabezaba además el departamento de la Presidencia y el segundo, con el título
      de vicepresidente para Asuntos Económicos, el de Economía. Ninguna añade departamento
      ni asiento.

sources:
  - id: boe-rd-557-2000
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 557/2000, de 27 de abril, de reestructuración de los Departamentos
      ministeriales
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2000-7860
    archive_url: https://web.archive.org/web/20230607224455/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2000-7860
    lang: es
    published: 2000-04-28
    accessed: 2026-07-29
    quote: |-
      Artículo 1.
      La Administración General del Estado queda estructurada en los siguientes Departamentos ministeriales:
      Ministerio de Asuntos Exteriores.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Hacienda.
      Ministerio del Interior.
      Ministerio de Fomento.
      Ministerio de Educación, Cultura y Deporte.
      Ministerio de Trabajo y Asuntos Sociales.
      Ministerio de Agricultura, Pesca y Alimentación.
      Ministerio de la Presidencia.
      Ministerio de Administraciones Públicas.
      Ministerio de Sanidad y Consumo.
      Ministerio de Medio Ambiente.
      Ministerio de Economía.
      Ministerio de Ciencia y Tecnología.
    note: >-
      The text as published, in force the same day. Articles 4 and 5 are what settle where
      the responsibilities of the two abolished departments went: trade, tourism, energy and
      mining to the economy department, and research, industry and communications to science
      and technology.

  - id: boe-rd-561-2000
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 561/2000, de 27 de abril, por el que se nombran Ministros del Gobierno
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2000-7864
    archive_url: https://web.archive.org/web/20250124022819/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2000-7864
    lang: es
    published: 2000-04-28
    accessed: 2026-07-29
    quote: |-
      Ministro de la Presidencia a don Mariano Rajoy Brey.
      Ministro de Administraciones Públicas a don Jesús Posada Moreno.
      Ministra de Sanidad y Consumo a doña Celia Villalobos Talero.
      Ministro de Medio Ambiente a don Jaime Matas i Palou.
      Ministro de Economía a don Rodrigo de Rato y Figaredo.
      Ministra de Ciencia y Tecnología a doña Anna María Birulés Bertrán.
      Ministro Portavoz del Gobierno, sin cartera, a don Pío Cabanillas Alonso.
    note: >-
      Sixteen ministers for fifteen departments. The quote is the closing part of the list,
      which is where the difference shows: the last appointment is expressly without a
      portfolio. It also shows the two vice-presidents appointed the same day heading the
      Presidency and the economy departments.

  - id: boe-rd-669-2002
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 669/2002, de 9 de julio, por el que se dispone el cese de don Pío
      Cabanillas Alonso como Ministro Portavoz del Gobierno, sin cartera
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2002-13572
    archive_url: https://web.archive.org/web/20250123224451/https://boe.es/diario_boe/txt.php?id=BOE-A-2002-13572
    lang: es
    published: 2002-07-10
    accessed: 2026-07-29
    quote: >-
      Vengo en disponer el cese de don Pío Cabanillas Alonso como Ministro Portavoz del
      Gobierno, sin cartera, agradeciéndole los servicios prestados.
    note: >-
      Ends the only ministerial post in this series held without a portfolio. No replacement
      was appointed to it; a decree of the same date gave the spokesman's role to the first
      vice-president, who already headed the Presidency department.

  - id: boe-ley-50-1997
    tier: 1
    type: statute
    publisher: Boletín Oficial del Estado
    title: Ley 50/1997, de 27 de noviembre, del Gobierno (texto consolidado)
    url: https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    archive_url: https://web.archive.org/web/20260716135650/https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    lang: es
    published: 1997-11-28
    accessed: 2026-07-29
    quote: >-
      El Gobierno se compone del Presidente, del Vicepresidente o Vicepresidentes, en su
      caso, y de los Ministros.
    note: >-
      Cited for the composition of the Government, which is what makes the Prime Minister's
      seat a matter of statute rather than of interpretation. It also puts ministers without
      portfolio in the Government on the same footing as departmental ones, which is why the
      spokesman counts as a seat and not as a department.

