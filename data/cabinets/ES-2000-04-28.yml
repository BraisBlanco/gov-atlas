        department. The only period in this series when energy sits with economic policy
        rather than with industry or the environment.
      es: >-
        La política económica, el comercio, el turismo y las pymes del antiguo Economía y
        Hacienda, más la energía y las minas del suprimido Industria y Energía. El único
        periodo de esta serie en que la energía acompaña a la política económica y no a la
        industria o al medio ambiente.

