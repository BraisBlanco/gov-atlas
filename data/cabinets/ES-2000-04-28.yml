  - id: ES-2000-portavoz-sin-cartera
    order: 16
    name_original: Ministro Portavoz del Gobierno, sin cartera
    abbreviation_original: null
    name_en: Minister and Government Spokesman, without portfolio
    name_es: Ministro Portavoz del Gobierno, sin cartera
    name_en_provenance: translated
    name_es_provenance: official
    head_title_original: Ministro
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: minister_without_portfolio
    valid_to: 2002-07-09
    url: null
    sources: [boe-rd-561-2000, boe-rd-669-2002]
    note:
      en: >-
        A member of the Council of Ministers with ministerial rank but no department, so it
        adds a seat and not a ministry. The appointing decree says "sin cartera" in as many
        words. Abolished on 9 July 2002 without a replacement, which is the only point in
        this series where the seat count moves and the department count does not.
      es: >-
        Miembro del Consejo de Ministros con rango ministerial pero sin departamento, por lo
        que añade un asiento y no un ministerio. El decreto de nombramiento dice «sin
        cartera» con esas palabras. Se suprimió el 9 de julio de 2002 sin sustituto, y es el
        único punto de esta serie en que se mueven los asientos y no los departamentos.

