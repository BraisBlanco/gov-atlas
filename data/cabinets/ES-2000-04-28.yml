    url: null
    sources: [boe-rd-557-2000]
    note:
      en: >-
        Created in this restructuring out of three sources: research from education,
        industrial policy from the abolished industry and energy department, and
        communications from public works. Abolished in 2004, when industry and
        telecommunications went to a new industry, tourism and trade department and research
        returned to education.
      es: >-
        Creado en esta reestructuración a partir de tres procedencias: la investigación de
        Educación, la política industrial del suprimido Industria y Energía y las
        comunicaciones de Fomento. Se suprimió en 2004, cuando la industria y las
        telecomunicaciones pasaron a un nuevo Industria, Turismo y Comercio y la
        investigación volvió a Educación.

