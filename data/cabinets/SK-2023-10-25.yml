    policy_areas: [environment, water, climate]
    counts_as_ministry: true
    url: https://www.minzp.sk
    sources: [slovlex-575-2001]
    note:
      en: >-
        Climate is tagged because § 16(c) gives this ministry the protection of the air, the
        ozone layer and the climate system of the Earth; Slovakia has no climate ministry, and
        energy policy sits with the Ministry of Economy. Water is tagged for § 16(b), water
        management, flood protection and the quality and quantity of water. It also holds
        geological survey and exploration under § 16(h), which is the geology half of the
        taxonomy's single mining-and-geology id; that id is tagged on the Ministry of Economy,
        which holds extraction and the supervision of mineral deposits, and the methodology notes
        record the choice. Its minister has held a vice-premiership throughout this cabinet,
        which adds neither a ministry nor a seat.
      es: >-
        Se etiqueta clima porque el § 16(c) atribuye a este ministerio la protección del aire, de
        la capa de ozono y del sistema climático de la Tierra; Eslovaquia no tiene ministerio de
        clima, y la política energética está en el Ministerio de Economía. Se etiqueta agua por
        el § 16(b), gestión del agua, protección contra inundaciones y calidad y cantidad de las
        aguas. También tiene la investigación y prospección geológica conforme al § 16(h), que es
        la mitad geológica del único id de minería y geología de la taxonomía; ese id se etiqueta
        en el Ministerio de Economía, que tiene la extracción y la supervisión de los yacimientos,
        y las notas metodológicas recogen la decisión. Su titular ha ostentado una vicepresidencia
        durante todo este gabinete, lo que no añade ni ministerio ni asiento.

