        Fisheries is tagged for this ministry and not for the Ministry of the Environment because
        § 9(1)(h) gives it fisheries "v oblasti akvakultúry a morského rybolovu" — aquaculture and
        sea fishing — while § 16(b) gives the environment ministry inland fisheries other than
        those. The split is real and is recorded on both entities rather than resolved.
      es: >-
        La pesca se etiqueta en este ministerio y no en el de Medio Ambiente porque el § 9(1)(h)
        le atribuye la pesca «v oblasti akvakultúry a morského rybolovu» —acuicultura y pesca
        marítima—, mientras que el § 16(b) atribuye al ministerio de medio ambiente la pesca
        continental restante. El reparto es real y se recoge en ambas entidades en lugar de
        resolverse.

