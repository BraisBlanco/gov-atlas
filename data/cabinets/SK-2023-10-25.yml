      Čl. 109
      (1) Vláda sa skladá z predsedu, podpredsedov a ministrov.
      Čl. 110
      (1) Predsedu vlády vymenúva a odvoláva prezident Slovenskej republiky.
      Čl. 111
      Na návrh predsedu vlády prezident Slovenskej republiky vymenuje a odvolá ďalších členov vlády a poverí ich riadením ministerstiev. Za podpredsedu vlády a ministra môže vymenovať občana, ktorý je voliteľný za poslanca Národnej rady Slovenskej republiky.
      Čl. 116
      (2) Člen vlády môže podať demisiu prezidentovi Slovenskej republiky.
      (7) Ak prijme prezident Slovenskej republiky demisiu alebo ak odvolá člena vlády, určí, ktorý z členov vlády bude dočasne spravovať veci člena vlády, ktorého demisiu prijal.
    note: >-
      Cited for the composition of the government, which is what makes the Prime Minister's seat
      a matter of constitutional law rather than of our interpretation, and therefore why
      cabinet_seats_count is 16 while ministries_count is 15; for article 111, which shows that
      the President appoints members of the government and entrusts them with the direction of
      ministries as two separate acts, so a deputy prime minister may exist without a ministry;
      and for article 116(7), which is the provision the President applied on 19 November 2025
      when he designated a serving minister to administer the departed deputy prime minister's
      affairs — an act that leaves the number of people in the cabinet one lower rather than
      unchanged. Consolidated text as published by Slov-Lex, version in force from 1 November
      2025, which is the newest; none of the quoted articles has been amended since 1993. The
      `.portal` view of the static mirror was archived because the ordinary static view and the
      print view both exceeded the archive's capture limit; all three carry the same text. Letters
      and paragraph numbers are printed by Slov-Lex on their own lines and are joined to their
      text here; the quotation is otherwise verbatim, and omits the paragraphs of articles 109 and
      116 that are not relied on.

