      V stredu 25. októbra 2023 prezidentka SR Zuzana Čaputová vymenovala Roberta Fica do funkcie predsedu vlády, dekrét o vymenovaní si prevzali aj ostatní členovia vlády.
      Zoznam členov novej vlády:
      Robert Fico, predseda vlády SR
      Robert Kaliňák, podpredseda vlády SR a minister obrany SR
      Denisa Saková, podpredsedníčka vlády SR a ministerka hospodárstva SR
      Tomáša Taraba, podpredseda vlády SR a minister životného prostredia SR
      Peter Kmec, podpredseda vlády SR pre Plán obnovy a odolnosti a využívanie eurofondov
      Ladislav Kamenický, minister financií SR
      Jozef Ráž, minister dopravy SR
      Richard Takáč, minister pôdohospodárstva a rozvoja vidieka SR
      Richard Raši, minister investícií, regionálneho rozvoja a informatizácie SR
      Matúš Šutaj Eštok, minister vnútra SR
      Boris Susko, minister spravodlivosti SR
      Juraj Blanár, minister zahraničných vecí a európskych záležitostí SR
      Erik Tomáš, minister práce, sociálnych vecí a rodiny SR
      Tomáš Drucker, minister školstva, vedy, výskumu a športu SR
      Martina Šimkovičová, ministerka kultúry SR
      Zuzana Dolinková, ministerka zdravotníctva SR
    note: >-
      The Government Office's own notice of the appointment ceremony, quoted in full because it
      settles three things at once. The date: 25 October 2023, which is this cabinet's
      `took_office`, the day the Prime Minister was appointed and the other members received
      their decrees. The perimeter at that date: sixteen people — one predseda vlády, four
      podpredsedovia vlády of whom three also head a ministry, and eleven further ministers —
      against the fourteen ministries § 3 then listed, which is where the appointment-day figures
      in the methodology notes come from. And the original title of the portfolio-less
      vice-premiership, "podpredseda vlády SR pre Plán obnovy a odolnosti a využívanie
      eurofondov", renamed on 20 December 2024. Tier 2 rather than tier 1: a Slovak appointment
      is made by presidential decree handed to the appointee and is not published in the Zbierka
      zákonov, so no gazette instrument exists to cite. The page runs the members' names together
      with long runs of trailing spaces, which are collapsed here; the wording, including
      "Tomáša Taraba" in the accusative where the rest of the list is nominative, is the page's
      own. The snapshot was created on the access date.

