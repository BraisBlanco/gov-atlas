# Slovakia — government structure of the cabinet appointed on 25 October 2023 (Robert Fico's
# fourth government).
#
# See docs/DATA-CONTRACT.md. Five things worth knowing before reading the list:
#
#   1. Slovakia enumerates its ministries in a statute and does it plainly. § 3 of zákon
#      č. 575/2001 Z. z. o organizácii činnosti vlády a organizácii ústrednej štátnej správy —
#      the kompetenčný zákon — lists them a) to o) and says of them "na ktorých čele je člen
#      vlády". Creating, abolishing or renaming a Slovak ministry means amending that section,
#      so the count is a legal fact rather than a reading of a reorganisation decree.
#   2. The same statute then lists, in § 21, twelve "ostatné ústredné orgány štátnej správy".
#      Those are central authorities, not ministries. Two of them are recorded here because a
#      source presents them at cabinet level; the other ten are named in the methodology notes
#      and left out of scope.
#   3. Fifteen ministries, sixteen cabinet seats. The gap is the Prime Minister, who heads no
#      ministry.
#   4. This cabinet's structure changed mid-term. It was appointed with fourteen ministries; a
#      fifteenth was created and one renamed on 1 February 2024. The superseded entity is kept
#      with `valid_to` set instead of being back-edited, so any date in the term replays.
#   5. It also lost a cabinet seat mid-term. A fourth deputy prime minister, holding no
#      ministry, sat in it until 19 November 2025 and the post has been vacant since.

country: SK
cabinet_id: SK-2023-10-25

cabinet_name_original: Vláda Slovenskej republiky vymenovaná 25. októbra 2023
cabinet_name_en: Fico's fourth cabinet
cabinet_name_es: Cuarto Gobierno de Robert Fico

head_of_government_title_original: predseda vlády Slovenskej republiky
head_of_government_title_en: Prime Minister

took_office: 2023-10-25
left_office: null

methodology_notes:
  - en: >-
      15 ministries and 16 cabinet seats. The fifteen are the ministries enumerated in § 3 of
      zákon č. 575/2001 Z. z.; the sixteenth seat is the predseda vlády, who heads none of them.
      The statute is explicit about the difference: § 3 lists the ministries "na ktorých čele je
      člen vlády" — at the head of which stands a member of the government — and the Prime
      Minister is not at the head of any of them, while article 109(1) of the Constitution says
      the government "sa skladá z predsedu, podpredsedov a ministrov", so his seat is a matter of
      constitutional law rather than of our interpretation. The two figures are never added
      together.
    es: >-
      15 ministerios y 16 asientos en el gabinete. Los quince son los ministerios que enumera el
      § 3 de la zákon č. 575/2001 Z. z.; el decimosexto asiento es el del predseda vlády, que no
      encabeza ninguno de ellos. La ley es explícita al respecto: el § 3 enumera los ministerios
      «na ktorých čele je člen vlády» —a cuya cabeza está un miembro del gobierno— y el primer
      ministro no encabeza ninguno, mientras que el artículo 109(1) de la Constitución dice que
      el gobierno «sa skladá z predsedu, podpredsedov a ministrov», de modo que su asiento es
      una cuestión de derecho constitucional y no de nuestra interpretación. Las dos cifras nunca
      se suman.
  - en: >-
      Deputy prime ministers, and why they add up to almost nothing here. This cabinet was
      appointed with four podpredsedovia vlády. Three of them — for defence, for the economy and
      for the environment — also head a ministry and are counted once, through that ministry: a
      Slovak vice-premiership is a personal rank attached to a member of the government, not a
      department, and § 3 does not list one. The fourth held no ministry, and that seat is
      recorded separately below. It is the reason the cabinet had 17 seats from 25 October 2023
      to 19 November 2025 and has 16 since.
    es: >-
      Los viceprimeros ministros, y por qué aquí casi no suman nada. Este gabinete se nombró con
      cuatro podpredsedovia vlády. Tres de ellos —de defensa, de economía y de medio ambiente—
      encabezan además un ministerio y se cuentan una sola vez, a través de ese ministerio: una
      vicepresidencia eslovaca es un rango personal adscrito a un miembro del gobierno, no un
      departamento, y el § 3 no la enumera. El cuarto no tenía ministerio, y ese asiento se
      registra aparte más abajo. Es la razón por la que el gabinete tuvo 17 asientos del 25 de
      octubre de 2023 al 19 de noviembre de 2025 y tiene 16 desde entonces.
  - en: >-
      The vacant fourth vice-premiership, and why nobody replaced the seat. The podpredseda vlády
      Slovenskej republiky pre Plán obnovy a znalostnú ekonomiku — a deputy prime minister with
      no ministry, responsible for the EU Recovery and Resilience Plan — resigned on 19 November
      2025, when the President accepted his resignation and, under article 116(7) of the
      Constitution, "určí, ktorý z členov vlády bude dočasne spravovať veci člena vlády, ktorého
      demisiu prijal", designated the minister of education to administer the agenda temporarily.
      A minister administering a departed colleague's affairs is still one person in one seat, so
      the arrangement removed a seat rather than moving one. No successor had been appointed by
      the date this page records: the President's own register of appointments and dismissals
      lists no vymenovanie to the post after 19 November 2025. The post itself was renamed on
      20 December 2024 — until then it was the podpredseda vlády Slovenskej republiky pre Plán
      obnovy a odolnosti a využívanie eurofondov, the title under which it appears in the
      appointment notice of 25 October 2023 — and the entity below records the seat across both
      names rather than splitting it, because a rename of a portfolio-less vice-premiership moves
      neither figure this project publishes.
    es: >-
      La cuarta vicepresidencia vacante, y por qué nadie sustituyó el asiento. El podpredseda
      vlády Slovenskej republiky pre Plán obnovy a znalostnú ekonomiku —un viceprimer ministro
      sin ministerio, responsable del Plan de Recuperación y Resiliencia de la UE— dimitió el 19
      de noviembre de 2025, cuando el presidente aceptó su dimisión y, conforme al artículo
      116(7) de la Constitución, «určí, ktorý z členov vlády bude dočasne spravovať veci člena
      vlády, ktorého demisiu prijal», designó al ministro de educación para administrar
      temporalmente la agenda. Un ministro que administra los asuntos de un colega que se ha ido
      sigue siendo una persona en un asiento, de modo que el arreglo eliminó un asiento en vez de
      trasladarlo. No se había nombrado sucesor a la fecha que registra esta ficha: el propio
      registro presidencial de nombramientos y ceses no recoge ningún vymenovanie al cargo
      después del 19 de noviembre de 2025. El cargo se renombró el 20 de diciembre de 2024
      —hasta entonces era el podpredseda vlády Slovenskej republiky pre Plán obnovy a odolnosti a
      využívanie eurofondov, título con el que aparece en el aviso de nombramiento del 25 de
      octubre de 2023— y la entidad de más abajo registra el asiento con ambos nombres sin
      escindirlo, porque el cambio de nombre de una vicepresidencia sin cartera no mueve ninguna
      de las dos cifras que publica este proyecto.
  - en: >-
      What changed mid-term, and why the appointment-day figures were different. When the
      President appointed this cabinet on 25 October 2023 the statute listed fourteen ministries
      and the government had sixteen members: one prime minister, four deputy prime ministers
      (three of them heading a ministry) and eleven further ministers. Zákon č. 7/2024 Z. z.,
      published on 25 January 2024 and in force from 1 February 2024, renamed the Ministerstvo
      školstva, vedy, výskumu a športu Slovenskej republiky to Ministerstvo školstva, výskumu,
      vývoja a mládeže Slovenskej republiky and added a fifteenth ministry, the Ministerstvo
      cestovného ruchu a športu Slovenskej republiky — moving sport out of the education
      portfolio in the process. Both entities are recorded with 1 February 2024 as their start
      date, and the ministry they replaced is kept below with 31 January 2024 as its end date
      rather than overwritten. Read that superseded entity carefully if you replay a date: under
      this project's rules it is recorded as not counted, as a department superseded during the
      term, so a replay of a date before 1 February 2024 yields 13 ministries and 15 seats rather
      than the 14 and 16 that were actually in place. The 14 and the 16 are the sourced figures,
      from § 3 as it stood in the version in force from 15 July 2023 and from the appointment
      notice of 25 October 2023; the figures this site publishes are the current ones, 15 and
      16. Nothing in § 3 has changed since 1 February 2024; the amendments in force from 1 July 2026 (zákon č. 86/2026 Z. z.), 10
      October 2025 and 30 June 2025 left the list of ministries and the list of central authorities
      untouched.
    es: >-
      Qué cambió a mitad de legislatura, y por qué las cifras del día del nombramiento eran
      distintas. Cuando el presidente nombró este gabinete el 25 de octubre de 2023 la ley
      enumeraba catorce ministerios y el gobierno tenía dieciséis miembros: un primer ministro,
      cuatro viceprimeros ministros (tres de ellos al frente de un ministerio) y once ministros
      más. La zákon č. 7/2024 Z. z., publicada el 25 de enero de 2024 y en vigor desde el 1 de
      febrero de 2024, renombró el Ministerstvo školstva, vedy, výskumu a športu Slovenskej
      republiky como Ministerstvo školstva, výskumu, vývoja a mládeže Slovenskej republiky y
      añadió un decimoquinto ministerio, el Ministerstvo cestovného ruchu a športu Slovenskej
      republiky, sacando el deporte de la cartera de educación. Ambas entidades se registran con
      el 1 de febrero de 2024 como fecha de inicio, y el ministerio al que sustituyen se conserva
      más abajo con el 31 de enero de 2024 como fecha de fin, en lugar de reescribirse. Lea con
      cuidado esa entidad sustituida si reconstruye una fecha: según las reglas de este proyecto
      se registra como no contada, como departamento sustituido durante la legislatura, de modo
      que la reconstrucción de una fecha anterior
      al 1 de febrero de 2024 arroja 13 ministerios y 15 asientos en lugar de los 14 y 16 que
      realmente había. El 14 y el 16 son las cifras con fuente, del § 3 en la versión en vigor
      desde el 15 de julio de 2023 y del aviso de nombramiento del 25 de octubre de 2023; las
      cifras que publica este sitio son las actuales, 15 y 16. Nada del § 3 ha cambiado
      desde el 1 de febrero de 2024; las modificaciones en vigor desde el 1 de julio de 2026
      (zákon č. 86/2026 Z. z.), el 10 de octubre de 2025 y el 30 de junio de 2025 no tocaron ni la
      lista de ministerios ni la de autoridades centrales.
  - en: >-
      The Úrad vlády Slovenskej republiky is recorded and not counted, and it is the entity that
      carries the Prime Minister's seat. The statute puts it outside the ministries twice over:
      it appears in § 21(1)(a) among the "ostatné ústredné orgány štátnej správy" rather than in
      § 3, and § 22(1) puts a vedúci at its head — a civil-service director appointed by the
      government and answerable to the Prime Minister — not a minister. What makes it the office
      of the head of government is § 1b: it discharges the professional, organisational and
      technical work of the government "aj pre predsedu vlády ako jeho výkonný orgán", as the
      Prime Minister's executive organ, and the government's own list of cabinet members is the
      one place that puts the Prime Minister and this office on the same line. Recording it as
      carrying a cabinet seat is therefore what makes the seat count come out at 16 against 15
      ministries. Treating it strictly as a § 21 authority headed by a non-minister would give
      15 seats and leave the Prime Minister out of the cabinet altogether.
    es: >-
      El Úrad vlády Slovenskej republiky se registra y no se cuenta, y es la entidad que lleva el
      asiento del primer ministro. La ley lo sitúa fuera de los ministerios por dos vías: aparece
      en el § 21(1)(a) entre los «ostatné ústredné orgány štátnej správy» y no en el § 3, y el
      § 22(1) pone a su cabeza un vedúci —un director de la función pública nombrado por el
      gobierno y responsable ante el primer ministro—, no un ministro. Lo que lo convierte en la
      oficina del jefe de gobierno es el § 1b: desempeña las tareas técnicas, organizativas y
      profesionales del gobierno «aj pre predsedu vlády ako jeho výkonný orgán», como órgano
      ejecutivo del primer ministro, y la propia lista gubernamental de miembros del gabinete es
      el único lugar que pone al primer ministro y a esta oficina en la misma línea. Registrarlo
      con asiento en el gabinete es, por tanto, lo que hace que los asientos sean 16 frente a
      15 ministerios. Tratarlo estrictamente como una autoridad del § 21 encabezada por un no
      ministro daría 15 asientos y dejaría al primer ministro fuera del gabinete.
  - en: >-
      What the § 21 list contains and what this page leaves out of scope. Besides the Úrad vlády
      and the Office of the Deputy Prime Minister for the Recovery Plan, § 21(1) of the same
      statute constitutes ten further central bodies of state administration: Protimonopolný úrad
      Slovenskej republiky, Štatistický úrad Slovenskej republiky, Úrad geodézie, kartografie a
      katastra Slovenskej republiky, Úrad jadrového dozoru Slovenskej republiky, Úrad pre
      normalizáciu, metrológiu a skúšobníctvo Slovenskej republiky, Úrad pre verejné obstarávanie,
      Úrad priemyselného vlastníctva Slovenskej republiky, Správa štátnych hmotných rezerv
      Slovenskej republiky, Národný bezpečnostný úrad and Úrad pre územné plánovanie a výstavbu
      Slovenskej republiky; § 21(2) gives the same status to the Úrad pre reguláciu sieťových
      odvetví and the Slovenská informačná služba. None of them is headed by a member of the
      government — § 22 gives them a predseda appointed by the government, or by the President or
      the National Council, and none of them appears on the government's list of cabinet members
      — so none is a ministry and none is cabinet-level. They are named here rather than recorded
      as entities, because a reader comparing this figure with a count of "central state
      administration bodies" will otherwise get 27 or 29 and have no way of seeing where the
      difference comes from.
    es: >-
      Qué contiene la lista del § 21 y qué deja esta ficha fuera de alcance. Además del Úrad
      vlády y de la Oficina del Vicepresidente del Gobierno para el Plan de Recuperación, el
      § 21(1) de la misma ley constituye diez órganos centrales más de la administración estatal:
      Protimonopolný úrad Slovenskej republiky, Štatistický úrad Slovenskej republiky, Úrad
      geodézie, kartografie a katastra Slovenskej republiky, Úrad jadrového dozoru Slovenskej
      republiky, Úrad pre normalizáciu, metrológiu a skúšobníctvo Slovenskej republiky, Úrad pre
      verejné obstarávanie, Úrad priemyselného vlastníctva Slovenskej republiky, Správa štátnych
      hmotných rezerv Slovenskej republiky, Národný bezpečnostný úrad y Úrad pre územné
      plánovanie a výstavbu Slovenskej republiky; el § 21(2) otorga el mismo estatus al Úrad pre
      reguláciu sieťových odvetví y a la Slovenská informačná služba. Ninguno está encabezado por
      un miembro del gobierno —el § 22 les da un predseda nombrado por el gobierno, o por el
      presidente o el Consejo Nacional, y ninguno figura en la lista gubernamental de miembros
      del gabinete—, de modo que ninguno es un ministerio ni tiene rango de gabinete. Aquí se
      nombran en lugar de registrarse como entidades, porque quien compare esta cifra con un
      recuento de «órganos centrales de la administración estatal» obtendrá 27 o 29 y no tendrá
      manera de ver de dónde viene la diferencia.
  - en: >-
      Names and provenance. The Slovak government publishes no official English or Spanish list
      of its ministries: vlada.gov.sk carries an English and a German entry in its language
      switcher, but both are dead placeholders pointing at "#2" and "#3", and there is no
      English-language edition of the list of cabinet members. Every English and Spanish name
      below is therefore this project's own translation and is marked as such, including for
      the entities whose individual ministries do publish an English name of their own on their
      own websites; nothing here is marked as the government's own name. The Slovak names are
      given in the full form the statute uses, ending in "Slovenskej republiky"; the
      government's own pages abbreviate the same names to "... SR", and the two are the same
      body. The original title recorded for each head is the masculine "minister", which is the
      form the statute uses for the office irrespective of who holds it — the government writes
      "ministerka" and "podpredsedníčka vlády" of the women holding those posts. No abbreviation
      is recorded for any entity: Slovak practice uses forms such as "MF SR" and "MZVEZ SR"
      constantly, but neither the statute nor any single official page enumerates them, and an
      abbreviation assembled by us would be an unsourced datum on a page whose point is that
      there are none.
    es: >-
      Nombres y procedencia. El gobierno eslovaco no publica ninguna lista oficial en inglés ni
      en español de sus ministerios: vlada.gov.sk lleva una entrada «English» y otra «German» en
      su selector de idioma, pero ambas son marcadores muertos que apuntan a «#2» y «#3», y no
      existe edición inglesa de la lista de miembros del gabinete. Por eso cada nombre inglés y
      español de abajo es una traducción propia de este proyecto y así se indica,
      incluidas las entidades cuyos ministerios sí publican un nombre inglés propio en su propia
      web; nada aquí se señala como nombre oficial del gobierno. Los nombres eslovacos se dan en
      la forma completa que usa la ley, terminada en «Slovenskej republiky»; las páginas del
      propio gobierno abrevian los mismos nombres como «... SR», y son el mismo organismo. El
      título original registrado para cada titular es la forma masculina «minister», que es la
      que usa la ley para el cargo con
      independencia de quién lo ocupe: el gobierno escribe «ministerka» y «podpredsedníčka vlády»
      de las mujeres que los ocupan. No se registra abreviatura para ninguna entidad: la práctica
      eslovaca usa constantemente formas como «MF SR» o «MZVEZ SR», pero ni la ley ni ninguna
      página oficial única las enumera, y una abreviatura montada por nosotros sería un dato sin
      fuente en una ficha cuya razón de ser es que no hay ninguno.
  - en: >-
      Two sources have to be read with care, and it matters which claim rests on which. First,
      the government's own "Členovia vlády" page, last updated 27 January 2026, still lists four
      people who no longer hold the posts it attributes to them alongside their successors — the
      deputy prime minister for the Recovery Plan who resigned in November 2025, and the previous
      holders of the investment, health and tourism portfolios. It is cited here for the
      structure it shows (which institution each member of the government is attached to, and the
      fact that the Prime Minister's institution is the Úrad vlády SR), never for who currently
      holds an office; the President's register of appointments and dismissals is the authority
      for that, and this project records institutions rather than officeholders in any case.
      Second, there is no tier-1 instrument constituting a Slovak cabinet. The Constitution
      requires publication in the Zbierka zákonov only for the caretaker mandate under article
      115(3); an ordinary appointment under articles 110 and 111 is made by decree handed to the
      appointee and is not gazetted. The date the cabinet took office therefore rests on two
      official but tier-2 sources — the Government Office's notice of the appointment ceremony
      of 25 October 2023 and the President's register — while every counted ministry rests on
      the statute.
    es: >-
      Dos fuentes hay que leerlas con cuidado, e importa qué afirmación se apoya en cuál. Primero,
      la página gubernamental «Členovia vlády», actualizada por última vez el 27 de enero de 2026,
      sigue listando a cuatro personas que ya no ocupan los cargos que les atribuye, junto a sus
      sucesores: el viceprimer ministro para el Plan de Recuperación que dimitió en noviembre de
      2025 y los titulares anteriores de las carteras de inversiones, sanidad y turismo. Aquí se
      cita por la estructura que muestra (a qué institución está adscrito cada miembro del
      gobierno, y el hecho de que la institución del primer ministro es el Úrad vlády SR), nunca
      por quién ocupa hoy un cargo; para eso la autoridad es el registro presidencial de
      nombramientos y ceses, y en todo caso este proyecto registra instituciones y no
      titulares. Segundo, no existe instrumento de nivel 1 que constituya un gabinete eslovaco.
      La Constitución exige la publicación en la Zbierka zákonov únicamente para el mandato en
      funciones del artículo 115(3); un nombramiento ordinario conforme a los artículos 110 y 111
      se hace por decreto entregado al nombrado y no se publica en el boletín. Por eso la fecha
      de toma de posesión se apoya en dos fuentes oficiales pero de nivel 2 —el aviso de la
      Oficina del Gobierno sobre la ceremonia de nombramiento del 25 de octubre de 2023 y el
      registro presidencial— mientras que todos los ministerios contados se apoyan en la ley.
  - en: >-
      Policy-area tagging judgements a careful reader may want to argue with. Mining and geology
      are split in Slovak law: § 6 gives the Ministry of Economy the extraction of solid fuels,
      oil, gas and ores and the supervision of mineral deposits, while § 16 gives the Ministry of
      the Environment geological survey and exploration. This project uses a single policy area
      covering "mining and geology", and only the Ministry of Economy carries it, because the
      extractive competence is the one a cross-country comparison is asking about; the
      Environment entity carries a note saying what it holds. In the same spirit the Ministry of
      Investment, Regional Development and Informatisation carries the regional-development area
      (which covers cohesion funds, most of what it does) and the digital area, and not the
      reconstruction area: the Recovery and Resilience Plan sits with the deputy prime
      minister's office, not with this ministry. The equality area is carried by the Ministry of
      Labour, Social Affairs and Family, which holds gender equality and equal opportunities
      under § 15(1)(h), rather than by the Ministry of Justice, which coordinates human-rights
      policy generally under § 13(9).
    es: >-
      Decisiones de etiquetado de áreas de política que un lector atento puede querer discutir.
      La minería y la geología están repartidas en el derecho eslovaco: el § 6 da al Ministerio de
      Economía la extracción de combustibles sólidos, petróleo, gas y minerales y la supervisión
      de los yacimientos, mientras que el § 16 da al Ministerio de Medio Ambiente la
      investigación y prospección geológica. Este proyecto usa una sola área de política que
      cubre «minería y geología», y solo el Ministerio de Economía la lleva, porque la competencia
      extractiva es la que interesa a una comparación entre países; la entidad de Medio Ambiente
      lleva una nota que dice qué tiene. Con el mismo criterio, el Ministerio de Inversiones,
      Desarrollo Regional e Informatización lleva el área de desarrollo regional (que cubre los
      fondos de cohesión, que es la mayor parte de lo que hace) y el área digital, y no la de
      reconstrucción: el Plan de Recuperación y Resiliencia está en la oficina del viceprimer
      ministro, no en este ministerio. El área de igualdad la lleva el Ministerio de Trabajo,
      Asuntos Sociales y Familia, que tiene la igualdad de género y la igualdad de oportunidades
      conforme al § 15(1)(h), y no el Ministerio de Justicia, que coordina la política general
      de derechos humanos conforme al § 13(9).

sources:
  - id: slovlex-575-2001
    tier: 1
    type: statute
    publisher: Ministerstvo spravodlivosti Slovenskej republiky — Slov-Lex, Zbierka zákonov Slovenskej republiky
    title: >-
      Zákon č. 575/2001 Z. z. o organizácii činnosti vlády a organizácii ústrednej štátnej správy
      (konsolidované znenie, časová verzia účinná od 01.07.2026)
    url: https://static.slov-lex.sk/static/SK/ZZ/2001/575/20260701.print.html
    archive_url: https://web.archive.org/web/20260728101625/https://static.slov-lex.sk/static/SK/ZZ/2001/575/20260701.print.html
    lang: sk
    published: 2001-12-29
    accessed: 2026-07-28
    quote: |-
      § 3
      Ministerstvá
      V Slovenskej republike pôsobia tieto ministerstvá, na ktorých čele je člen vlády:
      a) Ministerstvo hospodárstva Slovenskej republiky,
      b) Ministerstvo financií Slovenskej republiky,
      c) Ministerstvo dopravy Slovenskej republiky,
      d) Ministerstvo pôdohospodárstva a rozvoja vidieka Slovenskej republiky,
      e) Ministerstvo investícií, regionálneho rozvoja a informatizácie Slovenskej republiky,
      f) Ministerstvo vnútra Slovenskej republiky,
      g) Ministerstvo obrany Slovenskej republiky,
      h) Ministerstvo spravodlivosti Slovenskej republiky,
      i) Ministerstvo zahraničných vecí a európskych záležitostí Slovenskej republiky,
      j) Ministerstvo práce, sociálnych vecí a rodiny Slovenskej republiky,
      k) Ministerstvo životného prostredia Slovenskej republiky,
      l) Ministerstvo školstva, výskumu, vývoja a mládeže Slovenskej republiky,
      m) Ministerstvo kultúry Slovenskej republiky,
      n) Ministerstvo zdravotníctva Slovenskej republiky,
      o) Ministerstvo cestovného ruchu a športu Slovenskej republiky.
      § 21
      Ostatné ústredné orgány štátnej správy
      (1) V Slovenskej republike pôsobia aj tieto ústredné orgány štátnej správy:
      a) Úrad vlády Slovenskej republiky,
      b) Protimonopolný úrad Slovenskej republiky,
      c) Štatistický úrad Slovenskej republiky,
      d) Úrad geodézie, kartografie a katastra Slovenskej republiky,
      e) Úrad jadrového dozoru Slovenskej republiky,
      f) Úrad pre normalizáciu, metrológiu a skúšobníctvo Slovenskej republiky,
      g) Úrad pre verejné obstarávanie,
      h) Úrad priemyselného vlastníctva Slovenskej republiky,
      i) Správa štátnych hmotných rezerv Slovenskej republiky,
      j) Národný bezpečnostný úrad,
      k) Úrad pre územné plánovanie a výstavbu Slovenskej republiky,
      l) Úrad podpredsedu vlády Slovenskej republiky pre Plán obnovy a znalostnú ekonomiku.
      (2) Postavenie ostatného ústredného orgánu štátnej správy má aj Úrad pre reguláciu sieťových odvetví a Slovenská informačná služba; § 37, § 39 a 40 sa nepoužijú.
      § 1b
      Úlohy spojené s odborným, organizačným a technickým zabezpečovaním činnosti vlády plní Úrad vlády Slovenskej republiky; rovnaké úlohy plní Úrad vlády Slovenskej republiky aj pre predsedu vlády ako jeho výkonný orgán.
      § 4
      (1) Ministerstvo riadi a za jeho činnosť zodpovedá minister.
      § 22
      (1) Na čele Úradu vlády Slovenskej republiky je vedúci, ktorý je za výkon svojej funkcie zodpovedný predsedovi vlády. Vedúceho Úradu vlády Slovenskej republiky vymenúva a odvoláva vláda.
      (5) Na čele Úradu podpredsedu vlády Slovenskej republiky pre Plán obnovy a znalostnú ekonomiku je vedúci, ktorého vymenúva a odvoláva vláda na návrh podpredsedu vlády Slovenskej republiky pre Plán obnovy a znalostnú ekonomiku. Vedúci je za výkon svojej funkcie zodpovedný podpredsedovi vlády Slovenskej republiky pre Plán obnovy a znalostnú ekonomiku.
      (6) Na čele ostatných ústredných orgánov štátnej správy uvedených v § 21 ods. 1 písm. c) až f), h) a i) je predseda, ktorého vymenúva a odvoláva vláda. Predseda je za výkon svojej funkcie zodpovedný vláde.
    note: >-
      The kompetenčný zákon: the instrument that enumerates the Slovak ministries, and the reason
      the ministry count is a legal fact rather than a judgement. § 3 is quoted in full, so a
      reader can confirm the whole list at a glance; § 21 is quoted in full because it is the
      boundary of what is a ministry and what is merely a central authority; then § 1b, § 4(1),
      § 22(1), § 22(5) and § 22(6), which are what settle that a ministry is headed by a minister
      while the Úrad vlády and the Office of the Deputy Prime Minister are headed by a vedúci and
      the remaining authorities by a predseda. Consolidated text as published by Slov-Lex: the
      displayed version is the one in force from 1 July 2026, the newest, reflecting the
      amendment by zákon č. 86/2026 Z. z.; that amendment touched only § 24 (the Úrad vlády's
      competence for the inclusion of marginalised Roma communities and the plenipotentiary who
      carries it out) and neither § 3 nor § 21, which was checked by comparing this version
      against the previous one in force from 10 October 2025 rather than assumed. § 3 was last
      amended by zákon č. 7/2024 Z. z. with effect from 1 February 2024 and § 21 by zákon
      č. 201/2024 Z. z. with effect from 1 January 2025. The citation points at
      static.slov-lex.sk, which is Slov-Lex's own static mirror — the main portal at
      www.slov-lex.sk/ezbierky/pravne-predpisy/SK/ZZ/2001/575/20260701 renders its text
      client-side and returns only an empty application shell to an automated fetch or to a web
      archive, and the portal itself directs readers to the static version for that reason. The
      `.print.html` view was archived because the ordinary static view exceeded the archive's
      capture limit; the two carry the same text. Slov-Lex prints each letter of an enumeration on
      its own line above the item; the quotation joins letter and item on one line and is
      otherwise verbatim.

