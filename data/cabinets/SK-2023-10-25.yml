        and lifelong learning, and higher education for the vysoké školy in § 17(a).
      es: >-
        Abierto el 1 de febrero de 2024, cuando el punto 4 del artículo I de la zákon č. 7/2024
        Z. z. sustituyó la letra l) del § 3 y este ministerio ocupó el lugar del Ministerstvo
        školstva, vedy, výskumu a športu Slovenskej republiky, que se registra aparte con un
        `valid_to`. Ese mismo día el deporte salió de la cartera hacia el nuevo Ministerio de
        Turismo y Deporte, por lo que aquí no se etiqueta `sport`; el § 17(e) deja a este
        ministerio solo el fomento de la actividad física y deportiva en los centros escolares. Se
        etiqueta formación profesional por el § 17(a) y (c), enseñanza secundaria y aprendizaje a
        lo largo de la vida, y universidades por las vysoké školy del § 17(a).

