        Spatial planning and construction are not tagged: they were moved to the Úrad pre územné
        plánovanie a výstavbu Slovenskej republiky, a § 21 authority outside this file's scope,
        for which § 8(3) leaves this ministry only the duty of preparing legislation.
      es: >-
        Se etiqueta vivienda porque el § 8(1)(k), (l) y (o) atribuye a este ministerio la
        formulación y ejecución de la política de vivienda, la prima estatal al ahorro para la
        construcción, la aportación estatal a los préstamos hipotecarios y la vivienda de alquiler
        con apoyo estatal; Eslovaquia no tiene ministerio de vivienda. No se etiquetan la
        ordenación del territorio ni la construcción: pasaron al Úrad pre územné plánovanie a
        výstavbu Slovenskej republiky, una autoridad del § 21 fuera del alcance de este fichero,
        para la que el § 8(3) deja a este ministerio solo el deber de preparar la legislación.

