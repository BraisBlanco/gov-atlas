    url: https://fm.dk/
    sources: [bek-514-2026, stm-statsraadsraekkefoelge-2026-06-03]
    note:
      en: >-
        Denmark separates the budget ministry from the tax ministry: Finansministeriet
        prepares the finanslov and is the state's employer authority, while taxation belongs
        to Skatte- og Vækstministeriet. On 3 June 2026 it lost the economic agreements with
        municipalities and regions to Økonomi- og Indenrigsministeriet, and on 5 June
        relations with the IMF to Skatte- og Vækstministeriet.
      es: >-
        Dinamarca separa el ministerio de presupuesto del de impuestos: el Finansministeriet
        prepara la finanslov y ejerce de autoridad empleadora del Estado, mientras que la
        fiscalidad corresponde al Skatte- og Vækstministeriet. El 3 de junio de 2026 perdió
        los acuerdos económicos con municipios y regiones en favor del Økonomi- og
        Indenrigsministeriet y el 5 de junio las relaciones con el FMI en favor del Skatte- og
        Vækstministeriet.

