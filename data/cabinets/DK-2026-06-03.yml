    quote: >-
      Ministeriet for Samfundssikkerhed og Beredskab, j.nr. 2025-75
    note: >-
      Cited for the definite form of the ministry's name as printed in Lovtidende A, which
      is the form the ministry itself uses; BEK 1005 of 2024 creates it in the indefinite
