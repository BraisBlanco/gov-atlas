    note:
      en: >-
        The minister is styled erhvervs- og konkurrencekraftsminister, but the ministry was
        not renamed and calls itself Erhvervsministeriet; this file follows the ministry. It
        gained food safety, food health and food supply from the abolished Ministeriet for
        Fødevarer, Landbrug og Fiskeri, which is why food_safety is tagged here rather than
        on Ministeriet for Natur og Dyrevelfærd, and it lost the whole financial-regulation
        area, including Finanstilsynet, to Skatte- og Vækstministeriet.
      es: >-
        El ministro se titula erhvervs- og konkurrencekraftsminister, pero el ministerio no se
        renombró y se llama a sí mismo Erhvervsministeriet; este fichero sigue al ministerio.
        Asumió la seguridad, la salud y el abastecimiento alimentarios del suprimido
        Ministeriet for Fødevarer, Landbrug og Fiskeri —de ahí la etiqueta food_safety aquí y
        no en el Ministeriet for Natur og Dyrevelfærd— y perdió toda el área de regulación
        financiera, incluido el Finanstilsynet, en favor del Skatte- og Vækstministeriet.

  - id: DK-2026-finansministeriet
    order: 5
