      snapshot is of the same document at the upper-case path .../435/PDF, which
      retsinformation serves identically.

  - id: stm-kgl-resolution-2026-06-03
    tier: 2
    type: government_website
    publisher: Statsministeriet
    title: >-
      Statsministeriets forestilling om udnævnelse af et nyt ministerium — kongelig
      resolution af 3. juni 2026
    url: https://stm.dk/media/nishv4wc/kgl-resolution-af-3-juni-2026.pdf
    archive_url: https://web.archive.org/web/20260603163814/https://stm.dk/media/nishv4wc/kgl-resolution-af-3-juni-2026.pdf
    lang: da
    published: 2026-06-03
    accessed: 2026-07-28
    quote: |-
      Statsministeriets forestilling
      om
      udnævnelse af et nyt ministerium
      Amalienborg,
      den 3. juni 2026
      at bestemme
      at Digitaliseringsministeriet nedlægges, således at de til dette ministerium hørende forretninger overføres til Uddannelses- og Forskningsministeriet,
      at bestemme
      at betegnelsen for Indenrigs- og Sundhedsministeriet ændres til Sundheds- og Kirkeministeriet,
      at udnævne
      forhenværende minister, medlem af Folketinget Pia Olsen Dyhr til økonomi- og indenrigsminister,
    note: >-
      The royal resolution itself, published by the Prime Minister's Office as a scanned
      document signed at Amalienborg. It is the primary act; BEK nr 514 af 08/06/2026 is its
      publication in Lovtidende and is cited as the tier-1 source. Recorded here as tier 2
      because it is a government publication rather than a gazette text, and because the
      project's source vocabulary has no type for an unpublished instrument. Quoted are the
      heading, the date, two of the roughly thirty "at bestemme" items and one "at udnævne"
      item, to show the form of the instrument; the resolution runs to six pages and also
      dismisses and appoints every minister by name.

