    publisher: Lovtidende A (Ministeriet for Samfundssikkerhed og Beredskab)
    title: LOV nr 435 af 06/05/2025 — Lov om sikkerhed og beredskab i telesektoren
    url: https://www.retsinformation.dk/eli/lta/2025/435/PDF
