# Denmark — government structure of Regeringen Mette Frederiksen III.
#
# See docs/DATA-CONTRACT.md. Three things worth knowing before reading the list:
#
#   1. Denmark has no instrument that enumerates its ministries. Ministries are created,
#      renamed and abolished one at a time by kongelig resolution, and the resolution is
#      published in Lovtidende A as a "Bekendtgørelse om ændring i forretningernes
#      fordeling mellem ministrene". The enumerating instrument used here is BEK nr 514 af
#      08/06/2026, which gives effect to the royal resolutions of 3 and 5 June 2026 and
#      names eighteen of the twenty-one ministries; the Prime Minister's Office publishes
#      the matching list of the twenty-one ministers in precedence order.
#   2. Denmark is the rare 1:1 case. Every one of the twenty-one ministers heads exactly
#      one ministry and every ministry has exactly one minister, so the only difference
#      between the two published figures is Statsministeriet, which is excluded as the
#      office of the head of government: 20 ministries, 21 cabinet seats.
#   3. The 3 June 2026 reorganisation cut the cabinet from 25 ministers to 21. Three
#      ministries were abolished and eleven renamed; none was created. Any description of
#      the Danish government written before that date lists different ministries.

country: DK
cabinet_id: DK-2026-06-03

cabinet_name_original: Regeringen Mette Frederiksen III
cabinet_name_en: Mette Frederiksen III government
cabinet_name_es: Gobierno Mette Frederiksen III

head_of_government_title_original: Statsminister
head_of_government_title_en: Prime Minister

took_office: 2026-06-03
left_office: null

methodology_notes:
  - en: >-
      20 ministries and 21 cabinet seats. Denmark is unusual in that the two numbers differ
      by exactly one: each of the twenty-one ministers appointed on 3 June 2026 heads one
      ministry, no minister holds two departments, there is no minister without portfolio
      and no deputy prime minister. The single difference is Statsministeriet, the Prime
      Minister's own department, which this project excludes as the office of the head of
      government — the same treatment given to Spain's Presidencia del Gobierno. Counting
      it would give 21 ministries. Note that Denmark's own convention is to count ministers
      rather than ministries: Danish reporting describes this as a government of "21
      ministre", which is the seat count, not the ministry count.
    es: >-
      20 ministerios y 21 asientos en el gabinete. Dinamarca es un caso singular porque las
      dos cifras difieren exactamente en uno: cada uno de los veintiún ministros nombrados
      el 3 de junio de 2026 dirige un ministerio, ningún ministro acumula dos departamentos,
      no hay ministros sin cartera ni vicepresidente del gobierno. La única diferencia es el
      Statsministeriet, el departamento propio de la primera ministra, que este proyecto
      excluye como oficina del jefe de gobierno —el mismo trato que recibe la Presidencia
      del Gobierno española—. Contarlo daría 21 ministerios. Nótese que la convención danesa
      es contar ministros y no ministerios: la prensa danesa habla de un gobierno de «21
      ministre», que es el recuento de asientos y no el de ministerios.
  - en: >-
      There is no Danish legal instrument that lists the ministries in one place, so the
      enumeration here is assembled rather than copied. Under Danish constitutional
      practice the King, on the Prime Minister's recommendation, distributes business among
      the ministers by royal resolution; the resolution is then published in Lovtidende A
      as a "Bekendtgørelse om ændring i forretningernes fordeling mellem ministrene", which
      records only what changed. The instrument used here is BEK nr 514 af 08/06/2026,
      which gives effect to the royal resolutions of 3 and 5 June 2026 and names eighteen of
      the twenty-one ministries. The three it does not name — Forsvarsministeriet,
      Kulturministeriet and Ministeriet for Samfundssikkerhed og Beredskab — are each
      carried by another tier-1 instrument cited on the entity itself, so every counted
      ministry here rests on a legal instrument. The set of twenty-one is closed by the
      Prime Minister's Office's own precedence list of the government's ministers, which is
      the listing order used for the `order` field below.
    es: >-
      No existe un instrumento jurídico danés que enumere los ministerios en un solo lugar,
      de modo que la enumeración aquí se compone en lugar de copiarse. Según la práctica
      constitucional danesa, el Rey, a propuesta de la primera ministra, reparte los asuntos
      entre los ministros mediante real resolución; esa resolución se publica después en el
      Lovtidende A como «Bekendtgørelse om ændring i forretningernes fordeling mellem
      ministrene», que sólo consigna lo que cambia. El instrumento utilizado aquí es el BEK
      nr 514 af 08/06/2026, que da efecto a las reales resoluciones de 3 y 5 de junio de
      2026 y nombra dieciocho de los veintiún ministerios. Los tres que no nombra
      —Forsvarsministeriet, Kulturministeriet y Ministeriet for Samfundssikkerhed og
      Beredskab— llevan cada uno otro instrumento de nivel 1 citado en la propia entidad,
      por lo que todos los ministerios contados se apoyan en un instrumento jurídico. El
      conjunto de veintiuno se cierra con la lista de precedencia de los ministros que
      publica el Statsministeriet, que es el orden de listado usado en el campo `order`.
  - en: >-
      What changed on 3 June 2026, and why the Danish count fell. Three ministries were
      abolished: Ministeriet for Fødevarer, Landbrug og Fiskeri (its business going mainly
      to the ministry renamed Ministeriet for Natur og Dyrevelfærd, with food safety to
      Erhvervsministeriet, animal-welfare enforcement to Justitsministeriet and fisheries to
      Miljøministeriet), Digitaliseringsministeriet (to the ministry renamed Forsknings-,
      Uddannelses- og Digitaliseringsministeriet) and By-, Land- og Kirkeministeriet (split,
      with church affairs to the ministry renamed Sundheds- og Kirkeministeriet and the rest
      to the ministry renamed By-, Land- og Transportministeriet). Eleven ministries were
      renamed and none was created, which is how a cabinet of 25 ministers became one of 21.
      Denmark therefore now has no food or agriculture ministry under that name, no
      digitalisation ministry and no ministry of the church as such. The separate
      europaminister post was also abolished and its areas assigned to the udenrigsminister.
    es: >-
      Qué cambió el 3 de junio de 2026 y por qué bajó la cifra danesa. Se suprimieron tres
      ministerios: el Ministeriet for Fødevarer, Landbrug og Fiskeri (sus asuntos pasaron
      sobre todo al ministerio renombrado Ministeriet for Natur og Dyrevelfærd, con la
      seguridad alimentaria a Erhvervsministeriet, el control del bienestar animal a
      Justitsministeriet y la pesca a Miljøministeriet), el Digitaliseringsministeriet (al
      ministerio renombrado Forsknings-, Uddannelses- og Digitaliseringsministeriet) y el
      By-, Land- og Kirkeministeriet (dividido: los asuntos de la Iglesia al ministerio
      renombrado Sundheds- og Kirkeministeriet y el resto al renombrado By-, Land- og
      Transportministeriet). Once ministerios cambiaron de nombre y no se creó ninguno, y así
      un gabinete de 25 ministros pasó a tener 21. Dinamarca ya no tiene, por tanto,
      ministerio de alimentación o agricultura con ese nombre, ni ministerio de
      digitalización, ni ministerio de la Iglesia como tal. También se suprimió el puesto de
      europaminister y sus áreas se asignaron al ministro de Exteriores.
  - en: >-
      Minister titles and ministry names do not always match in Denmark, and this file
      follows the ministry. Three cases: the minister appointed on 3 June 2026 is styled
      erhvervs- og konkurrencekraftsminister, but no instrument renamed Erhvervsministeriet
      and the ministry's own website still calls itself Erhvervsministeriet; the
      sundhedsminister is simultaneously kirkeminister, but of one ministry, Sundheds- og
      Kirkeministeriet, not two; and the socialminister is simultaneously minister for
      nordisk samarbejde, a portfolio whose departmental business is transacted inside
      Udenrigsministeriet under that minister's responsibility (BEK 514, § 21). Nordic
      cooperation is therefore recorded as a portfolio of Socialministeriet and not as an
      entity, because no such department exists. Equality is the mirror case: there is no
      equality ministry, the Ligestillingsafdelingen having been moved into the ministry
      renamed Beskæftigelses- og Ligestillingsministeriet.
    es: >-
      En Dinamarca los títulos de los ministros no siempre coinciden con los nombres de los
      ministerios, y este fichero sigue al ministerio. Tres casos: el ministro nombrado el 3
      de junio de 2026 se titula erhvervs- og konkurrencekraftsminister, pero ningún
      instrumento renombró el Erhvervsministeriet y la propia web del ministerio sigue
      llamándose Erhvervsministeriet; el ministro de Sanidad es a la vez ministro de la
      Iglesia, pero de un solo ministerio, el Sundheds- og Kirkeministeriet, y no de dos; y
      el ministro de Asuntos Sociales es a la vez ministro de Cooperación Nórdica, cartera
      cuya tramitación departamental se realiza dentro del Udenrigsministeriet bajo su
      responsabilidad (BEK 514, § 21). La cooperación nórdica se registra, por tanto, como
      cartera del Socialministeriet y no como entidad, porque no existe tal departamento. La
      igualdad es el caso simétrico: no hay ministerio de igualdad, ya que la
      Ligestillingsafdelingen se trasladó al ministerio renombrado Beskæftigelses- og
      Ligestillingsministeriet.
  - en: >-
      Two royal resolutions, one date of taking office. The government was appointed by the
      royal resolution of 3 June 2026, and a second royal resolution of 5 June 2026 moved a
      few further subject areas (ECOFIN and international economic affairs, and relations
      with the IMF, to the ministry renamed Skatte- og Vækstministeriet). Both were
      published together as BEK nr 514 af 08/06/2026, in Lovtidende A of 11 June 2026.
      `took_office` is 3 June 2026, the date the ministers were appointed and the date the
      Prime Minister's Office gives for the government.
    es: >-
      Dos reales resoluciones, una fecha de toma de posesión. El gobierno fue nombrado por la
      real resolución de 3 de junio de 2026, y una segunda real resolución de 5 de junio de
      2026 trasladó algunas materias adicionales (ECOFIN y economía internacional, y las
      relaciones con el FMI, al ministerio renombrado Skatte- og Vækstministeriet). Ambas se
      publicaron juntas como BEK nr 514 af 08/06/2026, en el Lovtidende A de 11 de junio de
      2026. `took_office` es el 3 de junio de 2026, fecha del nombramiento de los ministros y
      la que da el Statsministeriet para este gobierno.
  - en: >-
      Ministeriet for Samfundssikkerhed og Beredskab is recorded in the definite form used
      by Lovtidende and by the ministry itself. The instrument that created it, BEK nr 1005
      af 29/08/2024, writes the indefinite "Ministerium for Samfundssikkerhed og Beredskab",
      which is the ordinary Danish formula for creating a department rather than a second
      name.
    es: >-
      El Ministeriet for Samfundssikkerhed og Beredskab se registra en la forma definida que
      emplean el Lovtidende y el propio ministerio. El instrumento que lo creó, el BEK nr
      1005 af 29/08/2024, escribe la forma indefinida «Ministerium for Samfundssikkerhed og
      Beredskab», que es la fórmula danesa habitual para crear un departamento y no un
      segundo nombre.
  - en: >-
      English and Spanish ministry names in this file are the project's own renderings and
      are marked translated. Danish ministries do publish English names, but after the
      reorganisation of 3 June 2026 there is no consolidated official English list of the
      twenty-one, and several of the renamed ministries had not published an English name at
      the access date. Marking a rendering official when it is ours is the one error the
      validator cannot catch, so nothing here is marked official.
    es: >-
      Los nombres en inglés y español de este fichero son traducciones del proyecto y llevan
      la marca translated. Los ministerios daneses publican nombres en inglés, pero tras la
      reorganización del 3 de junio de 2026 no existe una lista oficial consolidada en inglés
      de los veintiuno, y varios de los ministerios renombrados no habían publicado nombre
      inglés en la fecha de consulta. Marcar como oficial una traducción propia es el único
      error que el validador no puede detectar, así que aquí nada se marca como oficial.
  - en: >-
      Perimeter. This file describes the central government of Denmark. Greenland and the
      Faroe Islands are self-governing parts of the Kingdom with their own governments and
      their own ministers, and they are out of scope; Danish ministers who hold Realm
      portfolios do so within the departments recorded here. The population figure in
      data/countries/DK.yml is on the same perimeter.
    es: >-
      Perímetro. Este fichero describe el gobierno central de Dinamarca. Groenlandia y las
      Islas Feroe son partes autónomas del Reino con sus propios gobiernos y ministros, y
      quedan fuera de alcance; los ministros daneses con carteras del Reino las ejercen
      dentro de los departamentos aquí registrados. La cifra de población de
      data/countries/DK.yml se refiere al mismo perímetro.

sources:
  - id: bek-514-2026
    tier: 1
    type: official_gazette
    publisher: Lovtidende A (Statsministeriet)
    title: >-
      BEK nr 514 af 08/06/2026 — Bekendtgørelse om ændring i forretningernes fordeling
      mellem ministrene
    url: https://www.retsinformation.dk/eli/lta/2026/514/pdf
    archive_url: https://web.archive.org/web/20260727232815/https://www.retsinformation.dk/eli/lta/2026/514/pdf
    lang: da
    published: 2026-06-11
    accessed: 2026-07-28
    quote: |-
      Efter statsministerens indstilling er der ved kongelig resolution af 3. juni 2026 og kongelig resolution af 5. juni 2026 fastsat følgende bestemmelser vedrørende forretningernes fordeling mellem ministrene:
      § 1. De under europaministeren hørende områder henlægges til udenrigsministeren.
      § 2. Ministeriet for Fødevarer, Landbrug og Fiskeri nedlægges, således at de til dette ministerium hørende forretninger overføres til Ministeriet for Grøn Trepart, dog således at følgende sagsområder overføres på følgende måde:
      § 3. Betegnelsen for Ministeriet for Grøn Trepart ændres til Ministeriet for Natur og Dyrevelfærd.
      § 4. Digitaliseringsministeriet nedlægges, således at de til dette ministerium hørende forretninger overføres til Uddannelses- og Forskningsministeriet.
      § 5. Betegnelsen for Uddannelses- og Forskningsministeriet ændres til Forsknings-, Uddannelses- og Digitaliseringsministeriet.
      § 6. By-, Land- og Kirkeministeriet nedlægges, således at de til dette ministerium hørende forretninger overføres til Transportministeriet, dog således at ressortansvaret for sager vedrørende folkekirken og sager vedrørende trossamfund uden for folkekirken overføres til Indenrigs- og Sundhedsministeriet.
      § 7. Ressortansvaret for sager vedrørende sproglig genoptræning (logopæd-træning) overføres fra Børne- og Undervisningsministeriet til Indenrigs- og Sundhedsministeriet.
      § 8. Betegnelsen for Indenrigs- og Sundhedsministeriet ændres til Sundheds- og Kirkeministeriet.
      § 9. Betegnelsen for Transportministeriet ændres til By-, Land- og Transportministeriet.
      § 10. Økonomiministeriet omdannes til et Økonomi- og Indenrigsministerium, således at der til dette ministerium overføres følgende sagsområder:
      § 11. Betegnelsen for Ældreministeriet ændres til Børne-, Ældre- og Boligministeriet, således at der til dette ministerium overføres følgende sagsområder:
      § 12. Betegnelsen for Social- og Boligministeriet ændres til Socialministeriet.
      § 13. Betegnelsen for Børne- og Undervisningsministeriet ændres til Undervisningsministeriet.
      § 14. Følgende områder henlægges til Skatteministeriet:
      § 15. Betegnelsen for Skatteministeriet ændres til Skatte- og Vækstministeriet.
      § 16. Ressortansvaret for sager vedrørende affald overføres fra Miljø- og Ligestillingsministeriet til Klima-, Energi- og Forsyningsministeriet.
      § 17. Ressortansvaret for Ligestillingsafdelingen med tilhørende sagsområder overføres fra Miljø- og Ligestillingsministeriet til Beskæftigelsesministeriet.
      § 18. Betegnelsen for Beskæftigelsesministeriet ændres til Beskæftigelses- og Ligestillingsministeriet.
      § 19. Betegnelsen for Miljø- og Ligestillingsministeriet ændres til Miljøministeriet.
      § 21. Sager vedrørende nordisk samarbejde henlægges til socialministeren og ministeren for nordisk samarbejde.
      § 22. Ressortansvaret for sager vedrørende deltagelse i det økonomisk-politiske samarbejde i EU (ECOFIN) samt international økonomi overføres fra Økonomi- og Indenrigsministeriet til Skatte- og Vækstministeriet.
      § 23. Ressortansvaret for sager vedrørende relationer til Den Internationale Valutafond (IMF) overføres fra Finansministeriet til Skatte- og Vækstministeriet.
      Statsministeriet, den 8. juni 2026
      Mette Frederiksen
    note: >-
      The enumerating instrument for this cabinet: it gives effect to the royal resolutions
      of 3 and 5 June 2026 and names eighteen of the twenty-one ministries, including every
      one that was created, renamed or abolished. Quoted are the operative sentences of the
      §§ that bear on the identity of a ministry, in the order they appear; the numbered
      lists of individual subject areas transferred inside §§ 2, 10, 11 and 14, and §§ 20
      (transfer of parallel-society policy to Udlændinge- og Integrationsministeriet), are
      omitted from the quotation for length. Note that a Danish ressort bekendtgørelse
      records only what changed, which is why it cannot serve as a list of the ministries on
      its own.

  - id: bek-1005-2024
    tier: 1
    type: official_gazette
    publisher: Lovtidende A (Statsministeriet)
    title: >-
      BEK nr 1005 af 29/08/2024 — Bekendtgørelse om ændring i forretningernes fordeling
      mellem ministrene
    url: https://www.retsinformation.dk/eli/lta/2024/1005/pdf
    archive_url: https://web.archive.org/web/20260727232833/https://www.retsinformation.dk/eli/lta/2024/1005/pdf
    lang: da
    published: 2024-08-31
    accessed: 2026-07-28
    quote: |-
      § 1. Der oprettes Ministerium for Samfundssikkerhed og Beredskab, således at der til dette ministerium overføres følgende sagsområder, idet den nærmere fastlæggelse af ministerens ansvarsområde vil ske ved kongelig resolution:
      § 2. Der oprettes et Ministerium for Grøn Trepart, således at der til dette ministerium overføres følgende sagsområder, idet den nærmere fastlæggelse af ministerens ansvarsområde vil ske ved kongelig resolution:
      5) fra Kulturministeriet: ressortansvaret for sager vedrørende tech-området, herunder sociale medier og gaming samt Center for sociale medier, tech og demokrati.
    note: >-
      The instrument that created Ministeriet for Samfundssikkerhed og Beredskab (§ 1) and
      the ministry that this cabinet renamed Ministeriet for Natur og Dyrevelfærd (§ 2,
      created as Ministerium for Grøn Trepart). Cited here for those two ministries and,
      through the quoted item 5 of § 5, as the tier-1 source naming Kulturministeriet, which
      BEK 514 of 2026 does not mention because nothing about it changed. The § 1 and § 2
      subject-area lists are omitted from the quotation for length; § 1 item 1 transfers the
      emergency-preparedness ressort "fra Forsvarsministeriet".

  - id: bek-704-2023
    tier: 1
    type: official_gazette
    publisher: Lovtidende A (Forsvarsministeriet)
    title: >-
      BEK nr 704 af 08/06/2023 — Bekendtgørelse om disciplinarmyndighed inden for
      Forsvarsministeriets område
    url: https://www.retsinformation.dk/eli/lta/2023/704/pdf
    archive_url: https://web.archive.org/web/20260727233745/https://www.retsinformation.dk/eli/lta/2023/704/pdf
    lang: da
    published: 2023-06-13
    accessed: 2026-07-28
    quote: >-
      Bekendtgørelse om disciplinarmyndighed inden for Forsvarsministeriets område
    note: >-
      Cited for one narrow fact: the name Forsvarsministeriet. Nothing about the ministry
      changed in June 2026, so BEK 514 of 2026 does not mention it, and this project does
      not accept an official website as sufficient for a counted ministry when a legal
      instrument is available. This bekendtgørelse, still in force, carries the name in its
      title. It says nothing else relevant to this dataset.

