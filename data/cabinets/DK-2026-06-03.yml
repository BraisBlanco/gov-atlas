    head_title_original: Minister for natur og dyrevelfærd
    head_title_en: Minister for Nature and Animal Welfare
    has_cabinet_seat: true
    policy_areas: [environment, animal_welfare, agriculture, forestry]
    counts_as_ministry: true
    url: https://mgtp.dk/
    sources: [bek-514-2026, bek-1005-2024, stm-statsraadsraekkefoelge-2026-06-03]
    note:
      en: >-
        The same body as the Ministeriet for Grøn Trepart created in August 2024, renamed on
        3 June 2026 when it absorbed the abolished Ministeriet for Fødevarer, Landbrug og
        Fiskeri. It holds agriculture, forests, protected areas and animal-welfare policy;
        food safety went to Erhvervsministeriet, fisheries to Miljøministeriet and
        enforcement of the animal welfare act to Justitsministeriet. Denmark has had a food
        and agriculture ministry under one name or another for well over a century, and this
        is the reorganisation that ended that: agriculture is now a portfolio of a nature
        ministry.
      es: >-
        El mismo órgano que el Ministeriet for Grøn Trepart creado en agosto de 2024,
        renombrado el 3 de junio de 2026 al absorber el suprimido Ministeriet for Fødevarer,
        Landbrug og Fiskeri. Tiene la agricultura, los bosques, los espacios protegidos y la
        política de bienestar animal; la seguridad alimentaria pasó al Erhvervsministeriet, la
        pesca al Miljøministeriet y el control de la ley de bienestar animal al
        Justitsministeriet. Dinamarca había tenido durante más de un siglo un ministerio de
        alimentación y agricultura con uno u otro nombre, y esta es la reorganización que puso
        fin a ello: la agricultura es ahora una cartera de un ministerio de naturaleza.

  - id: DK-2026-kulturministeriet
    order: 17
    name_original: Kulturministeriet
    abbreviation_original: null
    name_en: Ministry of Culture
    name_es: Ministerio de Cultura
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Kulturminister
    head_title_en: Minister for Culture
    has_cabinet_seat: true
    policy_areas: [culture, media, sport]
    counts_as_ministry: true
    url: https://kum.dk/
    sources: [bek-1005-2024, stm-statsraadsraekkefoelge-2026-06-03]
    note:
      en: >-
        Unchanged by the 2026 reorganisation, which is why its tier-1 citation is the 2024
        instrument that names it. Tagged sport because organised sport (idræt) belongs to
        this ministry in Denmark, and media for broadcasting and press subsidy; the tech and
        social-media area left it in 2024 for Ministeriet for Samfundssikkerhed og Beredskab.
      es: >-
        No lo alteró la reorganización de 2026, y por eso su cita de nivel 1 es el instrumento
        de 2024 que lo nombra. Se etiqueta sport porque el deporte organizado (idræt)
        corresponde a este ministerio en Dinamarca, y media por la radiodifusión y las ayudas
        a la prensa; el área tecnológica y de redes sociales salió de aquí en 2024 hacia el
        Ministeriet for Samfundssikkerhed og Beredskab.

  - id: DK-2026-ministeriet-for-samfundssikkerhed-og-beredskab
    order: 18
    name_original: Ministeriet for Samfundssikkerhed og Beredskab
    abbreviation_original: MSSB
    name_en: Ministry of Societal Security and Emergency Preparedness
    name_es: Ministerio de Seguridad Social Colectiva y Protección Civil
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Minister for samfundssikkerhed og beredskab
    head_title_en: Minister for Societal Security and Emergency Preparedness
    has_cabinet_seat: true
    policy_areas: [civil_protection]
    counts_as_ministry: true
    url: https://mssb.dk/
    sources: [bek-1005-2024, lov-435-2025, mssb-dk-ministeriet, stm-statsraadsraekkefoelge-2026-06-03]
    note:
      en: >-
        Created on 29 August 2024 out of preparedness and security functions drawn from eight
        existing ministries, and untouched by the 2026 reorganisation. The Spanish rendering
        is awkward on purpose: "samfundssikkerhed" is societal security in the
        critical-infrastructure sense, not social security, which belongs to Beskæftigelses-
        og Ligestillingsministeriet. Tagged civil_protection only; its cyber-security remit
        has no home in the taxonomy, which is recorded in the hand-off notes.
      es: >-
        Creado el 29 de agosto de 2024 con funciones de protección civil y seguridad
        procedentes de ocho ministerios existentes, y no afectado por la reorganización de
        2026. La traducción española es deliberadamente incómoda: «samfundssikkerhed» es
        seguridad colectiva en el sentido de infraestructuras críticas, no seguridad social,
        que corresponde al Beskæftigelses- og Ligestillingsministeriet. Se etiqueta sólo
        civil_protection; su competencia de ciberseguridad no tiene hueco en la taxonomía, lo
        que queda anotado en las notas de entrega.

  - id: DK-2026-boerne-aeldre-og-boligministeriet
    order: 19
    name_original: Børne-, Ældre- og Boligministeriet
    abbreviation_original: null
    name_en: Ministry of Children, the Elderly and Housing
    name_es: Ministerio de Infancia, Mayores y Vivienda
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Børne-, ældre- og boligminister
    head_title_en: Minister for Children, the Elderly and Housing
    has_cabinet_seat: true
    policy_areas: [family, elderly, housing]
    counts_as_ministry: true
    url: https://aeldremin.dk/
    sources: [bek-514-2026, stm-statsraadsraekkefoelge-2026-06-03]
    note:
      en: >-
        The former Ældreministeriet, renamed on 3 June 2026 when it took day care and
        pre-school childcare from the ministry now called Undervisningsministeriet and the
        whole housing area — social housing, student and youth housing, private letting,
        urban renewal, building regulation and Christiania — from the ministry now called
        Socialministeriet.
      es: >-
        El antiguo Ældreministeriet, renombrado el 3 de junio de 2026 al asumir las guarderías
        y la atención infantil previa a la escolarización del ministerio hoy llamado
        Undervisningsministeriet y toda el área de vivienda —vivienda social, estudiantil y
        juvenil, alquiler privado, renovación urbana, normativa de edificación y Christiania—
        del ministerio hoy llamado Socialministeriet.

  - id: DK-2026-socialministeriet
    order: 20
    name_original: Socialministeriet
    abbreviation_original: null
    name_en: Ministry of Social Affairs
    name_es: Ministerio de Asuntos Sociales
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Socialminister og minister for nordisk samarbejde
    head_title_en: Minister for Social Affairs and Minister for Nordic Cooperation
    has_cabinet_seat: true
    policy_areas: [social_affairs, disability]
    counts_as_ministry: true
    url: https://www.sm.dk/
    sources: [bek-514-2026, stm-statsraadsraekkefoelge-2026-06-03]
    note:
      en: >-
        The former Social- og Boligministeriet, renamed after losing housing to Børne-,
        Ældre- og Boligministeriet and parallel-society policy to Udlændinge- og
        Integrationsministeriet. Its minister is also minister for Nordic cooperation, a
        portfolio transacted inside Udenrigsministeriet under this minister's responsibility;
        that is a portfolio and not a department, so it adds neither a ministry nor a seat.
      es: >-
        El antiguo Social- og Boligministeriet, renombrado tras perder la vivienda en favor del
        Børne-, Ældre- og Boligministeriet y la política contra las sociedades paralelas en
        favor del Udlændinge- og Integrationsministeriet. Su ministra es además ministra de
        Cooperación Nórdica, cartera que se tramita dentro del Udenrigsministeriet bajo su
        responsabilidad; eso es una cartera y no un departamento, por lo que no añade ni
        ministerio ni asiento.

  - id: DK-2026-miljoeministeriet
    order: 21
    name_original: Miljøministeriet
    abbreviation_original: null
    name_en: Ministry of the Environment
    name_es: Ministerio de Medio Ambiente
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Miljøminister
    head_title_en: Minister for the Environment
    has_cabinet_seat: true
    policy_areas: [environment, fisheries]
    counts_as_ministry: true
    url: https://mim.dk/
    sources: [bek-514-2026, stm-statsraadsraekkefoelge-2026-06-03]
    note:
      en: >-
        The former Miljø- og Ligestillingsministeriet, renamed on 3 June 2026 after equality
        moved to Beskæftigelses- og Ligestillingsministeriet and waste to Klima-, Energi- og
        Forsyningsministeriet, and after it gained fisheries from the abolished Ministeriet
        for Fødevarer, Landbrug og Fiskeri. Denmark therefore splits the green portfolios
        three ways: environment and fisheries here, nature and agriculture in Ministeriet for
        Natur og Dyrevelfærd, climate and energy in Klima-, Energi- og Forsyningsministeriet.
      es: >-
        El antiguo Miljø- og Ligestillingsministeriet, renombrado el 3 de junio de 2026 después
        de que la igualdad pasara al Beskæftigelses- og Ligestillingsministeriet y los
        residuos al Klima-, Energi- og Forsyningsministeriet, y tras asumir la pesca del
        suprimido Ministeriet for Fødevarer, Landbrug og Fiskeri. Dinamarca reparte así las
        carteras verdes en tres: medio ambiente y pesca aquí, naturaleza y agricultura en el
        Ministeriet for Natur og Dyrevelfærd, y clima y energía en el Klima-, Energi- og
        Forsyningsministeriet.
