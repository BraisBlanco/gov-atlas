entities:
  # --- Statsministeriet: recorded, not counted ---------------------------------------
  - id: DK-2026-statsministeriet
    order: 1
    name_original: Statsministeriet
    abbreviation_original: null
    name_en: Prime Minister's Office
    name_es: Ministerio de la Presidencia
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Statsminister
    head_title_en: Prime Minister
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://stm.dk/
    sources: [stm-statsraadsraekkefoelge-2026-06-03, bek-514-2026, stm-kgl-resolution-2026-06-03]
    note:
      en: >-
        Excluded as the office of the head of government, which is this project's default.
        Statsministeriet is a ministry in Danish administrative practice — it issues the
        ressort bekendtgørelser cited in this file and signs them "Statsministeriet, den 8.
        juni 2026" — but it is the apex of the cabinet rather than a portfolio department,
        and Denmark has no statute constituting it otherwise. Counting it would give Denmark
        21 ministries instead of 20. Its seat is the Prime Minister's and is counted.
      es: >-
        Excluido como oficina del jefe de gobierno, que es el criterio por defecto de este
        proyecto. El Statsministeriet es un ministerio en la práctica administrativa danesa
        —dicta las bekendtgørelser de reparto de ressort citadas en este fichero y las firma
        «Statsministeriet, den 8. juni 2026»—, pero es la cúspide del gabinete y no un
        departamento con cartera, y ninguna ley danesa lo constituye de otro modo. Contarlo
        daría 21 ministerios en lugar de 20. Su asiento es el de la primera ministra y sí se
        cuenta.

  # --- the twenty counted ministries, in the precedence order of the Prime Minister's
  # --- Office's own list --------------------------------------------------------------
  - id: DK-2026-oekonomi-og-indenrigsministeriet
    order: 2
    name_original: Økonomi- og Indenrigsministeriet
    abbreviation_original: null
    name_en: Ministry of Economic Affairs and the Interior
    name_es: Ministerio de Economía e Interior
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Økonomi- og indenrigsminister
    head_title_en: Minister for Economic Affairs and the Interior
    has_cabinet_seat: true
    policy_areas: [economy, territorial_administration]
    counts_as_ministry: true
    url: https://oem.dk/
    sources: [bek-514-2026, stm-statsraadsraekkefoelge-2026-06-03, stm-kgl-resolution-2026-06-03]
    note:
      en: >-
        The former Økonomiministerium, converted on 3 June 2026 into an Økonomi- og
        Indenrigsministerium: it took the local-government finance agreements from
        Finansministeriet and the whole indenrigs (domestic-administration) area, including
        VIVE, from the ministry now called Sundheds- og Kirkeministeriet. It lost economic
        forecasting and the Økonomisk Redegørelse to Skatte- og Vækstministeriet, and two
        days later also ECOFIN and international economic affairs. Tagged
        territorial_administration for the indenrigs area, which in Denmark means the
        relationship with municipalities and regions rather than police or public security.
      es: >-
        El antiguo Økonomiministerium, transformado el 3 de junio de 2026 en un Økonomi- og
        Indenrigsministerium: asumió los acuerdos de financiación local del Finansministeriet
        y todo el área de interior administrativo (indenrigs), incluido el VIVE, del
        ministerio hoy llamado Sundheds- og Kirkeministeriet. Perdió la previsión económica y
        la Økonomisk Redegørelse en favor del Skatte- og Vækstministeriet y, dos días después,
        también el ECOFIN y la economía internacional. Se etiqueta
        territorial_administration por el área de indenrigs, que en Dinamarca significa la
        relación con municipios y regiones y no policía ni seguridad pública.

  - id: DK-2026-udenrigsministeriet
