        Se etiqueta european_affairs porque el puesto propio de europaminister se suprimió el
        3 de junio de 2026 y sus áreas se asignaron al ministro de Exteriores, quedando la
        tramitación departamental en el Udenrigsministeriet. La cooperación nórdica también se
