# Spain — government structure of June 2018 to January 2020.
#
# Seventeen departments, up from thirteen: the largest single jump in the Spanish series until
# the one that follows it. This government took office through a successful motion of no
# confidence rather than after an election, so it shares the XII legislature with the
# government it replaced, and it then remained in a caretaker capacity across two dissolutions
# with this structure unchanged.

country: ES
cabinet_id: ES-2018-06-07

cabinet_name_original: Gobierno de España, XII Legislatura (2018-2020)
cabinet_name_en: Government of Spain, 12th legislature (2018-2020)
cabinet_name_es: Gobierno de España, XII Legislatura (2018-2020)

head_of_government_title_original: Presidente del Gobierno
head_of_government_title_en: Prime Minister

took_office: 2018-06-07
left_office: 2020-01-12

methodology_notes:
  - en: >-
      Seventeen ministerial departments, four more than the government it replaced. Several
      responsibilities that had been folded into larger departments were given their own again:
      the environment as ecological transition, culture and sport, science and universities, and
      territorial policy with the civil service. Equality did not get a department but was named
      in the title of the Presidency one.
    es: >-
      Diecisiete departamentos ministeriales, cuatro más que el Gobierno al que sustituyó.
      Varias competencias que habían quedado integradas en departamentos mayores volvieron a
      tener el suyo: el medio ambiente como transición ecológica, la cultura y el deporte, la
      ciencia y las universidades, y la política territorial con la función pública. La igualdad
      no obtuvo departamento pero sí figuró en el título del de la Presidencia.
  - en: >-
      Eighteen seats against seventeen departments: the Prime Minister holds a seat without
      heading a department. A single vice-president, who also headed the Presidency department,
      and no minister without a portfolio.
    es: >-
      Dieciocho asientos frente a diecisiete departamentos: el presidente del Gobierno ocupa un
      asiento sin encabezar departamento. Una sola vicepresidencia, que encabezaba además el
      departamento de la Presidencia, y ningún ministro sin cartera.
  - en: >-
      This government spans parts of three legislatures. It was invested in June 2018 through a
      motion of no confidence, within the legislature elected in 2016; it continued as a
      caretaker government after the elections of April and November 2019, and left office when
      the next one was formed in January 2020. Its structure was never amended, so the same
      seventeen departments cover all of it.
    es: >-
      Este Gobierno abarca partes de tres legislaturas. Fue investido en junio de 2018 mediante
      una moción de censura, dentro de la legislatura elegida en 2016; continuó en funciones tras
      las elecciones de abril y noviembre de 2019 y cesó al formarse el siguiente en enero de
      2020. Su estructura no se modificó nunca, de modo que los mismos diecisiete departamentos
      abarcan todo el periodo.
  - en: >-
      Three decrees during 2018 amended the internal organisation of the employment, economy and
      foreign affairs departments. None of them touched the list of departments, so they change
      neither figure reported here.
    es: >-
      Tres decretos de 2018 modificaron la organización interna de los departamentos de empleo,
      economía y asuntos exteriores. Ninguno afectó a la lista de departamentos, por lo que no
      alteran ninguna de las dos cifras que aquí se recogen.

sources:
  - id: boe-rd-355-2018
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 355/2018, de 6 de junio, por el que se reestructuran los departamentos
      ministeriales
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2018-7575
    archive_url: https://web.archive.org/web/20260420154107/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2018-7575
    lang: es
    published: 2018-06-07
    accessed: 2026-07-29
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado se estructura en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores, Unión Europea y Cooperación.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Hacienda.
      Ministerio del Interior.
      Ministerio de Fomento.
      Ministerio de Educación y Formación Profesional.
      Ministerio de Trabajo, Migraciones y Seguridad Social.
      Ministerio de Industria, Comercio y Turismo.
      Ministerio de Agricultura, Pesca y Alimentación.
      Ministerio de la Presidencia, Relaciones con las Cortes e Igualdad.
      Ministerio de Política Territorial y Función Pública.
      Ministerio para la Transición Ecológica.
      Ministerio de Cultura y Deporte.
      Ministerio de Economía y Empresa.
      Ministerio de Sanidad, Consumo y Bienestar Social.
      Ministerio de Ciencia, Innovación y Universidades.
    note: >-
      The text as published, in force the same day. Three later decrees in 2018 amended the
      internal structure of individual departments without touching this enumeration, so the
      seventeen stood for the whole term.

  - id: boe-rd-357-2018
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 357/2018, de 6 de junio, por el que se nombran Ministros del Gobierno
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2018-7577
    archive_url: https://web.archive.org/web/20250618084430/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2018-7577
    lang: es
    published: 2018-06-07
    accessed: 2026-07-29
    quote: |-
      Ministra de la Presidencia, Relaciones con las Cortes e Igualdad a doña María del Carmen Calvo Poyato.
      Ministra de Política Territorial y Función Pública a doña Meritxell Batet Lamaña.
      Ministra para la Transición Ecológica a doña Teresa Ribera Rodríguez.
      Ministro de Cultura y Deporte a don Màxim Huerta Hernández.
      Ministra de Economía y Empresa a doña Nadia María Calviño Santamaría.
      Ministra de Sanidad, Consumo y Bienestar Social a doña Carmen Montón Giménez.
      Ministro de Ciencia, Innovación y Universidades a don Pedro Francisco Duque Duque.
    note: >-
      Seventeen ministers for seventeen departments, one each and none without a portfolio,
      which is what makes the seat count eighteen once the Prime Minister is added. The quote
      covers the departments new to this term, including the Presidency one held by the sole
      vice-president appointed the same day.

  - id: boe-ley-50-1997
    tier: 1
    type: statute
    publisher: Boletín Oficial del Estado
    title: Ley 50/1997, de 27 de noviembre, del Gobierno (texto consolidado)
    url: https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    archive_url: https://web.archive.org/web/20260716135650/https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    lang: es
    published: 1997-11-28
    accessed: 2026-07-29
    quote: >-
      El Gobierno se compone del Presidente, del Vicepresidente o Vicepresidentes, en su
      caso, y de los Ministros.
    note: >-
      Cited for the composition of the Government, which is what makes the Prime Minister's
      seat a matter of statute rather than of interpretation.

