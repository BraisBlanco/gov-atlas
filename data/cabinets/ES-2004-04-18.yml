# Spain — government structure of the VIII legislature (2004-2008).
#
# Sixteen departments, and the term that re-merged economy with finance and gave housing a
# department of its own for the first time.

country: ES
cabinet_id: ES-2004-04-18

cabinet_name_original: Gobierno de España, VIII Legislatura
cabinet_name_en: Government of Spain, 8th legislature
cabinet_name_es: Gobierno de España, VIII Legislatura

head_of_government_title_original: Presidente del Gobierno
head_of_government_title_en: Prime Minister

took_office: 2004-04-18
left_office: 2008-04-13

methodology_notes:
  - en: >-
      Sixteen ministerial departments. The restructuring reversed two of the changes made in
      2000 — economy and finance were merged back into one department and science and
      technology was abolished, with research returning to education — while creating a
      Ministry of Housing and restoring a separate Ministry of Culture.
    es: >-
      Dieciséis departamentos ministeriales. La reestructuración revirtió dos de los cambios
      de 2000 —Economía y Hacienda volvieron a un solo departamento y se suprimió Ciencia y
      Tecnología, con la investigación de vuelta a Educación— al tiempo que creaba un
      Ministerio de Vivienda y restablecía un Ministerio de Cultura propio.
  - en: >-
      Seventeen seats against sixteen departments: the Prime Minister holds a seat without
      heading a department. Both vice-presidents were serving ministers — the first also
      headed the Presidency department and the second economy and finance — and no minister
      was appointed without a portfolio.
    es: >-
      Diecisiete asientos frente a dieciséis departamentos: el presidente del Gobierno ocupa
      un asiento sin encabezar departamento. Las dos vicepresidencias las ostentaron
      ministros en ejercicio —la primera encabezaba además el departamento de la Presidencia
      y el segundo Economía y Hacienda— y ningún ministro fue nombrado sin cartera.

sources:
  - id: boe-rd-553-2004
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 553/2004, de 17 de abril, por el que se reestructuran los departamentos
      ministeriales
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2004-6888
    archive_url: https://web.archive.org/web/20231227125737/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2004-6888
    lang: es
    published: 2004-04-18
    accessed: 2026-07-29
    quote: |-
      Artículo 1. Departamentos ministeriales.
      La Administración General del Estado queda estructurada en los siguientes departamentos ministeriales:
      Ministerio de Asuntos Exteriores y de Cooperación.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Economía y Hacienda.
      Ministerio del Interior.
      Ministerio de Fomento.
      Ministerio de Educación y Ciencia.
      Ministerio de Trabajo y Asuntos Sociales.
      Ministerio de Industria, Turismo y Comercio.
      Ministerio de Agricultura, Pesca y Alimentación.
      Ministerio de la Presidencia.
      Ministerio de Administraciones Públicas.
      Ministerio de Cultura.
      Ministerio de Sanidad y Consumo.
      Ministerio de Medio Ambiente.
      Ministerio de Vivienda.
    note: >-
      The text as published, in force the same day. A later decree of September 2006 amended
      the internal structure of the foreign affairs department without touching this
      enumeration, so the sixteen departments stood for the whole term.

  - id: boe-rd-558-2004
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 558/2004, de 17 de abril, por el que se nombran Ministros del Gobierno
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2004-6893
    archive_url: https://web.archive.org/web/20240603024735/https://www.boe.es/diario_boe/txt.php?id=BOE-A-2004-6893
    lang: es
    published: 2004-04-18
    accessed: 2026-07-29
    quote: |-
      Ministro de Economía y Hacienda a don Pedro Solbes Mira.
      Ministra de la Presidencia a doña María Teresa Fernández de la Vega Sanz.
      Ministra de Cultura a doña Carmen Calvo Poyato.
      Ministra de Sanidad y Consumo a doña Elena Salgado Méndez.
      Ministra de Medio Ambiente a doña Cristina Narbona Ruiz.
      Ministra de Vivienda a doña María Antonia Trujillo Rincón.
    note: >-
      Sixteen ministers for sixteen departments, one each and none without a portfolio, which
      is what makes the seat count seventeen once the Prime Minister is added. The quote
      picks out the appointments of the two vice-presidents named the same day, who headed
      economy and finance and the Presidency, along with the departments new to this term.

  - id: boe-ley-50-1997
    tier: 1
    type: statute
    publisher: Boletín Oficial del Estado
    title: Ley 50/1997, de 27 de noviembre, del Gobierno (texto consolidado)
    url: https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    archive_url: https://web.archive.org/web/20260716135650/https://www.boe.es/buscar/act.php?id=BOE-A-1997-25336
    lang: es
    published: 1997-11-28
    accessed: 2026-07-29
    quote: >-
      El Gobierno se compone del Presidente, del Vicepresidente o Vicepresidentes, en su
      caso, y de los Ministros.
    note: >-
      Cited for the composition of the Government, which is what makes the Prime Minister's
      seat a matter of statute rather than of interpretation.

