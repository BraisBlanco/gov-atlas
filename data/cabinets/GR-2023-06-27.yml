        created by law 4622/2019, but it is not one of the twenty ministries in the gazette's
        list and is not counted.
      es: >-
        El jefe de gobierno ocupa asiento sin encabezar ningún ministerio. Los servicios del
        primer ministro se organizan como Προεδρία της Κυβέρνησης, una estructura central
        creada por la ley 4622/2019, pero no es uno de los veinte ministerios de la lista del
        boletín y no se cuenta.

