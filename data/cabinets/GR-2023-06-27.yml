# Greece — government structure of the second Mitsotakis government.
#
# Read docs/DATA-CONTRACT.md alongside this file. Four Greece-specific things to know:
#
#   1. The enumerating instrument is not a decree creating ministries but the Prime
#      Minister's decision fixing their order of precedence, Υ 1/3.1.2024 (ΦΕΚ Β' 28), whose
#      article 1 lists all twenty of them. Greek ministries are created, renamed and merged
#      one at a time by presidential decree, so this decision is the only single official
#      text that states the whole list. The listing order below is its order.
#   2. Greek law, not our judgement, decides who has a cabinet seat. Article 1(2) of law
#      4622/2019 puts the Prime Minister, the deputy prime ministers, the ministers, the
#      ministers of state and the alternate ministers in the Υπουργικό Συμβούλιο, and
#      excludes deputy ministers (υφυπουργοί) from it. That is why four alternate ministers
#      are recorded here and about twenty deputy ministers are not.
#   3. Reshuffles do not restart the cabinet. This government was appointed on 27 June 2023
#      and has been reshuffled several times since, most recently in April and June 2026;
#      no new government was appointed, and the twenty departments have not changed.
#   4. Two entities carry url: null because the ministry's website could not be confirmed
#      from an archived capture, not because the ministry has none.

country: GR
cabinet_id: GR-2023-06-27

cabinet_name_original: Κυβέρνηση Κυριάκου Μητσοτάκη (2023)
cabinet_name_en: Second government of Kyriakos Mitsotakis
cabinet_name_es: Segundo gobierno de Kyriakos Mitsotakis

head_of_government_title_original: Πρωθυπουργός
head_of_government_title_en: Prime Minister

took_office: 2023-06-27
left_office: null

methodology_notes:
  - en: >-
      Greece has 20 ministries but 27 seats in the Council of Ministers. The gap is not a
      matter of interpretation: article 1(2) of law 4622/2019 provides that the Υπουργικό
      Συμβούλιο "consists of the Prime Minister, the Vice-Presidents of the Government and
      the Ministers, including the Ministers of State and the Alternate Ministers", and that
      deputy ministers are not members of it. Counting from that definition gives the 20
      ministers who head a department, plus the Prime Minister, one Vice-President of the
      Government, one Minister of State without portfolio and four Alternate Ministers. The
      20 and the 27 answer different questions and are never added together.
    es: >-
      Grecia tiene 20 ministerios pero 27 asientos en el Consejo de Ministros. La diferencia
      no es interpretativa: el artículo 1.2 de la ley 4622/2019 dispone que el Υπουργικό
      Συμβούλιο «está compuesto por el primer ministro, los vicepresidentes del Gobierno y
      los ministros, incluidos los ministros de Estado y los ministros adjuntos», y que los
      viceministros no son miembros. Contando desde esa definición salen los 20 ministros
      que encabezan un departamento, más el primer ministro, un vicepresidente del Gobierno,
      un ministro de Estado sin cartera y cuatro ministros adjuntos. El 20 y el 27 responden
      a preguntas distintas y nunca se suman.
  - en: >-
      Alternate ministers (αναπληρωτές υπουργοί) are the awkward case. They hold ministerial
      rank and sit in the Council of Ministers, so each adds a seat, but they exercise
      competences delegated to them inside an existing ministry and head no department of
      their own, so none adds a ministry. They are recorded as junior ministers or state
      secretaries, the closest available category, though it understates their
      rank: unlike a Spanish secretario de Estado or a
      French secrétaire d'État, a Greek alternate minister is a full member of the cabinet.
      The four in office are attached to National Economy and Finance, to Education,
      Religious Affairs and Sport (for sport), to Health, and to Infrastructure and
      Transport (for transport).
    es: >-
      Los ministros adjuntos (αναπληρωτές υπουργοί) son el caso delicado. Tienen rango
      ministerial y asiento en el Consejo de Ministros, de modo que cada uno suma un
      asiento, pero ejercen competencias delegadas dentro de un ministerio existente y no
      encabezan departamento propio, así que ninguno suma un ministerio. Se registran como
      ministros júnior o secretarios de Estado, la categoría disponible más aproximada,
      aunque se queda corta con su rango: a diferencia de un secretario de
      Estado español o un secrétaire d'État francés, el ministro adjunto griego es miembro
      de pleno derecho del gabinete. Los cuatro en ejercicio están adscritos a Economía
      Nacional y Hacienda, a Educación, Asuntos Religiosos y Deportes (para deportes), a
      Sanidad y a Infraestructuras y Transportes (para transportes).
  - en: >-
      Around twenty deputy ministers (υφυπουργοί), including three attached to the Prime
      Minister and one who is the government spokesperson, are deliberately not recorded
      here. The second sentence of article 1(2) of law 4622/2019 says they are not members of
      the Council of Ministers and may only be invited to attend without a vote, so they add
      neither a ministry nor a seat, and this project records only the bodies that affect one
      of the two figures. A source that answers "how large is the Greek government?" with a
      number in the forties is counting them; it is not wrong, it is answering a third
      question.
    es: >-
      Una veintena de viceministros (υφυπουργοί), entre ellos tres adscritos al primer
      ministro y uno que es portavoz del Gobierno, deliberadamente no se registran
      aquí. La segunda frase del artículo 1.2 de la ley 4622/2019 dice que no son
      miembros del Consejo de Ministros y que solo pueden ser invitados a asistir sin voto,
      por lo que no suman ni ministerio ni asiento, y este proyecto registra solo
      los órganos que afectan a una de las dos cifras. Una fuente que responde «¿de qué tamaño
      es el Gobierno griego?» con una cifra de cuarenta y tantos los está contando: no se
      equivoca, responde a una tercera pregunta.
  - en: >-
      A discrepancy worth recording. The official page of the General Secretariat for Legal
      and Parliamentary Affairs that reproduces the list of ministries attributes it to
      "decision Υ 22/3-1-2024"; the gazette itself, ΦΕΚ Β' 28 of 3 January 2024, numbers the
      decision "Υ 1". The list of twenty ministries is identical in both, so nothing recorded
      here turns on it, but the citation used here is the gazette's own numbering.
    es: >-
      Una discrepancia que conviene dejar anotada. La página oficial de la Secretaría General
      de Asuntos Jurídicos y Parlamentarios que reproduce la lista de ministerios la atribuye
      a la «decisión Υ 22/3-1-2024»; el propio boletín, ΦΕΚ Β' 28 de 3 de enero de 2024,
      numera la decisión «Υ 1». La lista de veinte ministerios es idéntica en ambos, así que
      nada de lo registrado aquí depende de ello, pero la cita empleada aquí sigue la
      numeración del boletín.
  - en: >-
      Greek names are the official ones; the English and Spanish names are this project's
      translations, except where a ministry publishes its own English name. Two translation
      choices are worth flagging. Υπουργείο Προστασίας του Πολίτη is rendered "Ministry of
      Citizen Protection": it is the police and public-order department, and the interior
      ministry, Υπουργείο Εσωτερικών, is the one that runs the civil service and local
      government. And Υπουργείο Ανάπτυξης, literally "Ministry of Development", is the
      industry, trade and research department, not a development-cooperation one; that
      portfolio sits in the foreign ministry.
    es: >-
      Los nombres griegos son los oficiales; los nombres en inglés y español son traducciones
      de este proyecto, salvo donde un ministerio publica su propio nombre en inglés. Dos
      decisiones de traducción merecen señalarse. Υπουργείο Προστασίας του Πολίτη se traduce
      «Ministerio de Protección del Ciudadano»: es el departamento de policía y orden
      público, mientras que el ministerio del Interior, Υπουργείο Εσωτερικών, es el que
      gestiona la función pública y la administración local. Y Υπουργείο Ανάπτυξης,
      literalmente «Ministerio de Desarrollo», es el departamento de industria, comercio e
      investigación, no de cooperación al desarrollo; esa cartera está en Exteriores.

sources:
  - id: fek-b-28-2024
    tier: 1
    type: official_gazette
    publisher: Εθνικό Τυπογραφείο — Εφημερίδα της Κυβερνήσεως
    title: >-
      Απόφαση του Πρωθυπουργού υπό στοιχεία Υ 1/3.1.2024 «Καθορισμός σειράς τάξης
      Υπουργείων» (ΦΕΚ Β' 28/03.01.2024)
    url: https://www.et.gr/api/DownloadFeksApi/?fek_pdf=20240200028
    archive_url: https://web.archive.org/web/20240529000500/https://www.et.gr/api/DownloadFeksApi/?fek_pdf=20240200028
    lang: el
    published: 2024-01-03
    accessed: 2026-07-27
    quote: |-
      Άρθρο 1
      Η σειρά τάξης των Υπουργείων καθορίζεται ως εξής:
      1. Υπουργείο Εθνικής Οικονομίας και Οικονομικών,
      2. Υπουργείο Εξωτερικών,
      3. Υπουργείο Εθνικής Άμυνας,
      4. Υπουργείο Εσωτερικών,
      5. Υπουργείο Παιδείας, Θρησκευμάτων και Αθλητισμού,
      6. Υπουργείο Υγείας,
      7. Υπουργείο Προστασίας του Πολίτη,
      8. Υπουργείο Υποδομών και Μεταφορών,
      9. Υπουργείο Περιβάλλοντος και Ενέργειας,
      10. Υπουργείο Ανάπτυξης,
      11. Υπουργείο Εργασίας και Κοινωνικής Ασφάλισης,
      12. Υπουργείο Δικαιοσύνης,
      13. Υπουργείο Πολιτισμού,
      14. Υπουργείο Μετανάστευσης και Ασύλου,
      15. Υπουργείο Κοινωνικής Συνοχής και Οικογένειας,
      16. Υπουργείο Αγροτικής Ανάπτυξης και Τροφίμων,
      17. Υπουργείο Ναυτιλίας και Νησιωτικής Πολιτικής,
      18. Υπουργείο Τουρισμού,
      19. Υπουργείο Ψηφιακής Διακυβέρνησης,
      20. Υπουργείο Κλιματικής Κρίσης και Πολιτικής Προστασίας.
    note: >-
      The instrument that enumerates the ministries. Signed by the Prime Minister on
      3 January 2024, in force from publication, and it repeals the previous list, decision
      Υ2/27.6.2023 (Β' 4162). No later decision or presidential decree has created, abolished
      or renamed a ministry: the same twenty appear, in the same order, on the government's
      own composition page consulted on the access date. The quote is verbatim except that
      the gazette's line-break hyphenation in "Πολιτικής Προ-στασίας" is closed up. The
      archived snapshot is of the identical two-page PDF; note that et.gr now redirects this
      download endpoint to a bare-IP host, so a fresh capture made today lands on that host
      rather than on www.et.gr.

  - id: fek-a-131-2023
    tier: 1
    type: official_gazette
    publisher: Εθνικό Τυπογραφείο — Εφημερίδα της Κυβερνήσεως
    title: >-
      Προεδρικό Διάταγμα υπ' αριθμ. 79 «Διορισμός Υπουργών, Αναπληρωτών Υπουργών και
      Υφυπουργών» (ΦΕΚ Α' 131/27.06.2023)
    url: https://www.et.gr/api/DownloadFeksApi/?fek_pdf=20230100131
    archive_url: https://web.archive.org/web/20240407070111/https://www.et.gr/api/DownloadFeksApi/?fek_pdf=20230100131
    lang: el
    published: 2023-06-27
    accessed: 2026-07-27
    quote: >-
      Διορίζουμε τους: 1) Κωνσταντίνο Χατζηδάκη του Ιωάννη στη θέση του Υπουργού Οικονομικών,
      [...] 21) Μαυρουδή Βορίδη του Χρήστου στη θέση του Υπουργού Επικρατείας, 22) Σταύρο
      Παπασταύρου του Νικολάου στη θέση του Υπουργού Επικρατείας, 23) Χρήστο - Γεώργιο
      Σκέρτσο του Βασιλείου στη θέση του Υπουργού Επικρατείας, 24) Νικόλαο Παπαθανάση του
      Χρήστου στη θέση του Αναπληρωτή Υπουργού Οικονομικών, [...] Αθήνα, 27 Ιουνίου 2023
    note: >-
      The decree that appointed this government, and therefore the source of took_office.
      Cited here for the two kinds of post that are not departments: it appointed three
      Υπουργοί Επικρατείας (ministers of state without portfolio) and four Αναπληρωτές
      Υπουργοί (alternate ministers). The quote elides the intervening appointments at
      "[...]"; the full list of 62 names is in the linked document. Officeholders and the
      number of ministers of state have changed with later reshuffles — the government's own
      composition page, cited separately, is what this file follows for the current
      structure. Note also that the decree still uses the pre-June-2023 department names
      (e.g. Υπουργού Οικονομικών), which π.δ. 77/2023 renamed days later.

  - id: fek-a-133-2019
    tier: 1
    type: statute
    publisher: Εθνικό Τυπογραφείο — Εφημερίδα της Κυβερνήσεως
    title: >-
      Νόμος 4622/2019 «Επιτελικό Κράτος: οργάνωση, λειτουργία και διαφάνεια της Κυβέρνησης,
      των κυβερνητικών οργάνων και της κεντρικής δημόσιας διοίκησης» (ΦΕΚ Α' 133/07.08.2019)
    url: https://www.et.gr/api/DownloadFeksApi/?fek_pdf=20190100133
    archive_url: https://web.archive.org/web/20230418182520/https://www.et.gr/api/DownloadFeksApi/?fek_pdf=20190100133
    lang: el
    published: 2019-08-07
    accessed: 2026-07-27
    quote: >-
      Το Υπουργικό Συμβούλιο αποτελείται από τον Πρωθυπουργό, τους Αντιπροέδρους της
      Κυβέρνησης και τους Υπουργούς, συμπεριλαμβανομένων των Υπουργών Επικρατείας και των
      Αναπληρωτών Υπουργών. Οι Υφυπουργοί δεν αποτελούν μέλη του Υπουργικού Συμβουλίου, αλλά
      δύνανται να προσκληθούν να συμμετάσχουν σε αυτό από τον Πρωθυπουργό, χωρίς δικαίωμα
      ψήφου.
    note: >-
      Article 1(2), quoted from the original gazette text. This paragraph is what makes
      cabinet_seats_count a matter of statute rather than of our interpretation, and it is
      the reason alternate ministers are recorded here while deputy ministers are not. It
      has not been amended: the consolidated text carries no amendment note against it.

  - id: government-gov-gr-synthesi
    tier: 2
    type: government_website
    publisher: Ελληνική Κυβέρνηση
    title: Σύνθεση της Κυβέρνησης
    url: https://www.government.gov.gr/kivernisi/
    archive_url: https://web.archive.org/web/20260420122254/https://www.government.gov.gr/kivernisi/
    lang: el
    published: null
    accessed: 2026-07-27
    quote: >-
      ΠΡΩΘΥΠΟΥΡΓΟΣ: Κυριάκος Μητσοτάκης. Αντιπρόεδρος της Κυβέρνησης: Κωστής Χατζηδάκης.
      [...] Υπουργός Επικρατείας Άκης Σκέρτσος. Υφυπουργός παρά τω Πρωθυπουργώ: Θανάσης
      Κοντογεώργης.
    note: >-
      The government's own composition page, and the source for which non-departmental posts
      currently exist: one Vice-President of the Government, one Minister of State and four
      alternate ministers. The most recent archived capture is of 20 April 2026; the June
      2026 mini-reshuffle that followed changed deputy ministers and the holder of the
      alternate-minister post at Infrastructure and Transport, but created and abolished no
      post, so the structure recorded here is unaffected. The page lists the same twenty
      ministries, in the same order, as the gazette. The quote elides the twenty ministry
      blocks at "[...]".

