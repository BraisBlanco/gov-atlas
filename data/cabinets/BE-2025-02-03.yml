    sources: [mb-ar-2025-02-03-nomination, mb-kb-2025-02-03-benoeming]
    note:
      en: >-
        Dutch title, equally official: "Vice-eersteminister en Minister van Begroting, belast
        met Administratieve Vereenvoudiging". Belgium separates the budget from finance: this
        portfolio controls expenditure, the next one taxation and public debt.
      es: >-
        Título neerlandés, igualmente oficial: «Vice-eersteminister en Minister van Begroting,
        belast met Administratieve Vereenvoudiging». Bélgica separa presupuesto y hacienda:
        esta cartera controla el gasto y la siguiente la fiscalidad y la deuda pública.

  - id: BE-2025-finances-pensions
    order: 6
    name_original: >-
      Vice-Premier Ministre et Ministre des Finances et des Pensions, chargé de la Loterie
      nationale et des Institutions culturelles fédérales
    abbreviation_original: null
    name_en: >-
      Deputy Prime Minister and Minister of Finance and Pensions, responsible for the National
      Lottery and the Federal Cultural Institutions
    name_es: >-
      Viceprimer ministro y ministro de Hacienda y Pensiones, encargado de la Lotería Nacional
      y las Instituciones Culturales Federales
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministre / Minister
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [finance, social_security, culture]
    counts_as_ministry: true
    url: null
    sources: [mb-ar-2025-02-03-nomination, mb-kb-2025-02-03-benoeming]
    note:
      en: >-
        Dutch title, equally official: "Vice-eersteminister en Minister van Financiën en
        Pensioenen, belast met de Nationale Loterij en de Federale Culturele Instellingen".
        Culture in Belgium is a community competence, so the only cultural responsibility left
        federally is the handful of national institutions — the opera house, the national
        orchestra, the federal scientific and cultural establishments — which is why this
        portfolio, and not any dedicated one, carries the culture area.
      es: >-
        Título neerlandés, igualmente oficial: «Vice-eersteminister en Minister van Financiën
        en Pensioenen, belast met de Nationale Loterij en de Federale Culturele Instellingen».
        La cultura en Bélgica es competencia de las comunidades, así que lo único cultural que
        queda en el nivel federal son unas pocas instituciones nacionales —la ópera, la
        orquesta nacional, los establecimientos científicos y culturales federales—, y por eso
        es esta cartera, y no una específica, la que lleva el área de cultura.

