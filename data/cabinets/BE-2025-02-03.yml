    note:
      en: >-
        Dutch title, equally official: "Minister van Defensie, belast met Buitenlandse
        Handel". Pairing defence with foreign trade is unusual across this dataset; in most
        countries trade sits with the economy or with foreign affairs.
      es: >-
        Título neerlandés, igualmente oficial: «Minister van Defensie, belast met Buitenlandse
        Handel». Emparejar defensa con comercio exterior es inusual en este conjunto de datos;
        en la mayoría de los países el comercio va con economía o con exteriores.

