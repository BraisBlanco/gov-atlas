    note:
      en: >-
        Dutch title, equally official: "Minister van Veiligheid en Binnenlandse Zaken, belast
        met Beliris". Beliris is the federal-Brussels cooperation agreement under which the
        federal state funds infrastructure in the capital region; it is the reason this
        portfolio carries an infrastructure tag alongside policing and civil protection.
      es: >-
        Título neerlandés, igualmente oficial: «Minister van Veiligheid en Binnenlandse Zaken,
        belast met Beliris». Beliris es el acuerdo de cooperación entre el Estado federal y
        Bruselas por el que el primero financia infraestructuras en la región capital; es la
        razón de que esta cartera lleve infraestructuras junto a policía y protección civil.

