    sources: [mb-ar-2025-02-03-nomination, mb-kb-2025-02-03-benoeming]
    note:
      en: >-
        Dutch title, equally official: "Minister van Justitie, belast met Noordzee". The North
        Sea portfolio covers marine spatial planning, the protection of the marine environment
        and offshore installations in Belgium's territorial waters, which is why this
        otherwise unmistakable justice portfolio is also tagged with environment.
      es: >-
        Título neerlandés, igualmente oficial: «Minister van Justitie, belast met Noordzee».
        La cartera del Mar del Norte abarca la ordenación del espacio marino, la protección
        del medio marino y las instalaciones en alta mar en aguas territoriales belgas, y por
        eso esta cartera de justicia, por lo demás inconfundible, lleva también medio ambiente.

