        Título neerlandés, igualmente oficial: «Vice-eersteminister en Minister van Sociale
        Zaken en Volksgezondheid, belast met Armoedebestrijding». El seguro obligatorio de
        enfermedad y la mayoría de las ramas del seguro social están en esta cartera, y por eso
        lleva «seguridad social» además de «sanidad».

