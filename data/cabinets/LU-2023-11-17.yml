    sources: [lu-jo-ri-2023-annexe-a, lu-jo-agd-2023-11-17-competences, lu-jo-agd-2023-12-13-competences-modif, lu-jo-agd-2025-12-11-competences-modif, lu-gouv-ministeres-fr, lu-gouv-ministeres-en, lu-gouv-composition]
    note:
      en: >-
        Held by Martine Hansen, who also holds the Ministère des Sports — two ministries, one
        cabinet seat. Consumer protection is tagged although the ministry's name does not
        mention it: annexe B gives this ministry a section "II. Protection des consommateurs",
        and the arrêté of 13 December 2023 made Hansen Minister for Consumer Protection.
        Luxembourg had a free-standing Ministère de la Protection des consommateurs until
        2023 and no longer does, so a reader comparing with earlier years will find one
        ministry fewer here for that reason and not because the function disappeared.
      es: >-
        A cargo de Martine Hansen, que ostenta además el Ministère des Sports: dos
        ministerios, un asiento en el gabinete. Se etiqueta protección de los consumidores
        aunque el nombre del ministerio no la mencione: el anexo B le da una sección
        «II. Protection des consommateurs», y el arrêté de 13 de diciembre de 2023 hizo a
        Hansen ministra de Protección de los Consumidores. Luxemburgo tuvo un Ministère de la
        Protection des consommateurs autónomo hasta 2023 y ya no lo tiene, así que quien
        compare con años anteriores encontrará aquí un ministerio menos por esa razón y no
        porque la función haya desaparecido.

