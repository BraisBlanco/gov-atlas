        entity carries more tags than its title would suggest. Eric Thill is Minister
        Delegate for Tourism within it. Luxembourg has no separate energy ministry in this
        cabinet, so energy is tagged here.
      es: >-
        A cargo de Lex Delles, cuyo título completo es ministro de Economía, Pymes, Energía y
        Turismo. El nombre del ministerio en el anexo A es sólo «Ministère de l'Économie»,
        pero el anexo B lo constituye en cuatro secciones —Économie, PME, Énergie y
        Tourisme— y las áreas de política siguen esa constitución y no el nombre desnudo, por
        lo que esta entidad lleva más etiquetas de las que su título sugiere. Eric Thill es
        ministro delegado de Turismo dentro de él. Este gabinete no tiene un ministerio de
        Energía separado, así que la energía se etiqueta aquí.

