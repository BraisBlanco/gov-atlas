      en: >-
        Held by Yuriko Backes, who also holds Defence within the foreign-affairs ministry and
        the Ministère de la Mobilité et des Travaux publics — three ministries, one cabinet
        seat. Luxembourg is one of the few countries in this dataset with a free-standing
        equality ministry.
      es: >-
        A cargo de Yuriko Backes, que ostenta además Defensa dentro del ministerio de
        Exteriores y el Ministère de la Mobilité et des Travaux publics: tres ministerios, un
        asiento. Luxemburgo es uno de los pocos países de este conjunto de datos con un
        ministerio de Igualdad autónomo.

