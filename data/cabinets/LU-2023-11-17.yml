entities:
  # --- the twenty ministries of annexe A, in the gazette's own order -------------
  - id: LU-2023-etat
    order: 1
    name_original: Ministère d’État
    abbreviation_original: null
    name_en: Ministry of State
    name_es: Ministerio de Estado
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Premier ministre
    head_title_en: Prime Minister
    has_cabinet_seat: true
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: head_of_government_office
    url: https://me.gouvernement.lu/fr.html
    sources: [lu-jo-ri-2023-annexe-a, lu-jo-ri-2023-organisation, lu-jo-agd-2023-11-17-competences, lu-gouv-ministeres-fr, lu-gouv-ministeres-en]
    note:
      en: >-
        The Prime Minister's own department, headed by Luc Frieden. Annexe A lists it as
        ministry number 1 and article 8 of the règlement interne provides that the Prime
        Minister directs it, so Luxembourg law does constitute it as a ministry; it is
        excluded here under the project's default for the office of the head of government,
        which is what makes the count 19 rather than 20. It is a substantial department, not
        a bare chancellery: annexe B attaches to it the media and electronic-communications
        portfolios, space policy and the State's shareholding in SES, data protection,
        relations with religious communities, the intelligence service, the
        Haut-Commissariat à la Protection nationale and relations with the Chamber of
        Deputies. Two of Elisabeth Margue's delegated mandates sit inside it and are
        recorded separately further down.
      es: >-
        El departamento propio del primer ministro, encabezado por Luc Frieden. El anexo A lo
        enumera como ministerio número 1 y el artículo 8 del règlement interne dispone que lo
        dirige el primer ministro, de modo que el derecho luxemburgués sí lo constituye como
        ministerio; aquí se excluye conforme al criterio por defecto del proyecto para la
        oficina del jefe de gobierno, y eso es lo que hace que la cifra sea 19 y no 20. Es un
        departamento sustancial y no una cancillería desnuda: el anexo B le adscribe las
        carteras de medios y comunicaciones electrónicas, la política espacial y la
        participación del Estado en SES, la protección de datos, las relaciones con las
        comunidades religiosas, el servicio de inteligencia, el Haut-Commissariat à la
        Protection nationale y las relaciones con la Cámara de Diputados. Dos de los mandatos
        delegados de Elisabeth Margue están dentro de él y se registran aparte más abajo.

  - id: LU-2023-affaires-etrangeres
    order: 2
    name_original: >-
      Ministère des Affaires étrangères et européennes, de la Défense, de la Coopération et du
      Commerce extérieur
    abbreviation_original: MAEE
    name_en: >-
      Ministry of Foreign and European Affairs, Defence, Development Cooperation and Foreign
      Trade
    name_es: >-
      Ministerio de Asuntos Exteriores y Europeos, Defensa, Cooperación y Comercio Exterior
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministre
    head_title_en: Minister
    has_cabinet_seat: true
    head_count: 2
    shared_head_with: [LU-2023-egalite-genres, LU-2023-mobilite]
    policy_areas: [foreign_affairs, european_affairs, defence, development_cooperation, trade]
    counts_as_ministry: true
    url: https://maee.gouvernement.lu/fr.html
    sources: [lu-jo-ri-2023-annexe-a, lu-jo-agd-2023-11-17-competences, lu-jo-agd-2023-12-13-competences-modif, lu-gouv-ministeres-fr, lu-gouv-ministeres-en, lu-gouv-composition]
    note:
      en: >-
        The only entity in this file with two ministers. Annexe B divides it into
        "I. Affaires étrangères et européennes, Coopération, Commerce extérieur et Grande
        Région", held by Xavier Bettel as Minister of Foreign Affairs and Foreign Trade and
        Minister of Development Cooperation and Humanitarian Affairs, and "II. Défense", held
        by Yuriko Backes as Minister of Defence. It is one ministry with head_count: 2, and it
        is linked to Backes's two other ministries so that this group of three departments
        resolves to two people rather than one. Bettel is also Deputy Prime Minister, a
        personal rank that adds neither a ministry nor a seat. The ministry also runs
        Luxembourg's relations with the Grande Région, the cross-border cooperation area, for
        which the taxonomy has no dedicated area.
      es: >-
        La única entidad de este fichero con dos ministros. El anexo B lo divide en
        «I. Affaires étrangères et européennes, Coopération, Commerce extérieur et Grande
        Région», a cargo de Xavier Bettel como ministro de Asuntos Exteriores y Comercio
        Exterior y ministro de Cooperación y Acción Humanitaria, y «II. Défense», a cargo de
        Yuriko Backes como ministra de Defensa. Es un ministerio con head_count: 2, vinculado
        a los otros dos ministerios de Backes para que este grupo de tres departamentos
        resuelva a dos personas y no a una. Bettel es además viceprimer ministro, rango
        personal que no añade ni ministerio ni asiento. El ministerio gestiona también las
        relaciones con la Grande Región, el área de cooperación transfronteriza, para la que
        la taxonomía no tiene área propia.

  - id: LU-2023-affaires-interieures
    order: 3
    name_original: Ministère des Affaires intérieures
    abbreviation_original: MINT
    name_en: Ministry of Home Affairs
    name_es: Ministerio de Asuntos Interiores
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ministre
    head_title_en: Minister
    has_cabinet_seat: true
    policy_areas: [interior, territorial_administration, civil_protection]
    counts_as_ministry: true
    url: https://mint.gouvernement.lu/fr.html
    sources: [lu-jo-ri-2023-annexe-a, lu-jo-agd-2023-11-17-competences, lu-gouv-ministeres-fr, lu-gouv-ministeres-en]
    note:
      en: >-
        Held by Léon Gloden. Luxembourg's home-affairs ministry combines what many countries
        split: the police and internal security, the rescue and fire service (CGDIS), and the
        supervision of the 100 communes, which is why it carries territorial_administration
        as well as interior. Immigration and asylum are not here — they sit with the family
        and reception ministry.
      es: >-
        A cargo de Léon Gloden. El ministerio del Interior luxemburgués reúne lo que muchos
        países separan: la policía y la seguridad interior, el servicio de rescate y bomberos
        (CGDIS) y la tutela de las 100 comunas, y por eso lleva administración territorial
        además de interior. La inmigración y el asilo no están aquí: corresponden al
        ministerio de Familia y Acogida.

