# Luxembourg — structure of the Frieden government.
#
# Read docs/DATA-CONTRACT.md alongside this file. Five Luxembourg-specific things to know:
#
#   1. Luxembourg has a genuinely clean tier-1 enumeration of its ministries, but it is no
#      longer in an "arrêté grand-ducal portant constitution des Ministères". Since the
#      revised Constitution came into force on 1 July 2023, the list lives in annexe A of
#      the règlement interne du Gouvernement, which is itself published in the Journal
#      officiel. Article 4 of that règlement says so in as many words.
#   2. There are markedly more ministries than ministers. Twenty ministries, fifteen people.
#      Six ministers hold two or three ministries each, and those are recorded with
#      shared_head_with so that one person is one cabinet seat however many departments
#      they run.
#   3. One ministry has two ministers, which is the mirror image of the same problem. The
#      Ministère des Affaires étrangères et européennes, de la Défense, de la Coopération et
#      du Commerce extérieur is a single ministry in annexe A, but annexe B splits it into a
#      foreign-affairs section and a defence section, and the two are held by different
#      people. It therefore carries head_count: 2.
#   4. Ministerial titles and ministries are different lists. The competences decree confers
#      twenty-seven distinct mandates on those fifteen people; several of them
#      ("Ministre de la Protection des consommateurs", "Ministre de la Défense") name a
#      section of a ministry rather than a ministry.
#   5. The Ministère d'État is the Prime Minister's own department and is not counted, which
#      is why the derived figure is 19 and not 20. Both figures are given below.

country: LU
cabinet_id: LU-2023-11-17

cabinet_name_original: Gouvernement Frieden
cabinet_name_en: Frieden government
cabinet_name_es: Gobierno Frieden

head_of_government_title_original: Premier ministre
head_of_government_title_en: Prime Minister

took_office: 2023-11-17
left_office: null

methodology_notes:
  - en: >-
      Luxembourg is counted here as having 19 ministries and 15 cabinet seats, and the two
      numbers answer different questions. Annexe A of the règlement interne du Gouvernement
      enumerates 20 ministries; the Ministère d'État, the Prime Minister's own department, is
      recorded but not counted, which leaves 19. The 15 seats are the 15 people the
      competences decree of 17 November 2023, as amended, appoints to the government. The gap
      of four between 19 and 15 is not an error in either figure: it is what happens when one
      minister runs several departments.
    es: >-
      Luxemburgo se cuenta aquí con 19 ministerios y 15 asientos en el gabinete, y las dos
      cifras responden a preguntas distintas. El anexo A del règlement interne du
      Gouvernement enumera 20 ministerios; el Ministère d'État, el departamento propio del
      primer ministro, se registra pero no se cuenta, lo que deja 19. Los 15 asientos son las
      15 personas que el arreté de competencias de 17 de noviembre de 2023, en su versión
      modificada, nombra miembros del Gobierno. La diferencia de cuatro entre 19 y 15 no es un
      error de ninguna de las dos cifras: es lo que ocurre cuando un ministro dirige varios
      departamentos.
  - en: >-
      Why the ministries and the ministers are not merged into one number. Luxembourg keeps
      two separate legal instruments, and this project keeps them separate too. Annexe A of
      the règlement interne du Gouvernement says which departments exist; the arrêté
      grand-ducal portant attribution des compétences ministérielles says who runs them. Six
      of the fifteen ministers hold more than one ministry: Yuriko Backes holds three
      (Defence within the foreign-affairs ministry, Gender Equality and Diversity, Mobility
      and Public Works), and Martine Hansen, Claude Meisch, Stéphanie Obertin, Serge Wilmes
      and — counting her two delegated mandates — Elisabeth Margue hold two or three each.
      Collapsing the two lists into a single "number of ministries" would either lose four
      real departments or invent four ministers who do not exist. Each pairing is recorded
      as portfolios with a shared head, so the seat count is a count of people and the
      ministry count is a count of departments.
    es: >-
      Por qué no se fusionan los ministerios y los ministros en una sola cifra. Luxemburgo
      mantiene dos instrumentos jurídicos separados, y este proyecto los mantiene
      separados también. El anexo A del règlement interne du Gouvernement dice qué
      departamentos existen; el arrêté grand-ducal portant attribution des compétences
      ministérielles dice quién los dirige. Seis de los quince ministros ostentan más de un
      ministerio: Yuriko Backes ostenta tres (Defensa, dentro del ministerio de Exteriores,
      Igualdad de Géneros y Diversidad, y Movilidad y Obras Públicas), y Martine Hansen,
      Claude Meisch, Stéphanie Obertin, Serge Wilmes y —contando sus dos mandatos delegados—
      Elisabeth Margue ostentan dos o tres cada uno. Refundir las dos listas en un único
      «número de ministerios» perdería cuatro departamentos reales o inventaría cuatro
      ministros inexistentes. Cada emparejamiento se registra como carteras con titular
      compartido, de modo que el recuento de asientos cuenta personas y el de ministerios
      cuenta departamentos.
  - en: >-
      The Ministère d'État, and both resulting figures. Annexe A lists the Ministère d'État
      as ministry number 1, and article 8 of the règlement interne provides that the Prime
      Minister directs it, so Luxembourg law does constitute the head of government's office
      as a ministry. This project nevertheless excludes it, under its default rule that
      the office of the head of government is the apex of the cabinet
      rather than a portfolio department, and the count is therefore 19. Read the other way —
      counting every entry in the legal enumeration — Luxembourg has 20 ministries. Both
      figures are defensible and the choice is the project's, not Luxembourg's. The exclusion
      is a particularly close call here, because the Ministère d'État is not a
      bare chancellery: annexe B gives it substantive portfolios including media, electronic
      communications, space, data protection, relations with religious communities, the
      intelligence service and national security co-ordination.
    es: >-
      El Ministère d'État y las dos cifras resultantes. El anexo A enumera el Ministère
      d'État como ministerio número 1, y el artículo 8 del règlement interne dispone que lo
      dirige el primer ministro, de modo que el derecho luxemburgués sí constituye la oficina
      del jefe de gobierno como ministerio. Este proyecto lo excluye de todos modos,
      conforme a su criterio por defecto según el cual la oficina del jefe de
      gobierno es la cúspide del gabinete y no un departamento con cartera, y por eso la cifra
      es 19. Leído del otro modo —contando todas las entradas de la enumeración legal—
      Luxemburgo tiene 20 ministerios. Ambas cifras son defendibles y la elección es del
      proyecto, no de Luxemburgo. La exclusión es aquí especialmente discutible, porque el
      Ministère d'État no es una cancillería desnuda: el anexo B le atribuye
      carteras sustantivas como los medios, las comunicaciones electrónicas, el espacio, la
      protección de datos, las relaciones con las comunidades religiosas, el servicio de
      inteligencia y la coordinación de la seguridad nacional.
  - en: >-
      Where the enumerating instrument moved to, and why that matters for anyone checking
      this page. Until 2022 Luxembourg published an "arrêté grand-ducal portant constitution
      des Ministères" whose article 1 listed the departments; the last one is dated 22 August
      2022 and ceased to have effect on 1 July 2023, when the revised Constitution came into
      force. Since then the same two lists are annexes A and B of the règlement interne du
      Gouvernement, approved by arrêté grand-ducal and published in the Journal officiel.
      Anyone searching Legilux for "constitution des Ministères" will find nothing after
      2022 and may wrongly conclude that Luxembourg has stopped enumerating its ministries.
    es: >-
      Dónde ha ido a parar el instrumento que enumera los ministerios, y por qué importa a
      quien quiera comprobar esta ficha. Hasta 2022 Luxemburgo publicaba un «arrêté
      grand-ducal portant constitution des Ministères» cuyo artículo 1 enumeraba los
      departamentos; el último es de 22 de agosto de 2022 y dejó de surtir efecto el 1 de
      julio de 2023, al entrar en vigor la Constitución revisada. Desde entonces esas dos
      mismas listas son los anexos A y B del règlement interne du Gouvernement, aprobado por
      arrêté grand-ducal y publicado en el Journal officiel. Quien busque en Legilux
      «constitution des Ministères» no encontrará nada posterior a 2022 y podría concluir
      erróneamente que Luxemburgo ha dejado de enumerar sus ministerios.
  - en: >-
      One ministry, two ministers. The Ministère des Affaires étrangères et européennes, de
      la Défense, de la Coopération et du Commerce extérieur is a single ministry in annexe
      A, but annexe B divides it into "I. Affaires étrangères et européennes, Coopération,
      Commerce extérieur et Grande Région" and "II. Défense", and the competences decree
      gives the first to Xavier Bettel and the second to Yuriko Backes. It is recorded as one
      ministry with two heads, and linked to Backes's two other ministries, so that the
      seat arithmetic yields two people — Bettel and Backes — for this group rather than one.
      It is the only portfolio here with two heads, and the reason is not
      co-ministers of equal rank over the whole department but two ministers with distinct
      statutory sections of it.
    es: >-
      Un ministerio, dos ministros. El Ministère des Affaires étrangères et européennes, de
      la Défense, de la Coopération et du Commerce extérieur es un único ministerio en el
      anexo A, pero el anexo B lo divide en «I. Affaires étrangères et européennes,
      Coopération, Commerce extérieur et Grande Région» y «II. Défense», y el arrêté de
      competencias da la primera sección a Xavier Bettel y la segunda a Yuriko Backes. Se
      registra como un ministerio con dos titulares, vinculado a los otros dos ministerios de
      Backes, para que la aritmética de asientos dé dos personas —Bettel y Backes— en este
      grupo y no una. Es la única cartera con dos titulares aquí, y la razón
      no son co-ministros de igual rango sobre todo el departamento, sino dos ministros con
      secciones estatutarias distintas del mismo.
  - en: >-
      Ministerial titles are not ministries, and Luxembourg has far more of the former. As
      amended, article 1 of the competences decree confers 27 distinct mandates on 15 people,
      counting "Premier ministre" and "Vice-Premier ministre". Several of those mandates name
      a section of a ministry rather than a ministry: "Ministre de la Défense" is section II
      of the foreign-affairs ministry, "Ministre de la Protection des consommateurs" is
      section II of the agriculture ministry, and "Ministre de l'Économie, des PME, de
      l'Énergie et du Tourisme" is the whole of the four-section Ministère de l'Économie. A
      reader counting the "Ministre de ..." titles on the government's own composition page
      will therefore arrive at a much larger number than 19, without either source being
      wrong. This page counts departments named in annexe A.
    es: >-
      Los títulos ministeriales no son ministerios, y Luxemburgo tiene muchos más de los
      primeros. En su versión modificada, el artículo 1 del arrêté de competencias confiere 27
      mandatos distintos a 15 personas, contando «Premier ministre» y «Vice-Premier ministre».
      Varios de esos mandatos nombran una sección de un ministerio y no un ministerio:
      «Ministre de la Défense» es la sección II del ministerio de Exteriores, «Ministre de la
      Protection des consommateurs» es la sección II del de Agricultura, y «Ministre de
      l'Économie, des PME, de l'Énergie et du Tourisme» es la totalidad del Ministère de
      l'Économie, que tiene cuatro secciones. Quien cuente los títulos «Ministre de …» en la
      página de composición del propio Gobierno llegará por tanto a una cifra muy superior a
      19, sin que ninguna de las dos fuentes se equivoque. Esta ficha cuenta departamentos
      nombrados en el anexo A.
  - en: >-
      Three official languages, and why the names here are French. Luxembourgish is the
      national language and Luxembourgish, French and German are all official under the loi
      du 24 février 1984 sur le régime des langues, but that same law makes French the
      language in which legislation is drafted, and the Journal officiel publishes the
      règlement interne and the competences decree in French only. There is no authentic
      Luxembourgish or German text of the list of ministries to record, so unlike Belgium —
      where two language versions of the same decree are equally authentic — the names
      recorded here have a single original language, and no parallel-language note is
      possible for the ministries.
    es: >-
      Tres lenguas oficiales, y por qué los nombres aquí están en francés. El luxemburgués es
      la lengua nacional y el luxemburgués, el francés y el alemán son todos oficiales según
      la loi du 24 février 1984 sur le régime des langues, pero esa misma ley hace del francés
      la lengua en que se redacta la legislación, y el Journal officiel publica el règlement
      interne y el arrêté de competencias únicamente en francés. No existe un texto auténtico
      en luxemburgués o en alemán de la lista de ministerios que registrar, de modo que, a
      diferencia de Bélgica —donde dos versiones lingüísticas del mismo decreto son igualmente
      auténticas—, los nombres aquí registrados tienen una única lengua original, y
      no cabe una nota de lengua paralela para los ministerios.
  - en: >-
      The English names are the government's own. Unlike many governments, gouvernement.lu
      publishes an English edition that names the ministries themselves, not merely the
      ministers, and its list matches annexe A one for one and in the same order. The English
      names of every counted ministry are therefore marked as the government's own. The
      Spanish names are the project's own translations.
    es: >-
      Los nombres en inglés son del propio Gobierno. A diferencia de muchos gobiernos,
      gouvernement.lu publica una edición en inglés que nombra los ministerios mismos, y no
      sólo a los ministros, y su lista coincide uno a uno y en el mismo orden con el anexo A.
      Por eso los nombres ingleses de todos los ministerios contados se señalan como nombres
      oficiales. Los nombres en español son traducciones del proyecto.
  - en: >-
      The perimeter. This is a central-government file and Luxembourg has no regional tier,
      so nothing is excluded as subnational; the country's 100 communes are local authorities
      supervised by the Ministère des Affaires intérieures and are out of scope. This
      government has no secrétaires d'État at all, which article 2 of the règlement interne
      expressly allows for but which the competences decree does not appoint, so nothing is
      excluded on state-secretary grounds. What is excluded, besides the Ministère d'État, is
      three delegated ministerial mandates — two held by Elisabeth Margue inside the Ministère
      d'État and one held by Eric Thill inside the Ministère de l'Économie — which are
      competences within another minister's department rather than departments of their own.
      The Grand Duke, as head of state, is not part of the government and is not recorded.
    es: >-
      El perímetro. Este es una ficha de gobierno central y Luxemburgo no tiene nivel
      regional, así que nada se excluye por subnacional; las 100 comunas del país son
      entidades locales tuteladas por el Ministère des Affaires intérieures y quedan fuera de
      alcance. Este gobierno no tiene ningún secrétaire d'État, figura que el artículo 2 del
      règlement interne prevé expresamente pero que el arrêté de competencias no nombra, de
      modo que nada se excluye por ser cargo subalterno de ese tipo. Lo que sí se excluye,
      además del Ministère d'État, son tres mandatos ministeriales delegados —dos de Elisabeth
      Margue dentro del Ministère d'État y uno de Eric Thill dentro del Ministère de
      l'Économie—, que son competencias dentro del departamento de otro ministro y no
      departamentos propios. El Gran Duque, como jefe del Estado, no forma parte del Gobierno
      y no se registra.
  - en: >-
      A reshuffle, not a new cabinet. The government took office on 17 November 2023 and is
      still the sitting one, but its distribution of portfolios has changed twice. An arrêté
      of 13 December 2023 split Xavier Bettel's single foreign-affairs mandate in two and gave
      Martine Hansen consumer protection, and an arrêté of 11 December 2025 removed Georges
      Mischo from the government, made Marc Spautz Minister of Labour and moved Sport to
      Martine Hansen. Neither changed annexe A, so the 20 ministries have been the same
      throughout and no ministry is recorded with a start or end date of its own; what
      changed is who heads them, which this project records only through the shared-head
      groupings. A reader
      reconstructing the cabinet as it stood in 2024 should expect a different set of
      shared-head pairs, not a different set of ministries.
    es: >-
      Una remodelación, no un gabinete nuevo. El gobierno tomó posesión el 17 de noviembre de
      2023 y sigue siendo el vigente, pero su reparto de carteras ha cambiado dos veces. Un
      arrêté de 13 de diciembre de 2023 dividió en dos el mandato único de Exteriores de
      Xavier Bettel y dio a Martine Hansen la protección de los consumidores, y un arrêté de
      11 de diciembre de 2025 sacó a Georges Mischo del gobierno, hizo a Marc Spautz ministro
      de Trabajo y pasó Deportes a Martine Hansen. Ninguno modificó el anexo A, de modo que
      los 20 ministerios han sido los mismos todo el tiempo y ningún ministerio lleva fecha
      de inicio ni de fin propia; lo que cambió es quién los encabeza, y eso este proyecto
      sólo lo recoge a través de los grupos de titular compartido. Quien reconstruya el gabinete tal
      como estaba en 2024 debe esperar un conjunto distinto de parejas de titular compartido,
      no un conjunto distinto de ministerios.

sources:
  - id: lu-jo-ri-2023-annexe-a
    tier: 1
    type: official_gazette
    publisher: Journal officiel du Grand-Duché de Luxembourg
    title: >-
      Règlement interne du Gouvernement, annexe A – Énumération des Ministères (approuvé par
      arrêté grand-ducal du 27 novembre 2023, Journal officiel A n° 779 du 27 novembre 2023)
    url: https://data.legilux.public.lu/filestore/eli/etat/leg/ri/2023/11/27/a779/jo/fr/html/eli-etat-leg-ri-2023-11-27-a779-jo-fr-html.html
    archive_url: https://web.archive.org/web/20260728115534/https://data.legilux.public.lu/filestore/eli/etat/leg/ri/2023/11/27/a779/jo/fr/html/eli-etat-leg-ri-2023-11-27-a779-jo-fr-html.html
    lang: fr
    published: 2023-11-27
    accessed: 2026-07-28
    quote: |-
      Annexe A – Énumération des Ministères
      Article unique.
      Les Ministères portent la dénomination suivante :
      1. Ministère d’État ;
      2. Ministère des Affaires étrangères et européennes, de la Défense, de la Coopération et du Commerce extérieur ;
      3. Ministère des Affaires intérieures ;
      4. Ministère de l’Agriculture, de l’Alimentation et de la Viticulture ;
      5. Ministère de la Culture ;
      6. Ministère de la Digitalisation ;
      7. Ministère de l’Économie ;
      8. Ministère de l’Éducation nationale, de l’Enfance et de la Jeunesse ;
      9. Ministère de l’Égalité des genres et de la Diversité ;
      10. Ministère de l’Environnement, du Climat et de la Biodiversité ;
      11. Ministère de la Famille, des Solidarités, du Vivre ensemble et de l’Accueil ;
      12. Ministère des Finances ;
      13. Ministère de la Fonction publique ;
      14. Ministère de la Justice ;
      15. Ministère du Logement et de l’Aménagement du territoire ;
      16. Ministère de la Mobilité et des Travaux publics ;
      17. Ministère de la Recherche et de l’Enseignement supérieur ;
      18. Ministère de la Santé et de la Sécurité sociale ;
      19. Ministère des Sports ;
      20. Ministère du Travail.
    note: >-
      The tier-1 enumeration, quoted in full, and the instrument that fixes the order of the
      first twenty entities below. This is the successor to the former "arrêté grand-ducal
      portant constitution des Ministères": since the revised Constitution came into force on
      1 July 2023 the list is annexe A of the règlement interne du Gouvernement, which
      article 4 of that règlement identifies as the place where "l'énumération et la
      constitution des ministères" are fixed. The text is current: the règlement has been
      amended twice, by the modification of 25 October 2024 (which touched annexes B, C, D
      and E) and by that of 15 April 2026 (annexe E only), and neither altered annexe A, so
      no consolidated version differs from this original publication. Its canonical
      identifier is the ELI
      https://legilux.public.lu/eli/etat/leg/ri/2023/11/27/a779/jo; the url recorded here is
      the JO's own HTML rendering of the same text, which is the form the web archive
      captured, and which states that it is identical to the PDF.

  - id: lu-jo-ri-2023-organisation
    tier: 1
    type: official_gazette
    publisher: Journal officiel du Grand-Duché de Luxembourg
    title: >-
      Règlement interne du Gouvernement, articles 2, 4 et 8 (approuvé par arrêté grand-ducal
      du 27 novembre 2023, Journal officiel A n° 779 du 27 novembre 2023)
    url: https://data.legilux.public.lu/filestore/eli/etat/leg/ri/2023/11/27/a779/jo/fr/html/eli-etat-leg-ri-2023-11-27-a779-jo-fr-html.html
    archive_url: https://web.archive.org/web/20260728115534/https://data.legilux.public.lu/filestore/eli/etat/leg/ri/2023/11/27/a779/jo/fr/html/eli-etat-leg-ri-2023-11-27-a779-jo-fr-html.html
    lang: fr
    published: 2023-11-27
    accessed: 2026-07-28
    quote: |-
      Le Gouvernement se compose d’un Premier ministre, d’un ou de plusieurs Vice-premiers ministres, de ministres et, le cas échéant, d’un ou de plusieurs ministres délégués et secrétaires d’État.
      Le ministre délégué dispose d’une compétence propre dans le domaine d’un département ministériel qu’il s’est vu attribuer par voie d’arrêté grand-ducal.
      Chaque membre du Gouvernement a la direction d’un ou de plusieurs départements ministériels et exerce, relativement aux affaires de son département, les attributions que la Constitution, les lois et les règlements lui confèrent. L’énumération et la constitution des ministères sont fixées dans l’annexe A, respectivement l’annexe B du présent règlement.
      Il dirige le Ministère d’État.
    note: >-
      The same instrument as the entry above, cited separately because it supports different
      claims and a claim deserves the sentence that carries it. The fragments are articles 2
      (composition of the government, and the definition of a ministre délégué as holding a
      competence of his own inside another minister's department), 4 (each member directs one
      or more départements ministériels, and the annexes that list them) and 8 (the Prime
      Minister directs the Ministère d'État). Together these are why the Ministère d'État is
      treated as the head of government's office, why one person can hold several ministries
      without holding several seats, and why the three delegated mandates are not
      departments. Quoted in document order; the four fragments are not contiguous in the
      original.

  - id: lu-jo-agd-2023-11-17-competences
    tier: 1
    type: official_gazette
    publisher: Journal officiel du Grand-Duché de Luxembourg
    title: >-
      Arrêté grand-ducal du 17 novembre 2023 portant attribution des compétences
      ministérielles (Journal officiel A n° 743 du 17 novembre 2023)
    url: https://data.legilux.public.lu/filestore/eli/etat/leg/agd/2023/11/17/a743/jo/fr/html/eli-etat-leg-agd-2023-11-17-a743-jo-fr-html.html
    archive_url: https://web.archive.org/web/20260728115619/https://data.legilux.public.lu/filestore/eli/etat/leg/agd/2023/11/17/a743/jo/fr/html/eli-etat-leg-agd-2023-11-17-a743-jo-fr-html.html
    lang: fr
    published: 2023-11-17
    accessed: 2026-07-28
    quote: |-
      Art. 1er.
      Les compétences ministérielles sont attribuées comme suit :
      - Monsieur Luc FRIEDEN : Premier ministre ;
      - Monsieur Xavier BETTEL : Vice-Premier ministre ; Ministre des Affaires étrangères et européennes, de la Coopération, du Commerce extérieur et à la Grande Région ;
      - Madame Martine HANSEN : Ministre de l’Agriculture, de l’Alimentation et de la Viticulture ;
      - Monsieur Claude MEISCH : Ministre de l’Éducation nationale, de l’Enfance et de la Jeunesse ; Ministre du Logement et de l’Aménagement du territoire ;
      - Monsieur Lex DELLES : Ministre de l’Économie, des PME, de l’Énergie et du Tourisme ;
      - Madame Yuriko BACKES : Ministre de la Défense ; Ministre de l’Égalité des genres et de la Diversité ; Ministre de la Mobilité et des Travaux publics ;
      - Monsieur Max HAHN : Ministre de la Famille, des Solidarités, du Vivre ensemble et de l’Accueil ;
      - Monsieur Gilles ROTH : Ministre des Finances ;
      - Madame Martine DEPREZ : Ministre de la Santé et de la Sécurité sociale ;
      - Monsieur Léon GLODEN : Ministre des Affaires intérieures ;
      - Madame Stéphanie OBERTIN : Ministre de la Digitalisation ; Ministre de la Recherche et de l’Enseignement supérieur ;
      - Monsieur Georges MISCHO : Ministre des Sports ; Ministre du Travail ;
      - Monsieur Serge WILMES : Ministre de l’Environnement, du Climat et de la Biodiversité ; Ministre de la Fonction publique ;
      - Madame Elisabeth MARGUE : Ministre de la Justice ; Ministre déléguée auprès du Premier ministre, chargée des Médias et des Communications ; Ministre déléguée auprès du Premier ministre, chargée des Relations avec le Parlement ;
      - Monsieur Eric THILL : Ministre de la Culture ; Ministre délégué au Tourisme.
    note: >-
      The instrument that says who runs which ministry, quoted in full, and the source of
      every shared-head pairing recorded below. Article 3 provides that it takes effect on
      17 November 2023, which is this cabinet's took_office; the same day, a separate arrêté
      (Journal officiel A n° 741) appointed Luc Frieden Prime Minister. Two provisions of
      this article 1 have since been replaced and the quote is the text as first published,
      not as it stands today: read it with the two amending arrêtés cited below, which is
      what the entities follow. Legilux publishes no consolidated version of this arrêté.

  - id: lu-jo-agd-2023-12-13-competences-modif
    tier: 1
    type: official_gazette
    publisher: Journal officiel du Grand-Duché de Luxembourg
    title: >-
      Arrêté grand-ducal du 13 décembre 2023 portant modification de l’arrêté grand-ducal du
      17 novembre 2023 portant attribution des compétences ministérielles (Journal officiel
      A n° 804 du 13 décembre 2023)
    url: https://data.legilux.public.lu/filestore/eli/etat/leg/agd/2023/12/13/a804/jo/fr/html/eli-etat-leg-agd-2023-12-13-a804-jo-fr-html.html
    archive_url: https://web.archive.org/web/20260728115718/https://data.legilux.public.lu/filestore/eli/etat/leg/agd/2023/12/13/a804/jo/fr/html/eli-etat-leg-agd-2023-12-13-a804-jo-fr-html.html
    lang: fr
    published: 2023-12-13
    accessed: 2026-07-28
    quote: |-
      1° Le deuxième tiret prend la teneur suivante :
      « Monsieur Xavier BETTEL : Vice-Premier ministre ; Ministre des Affaires étrangères et du Commerce extérieur ; Ministre de la Coopération et de l’Action humanitaire ; » ;
      2° Le troisième tiret prend la teneur suivante :
      « Madame Martine HANSEN : Ministre de l’Agriculture, de l’Alimentation et de la Viticulture ; Ministre de la Protection des consommateurs ; » ;
      3° Le quatorzième tiret prend la teneur suivante :
      « Madame Elisabeth MARGUE : Ministre de la Justice ; Ministre déléguée auprès du Premier ministre, chargée des Médias et de la Connectivité ; Ministre déléguée auprès du Premier ministre, chargée des Relations avec le Parlement ; ».
    note: >-
      The first of the two amendments to the competences decree, in force from the day of
      publication. It matters to three entities: it splits Xavier Bettel's single
      foreign-affairs mandate into two, adds consumer protection to Martine Hansen — the
      section of the agriculture ministry that annexe B calls "II. Protection des
      consommateurs" — and renames one of Elisabeth Margue's delegated mandates from "Médias
      et des Communications" to "Médias et de la Connectivité". It creates no ministry:
      annexe A is untouched.

  - id: lu-jo-agd-2025-12-11-competences-modif
    tier: 1
    type: official_gazette
    publisher: Journal officiel du Grand-Duché de Luxembourg
    title: >-
      Arrêté grand-ducal du 11 décembre 2025 portant modification de l’arrêté modifié
      grand-ducal du 17 novembre 2023 portant attribution des compétences ministérielles
      (Journal officiel A n° 552 du 11 décembre 2025)
    url: https://data.legilux.public.lu/filestore/eli/etat/leg/agd/2025/12/11/a552/jo/fr/html/eli-etat-leg-agd-2025-12-11-a552-jo-fr-html.html
    archive_url: https://web.archive.org/web/20260728115846/https://data.legilux.public.lu/filestore/eli/etat/leg/agd/2025/12/11/a552/jo/fr/html/eli-etat-leg-agd-2025-12-11-a552-jo-fr-html.html
    lang: fr
    published: 2025-12-11
    accessed: 2026-07-28
    quote: |-
      1° Le douzième tiret est supprimé ;
      2° Après le deuxième tiret, il est inséré un troisième tiret nouveau, qui prend la teneur suivante :
      « - Monsieur Marc SPAUTZ : Ministre du Travail ; » ;
      3° Le troisième tiret ancien, devenu le quatrième tiret, est remplacé comme suit :
      « - Madame Martine HANSEN : Ministre de l’Agriculture, de l’Alimentation et de la Viticulture ; Ministre de la Protection des consommateurs ; Ministre des Sports ; ».
      Le présent arrêté entre en vigueur le jour de sa publication.
    note: >-
      The most recent amendment to the competences decree and the one that fixes the current
      distribution of portfolios. Deleting the twelfth tiret removed Georges Mischo, who had
      held Sport and Labour, from the government; Labour went to Marc Spautz as a new third
      tiret and Sport to Martine Hansen. The government still has fifteen members and annexe
      A still has twenty ministries, so this changed the shared-head groupings below but not
      the count. Verified as the last such amendment in force on 28 July 2026 by querying
      Legilux's SPARQL endpoint for every act whose title mentions "compétences
      ministérielles"; the only later related act is an arrêté of 17 July 2026 delegating
      signature for the Ministère de la Justice during the Minister's maternity leave in
      August and September 2026, which changes no attribution and is not recorded here.

