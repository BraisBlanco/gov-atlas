        protección internacional, y por eso este ministerio, y no Interior, lleva la etiqueta
        de migración; el propio nombre inglés del Gobierno lo traduce «Reception of Refugees».
        El ministerio gestiona además la política de discapacidad y los cuidados de larga
        duración para mayores, que su nombre no menciona.

