        el ministerio lo ostentaba Georges Mischo junto con Deportes, de modo que el estado de
        titular compartido de esta entidad cambió durante la legislatura mientras el
        ministerio no. La sigla MTEESS pervive del nombre anterior más largo, Ministère du
        Travail, de l'Emploi et de l'Économie sociale et solidaire, y sigue siendo la que usa
        su sitio web.

  # --- recorded, not counted: delegated ministerial mandates ---------------------
  - id: LU-2023-medias-delegue
    order: 21
    name_original: >-
      Ministre déléguée auprès du Premier ministre, chargée des Médias et de la Connectivité
    abbreviation_original: null
    name_en: >-
      Minister Delegate to the Prime Minister for Media and Connectivity
    name_es: >-
      Ministra delegada ante el Primer Ministro para los Medios y la Conectividad
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministre déléguée
    head_title_en: Minister Delegate
    has_cabinet_seat: true
    shared_head_with: [LU-2023-justice, LU-2023-relations-parlement-delegue]
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: junior_minister_or_state_secretary
    url: null
    sources: [lu-jo-ri-2023-organisation, lu-jo-agd-2023-11-17-competences, lu-jo-agd-2023-12-13-competences-modif, lu-gouv-composition]
    note:
      en: >-
        A delegated mandate held by Elisabeth Margue, who is Minister of Justice in her own
        right. Not a ministry: annexe A does not list it, and the competences it covers are
        section "I. Médias et Communications" of the Ministère d'État — media, the audiovisual
        sector, space and the State's holding in SES, electronic communications, postal
        services and data protection. Article 2 of the règlement interne defines a ministre
        délégué as holding a competence of his own within a département ministériel attributed
        by arrêté grand-ducal, which is more than a Spanish or German junior minister but
        still not a department; junior_minister_or_state_secretary is the closest reason in
        the project's vocabulary and is used with that caveat. It is recorded because it is a
        distinct mandate a reader will see on the government's composition page, and linked to
        Margue's ministry so it adds no cabinet seat. The title given is the one in force
        since 13 December 2023; it read "des Médias et des Communications" before that.
      es: >-
        Mandato delegado de Elisabeth Margue, que es ministra de Justicia por derecho propio.
        No es un ministerio: el anexo A no lo enumera, y las competencias que cubre son la
        sección «I. Médias et Communications» del Ministère d'État —medios, sector
        audiovisual, espacio y participación del Estado en SES, comunicaciones electrónicas,
        servicios postales y protección de datos—. El artículo 2 del règlement interne define
        al ministre délégué como titular de una competencia propia dentro de un département
        ministériel atribuida por arrêté grand-ducal, lo que es más que un secretario de
        Estado español o alemán pero sigue sin ser un departamento;
        junior_minister_or_state_secretary es el motivo más próximo del vocabulario del
        proyecto y se usa con esa reserva. Se registra porque es un mandato distinto que el
        lector verá en la página de composición del Gobierno, y se vincula al ministerio de
        Margue para que no añada asiento. El título es el vigente desde el 13 de diciembre de
        2023; antes decía «des Médias et des Communications».

