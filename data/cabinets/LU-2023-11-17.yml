      es: >-
        A cargo de Gilles Roth. A diferencia de Bélgica, Luxemburgo no separa presupuesto y
        hacienda: este único ministerio abarca la fiscalidad, el presupuesto, el Tesoro y la
        supervisión de la plaza financiera, y por eso lleva finanzas y presupuesto.

