      en: >-
        Took transport, communications, housing and town planning from the abolished Ministry
        of Public Works, Transport and the Environment, but not water infrastructure, which
        went to the new environment department. Communications left for science and
        technology in 2000.
      es: >-
        Asumió transportes, comunicaciones, vivienda y urbanismo del suprimido Ministerio de
        Obras Públicas, Transportes y Medio Ambiente, pero no las obras hidráulicas, que
        pasaron al nuevo departamento de Medio Ambiente. Las comunicaciones salieron hacia
        Ciencia y Tecnología en 2000.

