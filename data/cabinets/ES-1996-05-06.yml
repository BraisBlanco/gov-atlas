# Spain — government structure of the VI legislature (1996-2000).
#
# The earliest cabinet on record here, included so the history series has a value at the
# start of 2000 rather than beginning in April of that year, part-way through a term.
#
# Its enumerating decree is the only one in the Spanish series that exists solely as a
# scanned facsimile: the gazette's machine-readable text does not go back to 1996. The quote
# below was transcribed from the page image, not from optical character recognition, whose
# output for this scan is unusable.

country: ES
cabinet_id: ES-1996-05-06

cabinet_name_original: Gobierno de España, VI Legislatura
cabinet_name_en: Government of Spain, 6th legislature
cabinet_name_es: Gobierno de España, VI Legislatura

head_of_government_title_original: Presidente del Gobierno
head_of_government_title_en: Prime Minister

took_office: 1996-05-06
left_office: 2000-04-27

methodology_notes:
  - en: >-
      Fourteen ministerial departments, the smallest Spanish cabinet in this series. The
      restructuring that created it merged six departments away: justice and the interior
      were split into two, education absorbed culture, labour absorbed social affairs, and
      trade and tourism went to the economy and finance department.
    es: >-
      Catorce departamentos ministeriales, el gabinete español más reducido de esta serie. La
      reestructuración que lo creó suprimió seis departamentos: Justicia e Interior se
      dividió en dos, Educación absorbió Cultura, Trabajo absorbió Asuntos Sociales, y
      Comercio y Turismo pasó a Economía y Hacienda.
  - en: >-
      Fifteen seats against fourteen departments. The Prime Minister holds a seat without
      heading a department, and both vice-presidents were serving ministers — the first also
      held the Presidency department and the second economy and finance — so neither
      vice-presidency adds a seat. No minister was appointed without a portfolio.
    es: >-
      Quince asientos frente a catorce departamentos. El presidente del Gobierno ocupa un
      asiento sin encabezar departamento, y los dos vicepresidentes eran ministros en
      ejercicio —el primero encabezaba además el departamento de la Presidencia y el segundo
      Economía y Hacienda—, por lo que ninguna vicepresidencia añade asiento. Ningún ministro
      fue nombrado sin cartera.
  - en: >-
      The gazette prints the fifth department as "Ministerio de Interior", without the
      article that the name carries in every later decree and in ordinary usage. The
      spelling is reproduced as published, in the quoted enumeration and in the department's
      official name, rather than silently corrected.
    es: >-
      El diario oficial imprime el quinto departamento como «Ministerio de Interior», sin el
      artículo que el nombre lleva en todos los decretos posteriores y en el uso corriente.
      Se reproduce la grafía tal como se publicó, tanto en la enumeración citada como en el
      nombre oficial del departamento, en lugar de corregirla en silencio.

sources:
  - id: boe-rd-758-1996
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 758/1996, de 5 de mayo, de reestructuración de Departamentos ministeriales
    url: https://www.boe.es/boe/dias/1996/05/06/pdfs/A15707-15708.pdf
    archive_url: https://web.archive.org/web/20250916085116/https://www.boe.es/boe/dias/1996/05/06/pdfs/A15707-15708.pdf
    lang: es
    published: 1996-05-06
    accessed: 2026-07-29
    quote: |-
      Artículo 1.
      La Administración General del Estado queda estructurada en los siguientes Departamentos ministeriales:
      Ministerio de Asuntos Exteriores.
      Ministerio de Justicia.
      Ministerio de Defensa.
      Ministerio de Economía y Hacienda.
      Ministerio de Interior.
      Ministerio de Fomento.
      Ministerio de Educación y Cultura.
      Ministerio de Trabajo y Asuntos Sociales.
      Ministerio de Industria y Energía.
      Ministerio de Agricultura, Pesca y Alimentación.
      Ministerio de la Presidencia.
      Ministerio de Administraciones Públicas.
      Ministerio de Sanidad y Consumo.
      Ministerio de Medio Ambiente.
    note: >-
      Pages 15707-15708 of issue 110, as published. A scanned facsimile: the gazette
      publishes no machine-readable text for 1996, so this enumeration was transcribed from
      the page image. In force the day it was published.

  - id: boe-rd-762-1996
    tier: 1
    type: official_gazette
    publisher: Boletín Oficial del Estado
    title: >-
      Real Decreto 762/1996, de 5 de mayo, por el que se nombran Ministros del Gobierno
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-1996-9947
    archive_url: https://web.archive.org/web/20250124020413/https://www.boe.es/diario_boe/txt.php?id=BOE-A-1996-9947
    lang: es
    published: 1996-05-06
    accessed: 2026-07-29
    quote: |-
      Ministro de Asuntos Exteriores a don Abel Matutes Juan.
      Ministra de Justicia a doña Margarita Mariscal de Gante y Mirón.
      Ministro de Defensa a don Eduardo Serra Rexach.
      Ministro de Economía y Hacienda a don Rodrigo de Rato y Figaredo.
      Ministro de Interior a don Jaime Mayor Oreja.
      Ministro de Fomento a don Rafael Arias-Salgado y Montalvo.
      Ministra de Educación y Cultura a doña Esperanza Aguirre y Gil de Biedma.
      Ministro de Trabajo y Asuntos Sociales a don Javier Arenas Bocanegra.
      Ministro de Industria y Energía a don Josep Piqué i Camps.
      Ministra de Agricultura, Pesca y Alimentación a doña Loyola de Palacio del Valle-Lersundi.
      Ministro de la Presidencia a don Francisco Alvarez-Cascos Fernández.
      Ministro de Administraciones Públicas a don Mariano Rajoy Brey.
      Ministro de Sanidad y Consumo a don José Manuel Romay Beccaría.
      Ministra de Medio Ambiente a doña Isabel Tocino Biscarolasaga.
    note: >-
      Fourteen ministers for fourteen departments, one each and none without a portfolio,
      which is what makes the seat count fifteen once the Prime Minister is added. It also
      shows that the two vice-presidents appointed the same day each headed a department:
      the first the Presidency, the second economy and finance.

  - id: ce-art-98
    tier: 1
    type: statute
    publisher: Boletín Oficial del Estado
    title: Constitución Española (texto consolidado)
    url: https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229
    archive_url: https://web.archive.org/web/20260728064320/https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229
    lang: es
    published: 1978-12-29
    accessed: 2026-07-29
    quote: >-
      El Gobierno se compone del Presidente, de los Vicepresidentes, en su caso, de los
      Ministros y de los demás miembros que establezca la ley.
    note: >-
      Article 98.1, cited for the composition of the Government rather than the Ley del
      Gobierno used for later cabinets: that statute is from November 1997 and was not in
      force when this government took office.

