entities:
  # --- the twelve ministries, in the statutory order of section 1 of the valtioneuvostolaki
  - id: FI-2023-valtioneuvoston-kanslia
    order: 1
    name_original: Valtioneuvoston kanslia
    abbreviation_original: VNK
    name_en: Prime Minister's Office
    name_es: Oficina del Primer Ministro
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Pääministeri
    head_title_en: Prime Minister
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [government_coordination, european_affairs, state_assets]
    counts_as_ministry: true
    url: https://vnk.fi/
    sources: [laki-valtioneuvostosta-175-2003, vn-ministerien-tyonjako-2026-06-16, vn-orpon-hallitus, vn-en-ministries]
    note:
      en: >-
        The contested entity in this file, and counted. It is both the Prime Minister's own
        department and one of the twelve ministries listed in section 1 of the
        valtioneuvostolaki, and the government's division of duties says the Prime Minister
        acts as its päällikkö. Excluding it under head_of_government_office would give
        Finland 11 ministries instead of 12; see the first methodology note. Tagged
        european_affairs because the EU secretariat of the government sits here, and
        state_assets because state ownership steering does — both handled by the minister for
        European affairs and ownership steering, who is recorded separately and uncounted.
        Its seat is the Prime Minister's, so no separate office of the Prime Minister is
        recorded.
      es: >-
        La entidad discutida de este fichero, y contada. Es a la vez el departamento propio
        del primer ministro y uno de los doce ministerios enumerados en el artículo 1 de la
        valtioneuvostolaki, y el reparto de funciones del gobierno dice que el primer ministro
        actúa como su päällikkö. Excluirla por head_of_government_office daría 11 ministerios
        en lugar de 12; véase la primera nota metodológica. Se etiqueta european_affairs
        porque aquí está el secretariado de la UE del gobierno, y state_assets porque aquí
        está la gestión de la propiedad estatal —ambas las tramita el ministro de Asuntos
        Europeos y Gestión de la Propiedad Estatal, registrado aparte y sin contarse—. Su
        asiento es el del primer ministro, por lo que no se registra aparte ninguna oficina
        del primer ministro.

  - id: FI-2023-ulkoministerio
    order: 2
    name_original: Ulkoministeriö
    abbreviation_original: UM
    name_en: Ministry for Foreign Affairs
    name_es: Ministerio de Asuntos Exteriores
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Ulkoministeri
    head_title_en: Minister for Foreign Affairs
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [foreign_affairs, development_cooperation, trade]
    counts_as_ministry: true
    url: https://um.fi/
    sources: [laki-valtioneuvostosta-175-2003, vn-ministerien-tyonjako-2026-06-16, vn-orpon-hallitus, vn-en-ministries]
    note:
      en: >-
        Called ulkoasiainministeriö in the statute until 1 December 2017, when act 837/2017
        renamed it ulkoministeriö; the statutory list carries the current name. Three ministers
        handle matters here — the minister for foreign affairs as head, the minister for
        foreign trade and development for development cooperation and foreign trade, and the
        minister of education for Nordic cooperation — but there is one ministry and one head,
        so one seat is counted here and the other two ministers are counted where they are
        recorded.
      es: >-
        En la ley se llamaba ulkoasiainministeriö hasta el 1 de diciembre de 2017, cuando la
        ley 837/2017 lo renombró ulkoministeriö; la lista legal recoge el nombre actual. Aquí
        tramitan asuntos tres ministros —la de Exteriores como jefa, el de Comercio Exterior y
        Desarrollo para la cooperación al desarrollo y el comercio exterior, y el de Educación
        para la cooperación nórdica—, pero hay un ministerio y una jefa, así que aquí se cuenta
        un asiento y los otros dos ministros se cuentan donde están registrados.

  - id: FI-2023-oikeusministerio
    order: 3
    name_original: Oikeusministeriö
    abbreviation_original: OM
    name_en: Ministry of Justice
    name_es: Ministerio de Justicia
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Oikeusministeri
    head_title_en: Minister of Justice
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [justice, territorial_administration]
    counts_as_ministry: true
    url: https://oikeusministerio.fi/
    sources: [laki-valtioneuvostosta-175-2003, vn-ministerien-tyonjako-2026-06-16, vn-orpon-hallitus, vn-en-ministries]
    note:
      en: >-
        Tagged territorial_administration for one specific reason: Åland affairs are a
        portfolio of this ministry, handled by the minister of local government and regional
        affairs. Åland's own autonomous government is out of scope as a subnational
        government.
      es: >-
        Se etiqueta territorial_administration por una razón concreta: los asuntos de Åland
        son una cartera de este ministerio, que tramita la ministra de Administración Local y
        Regional. El gobierno autónomo de Åland queda fuera de alcance como gobierno
        subnacional.

  - id: FI-2023-sisaministerio
    order: 4
    name_original: Sisäministeriö
    abbreviation_original: SM
    name_en: Ministry of the Interior
    name_es: Ministerio del Interior
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Sisäministeri
    head_title_en: Minister of the Interior
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [interior, migration, civil_protection]
    counts_as_ministry: true
    url: https://intermin.fi/
    sources: [laki-valtioneuvostosta-175-2003, vn-ministerien-tyonjako-2026-06-16, vn-orpon-hallitus, vn-en-ministries]
    note:
      en: >-
        Finland has no separate migration ministry: immigration and asylum are this
        ministry's, along with the police and the rescue services. Integration, by contrast,
        belongs to the Ministry of Economic Affairs and Employment, where this ministry's
        minister handles it — a division that this dataset records on the ministries rather
        than on the minister.
      es: >-
        Finlandia no tiene un ministerio de migración propio: la inmigración y el asilo
        corresponden a este ministerio, junto con la policía y los servicios de rescate. La
        integración, en cambio, corresponde al Ministerio de Economía y Empleo, donde la
        tramita la ministra de este ministerio: una división que este dataset registra en los
        ministerios y no en la ministra.

