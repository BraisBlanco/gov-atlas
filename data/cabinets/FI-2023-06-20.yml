    note:
      en: >-
        One minister, who handles every matter in the ministry's remit. The remit is wide:
        agriculture, forestry, fisheries and game, food and food safety, rural development and
        water resources, which is why the tag list is longer than the two-word name suggests.
      es: >-
        Una sola ministra, que tramita todos los asuntos del ámbito del ministerio. El ámbito
        es amplio: agricultura, silvicultura, pesca y caza, alimentación y seguridad
        alimentaria, desarrollo rural y recursos hídricos, y por eso la lista de etiquetas es
        más larga de lo que sugiere un nombre de dos palabras.

