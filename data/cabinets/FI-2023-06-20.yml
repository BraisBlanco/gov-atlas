    note:
      en: >-
        Two ministers: the minister of social affairs and health as head, and the minister of
        social security for the social insurance department, the labour and gender equality
        department and the occupational safety and health department. Finland has no equality
        ministry, and the equality tag sits here because the gender equality unit is a
        department of this ministry.
      es: >-
        Dos ministros: el de Asuntos Sociales y Salud como jefe, y la de Seguridad Social para
        el departamento de seguros sociales, el de trabajo e igualdad y el de seguridad y
        salud. Finlandia no tiene ministerio de igualdad, y la etiqueta equality está aquí
        porque la unidad de igualdad es un departamento de este ministerio.

  - id: FI-2023-ymparistoministerio
    order: 12
    name_original: Ympäristöministeriö
