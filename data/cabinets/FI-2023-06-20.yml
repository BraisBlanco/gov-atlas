  - id: FI-2023-valtiovarainministerio
    order: 6
    name_original: Valtiovarainministeriö
    abbreviation_original: VM
    name_en: Ministry of Finance
    name_es: Ministerio de Finanzas
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Valtiovarainministeri
    head_title_en: Minister of Finance
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [finance, budget, public_administration, territorial_administration, digital]
    counts_as_ministry: true
    url: https://vm.fi/
    sources: [laki-valtioneuvostosta-175-2003, vn-ministerien-tyonjako-2026-06-16, vn-orpon-hallitus, vn-en-ministries]
    note:
      en: >-
        Three ministers handle matters in this ministry: the minister of finance as head, the
        minister of local government and regional affairs (local and regional administration,
        employer and personnel policy, public-sector ICT, the state controller function and
        statistics) and the minister of economic affairs (the financial markets department,
        apart from state borrowing and debt management). The digital and
        territorial_administration tags come from the second of those, and neither is visible
        in the ministry's name.
      es: >-
        Tres ministros tramitan asuntos en este ministerio: la de Finanzas como jefa, la de
        Administración Local y Regional (administración local y regional, política de personal,
        TIC del sector público, función de controlador del Estado y estadísticas) y el de
        Economía (el departamento de mercados financieros, salvo el endeudamiento y la gestión
        de la deuda del Estado). Las etiquetas digital y territorial_administration vienen de
        la segunda, y ninguna se aprecia en el nombre del ministerio.

  - id: FI-2023-opetus-ja-kulttuuriministerio
    order: 7
    name_original: Opetus- ja kulttuuriministeriö
    abbreviation_original: OKM
    name_en: Ministry of Education and Culture
    name_es: Ministerio de Educación y Cultura
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Opetusministeri
    head_title_en: Minister of Education
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [education, culture, higher_education, research, sport, youth, religion]
    counts_as_ministry: true
    url: https://okm.fi/
    sources: [laki-valtioneuvostosta-175-2003, vn-ministerien-tyonjako-2026-06-16, vn-orpon-hallitus, vn-en-ministries]
    note:
      en: >-
        The most crowded ministry in Finland: three of the nineteen ministers handle matters
        here — the minister of education as head, the minister of science and culture for the
        higher education, science, culture and arts departments, and the minister of sport,
        exercise and youth for the youth and sport department and student financial aid.
        Church affairs (kirkollisasiat) are also this ministry's and are expressly reserved to
        its head, which is why religion is tagged here.
      es: >-
        El ministerio más concurrido de Finlandia: tres de los diecinueve ministros tramitan
        asuntos aquí —el de Educación como jefe, la de Ciencia y Cultura para los
        departamentos de universidades, ciencia, cultura y artes, y el de Deporte y Juventud
        para el departamento de juventud y deporte y las ayudas al estudio—. Los asuntos
        eclesiásticos (kirkollisasiat) también son de este ministerio y están expresamente
        reservados a su jefe, y por eso se etiqueta religion aquí.

  - id: FI-2023-maa-ja-metsatalousministerio
    order: 8
    name_original: Maa- ja metsätalousministeriö
    abbreviation_original: MMM
