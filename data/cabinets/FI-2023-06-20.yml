      en: >-
        Works inside the sosiaali- ja terveysministeriö, handling the social insurance, labour
        and gender equality, and occupational safety and health departments. This is the post
        whose holder changed on 16 June 2026, when Karoliina Partanen replaced Sanni
        Grahn-Laasonen for the duration of her family leave; the post itself is unchanged.
      es: >-
        Trabaja dentro del sosiaali- ja terveysministeriö y tramita los departamentos de
        seguros sociales, de trabajo e igualdad y de seguridad y salud laboral. Es el puesto
        cuyo titular cambió el 16 de junio de 2026, cuando Karoliina Partanen sustituyó a
        Sanni Grahn-Laasonen durante su permiso familiar; el puesto en sí no ha cambiado.
