    note:
      en: >-
        One minister, styled minister of the environment and climate, who also coordinates
        climate policy across the government and handles the energy department of the Ministry
        of Economic Affairs and Employment. Housing and the built environment are this
        ministry's, which is why housing and spatial_planning are tagged here and not on a
        housing ministry: Finland has none.
      es: >-
        Una sola ministra, titulada de Medio Ambiente y Clima, que además coordina la política
        climática en el conjunto del gobierno y tramita el departamento de energía del
        Ministerio de Economía y Empleo. La vivienda y el entorno construido son de este
        ministerio, y por eso housing y spatial_planning se etiquetan aquí y no en un
        ministerio de vivienda: Finlandia no tiene ninguno.

  # --- recorded, not counted: the seven ministers who head no ministry -------------------
  # Section 4 of the valtioneuvostolaki allows a minister to handle matters within the remit
  # of ministries instead of heading one. Each holds full ministerial rank and a seat in the
  # valtioneuvosto, so each adds a cabinet seat and no ministry. Order follows the
  # government's own roster.
  - id: FI-2023-eurooppa-ja-omistajaohjausministeri
    order: 13
    name_original: Eurooppa- ja omistajaohjausministeri
    abbreviation_original: null
    name_en: Minister for European Affairs and Ownership Steering
    name_es: Ministro de Asuntos Europeos y Gestión de la Propiedad Estatal
    name_en_provenance: translated
    name_es_provenance: translated
    head_title_original: Ministeri
    head_title_en: Minister
    has_cabinet_seat: true
    head_count: 1
    policy_areas: []
    counts_as_ministry: false
    exclusion_reason: minister_without_portfolio
    url: null
    sources: [vn-ministerien-tyonjako-2026-06-16, vn-orpon-hallitus, laki-valtioneuvostosta-175-2003]
    note:
      en: >-
        Works inside the valtioneuvoston kanslia, handling the EU secretariat matters that do
        not belong to the Prime Minister, and state ownership steering. There is no ministry
        of European affairs and none of state ownership. The exclusion reason
        minister_without_portfolio is the closest fit in the project's vocabulary and is
        slightly misleading in the Finnish context: this minister has a defined portfolio,
        just no department of their own.
      es: >-
        Trabaja dentro de la valtioneuvoston kanslia y tramita los asuntos del secretariado
        de la UE que no corresponden al primer ministro, así como la gestión de la propiedad
        estatal. No existe un ministerio de Asuntos Europeos ni uno de propiedad estatal. El
        motivo de exclusión minister_without_portfolio es el más aproximado del vocabulario
        del proyecto y resulta algo engañoso en el contexto finlandés: este ministro sí tiene
        cartera definida, lo que no tiene es departamento propio.

