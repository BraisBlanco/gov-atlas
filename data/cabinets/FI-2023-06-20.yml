    note:
      en: >-
        The clearest illustration of why Finnish ministers cannot be mapped one-to-one onto
        ministries: this minister handles Åland affairs in the Ministry of Justice, local and
        regional administration, employer and personnel policy, public-sector ICT, the state
        controller function and statistics in the Ministry of Finance, and urban development
        in the Ministry of Economic Affairs and Employment. Three ministries, one minister,
        one seat, no ministry of local government.
      es: >-
        La ilustración más clara de por qué los ministros finlandeses no se pueden asignar uno
        a uno a los ministerios: esta ministra tramita los asuntos de Åland en el Ministerio de
        Justicia; la administración local y regional, la política de personal, las TIC del
        sector público, la función de controlador del Estado y las estadísticas en el
        Ministerio de Finanzas; y el desarrollo urbano en el Ministerio de Economía y Empleo.
        Tres ministerios, una ministra, un asiento y ningún ministerio de administración local.

