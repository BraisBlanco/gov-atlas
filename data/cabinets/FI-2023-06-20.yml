  - id: FI-2023-tyo-ja-elinkeinoministerio
    order: 10
    name_original: Työ- ja elinkeinoministeriö
    abbreviation_original: TEM
    name_en: Ministry of Economic Affairs and Employment
    name_es: Ministerio de Economía y Empleo
    name_en_provenance: official
    name_es_provenance: translated
    head_title_original: Työministeri
    head_title_en: Minister of Employment
    has_cabinet_seat: true
    head_count: 1
    policy_areas: [labour, economy, industry, energy, innovation, regional_development]
    counts_as_ministry: true
    url: https://tem.fi/
    sources: [laki-valtioneuvostosta-175-2003, vn-ministerien-tyonjako-2026-06-16, vn-orpon-hallitus, vn-en-ministries]
    note:
      en: >-
        Five of the nineteen ministers handle matters in this ministry, more than anywhere
        else in the Finnish government: the minister of employment as head, the minister of
        economic affairs (innovation and business finance, security of supply, regional
        growth services), the minister of the environment and climate (the energy
        department), the minister of local government and regional affairs (urban
        development) and the minister of the interior (integration). The energy tag therefore
        sits here rather than on the Ministry of the Environment, whose minister handles it:
        this dataset tags the ministry that holds the subject matter.
      es: >-
        Cinco de los diecinueve ministros tramitan asuntos en este ministerio, más que en
        ningún otro del gobierno finlandés: el de Trabajo como jefe, el de Economía
        (innovación y financiación empresarial, seguridad de abastecimiento, servicios
        regionales de crecimiento), la de Medio Ambiente y Clima (el departamento de
        energía), la de Administración Local y Regional (desarrollo urbano) y la del Interior
        (integración). La etiqueta energy está por tanto aquí y no en el Ministerio de Medio
        Ambiente, cuya ministra la tramita: este dataset etiqueta al ministerio que tiene la
        materia.

  - id: FI-2023-sosiaali-ja-terveysministerio
