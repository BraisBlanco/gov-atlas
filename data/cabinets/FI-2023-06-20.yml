# Finland — government structure of pääministeri Petteri Orpon hallitus.
#
# See docs/DATA-CONTRACT.md. Three things worth knowing before reading the list:
#
#   1. Finland is the one country in this dataset whose ministries are enumerated in a
#      statute. Section 1 of the valtioneuvostolaki (laki valtioneuvostosta 175/2003) says
#      "Valtioneuvostossa on seuraavat ministeriöt" and lists twelve. Creating or abolishing
#      a Finnish ministry means amending that list, so the count is a legal fact rather than
#      a reading of a reorganisation decree.
#   2. Twelve ministries, nineteen ministers. Section 4 of the same Act provides that a
#      minister either heads a ministry or handles matters within the remit of ministries,
#      and the government's published division of duties names one head (päällikkö) per
#      ministry and assigns the other seven ministers to subject areas inside one or more
#      ministries. Those seven are recorded here, uncounted, which is what makes the seat
#      count come out at 19.
#   3. Finnish ministers cross ministries. The minister for local and regional government
#      handles matters in three ministries; the minister of education handles Nordic
#      cooperation inside the Ministry for Foreign Affairs; the minister of the environment
#      and climate handles the energy department of the Ministry of Economic Affairs and
#      Employment. A Finnish minister's title therefore says little about which ministry the
#      minister sits in, and nothing about how many ministries there are.

country: FI
cabinet_id: FI-2023-06-20

cabinet_name_original: Pääministeri Petteri Orpon hallitus
cabinet_name_en: Orpo government
cabinet_name_es: Gobierno Orpo

head_of_government_title_original: Pääministeri
head_of_government_title_en: Prime Minister

took_office: 2023-06-20
left_office: null

methodology_notes:
  - en: >-
      12 ministries and 19 cabinet seats. The twelve are the ministries listed in section 1
      of the valtioneuvostolaki, and the list includes the valtioneuvoston kanslia, the
      Prime Minister's Office, which is counted here. That is the contested decision in this
      file: excluding it as the office of the head of government, the way this project
      excludes Spain's Presidencia del Gobierno, would give Finland 11. It is counted
      because Finnish law does not treat it as an office attached to the Prime Minister but
      as one of the ministries — it appears in the statutory list on the same footing as the
      other eleven, it has its own chapter in the budget, it has a minister of its own
      besides the Prime Minister (the minister for European affairs and ownership steering),
      and the government's own division of duties says the Prime Minister "toimii
      valtioneuvoston kanslian päällikkönä", acts as head of the ministry. Both figures are
      published here so a reader can choose: 12 ministries including the Prime Minister's
      Office, 11 excluding it.
    es: >-
      12 ministerios y 19 asientos en el gabinete. Los doce son los ministerios enumerados en
      el artículo 1 de la valtioneuvostolaki, y la lista incluye la valtioneuvoston kanslia,
      la Oficina del Primer Ministro, que aquí se cuenta. Esa es la decisión discutible de
      este fichero: excluirla como oficina del jefe de gobierno, tal como este proyecto
      excluye la Presidencia del Gobierno española, daría 11. Se cuenta porque el derecho
      finlandés no la trata como un cargo adscrito al primer ministro sino como uno de los
      ministerios: figura en la lista legal en pie de igualdad con los otros once, tiene su
      propio capítulo presupuestario, tiene un ministro propio además del primer ministro (el
      ministro de Asuntos Europeos y Gestión de la Propiedad Estatal) y el propio reparto de
      funciones del gobierno dice que el primer ministro «toimii valtioneuvoston kanslian
      päällikkönä», actúa como jefe del ministerio. Aquí se publican ambas cifras para que el
      lector elija: 12 ministerios contando la Oficina del Primer Ministro, 11 sin contarla.
  - en: >-
      Why seven ministers are recorded but not counted. Section 4 of the valtioneuvostolaki
      is explicit that a minister either heads a ministry or handles matters belonging to
      the remit of ministries ("Ministeri toimii ministeriön päällikkönä tai käsittelee
      ministeriöiden toimialaan kuuluvia asioita"), and that where several ministers are
      appointed to the same ministry they are co-equal rather than subordinate to one
      another. The government's division of duties of 16 June 2026 names the head of each of
      the twelve ministries and sets out what the other seven ministers handle: the minister
      for European affairs and ownership steering, the minister for foreign trade and
      development, the minister of local government and regional affairs, the minister of
      science and culture, the minister of sport, exercise and youth, the minister of
      economic affairs, and the minister of social security. Each of the seven holds full
      ministerial rank and a seat in the valtioneuvosto, so each adds a cabinet seat and no
      ministry. 12 + 7 = 19; the two numbers are never added together.
    es: >-
      Por qué siete ministros se registran pero no se cuentan. El artículo 4 de la
      valtioneuvostolaki es explícito en que un ministro dirige un ministerio o bien tramita
      asuntos del ámbito de los ministerios («Ministeri toimii ministeriön päällikkönä tai
      käsittelee ministeriöiden toimialaan kuuluvia asioita»), y en que cuando varios
      ministros están nombrados en un mismo ministerio son equiparables entre sí y no
      subordinados. El reparto de funciones del gobierno de 16 de junio de 2026 nombra al
      jefe de cada uno de los doce ministerios y detalla qué tramitan los otros siete
      ministros: el de Asuntos Europeos y Gestión de la Propiedad Estatal, el de Comercio
      Exterior y Desarrollo, la de Administración Local y Regional, la de Ciencia y Cultura,
      el de Deporte y Juventud, el de Economía y la de Seguridad Social. Cada uno de los
      siete tiene rango ministerial pleno y asiento en el valtioneuvosto, por lo que cada uno
      suma un asiento y ningún ministerio. 12 + 7 = 19; las dos cifras nunca se suman.
  - en: >-
      A Finnish minister can serve in more than one ministry, which is why this file records
      ministries and not ministers' portfolios. The division of duties of 16 June 2026 gives
      the minister of local government and regional affairs matters in three ministries —
      Åland affairs in the Ministry of Justice, local and regional administration, public-
      sector ICT, employer and personnel policy and statistics in the Ministry of Finance,
      and urban development in the Ministry of Economic Affairs and Employment — and it
      gives the minister of economic affairs matters in two. It also sends work in the other
      direction: the minister of education handles Nordic cooperation inside the Ministry for
      Foreign Affairs, the minister of the interior handles integration matters inside the
      Ministry of Economic Affairs and Employment, and the minister of the environment and
      climate handles that ministry's energy department. Policy areas below are tagged on the
      ministry that holds the subject matter, not on the ministry whose minister happens to
      handle it.
    es: >-
      Un ministro finlandés puede servir en más de un ministerio, y por eso este fichero
      registra ministerios y no carteras de ministros. El reparto de funciones de 16 de junio
      de 2026 asigna a la ministra de Administración Local y Regional asuntos en tres
      ministerios —los relativos a Åland en el Ministerio de Justicia; la administración local
      y regional, las TIC del sector público, la política de personal y las estadísticas en el
      Ministerio de Finanzas; y el desarrollo urbano en el Ministerio de Economía y Empleo— y
      al ministro de Economía asuntos en dos. También funciona en sentido contrario: el
      ministro de Educación tramita la cooperación nórdica dentro del Ministerio de Asuntos
      Exteriores, la ministra del Interior tramita los asuntos de integración dentro del
      Ministerio de Economía y Empleo, y la ministra de Medio Ambiente y Clima tramita el
      departamento de energía de ese mismo ministerio. Las áreas de política de abajo se
      etiquetan en el ministerio que tiene la materia, no en el ministerio cuyo ministro la
      tramita.
  - en: >-
      The number of ministries has not changed under this cabinet, and cannot change without
      a statute. Section 1 of the valtioneuvostolaki has listed the same twelve ministries
      since 1 December 2017, when the ulkoasiainministeriö became the ulkoministeriö by act
      837/2017; the Act was amended again in 2026 (150/2026), but on the legislative
      evaluation council and government records, not on the list of ministries. This is the
      opposite of the Danish and Dutch arrangements, where a ministry is created or abolished
      by decree and the count moves between elections.
    es: >-
      El número de ministerios no ha cambiado bajo este gobierno, y no puede cambiar sin una
      ley. El artículo 1 de la valtioneuvostolaki enumera los mismos doce ministerios desde el
      1 de diciembre de 2017, cuando el ulkoasiainministeriö pasó a llamarse ulkoministeriö
      por la ley 837/2017; la ley se modificó de nuevo en 2026 (150/2026), pero en lo relativo
      al consejo de evaluación legislativa y a los documentos del gobierno, no a la lista de
      ministerios. Es lo contrario de los casos danés y neerlandés, donde un ministerio se
      crea o suprime por decreto y la cifra se mueve entre elecciones.
  - en: >-
      Officeholders change without the structure changing, and this dataset records the
      structure. Two of the nineteen ministers are not the same people as when the cabinet
      took office in June 2023, and the most recent change was on 16 June 2026, when
      Karoliina Partanen took over as minister of social security while Sanni Grahn-Laasonen
      is on family leave. The ministerial titles, the twelve ministries and both published
      figures are unaffected; the division of duties cited here is the version of 16 June
      2026, which reflects that substitution.
    es: >-
      Los titulares cambian sin que cambie la estructura, y este dataset registra la
      estructura. Dos de los diecinueve ministros no son las mismas personas que cuando el
      gobierno tomó posesión en junio de 2023, y el cambio más reciente es del 16 de junio de
      2026, cuando Karoliina Partanen asumió como ministra de Seguridad Social mientras Sanni
      Grahn-Laasonen está de permiso familiar. Los títulos ministeriales, los doce ministerios
      y las dos cifras publicadas no se ven afectados; el reparto de funciones aquí citado es
      la versión de 16 de junio de 2026, que ya refleja esa sustitución.
  - en: >-
      Perimeter and language. This file describes the central government of the Republic of
      Finland. Åland is an autonomous region with its own government and legislature and is
      out of scope; Åland affairs are a portfolio inside the Ministry of Justice, which is how
      they are recorded. Finland has two national languages, Finnish and Swedish, and every
      ministry has an official Swedish name (statsrådets kansli, utrikesministeriet, and so
      on) which section 1 of the valtioneuvostolaki lists in parallel; `name_original` carries
      the Finnish name only, which is a limitation of the schema rather than a judgement about
      the two languages.
    es: >-
      Perímetro e idioma. Este fichero describe el gobierno central de la República de
      Finlandia. Åland es una región autónoma con su propio gobierno y parlamento y queda
      fuera de alcance; los asuntos de Åland son una cartera dentro del Ministerio de
      Justicia, y así se registran. Finlandia tiene dos lenguas nacionales, el finés y el
      sueco, y todos los ministerios tienen nombre oficial en sueco (statsrådets kansli,
      utrikesministeriet, etc.) que el artículo 1 de la valtioneuvostolaki enumera en
      paralelo; `name_original` recoge sólo el nombre finés, lo que es una limitación del
      esquema y no un juicio sobre las dos lenguas.
  - en: >-
      English ministry names are the Finnish government's own, taken from the English-language
      edition of valtioneuvosto.fi, and marked name_en_provenance: official. The English and
      Spanish titles of the seven ministers who head no ministry, and all Spanish names, are
      this project's renderings and are marked translated.
    es: >-
      Los nombres ingleses de los ministerios son los del propio gobierno finlandés, tomados
      de la edición inglesa de valtioneuvosto.fi, y llevan name_en_provenance: official. Los
      títulos en inglés y español de los siete ministros que no dirigen ministerio, y todos los
      nombres en español, son traducciones de este proyecto y llevan la marca translated.

sources:
  - id: laki-valtioneuvostosta-175-2003
    tier: 1
    type: statute
    publisher: Finlex — Oikeusministeriö
    title: Laki valtioneuvostosta 175/2003 (ajantasainen säädös)
    url: https://www.finlex.fi/fi/laki/ajantasa/2003/20030175/
    archive_url: https://web.archive.org/web/20241216193015/https://www.finlex.fi/fi/laki/ajantasa/2003/20030175/
    lang: fi
    published: 2003-02-28
    accessed: 2026-07-28
    quote: |-
      Valtioneuvostossa on seuraavat ministeriöt:
      1) valtioneuvoston kanslia;
      2) ulkoministeriö;
      3) oikeusministeriö;
      4) sisäministeriö;
      5) puolustusministeriö;
      6) valtiovarainministeriö;
      7) opetus- ja kulttuuriministeriö;
      8) maa- ja metsätalousministeriö;
      9) liikenne- ja viestintäministeriö;
      10) työ- ja elinkeinoministeriö;
      11) sosiaali- ja terveysministeriö;
      12) ympäristöministeriö.
      Valtioneuvoston yhteydessä on oikeuskanslerinvirasto, josta säädetään erikseen.
      Ministeriöiden toimialasta ja asioiden jaosta niiden kesken säädetään lailla tai valtioneuvoston asetuksella.
      Ministeri toimii ministeriön päällikkönä tai käsittelee ministeriöiden toimialaan kuuluvia asioita.
      Työnjaosta ministereiden kesken ministeriössä päättää valtioneuvosto.
      Jokaisella ministerillä on tehtävänsä mukainen nimike, joka vahvistetaan ministeriksi nimittämisen yhteydessä.
    note: >-
      The enumerating instrument, and the reason Finland's ministry count is a legal fact:
      the list of twelve is section 1 of the Act (Valtioneuvoston organisaatio), and adding
      or removing a ministry requires amending it. The quotation reproduces that list in
      order, then the sentence about the office of the Chancellor of Justice that closes
      section 1, then the first sentence of section 2 (which leaves each ministry's remit to
      be set by act or government decree), and then, from section 4 (Ministerit), the three
      sentences that govern how this file is built: a minister either heads a ministry or handles matters within ministries'
      remits, the government decides the division of work between ministers in a ministry,
      and each minister's title follows their duties rather than a department. Item 2 has
      read "ulkoministeriö" since 1 December 2017 (837/2017). Consolidated text as published
      by Finlex; the archived snapshot is from December 2024 and predates the 2026 amendment
      150/2026, which did not touch either quoted section — the live page was read on the
      access date and the quoted text is identical. Finlex's pages are rendered in the
      browser, which is why an older snapshot that captured the text is preferred here to a
      newer one that captured only the shell.

  - id: vn-ministerien-tyonjako-2026-06-16
    tier: 2
    type: government_website
    publisher: Valtioneuvoston kanslia
    title: >-
      Ministerien välinen työnjako valtioneuvostossa ja sen ministeriöissä 16.6.2026
    url: >-
      https://valtioneuvosto.fi/documents/194055633/200124139/Ministereiden_v%C3%A4linen_ty%C3%B6njako_16_6_2026.pdf/3691e2f4-8a6f-c6e1-851e-d35048653d08?t=1781520360189
    archive_url: >-
      https://web.archive.org/web/20260728084705/https://valtioneuvosto.fi/documents/194055633/200124139/Ministereiden_v%C3%A4linen_ty%C3%B6njako_16_6_2026.pdf/3691e2f4-8a6f-c6e1-851e-d35048653d08?t=1781520360189
    lang: fi
    published: 2026-06-16
    accessed: 2026-07-28
    quote: |-
      Valtioneuvostolain 4 §:n mukaisesti ministeri toimii ministeriön päällikkönä tai käsittelee ministeriöiden toimialaan kuuluvia asioita.
      Jos samaan ministeriöön on nimitettyinä useampia ministereitä, he ovat toistensa suhteen rinnasteisia eivätkä alisteisia.
      Pääministeri Orpo toimii valtioneuvoston kanslian päällikkönä
      Ulkoministeri Valtonen toimii ulkoministeriön päällikkönä ja käsittelee muut ulkoministeriön toimialaan kuuluvat asiat.
      Oikeusministeri Meri toimii oikeusministeriön päällikkönä ja käsittelee muut oikeusministeriön toimialaan kuuluvat asiat.
      Sisäministeri Rantanen toimii sisäministeriön päällikkönä ja käsittelee kaikki sisäministeriön toimialaan kuuluvat asiat.
      Puolustusministeri Häkkänen toimii puolustusministeriön päällikkönä ja käsittelee kaikki puolustusministeriön toimialaan kuuluvat asiat.
      Valtiovarainministeri Purra toimii valtiovarainministeriön päällikkönä
      Opetusministeri Adlercreutz toimii opetusministeriön päällikkönä ja käsittelee muut opetus- ja kulttuuriministeriön toimialaan kuuluvat asiat mukaan lukien kirkollisasiat.
      Maa- ja metsätalousministeri Essayah toimii maa- ja metsätalousministeriön päällikkönä ja käsittelee kaikki maa- ja metsätalousministeriön toimialaan kuuluvat asiat.
      Liikenne- ja viestintäministeri Ranne toimii liikenne- ja viestintäministeriön päällikkönä ja käsittelee kaikki liikenne- ja viestintäministeriön toimialaan kuuluvat asiat.
      Työministeri Marttinen toimii työ- ja elinkeinoministeriön päällikkönä
      Sosiaali- ja terveysministeri Rydman toimii sosiaali- ja terveysministeriön päällikkönä ja käsittelee muut sosiaali- ja terveysministeriön toimialaan kuuluvat asiat.
      Ympäristö- ja ilmastoministeri Multala toimii ympäristöministeriön päällikkönä ja käsittelee kaikki ympäristöministeriön toimialaan kuuluvat asiat.
      Eurooppa- ja omistajaohjausministeri Strand käsittelee ne valtioneuvoston EU-sihteeristölle kuuluvat asiat, jotka eivät kuulu pääministerille, sekä valtion omistajaohjausasiat.
      Ulkomaankauppa- ja kehitysministeri Tavio käsittelee kehitysyhteistyötä ja ulkomaankauppaa koskevat asiat.
      Kunta- ja alueministeri Ikonen käsittelee kunta- ja aluehallinnon asiat, työnantaja- henkilöstö- ja hallintopolitiikan asiat, julkisen hallinnon ICT-toiminnot sekä valtiovarain controller -toiminnolle kuuluvat asiat sekä tilastointia koskevat asiat.
      Tiede- ja kulttuuriministeri Talvitie käsittelee korkeakoulu- ja tiedepolitiikan osastolle sekä kulttuuri- ja taidepolitiikan osastolle kuuluvat asiat lukuun ottamatta kirkollisasioita.
      Liikunta-, urheilu- ja nuorisoministeri Poutala käsittelee nuoriso- ja liikuntapolitiikan osastolle kuuluvat asiat ja opintotukiasiat.
      Elinkeinoministeri Puisto käsittelee innovaatiot ja yritysrahoitus -osaston asiat, huoltovarmuuskysymykset sekä muut alueet ja kasvupalvelut -osaston asiat.
      Sosiaaliturvaministeri Partanen käsittelee sosiaaliturva- ja vakuutusosastolle, työ- ja tasa-arvo -osastolle sekä turvallisuus ja terveys -osastolle kuuluvat asiat.
    note: >-
      The government's own division of duties, decided in the valtioneuvosto and published by
      the Prime Minister's Office. It is the instrument that makes the Finnish arithmetic
      checkable: it names the head (päällikkö) of each of the twelve ministries, which is why
      each ministry below carries head_count 1, and it sets out what each of the other seven
      ministers handles, which is why those seven are recorded as entities with a seat and no
      ministry. The quotation takes, in the document's own order, the two general statements
      of principle and then the operative sentence for each of the nineteen ministers,
      abridged where a sentence continues into a list of departments; two head sentences
      (Purra's and Marttinen's) and the Prime Minister's are cut at the päällikkö clause,
      because the remainder enumerates subject areas. The version cited is that of 16 June
      2026, the date of the most recent change of officeholder. Note the document's own
      wording "opetusministeriön päällikkönä" for the head of the opetus- ja
      kulttuuriministeriö.

